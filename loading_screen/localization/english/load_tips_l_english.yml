l_english:
 LOADING_TIP_0: " #T \"If you must break the law, do it to seize power: in all other cases observe it.\"#! \n #tooltip_subheading — Gaius Julius Caesar, Roman Dictator, fl. 50 BCE#!"
 LOADING_TIP_1: " #T \"No friend outdid me in kindness, no enemy in viciousness.\"#! \n #tooltip_subheading — Lucius Cornelius Sulla, Roman dictator, his self-written epitaph, 78 BCE#!"
 LOADING_TIP_2: " #T \"The more corrupt the state, the more numerous the laws.\"#! \n #tooltip_subheading — Publius Cornelius Tacitus, Roman historian, #italic Annals#!, c. 116 CE#!"
 LOADING_TIP_3: " #T \"Fear of the outsider—the strongest bond—united their will, however suspicious and hostile they were to each other.\"#! \n #tooltip_subheading — Titus Livius, Roman historian, #italic Ab Urbe Condita#!, c. 25 BCE#!"
 LOADING_TIP_4: " #T \"Men do not care how nobly they live, but only how long, although it is within reach of every man to live nobly, but within no man's power to live long.\"#! \n #tooltip_subheading — Lucius Annaeus Seneca, Roman philosopher, #italic Moral Letters to Lucilius#!, c. 64 CE#!"
 LOADING_TIP_5: " #T \"Moreover, I consider that Carthage must be destroyed!\"#! \n #tooltip_subheading — Marcus Porcius Cato, Roman senator, closing his every speech in the Senate, c. 150 BCE#!"
 LOADING_TIP_6: " #T \"To practice morality is meritorious; but what does morality include? It includes few sins, many virtuous deeds, compassion, liberality, truthfulness, and purity.\"#! \n #tooltip_subheading — Ashoka, Mauryan Emperor, #italic Pillar Edict II#!, c. 243 BCE#!"
 LOADING_TIP_7: " #T \"Even if the skies were shorter than my knees, I would not kneel.\"#! \n #tooltip_subheading — Attributed to Kurush II 'the Great', King of Persia, fl. 550 BCE#!"
 LOADING_TIP_8: " #T \"Let the die be cast!\"#! \n #tooltip_subheading — Gaius Julius Caesar, crossing the Rubicon into Italy, possibly quoting Menander, 49 BCE#!"
 LOADING_TIP_9: " #T \"Words give wings to the mind and make a man soar to heaven.\"#! \n #tooltip_subheading — Aristophanes, Athenian playwright, #italic The Birds#!, 414 BCE#!"
 LOADING_TIP_10: " #T \"Every ruler must remember three things. Firstly, that he rules men; secondly, that he rules according to the laws; and thirdly, that he does not rule forever.\"#! \n #tooltip_subheading — Agathon, Athenian tragedian, fl. 416 BCE#!"
 LOADING_TIP_11: " #T \"I am Cyrus, who won the Persians their empire. Do not, therefore, begrudge me this bit of earth that covers my bones.\"#! \n #tooltip_subheading — Inscription on the tomb of Kurush II 'the Great' at Pasargadae, as read by Alexander, 324 BCE#!"
 LOADING_TIP_12: " #T \"Be more ready to visit friends in adversity than in prosperity.\"#! \n #tooltip_subheading — Chilon of Sparta, ephor and one of the Seven Sages, fl. 556 BCE#!"
 LOADING_TIP_13: " #T \"In the human body, as in the Empire, the most serious illness spreads from the head.\"#! \n #tooltip_subheading — Pliny the Younger, Roman senator, #italic Letters#!, c. 105 CE#!"
 LOADING_TIP_14: " #T \"A shipwreck victim shudders even at a calm sea.\"#! \n #tooltip_subheading — Publius Ovidius Naso, Roman poet, in exile at Tomis, #italic Letters from Pontus#!, c. 13 CE#!"
 LOADING_TIP_15: " #T \"A journey of a thousand miles begins with a single step.\"#! \n #tooltip_subheading — Laozi, Chinese philosopher, #italic Dao De Jing#!, c. 400 BCE#!"
 LOADING_TIP_16: " #T \"Those who wish to appear wise among fools, among the wise seem foolish.\"#! \n #tooltip_subheading — Marcus Fabius Quintilianus, Roman rhetorician, #italic Institutes of Oratory#!, c. 95 CE#!"
 LOADING_TIP_17: " #T \"The Son of Heaven is merely he who has the mightiest armies and strongest horses; what else makes a lineage?\"#! \n #tooltip_subheading — An Chongrong, Later Jin military governor of Chengde, c. 941 CE#!"
 LOADING_TIP_18: " #T \"'I have no time,' said Demetrius. 'Then don't be king!' screamed the old woman.\"#! \n #tooltip_subheading — Plutarch, #italic Life of Demetrius#!, on Demetrius Poliorcetes as King of Macedon, c. 290 BCE#!"
 LOADING_TIP_19: " #T \"But when we have got everything subject to us, what are we going to do?\"#! \n #tooltip_subheading — Cineas, advisor to King Pyrrhus of Epirus, as told by Plutarch, c. 281 BCE#!"
 LOADING_TIP_20: " #T \"My friends, what a wrestling ground for Carthaginians and Romans we are leaving behind us!\"#! \n #tooltip_subheading — Pyrrhus, King of Epirus, on departing Sicily, 276 BCE#!"
 LOADING_TIP_21: " #T \"If a man kills one person, he is called a criminal and put to death; yet if a state attacks another and slaughters multitudes, men praise it as righteous.\"#! \n #tooltip_subheading — Mozi, Chinese philosopher, #italic Against Offensive War#!, c. 430 BCE#!"
 LOADING_TIP_22: " #T \"Be off, my dear Sirs, and take these speeches with you, for I was not sent to Athens by the Romans to learn its history, but to subdue its rebels.\"#! \n #tooltip_subheading — Lucius Cornelius Sulla, to the Athenian envoys during the siege of Athens, 86 BCE#!"
 LOADING_TIP_23: " #T \"A fine shield, young sir; but it is more fitting that a Roman rest his hopes in his right hand rather than in his left.\"#! \n #tooltip_subheading — Publius Cornelius Scipio Aemilianus, Roman general, fl. 140 BCE#!"
 LOADING_TIP_24: " #T \"The Romans are a nation who know not how to remain quiet under defeat. Whatever disgrace this present extremity burns into their souls will rankle there for ever and will allow them no rest till they have made you pay for it many times over.\"#! \n #tooltip_subheading — Herennius Pontius, to his son Gaius Pontius after the Caudine Forks, as told by Livy, 321 BCE#!"
 LOADING_TIP_25: " #T \"Wicked men, are you sinning against your fathers, who conquered the whole world under Philip and Alexander?\"#! \n #tooltip_subheading — Antigenes, general of the Argyraspides, at the battle of Gabiene, 316 BCE#!"
 LOADING_TIP_26: " #T \"I advise you either to conquer yourselves or else to side with the conqueror.\"#! \n #tooltip_subheading — Phocion, Athenian general and statesman, as told by Plutarch, fl. 340 BCE#!"
 LOADING_TIP_27: " #T \"Even if I accomplish nothing else, I may at least blunt an enemy's sword.\"#! \n #tooltip_subheading — Spartan saying, as told by Plutarch, #italic Sayings of Spartans#!, c. 100 CE#!"
 LOADING_TIP_28: " #T \"Now hath pride and rebuke gotten strength, and the time of destruction, and the wrath of indignation: now therefore, my sons, be ye zealous for the law, and give your lives for the covenant of your fathers.\"#! \n #tooltip_subheading — Mattathias, leader of the Maccabean Revolt, on his deathbed, #italic 1 Maccabees#!, 166 BCE#!"
 LOADING_TIP_29: " #T \"Mount Tai does not refuse the smallest clod of earth, and so it grows tall; the rivers and seas do not turn away the smallest stream, and so they grow deep.\"#! \n #tooltip_subheading — Li Si, Qin minister, #italic Memorial on the Expulsion of Foreign Advisors#!, 237 BCE#!"
 LOADING_TIP_30: " #T \"If you do not enter the tiger's den, you will not catch its cubs.\"#! \n #tooltip_subheading — Ban Chao, Han general and later Protector-General of the Western Regions, at Shanshan, 73 CE#!"
 LOADING_TIP_31: " #T \"Whoever honors his own faith and disparages that of others, thinking to glorify his own, does the gravest injury to his own.\"#! \n #tooltip_subheading — Ashoka, Mauryan Emperor, #italic Rock Edict XII#!, c. 256 BCE#!"
 LOADING_TIP_32: " #T \"The source from which existing things derive their existence is also that to which they return at their destruction.\"#! \n #tooltip_subheading — Anaximander of Miletus, Ionian philosopher, c. 550 BCE#!"
 LOADING_TIP_33: " #T \"A city for sale, and doomed to quick destruction, if it should find a buyer!\"#! \n #tooltip_subheading — Jugurtha, King of Numidia, on leaving Rome, as told by Sallust, 111 BCE#!"
 LOADING_TIP_34: " #T \"To navigate is necessary, to live is not.\"#! \n #tooltip_subheading — Gnaeus Pompeius Magnus, setting sail in a storm with Rome's grain fleet, c. 56 BCE#!"
 LOADING_TIP_35: " #T \"Give me a place to stand, and I will move the earth.\"#! \n #tooltip_subheading — Archimedes of Syracuse, mathematician, c. 250 BCE#!"
 LOADING_TIP_36: " #T \"I ask you not to disturb that sand!\"#! \n #tooltip_subheading — Archimedes of Syracuse, his last words, to the Roman soldier who found him drawing circles, 212 BCE#!"
 LOADING_TIP_37: " #T \"We must conquer or die. That is what a woman's resolve is; as for men, they may live and be slaves.\"#! \n #tooltip_subheading — Boudica, Queen of the Iceni, before her final battle, as told by Tacitus, 61 CE#!"
 LOADING_TIP_38: " #T \"Too many for an embassy, too few for an army.\"#! \n #tooltip_subheading — Tigranes II 'the Great', King of Armenia, on first sighting Lucullus' army at Tigranocerta, as told by Plutarch, 69 BCE#!"
 LOADING_TIP_39: " #T \"To ravage, to slaughter, to usurp under false titles, they call empire; and where they make a desert, they call it peace.\"#! \n #tooltip_subheading — Calgacus, Caledonian chieftain, on the Romans, as given by Tacitus, c. 83 CE#!"
 LOADING_TIP_40: " #T \"A man that runs away may fight again.\"#! \n #tooltip_subheading — Menander, Athenian comic playwright, c. 300 BCE#!"
 LOADING_TIP_41: " #T \"He whom the gods love dies young.\"#! \n #tooltip_subheading — Menander, Athenian comic playwright, #italic The Double Deceiver#!, c. 300 BCE#!"
 LOADING_TIP_42: " #T \"Consider that nothing in human life is stable; for then you will not exult overmuch in prosperity, nor grieve overmuch in adversity.\"#! \n #tooltip_subheading — Isocrates, Athenian rhetorician, #italic To Demonicus#!, c. 370 BCE#!"
 LOADING_TIP_43: " #T \"Had I conquered you, I would have ranked myself above Alexander, above Pyrrhus, above all other generals.\"#! \n #tooltip_subheading — Hannibal Barca, to Scipio Africanus at Ephesus, as told by Livy, 193 BCE#!"
 LOADING_TIP_44: " #T \"The Spartans grant permission to the Chians to be filthy.\"#! \n #tooltip_subheading — Proclamation of the Spartan ephors, as told by Plutarch, #italic Sayings of Spartans#!, c. 100 CE#!"
 LOADING_TIP_45: " #T \"Heaven never helps the man who will not act.\"#! \n #tooltip_subheading — Sophocles, Athenian tragedian, fl. 440 BCE#!"
 LOADING_TIP_46: " #T \"No one had ever made war upon him without being destroyed. Let Caesar come and learn what unconquered Germans, trained in arms, can do.\"#! \n #tooltip_subheading — Ariovistus, King of the Suebi, as told by Caesar, #italic Commentaries on the Gallic War#!, 58 BCE#!"
 LOADING_TIP_47: " #T \"As a lion, the king of beasts, when put in a cage, though it were of gold, is still facing outside, even so do I live as master in the house but remain facing outside.\"#! \n #tooltip_subheading — Milinda (Menander I Soter), Indo-Greek King, #italic The Questions of Milinda#!, c. 150 BCE#!"
 LOADING_TIP_48: " #T \"I am human: I consider nothing human alien to me.\"#! \n #tooltip_subheading — Publius Terentius Afer, Roman playwright, #italic The Self-Tormentor#!, 163 BCE#!"
 LOADING_TIP_49: " #T \"Soft is the tongue of a king, yet it breaks a dragon's ribs.\"#! \n #tooltip_subheading — #italic The Words of Ahiqar#!, Aramaic papyrus from Elephantine, c. 400 BCE#!"
 LOADING_TIP_50: " #T \"As we speak, cruel time is fleeing. Seize the day, believing as little as possible in the morrow.\"#! \n #tooltip_subheading — Quintus Horatius Flaccus, Roman poet, #italic Odes#!, 23 BCE#!"
 LOADING_TIP_51: " #T \"Conquered Greece took captive her savage conqueror and brought the arts into rustic Latium.\"#! \n #tooltip_subheading — Quintus Horatius Flaccus, Roman poet, #italic Epistles#!, c. 12 BCE#!"
 LOADING_TIP_52: " #T \"Ah! The Generals! They are numerous, but not good for much!\"#! \n #tooltip_subheading — Aristophanes, Athenian playwright, #italic The Acharnians#!, 425 BCE#!"
 LOADING_TIP_53: " #T \"We must look beneath every stone, lest it conceal some orator ready to sting us.\"#! \n #tooltip_subheading — Aristophanes, Athenian playwright, #italic Thesmophoriazusae#!, 411 BCE#!"
 LOADING_TIP_54: " #T \"He gains wisdom in a happy way, who gains it by another's experience.\"#! \n #tooltip_subheading — Titus Maccius Plautus, Roman playwright, #italic The Merchant#!, c. 200 BCE#!"
 LOADING_TIP_55: " #T \"O walls, you have held up so much tedious graffiti that I am amazed that you have not already collapsed in ruin.\"#! \n #tooltip_subheading — Graffito from Pompeii, before 79 CE#!"
 LOADING_TIP_56: " #T \"If only similar swindling would dupe you, innkeeper: you sell water, and drink the undiluted wine yourself.\"#! \n #tooltip_subheading — Graffito from Pompeii, before 79 CE#!"
 LOADING_TIP_57: " #T \"I now make the only true statement you are to expect—that I am a liar.\"#! \n #tooltip_subheading — Lucian of Samosata, Syrian satirist, #italic A True Story#!, c. 170 CE#!"
 LOADING_TIP_58: " #T \"Caesar, husband of every wife, and wife of every husband!\"#! \n #tooltip_subheading — Gaius Scribonius Curio the Elder, Roman senator, as recorded by Suetonius, fl. 60 BCE#!"
 LOADING_TIP_59: " #T \"So why wouldn't everything be well and happy for you?\nYou are without sweat, spit, snot or runny nose.\"#! \n #tooltip_subheading — Gaius Valerius Catullus, Roman poet, to Furius, c. 55 BCE#!"
 #
 LOADING_TIP_d008_0: " #T \"What is hateful to you, do not do to your neighbor. That is the whole Torah; the rest is commentary. Go and learn.\"#! \n #tooltip_subheading — Hillel the Elder, Jewish sage, in the #italic Babylonian Talmud#! (Shabbat 31a), fl. 10 BCE#!"
 LOADING_TIP_d008_1: " #T \"Wine and women lead the wise astray.\"#! \n #tooltip_subheading — Ben Sira, Jerusalem scribe, #italic Wisdom of Sirach#! 19:2, c. 180 BCE#!"
 LOADING_TIP_d008_2: " #T \"I am mighty Time, destroyer of the worlds, come here to annihilate them. Even without you, none of the warriors in the opposing armies shall live.\"#! \n #tooltip_subheading — Krishna to Arjuna, #italic Bhagavad Gita#! 11.32, c. 200 BCE#!"
 LOADING_TIP_d008_3: " #T \"All speech without action appears vain and idle, but especially that of our commonwealth; as the more we are thought to excel therein, the more is our speaking distrusted by all.\"#! \n #tooltip_subheading — Demosthenes, Athenian orator, #italic Second Olynthiac#!, 349 BCE#!"
