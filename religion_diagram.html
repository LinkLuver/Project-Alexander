  for (const [txt, col, dash] of extra) {
    const it = document.createElement('div'); it.className = 'item'; it.style.gridColumn = '1 / 3';
    const s = document.createElementNS(SVGNS, 'svg'); s.setAttribute('width', 34); s.setAttribute('height', 22);
    const sh = shapeEl('ellipse', 17, 11, 30, 18); sh.setAttribute('fill', 'none'); sh.setAttribute('stroke', col); sh.setAttribute('stroke-width', 1.6); sh.setAttribute('stroke-dasharray', dash);
    s.append(sh); it.append(s, txt); box.append(it);
  }
}
function rels() {
  const box = $('rels'); box.innerHTML = '';
  const counts = {}; DATA.ops.forEach(o => counts[o[2]] = (counts[o[2]] || 0) + 1);
  for (const r in RELS) {
    if (r === 'invalid' && !counts.invalid) continue;
    const lab = document.createElement('label'); lab.className = 'rel';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = state.relOn[r];
    cb.onchange = () => { state.relOn[r] = cb.checked; refresh(); };
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.borderColor = RELS[r].color; sw.style.color = RELS[r].color;
    lab.append(cb, sw, `${RELS[r].label} (${counts[r] || 0})`); box.append(lab);
  }
}
function refresh() { if (state.overview) overview(); else go(state.focus, false); }
$('ext').onchange = e => { state.ext = e.target.checked; refresh(); };
$('keys').onchange = e => { state.keys = e.target.checked; refresh(); };
function problems() {
  const ul = $('probList'); ul.innerHTML = '';
  $('probsTitle').textContent = `Problems found in the scripts (${DATA.problems.length})`;
  for (const [id, msg] of DATA.problems) {
    const li = document.createElement('li'); const a = document.createElement('a'); a.textContent = N[id] ? N[id][1] : id; a.onclick = () => go(id);
    li.append(a, ': ' + msg); ul.append(li);
  }
  if (!DATA.problems.length) ul.innerHTML = '<li>None.</li>';
}

// ---------------------------------------------------------------- start
(function init() {
  const count = t => byType(t).filter(id => !N[id][5]).length;
  $('title').textContent = KIND === 'culture' ? 'Project Alexander — Cultures & Languages' : 'Project Alexander — Religions';
  $('stats').textContent = (KIND === 'culture'
    ? `${count('c').toLocaleString()} cultures · ${count('cg')} culture groups · ${count('l')} languages · ${count('d')} dialects · ${count('lf')} language families`
    : `${count('r')} religions · ${count('rg')} religion groups`) + ` · generated ${DATA.generated}`;
  $('extLabel').textContent = KIND === 'culture' ? 'In group views, also show outside cultures with opinions (a single culture always shows them)' : 'In group views, also show outside religions with opinions (a single religion always shows them)';
  $('listTitle').textContent = 'Browse';
  tabs(); list(); legend(); rels(); problems();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'overview' && KIND === 'religion') overview();
  else go(N[h] ? h : (N[DEFAULT] ? DEFAULT : byType(GROUP)[0]), false);
  window.addEventListener('hashchange', () => { const x = decodeURIComponent(location.hash.slice(1)); if (x === 'overview') overview(); else if (N[x] && x !== state.focus) go(x, false); });
})();
</script>
