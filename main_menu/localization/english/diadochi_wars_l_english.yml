l_english:
 diadochi_wars: "Wars of the Successors"
 diadochi_wars_desc: "The death of Alexander left his generals and their kingdoms competing for the lands of his empire. Macedonia, Thrace, the Antigonids, the Ptolemies, and the Seleucids each lead a league of allies. These leagues contest the former imperial territories through diplomacy, rival claims, and war."
 diadochi_tension_label: "Successor Wars Tension"
 diadochi_tension_explain_tt: "Measures how close the successor kingdoms are to open conflict. Rising tension makes league leaders more aggressive. At 75 tension, leagues automatically call eligible members into defensive wars."
 diadochi_tension_25: "25%"
 diadochi_tension_50: "50%"
 diadochi_tension_75: "75%"
 diadochi_tension_100: "100%"
 diadochi_tension_25_tt: "#T 25 Tension#!\nThe struggle over Alexander's empire is intensifying."
 diadochi_tension_50_tt: "#T 50 Tension#!\nThe successor kingdoms are drawing closer to open conflict."
 diadochi_tension_75_tt: "#T 75 Tension#!\nLeagues automatically call eligible members into defensive wars."
 diadochi_tension_100_tt: "#T 100 Tension#!\nTension has reached its maximum."
 diadochi_league_m: "Macedonian League"
 diadochi_league_m_desc: "A coalition led by the Antipatrid kings of Macedonia, seeking influence over the Greek world and Alexander's European dominions."
 diadochi_league_t: "Thracian League"
 diadochi_league_t_desc: "A coalition led by Lysimachus and the kings of Thrace, seeking to expand its influence across Asia Minor and the former empire."
 diadochi_league_a: "Antigonid League"
 diadochi_league_a_desc: "A coalition led by the Antigonid dynasty, claiming Alexander's legacy and contesting the other successor kingdoms."
 diadochi_league_e: "Ptolemaic League"
 diadochi_league_e_desc: "A coalition led by the Ptolemies of Egypt, seeking to protect and extend their power across the eastern Mediterranean and former imperial lands."
 diadochi_league_s: "Seleucid League"
 diadochi_league_s_desc: "A coalition led by the Seleucids, asserting their authority over the eastern territories of Alexander's empire."
 IO_LOCATIONS_IN_ALEXANDERS_EMPIRE: "Locations in Alexander's former empire"
 DIADOCHI_EMPIRE_OUTLINE_LEGEND: "Alexander's former empire"
 claim_diadochi: "Claim Successor Territory"
 claim_diadochi_no_targets: "No eligible neighboring successor territory can be claimed."
 intervene_in_diadochi_war: "Intervene in a Successor War"
 intervene_in_diadochi_war_desc: "Join one side of an ongoing war between the successor leagues once tensions have reached 75."
 intervene_in_diadochi_war_select_war: "Choose a successor war to join."
 intervene_in_diadochi_war_no_wars: "There are no eligible wars involving a successor league."
 intervene_in_diadochi_war_select_side: "Choose which war leader to support."
 intervene_in_diadochi_war_no_sides: "Neither side of this war can be joined."
