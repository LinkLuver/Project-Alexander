 # trade_good_events.txt
 trade_good_events.1.t: "Myrrh of Qana"
 trade_good_events.1.desc: "Under our leadership, the myrrh trade in Qana has grown dramatically, exceeding our already lofty expectations for the province. But this next bit of unexpected news will please you, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]; flush with cash and ample supplies, the leading traders from Qana have set up workshops in a neighboring province. It appears that the myrrh industry is spreading organically."
 trade_good_events.1.a: "People flock to Qana, seeking to learn our trade"
 trade_good_events.1.b: "Tell everyone who is responsible for this - me"
 trade_good_events.1.c: "Be sure to collect what we are owed"
 STATIC_MODIFIER_NAME_trade_winds_migrants_smod: "Maritime Influx"
 STATIC_MODIFIER_NAME_trade_winds_good: "Trade Winds"
