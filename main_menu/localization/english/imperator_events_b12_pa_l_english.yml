l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b12 (2026-10-13)

 # Used by the desecration events (batch b20 pilot)
 STATIC_MODIFIER_NAME_upset_local_priests: "Agitated Local Priesthood"
 #P:A TODO No EU5 equivalent: Imperator named the religion and the deity ([provincial_deity.GetReligion.GetName], [provincial_deity.GetName]); EU5 locations have no patron deity, so the text is generic
 desecration_opinion: "#R Countries of the local god's religion#! may take offense, as the god belongs to their faith."

 # dhe/dhe_slave.txt
 dhe_slave.1.t: "Incendiary Slave Speaks in [incendiary_slave_city_scope.GetName]"
 dhe_slave.1.desc: "A hot-headed slave with a talent for oration, by the name of [incendiary_slave_scope.GetShortName], has been stirring up his fellow bondsmen in the [incendiary_slave_city_scope.Custom('pa_imp_get_city_type_loc')] of [incendiary_slave_city_scope.GetName]. The local authorities have so far managed to keep the situation under control, but the brazen fool continues to hold forth on the corruption and unfairness of the political system, with [incendiary_slave_ruler.GetName] receiving honorable mentions...\n\nThe slave population of the entire province of [incendiary_slave_city_scope.GetProvince.GetName] has by now heard of his exploits, and the city elites and slave owners are demanding immediate action to ensure the status quo is not disturbed further and any slave rebellion is crushed before it can be allowed to foment..."
 dhe_slave.1.a: "Round up the troublemaker and his supporters, and crucify them."
 dhe_slave.1.b: "Divide the group and deal with the leader."
 dhe_slave.1.c: "This [incendiary_slave_scope.GetShortName] could be useful..."
 dhe_slave.1.ct: "A #T Silver Tongued#! character named [incendiary_slave_scope.GetName] will appear."
 dhe_slave.1.d: "What of it?"
 STATIC_MODIFIER_NAME_ex_slave_cmod: "Former Slave"
 STATIC_MODIFIER_NAME_dhe_slave_incendiary_killed_sm: "Slave Movement Crushed"
 STATIC_MODIFIER_NAME_dhe_slave_incendiary_divided_sm: "Slave Movement Undermined"
 STATIC_MODIFIER_NAME_dhe_slave_incendiary_promoted_sm: "Slave Leader Promoted"
 STATIC_MODIFIER_NAME_dhe_slave_incendiary_unchecked_sm: "Slave Movement Unchecked"
 dhe_slave.2.t: "Excellent Conditions in [excellent_conditions_city_scope.GetName]"
 dhe_slave.2.desc: "Whether by happy coincidence, the blessings of [ROOT.GetCountry.Custom('pa_imp_get_fortune_goddess')], or just diligent management, for the past year production in the [excellent_conditions_city_scope.Custom('pa_imp_get_city_type_loc')] of [excellent_conditions_city_scope.GetName] has far surpassed the predictions of local bureaucrats and administrators.\n\nWhile we could simply exploit these boons for short term gain, some have suggested that this is an opportunity to study the organization of slaves in [excellent_conditions_city_scope.GetName], who by all accounts are an unusually satisfied and productive bunch, and attempt to apply the lessons across the province of [excellent_conditions_city_scope.GetProvince.GetName]. Alternatively, we could of course simply allow whatever fortune [excellent_conditions_city_scope.GetName] enjoys to run its natural course without interference."
 dhe_slave.2.a: "Make the most of this stroke of good fortune."
 dhe_slave.2.b: "We can apply these lessons across the province."
 dhe_slave.2.c: "They have it under control."
 dhe_slave.2.d: "The [ROOT.GetCountry.GetGovernment.GetRulerTitle] will oversee this matter personally..."
 STATIC_MODIFIER_NAME_dhe_slave_conditions_lessons_sm: "Lessons Learned"
 STATIC_MODIFIER_NAME_dhe_slave_conditions_autonomy_pm: "Benign Autonomy"
 get_fortuna: "Fortuna"
 get_nortia: "Nortia"
 get_tyche: "Tyche"
 get_fortune_goddess_default: "the Goddess of Fortune"
