 # Imperator (Invictus / Terra Indomita) event import, batch b12 (2026-10-13)

 # Used by the desecration events (batch b20 pilot)
 STATIC_MODIFIER_NAME_upset_local_priests: "Agitated Local Priesthood"
 #P:A TODO No EU5 equivalent: Imperator named the religion and the deity ([provincial_deity.GetReligion.GetName], [provincial_deity.GetName]); EU5 locations have no patron deity, so the text is generic
 desecration_opinion: "#R Countries of the local god's religion#! may take offense, as the god belongs to their faith."

 # dhe/dhe_slave.txt
 dhe_slave.1.t: "Incendiary Slave Speaks in [incendiary_slave_city_scope.GetName]"
 dhe_slave.1.desc: "A hot-headed slave with a talent for oration, by the name of [incendiary_slave_scope.GetShortName], has been stirring up his fellow bondsmen in the [incendiary_slave_city_scope.Custom('pa_imp_get_city_type_loc')] of [incendiary_slave_city_scope.GetName]. The local authorities have so far managed to keep the situation under control, but the brazen fool continues to hold forth on the corruption and unfairness of the political system, with [incendiary_slave_ruler.GetName] receiving honorable mentions...\n\nThe slave population of the entire province of [incendiary_slave_city_scope.GetProvince.GetName] has by now heard of his exploits, and the city elites and slave owners are demanding immediate action to ensure the status quo is not disturbed further and any slave rebellion is crushed before it can be allowed to foment..."
 dhe_slave.1.a: "Round up the troublemaker and his supporters, and crucify them."
 dhe_slave.1.b: "Divide the group and deal with the leader."
 dhe_slave.1.c: "This [incendiary_slave_scope.GetShortName] could be useful..."
 dhe_slave.1.ct: "A #T Silver Tongued#! character named [incendiary_slave_scope.GetName] will appear."
 dhe_slave.1.d: "What of it?"
 STATIC_MODIFIER_NAME_ex_slave_cmod: "Former Slave"
 STATIC_MODIFIER_NAME_dhe_slave_incendiary_killed_sm: "Slave Movement Crushed"
 STATIC_MODIFIER_NAME_dhe_slave_incendiary_divided_sm: "Slave Movement Undermined"
 STATIC_MODIFIER_NAME_dhe_slave_incendiary_promoted_sm: "Slave Leader Promoted"
 STATIC_MODIFIER_NAME_dhe_slave_incendiary_unchecked_sm: "Slave Movement Unchecked"
 dhe_slave.2.t: "Excellent Conditions in [excellent_conditions_city_scope.GetName]"
 dhe_slave.2.desc: "Whether by happy coincidence, the blessings of [ROOT.GetCountry.Custom('pa_imp_get_fortune_goddess')], or just diligent management, for the past year production in the [excellent_conditions_city_scope.Custom('pa_imp_get_city_type_loc')] of [excellent_conditions_city_scope.GetName] has far surpassed the predictions of local bureaucrats and administrators.\n\nWhile we could simply exploit these boons for short term gain, some have suggested that this is an opportunity to study the organization of slaves in [excellent_conditions_city_scope.GetName], who by all accounts are an unusually satisfied and productive bunch, and attempt to apply the lessons across the province of [excellent_conditions_city_scope.GetProvince.GetName]. Alternatively, we could of course simply allow whatever fortune [excellent_conditions_city_scope.GetName] enjoys to run its natural course without interference."
 dhe_slave.2.a: "Make the most of this stroke of good fortune."
 dhe_slave.2.b: "We can apply these lessons across the province."
 dhe_slave.2.c: "They have it under control."
 dhe_slave.2.d: "The [ROOT.GetCountry.GetGovernment.GetRulerTitle] will oversee this matter personally..."
 STATIC_MODIFIER_NAME_dhe_slave_conditions_lessons_sm: "Lessons Learned"
 STATIC_MODIFIER_NAME_dhe_slave_conditions_autonomy_pm: "Benign Autonomy"
 get_fortuna: "Fortuna"
 get_nortia: "Nortia"
 get_tyche: "Tyche"
 get_fortune_goddess_default: "the Goddess of Fortune"

 dhe_slave.3.t: "[dhe_slave_politician_scope.GetShortName] the Slave"
 dhe_slave.3.desc: "For the last few days the dark corners of the senate house have been abuzz with the whispers of huddled relics resembling senators. An ambitious freedman of the Libertini has managed to make his way from the alleys of [dhe_slave_politician_birthplace_scope.GetName] to the assembly in [ROOT.GetCountry.GetCapital.GetName], winning local elections with wide popular support.\n\nWhether [dhe_slave_politician_scope.GetHerHis] success can be attributed to merit or more nefarious means has been a hot topic among his detractors, but in any case, [dhe_slave_politician_scope.GetShortName] and [dhe_slave_politician_scope.GetHerHis] supporters are demanding [dhe_slave_politician_scope.GetSheHe] be granted an office befitting [dhe_slave_politician_scope.GetHerHis] talents.\n\nNaturally, the more traditional members of the house are loath to tolerate his presence at all, and feel the promotion of former slaves demeans their nobility, such as it is..."
 dhe_slave.3.a: "[dhe_slave_politician_scope.GetSheHe|U] will go further yet..."
 #P:A TODO EU5 has no republican offices: pa_imp_republic_job_giver_effect gives nothing, so dhe_slave.3.at and dhe_slave.3.ct promise an office that is never granted
 dhe_slave.3.at: "[dhe_slave_politician_scope.GetName] will be given an #Y Office#! suiting [dhe_slave_politician_scope.GetHerHis] abilities."
 dhe_slave.3.b: "We should not tolerate slaves on the senate floor!"
 dhe_slave.3.c: "Interfere in politics? Never."
 dhe_slave.3.ct: "[dhe_slave_politician_scope.GetName] has a chance to gain an #Y Office#! suiting [dhe_slave_politician_scope.GetHerHis] abilities."
 dhe_slave.3.d: "This situation is very easily solved..."
 dhe_slave.3.dt1: "[dhe_slave_politician_scope.GetName] will disappear."
 dhe_slave.3.dt2: "This option is available due to your ruler's #Y questionable character#!."
 STATIC_MODIFIER_NAME_dhe_slave_supported_cm: "Ex-Slave Politician Supported"
 STATIC_MODIFIER_NAME_dhe_slave_scuppered_cm: "Ex-Slave Politician Scuppered"

 dhe_slave.4.t: "Accident in [dhe_slave_accident_city_scope.GetName]"
 dhe_slave.4.desc: "We have been told of a major industrial accident at the extensive works in the vicinity of [dhe_slave_accident_city_scope.GetName], in [dhe_slave_accident_city_scope.GetProvince.GetName]. [dhe_slave_accident_city_scope.GetRawMaterial.GetName] is the main export of the city, and it seems the knuckleheads in charge of the site allowed parts of the structural supports to fall into neglect as they tried to keep up with high demand.\n\nA huge collapse all but wiped out the working shift of slaves, and the owners have come groveling to the provincial authorities for compensation to help with re-establishing production. The slaves themselves are none too happy with the loss of their friends and family, and naturally cagey about returning to work in such conditions.\n\nWithout significant repairs there is no way production can be maintained at anywhere near the previous levels, and the slaves are bound to cause problems without a show of good will."
 dhe_slave.4.a: "Compensate the owners and ensure decent working conditions."
 dhe_slave.4.b: "We will only cover the repair costs."
 dhe_slave.4.c: "There will be no handouts."
 dhe_slave.4.d: "For pity's sake, seize their property and compensate the slaves!"
 dhe_slave.4.dt: "This option is available due to your ruler's #Y good character#!."
 STATIC_MODIFIER_NAME_dhe_slave_accident_compensate_owners_sm: "Accident Compensation"
 STATIC_MODIFIER_NAME_dhe_slave_accident_compensate_slaves_sm: "Slave Justice"
 STATIC_MODIFIER_NAME_dhe_slave_accident_inaction_city_pm: "Industrial Accident"
 STATIC_MODIFIER_NAME_dhe_slave_accident_inaction_province_sm: "Slaves Aggravated"
 STATIC_MODIFIER_NAME_dhe_slave_accident_repair_sm: "Slaves Ignored"

 dhe_slave.5.t: "Harsh Treatment in [dhe_slave_harsh_treatment_city_scope.GetName]"
 dhe_slave.5.desc: "The [dhe_slave_harsh_treatment_city_scope.Custom('pa_imp_get_city_type_loc')] of [dhe_slave_harsh_treatment_city_scope.GetName] has been at the center of growing tensions across the province of [dhe_slave_harsh_treatment_city_scope.GetProvince.GetName] caused by the harsh treatment of slaves in pursuit of higher profits. There are reports of pitiful living standards with workers commonly provided with only the bare minimum of food and shelter to ensure their survival and productivity, and unduly harsh treatment and punishments at the slightest excuse of their masters.\n\nTo add injury, members of the senate led by [dhe_slave_populist_politican.GetName] have taken this issue up as a personal campaign for slave treatment reform, seeking to win the approval of freedmen and pass legislation that will upset the slave owners across the country.\n\nThe balance between populism and sound government is a path that must be walked most carefully..."
 dhe_slave.5.a: "This must not be allowed to continue."
 dhe_slave.5.b: "They will get used to the way the world works..."
 dhe_slave.5.c: "The situation seems to be under control."
 STATIC_MODIFIER_NAME_dhe_slave_harsh_inaction_cm: "Harsh Treatment Ignored"
 STATIC_MODIFIER_NAME_dhe_slave_harsh_reform_cm: "Harsh Treatment Reform"
 STATIC_MODIFIER_NAME_dhe_slave_harsh_corrupt_cm: "Harsh Treatment Endorsed"

 dhe_slave.6.t: "Debt Bondage Scandal"
 dhe_slave.6.desc: "While slaves are an important part of the economy and social structure of [ROOT.GetCountry.GetName], the sheer number of slaves as a proportion of society has become something of a concern. Some argue that the number of bondsmen, bolstered by our strict manumission policies and the growing practice of debt bondage, must be countered to ensure there are enough freedmen to support our military and small holdings.\n\n[debt_reformer_scope.GetName] has been in favor of debt bondage reform for some time, no doubt for [debt_reformer_scope.GetHerHis] own political motives. [debt_supporter_scope.GetName], on the other hand, is a particularly outspoken supporter of debt bondage, arguing that debtors must not be allowed to escape repaying what is owed nor become a drain on the state through imprisonment.\n\nWe can either exploit this opportunity to redress the growth of the slave population or support the interests of slave holders."
 dhe_slave.6.a: "We have enough slaves, we need freemen!"
 #P:A TODO Approximate: Imperator promoted 1 slave pop per city; EU5 moves 1 thousand slaves into a new peasants pop (text adjusted)
 dhe_slave.6.at: "The government will sponsor the manumission of slaves across the country; 1,000 Slaves will become Peasants in every location with more than 4,000 Slaves."
 dhe_slave.6.b: "Slaves form the backbone of any successful economy."
 dhe_slave.6.c: "There is no need to interfere."
 STATIC_MODIFIER_NAME_dhe_slave_debt_inaction_cm: "Debt Bondage Crisis"
 STATIC_MODIFIER_NAME_dhe_slave_debt_supported_cm: "Debt Bondage Endorsed"
 STATIC_MODIFIER_NAME_dhe_slave_debt_reform_cm: "Debt Bondage Reform"

 dhe_slave.7.t: "Ex-Slave Family Emerges"
 dhe_slave.7.desc: "An impressively hard-working and talented slave named [slave_family_1.GetName] has climbed to the top of the social ladder against all odds. Born in a stable outside [slave_family_birthplace_scope.GetName], he was educated by his kindly master, worked his way to the head of the household, and was eventually freed. He came to [ROOT.GetCountry.GetCapital.GetName] and profited through some shrewd business deals or other before serving a while as a local magistrate, and has now won election to the [ROOT.GetCountry.Custom('pa_imp_get_court_type')].\n\nThe noble class is predictably ruffled about sharing the air they breath, let alone the benches of the [ROOT.GetCountry.Custom('pa_imp_get_court_type')], with a former slave, and the stink has drawn into question our policies on senatorial appointments and the manumission of slaves.\n\nWhile not a patrician by blood, [slave_family_1.GetShortName] is certainly a well to do man with some influence in the [ROOT.GetCountry.GetName], and no doubt his children, [slave_family_2.GetShortName] and [slave_family_3.GetShortName], have inherited his determination..."
 dhe_slave.7.a: "We could do with some new blood in the senate..."
 dhe_slave.7.b: "Ensure they understand they are not welcome."
 dhe_slave.7.c: "This sets a dangerous precedent."
 dhe_slave.7.ct: "[slave_family_1.GetName] and his children will leave for [dhe_slave_family_country.GetName]."
 dhe_slave.7.d: "Is there only gossip to discuss today?"

 dhe_slave.8.t: "Scandalous [unethical_dominus_scope.Custom('pa_imp_get_dominus_domina')]"
 dhe_slave.8.desc: "While the occasionally rakish and louche tendencies of [unethical_dominus_scope.GetName] are well known throughout the upper circles of [ROOT.GetCountry.GetCapital.GetName], no one was quite prepared for the appalling slew of allegations leveled at [unethical_dominus_scope.GetHerHim] of late.\n\nThere are growing rumors of terrible indecencies perpetrated on slaves at debauched gatherings honoring [ROOT.GetCountry.Custom('pa_imp_get_wine_god')], where [unethical_dominus_scope.GetShortName] and [unethical_dominus_scope.GetHerHis] lewd entourage exhibit and debase their latest acquisitions from the emporia of [dhe_slave_scandal_market_flavor_scope.GetName]. [unethical_dominus_scope.GetShortName] denies everything in the most stringent terms, claiming the tales to be lies engineered by [unethical_dominus_scope.GetHerHis] political opponents.\n\nThe gossip is backed by several witnesses who claim to have been besmirched by [unethical_dominus_scope.GetShortName] personally, slaves and virtuous citizens across [ROOT.GetCountry.GetCapital.GetProvince.GetName] are demanding government sanctioned justice to deter these excesses, and we can no longer ignore the situation."
 dhe_slave.8.a: "We will conduct a full and fair investigation into this matter."
 #P:A TODO The family loyalty these tooltips describe is commented out in the event (EU5 characters have no loyalty); the keys are kept for a later port
 dhe_slave.8.at: "Every member of the [unethical_dominus_scope.GetDynasty.GetName] family loses #R 10#! Loyalty"
 dhe_slave.8.b: "A token inquiry should be sufficient..."
 dhe_slave.8.c: "Honestly, why waste our time on this?"
 dhe_slave.8.ct: "Every member of the [unethical_dominus_scope.GetDynasty.GetName] family gains #G 10#! Loyalty"
 STATIC_MODIFIER_NAME_under_investigation_cmod: "Under Investigation"
 STATIC_MODIFIER_NAME_dhe_slave_scandal_ignored_cm: "Scandal Ignored"
 get_dominus_domina_1: "Dominus"
 get_dominus_domina_2: "Domina"
 get_bacchus: "Bacchus"
 get_fufluns: "Fufluns"
 get_dionysus: "Dionysos"
 get_marqod: "Marqod"
 get_wine_god_default: "the God of Wine"

 dhe_slave.9.t: "Trial Developments"
 dhe_slave.9.desc_1: "Although there is still much work to be done gathering testimony and exploring the specific crimes, both religious and temporal, that [unethical_dominus_scope.GetShortName] may have committed, preliminary findings point heavily to [unethical_dominus_scope.GetHerHis] guilt.\n\nWhile the investigation is not complete, some have suggested that [unethical_dominus_scope.GetShortName] be prematurely detained in order to ensure [unethical_dominus_scope.GetSheHe] does not try to escape justice, although this will undoubtedly distress the [unethical_dominus_scope.GetDynasty.GetName] family even further."
 dhe_slave.9.desc_2: "While the investigation into [unethical_dominus_scope.GetName] was mainly intended as a symbolic gesture to ease tensions, it is clear after some preliminary groundwork by jurists that the accused is essentially guilty beyond all doubt. It is a minor miracle that this did not come to light sooner; the unspeakable goings on at the [unethical_dominus_scope.GetDynasty.GetName] villa scarcely bear thinking about.\n\nIt is, however, very hard to ignore just how much situations like these lend themselves to those less scrupulous and willing to earn the debt and gratitude of their colleagues in need..."
 dhe_slave.9.desc_3: "Although there is still much work to be done gathering testimony and exploring the specific crimes, both religious and temporal, that [unethical_dominus_scope.GetShortName] may have committed, preliminary findings would seem to suggest that the entire corpus of accusations is an elaborate, but baseless, political slander.\n\nWe have not been able to ascertain the source of the calumny; many of the witnesses who came forward have seemingly disappeared, lending credence to the theory that the perpetrator's aim was merely a character assassination. Regardless, it will be a while before the investigation is completely wrapped up."
 dhe_slave.9.desc_4: "While the investigation into [unethical_dominus_scope.GetName] was mainly intended as a symbolic gesture to ease tensions, it is clear after some preliminary groundwork by jurists that the accused has been the victim of slander which bears no resemblance to [unethical_dominus_scope.GetHerHis] relatively mundane lifestyle.\n\nWe seem to have saved ourselves a lot of trouble and money by only half heartedly investigating the innocent [unethical_dominus_scope.GetShortName]. All are agreed that there is no risk of any sentence being passed unless some extremely damaging evidence comes to light..."
 dhe_slave.9.a: "Leave no stone unturned, justice will be done."
 dhe_slave.9.b: "We will just have to see what happens."
 #P:A TODO EU5 has no imprisoned characters: the option keeps its effect on the trial outcome, but nobody is actually imprisoned
 dhe_slave.9.c: "Imprison [unethical_dominus_scope.GetShortName] as a precaution."
 #P:A TODO The family loyalty this tooltip describes is commented out in the event (EU5 characters have no loyalty); the key is kept for a later port
 dhe_slave.9.ct: "Every member of the [unethical_dominus_scope.GetDynasty.GetName] family loses #R 20#! Loyalty"
 dhe_slave.9.d: "I'm sure we can find some more witnesses..."
 dhe_slave.9.e: "Clearly this is all some sort of smear campaign..."
 dhe_slave.9.f: "Anything can be fixed. For a price..."
 dhe_slave.9.ft: "[unethical_dominus_scope.GetName] will be offered to bribe his way out of punishment.#!\n\nThis option is available due to your ruler's #Y questionable character#!."

 dhe_slave.10.t: "Attempted Extortion"
 dhe_slave.10.desc_1: "Our messenger has brought word that [unethical_dominus_scope.GetName] has refused our generous offer. It seems [unethical_dominus_scope.GetSheHe] puts little stock in the importance of reputation, or the power of the state."
 dhe_slave.10.desc_2: "Our messenger has brought word that [unethical_dominus_scope.GetName] has agreed to our offer. We are fortunate that [unethical_dominus_scope.GetHerHis] reputation is worth so much to [unethical_dominus_scope.GetHerHim].\n\nIt falls to us to ensure justice is done and that these wicked allegations are put to bed."
 dhe_slave.10.a: "We will 'ensure a full and fair trial'."
 dhe_slave.10.b: "The ungrateful [unethical_dominus_scope.GetShortName] is about to learn an important lesson..."

 dhe_slave.11.t: "Scandal Draws to Close"
 dhe_slave.11.desc_1: "It has come to our attention that, earlier today, the city guards sent to arrest [unethical_dominus_scope.GetShortName] at [unethical_dominus_scope.GetHerHis] villa outside [ROOT.GetCountry.GetCapital.GetName] and bring [unethical_dominus_scope.GetHerHim] to court found the place deserted. It would seem the coward fled [ROOT.GetCountry.GetName] at dawn with the majority of [unethical_dominus_scope.GetHerHis] wealth, and seeks refuge with friends abroad.\n\nWhile the investigation succeeded in rooting out and ending [unethical_dominus_scope.GetHerHis] reign of profligacy, the slaves will no doubt resent our having allowed [unethical_dominus_scope.GetShortName] to escape justice. The guards did, however, fortunately come across a portion of wealth left behind..."
 dhe_slave.11.desc_2: "After several weeks of gathering testimony it has become clear that the wild rumors circulating [ROOT.GetCountry.GetCapital.GetName] were merely a farce, engineered to destroy the reputation of a relatively upstanding citizen. More witnesses came forward to defend [unethical_dominus_scope.GetHerHim], ultimately, than did to corroborate the accusations.\n\n[unethical_dominus_scope.GetShortName] can rest easy, as time repairs the damage done to [unethical_dominus_scope.GetHerHis] and [unethical_dominus_scope.GetHerHis] family's reputation. The honorable and transparent conduct of the trial has also found us favor, not only with the slaves angered at the proposed excesses of the wealthy, but with citizens who are satisfied with the impartiality and veracity of our justice system."
 dhe_slave.11.desc_3: "The investigation into the accusations against [unethical_dominus_scope.GetName] can finally be brought to a close, having well established [unethical_dominus_scope.GetHerHis] innocence in the matter. A public apology and repudiation of slander has been issued, though the identity of the libels originator remains unknown.\n\nWhile the citizens are pleased that their reputations are in safe hands with our justice system, the slaves found the seriousness with which the trial was approached somewhat lacking..."
 dhe_slave.11.desc_4: "Despite an earlier lack of evidence against [unethical_dominus_scope.GetName], the diligent work of jurists and the testimony of certain witnesses who cannot be named has revealed the immorality and culpability of the accused, much to [unethical_dominus_scope.GetHerHis] shock. No doubt [unethical_dominus_scope.GetSheHe] thought [unethical_dominus_scope.GetSheHe] could get away with [unethical_dominus_scope.GetHerHis] perverse behavior as a highly respected personage.\n\nThe court is agreed that the accused should pay a reasonable fine as amends for [unethical_dominus_scope.GetHerHis] misdeeds. Let this be a lesson to any vain degenerates who think they are above the laws of the gods."
 dhe_slave.11.desc_5: "A full and fair inquiry into the allegations against [unethical_dominus_scope.GetName] has found that many of the litigants and witnesses who came forward were merely liars out to defame the good character of a respected citizen.\n\nThe court was satisfied that the pertinence of certain documents and testimonies destroyed due to a leaky roof were of little importance to the case as a whole, and have confirmed the full exoneration of [unethical_dominus_scope.GetShortName] of any wrong doing in the eyes of the state.\n\nThis is truly a great day for justice and a sound lesson to anyone who wishes to mislead the public or cast aspersions on the good names of the most valuable members of our society. Praise [ROOT.GetCountry.Custom('pa_imp_get_sky_god')]."
 dhe_slave.11.desc_6: "The investigation into the accusations against [unethical_dominus_scope.GetName] can finally be brought to a close, and has established [unethical_dominus_scope.GetHerHis] innocence in the matter to the satisfaction of the court. The many concerned parties and witnesses have largely been dismissed as disruptive slanderers seeking to undermine the reputation of an important member of society for their own nefarious aims.\n\nWhile there may be some small backlash over the seriousness with which the trial was conducted, we have at least staved off a major crisis among the slaves while protecting our interests..."
 dhe_slave.11.desc_7: "After several weeks of gathering testimony it has become clear that even the wildest rumors circulating [ROOT.GetCountry.GetCapital.GetName] hardly scratched the surface of the wickedness perpetrated by [unethical_dominus_scope.GetShortName], who has committed unspeakable horrors in the name [ROOT.GetCountry.Custom('pa_imp_get_god_of_dead')]. Countless witnesses have come forward, from household slaves to catamites, and the mountain of evidence cannot be dismissed as mere calumny.\n\nHaving consulted with the most senior religious and juridical experts, there is no doubt that [unethical_dominus_scope.GetShortName] is heinously guilty, in the eyes of the law and [ROOT.GetCountry.Custom('pa_imp_get_sky_god')] both. Yesterday, the high priests joined near all else in baying for [unethical_dominus_scope.GetHerHis] blood.\n\nWe must now decide what to do with [unethical_dominus_scope.GetShortName]; a lenient punishment will not be viewed favorably by the slaves, but if we are too harsh we risk alienating the entire [unethical_dominus_scope.GetDynasty.GetName] family."
 dhe_slave.11.a: "[unethical_dominus_scope.GetShortName] was merely an unfortunate victim of slander."
 dhe_slave.11.b: "A small fine is all [unethical_dominus_scope.GetSheHe] deserves."
 dhe_slave.11.c: "A ruined reputation and a fine will deter these lecherous excesses."
 #P:A TODO EU5 has no imprisoned characters: option dhe_slave.11.d no longer imprisons the convicted
 dhe_slave.11.d: "We will not tolerate this level of turpitude in our midst."
 #P:A TODO The family loyalty these tooltips describe (dt, et1, ht, it) is commented out in the event (EU5 characters have no loyalty); the keys are kept for a later port
 dhe_slave.11.dt: "Every member of the [unethical_dominus_scope.GetDynasty.GetName] loses #R 10#! Loyalty"
 dhe_slave.11.e: "[unethical_dominus_scope.GetShortName] is a fiend unworthy of life."
 dhe_slave.11.et1: "Every member of the [unethical_dominus_scope.GetDynasty.GetName] loses #R 20#! Loyalty"
 dhe_slave.11.et2: "\nThis option is available due to your ruler's #Y upstanding character#!."
 #P:A TODO EU5 characters have no rivals: the rivalry condition this tooltip names is commented out in the event
 dhe_slave.11.et3: "\nThis option is available due to your ruler's #Y rivalry#! with [unethical_dominus_scope.GetShortName]."
 dhe_slave.11.f: "A little dramatic, one thinks."
 dhe_slave.11.g: "Free [unethical_dominus_scope.GetHerHis] slaves and give them the money."
 dhe_slave.11.gt: "A minor character will appear in [ROOT.GetCountry.GetName]."
 dhe_slave.11.h: "Disgusting little [unethical_dominus_scope.GetWomanMan]."
 dhe_slave.11.ht: "Every member of the [unethical_dominus_scope.GetDynasty.GetName] loses #R 20#! Loyalty"
 dhe_slave.11.i: "A tragic loss for the cause of justice."
 dhe_slave.11.it: "Every member of the [unethical_dominus_scope.GetDynasty.GetName] gains #G 5#! Loyalty"
