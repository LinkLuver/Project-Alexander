 trade_good_events.2.t: "Myrrh of Moundou"
 trade_good_events.2.desc: "Moundou, our city that is famous for its myrrh, has been enjoying boom times lately. Our markets are filled with all manner of delightful goods, our aromatic resin being chief among them, and your treasuries are filled with foreign coins of gold and silver, with likenesses of kings that you have never even heard of before. It seems that the entire world speaks of Moundou, however."
 trade_good_events.2.a: "People shall come here for myrrh, but stay for our other goods"
 trade_good_events.2.b: "Shouldn't we receive a cut?"

 trade_good_events.3.t: "Sugar of Karmanta"
 trade_good_events.3.desc: "It is almost time to harvest the sugarcane in the province of Karmanta; thanks to your initiatives, the farmers say that we have grown more than we ever have. In fact, we have had to send extra laborers to help, and once the backbreaking labor is complete, we will have to decide what to do with the workers. They could come home certainly, but maybe they might stay in Karmanta?"
 trade_good_events.3.a: "Let the men return from the fields, but thank them"
 trade_good_events.3.b: "The laborers should stay and help with moving the product"
 trade_good_events.3.c: "Perhaps Karmanta could be their new home?"

 trade_good_events.4.t: "Cinnabar of Mirobriga"
 trade_good_events.4.desc: "As news spreads of the fine cinnabar that can be purchased in Mirobriga, more and more traveling merchants are visiting our province. At first, they would only stay for a few days, erecting tents and taking them down just as quickly, but now, you have witnessed scenes of construction in the marketplaces. Buildings of wood and stone are being built and representatives from the leading trade families are setting up administrative centers in Mirobriga; it seems that these merchants are planning to permanently stay."
 trade_good_events.4.a: "May our intertwined fortunes grow"

 trade_good_events.5.t: "Cinnabar of Carnium"
 trade_good_events.5.desc: "The ongoing mining of cinnabar in Carnium has bolstered the fortunes of those who live in the area, yet recently we have received word that they are need in more workers. Life in the mountains is already difficult, and those who work in the mines often suffer tremendously for their pains. Still, it is a profitable business, appealing to those who are willing to trade their labor for the opportunity. What should we do?"
 trade_good_events.5.a: "Send them what they request"
 trade_good_events.5.b: "Spread word that we want travelers to come here"
 trade_good_events.5.c: "Why are you bothering me with this? Just give me my taxes"

 trade_good_events.6.t: "Cinnabar of Singidunum"
 trade_good_events.6.desc: "By any metric, our mining of cinnabar is a success; our men continue to extract the mineral untroubled, and our jewelers and craftsmen produce exquisite items that are the envy of any that see them. Encouraged by these stories, some local tribesmen have requested that they be allowed to abandon their livelihoods in order to take up cinnabar mining. What shall we say to them?"
 trade_good_events.6.a: "Allow the migrants to settle, but not too many"
 trade_good_events.6.b: "Send word to the four corners that the wealth of Singidunum awaits them"
 trade_good_events.6.c: "Successful mining, you say? Where is my share?"

 trade_good_events.7.t: "Lapis Lazuli of Eukratideia"
 trade_good_events.7.desc: "Excellent news came this morning, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]; while working in the mines of Eukratideia, the laborers discovered a large vein of lapis lazuli of the deepest blue, with flecks of gold the size of coins. This discovery ensures the economic vitality of this region for decades - we are going to be rich!"
 trade_good_events.7.a: "We should celebrate, don't you think?"

 trade_good_events.8.t: "Lapis Lazuli of Kaukasou"
 trade_good_events.8.desc: "The lapis lazouli industry near Kaukasou is thriving, no doubt due to your guiding hand, yet we find ourselves at a crossroads. The state is responsible for the growth of the industry, and as such, there are some who feel like we should take a more active role in administering the mines. Not the worst problem to have, but we do have a decision to make about the future of the region."
 trade_good_events.8.a: "The state will take over from here"
 trade_good_events.8.b: "Spread word that Kaukasou is open for business"
 trade_good_events.8.c: "Take a small cut, but reinvest the profits"

 trade_good_events.9.t: "Jade of Pishan"
 trade_good_events.9.desc: "You have returned from a visit to the productive jade mines of Pishan, and your mind is filled with all of the possibilities. Everything that you have poured into the region has caused unprecedented growth, and the jade statuettes made by the local craftsmen are simply masterpieces. Should we continue to improve the local infrastructure, or allow the natural course of events to play out?"
 trade_good_events.9.a: "Tell our overseers to return home and let Pishan work on our behalf"
 trade_good_events.9.b: "Increase the taxes!"
 trade_good_events.9.c: "We want more people to live here..."

 trade_good_events.10.t: "Silphium of Serapeion"
 trade_good_events.10.desc: "The silphium fields of Serapeion have to be seen to be believed, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]; it is as though stalks of gold are growing out of the ground. When Dawn awakens, she finds our farms already filled with laborers, who harvest silphium until Dusk puts an end to their toiling. Although we are currently raking in the coins, some of our advisors believe there is more that we could do to bolster the industry there."
 trade_good_events.10.a: "We could reinvest our profits"
 trade_good_events.10.b: "I believe we are owed a bit off of the top?"

