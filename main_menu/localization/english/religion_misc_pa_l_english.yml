l_english:
### New culture and religion window
 essence_tenet_desc: "Known also as ousia (#italic ουσία#!), this tenet represents the presence of Divinity as part of the architecture of the universe around us, and our struggle to embrace it fully."
 person_tenet: "Person"
 person_tenet_desc: "Deriving from the core concept of concrete reality (#italic υπόστασις#!) this tenet delves into the philosophical and fundamental reality and substance that supports all reality. Having made its appearance in ancient debates, it resurfaced as an important proponent in determining the nature of the Holy Trinity, where it describes its three proponents as sharing one divine essence."
 accept_person_tenet: "Accept the Tenet of Person"
 accept_person_tenet_desc: "$accept_aspect_key$"
 deny_person_tenet: "Reject the Tenet of Person"
 deny_person_tenet_desc: "$reject_aspect_key$"
 prosopon_tenet: "Mask"
 prosopon_tenet_desc: "Known also as prosopon (#italic πρόσωπον#!), this tenet marries the concept of divine identity and person (#italic υπόστασις#!). Its goal is to underline the uniqueness and value in personhood both in the divine and believers."
 accept_prosopon_tenet: "Accept the Tenet of Mask"
 accept_prosopon_tenet_desc: "$accept_aspect_key$"
 deny_prosopon_tenet: "Reject the Tenet of Mask"
 deny_prosopon_tenet_desc: "$reject_aspect_key$"

 #Hindu
 ganesha_god: "Indra"
 ganesha_god_desc: "$ganesha_god$ is the king of the Devas and one of the foremost [gods|e] of [ShowReligionName('hindu')]. Celebrated throughout the Vedas as the lord of storms, war, and kingship, he is the divine protector of righteous rulers and the upholder of cosmic order."
 shiva_god: "Rudra"
 shiva_god_desc: "$shiva_god$ is one of the principal [gods|e] of [ShowReligionName('hindu')], worshiped in his ancient form as Rudra. Revered as both a fearsome destroyer and a divine healer, he is especially honored by followers of [ShowPolicyName('shaivism')], who emphasize asceticism, meditation, and spiritual discipline."
 shakti_god: "Devī"
 shakti_god_desc: "$shakti_god$ is the Great Goddess revered throughout [ShowReligionName('hindu')]. Worshiped in many local and regional forms, she embodies fertility, protection, sovereignty, and divine power, and serves as the foremost goddess among followers of [ShowPolicyName('shaktism')]."
 vishnu_god_desc: "$vishnu_god$ is one of the principal [gods|e] of [ShowReligionName('hindu')]. Revered as the preserver of cosmic order, he is especially honored by followers of [ShowPolicyName('vaishnavism')], who worship him in the form of Vāsudeva and other heroic manifestations."
 surya_god_desc: "$surya_god$ is the Sun [god|e] and one of the foremost deities of [ShowReligionName('hindu')]. Worshiped as the source of light, life, and royal authority, he is the supreme deity of followers of [ShowPolicyName('shrauta')]."

 #buddha_avatar: "Buddha" #P:A Removed duplicate key, kept at religion_l_english.yml:1028
 buddha_avatar: "Balarāma"
 buddha_avatar_desc: "$buddha_avatar$ is revered by many early followers of Vāsudeva as his elder brother and companion. A mighty warrior associated with agriculture, strength, and loyalty, he is honored as a divine hero and protector of the righteous."
 kalki_avatar: "Trivikrama"
 kalki_avatar_desc: "$kalki_avatar$ is the cosmic form assumed by [ShowGodName('vishnu_god')] after measuring the three worlds in three strides. He represents the restoration of cosmic order and the triumph of Dharma over chaos."
 shakti_common_desc: "is a major [goddess|e] in [ShowReligionName('hindu')], and one of the principal aspects of [ShowGodName('shakti_god')] in [ShowPolicyName('shaktism')]. She represents"
 durga_avatar_desc: "$durga_avatar$ $shakti_common_desc$ courage, royal protection, martial strength, and the destruction of hostile forces."
 kali_avatar: "Nirṛti"
 kali_avatar_desc: "$kali_avatar$ is an ancient goddess associated with destruction, battle, calamity, and the untamed forces beyond civilization. She is invoked to overcome enemies and destroy evil."
 parvati_avatar_desc: "$parvati_avatar$ $shakti_common_desc$ fertility, marriage, family, prosperity, and the nurturing aspects of nature. She is closely associated with [ShowGodName('shiva_god')] in many traditions."
 lakshmi_avatar_desc: "$lakshmi_avatar$ $shakti_common_desc$ fortune, prosperity, abundance, and royal success. She is invoked for the flourishing of both kingdoms and households."
 chhinnamasta_avatar: "Ambikā"
 chhinnamasta_avatar_desc: "$chhinnamasta_avatar$ $shakti_common_desc$ maternal protection, courage, and the defense of her devotees. She is worshiped as one of the foremost manifestations of the Great Goddess."
 chandi_avatar_desc: "$chandi_avatar$ $shakti_common_desc$ fierce protection, righteous warfare, and the destruction of wickedness."
 tripura_sundari_avatar: "Śrī"
 tripura_sundari_avatar_desc: "$tripura_sundari_avatar$ $shakti_common_desc$ beauty, fortune, harmony, and the auspicious order of the universe."
 bhuvaneshvari_avatar: "Pṛthivī"
 bhuvaneshvari_avatar_desc: "$bhuvaneshvari_avatar$ is the Earth Mother revered throughout [ShowReligionName('hindu')]. She represents the fertile land, the foundation of kingdoms, and the nurturing world itself."
 tara_avatar: "Rātrī"
 tara_avatar_desc: "$tara_avatar$ is an ancient goddess of the night, protection, and safe passage through darkness. She is invoked for guidance, courage, and victory in times of uncertainty."
