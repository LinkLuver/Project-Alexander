l_english:
 # Imperator (Invictus / Terra Indomita) decision import (2026-11-07)

 # decisions/00_aaa_pth_dahae_belligerency.txt
 aaa_pth_dahae_belligerency.title: "#R Dahae Belligerency#!"
 #P:A TODO Imperator showed the live situation progress and its sources here (GuiScope script values and Invictus custom loc that were not imported); rewritten without them
 aaa_pth_dahae_belligerency.desc: "If the situation progress reaches 100, the #R Dahae Invasion#! of the Iranian Plateau will happen!"
 aaa_pth_dahae_belligerency.a: "The danger has passed."

 # decisions/aksum_decisions.txt
 aksum_development_decision_2.title: "Great Temple of Maher"
 aksum_development_decision_2.desc: "Maher, the war god that mercilesly scatters our enemies like chaff in the wind, has blessed Aksum with victory and is deserving of a Great Temple. Let us begin construction so that we may properly observe the rites."
 aksum_development_decision_2.a: "Raise the Great Temple."

 # decisions/bloodline_decisions.txt
 claim_blood_of_ateas.title: "Successor of Ateas"
 claim_blood_of_ateas.desc: "Ateas was a Scythian king who united the Scythian tribes and then died in 339 BCE in battle against Philipp of Macedon. Now, many decades later, we can successfully claim to be his descendants. Finally, his empire has been united once more. \n\nOnly very few contest now that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is of Ateas' stock."
 claim_blood_of_ateas.a: "The blood of Ateas flows in our veins."

 # decisions/celtiberian_treasure.txt
 celtiberian_plaques_treasure.title: "Commission the Bronze Plaques"
 celtiberian_plaques_treasure.desc: "With a more centralized state, we need to establish a clear canon of our laws rather than depend on oral transmission, which can lead to misunderstanding and unfairness."
 celtiberian_plaques_treasure.a: "Cast the plaques in bronze."

 # decisions/chaldean_decisions.txt
 #P:A TODO No Imperator name for this decision; written from its key
 reinstate_eblaite_gods.title: "Reinstate the Eblaite Gods"
 #P:A TODO No Imperator description for this decision
 reinstate_eblaite_gods.desc: "The tablet of Ebla records the gods our forefathers honoured. Let us return them to their temples."
 reinstate_eblaite_gods.a: "Let the old gods return."

 # decisions/child_sacrifice_inv_dec1.txt
 child_sacrifice.title: "Child Sacrifice"
 child_sacrifice.desc: "Sacrifice a noble child in the name of the Gods, who will bestow a blessing upon your lands if they approve of it. However, they will punish your people if the sacrifice isn't worthy enough. \n\nThe divine boon might be what is needed to face your current crisis, yet a condemnation could end your rule."
 child_sacrifice.a: "May the gods accept our offering."

 # decisions/conversions.txt
 become_tribal_chiefdom.title: "Abandon Sedentary Lifestyle"
 become_tribal_chiefdom.desc: "Times are changing and this land can no longer support our great tribe. It is time to once more embrace the traditions of our ancestors, and prepare for migrations to more peaceful and fertile lands."
 become_tribal_chiefdom.a: "We take to the road once more."
 become_tribal_kingdom.title: "Form Tribal Kingdom"
 become_tribal_kingdom.desc: "We have found a good home, it is time we settle down and adopt a more sedentary lifestyle. Let us proclaim ourselves a kingdom, separating ourselves from the migratory tribes to which we once belonged."
 become_tribal_kingdom.a: "Proclaim the kingdom."
 become_despotic_monarchy_tribal.title: "Embrace Autocracy"
 become_despotic_monarchy_tribal.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], inspired by the Kings and Tyrants of foreign lands, might exert greater authority by discarding the tribal trappings of our ancestors."
 become_despotic_monarchy_tribal.a: "Embrace autocracy."
 become_democracy_tribal.title: "Embrace Democracy"
 become_democracy_tribal.desc: "The Chiefs, Elders, and Magistrates of [ROOT.GetCountry.GetName] believe that adopting a more constitutional form of democracy will allow us to prosper fully."
 become_democracy_tribal.a: "Embrace democracy."
 tribal_reform_decision.title: "Investigate Tribal Reform"
 tribal_reform_decision.desc: "It is time for our people to consider new methods of rule. Foreign ideals flood our country - can we truly remain a nomadic people?"
 tribal_reform_decision.a: "Let us consider reform."
 become_plutocratic_monarchy.title: "Adopt Plutocratic Monarchy"
 become_plutocratic_monarchy.desc: "The lure of profit and prosperity is something we must enshrine into our very constitution; abandoning the trappings of lesser kingdoms."
 become_plutocratic_monarchy.a: "Adopt the new constitution."
 become_aristocratic_monarchy.title: "Embrace an Aristocratic Society"
 become_aristocratic_monarchy.desc: "Those of noble blood should not be required to mingle with commoners..."
 become_aristocratic_monarchy.a: "Adopt the new constitution."
 become_stratocratic_monarchy.title: "Adopt Stratocratic Monarchy"
 become_stratocratic_monarchy.desc: "The [ROOT.GetCountry.GetAdjective] people yearn to show the world their might. By stratifying our very society in a militarized hierarchy, we shall show the glory of [ROOT.GetCountry.GetName] to all!"
 become_stratocratic_monarchy.a: "Adopt the new constitution."
 become_theocratic_monarchy.title: "Proclaim Theocratic Monarchy"
 become_theocratic_monarchy.desc: "The glory of the divine shall shine upon [ROOT.GetCountry.GetGovernment.GetRuler.GetName] - the [ROOT.GetCountry.GetAdjective] people are truly blessed."
 become_theocratic_monarchy.a: "Adopt the new constitution."
 deify_emperor.title: "Divine Sanction"
 deify_emperor.desc: "Few are in denial that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is blessed. It follows, therefore, that such divine heritage can only be the property of a divine being."
 deify_emperor.a: "Proclaim the divine ruler."
 tribal_civilization.title: "Codify State Lands"
 tribal_civilization.desc: "The division of land and property in our capital remains muddled and impenetrable. Key plots must be ceded to the chief, and their collective ownership codified."
 tribal_civilization.a: "Codify the lands."
 create_spartan_empire.title: "Imperial Sparta"
 create_spartan_empire.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], resplendent in the glory of conquest, has eclipsed all other petty Kingdoms; a new title is needed for the ruler of the [ROOT.GetCountry.GetAdjective] Empire."
 create_spartan_empire.a: "Proclaim Imperial Sparta."
 deify_spartan_emperor.title: "Deify Spartan Emperor"
 deify_spartan_emperor.desc: "Few are in denial that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is blessed. It follows, therefore, that such divine heritage can only be the property of a divine being."
 deify_spartan_emperor.a: "Proclaim the divine ruler."

 # decisions/enshrine_equal_rights.txt
 enshrine_social_equity.title: "Embrace Social Equity"
 enshrine_social_equity.desc: "For too long have we ignored a full half of our populace. Let us break the barriers of bygone tradition, and let all stand for office."
 enshrine_social_equity.a: "Let all stand for office."
 abolish_social_equity.title: "Abolish Social Equity"
 abolish_social_equity.desc: "The traditionalists whisper in dark corners, and the bearded ancients pour scorn on us. Our attempts at progressive governance must come to an end."
 abolish_social_equity.a: "Return to the old ways."

 # decisions/expand_incense_route.txt
 expand_incense_route.title: "Expand Incense Route"
 expand_incense_route.desc: "Strabo described Eudaimon as the main port of call for maritime commerce between India and Egypt."
 expand_incense_route.a: "Expand the port."

 # decisions/found_dromedary_training_complex.txt
 found_dromedary_training_complex.title: "Found Dromedary Training Complex"
 found_dromedary_training_complex.desc: "Do it."
 found_dromedary_training_complex.a: "Found the complex."

 # decisions/found_elephant_training_complex.txt
 found_elephant_training_complex.title: "Found Elephant Training Complex"
 found_elephant_training_complex.desc: "Do it."
 found_elephant_training_complex.a: "Found the complex."

 # decisions/gallic_unique_interaction.txt
 gallic_smithy.title: "Send for the Master Smith"
 gallic_smithy.desc: "You can send a request to a master smith. He will forge an item for you, for an appropriate price. Sometimes, he will work together with another craftsman."
 gallic_smithy.a: "Send for the smith."

 # decisions/illyrian_decisions.txt
 cult_choice_illyric.title: "Choose a Cult"
 cult_choice_illyric.desc: "Every Illyric ruler can pick a cult to follow. Upon the death of the current ruler, the next ruler may pick a new cult to follow."
 cult_choice_illyric.a: "Choose a cult."

 # decisions/indian_decisions.txt
 choice_of_personal_deity_hindu.title: "Choice of Personal Deity"
 choice_of_personal_deity_hindu.desc: "Every Hindu ruler can pick their choice of deity. This choice lasts for the life of the ruler or until an event changes it."
 choice_of_personal_deity_hindu.a: "Choose a deity."
 buddhist_treasures_of_india.title: "Buddhist Treasures of India"
 buddhist_treasures_of_india.desc: "Gather the many great Buddhist works of our time and compile all their great teachings into one singular text."
 buddhist_treasures_of_india.a: "Compile the teachings."
 hindu_treasures_of_india.title: "Vedic Treasures of India"
 hindu_treasures_of_india.desc: "Gather the many great Vedic works of our time and compile all their great teachings into one singular text."
 hindu_treasures_of_india.a: "Compile the teachings."
 subjugate_maldives_decision.title: "Subjugate the Maldives"
 subjugate_maldives_decision.desc: "The nature of the relationship that we have with the Maldives has been called into question lately. Considering how reliant they are upon us for nearly everything, why should we maintain the pretense that they are a separate political entity from us?"
 subjugate_maldives_decision.a: "The islands will answer to us."

 # decisions/levantine_decisions.txt
 expand_kition_kothon.title: "Expand the Kothon of Kition"
 expand_kition_kothon.desc: "Kition was the first Phoenician colony beyond the shores #high Levant#!. It was established on #high Alashiya#!, which the Greeks call #high Kypros#!, in the #high 9th century BCE#!. This 'new city' (Qarthadast) long served as a hugely valuable trade node and allowed Tyre to exert its economic influence far beyond the Levant, placing it in a position to seed the Mediterranean with colonies. However, years of neglect have left the cothon silted and damaged, a pale echo of its former grandeur. This cannot stand. We shall restore and expand the Kothon of Kition so that it will rival even the Cothon of Carthage in scale and sophistication."
 expand_kition_kothon.a: "Expand the kothon."

 # decisions/mac_decisions.txt
 restore_argead_dynasty.title: "Restore the Argead Dynasty"
 restore_argead_dynasty.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], ruler of Macedon, seat of the Macedonian kings, has decided to restore the Argead dynasty, as he has Argead blood, from Kassander's spouse, Thessalonike, half-sister of Alexander the Great."
 restore_argead_dynasty.a: "Restore the dynasty."

 # decisions/nuragic_decisions.txt
 rebuild_the_giants_of_tarshish.title: "Rebuild The Giants of Tarshish"
 rebuild_the_giants_of_tarshish.desc: "It's our duty the reinstitute the old monumental necropolis of Tarshish, once destroyed by the Carthaginians in their attempt to subdue our people."
 rebuild_the_giants_of_tarshish.a: "Rebuild the giants."

 # decisions/persian_decisions.txt
 restore_parsa.title: "Restore Parsa"
 restore_parsa.desc: "Restoring Parsa to its former glory would be wise."
 restore_parsa.a: "Restore Parsa."

 # decisions/punt_decisions.txt
 city_of_angels_decision_1.title: "City of Angels"
 city_of_angels_decision_1.desc: "As the Ayaanle are heavenly creatures that worship the Supreme Being and carry out the will of Waaq, with careful investments our city shall become known as a City of Angels, serving and sheltering our people in an imitation of the Divine Order."
 city_of_angels_decision_1.a: "Invest in the city."
 city_of_angels_decision_2.title: "Land of Ayaanle"
 #P:A TODO Imperator left this description empty
 city_of_angels_decision_2.desc: ""
 city_of_angels_decision_2.a: "Invest in the land."

 # decisions/ritual_sacrifice_inv.txt
 ritual_sacrifice_invictus.title: "Ritual Sacrifice"
 ritual_sacrifice_invictus.desc: "Sacrifice a prisoner to the gods. This may improve your tribe's cohesion, yet it might divide you further."
 ritual_sacrifice_invictus.a: "May the gods accept our offering."

 # decisions/thracian_unique_interaction.txt
 thracian_smithy.title: "Summon the Master Smith"
 thracian_smithy.desc: "You can summon a master smith who will, for the right price, craft you a piece of equipment. It might be used for war, or it might be useful out in the fields..."
 thracian_smithy.a: "Summon the smith."

 # decisions/tylosian_decisions.txt
 giant_shark_statue_treasure.title: "Renovate the Giant Shark Statue to Awal"
 giant_shark_statue_treasure.desc: "The shark-god Awal favors our people, for his presence can be seen daily in the waters surrounding Tylos. We must honor our deity by renovating the colossal statue of the god that is in the center of our capital."
 giant_shark_statue_treasure.a: "Honour Awal."

 # decisions/ver_sacrum.txt
 ver_sacrum.title: "Call for a Sacred Spring"
 ver_sacrum.desc: "The Ver Sacrum, or Sacred Spring, is most likely a rite originating during the Bronze Age to deal with overpopulation and start a migration of the young. While many cultures once had a similar tradition, only some Italic peoples still celebrate and go through with it to this day. \n\nWhen a sacred spring is called, all the young children ad cattle that are born in the spring of the following year will be 'devoted' to this rite and are considered to be under divine protection. Once they have reached maturity, they will be required to leave their community and are expected to create a new settlement, either by subjugating or exterminating the previous inhabitants or simply by settling uncolonized land. \nSome people think that originally, the 'devoted' children and cattle would be sacrificed.\n\nThe Roman practice of devotio is most likely related to the Ver Sacrum."
 ver_sacrum.a: "Devote the spring to the gods."

 # tooltips
 aaa_pth_dahae_belligerency_tt1: "#R Dahae Belligerency#! is below #Y 1.00#!."
 aaa_pth_dahae_belligerency_tt2: "#R Dahae Invasion#! already happened by other means."
 aaa_pth_dahae_belligerency_tt3: "Resolves peacefully when Dahae Belligerency lowers below 1.00."
 child_sacrifice_dec.tt: "You need to not have successfully sacrificed a child in the last #Y 10#! years."
 gallic_smithy.tt: "You can send for the master smith only once every five years."
 social_equity_tooltip: "You cannot switch #Y Gender Equality#! policy for #Y 20#! years after changing it."
 #P:A TODO Imperator added the Tribal Reform mission to the mission pool; EU5 has no missions
 allows_tribal_reform_mission: "Our people will be ready for #Y Tribal Reform#!."
 argead_restoration_tt: "We will restore the old Argead dynasty."
 ver_sacrum_cooldown_tt: "We have not recently called for a Ver Sacrum."
 ver_sacrum_req_tt: "Any owned territory needs to be near its #Y population capacity#!."
 ritual_sacrifice_decision.tt: "At least one character needs to be imprisoned. In addition, you either need to not have sacrificed anyone in the last ten years."
 #P:A TODO Imperator counted only free (non-slave) pops and showed their number with a script value; EU5 checks half of all capital population
 big_religion_in_capital_tooltip: "At least 50% of the people in [ROOT.GetCountry.GetCapital.GetName] follow this religion."
 #P:A TODO Imperator text said 20% but its trigger counted 20 pops; EU5 checks 20 (thousand) population
 big_religion_in_country_tooltip: "At least #Y 20#! thousand people in [ROOT.GetCountry.GetName] follow this religion."
 #P:A TODO Imperator converted only loyal family members; EU5 has no loyalty
 religion_conversion_family_tooltip: "Members of the ruler's family at court will convert to the new faith."
 #P:A TODO Imperator added citizen, freemen and slave pops of the state culture and religion
 capital_formable_large_effect_tooltip: "Adds #Y 4#! Burgher, #Y 4#! Peasant and #Y 4#! Slave Pops with the culture and religion of the largest local pop."

 # decisions/religious_conversion.txt (Invictus)
 convert_to_buddhist.title: "Embrace Buddhism"
 convert_to_buddhist.desc: "The teachings of Buddha are spreading rapidly in our lands. It is time to embrace his philosophy ourselves and start promoting these words among our subjects."
 convert_to_buddhist.a: "Embrace the new faith."
 convert_to_jainism.title: "Embrace Jainism"
 convert_to_jainism.desc: "Jain teachings are spreading rapidly in our land and among the characters of our court. The time has come to embrace these deep philosophies and incorporate them into the very fabric of our state itself."
 convert_to_jainism.a: "Embrace the new faith."
 convert_to_hinduism.title: "Embrace Vedic Faith"
 convert_to_hinduism.desc: "Let the Vedas and the ancient teachings of old India be the official policy of our state, let us promote Vedic among our subjects and at our court."
 convert_to_hinduism.a: "Embrace the new faith."
 convert_to_kemeticism.title: "Embrace the Kemetic Pantheon"
 convert_to_kemeticism.desc: "The followers of Isis have become a prominent part of our society, and our people are looking to them for guidance in their daily lives. It is time we put our old traditions behind and accept their teachings."
 convert_to_kemeticism.a: "Embrace the new faith."
 convert_to_hellenic.title: "Embrace the Hellenic Pantheon"
 convert_to_hellenic.desc: "We have seen temples and shrines to the many deities of the Greek Pantheon being raised in [ROOT.GetCountry.GetCapital.GetName] lately, and our citizens turning to their priests and oracles for their wisdom. Maybe it is time we all started looking to them for guidance?"
 convert_to_hellenic.a: "Embrace the new faith."
 convert_to_canaanite.title: "Embrace the Canaanite Pantheon (Canaanite)"
 convert_to_canaanite.desc: "Melqart and his followers have been commonplace in [ROOT.GetCountry.GetCapital.GetName] since we first met those who worshiped him, but now we have seen a newfound interest in Ba'al, Astarte and the other deities as well. Traditions that was once an important part of our identity are being left behind as foreign exotic rituals are becoming a matter of course. It is time to accept the Canaanite Pantheon as our own."
 convert_to_canaanite.a: "Embrace the new faith."
 convert_to_canaanite_punic.title: "Embrace the Canaanite Pantheon (Punic)"
 convert_to_canaanite_punic.desc: "Melqart and his followers have been commonplace in [ROOT.GetCountry.GetCapital.GetName] since we first met those who worshiped him, but now we have seen a newfound interest in Ba'al, Astarte and the other deities as well. Traditions that was once an important part of our identity are being left behind as foreign exotic rituals are becoming a matter of course. It is time to accept the Canaanite Pantheon as our own."
 convert_to_canaanite_punic.a: "Embrace the new faith."
 convert_to_shamanism.title: "Embrace the Zalmoxian Faith"
 convert_to_shamanism.desc: "The teachings of great Zalmoxis has become more apparent and important among our young these last years. They look to his words on how to live their lives, and even some of our elders have been affected by this shift to the new faith. It is time the rest of us follow his ideas as well."
 convert_to_shamanism.a: "Embrace the new faith."
 convert_to_caucasian_religion.title: "Embrace the Armazic Pantheon"
 convert_to_caucasian_religion.desc: "Be it the stories of the mystical Tir, the truth of Mihr or the greatness of Aramazd, we have heard it all lately. It seems all our old temples and shrines have been replaced by those of the Armazic pantheon, and similarly have our priests and priestesses. "
 convert_to_caucasian_religion.a: "Embrace the new faith."
 convert_to_circassian_pantheon.title: "Embrace the Nartic Pantheon"
 convert_to_circassian_pantheon.desc: "The heroes and gods of the Nart Sagas have encapsulated the hearts of our people. Their powerful, tricky, and complex nature inspire us to adopt them as our official religion."
 convert_to_circassian_pantheon.a: "Embrace the new faith."
 convert_to_mesopotamian_religion.title: "Embrace the Chaldean Pantheon"
 convert_to_mesopotamian_religion.desc: "The ancient myths and legends of Ishtar and Gilgamesh have filled our halls and inspired our people. No longer do we listen to the priests of the [ROOT.GetCountry.GetReligion.GetName] faith, and their worthless traditions are put aside and replaced by the ancient rituals of the Babylonians, Sumerians and Akkadians."
 convert_to_mesopotamian_religion.a: "Embrace the new faith."
 convert_to_armenian_religion.title: "Embrace the Khaldic Faith"
 convert_to_armenian_religion.desc: "Our soldiers were the first to pick up the old Khaldic traditions, proving invaluable for morale and discipline as they were sent off to war. Now the rest of our people are looking to the ancient pantheon, picking up the traditions of old once more."
 convert_to_armenian_religion.a: "Embrace the new faith."
 convert_to_anahitic_religion.title: "Embrace Armenian"
 convert_to_anahitic_religion.desc: "The worhsipers of Anahit have spread throughout our country. It has proved a popular religion with its malleability to our local deities. It may be time to officially adopt this Armenian religion and call it our own."
 convert_to_anahitic_religion.a: "Embrace the new faith."
 convert_to_anatolian_religion.title: "Embrace the Anatolian Faith (Luwian)"
 convert_to_anatolian_religion.desc: "The belief in the Mother Goddess has long been an important one next to all the other deities in our faith, but more recently the rest has seen a clear decline of interest. Cybelene, the Mother Goddess, has become the most important figure in our religious traditions and practices."
 convert_to_anatolian_religion.a: "Embrace the new faith."
 convert_to_anatolian_religion_cybele.title: "Embrace the Anatolian Faith (Cybelean)"
 convert_to_anatolian_religion_cybele.desc: "The belief in the Mother Goddess has long been an important one next to all the other deities in our faith, but more recently the rest has seen a clear decline of interest. Cybelene, the Mother Goddess, has become the most important figure in our religious traditions and practices."
 convert_to_anatolian_religion_cybele.a: "Embrace the new faith."
 convert_to_druidism.title: "Embrace the Druidic Class"
 convert_to_druidism.desc: "Though the Druids have yet to become an official part of our faith, they have long played the informal role as advisors and shown guidance to our people. Maybe it is time to rid ourselves of our old shackles of traditions and faith, and truly welcome them into our society?"
 convert_to_druidism.a: "Embrace the new faith."
 convert_to_animism.title: "Embrace the Iberic Pantheon"
 convert_to_animism.desc: "It seems the prophets and oracles of Endouellicus has foreseen a great future for our nation if we turn to his worship. The Iberic pantheon is already revered among our people, and our court officials advise us to embrace this new faith."
 convert_to_animism.a: "Embrace the new faith."
 convert_to_judaism.title: "Embrace Judaism"
 convert_to_judaism.desc: "We have lately seen a large swathe of our people turn to the worship of only one god, the Judean one. Defying the polytheistic teachings of other faiths, the strength of their belief have convinced many of the lower class to turn their prayers to the Judean god."
 convert_to_judaism.a: "Embrace the new faith."
 convert_to_zoroastrianism.title: "Embrace Zoroastrianism"
 convert_to_zoroastrianism.desc: "The teachings of Zoroaster has permeated Persian society since he was given the wisdom of Ahura Mazda. The truth and inherent benevolence of the faith quickly spreads throughout [ROOT.GetCountry.GetName], and it is time for us to devote ourselves entirely to the one path."
 convert_to_zoroastrianism.a: "Embrace the new faith."
 convert_to_berber_religion.title: "Embrace Amazigh Traditions"
 convert_to_berber_religion.desc: "Though the people of the Amazigh faith were once inspired and affected by their neighbors, they now in turn have affected us. Our people have started picking up the beliefs of the desert tribes, looking to Nanna Tala and Shaheded as much as they do any local deity."
 convert_to_berber_religion.a: "Embrace the new faith."
 convert_to_germanic_religion.title: "Embrace the Tuistic Faith"
 convert_to_germanic_religion.desc: "Our people have started looking to the teachings of the priests of Tuis and the traditions of the Germanic people for guidance in how to live their lives. Though they seemed strange and warlike at first, our people have adepted their customs to our own and familiarized them."
 convert_to_germanic_religion.a: "Embrace the new faith."
 convert_to_indo_iranian_religion.title: "Embrace the Heptadic Pantheon"
 convert_to_indo_iranian_religion.desc: "The seven deities of the Scythian horsemen have become popular in our lands lately. Particularly the ancient Targitaos have seen large shrines built in his honor, and our people have turned to him as if he was our own forefather, similar to how the Scythians treat the deity."
 convert_to_indo_iranian_religion.a: "Embrace the new faith."
 convert_to_arabian_pantheon.title: "Embrace the Arabic Pantheon (Ḥaramī)"
 convert_to_arabian_pantheon.desc: "The caravans has brought the Arabic pantheon with them into [ROOT.GetCountry.GetName], and now we see our people look to the guidance of the oracle of Ta'lab or asking for Manat to turn the tides of fate in their favor. It is time for us to take up their worship."
 convert_to_arabian_pantheon.a: "Embrace the new faith."
 convert_to_arabian_pantheon_south.title: "Embrace the Arabic Pantheon (Sabaean)"
 convert_to_arabian_pantheon_south.desc: "The caravans has brought the Arabic pantheon with them into [ROOT.GetCountry.GetName], and now we see our people look to the guidance of the oracle of Ta'lab or asking for Manat to turn the tides of fate in their favor. It is time for us to take up their worship."
 convert_to_arabian_pantheon_south.a: "Embrace the new faith."
 convert_to_arabian_pantheon_east.title: "Embrace the Arabic Pantheon (Dilmunite)"
 convert_to_arabian_pantheon_east.desc: "The caravans has brought the Arabic pantheon with them into [ROOT.GetCountry.GetName], and now we see our people look to the guidance of the oracle of Ta'lab or asking for Manat to turn the tides of fate in their favor. It is time for us to take up their worship."
 convert_to_arabian_pantheon_east.a: "Embrace the new faith."
 convert_to_eastern_animism.title: "Embrace Swancho"
 convert_to_eastern_animism.desc: "The goddesses Swancho and Menya are worshiped throughout our lands. Idols of Kem and Kom are found throughout their homes. The state now too should accept the gods of Tocharia and the Tarim Basin as its own."
 convert_to_eastern_animism.a: "Embrace the new faith."
 convert_to_bon_religion.title: "Embrace the Bon Faith"
 convert_to_bon_religion.desc: "The ideas of the Tibetan Bon have quickly found a home in [ROOT.GetCountry.GetName], and our people have taken to prayers quicker than anyone could expect. Maybe it is time for us to put aside our [ROOT.GetCountry.GetReligion.GetName] faith and devote ourselves entirely to the Bon rituals?"
 convert_to_bon_religion.a: "Embrace the new faith."
 convert_to_matrist_religion.title: "Embrace the Matrist Traditions"
 convert_to_matrist_religion.desc: "The Aestuian Mother Goddess has found a home in [ROOT.GetCountry.GetName], and our people are putting aside all our old rituals in favor of those in her honor. It is time we do the same."
 convert_to_matrist_religion.a: "Embrace the new faith."
 convert_to_pre_indo_european_religion.title: "Embrace Marite Faith"
 convert_to_pre_indo_european_religion.desc: "More and more of our people are seeking the advice of the priests of Mari, the Goddess on the mountain, and offer gifts to Aatxe in exchange of protection. It is time for us to take up their worship officially."
 convert_to_pre_indo_european_religion.a: "Embrace the new faith."
 convert_to_puntic_religion.title: "Embrace Waaq"
 convert_to_puntic_religion.desc: "For years, traders in our ports have spoken of the supreme deity known as the Waaq, who has no other to stand beside him, and the stories of his never-ending love and divine authority have resonated with our people, who seek to become his children. Perhaps we could all seek the comforting embrace of Waaq?"
 convert_to_puntic_religion.a: "Embrace the new faith."
 convert_to_italic_pantheon.title: "Embrace Italic Faith"
 convert_to_italic_pantheon.desc: "The faith of the Italic is the same as the faith of the ancient Latine, and has been spread throughout the lands. Let us embrace the Italic and pursue one of these cults as our own."
 convert_to_italic_pantheon.a: "Embrace the new faith."
 convert_to_illyrian_pantheon.title: "Embrace Illyric (Sauelic)"
 convert_to_illyrian_pantheon.desc: "The faith of the Illyrians comes from ancient Paleo-Balkan beliefs. Once part of the same beliefs as Zalmoxian and Anatolian, Illyric is distinct in its decentralized cults. The Cult of the Sun in the North, Cult of the Serpent in the South, and the new Cult of the Thracian Horseman coming from th East. Perhaps we should adopt Illyric beliefs and pursue one of these cults as our own."
 convert_to_illyrian_pantheon.a: "Embrace the new faith."
 convert_to_illyrian_pantheon_snake.title: "Embrace Illyric (Avisic)"
 convert_to_illyrian_pantheon_snake.desc: "The faith of the Illyrians comes from ancient Paleo-Balkan beliefs. Once part of the same beliefs as Zalmoxian and Anatolian, Illyric is distinct in its decentralized cults. The Cult of the Sun in the North, Cult of the Serpent in the South, and the new Cult of the Thracian Horseman coming from th East. Perhaps we should adopt Illyric beliefs and pursue one of these cults as our own."
 convert_to_illyrian_pantheon_snake.a: "Embrace the new faith."
 convert_to_agama.title: "Embrace Agamic Faith"
 convert_to_agama.desc: "The Agama faith of the Dravidians is ancient, spanning back since the dawn of civilization. Let us promote Agamic among our subjects and at our court."
 convert_to_agama.a: "Embrace the new faith."
 convert_to_ajivika.title: "Embrace Ajivika"
 convert_to_ajivika.desc: "The great Makkhali Gosala preached his ways to his Ajivika sect. Preaches he that fate is absolute, that everything is preordained. Let us submit to our fate of embracing Ajivika."
 convert_to_ajivika.a: "Embrace the new faith."
 convert_to_burmese_religion.title: "Embrace Nat Worship"
 convert_to_burmese_religion.desc: "The religion of the peoples of the South East of the world have spread to us. They say that within every living thing are Nats, and Nats are in every living thing. Perhaps we should officially embrace Nat worship."
 convert_to_burmese_religion.a: "Embrace the new faith."
 convert_to_vaksh_religion.title: "Embrace Voxite"
 convert_to_vaksh_religion.desc: "The religion of the river Vakhsh has become widespread in the lands we adminstrate. The people worship the sun God Mihr Oir in the morning with the sunrise and name their children after Ramset, the god of people. Let Lord Vish carry us to enlightenment, and worship Vakhsh and his holy pantheon of deities."
 convert_to_vaksh_religion.a: "Embrace the new faith."
 convert_to_nilotic_pantheon.title: "Embrace Nhialic"
 convert_to_nilotic_pantheon.desc: "The worship of the Kowth Nhial and many Colwics of the Nilotic people has found itself widespread within our lands. Perhaps it is time to accept the gods of the Upper Nile as the gods of our own people."
 convert_to_nilotic_pantheon.a: "Embrace the new faith."
 convert_to_nuragic_pantheon.title: "Embrace Nuragic"
 convert_to_nuragic_pantheon.desc: "The native religion of the Nuragic peoples of Sardinia and Corsica is a tradition stretching back a thousand years. The great father of the Nuragics entices us to give him worship. Let us embrace the worship and beliefs of this religion."
 convert_to_nuragic_pantheon.a: "Embrace the new faith."
 convert_to_mithra_religion.title: "Embrace Mithraic"
 convert_to_mithra_religion.desc: "We have noticed the prevalance of the glorious god of the Sun, Mithra, along with his Mithraic faith. The Magi priests heralding from Medes certainly are a convincing entity. Our state may benefit from accepting Mithra and the practices of Mithraism as our own."
 convert_to_mithra_religion.a: "Embrace the new faith."
 convert_to_uralic_pantheon.title: "Adopt Ilmaric Beliefs"
 convert_to_uralic_pantheon.desc: "The supreme god of the sky, Ilma, has been adopted by many of our people. They talk of the vibrant light of the first dawn and the deafening black of the last ray of the sun. From the Finns to the Ugrics, and to us as well now, the lights shine. It is time to open the curtains of the nation and adopt the Ilamric religion."
 convert_to_uralic_pantheon.a: "Embrace the new faith."
 convert_to_hurrian_pantheon.title: "Adopt Hurrian Beliefs"
 convert_to_hurrian_pantheon.desc: "The Hurrio-Hittite beliefs are those of 1000 gods! As the once mighty Bronze Age Empire declared itself the lands of the thousand gods, perhaps our own gods belong to that pantheon?"
 convert_to_hurrian_pantheon.a: "Embrace the new faith."
 convert_to_hatti_religion.title: "Adopt Hattic Pantheon"
 convert_to_hatti_religion.desc: "Once, in the lands we now know as Anatolia, we called it the lands of the Hatti. And as fate would have it, the lands of the Hatti have once more returned to the faith of the ancient people. Shall we too accept the resurgent Hattic pantheon?"
 convert_to_hatti_religion.a: "Embrace the new faith."
 convert_to_chinese_religions.title: "Embrace Shenic Faith"
 convert_to_chinese_religions.desc: "Like a great light shining at the top of a lofty tower, the Shenic Faith casts long shadows over our people, who have all turned like sunflowers to face the glow coming from strange gods. And yet, are they so strange? Are their ways that different from our own? Are not the similarities greater?"
 convert_to_chinese_religions.a: "Embrace the new faith."
 # decisions/religious_conversion_ti.txt (Indomita)
 convert_to_manichaean.title: "Adopt Manichaeism"
 convert_to_manichaean.desc: "Study the gnostic texts, moved by the life and writings of Mani, the final reincarnated prophet of the world's great religions, purified of corruption, and dedicate the realm to this new enlightenment."
 convert_to_manichaean.a: "Embrace the new faith."
 convert_to_taoism.title: "Follow the Tao"
 convert_to_taoism.desc: "In the quiet corners of our land, the teachings of Taoism have found a home, offering profound insights into the mysteries of existence. As whispers of the way of the Universe, the Tao, permeate through all layers of our society, we confront a pivotal question. Should we wholeheartedly embrace the wisdom of Taoism as the guiding light of our nation, guiding us on a unique path of understanding and serenity?"
 convert_to_taoism.a: "Embrace the new faith."
 convert_to_confucian.title: "Adopt Confucian Doctrines"
 convert_to_confucian.desc: "The teachings of Confucianism, rooted in principles of social harmony, filial piety, and virtuous leadership, have found their way into the hearts of our people. Shall we formally adopt Confucian ethics and accept the moral compass that it offers as the guiding philosophy of our nation?"
 convert_to_confucian.a: "Embrace the new faith."
 convert_to_mohism.title: "Adopt Mohist Doctrines"
 convert_to_mohism.desc: "A person should care equally for oneself as a person cares for another. These are the words of Mozi. The teachings of Mohism, emphasizing the virtue of impartial care and the rejection of unnecessary conflicts, have taken root in our land. As our people increasingly embrace these principles, it raises the question; should we formally adopt Mohist doctrines as the guiding philosophy of our nation?"
 convert_to_mohism.a: "Embrace the new faith."
 convert_to_yi_religions.title: "Embrace Yi Faith"
 convert_to_yi_religions.desc: "The mysteries of the Yi Faith, which has its roots in lands far from our own, are tantalizing, promising a greater understanding of one's place in the universe after careful study. Considering that many of our people currently practice the Yi Faith, it would be a simple thing to make it official for us all."
 convert_to_yi_religions.a: "Embrace the new faith."
 convert_to_wa_religions.title: "Embrace Kodo Faith"
 convert_to_wa_religions.desc: "The island of Wa is a land filled with fierce tribes, resistant to foreign diplomatic overtures and savage defenders of their homelands - traits, some say, that come from their faith, which is a source of their power. Perhaps we could embrace their religious ways as our own?"
 convert_to_wa_religions.a: "Embrace the new faith."
 convert_to_ainu_religion.title: "Embrace Fuchite"
 convert_to_ainu_religion.desc: "The spirits of the Jomon, the Kamuy, enter our realm. Kamuy is said to embody everything, from the men to the animals to the weapon used to kill the animal. Is it true that Kamuy can embody our own realm as well?"
 convert_to_ainu_religion.a: "Embrace the new faith."
 convert_to_tunguistic_religion.title: "Adopt Tungusic Shamanism"
 convert_to_tunguistic_religion.desc: "The spirit of Abka Enduri calls out to our people, drawing them into the mystical allure of Tungusic Shamanism. As our citizens increasingly heed this divine call and embrace these ancient beliefs, and our women become Shamans themselves, the question naturally arises, should we formally adopt Shamanism as the guiding spiritual tradition of our nation, cultivating a deeper connection to the mystical forces that envelop our existence?"
 convert_to_tunguistic_religion.a: "Embrace the new faith."
 convert_to_hu_religions.title: "Embrace Tengri Tradition"
 convert_to_hu_religions.desc: "The tenets of the Tengri Faith have become attractive to our people for multiple reasons; they are envious of the military successes that come to its adherents, believing in the simple directness of Tengri faith over our complicated system of ritualized practice. It is possible that they speak truth...perhaps we have lost our way and should worship the winds and the moon."
 convert_to_hu_religions.a: "Embrace the new faith."
 convert_to_nivkh_religion.title: "Embrace Yzic Beliefs"
 convert_to_nivkh_religion.desc: "These 'masters, called the Yz, speak to us now. They call to our people, and our people have begun to accept them into their hearts. Some even claim the ability to become one with the fox and take on the form of the vulpine. We should embrace Yzic as the faith of our nation."
 convert_to_nivkh_religion.a: "Embrace the new faith."
 convert_to_tai_religion.title: "Embrace Moism"
 convert_to_tai_religion.desc: "The religion of the Zhuang people, Moism, has become quite popular within our country. Baeuqloxdoh could bless our nation if we so choose to accept him and the pantheon prominent to the Eastern Tai culture."
 convert_to_tai_religion.a: "Embrace the new faith."
 #P:A TODO No Imperator name for this decision; generated from its key
 convert_to_satsana_phi_religion.title: "Embrace Satsana Phi Religion"
 #P:A TODO No Imperator description for this decision
 convert_to_satsana_phi_religion.desc: "The faith of our neighbours has found followers at our court. Perhaps it is time to make it our own."
 convert_to_satsana_phi_religion.a: "Embrace the new faith."
 convert_to_funan_religion.title: "Embrace Yungism"
 convert_to_funan_religion.desc: "The spirit of Funan entices our people. Many in our capital have started revering these 'Yungs.' These Yungs represent the natural world around us, and it's apparent that it has wide appeal for our citizens. It remains to be said whether the nation should accept these Yungist beliefs."
 convert_to_funan_religion.a: "Embrace the new faith."
 convert_to_austronesian_religion.title: "Embrace Dukunic Beliefs"
 convert_to_austronesian_religion.desc: "Shamans (Dukuns) across our lands have long claimed to have heard whispers from a world beyond our own, but recently these whispers have grown into a deafening cacophony. Ghostly spirits referring to themselves as Hantu claim to offer guidance and protection in the realms beyond our own. Many call for us to abandon the spiritual practices of our ancestors and embrace the worship of these mysterious spirits."
 convert_to_austronesian_religion.a: "Embrace the new faith."
 convert_to_masto_pantheon.title: "Accept Mastoic Beliefs"
 convert_to_masto_pantheon.desc: "The Masto god and his powerful siblings have made an impression upon our country. Some even are seeking the spiritual connection of the Jhankri. We too could accept the religion of the Dardic people as our national faith."
 convert_to_masto_pantheon.a: "Embrace the new faith."
 convert_to_charvaka.title: "Adopt Carvaka Principles"
 convert_to_charvaka.desc: "The questioning of gods themselves has taken root in our capital. Is there an afterlife to look forward to, or is it all just mortal folly? The Carvaka populace has their answer, shall we ourselves forsake the gods in favor of the principles of Carvaka?"
 convert_to_charvaka.a: "Embrace the new faith."
 convert_to_elamite_pantheon.title: "Accept Humbanic Pantheon"
 convert_to_elamite_pantheon.desc: "The gods who would terrorize those of Sumer and Akkad, led by Humban in Anshan and Inshushinak in Susa, have found themselves in the hearts of our people. And now we ask, should we accept the religion of Elam as the religion of our nation?"
 convert_to_elamite_pantheon.a: "Embrace the new faith."
 convert_to_baiyue_religions.title: "Embrace Baiyue Faith"
 convert_to_baiyue_religions.desc: "The empathetic approach of the Baiyue Faith has won over many converts in our settlements and cities. Claiming that the mindful observance of the sacredness of everything around us provides meaning to their lives, they ask us to join them in this bliss."
 convert_to_baiyue_religions.a: "Embrace the new faith."
 convert_to_taiwan_religion.title: "Embrace Hanitu Religion"
 convert_to_taiwan_religion.desc: "The Formosian beliefs originating from the island of Taiwan have begun to appeal to our own people. The Hanitus, Kawas, and more seem to call to us. Shall we follow in the footsteps of Princess Balenge and wed ourselves to this Hanitu religion?"
 convert_to_taiwan_religion.a: "Embrace the new faith."
 convert_to_pinoy_religion.title: "Embellish Anito Beliefs"
 convert_to_pinoy_religion.desc: "The diverse spirits of the Philippine islands, the Anito, have come to be loved in our own nation. The rainbow of Balangaw should bless our skies as they do for the archipelago they came from. Let us accept the Anito as our own beliefs."
 convert_to_pinoy_religion.a: "Embrace the new faith."

 # decisions/trade_good_decisions.txt
 myrrh_province_decision_1.title: "Arabian Myrrh"
 myrrh_province_decision_1.desc: "The myrrh of Arabia is renowned the world over, and there never seems to be a lack of demand for it. There are opportunities for us to increase our production of this valuable product, but we will need more workers to meet the demand."
 myrrh_province_decision_1.a: "Expand production."
 myrrh_province_decision_2.title: "Myrrh of Qana"
 myrrh_province_decision_2.desc: "Qana produces a type of myrrh that is the favorite of those with refined tastes, and therefore commands a fetching price in the markets. It is currently produced in small amounts, but we could potentially expand our operations there and make a great deal of money."
 myrrh_province_decision_2.a: "Expand production."
 sugar_province_decision_1.title: "Sugar of Caritra"
 sugar_province_decision_1.desc: "On the plains near Caritra, where the streams meet the land to form a small delta, there grows a sugarcane that is abundantly juicy and sweet. This area is known for the sugar that it makes, and with our helping hand, we can make even more."
 sugar_province_decision_1.a: "Expand production."
 cinnabar_province_decision_1.title: "Cinnabar of Mirobriga"
 cinnabar_province_decision_1.desc: "The cinnabar that is found on the plains of Mirobriga rivals that found in the mountains, making the mining of this precious stone an easier endeavor for our people. Why not expand what we currently do to produce it? We know there is a hunger for this mineral, and we shall benefit."
 cinnabar_province_decision_1.a: "Expand production."
 cinnabar_province_decision_2.title: "Cinnabar of Carnium"
 cinnabar_province_decision_2.desc: "The mountains of Carnium, lofty and majestic, have a barely-contained secret; they are filled with cinnabar, making this region capable of supporting mines. If we continue to invest in its production here, we shall see many rewards from it."
 cinnabar_province_decision_2.a: "Expand production."
 cinnabar_province_decision_3.title: "Cinnabar of Singidunum"
 cinnabar_province_decision_3.desc: "The lands of Singidunum are known for one thing, and one thing only; the cinnabar that is produced in this area, which proceeds at a satisfactory rate. There are, however, things we could do to increase our production. We know that we will never have a problem selling any surplus we accumulate."
 cinnabar_province_decision_3.a: "Expand production."
 lapis_province_decision_1.title: "Lapis Lazuli of Eukratideia"
 lapis_province_decision_1.desc: "Travelers to the lands of Bactria come for many reasons, the lapis lazuli that is found in the mines of Eukratideia being one of them. This precious stone fetches prices that ensure the economic stability of this region - we should mine as much of this as we can."
 lapis_province_decision_1.a: "Expand production."
 jade_province_decision_1.title: "Jade of Pishan"
 jade_province_decision_1.desc: "Although Pishan currently produces jade at an acceptable level, we know that if we but invest a little more, every coin that we spend shall be doubled, tripled in time. It is worth the cost to expand production here."
 jade_province_decision_1.a: "Expand production."
 silk_province_decision_1.title: "Silk of Madra"
 silk_province_decision_1.desc: "The silk garments that are made in Madra are widely hailed for their beauty and elegance, and a staggering amount of coins flows in and out of the silk markets there every day. It is worth investing in the industry there, as the benefits are obvious."
 silk_province_decision_1.a: "Expand production."
 silk_province_decision_3.title: "Silk of Alexandreia Eschate"
 silk_province_decision_3.desc: "Alexandreia Eschate currently produces silk that is excellent and admired for its lightness, and with a little bit of investment into the area, we could see this thriving industry really begin to expand."
 silk_province_decision_3.a: "Expand production."
 dates_province_decision_1.title: "Dates of Augila"
 dates_province_decision_1.desc: "The dates that come from Augila are some of the best that can be had, plump and extremely chewy, and there are ways that we could produce even more of them, if we meet certain criteria. It is worth the time and effort to expand this industry."
 dates_province_decision_1.a: "Expand production."
 amber_province_decision_1.title: "Amber of Vorganium"
 amber_province_decision_1.desc: "There is amber found in the forests of Vorganium, making this region one that has been contested by those envious of its bounty. Although we currently produce a great deal of the substance, we could increase our efforts and extract even more - we would surely be rewarded for our efforts."
 amber_province_decision_1.a: "Expand production."
 amber_province_decision_2.title: "Amber of Rugia"
 amber_province_decision_2.desc: "The amber that is taken from the forests near Rugia is used to make all manner of jewelry, bringing a great deal of wealth to the region. Although the Rugians are content with what they currently produce, by investing into the region, everyone stands to gain from the growth of the amber market."
 amber_province_decision_2.a: "Expand production."
 metals_province_decision_1.title: "Precious Metals of Brigantia"
 metals_province_decision_1.desc: "The precious metals that are found near Brigantia are bountiful; we are truly fortunate to have such wealth available to us. We should make every effort to extract as much from the mines as we can, for it can only mean good things for our people."
 metals_province_decision_1.a: "Expand production."
 glass_province_decision_1.title: "Glass of Tuci"
 glass_province_decision_1.desc: "The glass that is made in Tuci brings trade ships to this island, and is responsible for causing a great deal of good things to happen for our people. We should make every effort to expand our production of this valuable tradegood."
 glass_province_decision_1.a: "Expand production."
 gemstones_province_decision_3.title: "Gemstones of Tylos"
 gemstones_province_decision_3.desc: "Although the mines on the island of Tylos are relatively small when compared to others, they are more fruitful than one might believe. It would be a trivial thing to expand our production of these legendary gemstones."
 gemstones_province_decision_3.a: "Expand production."
 gemstones_province_decision_4.title: "Pearls of Korkei"
 gemstones_province_decision_4.desc: "The pearls found in Korkei often are destined for trade far away from home waters; the merchants happily buy everything that we sell to them and still beg us for more. Expanding our production isn't the worst of ideas; we will benefit in unseen ways."
 gemstones_province_decision_4.a: "Expand production."
 papyrus_province_decision_1.title: "Papyrus of Per-Selk"
 papyrus_province_decision_1.desc: "The papyrus of Per-Selk is the finest produced in the region, highly-desired by scribes and thus practically impossible to find in the markets. By expanding production there, we would have many grateful authors thanking us."
 papyrus_province_decision_1.a: "Expand production."
 cedar_province_decision_1.title: "Cedar of Olbe"
 cedar_province_decision_1.desc: "The wise citizens of Olbe built their city close to the nearby cedar forests, taking full advantage of the resources available to them. Because of their familiarity with woodworking, the cedar that they produce in this region is unequalled - it should be expanded!"
 cedar_province_decision_1.a: "Expand production."
 cedar_province_decision_2.title: "Cedar of Massaka"
 cedar_province_decision_2.desc: "The expansive cedar forests in the mountains of Massaka are miraculous in their beauty, and the wood that is taken from this land is known for its magnificence. Whether it is made into furniture or ships that will grace waters far from here, let us continue to reap the bounties of the forest."
 cedar_province_decision_2.a: "Expand production."
 cedar_province_decision_3.title: "Cedar of Paphos"
 cedar_province_decision_3.desc: "The cedar that grows near Paphos is the primary reason that her ships are so sleek and sturdy; a wonderful thing, to have such abundant forests near our ports. We should continue to fell as many trees as we can, knowing that we can sell whatever we don't decide to use ourselves."
 cedar_province_decision_3.a: "Expand production."
 spices_province_decision_2.title: "Spices of Dioscoridus"
 spices_province_decision_2.desc: "It is said that a royal kitchen is not complete unless the spice melange that they make in Dioscoridus is in their pantries. The demand for these spices outweighs our capacity to currently provide, but we can take steps to ensure that mouth-watering dishes are properly seasoned."
 spices_province_decision_2.a: "Expand production."
 wine_province_decision_1.title: "Vineyards of Massalia"
 wine_province_decision_1.desc: "Since the Phokaians brought grape vines from their distant home and planted them upon these sun-drenched, wine has been the lifeblood of this city. Wine goes up the river into Gaul, and slaves and riches come down."
 wine_province_decision_1.a: "Expand production."
 #P:A TODO No Imperator name for this decision; generated from its key
 dates_province_decision_2.title: "Gerrha Dates"
 #P:A TODO No Imperator description for this decision
 dates_province_decision_2.desc: "There are opportunities for us to increase the production of this valuable good, but we will need more workers to meet the demand."
 dates_province_decision_2.a: "Expand production."
 pearls_province_decision_1.title: "Pearls of Tylos"
 pearls_province_decision_1.desc: "The Isle of Tylos in the Persian Gulf is famed for its pearl diving traditions and export of finest white pearls in the known world. The pearls of Tylos were supplied to the kings of Sumeria, Assyria and Babylon in ancient times."
 pearls_province_decision_1.a: "Expand production."
 pearls_province_decision_2.title: "Pearls of Arpad"
 pearls_province_decision_2.desc: "The Phoenecian traders held a stranglehold on the pearl trade in the Eastern Mediterranean, with Greeks sourcing most of their pearls from traders sailing ships from cities such as Arpad. Phoenecian pearls were a prized gem amongst all elites and royalty in the region, worth more than gold itself."
 pearls_province_decision_2.a: "Expand production."
 tea_province_decision_1.title: "Tea of Pi"
 tea_province_decision_1.desc: "The cultivation of tea began in the Sichuan basin several millenia ago by the Shu and Ba peoples, who traded the leaves to Chinese royalty at least since the Zhou period. After the Qin conquest of the Shu and Ba, and subsequent colonization campaign in the Sichuan basin, the Qin leaders proliferated the growth of tea trees throughout China, as the drink was valued for its medicinal properties, taste and mild stimulatative effects."
 tea_province_decision_1.a: "Expand production."
 tea_province_decision_2.title: "Tea of Qiongdu"
 tea_province_decision_2.desc: "While the Sichuan basin was the most well-known area of tea cultivation, areas further south along the Tibetan rim also cultivated the tea leaf since ancient times. The people of the Qiondgu tribe were among these early southern cultivators."
 tea_province_decision_2.a: "Expand production."
 tortoiseshell_province_decision_1.title: "Tortoiseshell of Apocopa"
 tortoiseshell_province_decision_1.desc: "The shores along African coast of the Erythraean Sea produce many prized goods, perhaps none as sought after as their tortoiseshell. Near the port of Apocopa, commerce-driven tribesmen produce the finest specimens of this good in the entire world. Ports as far as India and Rome seek trade with the coastal Africans, and are willing to pay almost any price for the ornate tortoiseshell fished by the locals."
 tortoiseshell_province_decision_1.a: "Expand production."
 cowrieshells_province_decision_1.title: "Cowrie Shells of Huvadhoo"
 cowrieshells_province_decision_1.desc: "Cowrie shells have been a tradtional currency of the circum-Indian Ocean region for millenia. Among the shell-crafting traditions, the production and proliferation of beautiful shell artifacts and currency by the natives of the Maldive Islands stands out for its longevity and the volume of production."
 cowrieshells_province_decision_1.a: "Expand production."
 opium_province_decision_1.title: "Opium of Aphroditopolis"
 opium_province_decision_1.desc: "The opium has long been cultivated in Egypt, numbing the minds and nerves of countless insomniacs and the sick for as long as its properties have been understood. In ages past, Aphroditopolis was an important place for the production of opium, a distinction it retains until today."
 opium_province_decision_1.a: "Expand production."
 opium_province_decision_2.title: "Opium of Pharga"
 opium_province_decision_2.desc: "The narcotic qualities of opium were first described by the ancient Sumerians, who referred to it as the 'joy plant' and discovered a wide variety of medicinal uses. In Pharga, these old ways have not been forgotten, and there remains a local expertise with the mysterious plant."
 opium_province_decision_2.a: "Expand production."
 opium_province_decision_3.title: "Opium of Karpaseia"
 opium_province_decision_3.desc: "Opium has long been used on Cyprus, finding its way into a number of religious ceremonies that are much beloved by the people. Sleep is never far away when the opium of Karpaseia is administered."
 opium_province_decision_3.a: "Expand production."

