 age_0_heroes: "Age of Heroes"
 age_0_heroes_desc: "Tales spread from far and wide of gods and man, of grand journeys and great battles. Myth, of one eyed giants, of infernal witches, of lands of salt and smoke. There is truth in legends, lost along the way of a good story - stories not of men, but of Heroes!"

 age_1_princes: "Age of Princes"
 age_1_princes_desc: "With the height of the classics comes a coming together of the world, as explorers chart distant lands and conquerors deign to conquer them. Great kings will rise and fall, new kingdoms will rule, but all will lay claim to the legacies of those touched by the gods."

