 #
 # Institutions
 # Age 0
 urbanization: "Urbanization"
 urbanization_desc: "The advent of agriculture has given rise to great society and even greater cities. Nomadic pastorialism gives way to static settlements, where man is no longer beholden to subsistence but instead able to pursue new roles, and higher goals. Civilisation begins where men grow out of their tribal roots, and beckons a higher calling - to create, to build, and to conquer."
 writing: "Writing"
 writing_desc: "A good oral history is one that is accurate; the best is one that is entertaining. From man's desire for spectacle comes mythos, and spawns tales of bull-man cross breeds, the perils of wisdom tempered with ego, and world spanning, life giving trees. The merits of writing lend truth to these tales, and permanence to their stories. Whether words are written, imprinted, or carved, they allow for a timeless record through which understanding, cooperation, and commerce can flourish."
 metallurgy: "Iron Working"
 metallurgy_desc: "Any society can find metals, but the knowledge to work them into tools places man in reach of wonders. Those blacksmiths who learn to unite metals find themselves outfitting soldiers no longer with pelt rags and stone clubs, but armour and shields, spear and sword. Works of stone are no longer limited to flint knappings, but of chiseled marble, great fashioned monoliths to gods and kings. A man adorned in jewels and bronze, adorned with silver and gold, may find the title of chief no longer fits such majesty, and reach forth to claim the title of king - or perhaps even king of kings."
 horsemanship: "Horsemanship"
 horsemanship_desc: "P:A TODO"

 # Age 1
 philosophy: "Philosophy"
 philosophy_desc: "Philosophy, the study of all things, encompasses all things. Be it the existence of man, his presence within the world, and his role around it, the wisest of society ponder such questions in a wide manner of thinking. One may reduce the world to the how and why in a logical sense, another the metaphysical and primal sources of all things. Or, alternatively, one can be a philsopher by throwing urine at the perceived artificial values of society"
 coinage: "Coinage"
 coinage_desc: "The humble coin bears the weight of a nation's lineage, travelling further than any man of his country and many times his worth. A king's mint can remind all underneath who they serve, for all they need do is look at what they're paying with. A general can commemorate his great victories for time immemorial, and the faithful can have all bear witness to the golden splendour of their gods -- what may seem to be simply a useful tool for commerce and trade becomes worth far more than the metal it's printed on."
 standing_army: "Standing Army"
 standing_army_desc: "Distancing the damage done to a nation and its people is the first step towards military might; to what end does the farmer benefit when the casualties of war are his farm, his food, his family? Supplementing the standard militias with a permanent force, drawing upon a lord's elite retinue, a militarised class of nobles at the beck and call of their king, or simply mercenaries providing specialised support -- the addition of full-time soldiers with their wealth of experience is no doubt a wise usage of our own wealth, and to sacrifice those whose sole purpose is to die in battle is far better than the farmer needed to feed the survivors."
 democracy: "Democracy"
 democracy_desc: "P:A TODO"

 # Age 2
 academia: "Academia"
 academia_desc: "P:A TODO"
 public_works: "Public Works"
 public_works_desc: "A monkey that hoards a trillion bananas would rightfully be beaten to death by their fellow monkies - for the rich to spend their hard earned wealth, or at the very least make the appearance of such, on great works of public service will surely avoid them that same fate. Aqueducts bringing fresh life giving water into the middle of urban sprawl, colossal arenas where enslaved men are sacrificed upon the altar of entertainment, great temples that will outlast the worship of their gods; to make public service the price of being deemed one of society's honourable men is to work in the favour of both."
 military_standardization: "Military Standardisation"
 military_standardization_desc: "The armies of the antiquity have always had professionals whose bread and butter is blood and bronze. To turn the art of war into a bloody science is to change conflict forever -- to establish uniform weaponry is to industrialise the butchery of battle; to provide pathways for promotion is to entice man to kill. No longer is warfare the domain of warbands, but the fields of which empires flex their might."
 legalism: "Legalism"
 legalism_desc: "What can be grander or nobler than jurisprudence, or what can be more insignificant and quibbling than the practice of lawyers? Are those who adopt this profession altogether ignorant of the principles of universal legislation; or are they are far more attentive to the civil law, which gives them a hold on the interests of the people? Are then the sublime and recondite principles of jurisprudence less necessary or less useful? On the true objects of thought and action, for which all are born and sent into the world, and the beautiful association and fellowship which bind men together by reciprocal charities: When we have fathomed these grand and universal principles of morals, we shall discover the true fountain of laws and rights."
