 rel_flavor_buddhist.1.t: "Teaching [country_province.GetName]"
 rel_flavor_buddhist.1.desc: "The people of [country_province.GetName], [country_province.GetProvince.GetName], have barely any Buddhists amongst them even if they are a part of [ROOT.GetCountry.GetName]. We have set up a plan to have some of our locals from the capital to move to the city, to spread the teachings of Buddha."
 rel_flavor_buddhist.1.a: "Send some of our locals to teach them."
 rel_flavor_buddhist.1.b: "Maybe at a later point in time."
 STATIC_MODIFIER_NAME_province_improvement_buddhism_guru_teacher: "Guru Teacher"
 rel_flavor_buddhist.2.t: "A Guru in [country_province.GetName]"
 rel_flavor_buddhist.2.desc: "In the obscure hinterlands of [country_province.GetName], [country_province.GetProvince.GetName], a guru has started to grow famous among the locals for his wisdom and insight. As a teacher of Buddhist dogma, he would surely be able to teach the people of the city more about the faith, and convince them of the true way to enlightenment. Or we could bring the man to our court, and have him teach our people instead."
 rel_flavor_buddhist.2.a: "Let us talk to this guru."
 rel_flavor_buddhist.2.b: "The people of [country_province.GetName] will learn a lot from him."
 rel_flavor_buddhist.4.t: "Reborn Heir"
 rel_flavor_buddhist.4.desc: "Lately our heir [reborn_heir.GetName] has claimed to remember a previous life, and talked about the deeds [reborn_heir.GetSheHe] did in the past. Though some of these memories sounds like some of the ancient rulers of our lands, it is probably just an attempt to try and get out of [reborn_heir.GetHerHis] studies."
 rel_flavor_buddhist.4.a: "Let us look into this."
 rel_flavor_buddhist.4.b: "Ridiculous, get back to your teachers."
 rel_flavor_buddhist.6.t: "Stories of War"
 rel_flavor_buddhist.6.desc: "These last weeks [reborn_heir.GetName] has started to recount several tales of battles and wars from the ancient past. Either [reborn_heir.GetSheHe] has been inspired and finally started learning something from [reborn_heir.GetHerHis] history lessons, or [reborn_heir.GetSheHe] actually took part in these wars.\n\nIn the middle of telling one of these stories, [reborn_heir.GetShortName] stops and ask one of [reborn_heir.GetHerHis] teachers how they think the ancient general in the story won the battle."
 rel_flavor_buddhist.6.a: "With strategy and tactics unlike any seen before."
 rel_flavor_buddhist.6.b: "By inspiring confidence in the troops."
 rel_flavor_buddhist.6.c: "Discipline is the backbone of any army."
 rel_flavor_buddhist.7.t: "Stories of Old"
 rel_flavor_buddhist.7.desc: "As we look more into the potential past lives of [reborn_heir.GetName], it has become clear this is an unique opportunity to form [reborn_heir.GetHerHim] as a person. Our advisors are wondering what kind of stories we want to look into, and what focus we should give [reborn_heir.GetHerHim]."
 rel_flavor_buddhist.7.a: "A silver-tongue will take one far in life."
 rel_flavor_buddhist.7.b: "Faith is an important teacher."
 rel_flavor_buddhist.7.c: "[reborn_heir.GetSheHe|U] needs to understand the bureaucracy of our nation."
 rel_flavor_buddhist.7.d: "A martial upbringing will inspire authority and confidence."
 rel_flavor_buddhist.8.t: "Stories of Faith"
 rel_flavor_buddhist.8.desc: "Lately gurus and wisemen have been asking to meet [reborn_heir.GetName] to talk to [reborn_heir.GetHerHim] about matters of the faith and what [reborn_heir.GetSheHe] can tell them about [reborn_heir.GetHerHis] past lives. We should make sure only the gurus and wisemen we approve of, with the right kind of mindset, are able to talk to and teach [reborn_heir.GetHerHim]."
 rel_flavor_buddhist.8.a: "Someone to teach [reborn_heir.GetHerHim] to fight for our faith."
 rel_flavor_buddhist.8.b: "Chastity teaches tolerance and patience."
 rel_flavor_buddhist.8.c: "Devotion in oneself inspires the devotion of others."
 STATIC_MODIFIER_NAME_character_improvement_buddhist_reborn_wiseman: "Reborn Wiseman"
 STATIC_MODIFIER_NAME_character_improvement_buddhist_reborn_reformer: "Reborn Reformer"
 STATIC_MODIFIER_NAME_character_improvement_buddhist_reborn_general: "Reborn General"
 STATIC_MODIFIER_NAME_character_improvement_buddhist_reborn_philosopher: "Reborn Philosopher"
 rel_flavor_buddhist.9.t: "The Vision of the Past"
 rel_flavor_buddhist.9.desc: "One night [reborn_heir.GetName] starts twisting and turning, almost as if [reborn_heir.GetSheHe] is possessed. When [reborn_heir.GetShortName] finally wakes up, [reborn_heir.GetSheHe] starts telling everyone about the dream [reborn_heir.GetSheHe] had.\n\n[ROOT.GetCountry.Custom('pa_imp_get_type_of_reborn_heir')]"
 rel_flavor_buddhist.9.a: "A reborn wiseman, is it?"
 rel_flavor_buddhist.9.b: "A reformer could be just what we need."
 rel_flavor_buddhist.9.c: "[reborn_heir.GetSheHe|U] must have been a great general."
 rel_flavor_buddhist.9.d: "So [reborn_heir.GetSheHe] was someone with a way with words?"
 get_type_of_reborn_heir_zeal: "[reborn_heir.GetSheHe|U] was once a rich prince, unable to see the hardships of those who lived beneath his rule. Days, weeks and years passed as his people suffered and died, unbeknown to the prince.\n\nWhen the prince finally learned about the struggles of his people, he did not toss them aside or pretend to care. Instead he gave away all his material wealth, and left the life of riches, to walk amongst and get to know those he had once ruled. Gaining great wisdom and insight into existence itself, the old prince now became a great teacher and wiseman of the people who started to gather around him. He lived a long life, sharing the knowledge with the disciples who followed him."
 get_type_of_reborn_heir_finesse: "[reborn_heir.GetSheHe|U] was once the younger of two brothers, raised in a family who had long been part of the political landscape of their nation. As a politician serving his term, he saw the suffering of the veterans who had bled and fought for the nation, and the issues and problems they caused as they were tossed aside after their service had ended.\n\nAfter the death of his brother, who had tried to force through reforms in the political landscape, he picked up the pieces and tried to reform the nation himself. Pushing through several popular reforms, he became one of the most important politicians of his time, popular among the people rather than his peers.\n\nSadly, after the death of one of his enemies he was incorrectly named as the perpetrator, and ended up being murdered in the following conflict."
 get_type_of_reborn_heir_martial: "[reborn_heir.GetSheHe|U] was once a great general of a people seeking revenge on their ancient enemies to the north. Bringing his exotic troops through ancient lands and across tall snow peaked mountains, he descended down upon his faithless enemies.\n\nThough he outsmarted his enemies time and time again, he never managed to siege down their ancient city, and was in the end forced to leave the peninsula as his own home was in danger of being taken by his nemesis.\n\nIn the end he lost the final battle and was exiled from his homeland, only to be hunted down by his enemies and forced to end his life with poison."
 get_type_of_reborn_heir_martial_2: "[reborn_heir.GetSheHe|U] was once a great statesman who led his troops deep into wild lands, filled with warrior tribes unlike any seen before. Pushing back the enemies at every turn, he managed to quell the dangerous lands and force them under his control. As his term was ending, his rivals at home tried to trick him into letting his troops go so they could seize him before he became even more powerful than he already was.\n\nForced into a dangerous civil war against his old friends and allies, he won every battle until there was none left to fight. He thought at the time that pardoning his enemies was the right way to get.\n\nIn the end, the ones he had once pardoned, all gathered together to stab him to death."
 get_type_of_reborn_heir_charisma: "[reborn_heir.GetSheHe|U] was once a wiseman who started questioning traditions and the way of life in the city he lived in. He talked to the youngsters living in the city, asking them questions about every single topic he could think of.\n\nGrowing a small following of his own, people started to look to him for guidance in their life, writing down his words and ideas. Supposedly an oracle even claimed that he was the wisest man there was.\n\nAs his city started to deteriorate, he was partly blamed for misleading the youth, and was forced to end his life with poison."
 rel_flavor_buddhist.15.t: "The Reborn Leader"
 rel_flavor_buddhist.15.desc: "Through conversations with many great wisemen, outsmarting [reborn_heir.GetHerHis] teachers and generally showing great promise as a leader, most people are now convinced [reborn_heir.GetName] does in fact remember previous lives [reborn_heir.GetSheHe] lived.\n\nWith the wisdom of previous lives at [reborn_heir.GetHerHis] fingertips, [reborn_heir.GetSheHe] is sure to be an experienced and wise leader for our people in the coming years."
 rel_flavor_buddhist.15.a: "There are great times ahead of us."
 STATIC_MODIFIER_NAME_local_civilization_pmod_stack: "Urban Development"
 STATIC_MODIFIER_NAME_judea_modifier_12: "Babylon Despoiled"
 STATIC_MODIFIER_DESC_judea_modifier_12: "We took revenge on the Babylonians for our subjugation centuries ago. They now all work as slaves..."
 STATIC_MODIFIER_NAME_samaria_modifier_12: "Nineveh Despoiled"
 STATIC_MODIFIER_DESC_samaria_modifier_12: "We took revenge on the Assyrians for our subjugation centuries ago. They now all work as slaves..."
 STATIC_MODIFIER_NAME_pth_qanat_pmod: "Desert Qanats"
 STATIC_MODIFIER_NAME_germania_mod_56: "Cities in the Forest"
 state_improvement.6.t: "The Coming of the City of [ROOT.GetLocation.GetName]"
 state_improvement.6.desc: "Our extension of new privileges and investments into the local infrastructure has seen [ROOT.GetLocation.GetName] grow from relative humility into a true [ROOT.GetLocation.GetDominantCulture.GetName] city.\nWhile it still has some way to go before it can rival the great cities of our age, the past two years have ushered in a new era of growth and urbanization in this territory."
 state_improvement.6.a: "These are the best of times..."
 STATIC_MODIFIER_NAME_founding_metropolis_in_progress: "Metropolis Under Construction"
 STATIC_MODIFIER_NAME_state_improvement_military_SPA: "Freed Helots"
 STATIC_MODIFIER_NAME_state_improvement_religious_SPA: "Heroic Frieze"
 state_improvement.12.t: "Procurators Installed"
 state_improvement.12.desc: "The powers of our local treasury officials in the [state_improvement_target.GetName] have been expanded, improving their ability to direct local tax collection and labor organization."
 state_improvement.12.a: "Every little helps."
 state_improvement.13.t: "Infrastructure Improved"
 state_improvement.13.desc: "By encouraging investment in the [state_improvement_target.GetName], our local officials have enabled many useless plots to now be put to better use."
 state_improvement.13.a: "Nothing should go to waste."
 state_improvement.14.t: "Commercial Ventures"
 state_improvement.14.desc: "We have encouraged merchants in the [state_improvement_target.GetName] to invest more of their wealth in trade, reassuring them of the security of their outlays."
 state_improvement.14.a: "The movement of goods benefits all."
 state_improvement.15.t: "Cults Sanctioned"
 state_improvement.15.desc: "Our financial encouragement of the local cults in the [state_improvement_target.GetName] has led to the renovation of old shrines and construction of new."
 state_improvement.15.a: "Delighting the gods delights the people."
 state_improvement.18.t: "[local_civilization_target.GetName] Develops"
 state_improvement.18.desc: "Our efforts to improve the infrastructure and town planning of [local_civilization_target.GetName] in [local_civilization_target.GetArea.GetName] have borne fruit, renovating a dilapidated district with proper roads and amenities."
 state_improvement.18.a: "These things take time."
 STATIC_MODIFIER_NAME_state_improvement_admin: "Organized Administration"
 state_improvement.20.t: "Administration Organized"
 state_improvement.20.desc: "After many months of work in [state_improvement_target.GetName] the administration has finally been brought up to standard."
 state_improvement.20.a: "This should get them in shape."
 STATIC_MODIFIER_NAME_state_improvement_manpower: "Proscription Increased"
 state_improvement.22.t: "Proscription Increased"
 state_improvement.22.desc: "After many months of work in [state_improvement_target.GetName] the many more men have been prepared for war."
 state_improvement.22.a: "This should get them in shape."
 STATIC_MODIFIER_NAME_state_improvement_academic: "Academic Pursuits"
 state_improvement.24.t: "Academic Pursuits"
 state_improvement.24.desc: "After many months of work in [state_improvement_target.GetName] the intellectual minds of the province have come to a breakthrough."
 state_improvement.24.a: "Fantastic"
 STATIC_MODIFIER_NAME_state_improvement_civ: "Civilization Efforts"
 state_improvement.26.t: "Civilization Efforts"
 state_improvement.26.desc: "After many months of work in [state_improvement_target.GetName] province has been improved, now all can see it's greatness."
 state_improvement.26.a: "Good"
 STATIC_MODIFIER_NAME_province_improvement_eastern_religion_peaceful_relations: "Peaceful Relations"
 rel_flavor_eastern.1.t: "Conversion in [country_province.GetName]"
#P:A TODO No EU5 equivalent: Imperator named the advisor's office (GetOffice.GetCulturalName); EU5 has no offices, "advisor" used
 rel_flavor_eastern.1.desc: "There has been certain people becoming [ROOT.GetCountry.GetReligion.GetName] in [country_province.GetName], [country_province.GetProvince.GetName], as they believe they will be treated better if they follow the same religion we do. Our advisor [random_advisor.GetName] suggests forcefully converting all of them, using this as an opportunity to turn [country_province.GetName] entirely [ROOT.GetCountry.GetReligion.GetName]."
 rel_flavor_eastern.1.a: "Everyone will convert and become [ROOT.GetCountry.GetReligion.GetName]."
 rel_flavor_eastern.1.b: "We will be happy to introduce those who want to learn our ways."
 rel_flavor_eastern.1.c: "As long as they stay quiet, we do not care what religion they worship."
 rel_flavor_eastern.2.t: "Sister Faith"
#P:A TODO No EU5 equivalent: Imperator named the advisor's office (GetOffice.GetCulturalName); EU5 has no offices, "advisor" used
 rel_flavor_eastern.2.desc: "We have seen some of our people in [country_province.GetName], [country_province.GetProvince.GetName], believe in faiths that are similar yet different to our own. With some effort, we are sure to be able to convince and slowly convert the people to follow [ROOT.GetCountry.GetReligion.GetName] proper.\n\nOur advisor [random_advisor.GetName] points out it could benefit us to leave the people alone to their faith, if we do not want there to be any turmoil in the city. It could portray our ruler [ROOT.GetCountry.GetGovernment.GetRuler.GetName] as a philanthropic and tolerant ruler among the minorities of the city."
 rel_flavor_eastern.2.a: "Let us try to find compromises everyone can agree on."
 rel_flavor_eastern.2.b: "They should live side by side."
 STATIC_MODIFIER_NAME_province_improvement_eastern_religion_fertility_goddess: "Fertility Shrine"
 rel_flavor_eastern.3.t: "Shrine to [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')]"
#P:A TODO No EU5 equivalent: Imperator named the advisor's office (GetOffice.GetCulturalName); EU5 has no offices, "advisor" used
 rel_flavor_eastern.3.desc: "Our advisor [random_advisor.GetName] has asked us to aid [random_advisor.GetHerHim] in raising a shrine to [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] in [country_province.GetName], [country_province.GetProvince.GetName]. It is [random_advisor.GetHerHis] hope that the city will grow into a strong essential part of [ROOT.GetCountry.GetName] under the blessing of [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')], and that we will support the endeavor."
 rel_flavor_eastern.3.a: "[random_advisor.GetName] will have [random_advisor.GetHerHis] funds."
 rel_flavor_eastern.3.b: "We do not have the funds to spare."
 rel_flavor_eastern.4.t: "Zoroastrian Influence"
 rel_flavor_eastern.4.desc: "As the followers of Zoroaster has spread into our lands, more people have begun following his teachings and building their small fire shrines in the honor of their deity Ahuramazda. The latest of these large conversions has been in [country_province.GetName], [country_province.GetProvince.GetName], as a large group of people has taken up the teachings of the Persian prophet.\n\nThe strongest opponent to the Zoroastrians is [random_advisor.GetName], who has often talked about the Persian faith twisting our people. If we want to put an end to these sudden groups of people turning to Zoroastrianism, we would do well by convincing the latest converts to return to their old faith."
 rel_flavor_eastern.4.a: "We will make sure they stay [ROOT.GetCountry.GetReligion.GetName]."
 rel_flavor_eastern.4.b: "Let them follow the faith they want to follow."
 rel_flavor_eastern.5.t: "Hellenic Spokesman"
 rel_flavor_eastern.5.desc: "There has been a Hellenic community in the [country_province.Custom('pa_imp_get_city_type_loc')] of [country_province.GetName], [country_province.GetProvince.GetName], for a long time. In the later years, they have gotten more influenced by the [ROOT.GetCountry.GetReligion.GetName] in the city, and now a spokesman from the community itself has come forward to unite the two groups once and for all.\n\nCharismatic and young, the man has already convinced huge swathes of the community to change religion. With some backing, he would probably be able to turn the whole community [ROOT.GetCountry.GetReligion.GetName], though that would link him with our leadership."
 rel_flavor_eastern.5.a: "They will turn in time, no need to waste our resources."
 rel_flavor_eastern.5.b: "Yes, let us get to know this guy better."
 STATIC_MODIFIER_NAME_dhe_carthage_settled_veterans_modifier: "Carthaginian Veterans Settled"
 STATIC_MODIFIER_NAME_dhe_carthage_occupation_pm: "Carthaginian Occupation"
 STATIC_MODIFIER_NAME_dhe_carthage_yam_shlnu_b_modifier: "Trading Hegemon"
 STATIC_MODIFIER_NAME_dhe_carthage_yam_shlnu_a_modifier: "'Yam Shl'nu"
 STATIC_MODIFIER_NAME_cursed_by_elohim: "Cursed by Elohim"
 rel_flavor_northern.1.t: "Ancestral Guidance"
#P:A TODO No EU5 equivalent: Imperator named the priest's office (GetOffice.GetCulturalName); EU5 has no offices, "priest" used
 rel_flavor_northern.1.desc: "After some of the seers went through a ritual to speak to the ancestors, our priest [random_advisor.GetName] claims the ancestors decreed more freedom to the priests. To convince the masses, several of the priests have used some of their own funds to support several large festivals across [ROOT.GetCountry.GetName].\n\nFollowing this charade would probably make us more popular among our people, though at the expense of our control over the religious elements of our society."
 rel_flavor_northern.1.a: "We will follow our ancestors' wisdom."
 rel_flavor_northern.1.b: "Tighten the control on these ridiculous seers."
 rel_flavor_northern.2.t: "A Sacrifice to the Ancients"
#P:A TODO No EU5 equivalent: Imperator named the priest's office (GetOffice.GetCulturalName); EU5 has no offices, "priest" used
 rel_flavor_northern.2.desc: "It seems our priest, [random_advisor.GetName], is dead set on making [prisoner_character.GetName] a sacrifice to our gods and ancestors. We are not entirely sure why [random_advisor.GetSheHe] has become so obsessed with putting the prisoner out of [prisoner_character.GetHerHis] misery, but it has become annoying how often [random_advisor.GetShortName] has brought the issue up lately.\n\nMaybe we should just give [random_advisor.GetHerHim] [prisoner_character.GetShortName] to put an end to this discussion? It would certainly make the seers more loyal if we fulfill their wish."
 rel_flavor_northern.2.a: "Take [prisoner_character.GetHerHim] for all we care."
 rel_flavor_northern.2.b: "No, [random_advisor.GetShortName] do not decide who we will execute."
 STATIC_MODIFIER_NAME_province_improvement_northern_fertility_rites: "Fertility Rites"
 rel_flavor_northern.3.t: "The Rites of [country_province.GetName]"
 rel_flavor_northern.3.desc: "Some of the youth in the [country_province.Custom('pa_imp_get_city_type_loc')] of [country_province.GetName], [country_province.GetProvince.GetName], have started partaking in old fertility rites, to the chagrin of some of our seers and elders. [random_advisor.GetName] has demanded that we put an end to this, and make sure the youth starts respecting the wishes of their elders once more.\n\nThe rites certainly seem effective though, and the youth seems happier than they used to be."
 rel_flavor_northern.3.a: "Let them, if they so wish."
 rel_flavor_northern.3.b: "[random_advisor.GetShortName] is right, let us put an end to this."
 rel_flavor_northern.4.t: "The Non-[ROOT.GetCountry.GetReligion.GetName] People of [country_province.GetName]"
#P:A TODO No EU5 equivalent: Imperator named the advisor's and the priest's offices (GetOffice.GetCulturalName); EU5 has no offices, "advisor" and "priest" used
 rel_flavor_northern.4.desc: "Our advisor [random_advisor.GetName] has made plans to convert the whole non-[country_province.GetName], [country_province.GetProvince.GetName], to our faith. Though well-meaning originally, [random_advisor.GetHerHis] ideas has become surprisingly bloody as time has passed, drawing the ire of our priest [random_priest.GetName] who already has an agreement with the people of other faiths who lives in the city."
 rel_flavor_northern.4.a: "Make an example, and convert the rest."
 rel_flavor_northern.4.b: "No need to go to such extremes."
 rel_flavor_northern.5.t: "Festival with [neighbor_country.GetName]"
 rel_flavor_northern.5.desc: "As we prepare for another festival here in [ROOT.GetCountry.GetCapital.GetName], we have heard rumors of a similar festival over in [neighbor_country.GetName]. As our two nations get along with one another, this could be a chance for us to come together and celebrate a festival together, and get to know each other better."
 rel_flavor_northern.5.a: "Let us see if they want to work together."
 rel_flavor_northern.5.a.tt: "We send an invitation to [neighbor_country.GetName] to join us for a religious festival."
 rel_flavor_northern.5.b: "No, it has always been a festival for just our people."
 rel_flavor_northern.5.c: "Let us not hold a festival this year."
 northern_flavor_religious_cooperation: "Religious Cooperation"
 rel_flavor_northern.6.t: "Festival with [original_country.GetName]"
 rel_flavor_northern.6.desc: "Our friendly neighbor of [original_country.GetName] has asked us if we want to hold a religious festival with them, to bring our two people together to get to know one another better. This would be a good chance to learn more about their nation and people, and perhaps grow the friendship between the two of us."
 rel_flavor_northern.6.a: "Yes, let us do that."
 rel_flavor_northern.6.b: "We have no interest in their festival."
 rel_flavor_northern.7.t: "Festival in [neighbor_country.GetName] and [ROOT.GetCountry.GetName]"
 rel_flavor_northern.7.desc: "Our preparations has already started when we receive the messenger from [neighbor_country.GetGovernment.GetRuler.GetName] and the [neighbor_country.GetName]. They are happy to join our festival, and appreciate our invitation.\n\nNot long after, a large retinue of their people and soldiers come to [ROOT.GetCountry.GetCapital.GetName] to take part in the festival, as well as inviting our people to visit their own capital of [neighbor_country.GetCapital.GetName].\n\nThis has been a surprising success, and we hope we will be able to get to know our friends among the [neighbor_country.GetName] better in the future."
 rel_flavor_northern.7.a: "Until next time!"
 rel_flavor_northern.8.t: "Festival in [ROOT.GetCountry.GetName]"
 rel_flavor_northern.8.desc: "The days passes without any response from the [neighbor_country.GetName]. In the end, we hold the festival on our own as we always have, and our people seem to have fun with the festivities.\n\nEven after the festival has been concluded, we wonder why they did not even bother answering our invitation."
 rel_flavor_northern.8.a: "Well, at least we had fun."
 rel_flavor_hindu.1.t: "Karmic Change"
 rel_flavor_hindu.1.desc: "[random_priest.GetName] often speaks at length about the choices and decisions [ROOT.GetCountry.GetGovernment.GetRuler.GetName] makes as [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] rules [ROOT.GetCountry.GetName], and what [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] could do different. The topic of karma, and what we can do to improve our karma and how we can rule through good intent and actions."
 rel_flavor_hindu.1.a: "Teach us, [random_priest.GetShortName]."
 rel_flavor_hindu.1.b: "We have other things to do."
 STATIC_MODIFIER_NAME_province_diminishment_unrest_hindu: "Provincial Unrest"
 rel_flavor_hindu.2.t: "Unrest in [country_province.GetName]"
#P:A TODO No EU5 equivalent: Imperator named the marshal's office (GetOffice.GetCulturalName); EU5 has no offices, "general" used
 rel_flavor_hindu.2.desc: "Our [country_province.Custom('pa_imp_get_city_type_loc')] of [country_province.GetName], [country_province.GetProvince.GetName], is struggling with unrest as a group of dissenters has taken control of a subset of the population living in the city. Our general [random_marshal.GetName] has prepared some of our troops to quell this conflict before it escalates further. At the same time, [random_priest.GetName] asks us to treat the revolters with respect, and give them time to change their mind and return to the fold."
 rel_flavor_hindu.2.a: "Put an end to this little revolt."
 rel_flavor_hindu.2.b: "We will wait these dissenters out, like [random_priest.GetShortName] suggested."
 rel_flavor_hindu.3.t: "The Buddhists of [country_province.GetName]"
 rel_flavor_hindu.3.desc: "Though the Buddhists living in [country_province.GetName], [country_province.GetProvince.GetName], has been mostly peaceful in their interactions with the other people living in the city, we have seen the rise of minor conflicts between the different groups. Though we usually try to inspire tolerance and agreement between our people, even those of different faiths, maybe it is time to try to convince these Buddhists to turn to our faith and assimilate better with our people? Then again, if we do not show compassion and tolerance ourselves, how can we expect it of others?"
 rel_flavor_hindu.3.a: "Let us turn them to Hinduism."
 rel_flavor_hindu.3.b: "Leave them be, they do not harm anyone."
 STATIC_MODIFIER_NAME_province_improvement_hindu_pilgrimage_money: "Pilgrimage Location"
 STATIC_MODIFIER_NAME_province_improvement_hindu_pilgrimage_peace: "Pilgrimage Location"
 rel_flavor_hindu.4.t: "The Pilgrims in [country_province.GetName]"
 rel_flavor_hindu.4.desc: "The least years we have seen a huge influx of pilgrims traveling to [country_province.GetName], [country_province.GetProvince.GetName], as it has become known as a holy site among the Hindus living nearby. If we so wish, this seems like a great opportunity to make a lot of money on these pilgrims dropping by, or we could try and garner some popularity among the populace by making sure [country_province.GetName] is as inviting and well-taken care of as can be."
 rel_flavor_hindu.4.a: "Let us make sure this will be a worthwhile endeavor."
 rel_flavor_hindu.4.b: "[country_province.GetName] will be well-known for its beauty far and wide."
 STATIC_MODIFIER_NAME_country_improvement_hindu_grand_ceremony: "Large Festival Boon"
 STATIC_MODIFIER_NAME_country_improvement_hindu_ceremony: "Festival Boon"
 rel_flavor_hindu.5.t: "Festival in [ROOT.GetCountry.GetName]"
 rel_flavor_hindu.5.desc: "We have seen mutterings both in court and in the city these last weeks. It seems our populace and advisors are just generally displeased with the current situation in [ROOT.GetCountry.GetName]. One night, [random_priest.GetShortName] mentions how a large festival might excite and inspire our downtrodden populace."
 rel_flavor_hindu.5.a: "The festivities will span all of [ROOT.GetCountry.GetName]."
 rel_flavor_hindu.5.b: "A festival will be held in the most important territories."
 rel_flavor_hindu.5.c: "We have more important things to spend our resources on."
