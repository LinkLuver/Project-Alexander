 # on_office_gained.txt
 office_gain.4.t: "Breakthrough!"
 office_gain.4.desc: "The talent of [innovation_giver.GetName] knows no bounds. In [innovation_giver.GetHerHis] role as researcher, [innovation_giver.GetSheHe] dictates that [innovation_giver.GetHerHis] capacity for further innovation has increased.\n\nWe are sure to benefit from this situation."
 office_gain.4.a: "Splendid!"

 # tribal_fun.txt
 tribal_fun_inv.1.t: "A Noteworthy Find"
 tribal_fun_inv.1.desc: "My [ROOT.GetCountry.GetGovernment.GetRulerTitle], when sorting through the loot from one of our last raids, we discovered an interesting piece of parchment. There are circles drawn on it, and some mystical symbols, which our priest assures us are representations of numbers. Our priest can read, unlike many others, and assures us its worth. \nHowever, one of our more distinguished warriors, [not_bruce_lee.GetName] has already laid claim to the piece, arguing that [not_bruce_lee.GetSheHe] likes what it looks like, although [not_bruce_lee.GetSheHe] doesn't seem unreasonably averse to a deal, for the right price that is."
 tribal_fun_inv.1.a: "Some gold will convince [not_bruce_lee.GetHerHim]."
 tribal_fun_inv.1.b: "Our [ROOT.GetCountry.GetGovernment.GetRulerTitle] can be very convincing."
 tribal_fun_inv.1.c: "Let [not_bruce_lee.GetName] have it."
 STATIC_MODIFIER_NAME_wreck_the_circles: "Given In to the Demands of the Warriors"

 # techspread.txt
 techspread.2.t: "Spread of Ideas"
 techspread.2.desc: "Through our trade connections with #Y [techtarget.GetName]#! new ideas have spread to our people."
 techspread.2.a: "This can only be a good thing!"

 # dhe/dhe_zou_ti.txt
 dhe_zou_ti.2.t: "Grave of Mencius"
 #P:A TODO Approximate: Indomita [GetCharacter('(int32)618').GetName] (Mencius) is written out as "Mencius"
 dhe_zou_ti.2.desc: "Some sad news for you this day, o [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. The great sage Mencius has passed from this world and a spirit of sadness has swept through [ROOT.GetCountry.GetCapital.GetName], for the people of the capital loved the old philosopher and can hardly believe that he is no longer among us.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] felt a weight in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] chest and a lump in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] throat, but was able to overcome this pang of sadness. In a voice choked with emotion, the [ROOT.GetCountry.GetGovernment.GetRulerTitle] cried out 'Then we shall build him a tomb, one worthy of his dignity and great soul. Call forth the finest stoneworkers living within [ROOT.GetCountry.GetName] and commission a giant stele, one borne on the back of a sea turtle, that will proclaim the deeds and doings of the incomparable Mencius."
 dhe_zou_ti.2.a: "I shall pay my respects in person when I am able"
 STATIC_MODIFIER_NAME_mencius_grave: "Grave of Mencius"

