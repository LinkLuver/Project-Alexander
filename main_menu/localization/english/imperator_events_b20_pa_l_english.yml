l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b20 (2026-09-30)

 # comet.txt
 comet.1.t: "Comet Sighted!"
 comet.1.desc: "A terrifying thunderclap over the skies of [ROOT.GetCountry.GetCapital.GetName] last night heralded a terrifying, awe-inspiring sight. The very fabric of creation seemed rent asunder by flame and smoke as if by [ROOT.GetCountry.Custom('pa_imp_get_sky_god')] himself; people cowered in their homes, seeking to avoid the certainty of the imminent wrath of the divine.\n\nAlmost as soon as this manifestation had appeared, however, it crept away over the horizon, seeming to settle in the territory of our neighbor, [target.GetOwner.GetName].\n\nIn haste, the resident expert in matters of faith was summoned to explain this mystery. According to [priest.GetShortName], this event can only have been a message sent by [ROOT.GetCountry.Custom('pa_imp_get_sky_god')], intended to legitimize our position as the chosen people.\n\n[priest.GetShortName] insists that [ROOT.GetCountry.Custom('pa_imp_get_sky_god')] must have made a minor miscalculation when he sent this message into the lands of our [target.GetOwner.GetAdjective] neighbors, and that we must do all in our power to possess the [target.Custom('pa_imp_get_city_type_loc')] of [target.GetName], where the divine communique must have landed."
 comet.1.a: "How...exciting?"
 comet_sighted_1_tt: "Owning the territory of #Y [target.GetName]#! will continue this event chain."
 comet.3.t: "Rock of Ages"
 comet.3.desc: "In a ramshackle farm on the outskirts of [target.GetName], a great depression in the ground mars the serene landscape. In the midst of this crater, a great, immovable rock lies dormant. It is unlike anything our advisors have seen, and a scribe mentions a near-forgotten prophecy of a message sent to our people by [ROOT.GetCountry.Custom('pa_imp_get_sky_god')] himself.\n\nWithin days, multitudes of people have flocked to see this unnatural edifice, many of them in fervent prayer. Truly, it seems that the prophecy was true, and that [ROOT.GetCountry.GetName] has been chosen by [ROOT.GetCountry.Custom('pa_imp_get_sky_god')], to fulfill his bidding."
 comet.3.a: "We are blessed indeed."
 comet.4.t: "The Idol of [target.GetName]"
 comet.4.desc: "In the years since our people located the great rock of the heavens, the local administration in [target.GetName] has created a shrine about the stone. The rock itself was carved into an imposing idol, and provides our people with comfort and respite in trying times.\n\nOur state of war however, has convinced our chiefest advisors that the security of this divine messenger is at risk, and they advise us to relocate the shrine to [ROOT.GetCountry.GetCapital.GetName]: regardless of the huge effort and cost.\n\nOur military command even believe it will act as a figurehead in this bitter conflict."
 comet.4.a: "So it must be."
 comet.4.b: "We just can't spare the resources."
 STATIC_MODIFIER_NAME_comet_sighted_modifier: "Rock of Ages"

 # desecration.txt
 #P:A TODO No EU5 equivalent: Imperator [provincial_deity.GetName] (the location's patron deity) is written as "the local god" in the desecration texts
 desecration.1.t: "Sack of [shrine_location.GetName]"
 desecration.1.desc: "The [shrine_location.Custom('pa_imp_temple_string')] of the local god in [shrine_location.GetName] has been sacked by the hostile forces of [sacker.GetName]. As the [shrine_location.Custom('pa_imp_temple_string')] is laid to ashes the soldiers loot the city itself as well as the temple treasury."
 desecration.1.a: "Sacrilege!"
 desecration.2.t: "Destruction of the [shrine_location.Custom('pa_imp_temple_string')] of the Local God"
 desecration.2.desc: "The [shrine_location.Custom('pa_imp_temple_string')] of the local god in [shrine_location.GetName] has been sacked by our valiant troops. As the [shrine_location.Custom('pa_imp_temple_string')] is laid to ashes the soldiers loot the city itself as well as the temple treasury."
 desecration.2.a: "Soon no one will remember the local god."
 desecration.3.t: "Sack of the [shrine_location.Custom('pa_imp_temple_string')] of the Local God"
 desecration.3.desc: "The great [shrine_location.Custom('pa_imp_temple_string')] in [shrine_location.GetName] dedicated to the local god has been sacked by the forces of [sacker.GetName]. Our priests assure us that this can only bring bad fortune upon their people."
 desecration.3.a: "We will remember this crime!"
 desecration.3.b: "Who can blame a soldier for pillaging?"
 #P:A TODO No EU5 equivalent: [provincial_deity.GetName] was Melqart in these two texts, so the name is written out
 cr_religious_flavour_events.1.desc: "Centuries ago Melqart taught the Phoenicians the art of shipbuilding and sailing so that they might find the mythical wandering Ambrosial Rocks.\nOn the rocks they found an olive tree, a snake and an eagle, all engulfed in a fire, but -strangely enough- not consumed by it. Honoring the god who brought them to that wonderous place, they sacrificed the flaming eagle to Melqart. This act broke the spell and the Ambrosial Rocks halted their wandering and provided the foundation for [shrine_location.GetName].\n\nEver since that day, on the spot of that very sacrifice, has stood the #high [shrine_location.Custom('pa_imp_temple_string')] of#! Melqart. So sacred that no foreigners were allowed within its precinct, so renowned that Alexander himself came to worship.\n\nToday our valiant troops ransacked the [shrine_location.Custom('pa_imp_temple_string')] and emptied its treasury of the sacred artifacts accumulated over centuries."
 cr_religious_flavour_events.1.desc_phoenician: "Centuries ago #high Lord#! Melqart taught our people the art of shipbuilding and sailing so that we might find the mythical wandering Ambrosial Rocks.\nOn the rocks we found an olive tree, a snake and an eagle, all engulfed in a sacred fire, but strangely not consumed by it. Honoring the Melqart, a sacrifice of the flaming eagle broke the spell and caused the Ambrosial Rocks to halted their wandering.\n\nEver since that day, on the spot of that very sacrifice, has stood the #high [shrine_location.Custom('pa_imp_temple_string')] of#! Melqart. So sacred that no foreigners were allowed within its precinct, so renowned that Alexander himself came to worship.\n\nNow news reaches us that the home of our Lord has been sacked by the vile forces of the [sacker.GetAdjective]s."
 cloc_shrine: "Shrine"
 cloc_shrine_matrist: "Grove"
 cloc_temple: "Temple"
 cloc_sanctuary: "Sanctuary"
 cloc_holy_site_default: "Shrine"
 sacked_our_holy_site: "Sacked Our Holy Site"
 overlooked_sacking: "Benevolent view of Desecration"
 sacked_holy_site: "Sacked Holy Site"

 # health.txt
 health.1.t: "Death from Childbirth"
 health.1.desc: "[pa_character.GetName] has sadly passed away whilst giving birth to her newborn child, [newborn.GetShortName].\n\nWe mourn with her family, yet this occurrence is sadly not rare."
 health.1.a: "Our commiserations."
 health.3.t: "Tragedy"
 health.3.desc: "The perils of childbirth are many, and today, [pa_character.GetName] and her family experienced the worst of them. \n\nNot only did she die in childbirth, but her newborn babe, [newborn.GetShortName], passed away with her.\n\nWe cannot imagine the grief that her family must feel."
 health.3.a: "Our sincere commiserations."
 health.4.t: "Death of an Infant"
 health.4.desc: "[newborn.GetName], mere minutes after being born, passed away peacefully, unable to sustain [newborn.GetHerHis] own life.\n\nThe pain that the parents must be feeling is unimaginable, and we mourn with them."
 health.4.a: "Our sincere commiserations."
 health.6.t: "Melancholia"
 health.6.desc: "Overtaken by a smothering, intense depression, [pa_character.GetShortName] has sunk into a downward spiral from which we are worried [pa_character.GetSheHe] will never return.\n\nWe can only pray that fate smiles kindly on [pa_character.GetHerHim]."
 health.6.a: "Saddening."
 health.7.t: "Looking Up"
 health.7.desc: "After spending some time in a deep, melancholic depression, [pa_character.GetShortName] has emerged, finally able to laugh and act as [pa_character.GetHerHis] old self.\n\nIt is good to have [pa_character.GetHerHim] back."
 health.7.a: "Splendid."
