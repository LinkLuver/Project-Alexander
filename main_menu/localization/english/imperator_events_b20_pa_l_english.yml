 # slave_revolts.txt
 slave_revolts.3.t: "Slave Revolt Defeated"
 slave_revolts.3.desc: "We have brought an end to the host of master-less slaves haunting our country. Their leaders, and all the slaves that had risen against their masters, are now once again in chains. Concerned citizens are calling for harsh punishment, to make an example out of this group, preempting future revolts. Others argue that such harsh treatment would not solve the issues of mistreatment that ignited the revolt in the first place."
 slave_revolts.3.a: "We must make an example of them."
 slave_revolts.3.b: "Let us show leniency."
 slave_revolts.3.b.tt: "A third of all rebelling slaves will be resettled in our territories in our capital region."
 slave_revolts.3.moratorium.a.tt: "We will be protected from new Slave Revolts for 30 years."
 slave_revolts.3.moratorium.b.tt: "We will be protected from new Slave Revolts for 15 years. "
 STATIC_MODIFIER_NAME_ongoing_slave_revolt: "Slave Unrest"
 STATIC_MODIFIER_DESC_ongoing_slave_revolt: "The recent slave revolt in our empire is inspiring slaves all over the country with hope for freedom. It has also given them the courage to not tolerate abuse.\nUnless we are careful the rebellion might spread."
 STATIC_MODIFIER_NAME_crucified_slaves: "Crucifixion of Slave Revolters"
 STATIC_MODIFIER_DESC_crucified_slaves: "In an effort to make a noteworthy example we have crucified all but the least important among the recent slave revolters."
 STATIC_MODIFIER_NAME_lenient_slave_handling: "Slave Amnesty"
 STATIC_MODIFIER_DESC_lenient_slave_handling: "We have not made an example of the culprits in the recent Slave Revolt. Every survivor has been allowed to return to a life in bondage, without any further punishment."

