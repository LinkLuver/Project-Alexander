l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b20 (2026-09-30)

 # comet.txt
 comet.1.t: "Comet Sighted!"
 comet.1.desc: "A terrifying thunderclap over the skies of [ROOT.GetCountry.GetCapital.GetName] last night heralded a terrifying, awe-inspiring sight. The very fabric of creation seemed rent asunder by flame and smoke as if by [ROOT.GetCountry.Custom('pa_imp_get_sky_god')] himself; people cowered in their homes, seeking to avoid the certainty of the imminent wrath of the divine.\n\nAlmost as soon as this manifestation had appeared, however, it crept away over the horizon, seeming to settle in the territory of our neighbor, [target.GetOwner.GetName].\n\nIn haste, the resident expert in matters of faith was summoned to explain this mystery. According to [priest.GetShortName], this event can only have been a message sent by [ROOT.GetCountry.Custom('pa_imp_get_sky_god')], intended to legitimize our position as the chosen people.\n\n[priest.GetShortName] insists that [ROOT.GetCountry.Custom('pa_imp_get_sky_god')] must have made a minor miscalculation when he sent this message into the lands of our [target.GetOwner.GetAdjective] neighbors, and that we must do all in our power to possess the [target.Custom('pa_imp_get_city_type_loc')] of [target.GetName], where the divine communique must have landed."
 comet.1.a: "How...exciting?"
 comet_sighted_1_tt: "Owning the territory of #Y [target.GetName]#! will continue this event chain."
 comet.3.t: "Rock of Ages"
 comet.3.desc: "In a ramshackle farm on the outskirts of [target.GetName], a great depression in the ground mars the serene landscape. In the midst of this crater, a great, immovable rock lies dormant. It is unlike anything our advisors have seen, and a scribe mentions a near-forgotten prophecy of a message sent to our people by [ROOT.GetCountry.Custom('pa_imp_get_sky_god')] himself.\n\nWithin days, multitudes of people have flocked to see this unnatural edifice, many of them in fervent prayer. Truly, it seems that the prophecy was true, and that [ROOT.GetCountry.GetName] has been chosen by [ROOT.GetCountry.Custom('pa_imp_get_sky_god')], to fulfill his bidding."
 comet.3.a: "We are blessed indeed."
 comet.4.t: "The Idol of [target.GetName]"
 comet.4.desc: "In the years since our people located the great rock of the heavens, the local administration in [target.GetName] has created a shrine about the stone. The rock itself was carved into an imposing idol, and provides our people with comfort and respite in trying times.\n\nOur state of war however, has convinced our chiefest advisors that the security of this divine messenger is at risk, and they advise us to relocate the shrine to [ROOT.GetCountry.GetCapital.GetName]: regardless of the huge effort and cost.\n\nOur military command even believe it will act as a figurehead in this bitter conflict."
 comet.4.a: "So it must be."
 comet.4.b: "We just can't spare the resources."
 STATIC_MODIFIER_NAME_comet_sighted_modifier: "Rock of Ages"

 # desecration.txt
 #P:A TODO No EU5 equivalent: Imperator [provincial_deity.GetName] (the location's patron deity) is written as "the local god" in the desecration texts
 desecration.1.t: "Sack of [shrine_location.GetName]"
 desecration.1.desc: "The [shrine_location.Custom('pa_imp_temple_string')] of the local god in [shrine_location.GetName] has been sacked by the hostile forces of [sacker.GetName]. As the [shrine_location.Custom('pa_imp_temple_string')] is laid to ashes the soldiers loot the city itself as well as the temple treasury."
 desecration.1.a: "Sacrilege!"
 desecration.2.t: "Destruction of the [shrine_location.Custom('pa_imp_temple_string')] of the Local God"
 desecration.2.desc: "The [shrine_location.Custom('pa_imp_temple_string')] of the local god in [shrine_location.GetName] has been sacked by our valiant troops. As the [shrine_location.Custom('pa_imp_temple_string')] is laid to ashes the soldiers loot the city itself as well as the temple treasury."
 desecration.2.a: "Soon no one will remember the local god."
 desecration.3.t: "Sack of the [shrine_location.Custom('pa_imp_temple_string')] of the Local God"
 desecration.3.desc: "The great [shrine_location.Custom('pa_imp_temple_string')] in [shrine_location.GetName] dedicated to the local god has been sacked by the forces of [sacker.GetName]. Our priests assure us that this can only bring bad fortune upon their people."
 desecration.3.a: "We will remember this crime!"
 desecration.3.b: "Who can blame a soldier for pillaging?"
 #P:A TODO No EU5 equivalent: [provincial_deity.GetName] was Melqart in these two texts, so the name is written out
 cr_religious_flavour_events.1.desc: "Centuries ago Melqart taught the Phoenicians the art of shipbuilding and sailing so that they might find the mythical wandering Ambrosial Rocks.\nOn the rocks they found an olive tree, a snake and an eagle, all engulfed in a fire, but -strangely enough- not consumed by it. Honoring the god who brought them to that wonderous place, they sacrificed the flaming eagle to Melqart. This act broke the spell and the Ambrosial Rocks halted their wandering and provided the foundation for [shrine_location.GetName].\n\nEver since that day, on the spot of that very sacrifice, has stood the #high [shrine_location.Custom('pa_imp_temple_string')] of#! Melqart. So sacred that no foreigners were allowed within its precinct, so renowned that Alexander himself came to worship.\n\nToday our valiant troops ransacked the [shrine_location.Custom('pa_imp_temple_string')] and emptied its treasury of the sacred artifacts accumulated over centuries."
 cr_religious_flavour_events.1.desc_phoenician: "Centuries ago #high Lord#! Melqart taught our people the art of shipbuilding and sailing so that we might find the mythical wandering Ambrosial Rocks.\nOn the rocks we found an olive tree, a snake and an eagle, all engulfed in a sacred fire, but strangely not consumed by it. Honoring the Melqart, a sacrifice of the flaming eagle broke the spell and caused the Ambrosial Rocks to halted their wandering.\n\nEver since that day, on the spot of that very sacrifice, has stood the #high [shrine_location.Custom('pa_imp_temple_string')] of#! Melqart. So sacred that no foreigners were allowed within its precinct, so renowned that Alexander himself came to worship.\n\nNow news reaches us that the home of our Lord has been sacked by the vile forces of the [sacker.GetAdjective]s."
 cloc_shrine: "Shrine"
 cloc_shrine_matrist: "Grove"
 cloc_temple: "Temple"
 cloc_sanctuary: "Sanctuary"
 cloc_holy_site_default: "Shrine"
 sacked_our_holy_site: "Sacked Our Holy Site"
 overlooked_sacking: "Benevolent view of Desecration"
 sacked_holy_site: "Sacked Holy Site"

 # health.txt
 health.1.t: "Death from Childbirth"
 health.1.desc: "[pa_character.GetName] has sadly passed away whilst giving birth to her newborn child, [newborn.GetShortName].\n\nWe mourn with her family, yet this occurrence is sadly not rare."
 health.1.a: "Our commiserations."
 health.3.t: "Tragedy"
 health.3.desc: "The perils of childbirth are many, and today, [pa_character.GetName] and her family experienced the worst of them. \n\nNot only did she die in childbirth, but her newborn babe, [newborn.GetShortName], passed away with her.\n\nWe cannot imagine the grief that her family must feel."
 health.3.a: "Our sincere commiserations."
 health.4.t: "Death of an Infant"
 health.4.desc: "[newborn.GetName], mere minutes after being born, passed away peacefully, unable to sustain [newborn.GetHerHis] own life.\n\nThe pain that the parents must be feeling is unimaginable, and we mourn with them."
 health.4.a: "Our sincere commiserations."
 health.6.t: "Melancholia"
 health.6.desc: "Overtaken by a smothering, intense depression, [pa_character.GetShortName] has sunk into a downward spiral from which we are worried [pa_character.GetSheHe] will never return.\n\nWe can only pray that fate smiles kindly on [pa_character.GetHerHim]."
 health.6.a: "Saddening."
 health.7.t: "Looking Up"
 health.7.desc: "After spending some time in a deep, melancholic depression, [pa_character.GetShortName] has emerged, finally able to laugh and act as [pa_character.GetHerHis] old self.\n\nIt is good to have [pa_character.GetHerHim] back."
 health.7.a: "Splendid."

 # ritual_sacrifice_inv_event.txt
 ritual_sacrifice_inv.1.t: "The Sacrifice"
 ritual_sacrifice_inv.1.desc: "Recently, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] decided to sacrifice a prisoner to the gods, so that they would improve the tribe's fortune. The dissenters should be silenced and the wavering reaffirmed in their loyalty to the tribe. Choosing the wrong sacrifice might impact us however..."
 ritual_sacrifice_inv.1.a: "May the gods bless us."
 ritual_sacrifice_inv.2.t: "Feasts in the name of the Sacrifice"
 ritual_sacrifice_inv.2.desc: "The Sacrifice was a success. Everyone celebrates, acknowledging that a time of growth and peace has come. The blood of the slain was a price the gods deemed worthy. No one has voiced concerns about the choice of the sacrifice, for they knew it to be the best for all."
 ritual_sacrifice_inv.2.a: "Only the best for our people!"
 STATIC_MODIFIER_NAME_ritual_sacrifice_modifier_1: "Successful Sacrifice"
 ritual_sacrifice_inv.3.t: "The Offering Mourned"
 ritual_sacrifice_inv.3.desc: "The prisoner we sacrificed is being mourned, for the tribe did not like we chose an unworthy candidate to sacrifice to the gods. Some dissenters and friends of the offering have started to incite unrest, claiming that they were unjustly and illegally murdered. We should pay attention to them, for more and more follow their calls for a new ruler."
 ritual_sacrifice_inv.3.a: "Damnation!"
 STATIC_MODIFIER_NAME_ritual_sacrifice_modifier_2: "Unsuccessful Sacrifice"

 # FMO_MPE_events.txt (hidden events; special pop modifiers)
 STATIC_MODIFIER_NAME_priest_in_province_mod: "Priests Converting Population"
 STATIC_MODIFIER_NAME_merchant_in_province_mod: "Merchants Increasing Wealth"
 STATIC_MODIFIER_NAME_architect_in_province_mod: "Architects Improving Infrastructure"
 STATIC_MODIFIER_NAME_artist_in_province_mod: "Artists Promoting Culture"

 # religion_flavor/rel_flavor_chaldean.txt
 rel_flavor_chaldean.1.t: "Chronicler of Ancient Gods"
 rel_flavor_chaldean.1.desc: "After your recent conquests of Syrian lands, surveys over the new area found a man of great intrigue was found in small village. Iptur-Lim is his name, and he refused to pay tax and so he was to be killed... however the man's house was found with seemingly ancient text and it was decided he would be presented to you. When questioned, he claims there was once a great city called Ebla whose gods were mighty. Perhaps we can win favor with these gods?"
 rel_flavor_chaldean.1.a: "Kill this heretic."
 rel_flavor_chaldean.1.b: "Ebla you say...? Interesting."
 rel_flavor_chaldean.1.c: "Tell me of these gods, Iptur-Lim, and your life will be spared."
 Iptur_Lim: "Iptur-Lim"
 rel_flavor_chaldean.2.t: "God of Ebla"
 rel_flavor_chaldean.2.desc: "With the help of Iptur-Lim, an inscription was deciphered that mentioned a god called Kura. He was a great god who empowered the city of Ebla. We also found another inscription on an old tomb which mentions a group of so-called #high Gods of the Dead Kings#!. We may be able to identify these gods and worship them ourselves."
 rel_flavor_chaldean.2.a: "My curiosity is satiated."
 rel_flavor_chaldean.2.b: "The Gods of the Dead Kings... interesting"
 rel_flavor_chaldean.2.c: "Kura will be incorporated into our pantheon and lead us to the rest of them."
 rel_flavor_chaldean.3.t: "Site of Ebla"
 rel_flavor_chaldean.3.desc: "We have determined a potential site where Ebla may have been. While the city is long gone, we could re-establish the great city and make it our owns, atop a potential site. Though it should be noted that the site may not be exact."
 rel_flavor_chaldean.3.a: "We will build our own legacy."
 rel_flavor_chaldean.3.b: "We will rebuild the legendary city."
 rel_flavor_chaldean_ebla: "Ebla"
 rel_flavor_chaldean.4.t: "Gods of the Dead Kings"
 rel_flavor_chaldean.4.desc: "With the work of Iptur-Lim, we have been able to translate many inscriptions and thanks to further surveying, we have found enough to determine the identity of these gods. Hadabal and Belatu, Agu and Gulatu, Resheph and Adamma, and Dariba and Ishara. In addition to these, two gods of Ebla herself were found as Kura and Barama. Some of these gods are worshiped by Egyptians, some Canaanites, and some Mesopotamians. Some are worshiped by none and known to less. But to us and us alone, we now know the complete Eblaite pantheon."
 rel_flavor_chaldean.4.a: "Inscribe into stone the Eblaite Pantheon!"
 rel_flavor_chaldean.5.t: "Ebla Reborn"
 rel_flavor_chaldean.5.desc: "With Ebla reborn, shall we look further into the ancient gods of this city?"
 rel_flavor_chaldean.5.a: "We will search for these lost gods."
 rel_flavor_chaldean.5.b: "Is reviving the ancient city not enough already?"

 # fire_events_invictus.txt
 fire_events.2.t: "City on Fire"
 fire_events.2.desc: "My [ROOT.GetCountry.GetGovernment.GetRulerTitle]#!, a fire has broken out in a bakery in #Y [en_fuego.GetName]#!. If we do not act soon, we may have to rebuild parts of the city. \n Some of our ministers assure us that rebuilding the city would be less expensive than sending the fire brigade. They say that a few slaves aren't worth our time. Others insist on helping the inhabitants of #Y [en_fuego.GetName]#!, arguing that it is the perfect opportunity to demonstrate our benevolence. Our subjects would be eternally grateful were we to rescue them."
 fire_events.2.a: "We must help our Citizens!"
 fire_events.2.b: "Let it Burn!"
 fire_events.3.t: "The Fire is Spreading"
 fire_events.3.desc: "The fire in #Y [en_fuego.GetName]#! has worsened and has encroached on the neighboring buildings. The mayor implores us to send help, before more devastating damage cripples the city for the foreseeable future. Already, some inhabitants have been burned alive, including a master craftsman. We can still prevent further destruction if we allocate enough fire fighters and resources immediately!"
 fire_events.3.a: "Save the City!"
 fire_events.3.b: "Who cares."
 fire_events.4.t: "Conflagration"
 fire_events.4.desc: "The city of #Y [en_fuego.GetName]#! will soon be naught but ashes. Even the stone has melted; it is a ghastly spectacle. The fires burn, as if the Gods themselves were commanding them to immolate the city. The priests say, that the citizens of #Y [en_fuego.GetName]#! angered the Gods and are now being cleansed. My [ROOT.GetCountry.GetGovernment.GetRulerTitle], now we can only pray for them."
 fire_events.4.a: "May the Gods have Mercy on their Souls."
 fire_events.5.t: "The Fires Come to an End"
 fire_events.5.desc: "The fires in #Y [en_fuego.GetName]#! have died down and the remnants are being inspected. Only some rubble, ashes and slag remain of the once proud city. \n What should we do now? We could rebuild the city, which would benefit us in the long term, but would necessitate an investment. However, the priests say that the city was punished by the Gods themselves, and thus it would be blasphemy if we were to restore the city."
 fire_events.5.a: "The priests are driveling again."

 # religion_flavor/00_illyric_flavor.txt
 illyric_flavor_1_title: "Choose a Cult"
 illyric_flavor_1_desc: "Every Illyric ruler can pick a cult to follow. Upon the death of the current ruler, the next ruler may pick a new cult to follow."
 illyric_flavor_1.a: "The Cult of the Sun"
 illyric_flavor_1.b: "The Cult of the Serpent"
 illyric_flavor_1.c: "The Cult of the Thracian Horseman"
 illyric_flavor_1.d: "The Cult of the Wolf"
 illyric_flavor_1.e: "The Cult of the Raider"
 illyric_flavor_2_title: "Sun-Kissed Day"
 illyric_flavor_2_desc: "This day was so beautiful, it must have been blessed by the holy Sun god. The people certainly believe so too!"
 illyric_flavor_2.a: "The gods bless us"
 illyric_flavor_2.b: "The gods bless my rule"
 illyric_flavor_3_title: "Day Drenched in Dark"
 illyric_flavor_3_desc: "It has been many days of no sun. People say the gods have abandoned us!"
 illyric_flavor_3.a: "The gods have a temper..."
 illyric_flavor_3.b: "We will show humility to apease them"
 illyric_flavor_30_title: "White Viper Found"
 illyric_flavor_30_desc: "A villager has found a magnificent and giant pure white viper. Surely this is an embodiment of the gods themselves! We may be able to use this as leverage of the current administration."
 illyric_flavor_30.a: "We will raise taxes temporarily"
 illyric_flavor_30.b: "We will use this for political purposes"
 illyric_flavor_31_title: "Serpent Attack"
 illyric_flavor_31_desc: "There were several serpent attacks today. The people wonder if this is due to their disapproval of you!"
 illyric_flavor_31.a: "We must send offerings to the serpents"
 illyric_flavor_31.b: "This will limit our political flexibility"
 illyric_flavor_60_title: "Serpent Cultist Angry"
 illyric_flavor_60_desc: "A serpent cultist is furious as a horse has stepped on a serpent, killing it. What shall we do to make this right?"
 illyric_flavor_60.a: "The Thracian Horseman has spoken."
 illyric_flavor_60.b: "Compensate the serpent cultist."
 illyric_flavor_61_title: "Sun Cultist's Plight"
 illyric_flavor_61_desc: "A desecration of a sun cultist shrine was reported. The sun cultist in question asks for us to find the culprit and kill them. What shall we do?"
 illyric_flavor_61.a: "Reserve our men for proper problems."
 illyric_flavor_61.b: "Send horsemen to fix the sun's problems."

 # gallic_smithy.txt
 gallic_smithy_inv.1.t: "The Smith's Work"
 gallic_smithy_inv.1.desc: "After weeks and months of sweating and shedding blood, the master smith and his aides finally present you with their work. \nSome of the gathered nobles seem to guess its purpose, yet others can't discern anything of use from its covered silhouette. When it is finally unveiled, many gasp, for it is a sight to behold, its appearance an artwork. Its function not immediately clear, the master craftsman begins to explain..."
 gallic_smithy_inv.1.a: "Marvelous"
 STATIC_MODIFIER_NAME_gallic_item_8: "War Drums"
 gallic_smithy_inv.2.t: "The Missive"
 gallic_smithy_inv.2.desc: "Our [ROOT.GetCountry.GetGovernment.GetRulerTitle] has decreed that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] desires an item from the master smith. This item shall be both useful and pleasant to the eye. In [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] wisdom, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] admits not being a craftsman [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self, and thus not being able to qualify what the item should be. However, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] warns that it should be a masterpiece and not a shoddy arrangement of materials."
 gallic_smithy_inv.2.a: "Inform the Craftsmen!"

 # religion_flavor/00_jain_flavor.txt
 jain_flavor.8.t: "Paryushana Festival"
 jain_flavor.8.desc: "The time of the Paryushana Festival is upon us, when sins accrued throughout the year between brothers are forgotten and a contrite spirit of forgiveness grips men's hearts during the sacred days of Kshamavani and Samvatsari. The community will come together, remembering our sacred teachings, and will renew our spirits and hearts for the year ahead."
 jain_flavor.8.a: "It is time to fast!"
 jain_flavor.8.b: "A Grand Festival will be held!"
 jain_flavor.8.c: "Now is not the time."
 STATIC_MODIFIER_NAME_paryushana_festival_mod: "Paryushana Festival"
 STATIC_MODIFIER_NAME_fasting_for_paryushana: "Fasting for Paryushana"
 pa_b20_spread_religion_in_province_tt: "12-25% of the people of other faiths in [province_name.GetName] will convert to #Y [pa_spread_religion.GetName]#!"
 jain_flavor.9.t: "Mahavir Janma Kalyanak"
 jain_flavor.9.desc: "One of the holiest days in our calendar, Mahavir Janma Kalyanak, is here, for today we must remember the birth of the last Tirthankara of this present age. Even now, the statue of Mahavir is being prepared for its ritual procession, where it will be drawn upon a chariot and carried throughout the heart of the city. A spirit of charity and thanksgiving pervades the festival, as men show their gratitude by opening their hearts and pockets to each other."
 jain_flavor.9.a: "May the spirit of Mahavir be with us"
 STATIC_MODIFIER_NAME_mahavirs_guidance_mod: "Guidance of Mahavir"
 jain_flavor.10.t: "Akshaya Tritiya"
 jain_flavor.10.desc: "The joyous occasion of another religious festival is here, with preparations being made throughout the cities and countryside. The Akshaya Tritiya Festival recalls the doings and deeds of the first Tirthankara Rishabhanatha, who broke his sacred fast by partaking in sugarcane juice with grateful, outstretched hands. Those who are able to make pilgrimage will do so, reenacting the travels of Rishabhanatha and going to places sacred to him, whereas those without the means to do so will honor the Tirthankara by abstaining from food. After the period of fasting has ended, there will be celebrations that everyone looks forward to."
 jain_flavor.10.a: "The increase of pilgrims will translate to increased sales for our merchants"
 STATIC_MODIFIER_NAME_celebration_of_rishabhanatha: "Celebration of Rishabhanatha"

 # cr_flavour/cr_religion_flavour_events.txt (.1 desc keys are in the desecration section above)
 #P:A TODO Approximate location: Imperator Tyrus (p:743) is shown as Sidon (no Tyre location in the mod map); [provincial_deity.GetName] was Melqart, so the name is written out
 cr_religious_flavour_events.2.t: "The Egersis of Melqart"
 cr_religious_flavour_events.2.desc: "Many lamentations were heard across [ShowLocationName('cadiz')] when the news broke that #high Lord#! Melqart's temple at [ShowLocationName('sidon')] was destroyed at the hands of the [sacker.GetAdjective]s. But these lamentations were more for the lost grandeur of the temple than for Lord Melqart himself. For he is a wandering god who leads a cyclical existence; each year he dies and each year he is reborn from ashes and smoke.\n\nThis #high Egersis#! only occurs after the Lord has been awaken from his slumber by the smell of roasted quail, kolokasi leaf and incense. So for three days preceding the #high Marzeah festival#! is held -filled with lavish funerary banquets, lamentations and the #high Miqim'Elim#! spreading his sacred seed- all to ensure Lord Melqart will awaken from his sleep.\n\nAlready the highlight of the religious year in [ShowLocationName('cadiz')], anticipation for this year's Marzeah is greater than ever, for it is expected that Lord Melqart will be reborn here and make the city his new home!"
 cr_religious_flavour_events.2.a: "We await his return!"
 cr_religious_flavour_events.3.t: "Melqart of the West"
 cr_religious_flavour_events.3.desc: "Many lamentations were heard across [ROOT.GetCountry.GetCapital.GetName] when news broke that the great temple of [ShowLocationName('sidon')] was destroyed at the hands of the vile [sacker.GetAdjective]s. Yet these lamentations were more for the lost grandeur temple itself than for #high Lord#! Melqart, for he is a wandering god who leads a cyclical existence: each year he dies and each year he is reborn during the #high Marzeah festival#!\n\nThis year's Marzeah festival is looked forward to with even greater anticipation, for not only does it mark the rebirth of the Lord himself, but -with the destruction of the [ShowLocationName('sidon')] temple- he is also expected to make a new temple his home!"
 cr_religious_flavour_events.3.a: "The wandering god has a new home"
 new_temple_of_melqart_opmod: "New Temple of Melqart"

 # special_spartan_events.txt
 spartan_event.5.t: "The Co-Ruler is dead"
 #P:A TODO No EU5 equivalent: Imperator co-ruler title and names ([ROOT.GetCountry.GetCoRulerTitle], [SCOPE.sChar('old_co_ruler')...], [ROOT.GetCountry.GetCoRuler...]); rewritten without them
 spartan_event.5.desc: "Sad news this morning. Our co-ruler has left this mortal coil. The [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]s received the news and joined the late co-ruler's family to pay their last respects.\n\nOn this day, the city of [ROOT.GetCountry.GetCapital.GetName] remained quiet, mourning their late co-ruler, but as the sun rises, a new day and a new leader of that house rises to the throne. Together with the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] family, they will lead [ROOT.GetCountry.GetName] forward, and continue its unvarnished legacy."
 spartan_event.5.a: "All things must pass...say a prayer for the dead"
 STATIC_MODIFIER_NAME_family_reorganisation: "Family Reorganization"

 # religion_flavor/rel_flavor_persia.txt
 rel_flavor_persia.1.t: "Cults of Persia"
 rel_flavor_persia.1.desc: "The cults of #high Persia#! are plentiful, colorful, and incredibly attractive to adopt. It will be quite easy for us to adapt our very malleable religious traditions with #high Persian#! cults. There are those known as #high Zoroastrians#!, who worship #high Ahura Mazda#!, the lord of the skies, above all; citing the prophet #high Zoroaster#! as an important figure. Or perhaps the cult of #high Mithra#!, the lord of light, exaulted by the #high Median Magi#!. We could, of course, try to impost our own #high Heptadic#! faith upon the denizens of #high Persia#!. Or, we could look to the #high Seleukids#! and #high Macedonian#! cults of #high Zeus#!, #high Aphrodite#!, and #high Hades#! amongst others. And then there are the lands of #high Mesopotamia#! with their gods like #high Ishtar#!, #high Ereshkigal#!, #high Humban#!.\n\nThe choice is ours to make. Let us decide which cult will be the one of #high Persia's#! future."
 rel_flavor_persia.1.ai: "Ai only moment"
 rel_flavor_persia.1.a: "The great Ahura Mazda!"
 rel_flavor_persia.1.b: "The shining Mithra!"
 rel_flavor_persia.1.c: "We stand by our old gods!"
 rel_flavor_persia.1.d: "The thunderous Zeus!"
 rel_flavor_persia.1.e: "The might of Ishtar!"
 rel_flavor_persia.1.f: "The power of Vakhsh!"
 rel_flavor_persia.1.g: "The way of the Buddha!"
 STATIC_MODIFIER_NAME_soft_recent_convert_modifier: "Recent Conversion"
 pa_b20_religion_conversion_family_tooltip: "Members of the ruler's family at court will convert to the new faith."

