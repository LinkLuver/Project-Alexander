 pa_senate.1.title: "The Optimates Defy the Senate"
 pa_senate.1.desc: "The [Player.MakeScope.GetVariable('pa_senate_optimates_leader').GetCharacter.GetDynasty.GetNameWithNoTooltip] family has exhausted every constitutional remedy. Its Optimates clients now demand concessions, or they will summon their clients against the Republic."
 pa_senate.1.a: "Buy their loyalty"
 pa_senate.1.b: "The Republic will not yield"
 pa_senate.2.title: "The Boni Defy the Senate"
 pa_senate.2.desc: "The [Player.MakeScope.GetVariable('pa_senate_boni_leader').GetCharacter.GetDynasty.GetNameWithNoTooltip] family has rallied its commercial allies and demands redress. A refusal may turn the Boni into a rival government."
 pa_senate.2.a: "Buy their loyalty"
 pa_senate.2.b: "The Republic will not yield"
 pa_senate.3.title: "The Populares Defy the Senate"
 pa_senate.3.desc: "The [Player.MakeScope.GetVariable('pa_senate_populares_leader').GetCharacter.GetDynasty.GetNameWithNoTooltip] family claims that the Senate has abandoned the people. Its patrons are prepared to turn discontent into open rebellion."
 pa_senate.3.a: "Buy their loyalty"
 pa_senate.3.b: "The Republic will not yield"
 pa_senate.20.title: "Senate Election: Optimates Victory"
 pa_senate.20.desc: "The voting is complete. The Optimates have prevailed, gaining [Player.MakeScope.GetVariable('pa_senate_last_election_swing').GetValue|0] seats at the expense of their weakest rival. Mandates — Optimates: [Player.MakeScope.GetVariable('pa_senate_election_opt_score').GetValue|0], Boni: [Player.MakeScope.GetVariable('pa_senate_election_boni_score').GetValue|0], Populares: [Player.MakeScope.GetVariable('pa_senate_election_pop_score').GetValue|0]."
