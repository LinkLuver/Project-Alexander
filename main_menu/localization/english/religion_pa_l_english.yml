 ##International Organizations
 hindu_branch_spec: "Tradition"
 hindu_branch_spec_desc: "The specific traditions and beliefs followed by this [hindu_branch|e]."
 shrauta: "Śrauta"
 shrauta_desc: "$shrauta$ is the [hindu_branch|e] rooted in the authority of the Vedas ([shruti|e]), emphasizing sacred fire rituals ([yajna|e]) performed by [brahmins|e]. It is the [hindu_branch] most closely tied to royal rites, priestly tradition, and the maintenance of cosmic order (ṛta)."
 vaishnavism: "Bhāgavata"
 vaishnavism_desc: "$vaishnavism$ is the [hindu_branch|e] centered around the worship of [ShowGodName('vishnu_god')] in the form of Vāsudeva and related heroic deities."
 shaivism: "Rudramārga"
 shaivism_desc: "$shaivism$ is the [hindu_branch|e] revering [ShowGodName('shiva_god')] in his early form as [ShowGodName('rudra_god')]. It is the [hindu_branch] more focused on asceticism and yoga."
 shaktism: "Devika"
 shaktism_desc: "$shaktism$ is the [hindu_branch|e] centered around the worship of the Mother Goddess, known as Devī or [ShowGodName('shakti_god')], represented and revered in her many different forms."
 smartism: "Ācārika"
 smartism_desc: "$smartism$ is the [hindu_branch|e] grounded in customary practice (ācāra) and social tradition. It represents Brahmanism as lived in daily life, incorporating local rites and multiple deities without strict theological hierarchy."
