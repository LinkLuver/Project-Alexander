l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b15 (2026-10-19)

 # galatian_invasion.txt
 galatian_invasion.44.t: "A New Home"
 galatian_invasion.44.desc: "Having won the right to settle these fertile plains, our people have left their home in Pannonia to settle in here in Anatolia. The Phrygians formerly called this region their home, but the Hellenes surrounding us now call this land Galatia after our people."
 galatian_invasion.44.a: "Let our swords become ploughshares."

 # character_interactions_inv.txt
 character_interactions_inv_1_title: "Forced Divorce"
 character_interactions_inv_1_desc: "As you have commanded, the marriage of [target.GetName] and [target_spouse.GetName] has been forced apart."
 character_interactions_inv_1.a: "So it will be"
 character_interactions_1_tooltip: "All members of the #Y [target.GetDynasty.GetName]#! family will gain the following:"
 character_interactions_inv_2_title: "A Royal Divorce"
 character_interactions_inv_2_desc: "[target.GetName] was not enough for the likes of [ROOT.GetCountry.GetGovernment.GetRuler.GetName], and as such, has been informed that whatever arrangements existed before simply do not now."
 character_interactions_inv_2.a: "Goodbye [target.GetName]"
 character_interactions_inv_3_title: "Forcing Retirement"
 character_interactions_inv_3_desc: "[target.GetName] has long been a thorn in the side of [ROOT.GetCountry.GetName]. Forcing [target.GetName] into retirement would be of great benefit to all the people of [ROOT.GetCountry.GetName]."
 character_interactions_inv_3.a: "[target.GetName] will retire from public life."
 character_interactions_inv_3.b: "On second thought this isn't a good idea."
 character_interactions_inv_3_A_tooltip: "If [target.GetName] #G Accepts#! they will gain the following:\n"
 character_interactions_inv_3_B_tooltip: "\nIf [target.GetName] #R Rejects#! they will gain the following:\n"
 STATIC_MODIFIER_NAME_forced_into_retirement: "Forced Into Retirement"
 character_interactions_4_title: "Retirement"
 character_interactions_4_desc_1: "[target.GetName] has accepted to go into retirement. We no longer have to deal with their antics."
 character_interactions_4_desc_2: "[target.GetName] has refused to go into retirement. We must still deal with their presence...for now."
 character_interactions_4.a: "Good riddance!"
 character_interactions_4.b: "How unfortunate..."
 character_interactions_inv_5_title: "A New Citizen"
 character_interactions_inv_5_desc: "[target.GetName] has arrived at our court, but now the question remains - shall he become part of the [ruler_family.GetName] family?"
 character_interactions_inv_5.a: "[target.GetName] will join the [ruler_family.GetName] family"
 character_interactions_inv_5.b: "That is not necessary"
 character_interactions_inv_6_title: "Offering Support"
 character_interactions_inv_6_desc_1: "[target.GetName] has accepted our proposal to make [target_employer.GetName] a feudatory subject until the end of [target.GetHerHis] reign. Upon the death of [target.GetName] the people of [target_employer.GetName] will decide their fate moving forward."
 character_interactions_inv_6_desc_2: "[target.GetName] has declined our proposal...how foolish"
 character_interactions_inv_6.a: "Fantastic"
 character_interactions_inv_6.b: "Damn them to Hell!"
 STATIC_MODIFIER_NAME_ruler_being_supported: "Foreign Support"
 character_interactions_inv_7_title: "The Future of [supported_country.GetName]"
 character_interactions_inv_7_desc_1: "[supported_country.GetName] has decided that they will continue to be our subject even after the death of [dead_supported_ruler.GetName]."
 character_interactions_inv_7_desc_2: "After the death of [dead_supported_ruler.GetName] [supported_country.GetName] has decided that they no longer need us to ruler over them...how foolish."
 character_interactions_inv_7.a: "Glorious!"
 character_interactions_inv_7.b: "Those fools!!!"
 STATIC_MODIFIER_NAME_mauryan_collapse: "Mauryan Collapse"
 ambitions_inv_1_title: "A Dangerous Dinner Discussion"
 ambitions_inv_1_desc: "One day, you receive an invitation from [scheme_target.GetName] to attend a dinner party being held in a few days at [your_province_scope.GetArea.GetRegion.GetName]. Members from all of the leading families of the city will be there, and although you don't really feel like going, you know that ignoring the invitation might be seen as rude. How tiresome it is, to be forced to make appearances at these sort of things! It never ends. On one hand, the hospitality of [scheme_target.GetShortName] is well-known, as their reputation for being a gourmand is semi-legendary...you know you'll eat well, at least. Giving a hefty sigh, you resign yourself and send your reply, letting [scheme_target.GetShortName] know you'll be attending.\n\nIt is late into the evening, and you must admit you have had a good time - better than you expected. The room is filled with uproarious laughter and pleasant conversation, and dinner was exquisite; you have swallowed a vast ocean of fish and a veritable forest of grilled meats, fruits and breads. Rich cheeses bathed in honey and sprinkled with roasted seeds are now being served, and you can tell from your spinning head that the wine is practically unmixed...at least it feels like it. How many cups have you had? Never mind, here's another...\n\nThe conversation has now turned to heroic feats, and someone began to praise how well our armies had fared on our last military campaign, to which we toasted the memories of our good fighting men. As the discussion turned to war, a friend of [scheme_target.GetShortName] drunkenly praises [scheme_target.GetHerHis] as the greatest general in the room, and there is immediate silence; all eyes turn to see your response, and you can feel your face flushing darkly. There is no doubt that [scheme_target.GetShortName] is known for [scheme_target.GetHerHis] skill at arms, but everyone knows that you are the better fighter - you could be gracious, or you could set the record straight. Standing to your feet, swaying unsteadily from side to side, you turn to [scheme_target.GetShortName] and make your reply."
 ambitions_inv_1.a: "Let's grab another round of drinks!"
 ambitions_inv_1.b: "I am the greatest warrior here; hail your leader!"
 # (Invictus showed [target.GetName], a scope these events never had; the ruler is meant)
 ambitions_inv_1_tt: "[pa_character.GetName] and [scheme_target.GetName] will fight to the death, the last one standing will win."
 ambitions_inv_1.c: "We will fight to the death!!!"
 ambitions_inv_2_title: "Spoils of War"
 ambitions_inv_2_desc: "After our last military campaign, it seems that the levies commanded by [scheme_target.GetName] were very successful in the field; not only did they devastate the armies sent against them, but they also managed to collect a staggering amount of breastplates, spears, swords and shields from the fallen. One day, you are surprised to see over one hundred wagons lumbering through the streets of our capital, weighed down with the spoils of war; a gathering crowd follows this procession into the center of town. Over the course of the next few days, [scheme_target.GetShortName]#high 's#! men begin to work, and the streets are filled from dawn to dusk with the sounds of shouting laborers.\n\nWhen all is said and done, a massive pile of armaments has been erected, an ominous tower of broken metal and ripped leather; it is literally the tallest structure in the city and can be seen from miles away. [scheme_target.GetShortName] has invited you to come with them, to stand before this horrific shrine and make a sacrifice; they claim that this mysterious rite, of burning grain before the spoils of war, is the secret to their military prowess. The people would certainly enjoy the spectacle, but you don't really appreciate this unilateral initiative that [scheme_target.GetShortName] has undertaken...is this monument meant to glorify the state, or to bring personal accolades? What should you say?"
 ambitions_inv_2.a: "Let us sacrifice together so that our soldiers will be blessed"
 ambitions_inv_2.b: "This is an unauthorized display, take it down"
 STATIC_MODIFIER_NAME_governor_support: "Governor Support"
 ambitions_inv_3_title: "A Zealous Eccentric"
 ambitions_inv_3_desc: "The piety of our people is known to all that travel throughout our realm, and for those with the economic means, it is viewed as an honor to personally bankroll the annual religious festivals. Until recently you have viewed this as an prerogative of the nobility, but a few days ago, you received reports that gave you pause. An eccentric magistrate is funding the restoration of an ancient shrine; what was once brick and mud is now being transformed into marble, but everything is not as it seems...apparently an unseemly amount was spent.\n\nYour curiosity piqued, you decide to pay a personal visit one day to see this marvel for yourself, and are awe-struck at what you find. Although the building itself is small, it is a staggering architectural achievement, one that rivals the great buildings in [your_province_scope.GetArea.GetName] for its beauty. You are dumbfounded by the extravagance, and are practically tongue-tied when you see an old man coming out of the sanctuary, dressed in ceremonial robes and flanked by priests. 'Master, you do us all honor by coming here.' Gesturing around, the official cackles, his eyes sparkling. 'I know this all a mere bauble, but you agree that the gods demand this and more.'"
 ambitions_inv_3.a: "You are an inspiration to us all; continue your good work with my blessings"
 ambitions_inv_3.b: "Siphon the funds into my pockets"
 ambitions_inv_4_title: "Mysteries from the East"
 ambitions_inv_4_desc: "You have heard entertaining stories of a traveling astrologer named [mystic_man.GetName] that seems to have captivated the elites of our court; whether this is due to the boredom of the upper classes or the supernatural power of this soothsayer remains to be seen.\n\nApparently, he claims to be a purveyor of Babylonian mysteries, and for a fixed price will tell you your future. There are many people you know who are intrigued by these risible stories, and when word arrives one day that Nabu will be giving horoscopes at a drinking party, your curiosity gets the best of you and you agree to go see what the fuss is all about. \n\nYou have been waiting for over an hour in the courtyard where everyone has gathered, when suddenly there is a loud banging on a drum and the clanging of cymbals. Nabu appears from behind a curtain, a striking figure with a bushy black beard and wild eyes that peer out from underneath the Phrygian cap he wears.\n\n Waggling his fingers from the voluminous sleeves of his colorful robes, he begins to intone 'The ancient wisdom of the Chaldeans has been made known to me; the secrets of the gods are revealed by the passage of the stars in the firmament. But knowing the will of Heaven comes at great personal cost, wracking a toll on my body.' He punctuates this with a hoarse cough, causing you to roll your eyes as he continues. 'Yet I am willing to share my gifts for the measly sum of one hundred coins per horoscope. Come, gather before me if you want to know the future.' \n\nOne hundred coins! What an absolute racket. Snorting, you turn to laugh with the guest sitting beside you, but he is no longer there; he is kneeling in front of Nabu, coin purse in hand. Chanting shrilly in a strange tongue, Nabu puts his hands on his head and pushes him to the ground, to scattered polite applause from those in attendance.\n\n'Long life and health to the supplicant; it has been ordained!' Nabu sucks air between his teeth and turns to you, gesturing for you to come forward."
 ambitions_inv_4.a: "I guess there's no harm in having some fun"
 ambitions_inv_4.b: "This is absurd...only an idiot would believe this"
 # name of the astrologer created by ambitions_inv.4
 Nabu: "Nabu"
 Kullani: "Kullani"
 ambitions_inv_5_title: "Free Bread for the People"
 ambitions_inv_5_desc: "It is a beautiful day in [your_province_scope.GetArea.GetRegion.GetName], unseasonably pleasant with a gentle breeze that is distracting you from your work. Your grumbling stomach settles it; you will head down to the market and enjoy a meal outdoors for once. Gathering your attendants, you head down to the main square and are greeted by a surprising sight. There are long lines standing in front a tent that has a large painted placard; 'Free Bread'. The streets are filled with laughing children, chasing each other and munching on little rolls. You make a couple of inquiries and find out that [scheme_target.GetName] has been distributing freshly baked bread every day for the past week. One of your men brings you back one of the loaves and you see the imprint of [scheme_target.GetShortName]'s name baked into the crust. Furrowing your brow, you set your jaw; while this in undoubtedly a generous gesture, you feel a slight twinge of jealousy. If your people are going to enjoy free bread, then we should be the one distributing it! What do you want to do about this?"
 ambitions_inv_5.a: "Set up a tent next to them and hand out wine and meat"
 ambitions_inv_5.b: "I don't trust this at all. Shut it down."
 ambitions_inv_6_title: "Rot in the Camp"
 ambitions_inv_6_desc: "You have received a troubling report from your financial administrators, filled with damning evidence that [scheme_target.GetName] has been abusing the position you entrusted them with. Knowing that [scheme_target.GetShortName] excels in the military arts, you had appointed them to oversee the training at one of our military camps, but instead of using the allotted funds to provide food and equipment for the soldiers, it seems that [scheme_target.GetShortName] diverted over a third of the budget into their personal coffers. It is true that you had noticed the ostentatious clothing that [scheme_target.GetShortName] has been wearing lately at court, but you never thought twice about where this money could be coming from. What audacity, to flaunt the stolen wealth in front of your very eyes! You will absolutely have to do something about this, lest others think they can skim with impunity."
 ambitions_inv_6.a: "Impose sanctions and demand they repay me...with interest!"
 ambitions_inv_6.b: "Imprison [scheme_target.GetName] for corruption"
 ambitions_inv_6.c: "Have [scheme_target.GetName] executed!"
 ambitions_inv_7_title: "Verdicts for Sale"
 ambitions_inv_7_desc: "As part of their familial responsibilities, occasionally [scheme_target.GetName] presides over local court cases that are too insignificant to bother you with; petty disputes over land and property, or arguments over inheritances and dowries; the minutiae of grievances that comprise the lives of our squabbling people. Preferring not to hear about any of these matters at all, you are irritated to find out that apparently [scheme_target.GetShortName] has been openly accepting bribes in order to sway justice, debasing our law courts by turning them into an auction. Just recently, someone clearly guilty of murder - literally caught in the act of stabbing a woman to death - handed over a bag of silver coins to [scheme_target.GetShortName] and was immediately released. The local people are starting to grumble at these perversions of justice and something should be done before it spirals out of control."
 ambitions_inv_7.a: "Send a message to [scheme_target.GetShortName] that they better get it together, or else"
 ambitions_inv_7.b: "This is intolerable...have [scheme_target.GetShortName] arrested"
 ambitions_inv_8_title: "Defrauding the Treasury"
 ambitions_inv_8_desc: "There is a complicated judicial matter that is causing great consternation among your people, forcing you to intervene before it gets out of hand. The notoriety of this matter is known all across our country; although this is a complex legal affair, with arcane statutes involved, the intimate details are known to practically everyone, underscoring the vast public interest in this case.\n\nDuring our last war, in a desperate hour when it seemed that victory might slip from our fingers, you had decreed that the state would underwrite the transportation of provisions to the front by private contractors, a break with normal military practice. Your military supply lines were threatened by the continued harassment of your foes, and although the prudence of your orders were challenged by some of your advisors, you pushed your initiative through. Your ingenuity was rewarded in the end, as expected, and we succeeded and were ultimately triumphant; thinking the matter finished, you began to collect the war indemnities and went about the business of paying your contractors. It was during this process that you discovered that [scheme_target.GetName], one of the leading partakers in your unorthodox scheme, had falsified [scheme_target.GetHerHis] reports that they had submitted. Not only did they send rotting foodstuffs to the front, an offense to the soldiers that were starving and waiting for those supplies, but they triple-charged the state by submitting grossly inflated numbers after the fact.\n\nThe bitterness of our recent conflict lingers in the memory of our populace, and when the grim details of this legal case began to spread, the public was furious. This fraud is seen as a terrible insult to the memories of our men and people are out for blood. The court of public opinion is overwhelmingly against [scheme_target.GetShortName], but you must tread carefully in how you deal with them, lest you make powerful enemies among the nobility. After all, it was these extensive political connections that landed [scheme_target.GetShortName] the contract in the first place."
 ambitions_inv_8.a: "Order that [scheme_target.GetShortName] repay every coin they defrauded"
 ambitions_inv_8.c: "Arrest [scheme_target.GetShortName] and throw them into the dungeon!"
 ambitions_inv_8.d: "Our hands are tied in this matter..."
 ambitions_inv_9_title: "Sticky Fingers"
 ambitions_inv_9_desc: "The time has come to send out the tax collectors, and, as is usual practice, [scheme_target.GetName] is entrusted with overseeing the collection of revenues from the provinces closest to [scheme_target.GetHerHis] home. This arrangement has worked wonderfully in years past and you have no reason to think that things will be any different this time. Still, when the final numbers are tallied in the counting houses of our capital, it appears that the incomes have substantially dropped, which makes no sense, especially considering the investments you have personally directed into the region. You know that times are tough everywhere, but a loss of forty percent is unprecedented - there is no reason that the numbers should be that low. \n\nYou know that pinching a few coins off of the top is part and parcel of tax collecting; indeed, this is how the tax collectors are paid, but you believe that [scheme_target.GetName] has taken this a little too far. Should you summon them to stand before you and tell you what happened?"
 ambitions_inv_9.a: "[scheme_target.GetShortName], you have a lot of explaining to do..."
 ambitions_inv_9.b: "Bah, write off the losses and forget about it"
 ambitions_inv_10_title: "A Black Market for Religious Goods"
 ambitions_inv_10_desc: "Every year, a good deal of our treasury is spent on maintaining our religious facilities; a privilege that a good ruler takes seriously. Our priests are never wanting for food or clothing, and when the appointed time comes, you make large purchases of specialty goods, like incense from Arabia, so that the sweet vapors of our devotion might fill our shrines and rise to Heaven, ensuring our continued divine favor. In recent years, you have actually purchased all of the incense that the merchants bring with them, becoming familiar with the various types offered, from which lands they hail, and what constitutes the highest quality.\n\nYou know better than most that incense in particular costs a pretty penny, but you never balk at the expense, knowing that your piety pleases the people. However, you have heard disturbing reports that make you quake in indignant rage at the blasphemy; one of our advisors, a religious fanatic with extensive properties, has apparently been selling incense on a black market...but there is no way that they could have access to it unless they have been stealing from the temples.\n\nSending a disguised soldier to buy some clandestinely, you confirm with your own eyes that it is the exact type of incense that you just purchased. This is an outrageous affront!"
 ambitions_inv_10.a: "Confiscate all of the stolen goods!"
 ambitions_inv_10.b: "Whoever is responsible will pay for these crimes with their life!"
 ambitions_inv_10.c: "Allow this market to continue, but demand that we get our cut"

 # dhe/dhe_city_fall.txt (support: modifiers and effect tooltips)
