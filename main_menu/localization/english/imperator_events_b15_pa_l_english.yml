 STATIC_MODIFIER_NAME_country_improvement_carthaginian_fleet: "Carthaginian Fleet"
 STATIC_MODIFIER_NAME_into_ashes: "Into Ashes"
 STATIC_MODIFIER_NAME_rm_4_salted_pmod: "Salted the Earth"
 STATIC_MODIFIER_NAME_province_diminishment_extremely_looted: "Extremely Looted"
 STATIC_MODIFIER_NAME_province_improvement_merciful_conqueror: "Merciful Conqueror"
 neutral_conqueror_effect_tooltip: "#Y 12.5%#! of the population of #Y [special_province.GetName]#! will perish."
 sacking_conqueror_effect_tooltip: "#Y 33%#! of the population of #Y [special_province.GetName]#! will perish."
 salt_earth_effect_tooltip: "#Y 50%#! of the population of #Y [special_province.GetName]#! will perish."
 dhe_city_fall.1.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.1.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\nThe city has long been the heart of Carthaginian culture and nation, well known for its grand harbor and long reaching trade relations. It bound together a trade empire stretching from Hispania in the west all the way to the old Phoenician cities in the east.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.1.desc_2: "In the Great Green, a war of vengeance raged between the Carthaginians and the [ROOT.GetLocation.GetOwner.GetAdjective]s. We have been driven by generations of oppression, and now seek to reclaim our freedom and honor once and for all. As the siege of Carthage commenced, our generals led the [ROOT.GetLocation.GetOwner.GetAdjective] forces with unwavering determination. The battle was fierce, with both sides fighting desperately for their cause.\n\nThe walls of Carthage stood strong, but our horned warriors were relentless. The [ROOT.GetLocation.GetOwner.GetAdjective] strategic brilliance and the indomitable spirit of our warriors slowly chipped away at the city's defenses. Amidst the chaos of the battle, a daring plan emerged. Under the cover of night, a group of valiant Punic-speaking scouts infiltrated the city, sabotaging Carthage's supply lines and morale - we have used their language against them.\n\nAs the days turned into weeks, our steadfast efforts began to yield fruit and the Carthaginian resistance started to crumble beneath our feet. At the apogee of the battle, our leadership inspired the soldiers with the hallowed war cries of our people, recalling the memories of old with these ancient chants and forging an unbreakable bond that would determine the outcome of the siege. The decisive day arrived when the [ROOT.GetLocation.GetOwner.GetAdjective]s breached Carthage's walls, unleashing a wave of triumph in the name of our ancestors and our sole God.\n\nNow it is up to our wise [ROOT.GetLocation.GetOwner.GetGovernment.GetRulerTitle] to choose the fate of our enemy of old - shall we foolishly leave them untouched, filling our hearts with a feeling of injustice, or shall we reclaim the honor of our ancestors? Our people, our navy, and our army have faith in whatever decision [ROOT.GetLocation.GetOwner.GetGovernment.GetRuler.GetName] makes, but we cannot disappoint them."
 dhe_city_fall.1.a: "The people of [special_province.GetName] will be left alone."
 dhe_city_fall.1.b: "Only their greatest artifacts will be brought back to [ROOT.GetLocation.GetOwner.GetName]."
 dhe_city_fall.1.c: "Take everything of value."
 dhe_city_fall.1.d: ""Carthage shall be a wasteland ever more!""
 dhe_city_fall.1.e: "NO MERCY, NO PRISONERS."
 nuragic_dhe_city_fall.1: "\n\nThe Nuragic people expect justice, and showing mercy will be perceived as weakness."
 dhe_city_fall.2.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.2.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\nThe city was the home and center of the budding Roman Republic, known for their ruthless and impressive war prowess. Rapidly expanding outwards from their home, they became a major player in the politics of the peninsula, and started interacting with the nations all across the Mediterranean. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.2.a: "We will leave the Romans to their own devices."
 dhe_city_fall.2.b: "Some of their greatest artifacts could be of value to us."
 dhe_city_fall.2.c: "Sack the city, leave nothing of value behind."
 STATIC_MODIFIER_NAME_country_improvement_roman_morale: "Roman Morale"
 dhe_city_fall.3.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.3.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\nSettled by Alexander the Great himself in the middle of his campaign, it is said he foreshadowed the city to become one of the capital cities of his newfound empire. After his death, the city's importance only grew and it became a home to center and learning for all Hellenic culture under Ptolemaic leadership. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.3.a: "This marvelous city will be protected."
 dhe_city_fall.3.b: "We will take some of their most impressive artistry with us back home."
 dhe_city_fall.3.c: "Search every home for something of value, and bring it back to [ROOT.GetLocation.GetOwner.GetName]."
 STATIC_MODIFIER_NAME_country_improvement_alexandrian_technology: "Alexandrian Technology"
 dhe_city_fall.4.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.4.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] was the ancient capital of the Egyptians, an important center for commerce and religion. Throughout most of Egyptian history it has played an important role between upper and lower Egypt. Severing that link is only the first of many steps in taking control of the area. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.4.a: "We will make sure to keep this ancient city untouched."
 dhe_city_fall.4.b: "Let us take some of their awe-inspiring artifacts with us back home."
 dhe_city_fall.4.c: "We will impress everyone with the heirlooms and monuments taken from [special_province.GetName]."
 STATIC_MODIFIER_NAME_country_improvement_memphian_goods: "Memphian Goods"
 dhe_city_fall.5.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.5.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] has been the home of the Phoenician traders since time immemorial. For many centuries the traders of the Phoenician cities traveled as far as Hispania far to the east, and everywhere between the two areas. It was one of the final cities of the region to fall to Alexander when he campaigned through Persia, razing parts of the city for its defiance.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.5.a: "We will leave [special_province.GetName] alone."
 dhe_city_fall.5.b: "They will not mind if we take some precious artifacts, right?"
 dhe_city_fall.5.c: "The secrets of the Phoenicians will be taken back home with us."
 STATIC_MODIFIER_NAME_country_improvement_tyrian_resources: "Tyrian Resources"
 dhe_city_fall.6.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.6.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] has stood at the forefront of the Israelite culture and people for centuries. At the center of the city stands a grand temple to their god, an impressive building unlike any other. The city has roots deep into the past, once the capital of the Israelite Kingdom of Judah, before its capture by the Egyptians. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.6.a: "We will give the people of [special_province.GetName] a protecting hand."
 dhe_city_fall.6.b: "We will make sure our people do not take everything."
 dhe_city_fall.6.c: "The city is ours for the picking."
 STATIC_MODIFIER_NAME_country_improvement_jerusalemite_monuments: "Jerusalemite Monuments"
 dhe_city_fall.7.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.7.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\nThe city was built close to a shrine to Zeus Bottiaaeus, supposedly dedicated by Alexander himself. After the Conqueror's fall, the city was settled by Antigonos Monophthalmos as the sight for his capital. It stands at the crossroads between Anatolia, Syria and Armenia, and plays an important role in the regional politics of the area.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.7.a: "This capital city of Antigonos will be left alone."
 dhe_city_fall.7.b: "Our men will only take some of their artistry back home."
 dhe_city_fall.7.c: "We will make sure our people take everything."
 STATIC_MODIFIER_NAME_country_improvement_great_trade_routes: "Great Trade Routes"
 dhe_city_fall.8.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.8.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\nBabylon was built by the Euphrates and was an important city-state and kingdom, being one of the major players of the regional politics of Mesopotamia. With the fall of its independence, it has become one of the more important cities of the Persian Empire, and later on one of the key cities of Alexander the Great. The very same also fell ill and died in Babylon, beginning the shattering of his own short-lived empire.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.8.a: "Babylon will remain untouched."
 dhe_city_fall.8.b: "We will share some of these artifacts back home."
 dhe_city_fall.8.c: "Take everything of value back to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 STATIC_MODIFIER_NAME_country_improvement_babylonian_experience: "Babylonian Experience"
 dhe_city_fall.9.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.9.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] was settled by Seleukos Nikator as his new capital city, lying the very center of his enormous empire. Standing at the banks of Tigris and close to one of the canals from the Euphrates, it truly is at the crossroads of all the most important trade routes of the region. As a home for a large number of Greeks and Macedonians, it has played an important role in Hellenizing Mesopotamia, in many ways being quite similar to the Seleukid Empire itself.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.9.a: "The city of Seleukos has nothing to fear from us."
 dhe_city_fall.9.b: "We will only take the most important artifacts."
 dhe_city_fall.9.c: "Take everything."
 STATIC_MODIFIER_NAME_country_improvement_seleucian_bureaucracy: "Seleukid Bureaucracy"
 dhe_city_fall.10.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.10.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] was for a long time one of the capital cities of the Persian empire, and not only did it play an important role in the nearby region, but it was also a religious center for the Persian empire as a whole. After being taken by Alexander, huge swaths was burnt to the ground in a drunken revel, supposedly as revenge for the Persian burning of the Acropolis of Athens.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.10.a: "We will make sure to keep the great city untouched."
 dhe_city_fall.10.b: "Our soldiers will only take a couple of monuments back home."
 dhe_city_fall.10.c: "Sack the city."
 STATIC_MODIFIER_NAME_country_improvement_monuments_of_persepolis: "Monuments of Persepolis"
 dhe_city_fall.11.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.11.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] has played an important role in the regional politics for a long time, being both the capital of the Shishunaga and Nanda empires before it was captured by the Mauryans, and eventually became the capital of their empire as well. Being at the center of several empires and for the commerce of the region has turned [special_province.GetName] into a marvelous city to behold, one that other cities and nations could only hope to copy.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.11.a: "[special_province.GetName] will stand untouched."
 dhe_city_fall.11.b: "Only the most valuable artifacts will be taken."
 dhe_city_fall.11.c: "Take everything of value."
 STATIC_MODIFIER_NAME_country_improvement_warelephants_of_pataliputra: "War Elephants of Pataliputra"
 dhe_city_fall.12.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.12.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] has been the capital of the Syracusan despots for a long time, a center of learning and technology in Magna Graecia. The city saw a lot of struggles with their Carthaginian neighbors to the south-west, as well as several conflicts with the other Greek city-states in the region.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.12.a: "The marvelous city will become a new essential part of [ROOT.GetLocation.GetOwner.GetName]."
 dhe_city_fall.12.b: "We will take the most important artifacts, but keep the city otherwise unharmed."
 dhe_city_fall.12.c: "The city is ours for the picking."
 STATIC_MODIFIER_NAME_country_improvement_syracusan_technology: "Syracusan Technology"
 dhe_city_fall.13.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.13.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] was one of the two major actors in the Peloponnesian War, as well as at the head of the Athenian League and one of those who struggled against Persian oppression. It was known as a center for philosophers from all around Greece, and for their particular democratic process in how their city-state should proceed. After the Macedonians came to the stage in regional politics, Athens has often sought to regain their power and independence.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.13.a: "The home of the philosophers will be unaffected by our rule."
 dhe_city_fall.13.b: "We will only take some cultural artifacts back home."
 dhe_city_fall.13.c: "Take everything, leave nothing of value behind."
 STATIC_MODIFIER_NAME_country_improvement_athenian_ideas: "Athenian Ideas"
 dhe_city_fall.14.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.14.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] was one of the two major actors in the Peloponnesian War, as well as one of the city-states who struggled against Persian oppression. The Lacedaemonians are almost mythical for their undeniable war prowess and army strength, despite their minor population numbers. After the Macedonians came to the stage in regional politics, Sparta lost most of its importance, in huge part because of a declining population.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.14.a: "The proud home of the Lacedaemonians will remain unharmed."
 dhe_city_fall.14.b: "Some artifacts will be taken from [special_province.GetName] back home to [ROOT.GetLocation.GetOwner.GetName]."
 dhe_city_fall.14.c: "These petty hovels will be ripped apart, if needed, to find anything of value."
 veneto_flavour_event.1.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to [ROOT.GetLocation.GetOwner.GetAdjective] troops.\n\nMany years ago now, 452 years after the founding of [ShowLocationName('rome')], and 881 years after the founding of [ShowLocationName('padova')], a prince of Sparta, Kleonymos, led his fleet to [ShowLocationName('padova')] intent on destruction and conquest. He was defeated, of course, by a great $venetic$ fleet, with his forces all but destroyed, but not before sacking much of the surrounding Patavii lands. Now, the [special_province.Custom('pa_imp_get_city_type_loc')] of these invaders, [special_province.GetName], is in our hands.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. Do we take revenge, and utterly sack the city? Or do we forgive the people of [special_province.GetName] for the trespasses of one ambitious prince, and make use of their longheld military traditions?"
 STATIC_MODIFIER_NAME_country_improvement_spartan_discipline: "Spartan Discipline"
 dhe_city_fall.15.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.15.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] was a relatively minor city compared to its southern neighbors, until the sudden rise of Macedonian power. After the hegemony of Philip II and the great campaigns of his son, Alexander, the city became one of the richest and most important Greek trade ports, and home to the Macedonian culture that spread all through Persia. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.15.a: "The home of Alexander will remain as it once stood."
 dhe_city_fall.15.b: "Only a few of the Macedonian treasures will be brought back home."
 dhe_city_fall.15.c: "We will have a sacking that would impress Alexander himself."
 STATIC_MODIFIER_NAME_country_improvement_pellan_treasures: "Treasures of Pella"
 dhe_city_fall.16.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.16.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] was settled as the capital of Lysimachos, Alexander's only non-Macedonian successor to last so long. Situated at the Thracian Chersonese, it has played an important role since its founding, both as a major trade port and as a regional center of administrative power.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.16.a: "The city will remain unscathed."
 dhe_city_fall.16.b: "Only the greatest of artifacts will be brought back home."
 dhe_city_fall.16.c: "Take everything of value."
 STATIC_MODIFIER_NAME_country_improvement_lysimacheian_materials: "Lysimacheian Materials"
 dhe_city_fall.17.t: "Conquest of [special_province.GetName]"
 dhe_city_fall.17.desc: "The [special_province.Custom('pa_imp_get_city_type_loc')] of [special_province.GetName] has finally fallen to our troops, and is now in our hands.\n\n[special_province.GetName] is well known across the Mediterranean for their independent streak as well as their great craftsmen. Though several kings and rulers have temporarily taken control of the island, it has fought back its independence at every turn. Most impressive was a hard fought victory against Antigonos Monophthalmos and his son Demetrios.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.17.a: "The great workers of Rhodes will be left alone."
 dhe_city_fall.17.b: "Some of their great glass works will be brought back to [ROOT.GetLocation.GetOwner.GetCapital.GetName]."
 dhe_city_fall.17.c: "Take everything of value."
 STATIC_MODIFIER_NAME_country_improvement_rhodesian_designs: "Rhodian Design"

 # FMO_CFT_lifestyle_events.txt
 lifestyle_events.1.t: "[ROOT.GetCountry.GetName]'s Historic Address"
 lifestyle_events.1.desc: "In recent times, [ROOT.GetCountry.GetName] has surged in power, its borders extending to new lands, and with this growth, the shadows of conflict loom ominously. Our top advisors have called on [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to ease the populace's fears. Foreign dignitaries, revered philosophers, courageous generals, and even some scattered plebeians have assembled in the center of [ROOT.GetCountry.GetCapital.GetName], all eagerly awaiting my discourse. As I step forward, I am acutely aware of the monumental significance of our burgeoning empire and the responsibilities it bestows upon me. With a backdrop of architectural marvels that have withstood the tests of time, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] embarks on an oration of unmatched brilliance openly acknowledging the undeniable reality of our expanding borders, not merely offer platitudes; instead, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] speaks of unity, highlighting the shared ideals that unite our diverse populace and emphasizing the boundless opportunities that our growth has ushered in. [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s speech undeniably holds the undivided attention of the assembly; skepticism gives way to understanding, and concern transforms into optimism. In their words, the people find reassurance, the nobility gains newfound confidence, and the generals begin to grasp the vital importance of diplomacy in safeguarding our hard-won territories."
 lifestyle_events.1.a: "May sagacity guide our expansion."
 lifestyle_events.2.t: "The Oratory Talent of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]"
 lifestyle_events.2.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] stands at the precipice of greatness, but among the citizenry are whispers of unease. Some of the populace harbor concerns about the exercise of power and the specter of tyranny. In response, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] chooses to address the people not as a ruler, but as a charismatic figure who understands their fears. On a modest platform in the heart of [ROOT.GetCountry.GetCapital.GetName], beneath the watchful eyes of the ancestors, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] stands as a captivating orator. [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] #high charisma#! fills the air, enthralling the assembled crowd. With a magnetic presence, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] speaks not from a throne but as a fellow citizen who shares their hopes and concerns. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] acknowledges the undeniable reality of their era for [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is not sheltered from its challenges. [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] has felt the same concerns that weigh upon the people, the fear of a return to the old ways, a return of #high tyrants#! acting with unchecked power But let it be known that in this moment, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] pledges to uphold the ideals that [ROOT.GetCountry.GetName] holds dear and yearn for just adherence to the rule of law. In the presence of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s remarkable #high charisma,#! doubts and fears melt away. The people leave the gathering with renewed faith in their leader's ability to navigate the challenges of their era while upholding the values dear to [ROOT.GetCountry.GetName]"
 lifestyle_events.2.a: "Maybe [ROOT.GetCountry.GetGovernment.GetRuler.GetName] isn't so bad."
 lifestyle_events.3.t: "[ROOT.GetCountry.GetName]'s Quest for an Heir"
 lifestyle_events.3.desc: "Recently, a profound transformation has swept over [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. Once renowned for placing their obligations to the people of [ROOT.GetCountry.GetName] above tending to [ROOT.GetCountry.GetGovernment.GetConsort.GetName]'s desires, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has now become consumed by a singular desire, to secure the future of their lineage. Tempted by the pressing need to shore up the succession, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] finds [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self driven by a relentless pursuit of parenthood, willing to go to any lengths to ensure their legacy endures. In the halls of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s residence in [ROOT.GetCountry.GetCapital.GetName], attendants now playfully quip that [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s recent sleepless nights were not spent attending matters of state but were about 'getting down to business' of a different kind."
 lifestyle_events.3.a: "All this business sounds rather less dull than normal."
 lifestyle_events.4.t: "New Found Talent as a Speaker"
 lifestyle_events.4.desc: "Some of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s less desirable traits have been hindering their ability to connect with the populace as well as creating misunderstandings and barriers to effective communication even between [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self and their most trusted confidants. Recognizing the importance of engaging with the people, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has decided to seek guidance from a trusted advisor to shed some of their negative speech habits and find their voice as a captivating speaker. The path to self-improvement begins as [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has become committed to bettering [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self. But the question remains, which of [ROOT.GetCountry.GetName]'s advisors should [ROOT.GetCountry.GetGovernment.GetRuler.GetName] turn to for guidance?"
 lifestyle_events.4.a: "[charisma_thinker.GetName] can assist with the #high reclusiveness.#!"
 lifestyle_events.4.b: "[finesse_thinker.GetName] can help us keep us from being overly #high blunt#!."
 lifestyle_events.4.c: "Surely [zeal_thinker.GetName] can cure our #high shyness#!."
 lifestyle_events.5.t: "Fitness of [ROOT.GetCountry.GetName]"
 lifestyle_events.5.desc: "After hearing tales of ancient heroes, battling against all odds, a fervor for martial excellence has seized [ROOT.GetCountry.GetGovernment.GetRuler.GetName], desiring to cast aside their #high frailty#!. Recognizing the pivotal role of combat prowess in shaping the destiny of [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has embarked on an intensive training regimen under the guidance of [martial_thinker.GetName]. Every morning, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] can be found on the training grounds, clad in armor and wielding weapons with unwavering determination."
 lifestyle_events.5.a: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has gone from #high frail#! to #high formidable#!."
 lifestyle_events.6.t: "Inspiring Command of [ROOT.GetCountry.GetName]"
 lifestyle_events.6.desc: "As [ROOT.GetCountry.GetGovernment.GetRuler.GetName] audited the training grounds, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] couldn't help but notice the potential in the young men who sought to join [ROOT.GetCountry.GetName]'s military. It became apparent that there was an opportunity to inspire these recruits and instill in them a deep sense of duty and honor. With a stirring speech and a demonstration of their own combat prowess, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] rallied the young hopefuls, encouraging them to devote their lives to the protection and prosperity of their homeland. The call to arms resonated not just as a duty but as a noble cause worth sacrificing for, ensuring that the ranks of the [ROOT.GetCountry.GetName]'s military would soon swell with dedicated and skilled soldiers."
 lifestyle_events.6.a: "Do your duty and leave the rest to the gods."
 lifestyle_events.7.t: "The Strategikon of [ROOT.GetCountry.GetName]"
 lifestyle_events.7.desc: "In the dimly lit chambers of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s quarters, a remarkable endeavor unfolds. With a stylus in hand, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has embarked on a formidable task—to inscribe a comprehensive manual of war onto durable scrolls, the likes of which [ROOT.GetCountry.GetName] has never seen. Hours turn into days, and days into weeks, as [ROOT.GetCountry.GetGovernment.GetRuler.GetName] diligently compiles their military wisdom, tactics, and strategies. The weight of countless battles and campaigns waged by [ROOT.GetCountry.GetName] is etched onto those scrolls, each symbol and line representing the determination to secure [ROOT.GetCountry.GetName]'s future."
 lifestyle_events.7.a: "Generations of tacticians and commanders will find inspiration in #high [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s Strategikon#!."
 lifestyle_events.8.t: "Hard Times Breed Hard Men"
 lifestyle_events.8.desc: "The weight of leadership has taken its toll, hardening [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s heart and leading them down a path of #high cruelty#!. Once known for their benevolence and fairness, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] now rules with an iron fist, showing little mercy to those who defy their authority. The populace watches in dismay as their [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s compassion wanes, replaced by a ruthless determination to maintain order at any cost."
 lifestyle_events.8.a: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s strong rule will bring about better times."
 lifestyle_events.9.t: "Acquiring Personal Wealth"
 lifestyle_events.9.desc: "Over the years, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has displayed a keen sense of #high financial acumen#!, making shrewd personal investments in various seemingly hopeless ventures. One of these endeavors, operated by [finesse_thinker.GetName] and once regarded with skepticism by some, has now blossomed into a lucrative enterprise. [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s trust and astute decision-making will surely net them a tidy profit. Many of the courtiers and advisors who once questioned [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s financial acumen now look on in admiration at their remarkable success."
 lifestyle_events.9.a: "They would do well to learn from our example."
 lifestyle_events.10.t: "Purchase of New Land"
 lifestyle_events.10.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has seized an opportunity to #high expand their holdings#!. A struggling businessman, beset by debts and challenges, sought refuge in selling his property in [holding_province.GetName]. Recognizing the hidden potential and strategic value of the land, agents acting on behalf of [ROOT.GetCountry.GetGovernment.GetRuler.GetName] negotiated a deal and acquired this new parcel for a criminally low price...It's whispered among the locals that the former owner, after parting with his land, has mysteriously vanished without a trace, leaving behind a trail of questions and rumors that linger like shadows."
 lifestyle_events.10.a: "Let us not question the hand of fate."
 lifestyle_events.11.t: "The Tragedy of Midas the Gilded"
 lifestyle_events.11.desc: "Did you ever hear the tale of #high King Midas the Gilded#!? It's not a story the poor would tell you. It's a #Y Phrygian#! myth. #high King Midas#!... was a monarch so greedy and so obsessed with amassing wealth he sought to have more gold than any other man. He had such a fixation on this precious metal that when picking his reward for treating #high Silenus#! well, he asked for the power to transform all he touched into that glittering treasure. The worship of #Y #high Dionysus#!#! is a pathway to many abilities... some consider to be unnatural. He was granted his wish, and at first, he reveled in this newfound ability, seeking to turn all of his possessions into solid gold. Which eventually, of course, he did. Unfortunately, upon embracing his daughter, #high Marigold#!, she too turned to gold. Then, in horror, he prayed to #Y #high Dionysus#!#! for a way to reverse the process. It's ironic. He could prevent himself from turning to gold, but not others. "
 lifestyle_events.11.a: "Is it possible to learn this power?"
 lifestyle_events.12.t: "Big Beautiful Buildings"
 lifestyle_events.12.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] is determined to leave a lasting mark on the face of [ROOT.GetCountry.GetName], committing some of their personal funds to the construction of infrastructure in [building_province.GetName] that will benefit [ROOT.GetCountry.GetName] for generations to come. What construction project is in most need of our patronage?"
 lifestyle_events.12.a: "Surely a luxurious #high villa#! on a country estate."
 lifestyle_events.12.b: "A splendid #high commons building#! would certainly appease the commoners."
 lifestyle_events.12.c: "Surely an impressive #high aqueduct#! would ingratiate us to the masses."
 lifestyle_events.12.d: "Establishing a #high hub of commerce#! would stimulate economic growth."
 lifestyle_events.13.t: "The Piety of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]"
 lifestyle_events.13.desc: "These past few nights, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been plagued by ominous dreams filled with enigmatic symbols and foreboding prophecies. Seeking answers, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] turns to their trusted advisors, questioning the meaning behind these unsettling visions. The council is divided, some attributing the dreams to #high the whims of the gods#!, while others suggest more earthly explanations. However, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] becomes increasingly convinced that the dreams are a #high divine message#!, a call to #high piety#! and #high devotion#!. [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] dedicates [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self to the gods and their will."
 lifestyle_events.13.a: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] desires to eventually go on #high pilgrimage#! to one of the places most sacred to [ROOT.GetCountry.GetGovernment.GetRuler.GetReligion.GetName]."
 lifestyle_events.14.t: "Do Not Disturb My Circles!"
 lifestyle_events.14.desc: "Recognizing the potential for progress and improvement, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has summoned the #high wisest minds and most skilled artisans#! from across our dominion to gather in [ROOT.GetCountry.GetCapital.GetName]. There, in the hallowed halls of learning, they will compete in a contest to push the boundaries of their various fields of study. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] hopes that together, they embark on a journey of #high enlightenment#! and #high invention#!, ushering in a new era of discovery. \n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetName] diligently checks up on their progress daily, eager to witness the fruits of their collective brilliance. [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] has paid careful attention to the work of #high [finesse_thinker.GetName]#!, who in their youth studied under a great philosopher, one who was untimely cut down by a rogue soldier during a siege. [finesse_thinker.GetName] has spent much of their adult life attempting to complete his teacher's fragmented and unfinished manuscript."
 lifestyle_events.14.a: "[finesse_thinker.GetName] sent word to that the first portion of the work has been finished."
 lifestyle_events.15.t: "[ROOT.GetCountry.GetName] the Blessed"
 lifestyle_events.15.desc: "In [ROOT.GetCountry.GetName], there is a growing belief that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is not merely a ruler of men but a favored child of the gods themselves. Signs and omens seem to follow their every step, despite the rigors of ruling and the many challenges they face, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] remains hale and hearty, evidently blessed by the divine with extraordinary health and vitality."
 lifestyle_events.15.a: "May the divine watch over us all."
 lifestyle_events.16.t: "Missionary Work"
 lifestyle_events.16.desc: "In a show of deep piety and support for [ROOT.GetCountry.GetReligion.GetName], [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has embraced the cause of a faction of the #high priesthood#! focused on #high prostelzation#!, dispatching them to [conversion_province.GetName] so that they might spread the light of faith to nonbelievers."
 lifestyle_events.16.a: " #high Many#! shall embrace the faith."
 lifestyle_events.16.b: " #high A few#! shall find the light."
 STATIC_MODIFIER_NAME_celtic_hordes: "Celtic Hordes"
