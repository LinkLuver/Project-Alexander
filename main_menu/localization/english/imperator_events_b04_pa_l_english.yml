l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b04 (2026-09-30)

 # internal_politics_monarchy_part1.txt
 ip_monarchy.1.t: "Bitter Feud"
 ip_monarchy.1.d: "Side with [successor_target_2.GetShortName], the chosen heir!"
 ip_monarchy.1.c: "Side with [successor_target_1.GetShortName], the chosen heir!"
 ip_monarchy.1.b: "It is not the time to squabble like children."
 ip_monarchy.1.desc: "The [ROOT.GetCountry.Custom('pa_imp_get_court_type')] is bustling with sycophants, claimants, and pretenders. It is of little surprise, therefore, that two of the most ambitious claimants to the throne of [ROOT.GetCountry.GetName], have found themselves at odds.\n\nThese conflicts have a way of getting out of hand; perhaps we ought to step in and limit the potential for escalation."
 ip_monarchy.1.a: "Hah, let them fight!"
 surveillance_tooltip: "[plotting_pretender.GetShortName] will be put under surveillance.\n[plotting_pretender.GetShortName] may discover [plotting_pretender.GetSheHe] is being tailed!"
 ip_monarchy.2.a: "Nonsense, we should put more faith in our subjects."
 ip_monarchy.2.t: "Plot: Whispers in the Dark"
 ip_monarchy.2.desc: "The greatest threat to any nation comes not from without, but from within.\n\nThe constant infighting between those who would name themselves heir can consume countless resources and lives. Our spies at the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] are certain that [plotting_pretender.GetName], a [plotting_pretender.GetWomanMan] who has made no secret of [plotting_pretender.GetHerHis] ambitions for the throne, is plotting to ensure [plotting_pretender.GetHerHis] future by doing away with the competition.\n\nWe should keep a watchful eye on [plotting_pretender.GetShortName]."
 ip_monarchy.2.b: "Pay to have [plotting_pretender.GetHerHim] closely observed."
 plot_event_chain_tooltip: "Starts a #Y Plot#! event chain."
 successor_warned_tooltip: "[plot_target.GetShortName] will be warned that [plot_target.GetSheHe] is the target of a #Y Plot#!."
 ip_monarchy.3.t: "Plot: Meeting of Minds"
 ip_monarchy.3.desc: "[plotting_pretender.GetName] has been spending increasing quantities of time with [plotting_pretender_2.Custom('pa_imp_get_successor_type')]; [plotting_pretender_2.GetName].\n\nThese two are natural enemies, so it might be wise to be particularly careful with this developing situation.\n\n[plot_target.Custom('pa_imp_get_surveillance_paragraph_ip3')]."
 ip_monarchy.3.a: "Troubling."
 ip_monarchy.3.b: "Offer the conspirators increased responsibility."
 ip_monarchy.3.d: "Warn [plot_target.GetShortName] at once!"
 pretender_2_leaves_plot: "[plotting_pretender_2.GetName] will no longer be involved in this #Y Plot#!."
 ip_monarchy.3.c: "Perhaps we can convince [plotting_pretender_2.GetShortName] not to get involved."
 no_action_taken_tooltip: "No action will be taken."
 end_plot_chain_tooltip: "This will end the current #Y Plot#!."
 claimant_cloc: "another petty claimant to our throne"
 heir_cloc: "our beloved heir"
 no_surveillance_ip3: "Unfortunately, we were unable to acquire much information on what the two conspirators were discussing"
 surveillance_acquired_ip3: "Thanks to our discreet surveillance of the conspirators, we were able to determine that they were having an animated discussion about [ROOT.GetCharacter.GetName], [ROOT.GetCharacter.Custom('pa_imp_get_successor_type')]"
 surveillance_discovered_ip3: "Due to our dimwitted underlings having been spotted, we were unable to discover any details of the plot being discussed"
 no_surveillance_ip3_default: "Unfortunately, we were unable to acquire much information on what the two conspirators were discussing"
 ip_monarchy.5.desc: "Circumstances change quickly in the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.Custom('pa_imp_get_court_type')], and it appears that plotting is no longer necessary. For now."
 ip_monarchy.5.t: "Plot: Stagnation"
 ip_monarchy.5.a: "Very well."
 ip_monarchy.6.a: "Curses!"
 ip_monarchy.6.desc: "The fools we sent to tail [plotting_pretender.GetName] were caught in the act!\n\nNot only has this angered [plotting_pretender.GetShortName], but [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been publicly lambasted for this gross ineptitude."
 ip_monarchy.6.t: "Plot: Surveillance Discovered!"
 ip_monarchy.7.b: "Poor [plot_target.GetShortName]..."
 ip_monarchy.7.a: "The cheek!"
 ip_monarchy.7.t: "Plot: Theft!"
 ip_monarchy.7.desc: "The wretch, [plotting_pretender_2.GetName], during [plotting_pretender_2.GetHerHis] deep discussion with [plotting_pretender.GetName], must have arranged a deceitful ploy!\n\nWhile [plotting_pretender.GetName] arranged to meet with [plot_target.GetName] on a seemingly unrelated matter, [plotting_pretender_2.GetShortName] had [plotting_pretender_2.GetHerHis] hired thugs attempt to ransack the home of [plot_target.GetName].\n\n[ROOT.GetCountry.Custom('pa_imp_get_whether_informed_ip7')]"
 got_informed_ip7: "Luckily, since we were able to arrange a warning in advance, no harm was done, and although we were unable to catch the perpetrator in the act, public opinion is that the two rogues were responsible."
 got_not_informed_ip7: "Unfortunately, since we had no idea that the two conspirators were targeting this attack, a sizable quantity of wealth was stolen, and no proof was found."
 ip_monarchy.8.a: "How tragic."
 ip_monarchy.8.t: "Plot: Attack!"
 ip_monarchy.8.b: "Bravo!"
 ip_monarchy.8.desc: "[plotting_pretender.GetName] chose to make a preemptive move against [plot_target.GetName], today, apparently overconfident in [plotting_pretender.GetHerHis] own abilities.\n\n[ROOT.GetCountry.Custom('pa_imp_compare_martial_result')]."
 got_target_won: "Thankfully, due to exceptional martial ability, the fight went in favor of the defender"
 got_target_lost: "Unfortunately, due to poor martial ability, the attack went in favor of the attacker, although the defender luckily managed to escape having only been wounded"
 #P:A Imperator loc used the unset scope plotting_successor in ip_monarchy.9.*; it is the plotter, so plotting_pretender is used
 ip_monarchy.9.t: "Plot: Appeal!"
 ip_monarchy.9.desc: "Emboldened by support, [plotting_pretender.GetName] has approached [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and demanded that we favor [plotting_pretender.GetHerHim] with a fine gift.\n\n[plotting_pretender.GetSheHe|U] clearly intends to anger [plot_target.GetName], a fellow claimant to the throne."
 ip_monarchy.9.c: "Why not? [plot_target.GetShortName] is a waste of space anyway."
 ip_monarchy.9.d: "Why would we waste resources on such a pointless individual?"
 ip_monarchy.9.a: "Offer [plotting_pretender.GetHerHim] a palace fit for a king!"
 ip_monarchy.9.b: "Give [plotting_pretender.GetHerHim] a token sum."
 arbitrary_bad_tooltip: "This option is #Y exclusive#! because your ruler has the #Y Arbitrary#! trait."
 STATIC_MODIFIER_NAME_plot_palace_gift: "Private Palace"
 ip_monarchy.10.c: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] can handle this."
 ip_monarchy.10.t: "Plot: Infighting!"
 ip_monarchy.10.a: "We should really step in."
 ip_monarchy_10_b_tooltip: "[plotting_pretender.GetName] and [plotting_pretender_2.GetName] will engage in combat.\nThe outcome of the encounter will be decided by their personal statistics."
 ip_monarchy.10.b: "Let them fight amongst themselves."
 ip_monarchy.10.desc: "The two dastardly claimants to the throne of [ROOT.GetCountry.GetName], who have been plotting together to cause all manner of chaos, have seemingly fallen foul of one another.\n\nSo much so, it seems, that [plotting_pretender.GetName] is reportedly marching a band of hired thugs to the dwelling place of [plotting_pretender_2.GetName] at this very moment.\n\nIf we wished to intercede, now would be the time."
 ip_monarchy.11.t: "Plot: Betrayal!"
 ip_monarchy.11.desc: "The sudden and bitter feud between [ip_11_victor.GetName] and [ip_11_loser.GetName], has ended in a violent and unexpected conclusion.\n\nThe two plotters clearly fell out over some matter, but quite what that was, is anyone's guess. Thankfully, this seems to have ceased any further action they were intending to take against us."
 ip_monarchy.11.a: "Such hatred..."
 ip_monarchy.12.b: "Bring a holy man at once."
 ip_monarchy.12.a: "Call on our physician, [physician_in_waiting.GetShortName]!"
 ip_monarchy.12.desc: "At a recent feast, our [plot_target.Custom('pa_imp_get_heir_type')], [plot_target.GetShortName], was making merry, when [plot_target.GetSheHe] fell mysteriously and suddenly ill.\n\nWe suspect that [plot_target.GetSheHe] might have been poisoned by those seeking to do away with competition for the throne - if we value [plot_target.GetHerHis] life at all, we should seek assistance immediately!"
 ip_monarchy.12.t: "Plot: Poison!"
 ip_monarchy.12.c: "How inconvenient - continue feasting."
 got_successor_normal: "loyal subject"
 got_primary_heir_normal: "beloved heir"
 ip_monarchy.13.bt: "An investigation into the source of the rumors will be conducted."
 vengeful_bad_tooltip: "This option is #Y exclusive#! because your ruler has the #Y Vengeful#! trait."
 ip_monarchy.13.a: "Surely [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is bigger than rising to this..."
 ip_monarchy.13.ct: "Our ruler will lose a negative #Y trait#!.\n\nThis option is available due to our ruler's #Y redeemable character#!."
 ip_monarchy.13.c: "Perhaps we can help to guide [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]?"
 ip_monarchy.13.b: "No one can freely insult the [ROOT.GetCountry.GetGovernment.GetRulerTitle]!"
 ip_monarchy.13.t: "A Question of Competence"
 forgiving_bad_tooltip: "This option is #Y exclusive#! because your ruler has the #Y Forgiving#! trait."
 ip_monarchy.13.desc: "After weeks of nervous looks and smirks at court, the whispers circling the palace have finally reached the ears of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]. It seems that someone has been spreading rumors and spinning yarns of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] unequaled profligacy and unfitness for the throne.\n\nThe damage has been done, now all look to how the [ROOT.GetCountry.GetGovernment.GetRulerTitle] will deal with the situation..."
 ip_monarchy.13.d: "They may have a point..."
 ip_monarchy.14.c: "Execution suits [ip_monarchy_14_antagonist.GetHerHis] crimes."
 ip_monarchy.14.desc: "The traitorous snake who attempted to demean the name of [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been identified as none other than [ip_monarchy_14_antagonist.GetName], who quickly confessed to [ip_monarchy_14_antagonist.GetHerHis] crimes.\n\nHow should we deal with this vagabond?"
 ip_monarchy.14.ct: "[ip_monarchy_14_antagonist.GetName] will be executed by [ROOT.GetCountry.GetGovernment.GetRuler.GetName]"
 ip_monarchy.14.t: "Slanderer Spills All"
 ip_monarchy.14.d: "Perhaps [ip_monarchy_14_antagonist.GetSheHe] could be won over..."
 ip_monarchy.14.b: "Pardon [ip_monarchy_14_antagonist.GetHerHim]. [ip_monarchy_14_antagonist.GetSheHe] learned [ip_monarchy_14_antagonist.GetHerHis] lesson."
 ip_monarchy.14.a: "Forget [ip_monarchy_14_antagonist.GetHerHim], [ip_monarchy_14_antagonist.GetHerHis] reputation is ruined."
 ip_monarchy.15.desc_1: "The dwindling health of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] already sends [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] possible successors circling like vultures. There is always treasonous talk at such times, but the enthusiasm and ambition of [mon_15_plotter.GetName] has set [mon_15_plotter.GetHerHim] apart among the future pretenders.\n\nRather than risk years of ineffective rule under a dotard, [mon_15_plotter.GetName] suggests acting now to ensure we have a strong and capable ruler, clearly indicating that [mon_15_plotter.GetSheHe] is the one for the job.\n\nDangerous talk to be sure, but [mon_15_plotter.GetSheHe] may have a point. Can we afford to pass up an opportunity like this?"
 ip_monarchy.15.c: "No need. [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is an honorable [ROOT.GetCountry.GetGovernment.GetRuler.GetWomanMan]..."
 ip_monarchy.15.t: "A Pragmatic Accession"
 ip_monarchy.15.b: "We will look the other way..."
 ip_monarchy.15.ct: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] will abdicate to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] primary heir."
 ip_monarchy.15.a: "Leadership does not become [mon_15_plotter.GetHerHim]."
 ip_monarchy.15.bt: "[mon_15_plotter.GetName] will attempt to depose [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]."
 ip_monarchy.15.desc_2: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is known for having a character unfitting a ruler, and this weakness has been seen as an opportunity among some of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] likely successors. There is always treasonous talk against such rulers, but the enthusiasm and ambition of [mon_15_plotter.GetName] has set [mon_15_plotter.GetHerHim] apart.\n\n[mon_15_plotter.GetShortName] suggests that, rather than enduring the ineffective rule of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] for the foreseeable future, [mon_15_plotter.GetHerHis] own character and abilities would better suit the throne and serve [ROOT.GetCountry.GetName].\n\nDangerous talk to be sure, but [mon_15_plotter.GetSheHe] may have a point. Can we afford to pass up an opportunity like this?"
 ip_monarchy.16.ct: "[old_ruler_mon_15.GetName]'s heir, [mon_15_preferred_heir.GetShortName], will rule as king, under the watchful eye of [mon_15_plotter.GetName] and [mon_15_plotter.GetHerHis] supporters."
 ip_monarchy.16.e: "Send in the heavies, the plotter fell for it!"
 ip_monarchy.16.b: "[ROOT.GetCountry.GetName] requires a clean break with the past."
 ip_monarchy.16.t: "All Hail [mon_15_plotter.GetName]"
 ip_monarchy.16.desc: "Through deft and carefully applied persuasion, [mon_15_plotter.GetName] has secured the necessary support to ensure a smooth transition of power in [mon_15_plotter.GetHerHis] plot against [old_ruler_mon_15.GetName].\n\nDogged by an entourage of soldiers, [mon_15_plotter.GetShortName] entered the royal bed chambers of [old_ruler_mon_15.GetShortName] this morning, issuing a decree that [mon_15_plotter.GetHerHis] actions were necessary for the sake of all [ROOT.GetCountry.GetName].\n\nWe must now witness whether our tacit consent for the coup and the accession of [mon_15_plotter.GetName] was the best decision after all..."
 ip_monarchy.16.c: "[old_ruler_mon_15.GetDynasty.GetName] rule will endure, albeit with a few changes."
 ip_monarchy.16.d: "Here ends the [old_ruler_mon_15.GetDynasty.GetName] dynasty..."
 ip_monarchy.16.dt: "All members of the [old_ruler_mon_15.GetDynasty.GetName] will be executed."
 ip_monarchy.16.a: "Send [old_ruler_mon_15.GetName] to the dungeons."
 ip_monarchy.17.desc: "While in the process of surreptitiously gathering supporters around court, [mon_15_plotter.GetName] was surrounded in the palace gardens by guards and dragged to the feet of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] who charged [mon_15_plotter.GetHerHim] with treason.\n\nThe ambitions of [mon_15_plotter.GetShortName] end here."
 ip_monarchy.17.b: "Fools deserve mercy."
 ip_monarchy.17.a: "Thus always to plotters."
 ip_monarchy.17.c: "Ha! Let the scamp go."
 ip_monarchy.17.t: "Treason Never Pays"
 ip_monarchy.18.desc_1: "While [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is seen by many as a #high defender of the people#!, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s policy of #high redistributing wealth#! to the common people (and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own purse) has stretched even the most loyal of [ROOT.GetCountry.GetName]'s leading men to the limit. With the right words, the elites could be persuaded to back someone who will take matters into their own hands, for the sake of [ROOT.GetCountry.GetName]. [mon_18_plotter.GetName] is widely regarded as the best bet, [mon_18_plotter.GetSheHe] has some influence at court and is known as #high solid#! and #high reliable#!, with the best interests of [ROOT.GetCountry.GetName] at heart, and claims descent from an old [ROOT.GetCountry.GetAdjective] king to boot.\n\nOf course, in ventures like these, it can be hard to predict how events will unfold even if the plot succeeds, but death for all those directly involved is almost certain if they should fail."
 ip_monarchy.18.a: "Treason will not be contemplated."
 ip_monarchy.18.bt: "[mon_18_plotter.GetName] will attempt to seek wider support for a coup against [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
 ip_monarchy.18.desc_2: "While [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is seen by many as a defender of the people, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s policy of redistributing wealth to the common people (and their [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own purse) has stretched even the most loyal of [ROOT.GetCountry.GetName]'s leading men to the limit. With the right words, the elites could be persuaded to back someone who will take matters into their own hands, for the sake of [ROOT.GetCountry.GetName]. [mon_18_plotter.GetName] is widely regarded as the best bet, [mon_18_plotter.GetSheHe] is a government official of some influence, known as solid and reliable, and with the best interests of [ROOT.GetCountry.GetName] at heart.\n\nOf course, in ventures like these, it can be hard to predict how events will unfold even if the plot succeeds, but death for all those directly involved is almost certain if they should fail."
 ip_monarchy.18.b: "Desperate times..."
 ip_monarchy.18.t: "Of Tyrants and Patriots"
 ip_monarchy.19.desc: "The plot to remove the [ROOT.GetCountry.GetGovernment.GetRulerTitle] [old_ruler_mon_18.GetName] has finally been fully realized, with support secured across the government and aristocracy. [mon_18_plotter.GetName], who leads the usurpers, marches with a party of loyal soldiers and eminent officials to the palace.\n\nThey converge on the throne room where they will present the [ROOT.GetCountry.GetGovernment.GetRulerTitle] with their terms, safe in the knowledge that the guard of [old_ruler_mon_18.GetName] has been filled with disgruntled soldiers who will aid in ousting the terrible tyrant.\n\nWe must now witness whether our tacit consent for the coup and the accession of [mon_18_plotter.GetName] was the best decision after all..."
 ip_monarchy.19.e: "On second thought... nice try traitors!"
 ip_monarchy.19.a: "Send [old_ruler_mon_18.GetName] to the dungeons."
 ip_monarchy.19.dt: "A mad melee will ensue between the ruler and plotters. A surviving plotter or the preferred heir will be made ruler.\nThis option is available due to [old_ruler_mon_18.GetName]'s #Y Martial#! skill."
 ip_monarchy.19.c: "The [old_ruler_mon_18.GetDynasty.GetName] line will endure this calamity."
 ip_monarchy.19.ct: "[old_ruler_mon_18.GetName]'s heir, [mon_18_preferred_heir.GetShortName], will rule [ROOT.GetCountry.GetName] as its king."
 ip_monarchy.19.d: "'[old_ruler_mon_18.GetName]'s got a knife!'"
 ip_monarchy.19.b: "Here ends the [old_ruler_mon_18.GetDynasty.GetName] dynasty..."
 ip_monarchy.19.t: "Ultimatum"
 ip_monarchy.19.bt: "All members of the [old_ruler_mon_18.GetDynasty.GetName] will be executed.\nThis option is available because [mon_18_plotter.GetShortName] is not related to our ruler."
 ip_monarchy.20.a: "Treason means death."
 ip_monarchy.20.b: "Fools deserve mercy."
 ip_monarchy.20.t: "Ever Thus to Plotters"
 ip_monarchy.20.desc: "An anonymous loyal subject has delivered hard proof of a plot to usurp the crown, lead by the prominent [mon_18_plotter.GetName], into the hands of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]. It seems [mon_18_plotter.GetShortName] has been attempting to gather support for a treasonous coup to oust our ruler, decrying [ROOT.GetCountry.GetGovernment.GetRuler.GetName] as a tyrant unfit for the throne.\n\nThe traitors have already been swiftly arrested and brought to the palace for judgment..."
 ip_monarchy.22.f: "Nice one [ip_monarchy_22_embezzler_scope.GetShortName]!"
 ip_monarchy.22.t: "Peculating Official"
 ip_monarchy.22.e: "Such vim! How did [ip_monarchy_22_embezzler_scope.GetSheHe] manage it?"
 ip_monarchy.22.ft: "\nThis option is available due to our ruler's #Y friendship#! with [ip_monarchy_22_embezzler_scope.GetShortName]."
 ip_monarchy.22.desc: "It has come to our attention that our trusted advisor [ip_monarchy_22_embezzler_scope.GetName] has been siphoning funds from our treasury into his own pocket for some time.\n\nThe disappearance of moneys collected from across [ROOT.GetCountry.GetName] eventually aroused suspicions, which combined with eyebrow raising extravagances such as extremely flattering statues of [ip_monarchy_22_embezzler_scope.GetShortName] being erected could not be written off as mere coincidence.\n\nAbuses of this kind surely must not be tolerated, lest the entire state apparatus becomes a charade for personally enriching vain aristocrats. The specific punishment is, however, up for debate..."
 ip_monarchy.22.c: "[ip_monarchy_22_embezzler_scope.GetSheHe|U] has forfeited [ip_monarchy_22_embezzler_scope.GetHerHis] position."
 ip_monarchy.22.d: "Only a real punishment will deter embezzlers."
 ip_monarchy.22.dt: "\nThis option is available due to our ruler's #Y upstanding character#!."
 ip_monarchy.22.b: "We will recuperate our losses."
 ip_monarchy.22.a: "[ip_monarchy_22_embezzler_scope.GetShortName] has learned [ip_monarchy_22_embezzler_scope.GetHerHis] lesson."
 ip_monarchy.22.et: "\nThis option is available due to our ruler's #Y questionable tendencies#!."
 ip_monarchy.26.desc: "It seems that [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has been growing rather jealous of the prestige of [ip_monarchy_25_general_scope.GetName], a commander who has risen to great prominence on account of [ip_monarchy_25_general_scope.GetHerHis] martial prowess.\n\nThe [ROOT.GetCountry.GetGovernment.GetRulerTitle] has intimated to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] confidants that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] doubts the loyalty of [ip_monarchy_25_general_scope.GetShortName], and, despite lacking any real evidence, is ardently promoting the idea that the general may be planning to undermine the throne or even take it for themselves.\n\nWhile these notions are not widely accepted, the [ROOT.GetCountry.GetGovernment.GetRulerTitle] is stuck on the idea and there is a great deal of pressure to resolve the situation."
 ip_monarchy.26.bt: "[ip_monarchy_25_general_scope.GetName] will evade capture due to [ip_monarchy_25_general_scope.GetHerHis] wealth and influence."
 ip_monarchy.26.b: "Send the guard to [ip_monarchy_25_general_scope.GetHerHis] tent."
 ip_monarchy.26.c: "What has [ip_monarchy_25_general_scope.GetSheHe] done wrong, really?"
 ip_monarchy.26.a: "[ip_monarchy_25_general_scope.GetHerHis|U] marching days are over."
 ip_monarchy.26.t: "[ip_monarchy_25_general_scope.GetWomanMan|U] of Action"
 ip_monarchy.27.t: "Dynastic Desperation"
 ip_monarchy.27.desc: "It has reached our ears that [mon_27_actor_scope.GetName], a child and heir of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], has started to develop a jealous hateful view of [mon_27_actor_scope.GetHerHis] half-[mon_27_target_scope.Custom('pa_imp_mon_27_half_sibling_gender')] [mon_27_target_scope.GetName]. The rivalry seems to stem from [mon_27_actor_scope.GetShortName]'s worries that children from the more recent marriage will be favored, removing [mon_27_actor_scope.GetHerHis] chances to inherit.\n\nEvidence has arisen that, encouraged by close friends and relatives, [mon_27_actor_scope.GetShortName] may even be planning to remove [mon_27_target_scope.GetShortName] from the picture, permanently. We could manipulate this opportunity to our advantage..."
 ip_monarchy.27.at: "[mon_27_actor_scope.GetShortName] will evade capture due to [mon_27_actor_scope.GetHerHis] wealth and influence."
 ip_monarchy.27.c: "[mon_27_target_scope.GetShortName] is rather irksome, after all..."
 ip_monarchy.27.b: "Carefully move [mon_27_actor_scope.GetShortName] away from this path."
 ip_monarchy.27.ct: "[mon_27_actor_scope.GetName] will attempt to assassinate [mon_27_target_scope.GetName]."
 ip_monarchy.27.a: "Expose [mon_27_actor_scope.GetShortName] and ensure [mon_27_actor_scope.GetHerHis] punishment."
 mon_27_half_sibling_brother: "brother"
 mon_27_half_sibling_sister: "sister"
 #P:A Imperator ip_monarchy.28.desc_1-3 named the plotter where the victim (the half-sibling) was meant; mon_27_target_scope is used there
 ip_monarchy.28.desc_1: "After some encouragement and helpful nudges in the right direction, [mon_27_actor_scope.GetName] gathered together the courage and materials to assassinate [mon_27_actor_scope.GetHerHis] half-[mon_27_target_scope.Custom('pa_imp_mon_27_half_sibling_gender')] [mon_27_target_scope.GetName] using poison.\n\n[mon_27_actor_scope.GetShortName] was quickly detected, and caught red-handed attempting to sneak into the palace bedroom of [mon_27_target_scope.GetShortName] in the dead of night possessing a foul potion.\n\n[mon_27_actor_scope.GetShortName] has been clapped in irons by the palace guards and taken to the dungeons."
 ip_monarchy.28.a: "Time to practice shock and sorrow..."
 ip_monarchy.28.b: "The fool..."
 ip_monarchy.28.d: "Send the guards, we can kill two birds with one stone."
 ip_monarchy.28.desc_3: "After some encouragement and helpful nudges in the right direction, [mon_27_actor_scope.GetName] gathered together the courage and materials to assassinate [mon_27_actor_scope.GetHerHis] half-[mon_27_target_scope.Custom('pa_imp_mon_27_half_sibling_gender')] [mon_27_target_scope.GetName] using poison.\n\nSneaking into [mon_27_target_scope.GetHerHis] palace bedroom in the dead of night, [mon_27_actor_scope.GetShortName] avoided detection and successfully poured a deadly concoction into the ear of the sleeping [mon_27_target_scope.GetShortName]. The crime was discovered by wailing attendants the next morning, but the true perpetrator remains unconnected to the deed."
 ip_monarchy.28.c: "This must be a joke?"
 ip_monarchy.28.desc_2: "After some encouragement and helpful nudges in the right direction, [mon_27_actor_scope.GetName] gathered together the courage and materials to assassinate [mon_27_actor_scope.GetHerHis] half-[mon_27_target_scope.Custom('pa_imp_mon_27_half_sibling_gender')] [mon_27_target_scope.GetName] using poison.\n\nSneaking into [mon_27_target_scope.GetHerHis] palace bedroom in the dead of night, [mon_27_actor_scope.GetShortName] awoke the sleeping [mon_27_target_scope.GetShortName] who seeing the vial called for help as a frenzied [mon_27_actor_scope.GetShortName] attempting to pin [mon_27_target_scope.GetHerHim] down. A small amount of the deadly concoction was poured into the ear of [mon_27_target_scope.GetShortName] before the guards arrived, although the extent of the injury is hard to ascertain.\n\n[mon_27_actor_scope.GetShortName] has been clapped in irons by the palace guards and taken to the dungeons."
 ip_monarchy.28.t: "A Little Drop of Poison"
 ip_monarchy.29.b: "To the dungeons with [mon_27_actor_scope.GetHerHim]."
 ip_monarchy.29.t: "Plot Discovered"
 ip_monarchy.29.c: "It's just a bit of healthy rivalry."
 ip_monarchy.29.desc: "The planned plot against [mon_27_target_scope.GetName] has been quickly broken up; confidants of [mon_27_actor_scope.GetName] brought evidence of the plan to the palace guards who fell on an unwitting [mon_27_actor_scope.GetShortName] attempting to acquire deadly poison.\n\nHow should we manage this?"
 ip_monarchy.29.a: "Finally, a good reason to be rid of this dullard."
 ip_monarchy.30.b: "There is no contest with [rival_brother_2.GetShortName]."
 ip_monarchy.30.c: "This needs to end."
 ip_monarchy.30.a: "[rival_brother_1.GetShortName] is clearly the better man."
 ip_monarchy.30.desc: "Lately the brothers [rival_brother_1.GetShortName] and [rival_brother_2.GetShortName], sons of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetName], have become increasingly aggressive and competitive, going so far as to scrap in public and shout obscenities at each other during official functions.\n\nClearly a rivalry between the siblings has been growing, no doubt over who will inherit the throne. Each brother looks to the [ROOT.GetCountry.GetGovernment.GetRulerTitle] to support their side of the feud..."
 ip_monarchy.30.t: "The Brothers [rival_brother_1.GetDynasty.GetName]"
 STATIC_MODIFIER_NAME_character_ip_mon_supported_heir_modifier: "Favored Heir"
 ip_monarchy.31.b: "You are brothers, by the gods!"
 ip_monarchy.31.c: "They cannot get away with this."
 ip_monarchy.31.desc_2: "A herald has delivered word that the rival brothers, [rival_brother_1.GetShortName] and [rival_brother_2.GetShortName], secretly arranged a duel with the help of their partisan friends and servants.\n\nFar from prying eyes, they equipped full battle dress and fought with spear and sword. After a few grueling and closely fought bouts, [rival_brothers_victor.GetShortName] delivered a wounding blow against [rival_brothers_loser.GetShortName] and declared himself the victor..."
 ip_monarchy.31.t: "Spears at Dawn"
 ip_monarchy.31.desc_1: "A herald has delivered word that the rival brothers, [rival_brother_1.GetShortName] and [rival_brother_2.GetShortName], secretly arranged a duel with the help of their partisan friends and servants.\n\nFar from prying eyes, they equipped full battle dress and fought with spear and sword. After a few grueling and closely fought bouts, [rival_brothers_victor.GetShortName] managed to pin the largely unscathed [rival_brothers_loser.GetShortName] and declare himself the victor..."
 ip_monarchy.31.a: "This is how real kings are made."
 ip_monarchy.31.desc_3: "A herald has delivered word that the rival brothers, [rival_brother_1.GetShortName] and [rival_brother_2.GetShortName], secretly arranged a duel with the help of their partisan friends and servants.\n\nFar from prying eyes, they equipped full battle dress and fought with spear and sword. After a few grueling and closely fought bouts, [rival_brothers_victor.GetShortName] drove his spear through the heart of [rival_brothers_loser.GetShortName] killing him instantly..."

 ip_monarchy.32.t: "Fratricide"
 ip_monarchy.32.desc_1: "The rivalry of the brothers [rival_brother_1.GetShortName] and [rival_brother_2.GetShortName] has finally lead to drastic action. Infuriated by the audacity of his brother in turning their mutual peers against him, [rival_brothers_victor.GetShortName] approached [rival_brothers_loser.GetShortName] at the forum in broad daylight wielding a dagger.\n\nThere was a brief struggle between the two, before friends of [rival_brothers_loser.GetShortName] intervened and dragged the brothers apart. [rival_brothers_loser.GetShortName] escaped with only a minor cut."
 ip_monarchy.32.desc_2: "The rivalry of the brothers [rival_brother_1.GetShortName] and [rival_brother_2.GetShortName] has finally lead to drastic action. Infuriated by the audacity of his brother in turning their mutual peers against him, [rival_brothers_victor.GetShortName] approached [rival_brothers_loser.GetShortName] at the forum in broad daylight wielding a dagger.\n\nThere was a brief struggle between the two, before friends of [rival_brothers_loser.GetShortName] intervened and dragged the brothers apart. [rival_brothers_loser.GetShortName] was left with a significant wound, but survived."
 ip_monarchy.32.desc_3: "The rivalry of the brothers [rival_brother_1.GetShortName] and [rival_brother_2.GetShortName] has finally lead to drastic action. Infuriated by the audacity of his brother in turning their mutual peers against him, [rival_brothers_victor.GetShortName] approached [rival_brothers_loser.GetShortName] at the forum in broad daylight wielding a dagger.\n\nThere was a brief struggle between the two, before [rival_brothers_victor.GetShortName] drove the dagger into the heart of [rival_brothers_loser.GetShortName] before anyone could intervene..."
 ip_monarchy.32.a: "The crafty scamp!"
 ip_monarchy.32.b: "How could he..."
 ip_monarchy.32.c: "Seize him."

 ip_monarchy.33.t: "Buried Hatchets"
 ip_monarchy.33.desc: "The bitter rivalry between the brothers [rival_brother_1.GetShortName] and [rival_brother_2.GetShortName] has finally abated. It seems they have been much worn out by the constant scrapping and have taken the wizened advice that fraternal rivalry can only lead to tragedy to heart.\n\nThank the gods they put this to bed before anyone did something they might live to regret..."
 ip_monarchy.33.a: "We must encourage peace."
 ip_monarchy.33.b: "A deed cannot be undone."
 ip_monarchy.33.c: "Stir them up again..."

 ip_monarchy.35.t: "The Pre-Eminent [family_leader_scope.GetName]"
 ip_monarchy.35.desc: "Some say that throughout [ROOT.GetCountry.GetName] there is one constant; the deeds and character of [family_leader_scope.GetName] precede [family_leader_scope.GetHerHim], from the villas of the capital to the shabbiest border town.\n\n[family_leader_scope.GetShortName] has risen to great prominence and position as a public servant and aristocrat, and through [family_leader_scope.GetHerHis] legendary private soirees has the ear of everybody worth knowing in [ROOT.GetCountry.GetCapital.GetName].\n\n[family_leader_scope.GetSheHe|U] could no doubt make a useful domestic ally..."
 ip_monarchy.35.a: "Invite [family_leader_scope.GetHerHim] to an exclusive banquet..."
 ip_monarchy.35.b: "...at a fake address."
 ip_monarchy.35.c: "What of it?"

 ip_monarchy.36.t: "A Discreditable Dalliance"
 ip_monarchy.36.desc: "A young woman named [bastard_mother.GetShortName], of little note until now, has arrived at the palace in [ROOT.GetCountry.GetCapital.GetName] bearing a baby who she claims is the son of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [bastard_ruler.GetName].\n\nAfter some cross-examination it is clear that she speaks the truth and the child resulted from an inadvisable lark at a banquet.\n\nThis information is known by only a few of the most trusted guards and advisors of the [ROOT.GetCountry.GetGovernment.GetRulerTitle], and there is no doubt it would both damage the throne's legitimacy and upset the consort and any potential successors of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]..."
 ip_monarchy.36.a: "Make this go away..."
 ip_monarchy.36.at: "The mother and child will disappear."
 ip_monarchy.36.b: "Keep it secret, but the child will never want for anything."
 ip_monarchy.36.c: "The babe has royal blood!"
#P:A TODO No EU5 equivalent: character loyalty; the tooltip is not shown until loyalty is ported
 ip_monarchy.36.ct1: "All children of [bastard_ruler.GetShortName] and pretenders to [ROOT.GetCountry.GetName] lose #R 15#! Loyalty!"
 ip_monarchy.36.d: "[bastard_mother.GetShortName] will be my new consort!"
#P:A TODO No EU5 equivalent: character loyalty; the tooltip is not shown until loyalty is ported
 ip_monarchy.36.dt: "All children of [bastard_ruler.GetShortName] and pretenders to [ROOT.GetCountry.GetName] lose #R 20#! Loyalty!"
 STATIC_MODIFIER_NAME_country_improvement_found_guidance: "Oracle Guidance"
 rel_flavor_kemetic.2.t: "Times of Need"
#P:A TODO No EU5 equivalent: Imperator named the priest's office (GetOffice); rewritten as "priest"
 rel_flavor_kemetic.2.desc: "As our nation faces an internal crisis, with unrest and instability all across our lands, many look to [ROOT.GetCountry.GetGovernment.GetRuler.GetName] for a solution and to lead us out of this disaster. Our priest [randomized_priest.GetName] has suggested visiting a local oracle living at the outskirts of [ROOT.GetCountry.GetCapital.GetName], to find the guidance needed to bring us back from the brink of chaos."
 rel_flavor_kemetic.2.a: "We will find this mystic."
 rel_flavor_kemetic.2.b: "There must be other alternatives to this crisis."
 STATIC_MODIFIER_NAME_country_improvement_temple_of_isis: "Temple of the Moon Goddess"
 get_venus: "Venus"
 get_turan: "Turan"
 get_aphrodite: "Aphrodite"
 get_astarte: "Astarte"
 get_isis: "Isis"
 get_ninlil: "Ninlil"
 get_love_goddess_default: "the Goddess of Love"
 rel_flavor_kemetic.3.t: "Seeking Funds"
#P:A TODO No EU5 equivalent: Imperator named the priest's office (GetOffice); rewritten as "priest"
 rel_flavor_kemetic.3.desc: "Our priest [randomized_priest.GetName] is seeking funds for the construction of a new temple in [ROOT.GetCountry.GetCapital.GetName], dedicated to the great goddess [ROOT.GetCountry.Custom('pa_imp_get_love_goddess')] herself. Though [randomized_priest.GetSheHe] has not asked us specifically, this is an opportunity for us to secure the loyalty of our priest and show our philanthropic qualities as a leader."
 rel_flavor_kemetic.3.a: "Any price for the goddess, Isis."
 rel_flavor_kemetic.3.b: "[randomized_priest.GetSheHe|U] will find the funds elsewhere."
 STATIC_MODIFIER_NAME_country_modifier_opened_temples: "Open Temples"
 STATIC_MODIFIER_NAME_country_modifier_closed_temples: "Closed Temples"
 rel_flavor_kemetic.4.t: "A Religious Procession"
#P:A TODO No EU5 equivalent: Imperator named the priest's office (GetOffice); rewritten as "priest"
 rel_flavor_kemetic.4.desc: "A struggle between the religious echelons of our society and the peasants has recently come into light, as the populace at large feel like the religious ceremonies are inaccessible and distant. On the other hand, our priest [randomized_priest.GetName] and [randomized_priest.GetHerHis] attendants demand the distance needed to do their jobs properly, and argument the peasants have no rights to the inner-workings of our religious ceremonies."
 rel_flavor_kemetic.4.a: "The priests will be left alone."
 rel_flavor_kemetic.4.b: "A procession through the territory will appease both sides."
 rel_flavor_kemetic.4.c: "The peasants are right, it is time to open the gates of the temples."
 rel_flavor_kemetic.5.t: "The Sacred Beast"
#P:A TODO No EU5 equivalent: Imperator named the priest's office (GetOffice); rewritten as "priest"
 rel_flavor_kemetic.5.desc: "A massive chaos ensues happen at one of our local shrines to [ROOT.GetCountry.Custom('pa_imp_get_sky_god')], after the sacred bird of the shrine has been lost. Not only was it one of the foci of the shrine, but without it, they fear they have lost a certain connection to the god.\n\nSome of our advisors point out we could just get a new bird, but our priest [randomized_priest.GetName] demands appeasement to the god. [randomized_priest.GetSheHe|U] claims that without the right steps, the god will punish us for our lack of piety."
 rel_flavor_kemetic.5.a: "Let us just find a new bird."
 rel_flavor_kemetic.5.b: "A ceremony to appease the loss."
 STATIC_MODIFIER_NAME_province_improvement_kemetic_mystic_teacher: "Kemetic Mystic"
 rel_flavor_kemetic.8.t: "A Mystic Has Been Found"
 rel_flavor_kemetic.8.desc: "A local mystic in [country_province.GetName] has been found! His teachings, which he shares in simple, direct language, have guided the local people to prosperity for decades, who venerate him as almost a semi-divine being. Perhaps he should be invited to the royal palace to stay with the King."
 rel_flavor_kemetic.8.a: "The Mystic will teach the King his ways."
 rel_flavor_kemetic.8.b: "Have him to stay in [country_province.GetName]"
 STATIC_MODIFIER_NAME_festival_of_horus: "Festival of Horus"
 STATIC_MODIFIER_NAME_festival_of_amun: "Festival of Amun"
 STATIC_MODIFIER_NAME_festival_of_ra: "Festival of Ra"
 STATIC_MODIFIER_NAME_festival_of_osiris: "Festival of Osiris"
 rel_flavor_kemetic.9.t: "National Religious Festival"
 rel_flavor_kemetic.9.desc_1: "Amun-Ra who hears the prayer, who comes at the cry of the poor and distressed...beware of him! Repeat him to son and daughter, to great and small; relate him to generations of generations who have not yet come into being; relate him to fishes in the deep, to birds in heaven; repeat him to him who does not know him and to him who knows him ... Though it may be that the servant is normal in doing wrong, yet the Lord is normal in being merciful. The Lord of Thebes does not spend an entire day angry. As for his anger...in the completion of a moment, there is no remnant. Holding a national festival in honor of the great Amun has been suggested by the High Priest."
 rel_flavor_kemetic.9.desc_2: "Osiris is the god of fertility, agriculture, the afterlife, the dead, resurrection, life, and vegetation in Kemetic religion. He is depicted as a green-skinned deity with a Pharaoh's beard, partially mummy-wrapped at the legs, wearing a distinctive atef crown, and holding a symbolic crook and flail. A national celebration in the honor of Osiris should be held in [ROOT.GetCountry.GetCapital.GetName]."
 rel_flavor_kemetic.9.desc_3: "The Pyramid Texts describe the nature of the Pharaoh in different characters as both Horus and Osiris. The Pharaoh as Horus in life becomes the Pharaoh as Osiris in death, where he is united with the other gods. New incarnations of Horus succeeded the deceased Pharaoh on earth in the form of new Pharaohs. We should honor the life of the great Pharaoh by holding a grand religious festival in the name of Horus."
 rel_flavor_kemetic.9.desc_4: "The sun is the giver of life, controlling the ripening of crops which are worked by man. Because of the life-giving qualities of the sun, Egyptians worship the fiery orb as the god Ra. Holding a national religious festival for Ra will ensure our prosperity in the coming years."
 rel_flavor_kemetic.9.a: "Hold the Festival"
 rel_flavor_kemetic.9.b: "We won't spend a dime on these fools!"
 STATIC_MODIFIER_NAME_country_improvement_war_amun_blessing: "Blessing of Amun"
 STATIC_MODIFIER_NAME_country_improvement_war_set_blessing: "Blessing of Set"
 STATIC_MODIFIER_NAME_country_improvement_war_osiris_blessing: "Blessing of Osiris"
 STATIC_MODIFIER_NAME_country_improvement_war_isis_blessing: "Blessing of Isis"
 rel_flavor_kemetic.46.t: "Divine Help"
 rel_flavor_kemetic.46.desc: "Although war is never to be desired, our people do not march into battle alone; no, our fighting men are always accompanied by the gods, who guide our hands in battle and send our enemies down into their graves. To whom shall we offer the sacred libations and grain offerings? The fattened calves are ready for the slaughter."
 rel_flavor_kemetic.46.a: "Osiris will guide us"
 rel_flavor_kemetic.46.b: "Isis knows the way"
 rel_flavor_kemetic.46.c: "Amun knows all"
 rel_flavor_kemetic.46.d: "Set will destroy our enemies"
 rel_flavor_kemetic.46.e: "We don't need the gods to destroy [war_enemy.GetName]"
 STATIC_MODIFIER_NAME_country_improvement_inspiring_soldier: "Inspiring Soldier"
 get_mars: "Mars"
 get_laran: "Laran"
 get_ares: "Ares"
 get_anhur: "Anhur"
 get_toutatis: "Toutatis"
 get_nergal: "Nergal"
 get_war_god_default: "the God of War"
# get_resheph ("Resheph") is written by batch b02
 rel_flavor_kemetic.47.t: "Man of [ROOT.GetCountry.Custom('pa_imp_get_war_god')]"
 rel_flavor_kemetic.47.desc: "One of our soldiers has the reputation of a man blessed by the god of war himself, fighting with a frenzy unlike any other. Some of our other soldiers question why he has not been promoted after all his heroic deeds during war, while others treat him as some sort of demigod."
 rel_flavor_kemetic.47.a: "He will join our court."
 rel_flavor_kemetic.47.b: "An inspiring man for our soldiers to look up to."
 STATIC_MODIFIER_NAME_country_improvement_commerce_blessing: "Blessing of Commerce"
 STATIC_MODIFIER_NAME_province_improvement_touched_by_commerce_god: "Commerce Influx"
 rel_flavor_kemetic.48.t: "Touched by [ROOT.GetCountry.Custom('pa_imp_get_commerce_god')]"
 rel_flavor_kemetic.48.desc: "[randomized_country_province.GetName] has seen a huge influx of traders and travelers from far and wide recently. One of our advisors jokingly suggests we must have been blessed by [ROOT.GetCountry.Custom('pa_imp_get_commerce_god')] himself.\n\nIt might have been a joke, but paying our dues to the god might be a good idea nonetheless. It could only be a boost in long term business, right?"
 rel_flavor_kemetic.48.a: "We will be inspired by the god, and make the most out of this."
 rel_flavor_kemetic.48.b: "A thanks to [ROOT.GetCountry.Custom('pa_imp_get_commerce_god')] is in order."
 rel_flavor_kemetic.49.t: "The Kemetic Faith"
#P:A TODO No EU5 equivalent: Imperator named the priest's office (GetOffice.GetCulturalName); rewritten as "priest"
 rel_flavor_kemetic.49.desc: "Those with similar faiths to ours, particularly the Hellenics and Arabians, have a tendency to pick up our faith easier than many of our other subjects. It seems they equate our gods and pantheon with some of their own, making the conversion easier.\n\nAfter our priest [random_priest.GetName] visits the [country_province.Custom('pa_imp_get_city_type_loc')] of [country_province.GetName], [country_province.GetProvince.GetName], we have seen a large group of conversions to our faith. Should we send [random_priest.GetShortName] for another trip to the city?"
 rel_flavor_kemetic.49.a: "We should encourage these conversions."
 rel_flavor_kemetic.49.b: "They will turn in time."
 rel_flavor_kemetic.50.t: "By Osiris"
 rel_flavor_kemetic.50.desc: "As pious as [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is, our leader [ROOT.GetCountry.GetGovernment.GetRuler.GetName] knows there are avenues for improvement, and has been seeking the counsel and advice of [random_advisor.GetName] and the Magi. Though their teachings are well meant, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is sure to lose [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] authority over the group if [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] follows their every whim."
 rel_flavor_kemetic.50.a: "Please, share your wisdom with us."
 rel_flavor_kemetic.50.b: "We will find our own path."
 rel_flavor_kemetic.51.t: "Hellenic Spokesman"
 rel_flavor_kemetic.51.desc: "There has been a Hellenic community in the [country_province.Custom('pa_imp_get_city_type_loc')] of [country_province.GetName], [country_province.GetProvince.GetName], for a long time. In the later years, they have become more influenced by the [ROOT.GetCountry.GetReligion.GetName] in the city, and now a spokesman from the community itself has come forward to unite the two groups once and for all.\n\nCharismatic and young, the man has already convinced huge swaths of the community to change religion. With some backing, he would probably be able to covert the entire region, [ROOT.GetCountry.GetReligion.GetName], though that would link him with our leadership."
 rel_flavor_kemetic.51.a: "They will turn to Ra in time, so no need to waste our resources."
 rel_flavor_kemetic.51.b: "Yes, let us get to know this guy better."
