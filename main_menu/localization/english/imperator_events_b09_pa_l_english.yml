l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b09 (2026-10-06)
 # character_events.txt (namespace renamed to pa_character_events)
 pa_character_events.2.t: "Unrivaled Wealth"
 pa_character_events.2.desc: "The recent passing of [target.GetName] has caused widespread interest among the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] and amongst our population at large. [target.GetHerHis|U] considerable fortune is of such magnitude, even after settling the various debts that [target.GetSheHe] owed, that a number of claimants have come forward, hoping to secure themselves a windfall.\n\nOne such claimant, [antagonist.GetName], has the support of a number of other wealthy patricians from around our [ROOT.GetCountry.GetName] and is widely considered to be the rightful heir to the fortune.\n\nNonetheless, we must make a decision in the best interests of the state..."
 pa_character_events.2.a: "Indeed, [antagonist.GetHerHis] claim appears to be valid."
 pa_character_events.2.b: "Think of the children!"
 pa_character_events.2.b.tooltip: "The remaining wealth will be split between the children of [target.GetName]."
 pa_character_events.2.c: "Split it equally among claimants. Including the state."
 pa_character_events.3.t: "Scandal!"
 pa_character_events.3.desc: "Scandal is, unfortunately, part of an average day in the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.Custom('pa_imp_get_court_type')].\n\nOrdinarily, we would simply ignore such petty squabbles, however, on this occasion, the esteemed [character_events_3_target.GetName] was found 'in flagrante delicto', with [character_events_3_target.GetHerHis] lover [character_events_3_lover.GetName], by [character_events_3_target.GetHerHis] spouse, [character_events_3_spouse.GetName].\n\n[character_events_3_spouse.GetName], the spouse, overcome with despair, has appealed to the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] to have [character_events_3_target.GetName] stripped of office as a punishment for [character_events_3_target.GetHerHis] brazenly public vice."
 pa_character_events.3.a: "This is none of our business."
 pa_character_events.3.b: "We shouldn't tolerate public infidelity."
 pa_character_events.3.c: "Oh, just have [character_events_3_target.GetHerHim] flogged."
 pa_character_events.6.t: "Murmurs of Dissatisfaction"
 pa_character_events.6.desc: "Our once-loyal commander, [angry_ex_general.GetName], who for many long years led our armies to glory, has fallen far from our graces.\n\nTired and angry at being deprived of command, [angry_ex_general.GetSheHe] spends [angry_ex_general.GetHerHis] time whispering in the ears of those closest to the [ROOT.GetCountry.Custom('pa_imp_get_court_type')].\n\nPerhaps we should have paid closer attention to the loyalties of our more... influential, generals."
 pa_character_events.6.a: "Curses!"
 pa_character_events.7.t: "Idle Thoughts"
 pa_character_events.7.desc: "Once a titan of the battlefield, adored by [angry_ex_general.GetHerHis] troops, and of numerous victories; [angry_ex_general.GetName] has fallen far from grace. Idling away [angry_ex_general.GetHerHis] time overseeing a menial administrative task, [angry_ex_general.GetShortName] feels that [angry_ex_general.GetHerHis] skills are being wasted.\n\nWe cannot expect [angry_ex_general.GetHerHim] to excel at this position with such brooding thoughts on [angry_ex_general.GetHerHis] mind - perhaps we can do something to help?"
 pa_character_events.7.a: "Find an appropriate incentive."
 pa_character_events.7.b: "There is nothing we can do."
 STATIC_MODIFIER_NAME_bad_research_general_modifier: "Administrative Inefficiency"
 pa_character_events.11.t: "Debtor Imprisoned"
 pa_character_events.11.desc: "[chief_justice.GetName], the [chief_justice.GetWomanMan] in charge of justice in our great nation, has ordered the imprisonment of [debtor.GetName], due to [debtor.GetHerHis] extreme debt.\n\nWe are told that [debtor.GetSheHe] will languish behind bars until the debt has been paid off."
 pa_character_events.11.a: "Justice is done."
 pa_character_events.11.b: "It seems that [debtor.GetShortName] is unwilling to go."
 working_towards_release_tooltip: "[debtor.GetShortName] will accrue gold at a rate of #Y 60#! gold per year, until the debt is paid off. You cannot release [debtor.GetHerHim] from prison until the debt is paid!"
 loyal_cohorts_say_no: "[debtor.GetShortName] refuses to be imprisoned, backed up by the support of [debtor.GetHerHis] loyal cohorts."
 STATIC_MODIFIER_NAME_debt_payoff_toggle: "Paying Off Debt"
 STATIC_MODIFIER_NAME_secret_pit_fighter: "Secret Pit-Fighter"
 STATIC_MODIFIER_NAME_secret_gambler: "Secret Gambler"
 STATIC_MODIFIER_NAME_reformed_gambler: "Reformed Gambler"
 STATIC_MODIFIER_NAME_foreign_royalty: "Foreign Royalty"
 pa_character_events.20.t: "Opportunistic Patronage"
 #P:A TODO No EU5 equivalent: the Imperator text named the party leader as "speaker of the <party>"; EU5 has no parties, the party name was dropped
 pa_character_events.20.desc: "Languishing in debt, [debtor.GetName] has turned to the wily [randomized_party_leader.GetName], hoping that [randomized_party_leader.GetSheHe] will offer assistance.\n\nEver the opportunist, [randomized_party_leader.GetShortName] has offered monetary aid in return for the continued loyalties of [debtor.GetShortName]. It may be expensive, but now is our only chance to step in!"
 pa_character_events.20.a: "Let [debtor.GetHerHim] sell [debtor.GetHerHis] soul..."
 pa_character_events.20.b: "We can offer a much more appropriate deal."
 STATIC_MODIFIER_NAME_switched_char_religion: "Converted Faith"
 STATIC_MODIFIER_NAME_switched_char_culture: "Converted Culture"
 pa_character_events.25.t: "Alternative Teaching"
 pa_character_events.25.desc_1: "The tutor that we have employed to oversee the education of our heir, [religion_switch_heir.GetShortName], has been infusing lessons with an ideology unfamiliar to the [religion_switch_heir.GetReligion.GetName] upbringing of [religion_switch_heir.GetShortName].\n\nWe are faced with an unfortunate decision - if we let these lessons continue, [religion_switch_heir.GetShortName] is sure to adopt the [royal_tutor.GetReligion.GetName] faith; if not, we are forced to deprive [royal_tutor.GetShortName] of [royal_tutor.GetHerHis] position."
 pa_character_events.25.desc_2: "The tutor that we have employed to oversee the education of our heir, [religion_switch_heir.GetShortName], is a devout believer of the [religion_switch_heir.GetCourtCountry.GetReligion.GetName] faith and wishes to turn [religion_switch_heir.GetShortName] away from [religion_switch_heir.GetReligion.GetName] ways.\n\nShall we allow [religion_switch_heir.GetShortName] to be forced to accept our state religion, or dismiss [royal_tutor.GetShortName] before [royal_tutor.GetHerHis] influence on [religion_switch_heir.GetShortName] is complete?"
 pa_character_events.25.a: "All faiths are welcome in [ROOT.GetCountry.GetName]."
 pa_character_events.25.b: "[religion_switch_heir.GetCourtCountry.GetReligion.GetName] teachings must be paramount."
 pa_character_events.25.c: "Fire [royal_tutor.GetShortName] immediately!"
 pa_character_events.26.t: "Cultural Osmosis"
 pa_character_events.26.desc_1: "The tutor that we have employed to oversee the education of our heir, [culture_switch_heir.GetShortName], is of sufficiently foreign culture as to convince [culture_switch_heir.GetShortName] that these ways are superior.\n\nIf we let these lessons continue, [culture_switch_heir.GetShortName] is sure to begin emulating these foreign ways; if not, we are forced to deprive [royal_tutor.GetShortName] of [royal_tutor.GetHerHis] position at court."
 pa_character_events.26.desc_2: "The tutor that we have employed to oversee the education of our heir, [culture_switch_heir.GetShortName], is staunchly [culture_switch_heir.GetCourtCountry.GetCulture.GetName] and has convinced [culture_switch_heir.GetShortName] that our own ways are superior.\n\nIf we let these lessons continue, [culture_switch_heir.GetShortName] is sure to fully adopt the traditions and language of our people; else we must relieve [royal_tutor.GetShortName] of [royal_tutor.GetHerHis] position at court and allow [culture_switch_heir.GetShortName] to remain [culture_switch_heir.GetCulture.GetName] at heart."
 pa_character_events.26.a: "Foreign ways must be embraced!"
 pa_character_events.26.b: "Our ways must be protected."
 pa_character_events.26.c: "Fire [royal_tutor.GetShortName] immediately!"
 pa_character_events.27.t: "Faith of the Masses"
 pa_character_events.27.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] is publicly known to follow a different faith from that of our great nation. In a bold move, all [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] closest advisors summoned up the courage to suggest that an act of conversion might please the people of [ROOT.GetCountry.GetName].\n\nFaith can indeed be a powerful thing."
 pa_character_events.27.a: "Conversion is the only way."
 pa_character_events.27.b: "This does not become [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]"
 pa_character_events.27.c: "Never!"
 pa_character_events.27.d: "Faith? Faith means nothing!"
 character_too_devout_tooltip: "Your ruler is too devout to switch religion!"
 sceptical_bad_tooltip: "This option is #Y exclusive#! because your ruler has the #Y Skeptical#! trait."
 STATIC_MODIFIER_NAME_disloyal_successor_cmod: "Popular Successor"
 pa_character_events.31.t: "Flight of a Pretender"
 pa_character_events.31.desc: "[fleeing_sibling.GetName], once a favored sibling of our recently ascended ruler, has, perhaps wisely, chosen to flee [ROOT.GetCountry.GetName] in a moment of opportunity.\n\nIt appears that [fleeing_sibling.GetSheHe] kneels at this very second before the vaunted [flight_target.Custom('pa_imp_get_court_type')] of [flight_target.GetName], in the hope of being granted asylum.\n\nWe can only hope that they refuse this foolish request in good time, in the pursuit of better relations."
 pa_character_events.31.a: "Troublesome."
 pa_character_events.31.b: "Declare an enemy of the state!"
 pa_character_events.31.c: "Outrageous! Our reputation is damaged!"
 character_events_31_tooltip: "This option is #Y exclusive#! due to the troops commanded by [fleeing_sibling.GetName]."
 harboring_fugitive: "Harboring Fugitive"
 harbored_fugitive: "Harbored Fugitive"
 pa_character_events.32.t: "A Plea for Asylum"
 pa_character_events.32.desc: "[fleeing_sibling.GetName], wearied and bedraggled, comes before our [ROOT.GetCountry.Custom('pa_imp_get_court_type')] seeking protection from the schemes and plots of [flight_home_country.GetName]. Our advisors inform us that this [fleeing_sibling.GetWomanMan] is a sibling of the [flight_home_country.GetAdjective] ruler, and would have been imminently in line to the throne.\n\nMany opportunities present themselves for making a statement..."
 pa_character_events.32.b: "Hah! Mount [fleeing_sibling.GetHerHim] on a cross."
 pa_character_events.32.c: "[fleeing_sibling.GetSheHe|U] may prove to be a valuable asset."
 character_events_32_tooltip: "The following modifier may be applied, depending on the [flight_home_country.GetAdjective] response."
 executed_relative: "Executed Relative"
 pa_character_events.33.t: "Fugitive Crucified!"
 pa_character_events.33.desc: "Word has reached us that the [flight_target.GetAdjective] ruler has ordered the crucifixion of our foolish relative, [fleeing_sibling.GetName].\n\nWhilst this can be interpreted as a vile act of aggression, perhaps they have simply done our job for us? Our people will need a formal response, however."
 pa_character_events.33.a: "Make a vow of vengeance!"
 pa_character_events.33.b: "The [fleeing_sibling.GetWomanMan] was irritating anyway..."
 STATIC_MODIFIER_NAME_being_financially_supported: "Receiving Financial Aid"
 STATIC_MODIFIER_NAME_financially_supporting: "Sending Financial Aid"
 pa_character_events.38.t: "Choose an Education"
 pa_character_events.38.desc: "Our Royal Tutor has been summoned to educate the reluctant young [recipient.GetShortName] in a manner of our choosing.\n\nThe nature of a tutor is most important indeed, so we should choose an intended tuition subject carefully."
 pa_character_events.38.a: "A martial education."
 pa_character_events.38.b: "A study in oration and commerce."
 pa_character_events.38.c: "Bureaucracy will serve best."
 pa_character_events.38.d: "Matters of the divine are integral."
 pa_character_events.38.e: "This seems most unwise."
 #P:A TODO Approximate: the four tutor tooltips still describe Imperator ambitions; in EU5 the first three set the child's education (military/diplomatic/administrative) and the negative-ambition chance is gone
 military_ambition_tutor: "#Y [recipient.GetName]#! will receive a new #Y Martial Ambition#!.\n\nThe chances of receiving a negative ambition are increased if your tutor is:\n    #R Corrupt#!\n    #R Ambitious#!\n    #R Cruel#!"
 oratory_ambition_tutor: "#Y [recipient.GetName]#! will receive a new #Y Oratory Ambition#!.\n\nThe chances of receiving a negative ambition are increased if your tutor is:\n    #R Harsh#!\n    #R Vengeful#!\n    #R Suspicious#!"
 finesse_ambition_tutor: "#Y [recipient.GetName]#! will receive a new #Y Finesse Ambition#!.\n\nThe chances of receiving a negative ambition are increased if your tutor is:\n    #R Greedy#!\n    #R Crafty#!\n    #R Shrewd#!"
 religious_ambition_tutor: "#Y [recipient.GetName]#! will focus on #Y Religious Studies#!."
 pa_character_events.48.t: "Fallen"
 pa_character_events.48.desc: "Envoys delivered the grave news today, that [dead_merc.GetName] has fallen, while pursuing a life of adventure beyond the borders of [ROOT.GetCountry.GetName].\n\nWe are told that a cairn now lies in [death_location.GetName], where many visit to mourn the fallen warrior."
 pa_character_events.48.desc_successor: "\n\nThe mighty [dead_merc.GetShortName] once stood in direct succession to the [ROOT.GetCountry.GetAdjective] throne, and our people cry out in anguish that [dead_merc.GetSheHe] died so far from [ROOT.GetCountry.GetAdjective] soil."
 pa_character_events.48.a: "We are to blame..."
 pa_character_events.50.t: "Ostracism"
 pa_character_events.50.desc: "In a fit of palpable rage, [target.GetShortName] stared down the assembly as the verdict of ostracism was recorded. There were even those in the assembly who shook their heads at the return of this ancient and most severe of punishments, yet were still persuaded by force or enticement to vote in favor of expulsion.\n\n[target.GetShortName] is said to have made [target.GetHerHis] way to [random_target.GetName], where [target.GetSheHe] will surely spread rumors and disinformation against us, yet, surely this option is better than the tyranny of an execution?"
 pa_character_events.50.a: "Goodness no, we aren't tyrants..."
 ostracism_flees_to: "#Y [target.GetShortName]#! is exiled to #Y [random_target.GetName]#!."
 mg_ostra: "Rumors of Ostracism"
 pa_character_events.52.t: "Coup in [coup_target.GetName]"
 pa_character_events.52.desc: "Our heralds from [coup_target.GetName] bring most troubling news. [coup_leader.GetName], who we most justly expelled from our glorious nation, has instigated and successfully led a bloodless coup against the government in [coup_leader.GetHerHis] newfound realm.\n\nIt would appear that all attempts at diplomacy are likely to prove worthless, given the grudge that [coup_leader.GetShortName] holds against us."
 pa_character_events.52.a: "Oops."
 mg_ostra_oops: "Ostracized Royalty"
 pa_character_events.54.t: "Arrival"
 pa_character_events.54.desc: "The appearance of the notable [new_character.GetName] in [new_character.GetCourtCountry.GetName] has driven the gossip of [new_character.GetCourtCountry.GetCapital.GetName] for days, as [new_character.GetCourtCountry.GetAdjective] circles look to the impact [new_character.GetHerHis] presence will have on our politics and future."
 pa_character_events.54.a: "Welcome, [new_character.GetShortName]."
 pa_character_events.54.at: "[new_character.GetName] appears in [new_character.GetCourtCountry.GetName]."
 # child_sacrifice_inv_event1.txt
 child_sacrifice_inv.1.t: "Sacrifice for the Gods"
 child_sacrifice_inv.1.desc: "Recently, #Y [ROOT.GetCountry.GetName]#! has been befallen with misfortune. Whispers have arisen in court that you are incapable of ruling. Not everything is #Y [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]#!'s fault, however. The recent wars have destabilized the realm. The people are unhappy and the army discouraged from recent defeats. \n#Y [murder_priest.GetName]#! has proposed a time-honored ritual to restore faith among the populace. By sacrificing a child to the Gods, we are sure to gain favor with them. They would surely bless us, if only we chose a worthy sacrifice..."
 child_sacrifice_inv.1.a: "[sacrifice_1.GetName] shall be sacrificed!"
 child_sacrifice_inv.1.b: "[sacrifice_2.GetName] shall be sacrificed!"
 child_sacrifice_inv.1.c: "[sacrifice_3.GetName] shall be sacrificed!"
 child_sacrifice_inv.1.d: "Three are better than one."
 child_sacrifice_inv.1.d.tt: "Your ruler is either deranged or exceptionally religious."
 child_sacrifice_inv.1.e: "We will find another way."
 child_sacrifice_inv.1.e.tt: "Your ruler either doesn't buy into the religious narrative or he doesn't have the heart to kill kids."
 STATIC_MODIFIER_NAME_not_sacrificed: "Not Sacrificed"
 child_sacrifice_inv.2.t: "An Auspicious Omen"
 child_sacrifice_inv.2.desc: "The Gods smile down on us. They deem our sacrifice worthy. They have sent an omen. Our bulls are healthier than ever before. The priests assure us that we have been blessed. \nOur troops have gained their spirit again, fighting fiercer than before. The slaves are rejoicing and the nobles relieved that the future is now secure. Popular support has increased and your governance is being accepted now."
 child_sacrifice_inv.2.a: "Praise the Gods."
 STATIC_MODIFIER_NAME_sacrifice_good: "Divine Approval"
 child_sacrifice_inv.3.t: "Hopeful Signs"
 child_sacrifice_inv.3.desc: "The priests tell us that the Gods are content with our sacrifice. They have spotted a pattern in the intestines of the bull butchered last night. It is showing clearly that the Gods approve of our offering, and for that they have granted us a minor boon. Baal will let it rain more in our lands. \nThe farmers are now more confident about the future and have started to till the fields again. The citizens and nobles have started to accept your rule once again."
 child_sacrifice_inv.3.a: "We thank the Gods."
 STATIC_MODIFIER_NAME_sacrifice_ok: "Divine Approval"
 child_sacrifice_inv.4.t: "Ominous Signs"
 child_sacrifice_inv.4.desc: "It hasn't rained for a long time. Maybe it's a sign of the Gods? The priest interpret it as such. Your standing with the individuals of note has fallen further and more of our rural subjects have started to question your ability to rule... \nThe sacrifice mustn't have been to the taste of Baal, the lord of rain. We now pay the price of offering inferior tribute."
 child_sacrifice_inv.4.a: "It was a mistake."
 STATIC_MODIFIER_NAME_sacrifice_meh: "Divine Disappointment"
 child_sacrifice_inv.5.t: "A Disastrous Omen"
 child_sacrifice_inv.5.desc: "Storms have ravaged our fleets and blockaded our ports for weeks now. The Gods are surely punishing us, for we offered them the most inferior of oblations, and the child wasn't fit for it. Additionally, our priests had not carried out the ceremonies well enough, for they were in haste. This must have angered the Gods, for we cannot trade or fish. Even worse, parts of our Cedar forests have burned down."
 child_sacrifice_inv.5.a: "We are doomed"
 STATIC_MODIFIER_NAME_sacrifice_bad: "Divine Disappointment"
 child_sacrifice_inv.6.t: "Discouraged Populace"
 child_sacrifice_inv.6.desc: "Our subjects had anticipated the sacrifice that would sway the Gods, yet #Y [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]#! has just decreed that no child would be sacrificed. They would in the future be bright minds our nation would need, be it as mothers or warriors. \nIt isn't unexpected that the decision would be met with disapproval. Now, protests have once again flared up across the country. We should prepare for the worst..."
 child_sacrifice_inv.6.a: "At least the children are safe"
 STATIC_MODIFIER_NAME_restless_population: "Restless Population"
