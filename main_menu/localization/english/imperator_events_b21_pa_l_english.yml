l_english:
 # Imperator (Invictus / Terra Indomita) event import, b21 (2026-10-20): the Olympic Games starters

 # olympics.txt
 #P:A TODO Imperator title was "The [get_olympics_count_suffix] Olympiad" (ordinal from the olympiad counter); the global variable olympic_counter_global_var still counts olympiads
 olympic.2.t: "The Olympiad"
 olympic.2.desc: "Since the glorious days of mighty Herakles, the young men of Greece have, every four years, competed in the Olympic Games, in order to win fame and fortune for themselves, and glory for their nation.\n\nHeld in [olympic_games_location.GetName], the games are an opportunity for all in Greece to lay down arms, embrace, and pay homage to their forefathers.\n\nAs we control the ancient site of the games, it is our duty to hold the games this year; we should think carefully before proclaiming otherwise."
 olympic.2.a: "Let it be known: the games shall be held!"
 olympic.2.b: "It is too risky right now."
 olympics_yay: "Every country of the #Y Hellenic#! Culture Group will gain #G 20#! opinion of [ROOT.GetCountry.GetName]."
 olympics_nope: "Every country of the #Y Hellenic#! Culture Group will lose #R 20#! opinion of [ROOT.GetCountry.GetName]."
 #P:A TODO Imperator title began with the olympiad ordinal ("The [get_olympics_count_suffix] Olympic Games Conclude")
 olympic.6.t: "The Olympic Games Conclude"
 olympic.6.desc: "The great Olympic Games have come to an end, with much rejoicing and celebration.\n\nThe highlight of this year's games was during the [ROOT.GetCountry.Custom('pa_imp_get_olympic_highlight')]\n\nOverall, the victor was declared to be [victorious_competitor.GetName] of [victor_origin_country.GetName], [victorious_competitor.Custom('pa_imp_get_number_of_wins')], whose brawn, virility and Heraklean vigor are beyond compare. And now, [victorious_competitor.GetSheHe] will go down in the annals of history as a champion of the Olympiad!"
 olympic.6.desc_2: "The great Olympic Games have come to an end, with much rejoicing and celebration. This year's event, however, was tinged with sadness due to the death of the posthumous victor, [victorious_competitor.GetName]. Unwilling to give up in the face of death, [victorious_competitor.GetSheHe] fought to the bitter end against [victorious_competitor.GetHerHis] opponent in one of the martial events, and was honorably declared as victor, due to these extenuating circumstances.\n\nDespite this, many other events drew fine crowds, with one particularly memorable event being the [ROOT.GetCountry.Custom('pa_imp_get_olympic_highlight')]"
 olympic.6.a: "Praise be to [victorious_competitor.GetShortName]!"
 olympic.6.b: "Ah well, better luck next time."
 olympic.6.c: "A splendid event!"

 # pa_imp_get_olympic_highlight
 pankration_event: "pankration, a skilled wrestling event. During the brawl, [SCOPE.sCharacter('highlight_competitor_1').GetShortName] of [SCOPE.sCountry('highlight_1_origin_country').GetName] scored a grievous blow against [SCOPE.sCharacter('highlight_competitor_2').GetShortName] of [SCOPE.sCountry('highlight_2_origin_country').GetName], rendering him senseless for nearly a full day."
 diaulos_event: "diaulos, a lengthy double circuit of the Olympic stadium. [SCOPE.sCharacter('highlight_competitor_1').GetShortName] of [SCOPE.sCountry('highlight_1_origin_country').GetName] almost flew past the finishing line, careening into the watching crowd amidst cries of jubilation."
 pygmachia_event: "pygmachia, a dangerous fist-fighting event. [SCOPE.sCharacter('highlight_competitor_1').GetShortName] of [SCOPE.sCountry('highlight_1_origin_country').GetName] was disqualified after attempting to gouge out the eyes of his sparring partner, [SCOPE.sCharacter('highlight_competitor_2').GetShortName] of [SCOPE.sCountry('highlight_2_origin_country').GetName]."
 hoplitodromos_event: "final race of this Olympiad, the hoplitodromos, in which the competitors endured a full lap of the stadium, clad in full body armor. [SCOPE.sCharacter('highlight_competitor_1').GetShortName] of [SCOPE.sCountry('highlight_1_origin_country').GetName] crossed the finishing line a good hour after the race began, having stopped to flirt outrageously with a group of giggling maidens."
 synoris_event: "prestigious chariot race, the synoris. [SCOPE.sCharacter('highlight_competitor_1').GetShortName] of [SCOPE.sCountry('highlight_1_origin_country').GetName] saved a fellow competitor from almost certain death, when his chariot was overturned in the dusty mayhem of the race."
 stadion_event: "stadion, the most ancient and revered of foot races. [SCOPE.sCharacter('highlight_competitor_1').GetShortName] of [SCOPE.sCountry('highlight_1_origin_country').GetName], in last place for the majority of the race, stole the victory by mere moments, after [SCOPE.sCharacter('highlight_competitor_2').GetShortName] of [SCOPE.sCountry('highlight_2_origin_country').GetName] tripped and fell, causing all the athletes behind him to join him on the floor."

 # pa_imp_get_number_of_wins
 olympic_wins_1: "a first-time winner of the Olympics"
 olympic_wins_2: "twice winner of the games"
 olympic_wins_3: "three times victor of the Olympics"
 olympic_wins_4: "who has now been victorious on four separate occasions"
 olympic_wins_5: "who has been victorious at the games on more occasions than anyone can remember"

 # opinions
 olympics_sanctioned: "Olympic Games Declared"
 olympics_refused: "Olympic Games Denied"
 olympic_victor: "Olympic Victor"

 # modifiers
 STATIC_MODIFIER_NAME_olympic_mourning: "Olympic Mourning"
 STATIC_MODIFIER_NAME_olympic_games_modifier: "Site of the Olympic Games"
 STATIC_MODIFIER_NAME_disturbed_circles: "Looted Libraries"
