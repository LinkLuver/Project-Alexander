 # FMO_subject_focus_events.txt
 subject_focus_1_t: "Commerce Focus"
 subject_focus_1_desc: "The lands of our subjects are ripe for economic development. They are already blessed with fertile lands and an industrious people, and by commanding that they focus their considerable talents into their improving their local economy, our entire nation will prosper because of it."
 subject_focus_1.a: "Commerce is the Way!"
 subject_focus_1.b: "Maybe this isn't such a good idea."
 subject_focus_6_ttt: "All of our subjects will gain the following modifier:"
 STATIC_MODIFIER_NAME_commerce_focused_subject: "Commerce Focused Subject"
 STATIC_MODIFIER_NAME_military_focused_subject: "Military Focused Subject"
 STATIC_MODIFIER_NAME_development_focused_subject: "Development Focused Subject"
 subject_focus_2_t: "Military Focus"
 subject_focus_2_desc: "It is no secret that the men of our subject nations are a contentious bunch, quick to anger and willing to fight over the slightest provocations, be they real or imagined. Would it not make sense for us to tap into this wellspring of wrath? The hotheads of our subjects would make fierce additions to the ranks of our military...we should train these youth and harness them for our own needs, lest they eventually direct their aggression towards the state."
 subject_focus_2.a: "A Stronger Army is needed!"
 subject_focus_2.b: "Maybe this isn't such a good idea."
 subject_focus_3_t: "Development Focus"
 subject_focus_3_desc: "The docile inhabitants of our subjects have no greater wish than to see their own holdings flourish under [ROOT.GetCountry.GetNameWithNoTooltip]'s hegemony; a desire that we also share. We shall give them our blessing and allow them to focus on their internal development, knowing that we, too, shall gain from a content and thriving populace."
 subject_focus_3.a: "Development will bring Prosperity!"
 subject_focus_3.b: "Maybe this isn't such a good idea."
 subject_focus_4_t: "Increased Tribute"
 subject_focus_4_desc: "After extensive discussions with the financial advisors of [ROOT.GetCountry.GetNameWithNoTooltip], [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has decided that all subject states should increase the amount of tribute that they send to us every month. Considering the staggering expenses that have been paid into maintaining the territories of [ROOT.GetCountry.GetNameWithNoTooltip], it is only natural that these burdens should be shared by the peoples benefitting from our benevolence."
 subject_focus_4.a: "It is our prerogative to place indemnities"
 STATIC_MODIFIER_NAME_increased_subject_tribute: "Increased Subject Tribute"
 subject_focus_5_t: "Increased Integration"
 subject_focus_5_desc: "It has been decided that the current situation in [ROOT.GetCountry.GetNameWithNoTooltip] is not to our satisfaction; the people in our subject nations are slowly being influenced by the [ROOT.GetCountry.GetCulture.GetName] ways. However, this is not happening as quickly as [ROOT.GetCountry.GetGovernment.GetRuler.GetName] would like. Of course, we could...'suggest'...that this process be accelerated, but there are likely to be ramifications outside of our control. What should we do?"
 subject_focus_5.a: "Hopefully they will like us"
 subject_focus_5.b: "Maybe this isn't such a good idea."
 STATIC_MODIFIER_NAME_increased_subject_integrations: "Increased Integrations"
 subject_focus_6_t: "Cultural Focus"
 subject_focus_6_desc: "In order to ensure that proper [ROOT.GetCountry.GetReligion.GetName] and [ROOT.GetCountry.GetCulture.GetName] ways are embraced throughout the entirety of our dominion, we could command our subjects to focus on assimilating our beliefs. The differences between our cultures are nominal, anyways; this should be a relatively painless process, to the benefit of us all...all that is left is for you to say the word."
 subject_focus_6.a: "Great Idea!"
 subject_focus_6.b: "What a shame"
 subject_focus_6.c: "Maybe this isn't such a good idea."
 subject_focus_6_tt: "We have no subjects with [ROOT.GetCountry.GetCulture.GetName|Y] primary culture!"
 subject_focus_6_tttt: "All of our subjects with our culture or religion will gain the following modifier:"
 STATIC_MODIFIER_NAME_culture_focused_subject: "Culturally Focused Subject"
 subject_focus_8_t: "Increased Autonomy"
 subject_focus_8_desc: "It has been suggested by many of the subjects of [ROOT.GetCountry.GetNameWithNoTooltip] to relax some of the onerous taxes that we have placed upon them. Although [ROOT.GetCountry.GetGovernment.GetRuler.GetName] isn't a fan of the idea of decreased incomes, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] are aware that this coin is two-sided; this gesture, while expensive, would ultimately result in increased loyalty of our subjects. Besides, it wouldn't be the worst thing to have their elites owing us a favor..."
 subject_focus_8.a: "This will do the trick"
 subject_focus_8.b: "If anything they should pay more..."
 STATIC_MODIFIER_NAME_increased_subject_autonomy: "Increased Autonomy"
 subject_focus_individual.1.t: "Bestowing Gifts"
 subject_focus_individual.1.desc: "It has been brought to our attention that the people of [recipient.GetName] are having a difficult time adjusting to their new political realities; they will learn soon enough, one way or the other, but as of now, we have a slowly-escalating loyalty crisis on our hands.\n\nPredictably, it has been suggested that we could spread some wealth around, in order to remind the elites where their loyalties lie...'tis an expensive thing, managing the ship of state. What would you have us to do?"
 subject_focus_individual.1.a: "Shower them with gifts"
 subject_focus_individual.1.b: "A small sum will suffice"
 subject_focus_individual.1.c: "This is too expensive"
 STATIC_MODIFIER_NAME_loyalty_to_overlord_1: "Increased Loyalty"
 STATIC_MODIFIER_NAME_loyalty_to_overlord_2: "Increased Loyalty"
 subject_focus_individual.2.t: "Change Focus of [recipient.GetName]"
 subject_focus_individual.2.desc: "One of the many duties that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is tasked with is the internal management of the provinces and territories within their borders. A simple thing, really; you give the command, and the bureacracy responsible for the day-to-day operations within a territory will begin to focus on the specific task you give them. As head of our nation, we are responsible for directing the energies of our people; we will shape the destines of our lands as we see fit. What should the people of [recipient.GetName] focus upon improving?"
 subject_focus_individual.2.a: "Commerce Focus"
 subject_focus_individual.2.b: "Military Focus"
 subject_focus_individual.2.c: "Development Focus"
 subject_focus_individual.2.d: "Cultural Focus"
 subject_focus_individual.2.e: "It's fine as is"
 subject_focus_individual.3.t: "Diverting Trade"
 subject_focus_individual.3.desc: "The trade incomes in [recipient.GetName] are booming, thanks to the peace and prosperity that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has brought to the region. The might of [ROOT.GetCountry.GetCulture.GetName] arms has allowed the mercantile class to flourish, and, as such, we are entitled to a cut of these profits. We have invested our blood and wealth into [recipient.GetName]; it is our right to skim a little off of the top of their treasuries. Inform their leaders of our expectations."
 subject_focus_individual.3.a: "It shall be done"
 subject_focus_individual.3.b: "Maybe this isn't a good idea"
 STATIC_MODIFIER_NAME_diverting_subjects_trade: "Diverting Subjects Trade"
 STATIC_MODIFIER_NAME_trade_diverted_by_overlord: "Trade Diverted by Overlord"
 overlord_diverting_trade_opmod: "Overlord Diverting Trade"
 subject_focus_individual.4.t: "[recipient.GetNameWithNoTooltip] Joins the War"
 subject_focus_individual.4.desc: "Although the loyalties of [recipient.GetName] are dubious during the best of times, our current military entanglements require us to take what some might consider to be drastic steps. Although they were initially hesitant to join our soldiers in the field, when presented with an alternative (at the tip of a spear), [recipient.GetName] wisely decided to send their men. We will slay our enemies together and return to the matter of their insolence at a future date."
 subject_focus_individual.4.a: "Together, we shall be triumphant!"
 subject_focus_individual.4.b: "On second thought, we don't need them"
 forced_into_war_opmod: "Forced into War"
 subject_focus_individual.5.t: "The People of [recipient.GetName]"
 subject_focus_individual.5.desc: "In order to properly understand the diverse peoples living under our banner, we have decided to bring some of the inhabitants of [recipient.GetName] to our capital city; it is our sincere hope that, in time, these people will embrace [ROOT.GetCountry.GetCulture.GetName] ways. There might be some grumbling, to be sure, but we are prepared for whatever might happen."
 subject_focus_individual.5.a: "Fantastic"
 subject_focus_individual.5.b: "Leave them be...for now"
 STATIC_MODIFIER_NAME_took_pops_from_territory: "Overlord Stole Pops"
 took_pops_from_territory_opmod: "Pops taken from Territory"
 subject_focus_individual.6.t: "Forced Levy"
 subject_focus_individual.6.desc: "There is no way to honey these words; we have a manpower crisis, and if we don't take care of it, we could lose everything. It appears that our military advisors did not properly plan for the logistical problems that we would face, and now our reserves of fighting men are frighteningly low.\n\nAlthough this goes against normal practice, we can compel the men of [recipient.GetName] to join our armies - this will be tremendously unpopular, but we don't have much choice in the matter."
 subject_focus_individual.6.a: "We need the men"
 subject_focus_individual.6.b: "We don't need these fools"
 STATIC_MODIFIER_NAME_took_manpower_from_country: "Overlord Took Manpower"
 forced_army_levy_opmod: "Forced Levy"

 # tribal_duel.txt
 tribal_duel.1.t: "Trial by Combat"
 tribal_duel.1.desc: "[target.GetName]'s continued existence is an insult against you that demands satisfaction. Will you challenge your rival in the field, personally, sword in hand, or call upon [champion.GetName] to fight on your behalf?\n\nIf you select the option for [champion.GetShortName], you will participate in the duel from their point of view."
 tribal_duel.1.a: "I will fight in person, with all my honor!"
 tribal_duel.1.b: "Have [champion.GetName] fight for me."
 STATIC_MODIFIER_NAME_duel_champion: "Champion"
 # tribal_duel.2
 tribal_duel.2.a: "[fighter_of_duel.GetShortName] will keep fighting"
 tribal_duel.2.b: "[fighter_of_duel.GetShortName] will surrender"
 tribal_duel.2.c: "[fighter_of_duel.GetShortName] has been slain!"
 tribal_duel.2.d: "[target.GetShortName] has been slain!"
 tribal_duel.2.t: "Glorious Combat"
 tribal_duel_2_A_tooltip: "[target.GetName][ROOT.GetCountry.Custom('pa_imp_get_duel_combat_injury')]"
 tribal_duel_2_B_tooltip: "[fighter_of_duel.GetName][ROOT.GetCountry.Custom('pa_imp_get_duel_combat_injury')]"
 tribal_duel_2_desc_1: "It is going to be a beautiful day, clearly. The breezes are gentle and the sun shines brightly in the sky, an impartial witness to the gathering crowds below. [fighter_of_duel.GetName] is standing across from [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] opponent, axe in hand, waiting for an opportunity to strike. It was clear from the steely-eyed look on [target.GetName]'s face that [fighter_of_duel.GetShortName] was in for a tough fight, but this is what was expected. Suddenly, there is a shout, and all conscious thought recedes, consumed by the primal urge to survive. [fighter_of_duel.GetShortName] stepped forward and swung mightily, a [ROOT.GetCountry.GetAdjective] battle cry bursting from [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] lips."
 tribal_duel_2_desc_2: "Leaping back, you barely dodge a wild swing - that one came so close that [fighter_of_duel.GetName] could practically taste the whistling blade. Damp clumps of sweat-matted hair cling to [fighter_of_duel.GetHerHis] forehead, a distraction to be overcome as [fighter_of_duel.GetSheHe] parries another blow.\n\nYou have been grazed a few times and your head is pounding, but you aren't the only one suffering; [target.GetName] is breathing heavily, with flecks of bloody foam covering [target.GetHerHis] face - you are close, desperately close, to ending this. Turning to face you, teeth bared, your adversary screams and races towards you. Bracing yourself, you grip your axe with both hands and rush forward to meet the charge."
 tribal_duel_2_desc_3: "There is a deeply satisfying crunch as [fighter_of_duel.GetName]'s' axe cleaves through armor and flesh and bites into bone, and from the bloodcurdling scream that escapes [target.GetName]'s lips, you can tell that it hurts - badly. But there is no time to pause - your enemy somehow kicks you back, knocking you to the ground, and lifts [target.GetHerHis] axe over their head with both hands, baring down on you with all of their remaining strength. It seems that [target.GetShortName] is going to try to end this now...the moment of truth is here."
 tribal_duel_2_desc_4: "You and [target.GetName] circle each other warily, both gripping your spears, waiting for the other to make a move - or a mistake. Minutes go by without any tangible action; is this coward going to attack or what? You didn't come here to dance. You strike at [target.GetShortName]'s' spear, testing [target.GetHerHis] defenses, and decide that enough is enough. Feinting to your left, you shift your weight at the last minute and bear down on [target.GetShortName]'s right side; the resulting wound is sickening to see."
 tribal_duel_2_desc_5: "Your spears are locked against each other, and [target.GetName] is doing [target.GetHerHis] best to try to disarm you. Falling to [target.GetHerHis] knees, [target.GetShortName] thrusts upwards and you are forced to spin away wildly to avoid a spear-point in your throat. Losing your balance, [fighter_of_duel.GetName] staggers back, trying to repel the fierce assault as the enemy presses forward, offering no quarter. A terrifying fear begins to overwhelm [fighter_of_duel.GetShortName]; what if [fighter_of_duel.GetSheHe] actually loses this?"
 tribal_duel_2_desc_6: "You thrust at your [target.GetName]'s legs, forcing them back as you lunge forward. You are both getting tired, though, and neither of you are able to press the advantage; your opponent parries your counterattack easily, and still has enough fight left in them to curse your name loudly. The battle has been evenly matched up until this moment, something that you have decided must change immediately. You block a wayward blow from your foe's weapon and press on the attack, but you miscalculate - there is a moment of blind panic as you see a spear-point headed towards your face. Could this be the end?"
 tribal_duel_2_desc_7: "You charge towards [target.GetName], your mount's hooves drumming a steady tattoo in the ground. [target.GetShortName] grimly meets your attack, and moments later, there is an awful sound of clanging metal and screaming horse. Leaning forward, [fighter_of_duel.GetName] strikes decisively, carefully avoiding the wild counterattacks of [fighter_of_duel.GetHerHis] rival.\n\nSomehow, [target.GetShortName] manages to get past your defenses and your horse receives a glancing blow, sending a stream of blood spurting onto the dusty ground. Gritting your teeth, you dig in and counterattack."
 tribal_duel_2_desc_8: "You somehow managed to avoid being hit in that last charge, but where is [target.GetName]?! You are spinning your horse around frantically, trying to gain your bearings, but your opponent is literally riding circles around you. It is clear that [target.GetShortName] is mocking you; they are yelling something, but you can't hear what is being said. Leaning forward on your mount, [fighter_of_duel.GetName] bears down upon [fighter_of_duel.GetHerHis] foe, summoning forth every ounce of energy."
 tribal_duel_2_desc_9: "The fight is in its last desperate moments; both combatant and horse are exhausted to the point of collapse, creating a perilous situation for all involved. [fighter_of_duel.GetName]'s arm is aching, [fighter_of_duel.GetSheHe] is dizzy from the loss of blood, and [fighter_of_duel.GetHerHis] heartbeat is pounding in [fighter_of_duel.GetHerHis] ears. It requires all of the strength that [fighter_of_duel.GetSheHe] has left to lift [fighter_of_duel.GetHerHis] arm, and it is poor consolation that [target.GetName] is suffering as much as you are. As the two combatants meet again, you are aware that this will be for the last time...someone is bound to slip up."
 tribal_duel_2_desc_10: "You and [target.GetName] have been grappling fiercely, arms entangled as each tries to land a blow. Dodging a weak attempt at a headbutt, your fist connects squarely with your enemy's jaw, causing them to spit a bloody tooth on the ground moments later. [target.GetName] bellows like a wounded bull, stepping forward with both fists raised. [fighter_of_duel.GetName] can see that the enemy's eye is starting to swell shut and it encourages [fighter_of_duel.GetHerHim]. Your opponent swings and [fighter_of_duel.GetShortName] meets the attack head on, encouraged by the changing tide of the battle."
 tribal_duel_2_desc_11: "A solid punch connects with [fighter_of_duel.GetName]'s stomach and the wind is knocked out of [fighter_of_duel.GetHerHim]; falling to the ground, you wheeze hoarsely, lungs desperate for air. You barely catch [target.GetName]'s hands before they circle your throat, and the two of you wrestle, each struggling to achieve supremacy over the other. It is with tremendous effort that you are able to get your opponent off of you. Screaming angrily, [fighter_of_duel.GetShortName] turns the tables by tackling [fighter_of_duel.GetHerHis] opponent, and the two warriors collapse onto the ground. You will choke the life from this fool and feed their liver to the birds of the field!"
 tribal_duel_2_desc_12: "The fighting is getting more and more intense, and the both of you are starting to make mistakes. [fighter_of_duel.GetName]'s face is starting to swell and [fighter_of_duel.GetSheHe] can't see out of [fighter_of_duel.GetHerHis] left eye. But the warrior is landing solid blows of [fighter_of_duel.GetHerHis] own and is not the only one struggling; thin rivulets of blood are pouring down [target.GetName]'s face, which is a patchwork of bruises and cuts. Sensing an opportunity, your opponent tries to overwhelm you with a barrage of attacks but fails to connect a single blow; a quick sidestep and you aim at [target.GetHerHis] sides, connecting and causing [target.GetHerHim] to grunt."
 tribal_duel_2_desc_13: "The air is filled with the clanging of metal as blade strikes blade, and [target.GetName] presses against you, trying to force you down onto your knees. With a powerful shove, [fighter_of_duel.GetName] knocks [target.GetShortName] backwards, regaining your footing and stepping forward to press the advantage. Your enemy's opening salvo was a brutal effort, one that came close to ending this fight before it really began, but now [target.GetShortName] seems to be recalculating [target.GetHerHis] strategy. Breathing calmly, [target.GetShortName] paces cautiously just out of arm's length. Your eyes lock as your swords meet again."
 tribal_duel_2_desc_14: "You let out a tiny cry as the tip of [target.GetName]'s sword pierces through your armor; your enemy's blade is slick with your blood. Sensing your momentary panic, [target.GetSheHe] leans forward, hoping to follow up with a fatal blow, but [target.GetName] manages to parry them back, leaving a deep wound across [target.GetHerHis]'s cheek as payment for their efforts. No one is unscathed in this match, but it is too close to tell who has the upper hand. Gritting your teeth, you ignore the throbbing wound in your side and attack again."
 tribal_duel_2_desc_15: "Spinning around gracefully, you redirect [target.GetName]'s sword away from your head and strike downward, nicking their arm and causing them to utter a loud oath. You continue to swing at them, a series of blows that knocks them off balance and sends them careening to the ground. Now! This is the moment you have been waiting for. You abandon your caution, seeking to press the advantage, and fall upon your foe. They lamely lift [target.GetHerHis] sword, showing that they do not submit, and your arms clash."
 tribal_duel_2_desc_16: "The watching crowds are cheering, but for whom? Wiping the sweat off of your forehead, you try to concentrate. You can't tell who is gaining the upper hand. You have given a few good blows, but have taken a couple as well. Do the crowds see something that you don't? What is happening?!"
 tribal_duel_2_desc_17: "It is dreadfully silent outside of the small ring where the two combatants are fighting. There is mostly a droning of flies, a buzzing undercurrent that is punctuated with the occasional scream, or the splattering sound of gore being released onto the earth. The sun, uninterested in the affairs of mortals, watches pitilessly from high."
 tribal_duel_2_desc_18: "The fight is continuing, but it is not going well for [fighter_of_duel.GetName]. Every attempt [fighter_of_duel.GetSheHe] has made, every battle strategy shared by uncles or the friends of your father, is easily parried, and the [fighter_of_duel.GetShortName] has almost lost control of the situation a couple of times. [target.GetName] seems to be inside of [fighter_of_duel.GetHerHis] head, anticipating [fighter_of_duel.GetHerHis] every move."
 tribal_duel_2_desc_19: "[fighter_of_duel.GetName] is making this look easy. Unless some terrible calamity befalls you, there is no way that you are going to lose this match. [target.GetName] is outclassed in every aspect, and you both know that the end is rapidly approaching."
 tribal_duel_2_desc_20: "You are both starting to get a little tired, but your pride and sense of honor prevents either of you from showing it...or so you think. You notice that [target.GetName] is swaying back and forth a little too much, almost seeming like they are drunk. Your own breath sounds ragged in your ears, which feel stuffed and are pounding. You cry out, but your tongue feels heavy in your mouth and it's hard to make a sound.\n\nSuddenly, [target.GetShortName] lunges forward and there's no time to think."
 tribal_duel_2_desc_21: "Already you know that this fight will have songs written about it, celebrating the combat undertaken here today; the feats of heroism demonstrated by both you and [target.GetName] are worthy to be told throughout the ages. It is truly a pity that only one will leave here alive, for if you and [target.GetShortName] joined forces and fought together, all would tremble before you. And yet it must be that only one will walk away..."
 tribal_duel_2_desc_22: "Press on the attack! Don't let [target.GetName] take a moment's rest, but strike! [fighter_of_duel.GetName] almost has this, but [fighter_of_duel.GetSheHe] must be bold! See how [target.GetShortName] trembles before you...it won't be much longer."
 tribal_duel_2_desc_axe_killer: "[target.GetName] launches one final, desperate attack, with each wild swing meeting nothing but air. Is this the best that [target.GetSheHe] can do? And [target.GetShortName] thought themselves able to stand against you in combat...[ROOT.GetCountry.GetGovernment.GetRuler.GetName] was filled with pity for a brief moment, but soon an icy contempt overtook [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim], and the [ROOT.GetCountry.GetGovernment.GetRulerTitle] completed the bloody business that must be done.\n\nWith a powerful swing, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] buried [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] axe deep in [target.GetName]'s skull, cleaving it in twain."
 tribal_duel_2_desc_generic_killer: "And, just like that, it is over; [target.GetName] lies dead at your feet."
 tribal_duel_2_desc_hands_killer: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] jerked [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] head to the side, letting [target.GetName]'s fist whiz past [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] face, and you punched [target.GetHerHim] back - hard. Following this with a blow to the stomach, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] knocked the wind out of them, sending [target.GetShortName] staggering back, but what is this! It appears that [target.GetSheHe] was too weak to get up.\n\nKneeling down, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] grabbed [target.GetShortName]'s swollen face with both hands, telling them that they fought honorably, and not to fear what comes next. There was a twist and a snap, and [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] dropped the lifeless body to the ground. As word spreads that you have slain your opponent with your bare hands, men will greatly fear you."
 tribal_duel_2_desc_horse_killer: "You and [target.GetName] are struggling arm in arm at this point, despite both of you being on horseback; all weapons have been lost in the melee, tossed to the ground in moments of primal rage, with only the overwhelming desire to kill the other remaining. It is more than combat between man and beast at this moment...it is a battle of wills.\n\n[target.GetName] moves their hands from [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s' throat, trying to reach a hidden dagger, and [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] saw an opportunity and took it at once; leaping from [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]  mount, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] tackled [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] opponent to the ground. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] does not exactly remember what happened next, but soon [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] was being hoisted into the air by the men of your tribe, and [target.GetShortName]'s lifeless body lay still on the ground."
 tribal_duel_2_desc_loser: "When the Tribal Elders gather together on sacred days to remember our ancestors, those brave men and women who fought and gave their lives to make our people what they are today, another esteemed name shall be added to the list of heroes that fell; your own. Although [ROOT.GetCountry.GetGovernment.GetRuler.GetName] fought to the best of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] ability, it was not enough to triumph over the enemy, but there is no shame in dying in glorious combat."
 tribal_duel_2_desc_spear_killer: "The air is filled with a terrible cracking of wood as [target.GetName]'s weapon is shattered, unable to withstand the fierce torrent of blows [ROOT.GetCountry.GetGovernment.GetRuler.GetName] unleashed upon it. Your opponent, realizing the end is near, began to cry out, filling the air with a hoarse wailing that raised the hair on [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s arms. Falling forward, the [ROOT.GetCountry.GetGovernment.GetRulerTitle] plunge [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] spear deep into [target.GetName]'s throat, ending [target.GetHerHis] life alongside their pitiful mewling."
 tribal_duel_2_desc_sword_killer: "From your earliest years, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has killed men with swords; the first, a cocky mercenary with a small, double-edged blade he said came from #high Hispania#!, was when [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] had only seen fourteen years. The brave [ROOT.GetCountry.GetGovernment.GetRulerTitle] has led men into battle countless times and has personally plundered the camps of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] enemies, and the [ROOT.GetCountry.GetGovernment.GetRulerTitle] is unmatched in arms amongst any that live in [ROOT.GetCountry.GetName].\n\nAnd so it comes as no surprise that [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has made quick work of [target.GetName], a whelp that should have never lifted a sword against your own."
 tribal_duel.3.t: "Weapon of Choice"
 tribal_duel.3.desc: "Each man must come to an agreement of a weapon for the duel. In which way shall [target.GetName] meet [target.GetHerHis] doom?"
 tribal_duel.3.a: "An axe to cleave [target.GetShortName] to death!"
 tribal_duel.3.b: "A spear to pierce [target.GetShortName]#high 's#! heart!"
 tribal_duel.3.b_2: "A sword to slice [target.GetShortName] to pieces!"
 tribal_duel.3.c: "We'll fight on horseback!"
 tribal_duel.3.d: "I'll kill [target.GetShortName] with my bare hands!"
 tribal_duel.3.e: "Back out of the duel, like a coward."
 tribal_duel_3_hands_tooltip: "[fighter_of_duel.GetShortName] will have a lower chance of success, but the prestige that comes with the killing of a rival with bare hands will far outweigh the risks"
 tribal_duel_3_horse_tooltip: "[target.GetShortName] has proposed that we fight on horseback...shall we agree?"
 tribal_duel.4.t: "An End to the Fight"
 tribal_duel.4.desc: "An outcome that no one could have predicted has come to pass; somehow, the duel resulted in a draw. Still, no one can claim that your honor has been sullied, as you have fought bravely before gods and men. You begrudgingly admit that you have a newly-found respect for [target.GetName]; there are not many who have crossed arms with you and live to speak of it afterwards."
 tribal_duel.4.a: "[target.GetShortName] will live...for now"
