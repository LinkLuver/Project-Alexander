l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b16 (2026-10-19)

 # after_battle.txt
 after_battle.1.t: "Tactical Supremacy"
 after_battle.1.d: "[after_battle_1_target.GetName] has shown superlative skill in battle. Not only has [after_battle_1_target.GetSheHe] won a great victory, but also the admiration of [after_battle_1_target.GetHerHis] troops."
 after_battle.1.a: "Onward to glory!"
 after_battle.2.t: "Outmaneuvered"
 after_battle.2.d: "Once a titan of the battlefield, [after_battle_2_target.GetName] has fallen from grace. Fleeing in hasty fashion from [after_battle_2_target.GetHerHis] latest defeat, [after_battle_2_target.GetHerHis] has lost the respect of the [ROOT.GetCountry.GetAdjective] people."
 after_battle.2.a: "Alas!"
 after_battle.3.t: "Conqueror"
 after_battle.3.d: "No longer will [after_battle_3_target.GetName] be known as a [after_battle_3_target.GetWomanMan] of inaction. All peoples, friend or foe, shall laud the name of [after_battle_3_target.GetShortName] the Conqueror!"
 after_battle.3.a: "To victory!"
 after_battle.4.t: "Leading from the Front"
 after_battle.4.d: "Our troops flee in abject terror before the might of our foes. [after_battle_4_target.GetName] believes that they may have a better chance to escape and rally if [after_battle_4_target.GetSheHe] leads a diversionary charge against our foe.\n\nDare we let [after_battle_4_target.GetHerHim]?"
 after_battle.4.a: "It is the right thing to do."
 after_battle.4.b: "[after_battle_4_target.GetShortName] is more important than a bunch of common soldiers."
 after_battle.5.t: "Battle Hardened"
 after_battle.5.d: "They say that the most valuable lessons come from defeat.\n\nLike Herakles, or Alexandros, [after_battle_5_target.GetName] appears to be the exception to the rule."
 after_battle.5.a: "[after_battle_5_target.GetSheHe|U] is truly unstoppable!"
 after_battle.6.t: "Tactical Genius"
 after_battle.6.d: "After success in a number of battles, [after_battle_6_target.GetName] has begun to display exceptional ability in the field.\n\nIs there any who can stop [after_battle_6_target.GetHerHim]?"
 after_battle.6.a: "A true prodigy."
 after_battle.7.t: "Uniform Regulations"
 after_battle.7.d: "Unusually, [after_battle_7_target.GetName] has started to insist on formal uniform regulations for all who serve under [after_battle_7_target.GetHerHim]. Even more unusually, it appears to be having a positive effect on the outcome of [after_battle_7_target.GetHerHis] military engagements."
 after_battle.7.a: "A curious development."
 after_battle.8.t: "Indomitable"
 after_battle.8.d: "The sturdiness and unwavering resolve of [after_battle_8_target.GetName] have become things of legend. We are beginning to think that nothing can break [after_battle_8_target.GetHerHim]."
 after_battle.8.a: "Fascinating."
 after_battle.9.t: "Carnage!"
 after_battle.9.d: "Whispered tales are told, of the short, violent battles led by [after_battle_9_target.GetName]. In truth, our own troops fear [after_battle_9_target.GetHerHim] almost as much as the enemy."
 after_battle.9.a: "A useful reputation, perhaps."
 after_battle.10.t: "Disaster!"
 after_battle.10.d: "In the midst of a swirling engagement, [after_battle_20_target.GetName] was struck by a rogue arrow. Shielded by loyal soldiers, [after_battle_20_target.GetSheHe] was rushed off the battlefield and into the care of our best healers. Whether [after_battle_20_target.GetSheHe] will make a full recovery, only time will tell..."
 after_battle.10.a: "A tragedy!"
 after_battle.21.t: "Mastery of the Waves"
 after_battle.21.d: "[after_battle_21_target.GetName] has proven themselves an able commander at sea and we should encourage their mastery of naval warfare. There are many skills useful to an admiral, depending on the needs and particulars of the situation, but they are often incompatible with each other. What should [after_battle_21_target.GetSheHe] lend [after_battle_21_target.GetHerHis] hand to?"
 after_battle.21.a: "Speed and cunning will be [after_battle_21_target.GetHerHis] tools."
 after_battle.21.b: "[after_battle_21_target.GetSheHe|U] will lead the vanguard."
 after_battle.21.c: "[after_battle_21_target.GetShortName] shall lay waste to our enemies."
 after_battle.22.t: "Born unto the Sea"
 after_battle.22.d: "Now an experienced and able naval commander of many engagements, [after_battle_22_target.GetName] is known as a foremost [ROOT.GetCountry.GetAdjective] admiral. As with all things, specialization is the best way to leverage an advantage, and we must decide what [after_battle_22_target.GetSheHe] will learn to perfect."
 after_battle.22.a: "Long will they sing of the cunning and gall of [after_battle_22_target.GetShortName]."
 after_battle.22.b: "Have [after_battle_22_target.GetHerHim] squeeze every last knot from [after_battle_22_target.GetHerHis] crews."
 after_battle.22.c: "[after_battle_22_target.GetSheHe|U] will learn to make the most of any situation."
 after_battle.23.t: "The Intrepid [after_battle_23_target.GetShortName]"
 after_battle.23.d: "Never again will the resolve or courage of [after_battle_23_target.GetName] be called into question. From this day the sailors of the world will tell stories of the heroic actions of [after_battle_23_target.GetShortName] and [after_battle_23_target.GetHerHis] fleet!"
 after_battle.23.a: "Bless that adventurous [after_battle_23_target.GetWomanMan]!"
 after_battle.24.t: "Unbreakable [after_battle_24_target.GetShortName]"
 after_battle.24.d: "Time and again, no matter how many times [after_battle_24_target.GetHerHis] ships risk boarding, flames, or the ram's beak, [after_battle_24_target.GetName] refuses to yield to [after_battle_24_target.GetHerHis] enemies and carries the day! They say [after_battle_24_target.GetShortName] is as solid as the clashing rocks of Jason."
 after_battle.24.a: "Our stalwart son of [ROOT.GetCountry.Custom('pa_imp_get_sea_god')]!"
 after_battle.25.t: "The Exploits of [after_battle_25_target.GetShortName]"
 after_battle.25.d: "Our ship's lines break and scatter before the force of our enemies attacks while [after_battle_25_target.GetName] argues two plans with [after_battle_25_target.GetHerHis] subordinates; commit the reserves and lead an all out counter attack or fall back and regroup."
 after_battle.25.a: "Come, do you want to live forever?"
 after_battle.25.b: "[after_battle_25_target.GetSheHe|U] is too valuable to lose."
 after_battle.26.t: "Tactical Perfection"
 after_battle.26.d: "[after_battle_26_target.GetName] effortlessly outmaneuvered the enemies stacked against [after_battle_26_target.GetHerHim], casting the fools unable to escape down to [ROOT.GetCountry.Custom('pa_imp_get_god_of_dead')]. Crews throughout our triumphant navy are grateful and honored to serve in battle under such a blessed strategist."
 after_battle.26.a: "May [after_battle_26_target.GetSheHe] win a thousand more!"
 after_battle.27.t: "Outwitted"
 after_battle.27.d: "Our once esteemed admiral [after_battle_27_target.GetName] has shown [after_battle_27_target.GetHerHis] true measure, delivering only humiliation and defeat to the proud people of [ROOT.GetCountry.GetName]. Many are the grieving and angry who cry [after_battle_27_target.GetShortName] should have died with [after_battle_27_target.GetHerHis] reputation."
 after_battle.27.a: "Calamity..."
 after_battle.28.t: "Heedless [after_battle_28_target.GetShortName]"
 after_battle.28.d: "Persistently flying into battle at the head of [after_battle_28_target.GetHerHis] formations with little thought, [after_battle_28_target.GetName] always steals the initiative with a brazen act of valor, or is it stupidity?"
 after_battle.28.a: "The [after_battle_28_target.GetWomanMan] has vim."
 after_battle.29.t: "Unjustified Moniker"
 #P:A Fixed: Invictus wrote after_battle_28_target in the second sentence (copy error); after_battle_29_target is the admiral of this event
 after_battle.29.d: "The hardy sailors of our great navy are now agreed on one thing, [after_battle_29_target.GetName] lacks the boldness expected and respected in naval commanders. [after_battle_29_target.GetHerHis|U] pitifully cautious organization and maneuvers, even in the thick of battle, would make [ROOT.GetCountry.Custom('pa_imp_get_war_god')] weep."
 after_battle.29.a: "[after_battle_29_target.GetSheHe|U] could not live up to the reputation."
 after_battle.30.t: "Pitiful [after_battle_30_target.GetShortName]"
 after_battle.30.d: "The famed resilience, or lack thereof, of admiral [after_battle_30_target.GetName] has become an epithet of mocking derision among our sailors, following their calamitous defeat. By all accounts [after_battle_30_target.GetShortName] could hardly keep [after_battle_30_target.GetHerHis] crew on course, let alone resist the winding attacks of the enemy."
 after_battle.30.a: "Fate is cruel."
 after_battle.41.t: "Tragedy at Sea"
 after_battle.41.d: "Outmaneuvered and with enemy ships bearing down on all sides, admiral [after_battle_41_target.GetName] took a chance arrow as [after_battle_41_target.GetSheHe] attempted to rally nearby ships to [after_battle_41_target.GetHerHis] aid."
 after_battle.41.a: "Fate is cruel."

 # war_council.txt
 war_council.1.t: "War Council Assembles"
 war_council_assembles_monarchy: "The shroud of evening falls on the magnificent palaces of [ROOT.GetCountry.GetCapital.GetName], as three silhouettes appear at the door of the royal audience chamber. \n\n[marshal.GetShortName], [marshal.Custom('pa_imp_get_council_1_descriptor')]; [guard.GetShortName], [guard.Custom('pa_imp_get_council_2_descriptor')]; and [third_party.GetShortName], [third_party.Custom('pa_imp_get_council_3_descriptor')], file into the palace chambers, each determined to influence the [ROOT.GetCountry.GetAdjective] court in their own manner."
 war_council_assembles_monarchy_2: "All [ROOT.GetCountry.GetCapital.GetName] sleeps, as the war council drags well on into the night.\n\nAssembled, are three brilliant [ROOT.GetCountry.GetAdjective] minds, summoned to provide insight, each determined to convince us of the validity of their argument. [marshal.GetShortName], [marshal.Custom('pa_imp_get_council_1_descriptor')]; [guard.GetShortName], [guard.Custom('pa_imp_get_council_2_descriptor')]; and [third_party.GetShortName], [third_party.Custom('pa_imp_get_council_3_descriptor')]."
 war_council_assembles_republic: "Many long hours have passed since the senate hall closed for the day, yet four figures still sit, animated in intense discussion over matters of future conquest. \n\n[marshal.GetShortName], [marshal.Custom('pa_imp_get_republic_council_descriptor_marshal')]; [guard.GetShortName], [guard.Custom('pa_imp_get_republic_council_descriptor_guard')]; and [third_party.GetShortName], [third_party.Custom('pa_imp_get_republic_council_descriptor_third_party')], each argue for their own chosen course of action."
 war_council_assembles_republic_2: "The glorious arches of [ROOT.GetCountry.GetCapital.GetName] provide a scenic setting for the ongoing planning of future wars, held between the chief minds of the republic.\n\n[marshal.GetShortName], [marshal.Custom('pa_imp_get_republic_council_descriptor_marshal')]; [guard.GetShortName], [guard.Custom('pa_imp_get_republic_council_descriptor_guard')]; and [third_party.GetShortName], [third_party.Custom('pa_imp_get_republic_council_descriptor_third_party')]."
 war_council_assembles_tribal: "The gruff voices barking over the sound of carousing outside, yields an atmospheric setting for the latest meeting of the [ROOT.GetCountry.GetAdjective] war council.\n\nIn attendance, are several of the council's most well respected members; [marshal.GetShortName], [marshal.Custom('pa_imp_get_council_1_descriptor')]; [guard.GetShortName], [guard.Custom('pa_imp_get_council_2_descriptor')]; and [third_party.GetShortName], [third_party.Custom('pa_imp_get_council_3_descriptor')]."
 war_council_assembles_tribal_2: "After traveling for many days, the proud members of the [ROOT.GetCountry.GetAdjective] war council are gathered together in [ROOT.GetCountry.GetCapital.GetName], ready to discuss the waging of war on new foes.\n\nHunched over the broad table, [marshal.GetShortName], [marshal.Custom('pa_imp_get_council_1_descriptor')]; [guard.GetShortName], [guard.Custom('pa_imp_get_council_2_descriptor')]; and [third_party.GetShortName], [third_party.Custom('pa_imp_get_council_3_descriptor')], opine loudly on their chosen course of action."
 war_council_all_three_agree_1: "\n\n As debate rages, it becomes apparent that, despite the various personal differences between our emphatic advisors, there is one matter they all agree on. All three of our trusted confidantes turn to face [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], united in the conviction that [target_country_1.GetName] must fall to the might of [ROOT.GetCountry.GetName]."
 war_council_all_three_agree_2: "\n\nThe debate quickly descends into anarchy, with each party determined to make their feelings known, however, the calm voice of our [ROOT.GetCountry.GetGovernment.GetRulerTitle] cuts across the raging argument, with one short phrase.\n\n"[target_country_1.GetName] must be destroyed".\n\nAs one, the three advisors fall into their seats, unsure of quite how they missed this obvious conclusion, before pledging their swords to [ROOT.GetCountry.GetName], each musing over the brilliance of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]."
 war_council_1_and_2_agree: "\n\nIn fierce competition with each other, our advisors parry and counterattack, engaging in a melee of oratory that would put the ancient bards to shame. As the hours drag on, it becomes clear that [guard.GetShortName] and [marshal.GetShortName] are in agreement that we must look to [target_country_1.GetAdjective] lands for our next campaign. [third_party.GetShortName], however, believes strongly that the lands of [target_country_3.GetName] are much more suitable for [ROOT.GetCountry.GetAdjective] rule."
 war_council_1_and_3_agree: "\n\nOver the course of the evening, [marshal.GetShortName] becomes vociferous in [marshal.GetHerHis] opinion that [target_country_1.GetName] ought to feel the might of the [ROOT.GetCountry.GetAdjective] armies, and to the surprise of many, [third_party.GetShortName] has begun to agree with this method of thinking. [guard.GetShortName] obstinately continues to promote [guard.GetHerHis] own agenda, insisting that [target_country_2.GetName] is ripe for conquest, citing [guard.GetHerHis] large network of informants in the [target_country_2.GetAdjective] countryside."
 war_council_2_and_3_agree: "\n\nAs promising and flawed arguments are proffered on all sides, the status-quo descends eventually. [guard.GetShortName] and [third_party.GetShortName] agree on the necessity of curbing the [target_country_2.GetAdjective] threat; whereas [marshal.GetShortName] opines that [marshal.GetHerHis] preference lies in the plenteous lands of [target_country_1.GetName]. It is up to us to determine the best course of action."
 war_council_all_3_different_1: "\n\nDespite significant discourse, ale, and argument, no consensus is made on the target for our future expansion plans. [marshal.GetShortName] believes fervently that the [target_country_1.GetAdjective] province of [target_province_1.GetProvince.GetName] should rightfully be under [ROOT.GetCountry.GetAdjective] rule. [guard.GetShortName] and [third_party.GetShortName] however, wish us to focus on [target_country_2.GetName] or [target_country_3.GetName], respectively."
 war_council_all_3_different_2: "\n\nBarbed insults begin to fly, as our advisors feint and deflect with consummate skill, each showing their prowess in political discourse. Ultimately, no compromise can be made, and we are left with three distinct directions. [marshal.GetShortName] is for war with [target_country_1.GetName], [guard.GetShortName] for [target_country_2.GetName], whereas [third_party.GetShortName] advocates a territorial war with [target_country_3.GetName].\n\nIt is up to us to find a course through this mess."
 war_council_all_3_agree: "We have a consensus."
 war_council_one_and_two: "Let us wage war on [target_province_1.GetOwner.GetName]."
 war_council_one_and_three: "We shall march on [target_country_1.GetName]."
 war_council_one: "[marshal.GetShortName] has the truth of it. We must prepare for war with [target_country_1.GetName]."
 war_council_two_and_three: "A claim on [target_country_2.GetAdjective] lands must be made."
 war_council_two: "We stand with [guard.GetShortName]. Ready the armies to march for [target_country_2.GetName]."
 war_council_three: "[third_party.GetShortName] speaks with clarity - we shall conquer [target_province_3.GetOwner.GetName]."
 war_council_nope: "A bunch of fools!"
 war_council_target_province_1_area_tt: "[ROOT.GetCountry.GetName] gains claims on the #Y [target_province_1.GetOwner.GetAdjective]#! Province of #Y [target_province_1.GetArea.GetName]#!."
 war_council_target_province_2_area_tt: "[ROOT.GetCountry.GetName] gains claims on the #Y [target_province_2.GetOwner.GetAdjective]#! Province of #Y [target_province_2.GetArea.GetName]#!."
 war_council_target_province_3_area_tt: "[ROOT.GetCountry.GetName] gains claims on the #Y [target_province_3.GetOwner.GetAdjective]#! Province of #Y [target_province_3.GetArea.GetName]#!."
 war_council.2.t: "The Senate Assembles"
 war_council_all_three_agree_republic: "\n\nAs debate goes on, it becomes clear that despite the oft-conflicted agendas of the senatorial factions, there is one matter they all agree on. All three of our faction representatives stand suspiciously unanimous, united in the belief that [target_country_1.GetName] must be the target of the next [ROOT.GetCountry.GetAdjective] campaign."
 #P:A TODO No EU5 equivalent: Imperator named each councillor's party ([X.GetParty.GetName]); rewritten as "their factions" (EU5 has no parties)
 war_council_1_and_2_agree_republic: "\n\nThe senate hall echoes with the rising choler of red-faced senators, each looking to promote the interests of their own faction. It transpires that [guard.GetShortName] and [marshal.GetShortName] believe strongly that the conquest of [target_country_1.GetAdjective] lands, aligns perfectly with the aims of their factions. Meanwhile, [third_party.GetShortName] believes that [third_party.GetHerHis] faction would benefit from the conquest of rich [target_country_3.GetAdjective] land."
 war_council_all_3_agree_republic: "Agreement? How unusual."
 war_council_one_and_two_republic: "[marshal.GetShortName] and [guard.GetShortName] have it; to war with [target_province_1.GetOwner.GetName]!"
 war_council_one_and_three_republic: "[marshal.GetShortName] and [third_party.GetShortName] speak truth; we march on [target_country_1.GetName]."
 #P:A TODO No EU5 equivalent: Imperator "[marshal] of the [party]"; party name dropped (EU5 has no parties)
 war_council_one_republic: "[marshal.GetShortName] has the facts. We must make war on [target_country_1.GetName]."
 war_council_two_and_three_republic: "[guard.GetShortName] agrees with [third_party.GetShortName]. We trust them implicitly."
 #P:A TODO No EU5 equivalent: Imperator "We stand with [guard] and the [party]"; party name dropped (EU5 has no parties)
 war_council_two_republic: "We stand with [guard.GetShortName] and [guard.GetHerHis] faction. To [target_country_2.GetName]!"
 #P:A TODO No EU5 equivalent: Imperator "for the [party]"; rewritten with the councillor's faction (EU5 has no parties)
 war_council_three_republic: "We shall conquer [target_province_3.GetOwner.GetName] for the faction of [third_party.GetShortName]."
 war_council_nope_republic: "The Senate can be most tiresome..."
 # custom loc: war council descriptors (pa_imp_b16_custom_loc.txt)
