l_english:
 # Imperator (Invictus / Terra Indomita) formable import (2026-11-07)

 # formables (formable key and description)
 form_abasgia: "Form Abasgia"
 form_abasgia_desc: "By defeating and subjugating the various tribes around us to form a mighty nation, we have proven to the world that we are no mere barbarians, but are the founders of a new kingdom - Abasgia!"
 form_achaean_league: "Restore The Achaean League"
 form_achaean_league_desc: "There are many enemies that would see the people of Greece living their lives in a state of servitude, but as long as breath fills our lungs, we shall fight against the enemies of freedom! The Achaean League will stand as a bulwark against the foreign machinations of meddling Generals and Kings."
 form_aeolia: "Unite the Aeolians"
 form_aeolia_desc: "The Aeolians, said to be descendants of Aeolus, the ruler of the winds, were among the first Greeks to settle on the western coast of Asia Minor. For centuries, their settlements spread from the shores of Asia to the islands of Lesbos and Tenedos, thrived, but over time they fell prey to the power struggles of larger empires. Now, the time has come for the Aeolian people to rise again, uniting their scattered cities and reclaiming their rightful place as a powerful and independent league."
 form_aestuia: "Unite Aestuia"
 form_aestuia_desc: "It is time to bring all the Aestian people together under our rule, no longer a people scattered to the wind. Under our command, Aestuia will be known for its strength and unity."
 form_aethiopia: "Form Aethiopia"
 form_aethiopia_desc: "Though many of northern origins frame \"Aethiopia\" as any land of those with dark skin south of Egypt, we have decided to embrace that foreign name out of practicality; those who live here know this land of fire very well, so they need not such formalities such as a name for the only place they know.\n\nNamed or not, we are the masters of the Upper Nile regardless, and we have created empire where none were able to before."
 form_ainu: "Form Jomon"
 form_ainu_desc: "The distant islands to the north belong to us, as well as a substantial portion of Wa itself. By right of conquest, we claim these territories, and more, as our own - a homeland for the Jomon people."
 form_ainu2: "Form Ainu"
 form_ainu2_desc: "The distant islands to the north belong to us. By right of conquest, we claim Hokkaido as the homeland for a new people, the Ainu people, where the Susuya traders and northern Hokkaido Jomon meet together."
 form_aksum: "Form Aksum"
 form_aksum_desc: "After the fall of the Kingdom of D'mt, a number of states emerged to challenge the balance of power in the region. Aksum, the mightiest of them all, would go on to build an empire to rival the Nilic powers."
 form_alamannia: "Form Alemannia"
 form_alamannia_desc: "With the collapse of the Suebi, our people are scattered, divided, and leaderless; Our southern neighbors living on the Alpine foothills, however, similarly find themselves embroiled turmoil and chaos, making them vulnerable to an outside incursion. Should we manage to unite enough of the various Suebi remnants under our banner, we can march southward and stake out a new homeland for our people, securing our future for generations to come."
 form_alania: "Form Alania"
 form_alania_desc: "Divided and leaderless, the Alani have repeatedly been pushed further west by stronger tribes, forced to settle for the worst grazing land. By consolidating our kin under a single tribe, we will be in a prime position to dominate the Sarmatians and secure our rightful place as the horse lords of the steppe."
 form_alba: "Form Alba"
 form_alba_desc: "We have migrated from our native Hibernia and have conquered the petty Pictish chiefdoms and clans under our glorious banner. It's time that we officially proclaim our lordship over these rugged craigs and become Alba. With the fortress of Caledonia as the center of our realm, we will never be subjected to the whims of outsiders. Alba gu bràth!"
 form_aquitania: "Form Aquitania"
 form_aquitania_desc: "Our people have always existed in a liminal state, on the edge of both Gaul and Iberia. One strong leader to unite the clans could take advantage of this powerful position, and create a state capable of brokering trade and peace in this region."
 form_arabia: "Form Arabia"
 form_arabia_desc: "For generations, Arabia has been a nexus of trade, providing frankincense and myrrh to the major civilizations of the world, but our potential for greatness has been squandered by the many fragmented tribes and kingdoms of the region, who wage war amongst themselves instead of working together. By unifying the peninsula, we can forge a civilization from the sands rivaling that of Egypt and Persia."
 form_armenia: "Form Armenia"
 form_armenia_desc: "The lands of Armenia need able and strong leadership. Let us unite the Armenian people and forge a stronger and more durable Armenian empire."
 form_armorica: "Unite Armorica"
 form_armorica_desc: "Home to villages of indomitable Gauls, Armorica has long been a center of flourishing trade and culture. As warlike empires loom on the horizon, we must begin to think beyond the confines of our peaceful, agrarian existence. All it would take to unite our people, is one - stronger, and more invincible than the rest."
 form_aryavarta: "Form Aryavarta"
 form_aryavarta_desc: "Aryavarta, the land of the Aryans, the country of nobles. The collective lands of all Vedic Indo-Aryans have come together. By uniting the peoples of all these lands we can defeat any empire who dare try and stop us. A nation to safeguard the people of North India, their ideals, religions, traditions, and all we call home."
 form_assyria: "Form Assyria"
 form_assyria_desc: "Before it was crushed by hostile powers Assyria was the thriving center of a great Empire. Let us once again unite these lands and form the greater country of Assyria, honoring the old gods and traditions of our people."
 form_asturia: "Unite Asturia"
 form_asturia_desc: "The Asturian tribes lived a peaceful agrarian existence on the coast of Iberia. Their warriors were employed by the Carthaginians on a mercenary basis, and their society was noted to be largely matrilineal in nature."
 form_atrebatia: "Form Atrebatia"
 form_atrebatia_desc: "Long have we crossed the channel to raid and loot the shores of Britannia, earning our warriors great wealth and plunder over the years. However, now that we have begun to create permanent settlements in the area, it is time that we claimed lordship over our new domains by establishing the kingdom of Atrebatia."
 form_attica: "Form Attica"
 form_attica_desc: "For centuries now the Attican peninsula and her surrounding islands have been dominated by Athens, who was for a time, the most powerful and influential of all the Greek cities. But this was not always the case; we remember a time when Attica was still divided amongst many cities, Eleusis, Thorikos, Rhamnous, and Megara to name a few. Given the shifting fortunes of the Greek cities ever since the rise of the Diadochi, we would be wise to seek to unite our kin, even if we may have been divided in the past."
 form_babylon: "Form Babylon"
 form_babylon_desc: "Babylon the great, that most ancient of cities, which reigns over the kings of the earth; it is our destiny to break the yoke of our oppressors, and restore her to her people."
 form_bastetania: "Unite Bastetania"
 form_bastetania_desc: "The various tribes of the Bastetani have always existed separate from each other. But, to unite our lands would ensure the prosperity of our people, and would lead us to prosper, perhaps even greater than the Punics who we are so often in contact with."
 form_belgia: "Unite Belgia"
 form_belgia_desc: "The Belgae have always occupied a rich and fertile part of the world. Such abundance invites complacency, and we must strive to do away with such danger. The threats from the warring empires that we hear of from traveling merchants is greater than most would imagine - we must unite the Belgae for all our sakes."
 form_bharatavarsha: "Bharatavarsha"
 form_bharatavarsha_desc: "The Puranas speak of a united subcontinent, entrusted to Bharata, and known as Bharatavarsha. We must aspire to unite all of those lands so that the subcontinent may enjoy stability and peace."
 form_boeotia: "Form Boeotia"
 form_boeotia_desc: "The Boeotian League was at one time the main power in northern Greece, reaching its peak under the leadership of the Theban commanders Epaminondas and Pelopidas, who led the Boeotians to defeat Sparta and Macedon in pitched battles."
 form_brettonia: "Unite Pritania"
 form_brettonia_desc: "Since our ancestors arrived on this island, our peoples have coexisted. With the advent of this new age of iron-working, seafaring, and empire, it is clear that our people cannot survive much longer without a unified identity. For better or worse, we must look to new horizons, and assume leadership over the all of Pritania."
 form_brittany: "Form Brittany"
 form_brittany_desc: "The isle of Britain is too scarred, wartorn, and chaotic to ensure the survival of our culture. The conditions of Armorica just across the sea to the south are far more sustainable and prosperous. If we can settle our people there, we can establish a kingdom of Brittany that will ensure our traditions and customs will survive."
 form_cabalia: "Form Cabalis"
 form_cabalia_desc: "The Cabalian people will not be bullied by our Carian and Milyadian neighbors; united in common purpose we shall establish ourselves as the new regional power."
 form_cantabria: "Unite Cantabria"
 form_cantabria_desc: "The Cantabri have long held a strong solidarity with each other. Nonetheless, if we are to survive in these ever-changing times, a strong leader must emerge, and unite the clans."
 form_caria: "Form Caria"
 form_caria_desc: "Alexander won great popularity with the Carians for restoring Queen Ada to the Carian throne after she had been deposed by her brother. For a time she ruled under the watchful eye of Asander who had been the Satrap of Lydia and then also of Caria. Although, Asander was favored by Antipater, Ptolemaios, and Seleukos, he was an enemy of the envious Antigonous. In 313 BCE, Asander was forced to cede his territories to Antigonus with the Satrapy of Caria being effectively dissolved. \n\nAlexander's sucessors grow weak and Caria is ripe for the taking. Under [ROOT.GetCountry.GetAdjective] rule, the towns and villages of Caria can fulfill their destiny and that of our own people by blazing a new path free from the imposition of foreign interlopers."
 form_carpetania: "Unite the Carpetani"
 form_carpetania_desc: "Our people yearn for a leader strong enough to unite the clans which consider themselves of Carpetani heritage. It is clear that we are the only viable leader skilled enough to do this."
 form_ccc: "Create the Caledonian Confederacy"
 form_ccc_desc: "For many long years, the Picts have eked out a solitary existence on the highlands of Caledonia. Uniting the clans, tribes and families of our people has always seemed like an unattainable goal. We believe that this is not so. A mighty leader, with the benevolence and understanding required to rule, could tie together all of Caledonia in a strong bond."
 form_celtiberia: "Unite Celtiberia"
 form_celtiberia_desc: "The Celtiberi have long held a strong solidarity with each other. Nonetheless, if we are to survive in these ever-changing times, a strong leader must emerge, and unite the clans."
 form_chrysaoric_league: "Form Chrysaoreus"
 form_chrysaoric_league_desc: "Alexandros won great popularity with the Carians for restoring Queen Ada to the Carian throne after she had been deposed by her brother. For a time she ruled under the watchful eye of Asander who had been the Satrap of Lydia and then also of Caria. Although, Asander was favored by Antipater, Ptolemaios, and Seleukos, he was an enemy of the envious Antigonous. In 313 BCE, Asander was forced to cede his territories to Antigonus with the Satrapy of Caria being effectively dissolved. \n\nPerhaps by creating a league of Carian cities under the auspices of Hekate and Zeus Chrysaoreus, centered around [GetProvince('(int32)1980').GetName] which houses temples to these most favored gods, the towns and villages of Caria can fulfill their destiny and that of our people by blazing a new path free from the imposition of foreign interlopers."
 form_cilicia: "Form Cilicia"
 form_cilicia_desc: "The Cilician people have long considered themselves as unique to their myriad overlords. This identity naturally leads us to suggest that our right to self-rule is accompanied by divine mandate. We must unite all Cilicia, and reclaim our homeland!"
 form_crete: "Form Crete"
 form_crete_desc: "The people of Crete have lived a fractious existence for centuries. It is time to put an end to our petty squabbles, and unite our island under one banner."
 form_cyprus: "Unite Cyprus"
 form_cyprus_desc: "The island of Cyprus, rich in copper, and a prime trading port with the continent, makes a fine home for our people. It is time we embrace this national identity, and claim our place in history."
 form_dacia: "Form Dacia"
 form_dacia_desc: "Dacia; a land rich in resources, culture, and civilization, eyed jealously by greedy neighbors, belongs in the hands of its own people. It is high time that a strong leader emerged to challenge the status quo between fragmented tribes, uniting all Dacia under one banner!"
 form_delphic_amphictyony: "Reestablish the Delphic Amphictyony"
 form_delphic_amphictyony_desc: "According to legend, the Delphic Amphictyonic League was founded by Hellen's brother, Amphictyon. At the time of its inception, the league was made up of twelve member groups:0 Aenianes, Boeotians, Dolopes, Dorians, Ionians, Locrians, Magnetians, Malians, Perrhoebians, Phocians, Pythians, and Thessalians. Organized out of the eponymous settlement of Delphi to support the rites and temple maintenance of Apollo and Demeter at Delphi, the Delphic Amphictyony doled out religious law and punishment, conducted warfare, and established rules of conflict and statehood. \n\nThe Third Sacred War (356 BCE) kicked off after the Phocians seized Delphi and looted its treasury. Eventually, Phillip's Macedonians joined the war against the Phocians, defeated them, and were given their seats on the league council, serving as a prelude to his seizure of Greece through a combination of diplomacy and force."
 form_dravida: "Form Dravida"
 form_dravida_desc: "By uniting the peoples of all Dravidian lands we can create a strong counterpart to the great empires of the north. A nation to safeguard the ancient traditions of our ancestors and protect the rich soils of the south."
 form_egypt: "Form Egypt"
 form_egypt_desc: "Egypt is perhaps the oldest civilization of all, and yet she is not free. Instead pretenders have usurped the kingdom and play at honoring the old gods. This cannot be tolerated. We must unite Upper and Lower Egypt once again under a dynasty that truly understands and cherishes the legacy of the Pharaohs."
 form_fezzan: "Form Fezzan"
 form_fezzan_desc: "Those traveling in the lands of Fezzan are there for one or two reasons; they either desire to hire our formidable mercenary armies for themselves, or they have gotten lost in the vast desert plains that are our domain. The time has come to embrace our destiny and establish a new state, one that shall rule from the desolate places - like a rose blooming in the desert."
 form_funan: "Form Funan"
 form_funan_desc: "Now that we have established control throughout the forests and jungles of our peninsula, we could embrace the identity by which most foreign cartographers refer to this region; Funan."
 form_galatia: "Form Galatia"
 form_galatia_desc: "While we are far from the ancestral homeland of our people this is still a good land. Let us create a new state here, and teach these local peoples about the capabilities of the Celtic peoples."
 form_gallaecia: "Unite Gallaecia"
 form_gallaecia_desc: "The tribes of the Gallaeci have lived a fragmentary existence for as long as we can remember. Rumors of foreign invasions to the south, people fleeing from great wars, and the sinister foreign gods of strange lands, fill the ears of our people. A strong leader, capable of uniting the clans, would safeguard our future in these uncertain times."
 #P:A TODO The mod already has loc for GAUL_f; Imperator: "Form Gaul"
 form_gepidia: "Form Gepidia"
 form_gepidia_desc: "For years we have wandered the treacherous and desolate lands of the north, without any luxury or stability. However, the land of Dacia is close to the rich and decadent Hellenic civilizations of the south and is protected from the horse-lords via the Carpathian mountains to the north; by establishing Dacia as our new homeland, we will be in the perfect position to set up a kingdom made prosperous from raiding the great cities of the Aegean with impunity."
 form_germania: "Form Germania"
 form_germania_desc: "The tribes of Germania are each individually strong and powerful, yet without a strong leader to lead them, we remain just that; separate tribes too busy being mired in infighting then to partake in the greater glory that awaits us. By subjugating and deposing of our weak and short-sighted rivals, we will be able to proclaim a Germanic Empire capable of waging titanic wars that will be spoken of in legend for a thousand years to come, and dominance of the continent shall be ours!"
 form_golden_chersonese: "Form Golden Chersonese"
 form_golden_chersonese_desc: "Many said this place did not even exist, yet here we are at the end of the world with many more worlds to conquer."
 form_great_tocharia: "Form Great Tocharia"
 form_great_tocharia_desc: "Controlling the Northern and Southern Tarim Basin has afforded our people a position of strength, allowing us to expand farther westward into the lands occupied by our traditional enemies and destroy them. Great Tocharia rides forth on hooves that bring misery and destruction to our foes!"
 form_great_yue: "Form Great Yue"
 form_great_yue_desc: "The heartlands of Yue, the cradle and the castle of the Baiyue Faith, has watched her inhabitants spread far from their homes and towns, expanding into the wider world. Now that our borders have grown to match our ambitions, perhaps a change is in order."
 form_greater_aquitania: "Form Greater Aquitania"
 form_greater_aquitania_desc: "Our ways are ancient, having preserved and honored the customs of our ancestors since time immemorial; if improperly stewarded, however, we may fade into the annals of history like so many others before us. If we can preserve the embers of Aquitanian culture, they could be stoked into a mighty flame and used to create something extraordinary."
 form_greater_maeotia: "Form Greater Maeotia"
 form_greater_maeotia_desc: "The Maeotian lake, a great sea north of the Pontus Euxinos, has long been a strange corner of the watery lanes which stretch all the way to the Atlantic beyond the Pillars of Hercules. The Maeotian tribal folk, long-oppressed by both Greeks and steppe peoples, must take command of their coastal heritage in order to assert themselves in this chaotic world."
 form_hellespontine_district: "Form Hellespontine District"
 form_hellespontine_district_desc: "First created as a result of the Athenian monopoly on violence and trade in the Propontic Sea and the Bosporus Strait, the Hellespontine District represented one of the wealthiest trading hubs in the world, controlling taxation and goods-flow. To recreate this monopoly on the economy would grant us a great control over the world's politics and future."
 form_hellespontine_phrygia: "Form Hellespontine Phrygia"
 form_hellespontine_phrygia_desc: "Established at the beginning of the fifth century BCE, Hellespontine Phrygia was ruled by descendants of Pharnaces, an uncle of King Darius I the Great, with its capital located at Dascylium. During the campaign of Alexander the Great in 334 BCE, the satrap of Hellespontine Phrygia, Arsites, suffered a decisive defeat at the Battle of the Granicus River, after which he committed suicide. Alexander appointed Calas as his successor. Following Alexander's death in 323 BCE, the satrapy was awarded to Leonnatus, a member of the royal house of Lyncestis in Macedonia and one of Alexander's trusted bodyguards. Leonnatus entertained ambitions beyond his satrapy; he sought marriage with Cleopatra, Alexander's sister, a move that could have strengthened his claim to power. Had he defeated the Athenians, Leonnatus may very well have attempted to seize the Macedonian throne for himself. His career was cut short during the Lamian War, where he led a force of 20,000 infantry and 1,500 cavalry to relieve Antipater during the siege of Lamia. Leonnatus was killed in the battle, leaving his aspirations unfulfilled. Control of the satrapy then passed to Arrhidaeus, who held it until the Partition of Triparadisus (321 BCE), after which Clitus the White was assigned as satrap. Clitus' rule was brief. He was defeated and killed in 317 BCE by Arrhidaeus. His successor, Ardys, governed for an uncertain period before power shifted again. Phoenix of Tenedos, a loyal subordinate of Antigonus, governed the region for a time, followed by Antigonos' nephew Polemaios, another of Antigonus' generals. However, after the compelled suicide of Polemaios, the satrapy has been defunct."
 form_helvetia: "Unite Helvetia"
 form_helvetia_desc: "The clans of the Helveti have built a strong civilization in the hills of Transalpine Gaul, yet in order to combat the growing threat of empire, a strong leader must emerge to challenge the status quo between constituent tribes. Only in this way, will we avoid the extinction of ways."
 form_hibernia: "Form Hibernia"
 form_hibernia_desc: "The people of Hibernia has long been too few and spread out across our home to pose any threat to the outsiders to the east. Coming together for the protection of all is the way to go, if we want our people to live safely and prosper. If the other clans and clan chiefs cannot see that, it is our job to convince them, one way or another."
 form_hindustan: "Form Hindustan"
 form_hindustan_desc: "The land of the Hindush river, which flows down from the land of five rivers, is a rather neglected region of India. Unlike the fertile Indo-Gangetic plain, it is more desolate, reliant on sea trade, and fewer cities. We dub this land as Hindustan, and we shall call it our home now."
 form_hunnic_empire: "The Scourge of the West"
 form_hunnic_empire_desc: "Defeated and outcast, our people are forced to migrate westward across the steppe in search of a new beginning, fighting off those in our way as we march ever-closer towards the edge of the known world. However, after reaching the end of the endless fields of grass which comprise the steppe, we have encountered a strange world full of rich, fertile farmland and civilizations ripe for plunder and conquest, guarded only by petty tribes and crumbling empires. With our greatest warriors mounted on horseback, we shall swarm through these undefended cities like a ravenous plague and crush any pathetic attempt at resistance we may encounter. From the ruin of our enemies, we will forge a new empire to dominate the western world."
 form_iberia: "Form Greater Iberia"
 form_iberia_desc: "The Greeks know the land we inhabit as Iberia. As civilization flourishes, and we become more aware of the lay of the land, political environment, and cultural similarities of our neighbors, it becomes apparent that this land of Hiberia belongs with us, and not the greedy foreign invaders from the east."
 form_illyria: "Form Illyria"
 form_illyria_desc: "The long coastline of Illyria has been tussled over by numerous kingdoms and empires over the ages. In a prime position for trade, as well as naval dominance, our people believe that it is high time we united the region under one, independent state."
 form_indger: "Form the Indo-Germanic Kingdom"
 form_indger_desc: "We have migrated far beyond the reaches of our Germanic homeland, and have found ourselves a rich and fertile land to the east of the Hindu Kush mountains. With this place as the foundation of our new country, our people can prosper."
 form_indo_parthia: "Form Indo-Parthia"
 form_indo_parthia_desc: "Much of the east has been engulfed in chaos and anarchy from the aftermath of the Sakan and Yuezhi invasions, forcing Parthia to leave many of its eastern domains to their own devices. One of the Parthian governors in particular has grown ambitious, conquering the cities of the Indus and issuing his own coinage. Perhaps it is time for the governorship to officially leave nominal overlords behind and declare an independent Indo-Parthian Kingdom."
 form_indo_scythian_kingdom: "Form Indo-Scythian Kingdom"
 form_ionia: "Unite the Ionians"
 form_ionia_desc: "Stretching across the Aegean coast, the cities of Ionia have often been at the mercy of foreign powers. But the time has come for the Ionian people, the children of Ion, to unite under one banner, to defend their freedom and restore the glory of their ancestors."
 form_ionian_league: "Form The Pan-Ionian League"
 form_ionian_league_desc: "When the Persians were upon us, the proud Ionians and Aegeans banded together to resist them. The time has come once again for the bonds to brotherhood to be reforged in the face of new dangers. A new league of independent city states on the coast of Asia will allow us to better repel barbarians and the Hellenistic Kings!"
 form_isauria: "Form Isauria"
 form_isauria_desc: "For too long the Isaurians have been bullied by our neighbors and confined to the Taurus mountains, it is time to unite the clans and forge a new path for our people."
 form_israel: "Form Israel"
 form_israel_desc: "It has been more than 600 years since the Kingdom of Israel split up. If we possess the once great kingdoms territories we should hold the right to restore it and bring glory to Judea."
 form_italia: "Unify Italian Peninsula"
 form_italia_desc: "Our hegemony has extended to encompass the islands of Corsica, Sardinia and Syracuse, and the scattered cities of Magna Graecia have submitted to our banner. As we have driven the dominant powers from the Italian peninsula, the call to form a new nation echoes across the valleys and mountains of our territories - we shall create #Y Italia#! from this day forth."
 form_kushan: "Form Kushan"
 form_kushan_desc: "The mighty Yuezhi people are known by different names to many. In the far, misted east, we are known as the Guishuang. Our foes in these greener pastures know us know as Kushan. Let us adopt this identity, and forge an empire the likes of which this region has never before seen!"
 form_lazica: "Form Lazica"
 form_lazica_desc: "The Laz people once dwelt among the Abasgoi to the north and have for generations traveled the winding paths of the wetlands of Colchis' delta region. Forgotten in the eyes of Kuji's kind, it ought to be the Laz who take their turn in ruling the Phasis and charting a new course for the people of the eastern Black Sea."
 form_lesser_media: "Form Lesser Media"
 form_lesser_media_desc: "Media was fractured upon conquest by Alexander the Great, but Lesser Media is certainly not Lesser in quality. This area comprises perhaps the greatest portion of Media, with the rich and ancestral lands hosting the wealth of knowledge of the Iranian plateau, from the age of Assyrians till now."
 form_lesser_scythia: "Form Lesser Scythia"
 form_lesser_scythia_desc: "Known also as 'Scythia Minor,' this area was one of the southernmost realms controlled by the Scythians at their Classical Era height under king Ateas. Rich with trading ports and wild hinterlands, it stands as a great yet trifling outpost for steppe lords."
 form_liguria: "Form Liguria"
 form_liguria_desc: "The Ligurians have persisted in Cisalpine Gaul for millennia, living divided among small tribes and toiling in the fields. However, a new power to the south is rising which, if left unchecked, could threaten our very existence. In order to counteract this threat, we must band together into a pan-Ligurian federation capable of fighting those who would subjugate us."
 form_lusitania: "Unite Lusitania"
 form_lusitania_desc: "Those we call kin exist in fractured tribes, with no hope of ever achieving something greater. We must aim to assert our rightful leadership over them, and lead our people to greater glory!"
 form_lycia: "Form Lycia"
 form_lycia_desc: "Our people have too long been divided and undermined by foreign invaders, now it is time for the Lycian cities to unite their wills in earnest and assert their might once more."
 form_lydia: "Form Lydia"
 form_lydia_desc: "The ancient towns of Lydia have accepted Persian and Macedonian subjugation for too long, now under our direction our people will at last live up to the glory of Croesus."
 form_malaya: "Form Malaya"
 form_malaya_desc: "The Malayan people have never been united as one before but many say that the time to do so is now."
 form_media: "Form Media"
 form_media_desc: "The ancient Cyaxeres built upon the successes of his father, to unite the Medes, and forge the first true empire in our region. Overthrown by Cyrus himself, this region has been the birthplace of conquerors and founders alike. After many long years of foreign oppression, it is time we cast off our shackles, and embrace our destiny once again."
 form_miao: "Form San Miao"
 form_miao_desc: "All Miao people were said to have descended from the legendary Jiuli tribe, but they were defeated by Yu the Great in battles and were thus dispersed by the encroaching Yue peoples. The rest were subjugated by the Chinese of the Central Plains region. \n\nIt is time for us to reverse this and unite all Miao people again."
 form_milyadia: "Form Milyas"
 form_milyadia_desc: "The time of Cabalians and Pisidians squeezeing our divided towns must come to an end, and a new era of Milyadian strength ushered in by a strong leader."
 form_nanto: "Establish Nanto"
 form_nanto_desc: "The #high Nansei#! were what the #high Yayoi#! referred to the #high Duuchuu#! as. Roughly translating to 'the southwesterners,' we have now adopted many #high Duuchuu#! traditions, thus making the #high Nansei#! a syncretic culture. With our own language and traditions, the state of #high Nanto#! rises!"
 form_nanyue: "Form Nanyue"
 form_nanyue_desc: "There are many southern Yue peoples hugging the shore, however, because of their growing fortune, they are constantly being eyed by the Central Plains empires, who just see them as mere vassals. It is time to unite them and lead them to battles against these foreigners."
 form_neo_mitanni: "Revive the Mitanni"
 form_neo_mitanni_desc: "Long ago, the great Mitanni were destroyed by the Assyrians, their people slaughtered and their cities reduced to ashes. Now that we are in control of their old lands, we can proclaim ourselves the heirs of their proud legacy, and usher in a revival of the Mitanni civilization."
 form_noricum: "Form Noricum"
 form_noricum_desc: "The smiths of the Noric people have been at the forefront of innovation for centuries. Our people deserve a greater standing in the world, and it is up to us to unite them under one banner, claiming our place in history."
 form_numidia: "Form Numidia"
 form_numidia_desc: "A conglomeration of tribal states, the Kingdom of Numidia was united as a result of the fall of Carthage, directly caused by Rome. Later allying themselves with this new Italian power, Numidia continued to enjoy autonomy until a breakdown in relations drew the ire of Rome."
 form_ostrogothic_kingdom: "Form the Ostrogothic Kingdom"
 form_ostrogothic_kingdom_desc: "Our homeland in Germania has become overpopulated, its resources no longer are enough to sustain our ever growing population. There is a warm, rich, and bountiful paridise to the south, in a city that is called 'Rome.' We can migrate there and take this 'Rome' for ourselves to establish a mighty kingdom."
 form_palestine: "Form Philistia"
 form_palestine_desc: "Once known to the Egyptians as the Peleset, the powerful member of the daunting Sea Peoples who took down an age, and known to the Greeks as Philistines, the people of south Canaan, whatever they are called, the land they live on would be left with the name of their people, the land of the Philistines, Philistia. The rich pentapolis is filled with cities of ports and trade, located at a key traderoute between the lands of Egypt and Syria. Since the bronze age, the people of Philistia have completely blended with Phoenecian culture, inhereting their rich legacy as well as building upon their own."
 form_pamphylia: "Form Pamphylia"
 form_pamphylia_desc: "The great cities of Pamphylia will be unified under our leadership, passing the fruits of their labors to their own people rather than foreign invaders."
 form_pannonia_all: "Form Pannonia"
 form_pannonia_all_desc: "Protected by the mountains in the north and east and shielded by rivers to the south, the fertile plains of the Carpathian basin are the perfect place to establish a strong, powerful kingdom worthy of remembrance. Yet, the other tribes which inhabit it are scattered and divided, lead by lesser men unworthy of their titles; if we can rise above our peers and unite the region, we can proclaim ourselves as the true masters of Pannonia and forge a better future for our people."
 form_parthia: "Form Parthia"
 form_parthia_desc: "When the Parni tribe conquered the region of Parthia, liberating it from the grasp of the Seleukids, few could have known that this once-nomadic tribal nation would go on to conquer much of Central Asia."
 form_persia: "Form Persia"
 form_persia_desc: "The days of Cyrus and Darius are long gone, but the Persian people remember the great empires built by their own. It is time to throw off the shackles of our foreign oppressors, and unite our people once again!"
 form_phrygia: "Form Phrygia"
 form_phrygia_desc: "For too long have we languished under the rule of foreign Greek or Persian conquerors. It is time the Phrygians unite and re-establish a state of their own. We will reclaim the legacy of our people and our gods."
 form_piaoyue: "Form Piaoyue"
 form_piaoyue_desc: "The lands where the Bon, Vedic, and Natic faiths meet has long been a crossroads that facilitates the exchange of goods and ideas across a region filled with a variety of vastly different people. And yet, there can be strength in diversity and the lands of the Piaoyue demonstrate this."
 form_pisidia: "Form Pisidia"
 form_pisidia_desc: "The proud Pisidian cities have thrived in the shadow of Mount Taurus, and under our leadership the united towns will at last rival the neighboring peoples in strength and prestige."
 form_pong: "Form Pong"
 form_pong_desc: "Shrouded in mystery, the Shan people exist in the misty highlands at the edge of the Indic and Sinitic worlds, having migrated here many generations ago. With the recent arrival of the Pyu people, the fertile Irrawaddy valley has been left fragmented and divided into various city-states and tribes, leaving the area vulnerable to an outside incursion:0 With the finest warriors of the highlands assembled into a single force, we will be able to pour outward from our fortified hills and establish a great kingdom that will be spoken of in myth and legend for generations to come."
 form_pontus: "Form Pontus"
 form_pontus_desc: "Once a proud kingdom of its own Pontus was reduced to a Satrapy under the Achaemenids and later devolved into a no mans land under the Successors. We must restore the great state that once was and create a new Pontic Kingdom."
 form_punjab: "Form Punjab"
 form_punjab_desc: "The people of this land call it 'Panchanada,' meaning 'Five Rivers.' Thus, we declare it 'Punjab.' The prosperous lands of the Upper Indus Valley contain some of the wealthiest and most fertile soils in all of the world, providing a perfect backbone for countless of invading and native great empires."
 form_punt: "Form Punt"
 form_punt_desc: "From Adouli to Apocopa, Punt has been at the crossroads of commerce for generations, with ivory from Africa, frankincense from Arabia, and even spices from distant India passing through its ports. If we were to unite the various cities and realms in the region under our banner, we would be able to monopolize trade and attain immense wealth beyond our wildest imaginations."
 form_rhaetia: "Unite Rhaetia"
 form_rhaetia_desc: "The Rhaetians are a group of Alpine people with whom we share many attributes. A strong leader to unite them against foes from outside is paramount to our continued survival."
 form_salluvian_confederacy: "Form the Salluvian Confederacy"
 form_salluvian_confederacy_desc: "Emerging in the second century BCE, the Salluvian Confederacy was a loose tribal organization of the various Salluvian tribes. This confederation was formed in part to protect from encroaching Massalian settlement. However this would not last long, as in 121 BCE, the Romans intervened between the Salluvians and the Massalians, sacking the former's capital, and subjugating their leaders."
 form_sardinia: "Form Sardinia"
 form_sardinia_desc: "The tribes of Sardinia have often been controlled by warlords from the south or east, controlling the most fertile pieces of the island while forcing the locals up in the highlands. Under our rule the people of Sardinia shall fend for themselves without the interference of foreign hostile forces."
 form_sarmatia: "Form Sarmatia"
 form_sarmatia_desc: "The separated Sarmatian tribes have lived independently of one another for too long. Let there be the great steppe-horde of Sarmatia the world will come to fear."
 form_scandia: "Form Scandia"
 form_scandia_desc: "Lying at the northernmost periphery of the Germanic world, Scandia is a harsh, bitter place where cold, long nights meet colder, longer winters, spoken of only within the whispers, rumors, and tall-tales of distant travelers. Yet, despite the odds, we have managed to not only persist and survive, but have found ways to grow strong and thrive; by subduing the remainder of our kin, we can establish a great northern federation, and thus claim our rightful place within Germania."
 form_scythia: "Form Scythia"
 form_scythia_desc: "The Scythians are a fierce and independent people, known for their prowess as warriors and masters of the steppes. The time has come to unite the tribes of Scythia under one banner, bringing strength and stability to these lands. From here, we shall protect our way of life and, if necessary, expand to secure our borders from potential threats in all directions."
 form_slavia: "A Balto-Slavic Union"
 form_slavia_desc: "We have lived along the boundaries of the known world for millennia, eking out a meager existence dwelling among the vast forests. Yet in spite of our similarities, we are scattered and divided, living as if we were separate peoples, fighting and warring amongst each other over petty despites and meaningless feuds. If we were to rise up and subdue the rest of our kin, we could proclaim a pan-Slavic, pan-Baltic federation stretching from the Baltic Sea to the Steppe, capable of subduing those foolish enough to challenge us."
 form_suania: "Suania"
 form_suania_desc: "From the lofty heights of the Caucasus, we shall plant our banner, the flag of Suania, on top of the highest peaks - let us proclaim to the Earth that a nation of conquerors has triumphed!"
 form_suebia: "Unite Suebia"
 form_suebia_desc: "The Suebi are a large group of people with whom we share many attributes. A strong leader to unite them in these dark times, is paramount to our continued survival."
 form_syria: "Form Syria"
 form_syria_desc: "Situated in an important strategic location, the region of Syria has been controlled by numerous nascent empires, for thousands of years. Now that we have finally attained freedom, we believe that Syria ought to be an independent state, arbitrating balance between the mighty powers of the Nile, Persia, and Anatolia."
 form_thessalian_league: "Form Thessaly"
 form_thessalian_league_desc: "Home to Olympus itself, Thessaly has long sat at the very edge of the Greek frontier, far north of civilized Athens, but not yet reaching the barbarous lands beyond Macedon. The many cities and towns dotting the Thessalian plains have historically been unified under a central Thessalian League, developing a distinct 'Thessalian' identity. Since the time of the Tagus Aleuas, who claimed descent from Herakles, the lands we know as Thessaly were splintered into four autonomous regions, all owing their allegiance to the Tagus whom the great families of Pharsalos, Larisa, and Pherai put forth from their honored lineages. However, after winning a civil war on behalf of Larisa and defeating Lycophron of Pherai and Onomarchos of Phocis, Philip II of Macedon shattered the status quo as he was appointed the Archon of the Thessalian League, subordinating the League to the throne of Macedon. The Thessalian League became a veritable nonentity after a failed uprising against Alexandros the Great and subsequently lost much of its autonomy.\n\nFor too long the Thessalians have been dominated by Macedonians, who crushed the age old Tripolis of Pharsalos, Larisa, and Pherai. As Macedonian power wanes, Thessaly will once again take its place among the premier Greek powers!"
 form_thrace: "Reform the Odrysian Kingdom"
 form_thrace_desc: "After the death of Cotys I in 360 BCE, the Odrysian Kingdom was torn into three parts, each being subsumed by the rising Macedonians under Philip II. A new and strong leader however, could bring back the glorydays of Cotys I, or perhaps even the great Teres himself."
 form_tibetan_empire: "Form Tibet"
 form_tibetan_empire_desc: "Tibet has long been a backwater, isolated on the mountain tops which protect us. However, our harsh and treacherous lands will not protect us forever, for sooner or later, we will be conquered by a force too great and terrible to overcome on our own; to survive we must end our time of isolation, and actively lay conquest to our neighbors. With the plateau firmly secured within the borders of our realm, we can proclaim a glorious Tibetan Empire capable of projecting power and influence from the top of the world!"
 form_tocharia: "Form Tocharia"
 form_tocharia_desc: "From time immemorial we have sat at the crossroads of great civilizations, facilitating trade and ideas from east and west as middlemen, fueling the growth of wealthy cities straddling the habitable corridors running through the treacherous desert. With the death of Alexander to the west, the rise of the Xiongnu to the northeast, and China divided into warring states, much of the world has been thrown into turmoil, making it more prudent then ever before to shore up our defenses and secure the trade routes for merchants passing through; by wresting control of the other cities in the Tarim Basin, we can monopolize the silk road to increase our profits and enable funding of an effective defense."
 form_tylis: "Form Tylis"
 form_tylis_desc: "Our lands in Pannonia and Illyria, although fertile, are too small to support us. Far to the west lies a region called Tylis, rumored to possesses great abundance. Its strategic location make it an ideal spot to establish a kingdom of our own, close enough to the Hellenes that we may raid them, but far enough removed to dissuade counterattacks."
 form_vandalia_africa: "Form the Kingdom of the Vandals"
 form_vandalia_africa_desc: "Germania's forests are cold, overpopulated, and deprived of food. There is a much warmer land south of the Mediterranean with plenty of grain, comfortable beaches and grand cities ripe for plunder. We can abandon Germania and establish a new Vandal kingdom on the hospitable shores of North Africa."
 form_vettonia: "Unite the Vettones"
 form_vettonia_desc: "Those that consider themselves Vettones have long engaged in petty squabbles and disputes. All it would take is a strong leader to present themself, and we could unite our disparate clans under one banner."
 form_vindelicia: "Form Vindelicia"
 form_vindelicia_desc: "At the rocky foothills of the Alps, the various fractured Vindelician tribes dwell, our disunity and division enabling the neighboring Germanic and Celtic tribes to raid and pillage us with impunity; if we were to confederate and consolidate the other Vindelician tribes under a single leader, we could coordinate our forces and ward off those who would dare subjugate us."
 form_visigothic_kingdom: "Form the Visigothic Kingdom"
 form_visigothic_kingdom_desc: "Our homeland in Germania has become overpopulated, its resources no longer are enough to sustain our ever growing population. Beyond Gaul in the lands to the southwest, there are tales of a hospitable climate that would be a perfect fit for our people. We can seize this land and proclaim ourselves the kingdom of the western Goths."
 form_volcaea: "Unite the Volcaeans"
 form_volcaea_desc: "Our people have come far, having traveled over the Rhine and back again before finally finding a new home here on the periphery of Gaul, but we will go further still. However, before we do so, the Volcaean people must first be united under a single banner - ours."
 form_yamnat: "Form Yamnat"
 form_yamnat_desc: "The fertile plateau of Arabia Felix has been a cradle of civilization for millennia. It is long past time that the warring kingdoms that spill Arabian blood in the name of petty vengeance, are united under a common, and ancient name."
 pan_hellenic_league: "Pan-Hellenic League"
 pan_hellenic_league_desc: "During the days of Argead domination the League of Corinth united all Greek cities in one league. The goal of this organization was always to control them, and to deny them the independence that they are due. But the idea of a Pan-Hellenic League has not died with the oppressive actions of the Argeads and Antipatrids, it could also be the ultimate guarantor of Greek Independence.\nLet us unite one and all and form a League to encompass all the free cities of Greece. Together we will become the dominant force of the Greek world, leaving the kingdoms of would be successors, or usurpers, behind us."
 reunite_alexanders_empire: "Reunite Alexander's Empire"
 reunite_alexanders_empire_desc: "For too long parasites and scavengers have made a feast of the Great Empire that Alexander spent a lifetime building. It is time we do away with all claimants, usurpers and delusional provincial strongmen. There can be only one authority within the empire of Alexander the Great, one upholder of the great Hellenistic legacy that this great man founded.\nThat one power could not possibly come from any dynasty but our own. Only a family that respects the Argead traditions can legitimately claim its legacy."
 unite_the_dahae: "Unite the Dahae"
 unite_the_dahae_desc: "For too long the Dahae tribes have been squabbling between themselves. We have been disunited and weak, open to the whims of the great empires that surround us.\nLet us unite the Dahae tribes into a powerful tribal federation, for only then will we be masters of our own destiny."

