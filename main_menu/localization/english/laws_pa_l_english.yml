l_english:
 pa_water_management_law: "Water Management"
 pa_water_management_law_desc: "Rules for maintaining irrigation works and sharing water, essential to the harvests and prosperity of ancient kingdoms."
 pa_royal_waterworks_policy: "Royal Waterworks"
 pa_royal_waterworks_policy_desc: "The ruler organizes canals, dikes, and reservoirs as public works, coordinating labor and directing water toward productive fields."
 pa_communal_irrigation_policy: "Communal Irrigation Rights"
 pa_communal_irrigation_policy_desc: "Villages and local communities maintain irrigation channels and distribute water according to customary agreements."
 pa_legal_administration_law: "Administration of Justice"
 pa_legal_administration_law_desc: "The state may rely on local custom and community judgment or strengthen royal administration through written records and appointed officials."
 pa_customary_justice_policy: "Customary Justice"
 pa_customary_justice_policy_desc: "Local judges and elders settle disputes according to inherited customs, preserving community trust and limiting the reach of central officials."
 pa_written_registers_policy: "Written Royal Registers"
 pa_written_registers_policy_desc: "Scribes record royal orders, obligations, and judgments, allowing officials to administer the realm and collect revenue more consistently."
 pa_army_service_law: "Military Service"
 pa_army_service_law_desc: "The state can rely on seasonal musters of local communities or maintain longer-serving retinues for its campaigns."
 pa_seasonal_musters_policy: "Seasonal Musters"
 pa_seasonal_musters_policy_desc: "Free subjects are summoned for limited periods, preserving the tradition of a citizen or community levy without sustaining a large permanent force."
 pa_long_service_retinues_policy: "Long-Service Royal Troops"
 pa_long_service_retinues_policy_desc: "The ruler maintains a core of longer-serving household and guard troops, cultivating military experience between campaigns."
 pa_macedonian_military_law: "Macedonian Military Organization"
 pa_macedonian_military_law_desc: "The Macedonian crown may emphasize its aristocratic Companion cavalry or organize the kingdom's levies around the famous phalanx."
 royal_companion_cavalry_policy: "Royal Companion Cavalry"
 royal_companion_cavalry_policy_desc: "The king's Companions form an elite mounted retinue, binding the aristocracy to the crown and providing experienced cavalry commanders."
 macedonian_phalanx_policy: "Macedonian Phalanx"
 macedonian_phalanx_policy_desc: "The kingdom organizes its infantry around the disciplined phalanx, drawing on the military obligations of Macedonian communities."
 pa_seleucid_satrapies_law: "Seleucid Provincial Administration"
 pa_seleucid_satrapies_law_desc: "The Seleucid realm governs its far-flung territories through royal satraps or by granting privileges to the cities that anchor Hellenistic rule."
 royal_satraps_policy: "Royal Satraps"
 royal_satraps_policy_desc: "Appointed satraps oversee provincial affairs, relay royal commands, and secure the revenue needed to maintain the vast kingdom."
 autonomous_city_charters_policy: "Autonomous City Charters"
 autonomous_city_charters_policy_desc: "Cities retain customary privileges and local administration in return for loyalty, taxes, and support for the royal order."
 pa_ptolemaic_grain_law: "Ptolemaic Grain Administration"
 pa_ptolemaic_grain_law_desc: "The Ptolemaic state may centralize the collection and storage of Egypt's harvest or rely more heavily on temple and village storehouses."
 royal_granary_administration_policy: "Royal Granary Administration"
 royal_granary_administration_policy_desc: "Royal officials oversee grain assessments and storehouses, directing Egypt's agricultural surplus toward state revenue and public reserves."
 temple_and_village_storehouses_policy: "Temple and Village Storehouses"
 temple_and_village_storehouses_policy_desc: "Temples and local communities maintain reserves and distribute grain according to established obligations and local needs."
 pa_antigonid_city_law: "Antigonid Cities and Garrisons"
 pa_antigonid_city_law_desc: "The Antigonid rulers can secure their position through royal garrisons or preserve the privileges of the Greek cities."
 royal_garrisons_policy: "Royal Garrisons"
 royal_garrisons_policy_desc: "Garrisons in strategic cities secure royal authority and provide a ready force to protect the kingdom's communications."
 autonomous_poleis_policy: "Autonomous Poleis"
 autonomous_poleis_policy_desc: "Greek cities retain a measure of self-government and civic privilege, encouraging local prosperity while remaining within the royal sphere."
 pa_mauryan_administration_law: "Mauryan Provincial Administration"
 pa_mauryan_administration_law_desc: "The Mauryan Empire may extend the authority of the royal court through inspectors or depend on provincial councils and local elites."
 royal_inspectors_policy: "Royal Inspectors"
 royal_inspectors_policy_desc: "Royal inspectors carry the ruler's commands into the provinces, monitor officials, and help ensure the regular collection of state revenue."
 provincial_councils_policy: "Provincial Councils"
 provincial_councils_policy_desc: "Provincial authorities and local communities participate in administration, sharing responsibility for order and regional prosperity."
 pa_parthian_clan_law: "Parthian Clan Obligations"
 pa_parthian_clan_law_desc: "Parthian rule rests on negotiated bonds between the ruler and powerful clans, whose mounted warriors form the backbone of the host."
 arsacid_clan_council_policy: "Parthian Clan Council"
 arsacid_clan_council_policy_desc: "The ruler consults powerful clans and recognizes their traditional authority in return for loyalty and military service."
 mounted_warrior_host_policy: "Mounted Warrior Host"
 mounted_warrior_host_policy_desc: "Noble households muster mounted warriors for campaigns, preserving the mobility and martial experience of the Parthian host."
 pa_bactrian_frontier_law: "Bactrian Frontier Policy"
 pa_bactrian_frontier_law_desc: "Bactria can strengthen its Hellenistic urban centers or rely on regional satraps and local powers to secure the eastern frontier."
 greek_city_foundations_policy: "Greek City Foundations"
 greek_city_foundations_policy_desc: "The crown supports Greek-style cities as administrative and commercial centers, linking local settlement to the royal state."
 frontier_satraps_policy: "Frontier Satraps"
 frontier_satraps_policy_desc: "Regional governors coordinate the defense of distant territories and maintain ties with the communities of the frontier."
 pa_syracusan_command_law: "Syracusan Military Command"
 pa_syracusan_command_law_desc: "Syracuse may rely on hired forces under its ruler's command or mobilize its own citizens for the defense of the city."
 mercenary_command_policy: "Mercenary Command"
 mercenary_command_policy_desc: "The ruler employs experienced hired soldiers for campaigns, supplementing the forces available from the city's citizen body."
 citizen_defense_policy: "Citizen Defense"
 citizen_defense_policy_desc: "Citizens are called to defend Syracuse and its territory, giving the city a stronger stake in its own security."
 pa_athenian_civic_law: "Athenian Civic Institutions"
 pa_athenian_civic_law_desc: "Athenian government rests on civic assemblies and public service, including the costly naval obligations borne by wealthy citizens."
 demes_and_assembly_policy: "Demes and Assembly"
 demes_and_assembly_policy_desc: "The demes organize civic life and the assembly provides citizens a forum to deliberate on the affairs of Athens."
 trierarchic_service_policy: "Trierarchic Service"
 trierarchic_service_policy_desc: "Wealthy citizens undertake the costly trierarchy, equipping and maintaining warships for the defense of Athens and its maritime interests."
 pa_spartan_civic_law: "Spartan Civic and Military Order"
 pa_spartan_civic_law_desc: "Sparta organizes its citizen body around the agoge, common messes, and the military obligations of its allies."
 agoge_and_common_mess_policy: "Agoge and Common Messes"
 agoge_and_common_mess_policy_desc: "The agoge and syssitia preserve the discipline and collective identity expected of Sparta's citizen-warriors."
 peloponnesian_allies_policy: "Peloponnesian Allies"
 peloponnesian_allies_policy_desc: "Sparta coordinates its military strength through obligations and cooperation with allied communities across the Peloponnese."
 pa_epirote_kingship_law: "Epirote Kingship"
 pa_epirote_kingship_law_desc: "The Epirote monarchy can emphasize the dynastic authority of the Molossian royal house or the shared institutions of the Epirote league."
 molossian_dynastic_authority_policy: "Molossian Dynastic Authority"
 molossian_dynastic_authority_policy_desc: "The royal house grounds its authority in dynastic legitimacy and the traditional support of the Molossian nobility."
 epirote_league_policy: "Epirote League"
 epirote_league_policy_desc: "The Epirote communities share responsibility for the affairs and defense of the kingdom through the institutions of their league."
