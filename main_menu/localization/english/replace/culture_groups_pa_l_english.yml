 nuristani_group: "Nuristani"
 nuristani_group_desc: "Although small, the Nuristani group represents a distinct branch of the Indo-Iranian language families. They are fiercly independent, and Alexander would describe them as a stubbornly resistant group that represented distinct cultural and religious practices."

 indo_aryan_group_desc: "The migration of Indo-Aryan peoples into the Indian subcontinent would forever change the world. The Indo-Aryans form one of the most advanced civilizations of the time, merging with local groups, and centralizing into many kingdoms with many philosophies."
 indus_group: "Arattan"
 indus_group_desc: "Focussed primarily around the North-Western Indo-Aryans, the term Aratta describes the region of the Indus Valley, Lower Indus, the nearby coastline, and the surrounding areas. Unlike their eastern coutnerparts, these areas would be loosely controlled by invading peoples like the Persians, Greeks, Sakans, Parthians, Yuezhi, and many more."
 dardic_group: "Dardic"
 dardic_group_desc: "Living in the mountains, the Dardic peoples speak a highly conservative form of the Indo-Aryan family. Untouched by the developments of the Vedic and Post-Vedic ages, the Dards remain independent and difficult to reach within the valleys of the Himalayas and Hindu-Kush confluence."
 vedic_group: "Aryavartan"
 vedic_group_desc: "The so-called 'Noble Ones,' the Aryavartan people are those Indo-Aryans who settled in the mighty Upper Ganges region. These would be the people and the lands that would give rise to Vedic Hinduism and Brahmanism, the many schools of thought like Jainism, Buddhism, and Ajivikaism, and likely the birthplace of the holy language of Sanskrit."
 pracyan_group: "Pracyan"
 pracyan_group_desc: "Far from the heartlands of Vedic civilization, yet at the same time, perhaps the greatest expression of said civilization, the Pracyans live in the Greater Magadha region. Living in the Lower Gangetic plains, as well as the lower Brahmaputra river, the Pracyans would rise to fame primarily through their large empires, most notably, the Mauryan Empire."
 avanti_group: "Vindhyan"
 avanti_group_desc: "Settling just north of the Vindhya mountains, middle-India is home to many great cities that would serve as the basis for mythos and culture. Principle amongst these groups were the Avanti and their mighty city of Ujjayini, where Ashoka the Great himself would serve as viceroy."
 atavika_group: "Atavican"
 atavika_group_desc: "In the untamed jungles of India lay the Atavican peoples. These peoples would be highly distinct, interacting with Pre-Indo-Aryan groups frequently, and never truly being administered directly. Perhaps the greatest of these groups are the Kalinga, who would form their own Kingdom and rival the mighty Magadhan peoples to their north."
 deccan_group: "Dakshinan"
 deccan_group_desc: "The furthest of the contiguous Aryan groups, the Dakshinan people settled south of the Vindhyas in the extreme environments of the Deccan plateau. Due to proximity and geography, the people quickly developped a unique culture and language that is poorly understood to this day."
 tamraparni_group: "Tambapannan"
 tamraparni_group_desc: "The people of what was then known as Tamraparni form a complex society of pre-Sinhalese Tamils, post-Sinhalese Tamils, pre-Tamil Vedda, and, of course, the Sinhalese themselves. Famous for their spread of the Theravada school of Buddhism, the sublime island would represent the furthest bastion of Indo-Aryan culture during this time."
 pahari_group: "Parvatan"
 pahari_group_desc: "A group united by their differences, the Parvatans live in the Himalaya and Hindu-Kush mountains. Their choice of abode leaves them further isolated to their lowland counterparts, however, they still frequently interact with societies downhill."

 dravidian_group_desc: "An indegenous people of India, the Dravidians form complex societies mainly centerred around the southern parts of India. They are a highly distinct and diverse group, and Dravidian peoples continue to persist all the way from the Indus River Valley to the Maldives."
