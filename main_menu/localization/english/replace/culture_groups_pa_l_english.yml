 greek_group: "Hellenic"
 greek_group_desc: "The Hellenes, pioneers of democracy and philosophy, shaped Western civilization with their enduring cultural and intellectual legacy. From epic poetry to classical architecture, their contributions resonate through millennia."

 #indo_aryan_group_desc: "The descendants of the Indo-European people that invaded the Indian Subcontinent, these people became the dominant population in the northern areas. Their settlement shaped early Vedic culture and laid the base for a myriad of languages and empires." #P:A Removed duplicate key, kept at culture_groups_l_english.yml:421
 #dravidian_group_desc: "Concentrated in the southern third of India, the $dravidian_group$ people are the descendants of the natives of the subcontinent before the $indo_aryan_group$ invasions. While these invaders culture eventually permeated $dravidian_group$'s, they have mantained strong regional identities." #P:A Removed duplicate key, kept at culture_groups_l_english.yml:442
 tibeto_burman_group_desc: "Migrations from the Tibetan plateau during the earlier historic periods brought these peoples to several places, including India. Their development has been unequal, though, with some groups developing advanced and complex socities, while others have remained rather tribal."

