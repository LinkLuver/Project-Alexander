 #Folk African

 muinaisusko_desc: "The traditional beliefs of the $finnish_language$ peoples, it contains a multitude of deities, being the most prevalant one the shy and thunder god Ukko. It also contains veneration of the dead and shamanistic practices, while also sharing some features with other nearby religions."
 yazidism_desc: "Emerging from an $iranian_group$ tradition, it also contains elements from $judaism$, $christian$, and $islam$. It beliefs that the universe was created by God but that he appointed the 'Peacock Angel' Tawûsî Melek to rule over it. Although it contains many influences by other religions, especially in its esoteric practices, its core is rooted in the ancient $iranian_group$ religions."

 #
 nyambe_god_desc: "$nyambe_god$ is the main [gods|e] and Sky Father for many [ShowLanguageName('bantu_language_family')] speaking people."

 #
 water_god_desc: "The $water_god$ represents the strenght and rejuvenation brought by rain and river."
 war_god_desc: "The $war_god$ represents the strenght and creativity brought by conflict, but also its devastation and calamity."
