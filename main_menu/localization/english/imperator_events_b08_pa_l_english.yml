l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b08 (2026-10-05)

 # tribal_politics.txt
 #P:A TODO No EU5 equivalent: Imperator [x.GetOffice.GetName] (the character's office) is written out as the office title (Warchief, Magistrate, ...); the characters are cabinet members in EU5
 tribal_pol.1.t: "Spreading Population"
 tribal_pol.1.desc: "Lately our people have started to move out of [randomized_country_province.GetName], and begun spreading out across our lands. It will be almost impossible to keep our people united if central authority is weak.\n\nIf we wish to keep our tribes as unified as they have been for a while, we will need to take more active measures. Our Magistrate [magistrate_official.GetName] believes our people can be reasoned with, while our Warchief [warchief_official.GetName] recommends a more hands on approach."
 tribal_pol.1.a: "Force will be used to keep our people together."
 tribal_pol.1.b: "We need to convince our people to stay."
 tribal_pol.1.c: "Our people have always been on the move."
 tribal_pol.1.d: "We need to convince our people to stay."
 tribal_pol.2.t: "Gathering Population"
 tribal_pol.2.desc: "Under our stable rule, a lot of people have started to migrate into [randomized_country_province.GetName]. Seeing this increase of population first hand, it is apparent what benefits and what problems it brings with it.\n\nOur official [randomized_official.GetName] has come up with some alternatives, to increase or decrease the sudden population influx. We need to be careful with how we approach the issue, for it will impact the way the people of [randomized_country_province.GetName] sees us."
 tribal_pol.2.a: "A little incentive is all that is needed."
 tribal_pol.2.b: "We will let things progress naturally."
 tribal_pol.2.c: "Our people need to be dispersed, as we have always been."
 STATIC_MODIFIER_NAME_tribal_pol_2_population_efflux: "Population Efflux"
 STATIC_MODIFIER_NAME_tribal_pol_2_population_influx: "Population Influx"
 tribal_pol.3.t: "Centralization Efforts"
 tribal_pol.3.desc: "After seeing our people slowly moving towards the tribal centers of our nation, our official [randomized_official.GetName] has suggested certain measures we can take to increase the unification of our society.\n\nThough [randomized_official.GetHerHis] suggestion seems well-considered it would cost us a noticeable amount of gold, but not taking [randomized_official.GetHerHis] advice would certainly frustrate [randomized_official.GetHerHim]."
 tribal_pol.3.a: "We will make sure [randomized_official.GetHerHis] ideas are realized."
 tribal_pol.3.b: "There is no need to waste our resources on this."
 STATIC_MODIFIER_NAME_focusing_centralization: "Focused Centralization Efforts"
 STATIC_MODIFIER_NAME_focusing_decentralization: "Focused Decentralization Efforts"
 STATIC_MODIFIER_NAME_centralization_efforts: "Centralization Efforts"
 STATIC_MODIFIER_NAME_natural_centralization: "Natural Centralization"
 tribal_pol.4.t: "Religious Festival"
 tribal_pol.4.desc: "A group of peasants led from [randomized_country_province.GetName] by our High Priest [priest_official.GetName] have asked for our support in a local religious festival.\n\nThis would be a good opportunity to celebrate unity among our people and to show how pious we are, despite the notable costs it would bring upon our realm. If we do not follow through with it, our authority on religious matters is sure to diminish, as [priest_official.GetName] seems quite ardent on the matter."
 tribal_pol.4.a: "Our people deserve a grand festival."
 tribal_pol.4.b: "A small sum can be set aside to support them."
 tribal_pol.4.c: "We cannot afford this."
 STATIC_MODIFIER_NAME_gathering_place: "Gathering Place"
 tribal_pol.5.t: "Unruly Tribesmen"
 tribal_pol.5.desc: "With no warfare to focus their efforts, some of our tribesmen have started becoming unruly and they are causing chaos in [randomized_country_province.GetName]. \n\nWarchief [warchief_official.GetName] has suggested dispersing the troublemakers in one way or another, hoping for the trouble to eventually die off if they are not gathered in one place."
 tribal_pol.5.a: "We will have our men disperse the rioters."
 tribal_pol.5.b: "We will have our men disperse the rioters."
 tribal_pol.5.c: "They will probably calm down in time."
 tribal_pol.5.d: "Let us spread out our people, to lessen the chaos."
 STATIC_MODIFIER_NAME_tribal_pol_6_rioters: "Rioting Troublemakers"
 tribal_pol.6.t: "Calm Tribes"
 tribal_pol.6.desc: "The ongoing war has meant that most of our unruly tribesmen are no longer home to cause trouble. Tribal feuds have been put to rest, at least for now, and things are in general more stable than is common.\n\nThis may be a good time to resettle some of our peripheral tribes to the center of our country, where we can keep them under better control, and use them to control older clans."
 tribal_pol.6.a: "Why rock the boat when we can just enjoy the tranquility?"
 tribal_pol.6.b: "Let us work while the iron is hot."
 tribal_pol.7.t: "An Improved Office"
 tribal_pol.7.desc: "Our official [randomized_official.GetName] has asked for more funds for [randomized_official.GetHerHis] office. With a larger fund, [randomized_official.GetSheHe] would be able to do a better job for our nation.\n\nAs one of the key players in the internal politics of the nation, we should seriously consider [randomized_official.GetHerHis] value besides the office, as helping [randomized_official.GetHerHim] out would surely secure [randomized_official.GetHerHis] loyalty."
 tribal_pol.7.a: "Some of our treasury will be set aside to fund this endeavor."
 tribal_pol.7.b: "We will find a way to help [randomized_official.GetHerHim]."
 tribal_pol.7.c: "There is no way we can afford this."
 STATIC_MODIFIER_NAME_improved_office_zeal: "Improved Office"
 STATIC_MODIFIER_NAME_improved_office_charisma: "Improved Office"
 STATIC_MODIFIER_NAME_improved_office_martial: "Improved Office"
 STATIC_MODIFIER_NAME_improved_office_finesse: "Improved Office"
 tribal_pol.8.t: "Religious Guidance"
 tribal_pol.8.desc: "Our High Priest [priest_official.GetName] has asked us for more funding for [priest_official.GetHerHis] religious ceremonies. With a larger budget to gather the materials necessary for a proper ceremony, [priest_official.GetSheHe] argues that we would get a closer relationship to the divine.\n\nSupporting [priest_official.GetHerHis] undertaking would certainly cement [priest_official.GetHerHis] loyalty to the nation, but at the cost of quite a lot of gold. "
 tribal_pol.8.a: "It sounds like a worthwhile venture."
 tribal_pol.8.b: "We cannot afford that."
 tribal_pol.9.t: "Blessing of the Gods"
 tribal_pol.9.desc: "After a long and arduous ceremony, our High Priest [priest_official.GetName] declared [ROOT.GetCountry.GetGovernment.GetRuler.GetName] blessed by the gods. Great blessings like these are only given to a worthy few.\n\nThe divine blessing will surely give us the necessary religious authority we need to convince our people of our importance in the world. With the gods at out side, who can stop us?"
 tribal_pol.9.a: "We will prove ourselves worthy."
 STATIC_MODIFIER_NAME_blessed_ruler: "Blessed Ruler"
 tribal_pol.10.t: "Broken Relations"
 tribal_pol.10.desc: "One of our Clan Chiefs, [disloyal_clan_chief.GetName], has time and again shown [disloyal_clan_chief.GetHerHis] dubious loyalty to our state. If we cannot even trust our own Clan Chiefs to make the right decisions for our nation, who else can we trust?\n\nIt is time to put [disloyal_clan_chief.GetHerHim] back in [disloyal_clan_chief.GetHerHis] place, one way or another. No matter what it will cost, we need to make [disloyal_clan_chief.GetHerHim] loyal to the [ROOT.GetCountry.GetName] once more."
 tribal_pol.10.a: "We will bend [disloyal_clan_chief.GetHerHis] will."
 tribal_pol.10.b: "A little bit of gold has always convinced people."
 tribal_pol.10.c: "[disloyal_clan_chief.GetName] will be brought back to our side."
 tribal_pol.10.d: "And yet it seems we need to prioritize other things."
 tribal_pol.11.t: "Loyal Chief"
 tribal_pol.11.desc: "One of our Clan Chiefs, [loyal_clan_chief.GetName], have proven to be one of our most loyal subjects time and again. We received a message from [loyal_clan_chief.GetHerHim], where [loyal_clan_chief.GetSheHe] offered [loyal_clan_chief.GetHerHis] aid.\n\nThis is a good opportunity to show the rest of [ROOT.GetCountry.GetName] how loyal [loyal_clan_chief.GetSheHe] is, and to benefit from it. If only more could follow [loyal_clan_chief.GetHerHis] example. "
 tribal_pol.11.a: "Military might is always worthwhile."
 tribal_pol.11.b: "A well-known speaker such as [loyal_clan_chief.GetSheHe] will prove invaluable."
 tribal_pol.12.t: "A Matter of Centralization"
 tribal_pol.12.desc: "According to our Magistrate [magistrate_official.GetName], it seems there will be an influx of people moving to our urban centers soon. It seems [magistrate_official.GetSheHe] has come up with some ideas that could help us in the matter. If we so wish, [magistrate_official.GetSheHe] will make sure to put into motions some efforts that will increase or decrease the influx of people."
 tribal_pol.12.a: "A larger influx sounds like it could have certain benefits."
 tribal_pol.12.b: "Our people is a nomadic one, make sure to keep it that way."
 tribal_pol.12.c: "There is not any need to interact with the influx of people."
 tribal_pol.13.t: "Loyal Warchief"
 tribal_pol.13.desc: "Our Warchief [warchief_official.GetName] have spent a noticeable amount of time in [randomized_country_province.GetName] to inspire the local populace and quell unrest in the area.\n\nThe people seem more loyal than ever, and ready to fight for our cause. A true inspiration of devotion to the [ROOT.GetCountry.GetName], and an example to be followed."
 tribal_pol.13.a: "A loyal servant indeed."
 STATIC_MODIFIER_NAME_warchief_improved_province: "Warchief Efforts"
 STATIC_MODIFIER_NAME_warchief_diminished_province: "Tumultuous Province"
 tribal_pol.14.t: "Problems at [randomized_country_province.GetName]"
 tribal_pol.14.desc: "Rumors have it our disloyal Warchief [warchief_official.GetName] has caused issues in [randomized_country_province.GetName]. With some of our loyal men driven out of the area, there will certainly be more issues if we do not settle this discord right now.\n\nWe have to hope none of the other Clan Chiefs or Officials take any inspiration from this little show of betrayal, so we can quell the unrest and restore stability to the [ROOT.GetCountry.GetName]."
 tribal_pol.14.a: "Our troops will put an end to this little dispute."
 tribal_pol.14.b: "We will just wait this chaos out."
 tribal_pol.15.t: "Arbitrary Demands"
 tribal_pol.15.desc: "[arbitrator_official.GetName], our Arbitrator, has sent us a demand for more funding to do [arbitrator_official.GetHerHis] job properly.\n\nThe appeal for more gold seems a bit arbitrary, but we have noticed certain issues when it comes to that office lately. Though it seems a bit outrageous, not sending [arbitrator_official.GetHerHim] the money would probably end up causing issues down the line."
 tribal_pol.15.a: "Hopefully this will be enough."
 tribal_pol.15.b: "[arbitrator_official.GetName] have already received enough for [arbitrator_official.GetHerHis] job."
 STATIC_MODIFIER_NAME_underfunded_arbitrator_office: "Underfunded Arbitrator"
 STATIC_MODIFIER_NAME_funded_arbitrator_office: "Funded Arbitrator"
 tribal_pol.16.t: "Arbitrary Rewards"
 tribal_pol.16.desc: "A message has been sent from our Arbitrator, [arbitrator_official.GetName]. It seems [arbitrator_official.GetSheHe] has found some loopholes to increase our treasury or give us some more authority in civil matters.\n\nThis news is unexpected, but if we manage it correctly, it probably will not affect the state in a negative way. We should keep an eye on our Arbitrator and [arbitrator_official.GetHerHis] arbitrary ways, though."
 tribal_pol.16.a: "Gold is always worth its weight in gold!"
 tribal_pol.16.b: "Civic matters you say?"
 tribal_pol.16.c: "We will refrain from partaking in this corruption."
 tribal_pol.17.t: "Duel of the Chiefs"
 tribal_pol.17.desc: "[ROOT.GetCountry.Custom('pa_imp_tribal_pol_17_duel_reason')]\n\nCertainly a duel to the death would fix the issue, but at the cost of potentially both our Clan Chiefs. A duel of honor would be safer, but they would continue disliking each other even after the duel."
 tribal_pol.17.a: "A duel to the death is the only way to fix this."
 tribal_pol.17.a.custom: "Duels like these always leads to the death of at least one duelist, if not both."
 tribal_pol.17.b: "One for honor should be enough."
 tribal_pol.17.b.custom: "Duels like these usually ends with some cuts and bruises, but occasionally leads to bloodshed."
 tribal_pol.17.c: "We have need for both of you."
 tribal_pol_17_duel_reason_1: "There has existed discord between two of our Clan Chiefs, [clan_chief_duel_victim.GetName] and [clan_chief_duel_perpetrator.GetName], for a long time now. It is unclear what might have made things worse, but the two have decided they can accept each other no longer. "
 tribal_pol_17_duel_reason_2: "[clan_chief_duel_victim.GetName] came across [clan_chief_duel_perpetrator.GetName] with some of the women of [clan_chief_duel_victim.GetHerHis] tribe. Now [clan_chief_duel_victim.GetName] demands an honor to make up for the dishonor."
 tribal_pol_17_duel_reason_3: "For years [clan_chief_duel_victim.GetName] have claimed [clan_chief_duel_perpetrator.GetName] is out to kill [clan_chief_duel_victim.GetHerHim]. Now it has come to a front, as both parties demand a duel to settle this matter. "
 tribal_pol_17_duel_reason_4: "[clan_chief_duel_victim.GetName] has been offended and insulted by [clan_chief_duel_perpetrator.GetName] for a long time now, and it seems to have reached a new height as [clan_chief_duel_victim.GetName] demands a duel to make up for this dishonorable treatment. "
 tribal_pol_17_duel_reason_5: "After another religious ceremony [clan_chief_duel_perpetrator.GetName] didn't take part in, [clan_chief_duel_victim.GetName] has demanded a duel from [clan_chief_duel_perpetrator.GetHerHim], declaring that this blasphemy can be accepted no longer. "
 tribal_pol.18.t: "Bloodied Winner"
 tribal_pol.18.desc: "After a flurry of blows and several wounds on both duelists, finally [clan_chief_duel_winner.GetName] stands as the uncontested winner. In one deadly blow, [clan_chief_duel_winner.GetSheHe] cuts deep into [clan_chief_duel_winner.GetHerHis] opponent's chest. [clan_chief_duel_loser.GetName] falls to the ground in a pool of blood, a couple of haggard final breaths leaving [clan_chief_duel_loser.GetHerHis] lips.\n\nWith the duel behind us, hopefully things will settle down among the [ROOT.GetCountry.GetName], without any more bloodshed."
 tribal_pol.18.a: "As it was meant to be."
 tribal_pol.19.t: "Bloody Draw"
 tribal_pol.19.desc: "The duel between the two flows back and forth, more wounds across their bodies for every bout. After one final round of blows, [clan_chief_duel_loser.GetName] falls to the ground, dead. [clan_chief_duel_winner.GetName] follows [clan_chief_duel_winner.GetHerHis] opponent's example, and fall to the ground as well.\n\nSeveral men run out to the battlefield, but both duelists are clearly dead. Hopefully the bloodshed will end now that both of the contestants have had to pay with their lives to settle this case."
 tribal_pol.19.a: "Unexpected, but the Gods have spoken. Neither cause was just."
 tribal_pol.20.t: "Honorable Winner"
 tribal_pol.20.desc: "The duel finally settle with [clan_chief_duel_winner.GetName] as the uncontested winner of the duel. For a moment, it looks like [clan_chief_duel_winner.GetSheHe] is about to take the kill even though it is a duel of honor, but [clan_chief_duel_winner.GetSheHe] turns around and leaves the dueling grounds.\n\nHopefully the duel will settle the feud between the two Clan Chiefs, and we can all move on past it. A continued dispute between the two would just be disrupting all of the [ROOT.GetCountry.GetName], after all. "
 tribal_pol.20.a: "Dramatic, but necessary."
 tribal_pol.21.t: "Dishonorable Winner"
 tribal_pol.21.desc: "In a dramatic moment, as [clan_chief_duel_loser.GetName] looks about to yield the fight, [clan_chief_duel_winner.GetName] cuts [clan_chief_duel_loser.GetHerHim] down. It was clearly unnecessary, but it leaves [clan_chief_duel_winner.GetName] as the winner of the duel.\n\nWith the feud put behind us, hopefully this will end the bloodshed inside the [ROOT.GetCountry.GetName], and not turn into a point of contention between the two clans in the future. "
 tribal_pol.21.a: "This was meant to be a duel of honor."
 tribal_pol.22.t: "[randomized_country_province.GetName] Land"
 tribal_pol.22.desc: "A dispute between the clans of [clan_chief_one.GetName] and [clan_chief_two.GetName] has arisen as both of them wants certain valuable land in [randomized_country_province.GetName]. Both sides have their claims to the area, and supporting one of them over the other could end up with disloyalty from the spurned clan.\n\nBoth of the Clan Chiefs have offered to support the nation with gifts if they are given the region. [clan_chief_one.GetName] has offered us more troops, while [clan_chief_two.GetName] has offered a donation of gold."
 tribal_pol.22.a: "We will support [clan_chief_one.GetName]."
 tribal_pol.22.b: "[clan_chief_two.GetName] case sounds right."
 tribal_pol.22.c: "They will split the lands between them."
 STATIC_MODIFIER_NAME_clan_martial_support: "Troop Promise"
 STATIC_MODIFIER_NAME_clan_treasury_support: "Treasury Promise"
 tribal_pol.23.t: "Supporting a Clan"
 tribal_pol.23.desc: "[clan_chief_one.GetName] has started to lose prominence among [clan_chief_one.GetHerHis] own clan lately, and have turned to us to ask for help in restoring [clan_chief_one.GetHerHis] prestige. If [clan_chief_one.GetSheHe] does not have the support of [clan_chief_one.GetHerHis] own clan, who would possibly support [clan_chief_one.GetHerHim]?\n\nIn return for helping [clan_chief_one.GetHerHim] out, [clan_chief_one.GetSheHe] has promised us a donation of gold. Not to mention that [clan_chief_one.GetSheHe] would undoubtedly be more loyal and thankful to the state for our help, if we were to give it. "
 tribal_pol.23.a: "We can certainly find the means to help [clan_chief_one.GetHerHim] out."
 tribal_pol.23.b: "No, [clan_chief_one.GetSheHe] is on [clan_chief_one.GetHerHis] own."
 STATIC_MODIFIER_NAME_clan_chief_prominence_great_leader: "Great Leader"
 STATIC_MODIFIER_NAME_clan_chief_prominence_good_leader: "Good Leader"
 STATIC_MODIFIER_NAME_clan_chief_prominence_bad_leader: "Disappointing Leader"
 STATIC_MODIFIER_NAME_clan_chief_prominence_terrible_leader: "Terrible Leader"
 STATIC_MODIFIER_NAME_clan_chief_prominence_great_demagogue: "Great Speaker"
 STATIC_MODIFIER_NAME_clan_chief_prominence_good_demagogue: "Well-Spoken"
 STATIC_MODIFIER_NAME_clan_chief_prominence_bad_demagogue: "Inarticulate"
 STATIC_MODIFIER_NAME_clan_chief_prominence_terrible_demagogue: "Terrible Speaker"
 STATIC_MODIFIER_NAME_clan_chief_prominence_very_reverent: "Reverent Leader"
 STATIC_MODIFIER_NAME_clan_chief_prominence_somewhat_reverent: "Religious Leader"
 STATIC_MODIFIER_NAME_clan_chief_prominence_somewhat_irreverent: "Irreligious Leader"
 STATIC_MODIFIER_NAME_clan_chief_prominence_very_irreverent: "Irreverent Leader"
 tribal_pol.25.t: "Restoring Reputation"
 tribal_pol.25.desc: "[clan_chief_one.GetName] has come to us, to ask us for help in restoring [clan_chief_one.GetHerHis] fame among [clan_chief_one.GetHerHis] clan. It is unclear how [clan_chief_one.GetSheHe] lost their approval in the first place, but we should be able to restore it if we set our resources aside to help [clan_chief_one.GetHerHim].\n\nRestoring [clan_chief_one.GetHerHis] reputation would surely make [clan_chief_one.GetHerHim] more loyal to us as well. But is [clan_chief_one.GetHerHis] loyalty worth the political power [clan_chief_one.GetSheHe] will obtain? "
 tribal_pol.25.a: "Fine, we will aid [clan_chief_one.GetHerHim]."
 tribal_pol.25.b: "No, [clan_chief_one.GetSheHe] has to stand on [clan_chief_one.GetHerHis] own two feet. "
 tribal_pol.26.t: "Tribal Champion"
 tribal_pol.26.desc: "[clan_chief_one.GetName] is an impressive clan chief, known for [clan_chief_one.GetHerHis] battle prowess and strength. After an extraordinary feat of defending [clan_chief_one.GetHerHis] clan from a [ROOT.GetCountry.Custom('pa_imp_get_dangerous_local_beast')], the people around [clan_chief_one.GetName] has demanded to give [clan_chief_one.GetHerHim] the honor of Champion of the [ROOT.GetCountry.GetName].\n\nSurely the clan chief deserves the honor, but [clan_chief_one.GetSheHe] is already a well known figure, and it would give [clan_chief_one.GetHerHim] more leverage politically. "
 tribal_pol.26.a: "How could we refuse?"
 tribal_pol.26.b: "And yet we have no plans of making [clan_chief_one.GetHerHim] one. "
 STATIC_MODIFIER_NAME_clan_chief_prominence_champion: "Tribal Champion"
 dangerous_local_beast_bear: "huge bear"
 dangerous_local_beast_wolves: "pack of wolves"
 dangerous_local_beast_elephant: "massive elephant"
 dangerous_local_beast_hyena: "pack of hyenas"
 tribal_pol.27.t: "Disloyal Clan"
 tribal_pol.27.desc: "The disloyalty of [clan_chief_one.GetName] and [clan_chief_one.GetHerHis] clan has been apparent to everyone for a while. Now they have demanded more independence from the rest of the [ROOT.GetCountry.GetName]. The rest of the nation looks to us, to see how we will respond to this bid for autonomy.\n\nIf we do not nip this betrayal in the bud, it will be impossible to say what the ramifications might be. "
 tribal_pol.27.a: "Let us put an end to this charade."
 tribal_pol.27.b: "Yet we do not have the resources to force their hand."
 tribal_pol.28.t: "Supporting Clan"
 tribal_pol.28.desc: "We are approached by a messenger from the clan of [clan_chief_one.GetName], with a letter from their leader asking if we want to make a mutually beneficial deal. If we agree to [clan_chief_one.GetHerHis] deal, they will make sure to make us more popular among their clan, as we make them more popular among our.\n\nThis can be a great opportunity for us to increase our prominence, at the cost of helping one of our allies. It would cost us a little bit, but it would certainly be worth it. "
 tribal_pol.28.a: "This sounds beneficial for all of us."
 tribal_pol.28.b: "We will need to time to consider this suggestion."
 tribal_pol.29.t: "From One Clan to Another"
 tribal_pol.29.desc: "One of our clan chiefs, [clan_chief_one.GetName], has suggested moving some of the people of clan [clan_chief_two.GetName] to [clan_chief_one.GetHerHis] rule instead. Not only would they be under a new ruler that would be more loyal to us, but [clan_chief_one.GetSheHe] has also promised to maximize the productivity of the people under [clan_chief_one.GetHerHis] rule.\n\n[clan_chief_two.GetName] on the other hand has made no such promises, yet simply moving people out of [clan_chief_two.GetHerHis] clan's lands would be seen as an aggressive action towards [clan_chief_two.GetShortName]. "
 tribal_pol.29.a: "We will start moving them as soon as we can."
 tribal_pol.29.b: "It would be wrong to suggest this."
 tribal_pol.30.t: "Ever-changing Council"
 tribal_pol.30.desc: "[ROOT.GetCountry.Custom('pa_imp_tribal_pol_30_desc')]\n\nAs [clan_chief_one.GetName] has already done a lot of the work necessary to change our council, it simplifies the rest of the process for us. Though the real question lies in if we should listen to [clan_chief_one.GetHerHis] advice or not. "
 tribal_pol.30.a: "We cannot abide danger at our court."
 tribal_pol.30.b: "Bringing our people closer will open new opportunities."
 tribal_pol.30.c: "It does not sound like a feasible solution right now."
 tribal_pol_30_desc_1: "[clan_chief_one.GetName] has supposedly come across a foreign agent at court, and [clan_chief_one.GetSheHe] is heavily advising us to close the court down. Not only would it limit the potential dangerous elements that can approach our esteemed ruler [ROOT.GetCountry.GetGovernment.GetRuler.GetName], but it would also give [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim] the space necessary to make the correct decisions."
 tribal_pol_30_desc_2: "[clan_chief_one.GetName] has made a lot of friends at court these last months, and proven how much of a boon it could be to our rule. By opening our door to a larger audience, there is nothing to limit our rule further."
 tribal_pol.31.t: "Prominent Centralization"
 tribal_pol.31.desc: "[clan_chief_one.GetName] is one of our more prominent Clan Chiefs, and a strong leader of [clan_chief_one.GetHerHis] people. Their loyalty to our central rule has come into question lately, and [clan_chief_two.GetName] has suggested moving some of that clan under our authority.\n\nSuch a move would surely put us at odds with [clan_chief_one.GetName], but secure our own authority at the cost of [clan_chief_one.GetHerHis]."
 tribal_pol.31.a: "All the clans belong to us."
 tribal_pol.31.b: "Moving some of [clan_chief_one.GetHerHis] people is only natural."
 tribal_pol.31.c: "We will let things progress naturally."
 STATIC_MODIFIER_NAME_tribal_movements: "Tribal Movement"
 tribal_pol.32.t: "Prominent Decentralization"
 tribal_pol.32.desc: "Led by [clan_chief_one.GetName] and [clan_chief_two.GetName], a group of chieftains and tribesmen demands more authority in the hands of the chieftains. For a long time, we have pushed for more centralized authority under our leadership, but it has clearly put us at odds with some of the chieftains.\n\nDecentralizing authority leaves us with less control of the peripheral regions, but more loyal chieftains will be able to control the regions for us. Though we have to make sure this is not the start of a power grab inside the [ROOT.GetCountry.GetName]."
 tribal_pol.32.a: "What other choice do we have?"
 tribal_pol.32.b: "The chieftains are simply vying for power, and none will be given to them."
 STATIC_MODIFIER_NAME_decentralizing_realm: "Decentralizing Realm"
 tribal_pol.33.t: "New Challenger Approaching"
 tribal_pol.33.desc: "[clan_chief_one.GetName] has recently become one of the more popular Chiefs of the [ROOT.GetCountry.GetName], and some even argue [clan_chief_one.GetSheHe] would be a better ruler than [ROOT.GetCountry.GetGovernment.GetRuler.GetName].\n\nThis blatant disregard for central authority needs to be put at an end, and cut down if necessary. "
 tribal_pol.33.a: "We do not currently have the resources to deal with this nuisance."
 tribal_pol.33.b: "Let us put a dent into that popularity."
 tribal_pol.33.c: "There is only one way to deal with challengers to our authority."
 tribal_pol.34.t: "Civilized Friends"
 tribal_pol.34.desc: "Some of our tribesmen have left the lands of [ROOT.GetCountry.GetName] lately, traveling and settling down in [randomized_non_tribal_neighbor.GetName]. Though their policies and traditions are different than ours, there must be some benefits as our tribesmen prefer their ways to our own.\n\nWe could spend some of treasury to open up more communication between our two sides, and potentially become more accustomed to their ways and learn more from them."
 tribal_pol.34.a: "We will send them a proposition."
 tribal_pol.34.b: "Their ways are not our ways!"
 STATIC_MODIFIER_NAME_civilized_neighbor: "Civilized Neighbor"
 STATIC_MODIFIER_NAME_tribal_tradition: "Tribal Tradition"
 border_friends: "Border Friends"
 tribal_pol.35.t: "Tribal Proposition"
 tribal_pol.35.desc: "Our tribal neighbor [tribal_proposition_country.GetName] has started investing a lot of their treasury into opening up the borders between our two nations. Hopefully this will prove beneficial for us as well, though their tribesmen are somewhat more unruly than we are used to.\n\nWe should keep [tribal_proposition_country.GetName] in mind, as they can prove good friends in the future as well. Surely only good things can come from this. "
 tribal_pol.35.a: "Let us hope this friendship will be worth it."
 STATIC_MODIFIER_NAME_tribal_influx: "Tribal Influx"
 tribal_pol.36.t: "Foreign Citizens"
 tribal_pol.36.desc: "A group of citizens from [randomized_non_tribal_neighbor.GetName] has appeared in [randomized_country_province.GetName], looking for a place to stay. Why they left [randomized_non_tribal_neighbor.GetName] to come to [ROOT.GetCountry.GetName] is uncertain, but they seem honest in their wishes.\n\nBringing in new citizens from afar would let us easier know how our neighbors and their governmental systems work, and we might be able to learn something from them. Though it seems not everyone wants them to settle down in [ROOT.GetCountry.GetName]."
 tribal_pol.36.a: "A great opportunity, let us welcome them."
 tribal_pol.36.b: "Send them away, we have no need for them."
 tribal_pol.37.t: "Inspirational Neighbor"
 tribal_pol.37.desc: "Our interactions with our neighbor [randomized_non_tribal_neighbor.GetName] has shown us how their bureaucracy and administration work, and in what ways it differ to our own. By introducing some of their customs into our own system, we are certain to be able to centralize authority and have more control over our clan chiefs.\n\nA group opposing these changes are led by [clan_chief_one.GetName] as it seems [clan_chief_one.GetSheHe] and [clan_chief_one.GetHerHis] followers know how it would affect their authority, if the changes were to be brought into [ROOT.GetCountry.GetName]."
 tribal_pol.37.a: "Let us go ahead with these ideas."
 tribal_pol.37.b: "Maybe [clan_chief_one.GetName] is right. "
 tribal_pol.38.t: "Newfound Tribesmen"
 tribal_pol.38.desc: "After certain disagreements internally in [randomized_tribal_neighbor.GetName], a group of tribesmen have left [randomized_tribal_neighbor_province.GetName] and they are looking for a new home in [randomized_country_province.GetName]. Though they are somewhat different to our own people, they would surely integrate into our society quickly enough.\n\nOn the other hand, accepting these exiles from [randomized_tribal_neighbor.GetName] could put us at odds with their old home. The tensions are already running high between the two groups, and we should carefully consider if it is worth it. "
 tribal_pol.38.a: "[ROOT.GetCountry.GetName] is always open to new tribes who wish to join us."
 tribal_pol.38.a.tooltip: "This can put us at odds with [randomized_tribal_neighbor.GetName] "
 tribal_pol.38.b: "We politely decline their request, and send them back to [randomized_tribal_neighbor_province.GetName]."
 tribal_pol.39.t: "Tribe Leaving [randomized_tribal_neighbor_province.GetName] "
 tribal_pol.39.desc: "One of our smaller tribes have left [randomized_tribal_neighbor_province.GetName] and settled down in [randomized_country_province.GetName], a [randomized_country_province.Custom('pa_imp_get_city_type_loc')] of [original_country.GetName]. Not only did the [original_country.GetAdjective]s happily invite in these traitors, but clearly without a thought about the dishonor to our nation.\n\nIf we are going to retaliate against the dishonorable [original_country.GetName], we should do it sooner rather than later. It is the only way to show them how we treat traitors, as well as the ones who accept them into their fold. "
 tribal_pol.39.a: "We will take vengeance upon [original_country.GetName]. "
 tribal_pol.39.b: "And yet we have other things to focus on."
 unfriendly_neighbors: "Unfriendly Neighbors"
 tribal_pol.40.t: "Unfriendly Neighbors"
 tribal_pol.40.desc: "After we accepted their tribesmen into [randomized_country_province.GetName], it seems [randomized_tribal_neighbor.GetName] have declared us an enemy of their nation. As we worried about, they did not care much for us agreeing to take on some of their tribesmen.\n\nWe should make sure to look out for potential hostilities from our neighbors, now that our relationship has soured to this point. Otherwise we might all find ourselves at the wrong end of a pike."
 tribal_pol.40.a: "Let them come."
 lifestyle_event_chains.1.t: "A New Hobby"
 lifestyle_event_chains.1.desc: "Bored by the duties of rulership, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has recently been considering getting a #high new hobby#!. The art of #high minting coins#! has caught [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] attention, and some advisors suggest that [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] #high direct involvement#! in the mints could yield #high significant benefits#! for the long-term stability and prosperity of [ROOT.GetCountry.GetName]. As [ROOT.GetCountry.GetGovernment.GetRuler.GetName] explores this newfound interest, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] thoughts turn to summoning a #high master minter#! to teach [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] about the craft. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] must now decide whether to personally #high take charge#! of the mints or to maintain the #high status quo#!."
 lifestyle_event_chains.1.a: "I shall take charge."
 lifestyle_event_chains.1.b: "The minters know what they are doing."
 lifestyle_event_chains.2.t: "Master Minter"
 lifestyle_event_chains.2.desc: "Having decided to #high personally oversee the mints#! and learn something about #high metallurgy#! and #high coin making#! [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has spent this last month in gleeful anticipation, waiting for the #high renowned minter, [master_minter.GetName],#! to arrive in [ROOT.GetCountry.GetCapital.GetName]. [master_minter.GetHerHis] #high unparalleled expertise#! in metallurgy and coin minting make [master_minter.GetHerHim] an ideal candidate for [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to #high study under#!. Initially, [master_minter.GetName] was reluctant to stay away from his mint for an extended period. However, [master_minter.GetName] soon changed [master_minter.GetHerHis] tune when [ROOT.GetCountry.GetGovernment.GetRuler.GetName] offered a #high handsome sum#! of precious metals and accommodations in return for [master_minter.GetHerHis] expertise. [master_minter.GetName] claims that with #high practice and patience#!, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] will someday become a #high master minter#! in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own right."
 lifestyle_event_chains.2.a: "Splendid, let's get to it."
 STATIC_MODIFIER_NAME_master_minter_mod: "Master Minter"
 STATIC_MODIFIER_NAME_learning_to_mint: "Learning to Mint Coins"
 lifestyle_event_chains.3.t: "First Solo Attempt"
 lifestyle_event_chains.3.desc: " #high Several months#! have passed since [ROOT.GetCountry.GetGovernment.GetRuler.GetName] welcomed [master_minter.GetName] into [ROOT.GetCountry.GetCapital.GetName] to learn the #high art of minting.#! In that time [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has #high diligently#! studied and practiced under [master_minter.GetHerHis] tutelage. Today, with trembling hands and furrowed brows, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] painstakingly forged [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] very #high first coin#! entirely on [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own. \n\nThe #high result?#! A rather #high misshapen and uneven piece#!, far from the perfection that [master_minter.GetName] effortlessly creates. However, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] couldn't be more #high pleased#! with this development and eagerly looks forward to the day when [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] coins match [master_minter.GetName]'s standard of excellence. The journey toward becoming a master minter continues, one misshapen coin at a time."
 lifestyle_event_chains.3.a: "Progress is progress."
#P:A TODO Unused: tooltips of pa_imp_add_focus_experience / pa_imp_add_focus_perk, which are empty in EU5 (Indomita focus tree)
 add_10_focus_xp: "[THIS.GetName] gains #G 10#! Character Focus Experience."
 add_1_char_perk: "[THIS.GetName] gains #Y 1#! Character Focus Perk."
 add_25_focus_xp: "[THIS.GetName] gains #G 25#! Character Focus Experience."
 add_2_char_perk: "[THIS.GetName] gains #Y 2#! Character Focus Perk."
 add_50_focus_xp: "[THIS.GetName] gains #G 50#! Character Focus Experience."
 lifestyle_event_chains.4.t: "Design Dilemma"
 lifestyle_event_chains.4.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s skills in the art of minting have developed significantly in these last few weeks. The mints of [ROOT.GetCountry.GetCapital.GetName] #high hum with activity#! under [master_minter.GetName]'s guidance, and [ROOT.GetCountry.GetGovernment.GetRuler.GetName] pays as much attention to the rationale behind [master_minter.GetName]'s [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] can. With [ROOT.GetCountry.GetGovernment.GetRuler.GetName] spending more time in the mints now than ever, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is ashamed by the #high plain coins#! being issued under [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] orders. \n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s heart is torn between #high two stellar suggestions#! from [master_minter.GetName]. On one hand, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] could choose to put #high [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] face on the coins#!. These coins would go a long way towards cementing [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s rule, familiarizing [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] face to the common people. On the other hand, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] could opt for a #high prominent state symbol#! that could endure long after [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s own rule comes to an end."
 lifestyle_event_chains.4.a: "My face shall go on the coins."
 lifestyle_event_chains.4.b: "A state symbol would look nicer."
 lifestyle_event_chains.5.t: "Master Minter's Insights"
 lifestyle_event_chains.5.desc: "As [ROOT.GetCountry.GetGovernment.GetRuler.GetName] finalizes the #high new design#! of [ROOT.GetCountry.GetName]'s coinage, [master_minter.GetName] attentively observes [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] sketches and design ideas. The renowned minter, whose craft has been perfected through years of dedication, offers [ROOT.GetCountry.GetGovernment.GetRuler.GetName] some valuable insights. [master_minter.GetName] provides suggestions for refining [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s preliminary design, ensuring that the coins are not only #high works of art#! but also serve to convey [ROOT.GetCountry.GetName]'s strength and legacy. After revision after revision, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s designs #high improve significantly.#! [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] rudimentary drawings are transformed into stunning representations that shall truly capture the heart of [ROOT.GetCountry.GetName]."
 lifestyle_event_chains.5.a: "They are the image of perfection."
 lifestyle_event_chains.6.t: "Material Matters"
 lifestyle_event_chains.6.desc: "With the coin designs now #high refined#! under the guidance of [master_minter.GetName], [ROOT.GetCountry.GetGovernment.GetRuler.GetName] faces yet another crucial decision regarding the new coinage, the #high choice of materials#!. The mints of [ROOT.GetCountry.GetCapital.GetName] are ready to begin production, but what metal shall be used for these coins? \n\n[master_minter.GetName] offers #high three distinct suggestions#!, but does not express his preference, trusting in the decision of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]: \n#Y Copper:#! A durable and practical choice. Casting the coins in copper would certainly be a #high pragmatic choice#!. They would be suitable for everyday use, but will oxidize into an unseemly hue. \n#Y Silver:#! A more prestigious option. Forging coins of pure silver would be less practical for everyday transactions, but they would certainly cast an image of #high prosperity and opulence#!. \n#Y Gold:#! The most #high luxurious choice#!. Gold coins would make a strong statement about the wealth and power of [ROOT.GetCountry.GetName], but the odds of anyone outside of the #high Nobility#! ever getting a chance to use them would be rather slim."
 lifestyle_event_chains.6.a: "Copper"
 lifestyle_event_chains.6.b: "Silver"
 lifestyle_event_chains.6.c: "Gold"
 lifestyle_event_chains.7.t: "Minter's Praise"
 lifestyle_event_chains.7.desc: "As [ROOT.GetCountry.GetGovernment.GetRuler.GetName] continues to dedicate time and effort to mastering the mint, [master_minter.GetName] observes [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] progress with admiration. [master_minter.GetHerHis] trained eye recognizes the #high growing skill and precision#! in [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s coin-making technique. Impressed by [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s commitment to mastering this craft, [master_minter.GetName] offers [ROOT.GetCountry.GetGovernment.GetRuler.GetName] sincere congratulations on [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] achievements. \n\nOverwhelmed by the praise and feeling an uncontainable giddiness, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] decides to share [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] achievement with the people. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has a batch of #high freshly minted coins#! brought to [ROOT.GetCountry.GetCapital.GetName]'s streets and begins distributing them as party favors. #high Residents#! of [ROOT.GetCountry.GetCapital.GetName] are #high astonished and delighted#! by this unexpected act, and the atmosphere in the city becomes lively and jubilant as they receive coins with [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s own design, bearing [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own #high regnal face#!."
 lifestyle_event_chains.7.a: "The design really is so artfully done."
 STATIC_MODIFIER_NAME_good_minter_mod: "Good Minter"
 lifestyle_event_chains.8.t: "Gifts of Prosperity"
 lifestyle_event_chains.8.desc: "As [ROOT.GetCountry.GetGovernment.GetRuler.GetName] continues to dedicate time and effort to mastering the mint, [master_minter.GetName] observes [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] progress with admiration. [master_minter.GetHerHis] trained eye recognizes the #high growing skill and precision#! in [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s coin-making technique. Impressed by [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s commitment to mastering this craft for the first time, [master_minter.GetName] offers [ROOT.GetCountry.GetGovernment.GetRuler.GetName] sincere congratulations on [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] achievements so far, calling [ROOT.GetCountry.GetGovernment.GetRuler.GetName] 'a good minter.' \n\nOverwhelmed by the praise and feeling an uncontainable giddiness, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] decides to share [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] achievement with the people. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has a batch of #high freshly minted coins#! brought to [ROOT.GetCountry.GetCapital.GetName]'s streets and begins distributing them as party favors. #high Residents#! of [ROOT.GetCountry.GetCapital.GetName] are #high astonished and delighted#! by this unexpected act, and the atmosphere in the city becomes lively and jubilant as they receive coins with [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s own design, bearing a #high state seal#!."
 lifestyle_event_chains.8.a: "Coins for all!"
 lifestyle_event_chains.9.t: "Master of the Mint"
 lifestyle_event_chains.9.desc: "Ever since [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s decision to mint silver coins bearing [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own image, the mints of [ROOT.GetCountry.GetCapital.GetName] have been working tirelessly. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has spent countless hours in the mint, working alongside [master_minter.GetName], fine-tuning the designs and ensuring the quality of each coin. It's been a challenging journey, but [master_minter.GetName] recognizes [ROOT.GetCountry.GetGovernment.GetRuler.GetName] as a true peer in the art of coin minting. The people of [ROOT.GetCountry.GetName] have eagerly welcomed the new coins into circulation, marveling at the image of their ruler engraved on each one. These new coins bearing [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] image are cherished across [ROOT.GetCountry.GetName], creating a feeling of connection between the governed and the governor. The mints will continue to produce these splendid coins for years to come, leaving a lasting reminder of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s prowess in metallurgy and coin making."
 lifestyle_event_chains.9.a: "Having hobbies pays off."
 lifestyle_event_chains.10.t: "The Sacred Mint"
 lifestyle_event_chains.10.desc: "Choosing to place an image sacred to the people of [ROOT.GetCountry.GetName] on newly minted silver coins rather than [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own face was a respectable choice. Ever since, the mints of [ROOT.GetCountry.GetCapital.GetName] have been diligently working to bring [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s vision to life. In this time, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has spent many hours in the mint, working alongside [master_minter.GetName], fine-tuning the designs and ensuring the quality of some coins. While this process may not have transformed [ROOT.GetCountry.GetGovernment.GetRuler.GetName] into a master minter, [master_minter.GetName] acknowledges [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim] as a skilled artisan. Together, they have perfected the sacred designs, ensuring the coins are not just tokens of value but also objects of reverence. While [ROOT.GetCountry.GetGovernment.GetRuler.GetName] may not get an ego boost from having [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own face on the coins, [ROOT.GetCountry.GetName] reveres [ROOT.GetCountry.GetGovernment.GetRuler.GetName] for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] dedication to preserving the nation's values."
 lifestyle_event_chains.10.a: "These silver coins shall be shining symbols of the faith."
 lifestyle_event_chains.11.t: "Golden Emissary"
 lifestyle_event_chains.11.desc: "Ever since [ROOT.GetCountry.GetGovernment.GetRuler.GetName] decided to mint coins in gold, the mints of [ROOT.GetCountry.GetCapital.GetName] have been working fervently to craft these exquisite gold coins, each bearing the visage of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has spent countless hours in the mint, working alongside [master_minter.GetName], fine-tuning the designs and ensuring the quality of each coin. It's been a challenging journey, but [master_minter.GetName] recognizes [ROOT.GetCountry.GetGovernment.GetRuler.GetName] as a true peer in the art of coin minting. \n\nTo commemorate the start of a new era of peace and prosperity, [ROOT.GetCountry.GetCapital.GetName] announced that the head of every household would be entitled to revive one free coin if they visited the mint in [ROOT.GetCountry.GetCapital.GetName]. The masses flock to [ROOT.GetCountry.GetCapital.GetName], eager to acquire these golden tokens of their ruler's grace and magnificence. The decision to mint gold coins has elevated [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s popularity to unprecedented heights.The people of [ROOT.GetCountry.GetName] have eagerly welcomed the new coins into circulation, marveling at the image of their ruler engraved on each one. The radiant coins, imbued with [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s own image have quickly become more than mere currency, becoming cherished reminders of their ruler's benevolence."
 lifestyle_event_chains.11.a: "Having hobbies pays off."
 lifestyle_event_chains.12.t: "State Emblem"
 lifestyle_event_chains.12.desc: "When [ROOT.GetCountry.GetGovernment.GetRuler.GetName] chose to mint coins in gold, the mints of [ROOT.GetCountry.GetCapital.GetName] transformed into workshops of splendor, crafting coins that bore a revered state symbol instead of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own image. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has spent countless hours in the mint, working alongside [master_minter.GetName], fine-tuning the designs and ensuring the quality of each coin. It's been a challenging journey, but [master_minter.GetName] recognizes [ROOT.GetCountry.GetGovernment.GetRuler.GetName] as a true peer in the art of coin minting. This decision demonstrated to the people [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s dedication to the state and to upholding its principles. The people of [ROOT.GetCountry.GetName] were deeply moved by this gesture, willing to overlook some of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s previous abuses of power. The mints of [ROOT.GetCountry.GetName] will continue to produce these masterfully crafted golden coins for years to come, leaving a lasting reminder of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s prowess in metallurgy and coin making."
 lifestyle_event_chains.12.a: "[ROOT.GetCountry.GetName] will find splendor in golden symbols."
 lifestyle_event_chains.13.t: "Celestial Inquiry"
 lifestyle_event_chains.13.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], filled with curiosity, has turned [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] gaze heavenward. The night sky has always held a sense of wonder for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis], and now [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is determined to delve into the very mysteries of the stars themselves. Such a grand endeavor, however, is not without its costs, for studying the cosmos requires a considerable investment of resources. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] must now decide whether this celestial exploration is a worthwhile venture."
 lifestyle_event_chains.13.a: "The stars hold secrets worth every coin."
 lifestyle_event_chains.13.b: "My time and money are better spent elsewhere."
 lifestyle_event_chains.14.t: "Celestial Interpretation"
 lifestyle_event_chains.14.desc: "With a newfound focus on the stars, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s studies of the night sky have deepened [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] understanding of the cosmos, and [ROOT.GetCountry.GetGovernment.GetRuler.GetName] sees two distinct paths before [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]self. One path is the scientific pursuit of comprehending the movements of celestial bodies, seeking a greater understanding of the physical world and the laws that govern it. The other path is a more spiritual one, with [ROOT.GetCountry.GetGovernment.GetRuler.GetName] searching for signs and divinity amongst the stars, looking for guidance and higher purpose in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] observations. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] must now decide which aspect of celestial exploration to focus [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] efforts on."
 lifestyle_event_chains.14.a: "The stars hold the secrets of reality."
 lifestyle_event_chains.14.b: "I shall look for signs of the divine."
 STATIC_MODIFIER_NAME_observing_the_stars_mod_movement: "Observing the Movement of Stars"
 STATIC_MODIFIER_NAME_observing_the_stars_mod_divinity: "Observing the Divine in the Stars"
 lifestyle_event_chains.15.t: "Competing Hypotheses"
 lifestyle_event_chains.15.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s exploration of the cosmos has led [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] into the realm of grand cosmic theories. Two contrasting hypotheses have captured [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] attention, each offering a distinct perspective on the arrangement of celestial bodies. The #high first theory#!, championed by [charisma_thinker.GetName], suggests a #Y heliocentric model#!, which radically challenges conventional notions that our world occupies the center of the universe. According to [charisma_thinker.GetName], all of the stars, including the #high Sun#!, remain stationary while the Earth follows the Sun along a circular path. [charisma_thinker.GetName] claims that our world is not unique but merely one among countless others. [charisma_thinker.GetName]'s heliocentric model would certainly explain why our days last as long as they do. [charisma_thinker.GetSheHe] explains that as the Earth orbits the Sun, it experiences the passage of a day and a night, creating a cycle of 24 hours. This model introduces the possibility of a vast and dynamic universe, with the Earth's rotation influencing our daily lives greatly. The #high second theory#!, supported by [finesse_thinker.GetName], is the #Y geocentric model#!. [finesse_thinker.GetSheHe] claims that our world is the immovable epicenter of the universe, while the celestial bodies, including the Sun and stars, orbit around it in intricate patterns. [finesse_thinker.GetName]'s geocentric model offers an intricate web of epicycles and deferents to explain the observed celestial motions, each celestial body following a predefined path in the sky. Both of these systems have their merits, but [ROOT.GetCountry.GetGovernment.GetRuler.GetName] must decide which one shall provide the backbone for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] studies."
 lifestyle_event_chains.15.a: "[charisma_thinker.GetName]'s #high heliocentrism#! seems interesting."
 lifestyle_event_chains.15.b: "[finesse_thinker.GetName]'s #high geocentrism#! is much more reasonable."
 lifestyle_event_chains.16.t: "New Equipment"
 lifestyle_event_chains.16.desc: "As [ROOT.GetCountry.GetGovernment.GetRuler.GetName] delves deeper into the mysteries of the cosmos, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] current instruments have proven inadequate for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] ambitious astronomical studies. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has found that [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] pursuit of knowledge demands more than mere intellectual curiosity but will also require new tools and equipment of remarkable precision and sophistication. [zeal_thinker.GetName] has suggested that with [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] support, [zeal_thinker.GetSheHe] could develop the necessary equipment tailored to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] specific research needs, but warns that it will be a costly and time-consuming endeavor."
 lifestyle_event_chains.16.a: "Cost is no object."
 lifestyle_event_chains.16.b: "The treasury cannot bear such a burden."
 lifestyle_event_chains.17.t: "Between the Stars and the Throne"
 lifestyle_event_chains.17.desc: "The new equipment developed by [zeal_thinker.GetName] for [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s astronomical studies has allowed [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to delve even deeper into the mysteries of the cosmos, revealing the secrets of the night sky. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has learned much about celestial patterns, stars, and the movements of planets, becoming a respected amateur astronomer. However, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] can't help but notice that this passion has grown into something more consuming than [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] initial curiosity. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] now spends an increasing amount of time, perhaps too much, studying the heavens. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] must now decide whether this newfound fascination is worth the time [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] invests, or if [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] should redirect [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] efforts elsewhere."
 lifestyle_event_chains.17.a: "There is still much more to discover."
 lifestyle_event_chains.17.b: "Time to refocus on ruling."
 lifestyle_event_chains.18.t: "Laws of Planetary Motion"
 lifestyle_event_chains.18.desc: "After months dedicated to studying the heavens, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s unwavering dedication has finally borne fruit. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] immersed [ROOT.GetCountry.GetGovernment.GetRuler.GetHerselfHimself] in celestial observations, meticulously tracking the movements of the stars and planets. With tireless nights spent gazing at the skies and poring over volumes of astronomical data, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] began to discern the underlying patterns governing the celestial dance. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] believes that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] has uncovered the timeless secrets that govern the movements of celestial bodies. These revelations allow [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to postulate what [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] calls the #high 'Laws of Planetary Motion':#!\n\n#high The Law of Elliptical Orbits:#! Each planet traces a path through the heavens, a perfect ellipse with the Sun at one of its foci.\n#high The Law of Equal Areas:#! As a planet moves along its elliptical path, the line connecting it to the Sun sweeps out equal areas in equal times.\n#high The Law of Harmonic Time:#! The square of the orbital period of a planet is directly proportional to the cube of the semi-major axis of its elliptical orbit.\nRealizing the significance of these discoveries, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has resolved to spend this next month compiling [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] findings into a comprehensive treatise on celestial mechanics. This knowledge, with its incredible potential applications, could reshape the way that our people understand the cosmos and the movement of celestial bodies."
 lifestyle_event_chains.18.a: "Summon the scribes."
 lifestyle_event_chains.19.t: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s Treatise"
 lifestyle_event_chains.19.desc: "With the comprehensive treatise on celestial mechanics compiled and ready, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] must now decide the fate of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] groundbreaking knowledge. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] can choose to share this newfound knowledge with the world, allowing it to spread far and wide, potentially ushering in a new era of astronomical understanding but could easily lead to mass unrest. However, it may be wiser to keep this knowledge confined to the select group of trusted scribes that helped to compile it, ensuring that it remains a closely guarded secret. Even this would not eliminate the risk that the research would eventually resurface. To ensure that it never does, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] could opt to destroy the research and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] equipment, deeming that the masses are not yet ready for this revolutionary knowledge. "
 lifestyle_event_chains.19.a: "Publish the treatise."
 lifestyle_event_chains.19.b: "Swear the scribes to secrecy."
 lifestyle_event_chains.19.c: "Burn it all..."
 lifestyle_event_chains.20.t: "Consumed by the Cosmic"
 lifestyle_event_chains.20.desc: "Instead of spending [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] nights poring over matters of state, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] now spends [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] them wandering the streets of [ROOT.GetCountry.GetCapital.GetName], gazing at the night sky in search of celestial messages. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] marvels at the cosmos, sketching what [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] eyes behold on paper, trying to decipher hidden meanings in the patterns of stars. It is a pursuit of spiritual significance, but it hasn't gone unnoticed. Some of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s advisors are growing increasingly wary of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] recent eccentric behavior. They wonder if [ROOT.GetCountry.GetGovernment.GetRuler.GetName] should be dedicating [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] time and attention to matters of state, which they see as the [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s primary duty."
 lifestyle_event_chains.20.a: "Nonsense, this is for the good of [ROOT.GetCountry.GetName]."
 lifestyle_event_chains.21.t: "New Equipment"
 lifestyle_event_chains.21.desc: "As [ROOT.GetCountry.GetGovernment.GetRuler.GetName] delves deeper into the mysteries of the cosmos, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] current instruments have proven inadequate for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] ambitious studies. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has found that [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] pursuit of knowledge demands more than mere spiritual openness but will also require new tools and equipment of remarkable precision and sophistication. [zeal_thinker.GetName] has suggested that with [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] support, [zeal_thinker.GetSheHe] could develop the necessary equipment tailored to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] specific research needs, but warns that it will be a costly and time-consuming endeavor."
 lifestyle_event_chains.21.a: "Cost is no object."
 lifestyle_event_chains.21.b: "The treasury cannot bear such a burden."
 lifestyle_event_chains.22.t: "Stellar Sojourn"
 lifestyle_event_chains.22.desc: "The new equipment developed by [zeal_thinker.GetName] for [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s astronomical studies has allowed [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to delve even deeper into the mysteries of the divine hidden away in the night sky. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] increasingly devotes substantial time to studying the heavens, prompting [zeal_thinker.GetName] to suggest that [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s work' might benefit from a change of scenery. [zeal_thinker.GetSheHe] believes that traveling to a more favorable location for stargazing could provide [ROOT.GetCountry.GetGovernment.GetRuler.GetName] with new insights and a better opportunity to find the divine in the celestial realms. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] contemplates how the night sky, with its intricate celestial arrangements, might offer glimpses of the divine's will. This is an enticing prospect, to be sure, but would require [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to leave [ROOT.GetCountry.GetCapital.GetName] for a while."
 lifestyle_event_chains.22.a: "We shall set out at once."
 lifestyle_event_chains.22.b: "Why bother?"
 lifestyle_event_chains.23.t: "Celestial Epiphany"
 lifestyle_event_chains.23.desc: "Although [ROOT.GetCountry.GetGovernment.GetRuler.GetName] frequently ventured beyond the bustling cityscape of [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] had forgotten just how the radiant glow from these urban centers veiled the celestial splendor of the night sky. As the sun fell past the horizon, an awe-inspiring tapestry of celestial wonders began to reveal itself. Constellations that had previously only been visible to [ROOT.GetCountry.GetGovernment.GetRuler.GetName] on arcane star charts, shimmered with heavenly brilliance. In a state of speechless wonder, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] traced the outline of a legendary hero in the air, feeling an inexplicable kinship to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] forefathers who had once gazed upon these very same patterns in the sky. The brilliance of the stars gave them a sense of weight in [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s mind, triggering a moment of celestial clarity. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] felt an unspoken message echoing through the stars. It was as though the cosmos itself yearned to convey some profound truth. The night sky, as seen by [ROOT.GetCountry.GetGovernment.GetRuler.GetName], became a sacred script, a cosmic myth waiting to be deciphered. And in the midst of this celestial revelation, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] couldn't help but wonder if the stars held the key to a deeper understanding of the divine and their relation to humanity."
 lifestyle_event_chains.23.a: "Yes, the stars hold the key, but where is the lock?"
 lifestyle_event_chains.23.b: "Such talk can lead to madness."
 lifestyle_event_chains.24.t: "A Risky Pursuit"
 lifestyle_event_chains.24.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] stood at a crossroads. The celestial mysteries beckoned, promising deeper insights into the nature of existence and the divine. However, these pursuits were not without risks. Many who delved too deeply into the mysteries of the cosmos had been known to descend into madness. As [ROOT.GetCountry.GetGovernment.GetRuler.GetName] contemplated the possibilities, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] advisors expressed their concerns. Some were worried that this relentless quest for celestial knowledge might overshadow [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s duties to [ROOT.GetCountry.GetName] and its people. The allure of communion with the divine felt tantalizingly close to [ROOT.GetCountry.GetGovernment.GetRuler.GetName], like a whisper in the dark, promising revelations that could redefine the very essence of existence. However, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] remains acutely aware of the dangers that lay in the pursuit of these mysteries. It feels as though this path offers no hope of return; once ventured, there might be no way back from the brink of obscurity and madness."
 lifestyle_event_chains.24.a: "I am so close."
 lifestyle_event_chains.24.b: "There are some things that men are not meant to know."
 lifestyle_event_chains.25.t: "Otherworldly Awareness"
 lifestyle_event_chains.25.desc: "In the wake of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s decision to continue [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] quest for celestial knowledge, those who interact with [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim] have noted a perplexing shift in [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s demeanor, as if [ROOT.GetCountry.GetGovernment.GetRuler.GetName] had glimpsed something beyond human comprehension. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] walks the streets of [ROOT.GetCountry.GetCapital.GetName]with an air of otherworldly awareness, and those fortunate, or perhaps unfortunate, enough to encounter [ROOT.GetCountry.GetGovernment.GetRuler.GetName] have found themselves on the receiving end of cryptic advice that hinted at profound truths. \n[ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s guards speak of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s peculiar behavior and some whispered that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] had become touched by the very mysteries of the heavens [ROOT.GetCountry.GetGovernment.GetRuler.GetName] had sought to unveil. On especially dark nights, when the moon hides its face, and the stars shine with unparalleled brilliance, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] can be found outside, gazing into the cosmic abyss and whispering to the stars."
 lifestyle_event_chains.25.a: "Yes, I do feel rather wiser."
 lifestyle_event_chains.26.t: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s Dilemma"
 lifestyle_event_chains.26.desc: "After his communion with the stars and perhaps some greater entity, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has amassed insights and revelations that transcended ordinary human understanding, and [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] feels an overwhelming compulsion to share this newfound knowledge with the world. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] desires to do so by compiling [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] revelations into a codex known simply as 'Meditations of [ROOT.GetCountry.GetGovernment.GetRuler.GetName].' It's a noble aspiration, one that could position [ROOT.GetCountry.GetGovernment.GetRuler.GetName] as a beacon of erudition and wisdom, potentially guiding countless others toward cosmic truths. However, amid the fervor of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s cosmic revelation, there lingers a subtle whisper from the stars, a faint echo of the entity [ROOT.GetCountry.GetGovernment.GetRuler.GetName] communed with. The stars themselves seem to yearn for secrecy, guarding their enigmatic insights from the prying eyes of the world. In the recesses of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s mind, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] recalls their inscrutable wishes and the cryptic messages of the cosmos. In the wrong hands, this knowledge could be misinterpreted, misused, or weaponized to bring about chaos. Choosing to withhold this celestial wisdom, in deference to the stars' enigmatic wishes, will certainly lead to speculation about [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s true motives and intensify the sense of mystery surrounding [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]. Should [ROOT.GetCountry.GetGovernment.GetRuler.GetName] choose the path of illumination, the people of [ROOT.GetCountry.GetName] will come to revere [ROOT.GetCountry.GetGovernment.GetRuler.GetName] as a mystic, wiseman, and a guide to truth. Alternatively, heeding the call of the stars and protecting their whispered secrets would intensify the sense of ethereal mystic surrounding [ROOT.GetCountry.GetGovernment.GetRuler.GetName], but cloak [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] future actions in a shroud of humility and piety."
 lifestyle_event_chains.26.a: "The world must know."
 lifestyle_event_chains.26.b: "All right then, I'll keep your secrets."
 lifestyle_event_chains.27.t: "An Exquisite Necklace"
 lifestyle_event_chains.27.desc: "As [ROOT.GetCountry.GetGovernment.GetRuler.GetName] strolls through the bustling markets of [ROOT.GetCountry.GetCapital.GetName], a merchant approaches, bearing a luxurious necklace crafted from a strang metal and adorned with exquisite jewels. The craftsmanship is unparalleled, nothing like it has ever been seen in [ROOT.GetCountry.GetCapital.GetName]. The merchant, bowing respectfully, presents the necklace to [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and explains its origins. 'Your [ROOT.GetCountry.GetGovernment.GetRulerTitle], I have poured my heart into creating this masterpiece. It is fashioned from the finest materials and adorned with precious jewels from distant lands. Such a regal piece naturally belongs in the hands of a ruler of your stature or perhaps for your spouse?'\n\n[pa_spouse.GetName] has been a little testy lately, perhaps this could serve as a symbol of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s affection."
 lifestyle_event_chains.27.a: "[pa_spouse.GetName] must have this necklace!"
 lifestyle_event_chains.27.b: "I'd rather not waste the gold."
 STATIC_MODIFIER_NAME_caring_partner: "Caring Partner"
 lifestyle_event_chains.28.t: "The Stolen Necklace"
 lifestyle_event_chains.28.desc: "About a month has passed since [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] acquired the luxurious necklace for [pa_spouse.GetName]. [pa_spouse.GetShortName] cheriched the gift dearly and is rarely seen without it. However, after [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [pa_spouse.GetShortName] returned from a lavish banquet, the unthinkable occurs - the necklace is stolen from [pa_spouse.GetName]'s neck by a hooded bandit, leaving a void where once sparkled the symbol of their love. [pa_spouse.GetShortName] is overcome with grief and anger, screaming bloody vengeance upon the thief and demands an immediate investigation to apprehend the culprit."
 lifestyle_event_chains.28.a: "Order a thorough investigation!"
 lifestyle_event_chains.28.b: "We have more pressing matters to attend to."
 lifestyle_event_chains.29.t: "No Clues"
 lifestyle_event_chains.29.desc: "Despite tireless efforts, the investigation into the stolen necklace has yielded no significant progress. The palace guards, however, remain vigilant and unwavering in their commitment to solving the mystery. [guard_of_ruler.GetName], leading the investigation, approaches [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] with a solemn report. 'Your [ROOT.GetCountry.GetGovernment.GetRulerTitle], we have scoured every corner, interviewed countless witnesses, and examined every lead available to us. Yet, the identity of the thief remains elusive. Still, we do not despair. Our resolve is unbroken, and we remain hopeful that a breakthrough will occur. The citizens and the guard alike are invested in this quest for justice, and we pledge to continue our efforts until the culprit is brought to justice.'"
 lifestyle_event_chains.29.a: "Very well."
 lifestyle_event_chains.30.t: "Caught-Redheaded"
 lifestyle_event_chains.30.desc: "A commotion stirs in the palace as accusations of theft echo through the corridors. A slave, wide-eyed with fear, approaches the [guard_of_ruler.GetName], claiming to have witnessed another slave, apparently called [servant.GetName] stealing coins from [pa_spouse.GetShortName]'s purse. Rather annoyingly, [guard_of_ruler.GetName] just caught [cooks_wife.GetName], the wife of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s personal cook stealing food from the kitchen. [guard_of_ruler.GetName] reasons that one of these two servants must have stolen [pa_spouse.GetShortName]'s necklace.\n\n The guards swiftly investigate the matter, and both vehemently deny any wrongdoing."
 lifestyle_event_chains.30.a: "Arrest [servant.GetName]."
 lifestyle_event_chains.30.b: "Arrest [cooks_wife.GetName]."
 lifestyle_event_chains.31.t: "Caught-Redheaded"
 lifestyle_event_chains.31.desc: "A commotion stirs in the palace as accusations of theft echo through the corridors. A slave, wide-eyed with fear, approaches the [guard_of_ruler.GetName], claiming to have witnessed another slave, apparently called [servant.GetName] stealing coins from [pa_spouse.GetShortName]'s purse. Rather annoyingly, [guard_of_ruler.GetName] just caught [cooks_wife.GetName], the wife of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s personal cook stealing food from the kitchen. [guard_of_ruler.GetName] reasons that one of these two servants must have stolen [pa_spouse.GetShortName]'s necklace.\n\n The guards swiftly investigate the matter, and both vehemently deny any wrongdoing."
 lifestyle_event_chains.31.a: "Arrest [servant.GetName]."
 lifestyle_event_chains.31.b: "Arrest [cooks_wife.GetName]."
 lifestyle_event_chains.32.t: "Confession in the Wine Cellar"
 lifestyle_event_chains.32.desc: "After enduring over a month of imprisonment in the dim confines of the palace wine cellar, the slave accused of robbing [pa_spouse.GetShortName], finally breaks their silence. Appearing weary and desperate, the wretch confesses to stealing the necklace that has haunted the palace with turmoil. The details spill out in a rush as he reveals the location of [pa_spouse.GetShortName]'s stolen necklace. 'I took it, Your [ROOT.GetCountry.GetGovernment.GetRulerTitle],' he admits, 'I hid it in a small compartment beneath the floorboards of my quarters. Please, spare me further punishment, and let me bring it to you.'"
 lifestyle_event_chains.32.a: "[pa_spouse.GetShortName] will be pleased."
 lifestyle_event_chains.33.t: "Wrongful Imprisonment"
 lifestyle_event_chains.33.desc: "After enduring over a month of imprisonment in the dim confines of the palace wine cellar, the wife of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s personal cook accused of robbing [pa_spouse.GetShortName] still vehemently denies committing any wrong doing. The initial investigation that led to her imprisonment now appears flawed. [guard_of_ruler.GetName], after reviewing the evidence once more, comes to a troubling conclusion: the wrong person was arrested."
 lifestyle_event_chains.33.a: "Ah, that's rather unfortunate."
 lifestyle_event_chains.34.t: "Wrongful Imprisonment"
 lifestyle_event_chains.34.desc: "After enduring over a month of imprisonment in the dim confines of the palace wine cellar, the slave accused of robbing [pa_spouse.GetShortName] still vehemently denied committing any wrong doing. The initial investigation that led to his imprisonment now appears flawed. [guard_of_ruler.GetName], after reviewing the evidence once more, comes to a troubling conclusion: the wrong person was arrested."
 lifestyle_event_chains.34.a: "Ah, that's rather unfortunate."
 lifestyle_event_chains.35.t: "Confession in the Wine Cellar"
 lifestyle_event_chains.35.desc: "After enduring over a month of imprisonment in the dim confines of the palace wine cellar, the wife of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s personal cook accused of robbing [pa_spouse.GetShortName], finally breaks their silence. Appearing weary and desperate, the wretch confesses to stealing the necklace that has haunted the palace with turmoil. The details spill out in a rush as she reveals the location of [pa_spouse.GetShortName]'s stolen necklace. 'I took it, Your [ROOT.GetCountry.GetGovernment.GetRulerTitle],' she admits, 'I hid it in a small compartment beneath the floorboards of my quarters. Please, spare me further punishment, and let me bring it to you.'"
 lifestyle_event_chains.35.a: "[pa_spouse.GetShortName] will be pleased."
 lifestyle_event_chains.36.t: "Ancient Treasure"
 lifestyle_event_chains.36.desc: "A rumor has spread through the streets of [ROOT.GetCountry.GetCapital.GetName], carried on the whispers of eager locals and curious visitors alike. Apparently an old fisherman stumbled upon a long forgotten cave while seeking shelter from a storm. Illuminated only by the feeble light of his torch, he claimed to have glimpsed the glint of precious metals and the sparkle of gemstones hidden within the shadows. Supposedly these invaluable goods were overflowing from a stone chest lying just out of reach."
 lifestyle_event_chains.36.a: "We shall send someone to investigate the matter."
 lifestyle_event_chains.36.b: "I will find this treasure; I just need to train first."
 lifestyle_event_chains.36.c: "What use is a fisherman's tale?"
 lifestyle_event_chains.37.t: "Ancient Treasure: Trainer"
 lifestyle_event_chains.37.desc: "After hearing the rumors of a vast treasure horde lying just outside of [ROOT.GetCountry.GetCapital.GetName], a fervor for martial excellence has seized [ROOT.GetCountry.GetGovernment.GetRuler.GetName], desiring to cast aside their #high frailty#! in preparation for retrieving the lost treasure [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] decided to embark on an intensive training regimen, but must now decide whether to train under [finesse_thinker.GetName], whose fitness is unquestioned, or under [martial_thinker.GetName], widely regarded as one of the greatest warriors of [martial_thinker.GetHisHer] generation."
 lifestyle_event_chains.37.a: "I'll train with [finesse_thinker.GetName]."
 lifestyle_event_chains.37.b: "[martial_thinker.GetName], is the right [martial_thinker.GetWomanMan] for the job."
 lifestyle_event_chains.38.t: "Ancient Treasure: Training"
 lifestyle_event_chains.38.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has embarked on an intensive training regimen under the guidance of [finesse_thinker.GetName]. Every morning, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] can be found on the training grounds, clad in armor and wielding weapons with unwavering determination. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is almost ready to pursue the fisherman's rumor and seize the hidden cave's treasure for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self."
 lifestyle_event_chains.38.a: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has gone from #high frail#! to #high formidable#!."
 lifestyle_event_chains.39.t: "Ancient Treasure: Training"
 lifestyle_event_chains.39.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has embarked on an intensive training regimen under the guidance of [martial_thinker.GetName]. Every morning, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] can be found on the training grounds, clad in armor and wielding weapons with unwavering determination. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is almost ready to pursue the fisherman's rumor and seize the hidden cave's treasure for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self."
 lifestyle_event_chains.39.a: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has gone from #high frail#! to #high formidable#!."
 lifestyle_event_chains.40.t: "Ancient Treasure: Map"
 lifestyle_event_chains.40.desc: "A breathless messenger, clad in dusty garments and bearing an air of urgency, arrives at the court of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]. Clutched tightly in their hand is a weathered parchment, stained with the traces of a journey fraught with peril. As [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] examines the parchment, mention of distinctive landmarks, ancient symbols, and celestial alignments intertwines to form a map of sorts, seeming to guide the way to the hidden entrance of the cave."
 lifestyle_event_chains.40.a: "Soon I will retrieve the treasure!"
 lifestyle_event_chains.40.b: "This seems like a lot of work."
 lifestyle_event_chains.41.t: "Ancient Treasure: Hidden Cave"
 lifestyle_event_chains.41.desc: "Under the protective cloak of the night, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and a small party of aids arrive at the location hinted at by the mysterious clues. The air is thick with anticipation as they stand before the entrance of the fabled cave, shrouded in darkness and foreboding. The mouth of the cave yawns wide, casting an impenetrable shadow that seems to consume the feeble light of their torches. The wind whistles through the rocky crevices, creating an eerie symphony that resonates within the depths of the cavern. The very atmosphere seems to pulse with an otherworldly energy, setting a disquieting tone for the expedition."
 lifestyle_event_chains.41.a: "Into the breach!"
 lifestyle_event_chains.41.b: "No one would blame me for turning back."
 lifestyle_event_chains.42.t: "Ancient Treasure: Yawning Maw"
 lifestyle_event_chains.42.desc: "As [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and the party venture deeper into the cave, the narrow passageways reveal unsettling carvings on the walls. Symbols of unknown origin and cryptic inscriptions suggest a history steeped in mystery, with hints of ancient rituals and forgotten civilizations. The air becomes heavy with a palpable tension, and an unnerving silence descends, broken only by the echoing footsteps of the explorers. Glistening stalactites and stalagmites cast eerie shadows that dance along the cavern walls, playing tricks on the mind. The deeper they go, the more the cave seems to close in around them, its subterranean secrets unfolding like a dark tapestry. Water droplets echo in the distance, creating an ominous rhythm that reverberates through the chamber. As [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] presses on, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] comes upon a vast chamber that seems to extend into the yawning maw of the abyss."
 lifestyle_event_chains.42.a: "We shall venture further still."
 lifestyle_event_chains.42.b: "No one would blame me for turning back."
 lifestyle_event_chains.43.t: "Ancient Treasure: Crossroads"
 lifestyle_event_chains.43.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] servants find themselves standing at a critical juncture within the heart of the mysterious cave. Before them, the passageway splits into two, each tunnel disappearing into the darkness, leaving only a trail of uncertainty and the distant echoes of dripping water.\n\nTo the left, a narrow corridor winds its way deeper into the cave, the shadows playing tricks on the eyes. Faint whispers seem to beckon from that direction, as if promising secrets yet to be unveiled. The air becomes colder, and a subtle, ethereal glow emanates from the depths, offering an eerie allure.\n\nTo the right, the passageway widens, revealing a series of intricate carvings on the walls. Ancient symbols tell tales of forgotten civilizations, and the echoes of distant water suggest the possibility of an underground river or chamber. Yet, the darkness appears more impenetrable, and the foreboding silence seems to linger in the depths."
 lifestyle_event_chains.43.a: "We shall go left."
 lifestyle_event_chains.43.b: "Right is always right."
 lifestyle_event_chains.44.t: "Ancient Treasure: Collapse"
 lifestyle_event_chains.44.desc: "Suddenly, the path takes an unexpected turn, leading [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] servants to an exit bathed in the feeble light of a crescent moon. The explorers emerge into an open cavern, greeted by the cool night air and the soft rustling of the surrounding wilderness. However, their momentary relief is shattered as a deafening roar echoes from the cavern's mouth, reverberating through the subterranean chamber. The ground beneath their feet trembles as rocks and debris cascade down, sealing the entrance they had just passed through. The cave has collapsed, trapping them outside with no means of return. In the chaotic aftermath, a stalactite, shaken loose by the collapsing cavern, plummets from above, grazing [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s thigh, leaving a deep and painful gash. As [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s servants tends to their wounded [ROOT.GetCountry.GetGovernment.GetRulerTitle], the extent of the injury becomes apparent. The wound, while not life-threatening, requires immediate attention."
 lifestyle_event_chains.44.a: "We must return to [ROOT.GetCountry.GetCapital.GetName] at once!"
 lifestyle_event_chains.45.t: "Ancient Treasure: Chest"
 lifestyle_event_chains.45.desc: "Suddenly, the path takes an unexpected turn, leading [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] servants to a vast chamber. In the center of the cavern, bathed in an eerie ambient glow, stands a massive stone chest of imposing proportions. The party approaches cautiously, their torches flickering in the semi-darkness, revealing intricate carvings on the chest's surface depicting scenes of ancient rituals, celestial alignments, and strange creatures."
 lifestyle_event_chains.45.a: "Open the chest."
 lifestyle_event_chains.45.b: "Somethings are better left undisturbed"
 lifestyle_event_chains.46.t: "Ancient Treasure: Trapped"
 lifestyle_event_chains.46.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s servants cautiously pry the lid open, revealing the mysteries concealed within. The chest creaks open, revealing a sudden burst of blinding light that momentarily blinds the onlookers. As their eyes adjust, they behold an extraordinary sight: a treasure trove of artifacts, jewels, and relics that glitter with an otherworldly radiance. However, their momentary awe is shattered as a deafening roar echoes from the cavern's mouth, reverberating through the subterranean chamber. The ground beneath their feet trembles as rocks and debris cascade down, sealing the entrance they had just passed through. The cave has collapsed, trapping them outside with no means of return. In the chaotic aftermath, a stalactite, shaken loose by the collapsing cavern, plummets from above, grazing [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s thigh, leaving a deep and painful gash. As [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s servants tends to their wounded [ROOT.GetCountry.GetGovernment.GetRulerTitle], the extent of the injury becomes apparent. The wound, while not life-threatening, requires immediate attention."
 lifestyle_event_chains.46.a: "We must return to [ROOT.GetCountry.GetCapital.GetName] at once!"
 lifestyle_event_chains.47.t: "Ancient Treasure: Isle of Atlas"
 lifestyle_event_chains.47.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s servants cautiously pry the lid open, revealing the mysteries concealed within. The chest creaks open, revealing a sudden burst of blinding light that momentarily blinds the onlookers. As their eyes adjust, they behold an extraordinary sight: a treasure trove of artifacts, jewels, and relics that glitter with an otherworldly radiance. As [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] marvels at the treasures within the enchanted chest, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] makes a remarkable discovery: an ancient bronze map intricately engraved with mysterious symbols and depictions of an unknown island. The carvings depict an archipelago surrounded by vast oceans, and at its center. While most of the orichalcum is illegible, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] can make out what appears to be the map's title, 'Periplus of the Isle of Atlas.'"
 lifestyle_event_chains.47.a: "Perhaps we could find the land of these Atleans..."
 lifestyle_event_chains.48.t: "Ancient Treasure: Prehistoric Sword"
 lifestyle_event_chains.48.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s servants cautiously pry the lid open, revealing the mysteries concealed within. The chest creaks open, revealing a sudden burst of blinding light that momentarily blinds the onlookers. As their eyes adjust, they behold an extraordinary sight: a treasure trove of artifacts, jewels, and relics that glitter with an otherworldly radiance. As [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] marvels at the treasures within the enchanted chest, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] makes a remarkable discovery: an sword the likes of which no man has seen in millennia. The sword's blade, forged from a lustrous bronze alloy, bears markings that suggest a craftsmanship dating back to a time long before recorded history. Enigmatic symbols etched along the blade hint at forgotten rituals and ancient tales lost to the ages. The remarkable weapon gleams softly in the ambient glow of the chamber, exuding an aura of otherworldly power."
 lifestyle_event_chains.48.a: "This sword will become the symbol of the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] dynasty!"
