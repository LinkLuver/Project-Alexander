l_english:
 social_hierarchy: "Aristocratic Order"
 social_hierarchy_desc: "The leading families hold recognized rank in the realm's civic order. Their standing is reinforced in exchange for service to the ruler and state."
 nobles_land_rights: "Aristocratic Estates"
 nobles_land_rights_desc: "Prominent families hold hereditary estates and may develop their lands, gaining influence in return for supporting the realm."
 noble_serfdom_rights: "Dependent Labor Claims"
 noble_serfdom_rights_desc: "The nobility may claim labor and customary dues from dependent rural communities. These obligations strengthen noble authority while limiting the freedom and resources of commoners."
 primacy_of_nobility_desc: "The leading families are recognized as the realm's foremost political and military estate, and must be consulted on matters of state."
 noble_leaders_only_desc: "Military command is reserved for members of the noble families, excluding other estates from leadership and strengthening aristocratic control of the armed forces."
 nobility_council_desc: "A council of leading families advises the ruler and shares in important decisions, trading political influence for their support of the state."
 noble_patronage_of_the_arts_desc: "Noble households sponsor poets, artists, and scholars, bringing prestige and learning to the court while strengthening the patrons' influence."
 pa_nobles_cavalry_service: "Aristocratic Cavalry Service"
 pa_nobles_cavalry_service_desc: "Noble households provide mounted retainers and lead them in battle, granting the ruler dependable elite cavalry in return for influence and status."
 pa_nobles_ancestral_estates: "Ancestral Estate Rights"
 pa_nobles_ancestral_estates_desc: "The great families retain inherited lands and customary dues. Their estates provide resources for the realm but remain under substantial local control."
 pa_nobles_royal_marriages: "Dynastic Marriage Alliances"
 pa_nobles_royal_marriages_desc: "Marriage alliances bind prominent families to the royal house, strengthening court ties and encouraging cooperation among the realm's leading lineages."
 pa_nobles_frontier_command: "Frontier Command"
 pa_nobles_frontier_command_desc: "Noble families are entrusted with mustering forces and defending vulnerable borders, preserving local military traditions while bolstering the realm's defenses."
 tribune_of_the_plebs: "Tribunes of the Plebs"
 tribune_of_the_plebs_desc: "The tribunes represent Rome's plebeian citizens, defending their rights and carrying their grievances into the republic's public councils."
 peasants_represented_in_parliament: "Common Assembly Representation"
 peasants_represented_in_parliament_desc: "Rural communities gain a voice in the realm's assembly, allowing common people to petition for protection and a hearing in public affairs."
 peasant_owns_their_food: "Household Harvest Rights"
 peasant_owns_their_food_desc: "Cultivators retain a customary share of the crops they raise. This protects household subsistence and gives rural communities a greater stake in their work."
 peasants_fewer_levies: "Limited Levy Service"
 peasants_fewer_levies_desc: "The state limits how often it calls cultivators away from their fields, reducing the risk that military service disrupts sowing and harvest."
 grain_dole: "Public Grain Distribution"
 grain_dole_desc: "The ruler maintains grain stores and distributes food in times of scarcity, supporting the population and helping protect the food supply."
 peasants_protected_faith: "Protection of Ancestral Rites"
 peasants_protected_faith_desc: "Rural communities may retain their inherited rites rather than face forced conversion, preserving local religious customs and easing tensions in a diverse realm."
 pa_peasant_communal_lands: "Common Land Customs"
 pa_peasant_communal_lands_desc: "Villagers retain customary access to shared fields, pasture, and woodland. These common resources support rural livelihoods while limiting the concentration of land in private hands."
 pa_peasant_village_assemblies: "Village Assemblies"
 pa_peasant_village_assemblies_desc: "Village elders and householders settle local matters together and present collective petitions to the ruler's officials, preserving a measure of local self-government."
 pa_peasant_citizen_militia: "Citizen Militia Service"
 pa_peasant_citizen_militia_desc: "Free rural households may train with arms and muster when called, giving the state a broad reserve of defenders while granting commoners a recognized military role."
 pa_peasant_granary_reserves: "Community Granary Reserves"
 pa_peasant_granary_reserves_desc: "Communities set aside grain after the harvest for lean seasons and emergencies, improving food security and helping sustain the population."
 formal_guilds: "Artisan Associations"
 formal_guilds_desc: "Craft workers organize into recognized associations that regulate training and workmanship, supporting skilled production and the growth of towns."
 pa_clergy_temple_endowments: "Temple Endowments"
 pa_clergy_temple_endowments_desc: "Rulers and households dedicate land and offerings to temples, supporting their rites and granting the priesthood a lasting role in public life."
 pa_clergy_sacred_calendar: "Keepers of the Sacred Calendar"
 pa_clergy_sacred_calendar_desc: "Priests observe the heavens, preserve ritual calendars, and maintain written records, lending their learning and authority to the state."
 pa_clergy_sanctuary_rights: "Sanctuary and Oath Rights"
 pa_clergy_sanctuary_rights_desc: "Sacred precincts and sworn rites are recognized as places of refuge and arbitration, giving temples a role in preserving order and settling disputes."
 tribes_clan_councils: "Clan Councils"
 tribes_clan_councils_desc: "Elders and household leaders settle shared concerns through clan councils, helping maintain customary order while preserving local autonomy."
 tribes_warband_obligations: "Warband Obligations"
 tribes_warband_obligations_desc: "Clans muster armed retainers and warriors for the ruler when called, strengthening the realm's forces while preserving kin-based military service."
 tribes_seasonal_pastures: "Seasonal Pasture Rights"
 tribes_seasonal_pastures_desc: "Tribal communities retain access to seasonal grazing grounds and migration routes, sustaining their herds and customary way of life."
 tribal_rgo: "Tribal Resource Rights"
 tribal_rgo_desc: "Tribal communities retain the right to organize the extraction and use of resources on their lands, in keeping with local custom."
 pa_burghers_caravan_networks: "Caravan Networks"
 pa_burghers_caravan_networks_desc: "Merchants coordinate caravans across long-distance routes, sharing information and capacity to move goods between markets."
 pa_burghers_market_charters: "Market Charters"
 pa_burghers_market_charters_desc: "The ruler recognizes regular market days and protects the exchange of goods, encouraging settlement growth and steady commerce."
 pa_burghers_coinage_standards: "Coinage and Weights Standards"
 pa_burghers_coinage_standards_desc: "Merchants and moneyers help maintain reliable measures and consistent coinage, improving confidence in trade and public revenues."
