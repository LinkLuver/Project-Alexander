 food_events.16.t: "Stockpile Disappears"
 food_events.16.desc: "It has come to our attention that a substantial amount of the state food stockpiles of [fe_city.GetProvince.GetName] have seemingly disappeared overnight.\n\nThe whereabouts of the supplies are still debated - some claim a group of assertive [ROOT.GetCountry.Custom('pa_imp_get_random_culture')] merchants swindled an incompetent clerk, others that a vengeful god spirited them away in anger - in any case the reserves are severely diminished."
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen]); EU5 provinces have no governors (the option is disabled)
 food_events.16.a: "The governor is responsible."
 food_events.16.b: "We will just have to buy it back..."
 food_events.16.c: "Heads will roll."
 food_events.16.d: "They can always grow more."
 food_events.17.t: "Charitable Contributions"
 food_events.17.desc: "Our officials in [fe_city.GetProvince.GetName] report that they have been approached by some of the petty landowners of the area with donations of grain and other fare for the use of the state.\n\nWhether they were unable to sell it themselves or are just model citizens, extra grain is always useful - though it has not yet been satisfactorily decided how the windfall should be deployed."
 food_events.17.a: "Let the state granaries of [fe_city.GetProvince.GetName] keep it."
 food_events.17.b: "[fe_gift_city.GetProvince.GetName] shall have it."
 food_events.17.c: "The poor like bread don't they?"
 food_events.17.d: "It is a gift for the [ROOT.GetCountry.GetAdjective] people."

 # distinctions.txt
 distinction.1.t: "Spectacular Ambush"
 distinction.1.desc: "A triumphant day has come for [actor.GetName], having maneuvered in the rough terrain for days to trick the enemy [target.GetCountry.GetName] into a false sense of security. As the armies clashed they thought they had it all under control until our hidden forces suddenly appeared, taking the enemy completely by surprise. The [actor.GetName] is taking a lot of pride in such a crushing victory, and will be looking at making this a regular fighting doctrine."
 distinction.1.a: "A fantastic show of tactics!"
 distinction.2.t: "Exemplary Use Of Terrain"
 distinction.2.desc: "Ever since the heroic stand at Thermopylae, it has been well known that numbers can be leveraged very well against superior numbers in a closed environment. With that in mind, the [actor.GetName] have shown great innovation with their latest victory, where they lured the enemy into thinking they were choosing the battleground. In reality they fell for a well planned trap, where they ended up surrounded with nowhere to run."
 distinction.2.a: "Good planning has paid off."
 distinction.3.t: "[actor.GetName] Stands Tall"
 distinction.3.desc: "Having fought a glorious victory on the open fields, the [actor.GetName] has shown prowess that would have impressed Alexandros himself. The organized center of the army kept on pushing the enemy back mercilessly while the flanks kept them occupied. Taking full advantage of this experience of this will see them strike fear into the heart of any enemy foolish enough to face them in similar terrain."
 distinction.3.a: "A brilliant battle to be sure."
 distinction.4.t: "Scorching Victory"
 distinction.4.desc: "The harsh sun is something most fear, but some learn and adapt to it. For days [actor.GetName] hounded the enemy, keeping them from being able to access the oases, their supply of water kept going down. In the end, what they faced on the field was a dehydrated, weakened force that was easily defeated. With this [actor.GetName] has found the hidden advantages of the desert and made them part of their own arsenal of weapons, to be deployed against any enemy who would dare to enter their domain."
 distinction.4.a: "I almost feel sad for the enemy."
 distinction.6.t: "Practice Makes Perfect"
 #P:A TODO No EU5 equivalent: adiutrix_legion was an Imperator legion scope; EU5 has no legions (the event is disabled)
 distinction.6.desc: "Experience is the teacher of all things. The [adiutrix_legion.GetName] has shown rare alacrity, throwing themselves into the arms of [ROOT.GetCountry.Custom('pa_imp_get_war_god')] with gusto. Their enthusiasm in practice and battles alike prove the key to success is to pass knowledge and experience on to the young instead of having them learning the hard way. Fighting side by side, with full trust in the man next to you, as an effective, cohesive combat unit, strikes fear into their foe's hearts."
 distinction.6.a: "The enemy will dread these men."
 distinction.7.t: "The First Legion"
 #P:A TODO No EU5 equivalent: primagena_legion was an Imperator legion scope; EU5 has no legions (the event is disabled)
 distinction.7.desc: "It is a large step for a nation to show it has the resources to keep a standing army. As we have formed [primagena_legion.GetName], we now stand as a nation above others! Our glorious nation enters a new era of professional soldiers that will show no mercy to our enemies. Additionally, they will be able to forge a legacy of their own, and bravery or lack thereof shall determine its character."
 distinction.7.a: "A new era has begun."
 distinction.8.t: "A Great Cavalry Victory"
 distinction.8.desc: "Today is a day of triumph as we have driven our enemy before us and heard the lamentation of those overrun. [actor.GetName] has brought glory to itself and our nation by upholding the high standards of cavalry set by the hetairoi of Alexandros. The key to victory, today just as back then, was an exemplary use of hammer and anvil tactics, where the enemy was locked down by our own frontlines as the cavalry flanked and then slammed into their back, killing many and breaking the spirit of the rest."
 distinction.8.a: "One would not want to stand in front of their charge."
 distinction.9.t: "[pa_commander.GetShortName]'s Great Victory"
 distinction.9.desc: "Our future magnificent leader, [pa_commander.GetShortName], has brought a triumphant victory at the head of the [actor.GetName]. As told in the reports the victory was secured as the heir [pa_commander.GetHerselfHimself] led a daring charge at the strong point of the enemy. Tales of this battle will be told for generations, and any man who has served will never have a dry cup. An event such as this will also be marked in the annals of history related to [actor.GetName], making it a mark of glory to get even to serve in it. "
 distinction.9.a: "[ROOT.GetCountry.GetGovernment.GetHeir.GetShortName] has brought glory to us all."
 distinction.10.t: "Engineered Outcome"
 #P:A TODO No EU5 equivalent: legion_poliorcetes was an Imperator legion scope; EU5 has no legions (the event is disabled)
 distinction.10.desc: "The enemy thought themselves safe behind their walls, but the experienced engineers of [legion_poliorcetes.GetName] have shown this was false - they were not an obstacle for long. No fortress is stronger than its weakest point, and a good engineer will find it and take advantage of it in no time. As the sappers dug underneath the walls, weakening them, the army at large kept the enemy in the dark with feigned attacks. Without the engineers we would have lost many more lives, and more importantly, time."
 distinction.10.a: "Nothing stands up to a sharp mind."
 distinction.11.t: "Sacking For The Gods"
 #P:A TODO No EU5 equivalent: pious_legion was the Imperator unit that desecrated a holy site; EU5 has no such unit ability (the event is disabled)
 distinction.11.desc: "The gods look favorably upon [pious_legion.GetName], who have sacked the site of a god not worthy of being mentioned. The holy men and women tried their best to stop our soldiers, but against an army there was little they could do to resist. Had their god been as powerful as they claimed, they surely would have been able to put up some resistance to protect their holy site."
 distinction.11.a: "This surely will show our dedication to the ones above."
 has_pia_tt: "This legion already has the #Y Pia#! distinction!"
 distinction.12.t: "Barca"
 #P:A TODO No EU5 equivalent: barca_legion was the Imperator unit that used the force_march ability; EU5 has no such unit ability (the event is disabled)
 distinction.12.desc: "We have gotten word from [barca_legion.GetName], and it seems that they have done what some thought to be impossible. No sane commander would have taken an army at such a pace through such lands… or that is what conventional wisdom would have us think. Evidence however shows us that it has worked, despite the attached dangers, and the enemy was taken by surprise by this sudden appearance. As the commander said in his last message before the battle, “I will either find a way, or make one”. "
 distinction.12.a: "They surely have done the impossible."
 distinction.13.t: "Stalwart Victories"
 distinction.13.desc: "Many victories have been bestowed upon [actor.GetName] and it does not seem to stop. Glory and honor is being bestowed upon all soldiers within it, let us just hope we get some time to enjoy it before the next victory. And even victories come with losses in men, let us hope our victories will not leave us ruined."
 distinction.13.a: "There cannot be such a thing as winning too much?"
 distinction.14.t: "Tusked Mayhem"
 distinction.14.desc: "Our magnificent victory today by [actor.GetName] has shown what truly is supreme on the battlefield. Other nations squabble with phalanxes and horsebound infantry, but once the elephants charge the brave fall and the smart runs for their lives. With this victory at hand we are sure that [actor.GetName] will put even more focus into these noble beasts for our future war efforts."
 distinction.14.a: "Our armies are unstoppable."
 distinction.15.t: "Reflections of Glory"
 distinction.15.desc: "A remarkable victory has been achieved by [actor.GetName] after a crushing victory against the pompous Greeks and their phalanx. Had Alexandros seen the sloppiness of their movement, weakness of the guards for the flanks and slow reactions to our tactics he would have wept. With this great victory we will take the glory of the silver shields for ourselves as we now have the most proficient heavy infantry in the world."
 distinction.15.a: "The days of the Greeks are numbered."
 distinction.16.t: "Saviors"
 distinction.16.desc: "We have been reached by news regarding [actor.GetName] and their actions in saving [ROOT.GetCountry.GetAdjective] lives. They came to the rescue as our countrymen were under the immense pressure of the enemy keeping them in check.  As should be [pa_commander.GetShortName] was presented with the highest military decoration of the land as the survivors saved scoured the battlefield for grass, flowers and other plants to make him a crown of grass."
 distinction.16.a: "The highest honor one could have bestowed."
 #P:A TODO No EU5 equivalent: triumph_legion was an Imperator legion scope (from the hold_triumph interaction); EU5 has no legions (the event is disabled)
 distinction.17.t: "The Triumphant [triumph_legion.GetName]"
 distinction.17.desc: "It is a glorious day for [triumph_legion.GetName]; their many achievements on the field of battle have brought a triumph to their magnificent commander, [target.GetName].\n\nThough one might think it were all for the general, with their resplendent toga and divinely painted face, it is a rare honor for the men to march into the city alongside the spoils of victory - a permanent honor to their name and a chance to show their own glory, parading through [ROOT.GetCountry.GetCapital.GetName] with fresh uniforms and shining phaleras for all to see."
 distinction.17.a: "They will all be kings for a day."
 distinction.18.t: "Steadfast Victory"
 distinction.18.desc: "In a battle, being methodical and having a good plan will make what might otherwise look like an even match turn into a one sided matter. As shown in their latest victory, [actor.GetName] has shown that they might even be able to push the ocean itself back with their resolve. As the enemy came with all their might, trying to push into our lines, they were time after time rebuffed. With each attack, our shields held strong and the enemies fell to our blades as they were pushed into close quarters. Today's glorious victory will live on and guide the way forward for this army!"
 distinction.18.a: "They are an example for us all."
 distinction.19.t: "Fulminous Victory"
 distinction.19.desc: "Many battles are won with strategy, others with bravery, and some by intervention from the heavens. As [actor.GetName] was fighting, things were looking grim as the enemy made steady gains without our men being able to push them back. As the wind picked up, the enemy's resolve started to falter whereas we were certain that this was the gods lending us a hand. When the lightning struck the enemy army the battle was over, not a man among them brave enough to stand up to the will of the gods. With this, [actor.GetName] will now fly the thunderbolt as part of their legacy."
 distinction.19.a: "May we all be so lucky to have the gods on our side."
 distinction.20.t: "Logistical Marvel"
 distinction.20.desc: "An army walks on its stomach, this is something every competent commander is well aware of. Assigning designated foraging parties as part of the soldier's daily tasks has done wonders for how long the army's rations last. It seems that the commander of [actor.GetName] has taught them to be almost self-reliant extending the rations they march with and thus making them much less reliant on the supply train to keep them fit for action."
 distinction.20.a: "Most impressive."
 distinction.21.t: "Cowardly Flight"
 distinction.21.desc: "The cowards of [actor.GetName] have fled the field, leaving supplies and stragglers for the enemy to take as they wish. The tides of this war might have been turned by this alone! This is a blemish on our honor, but even more so on theirs. They should have stood their ground until the end rather than coming back as cowards."
 distinction.21.a: "All of them are cravens!"
 distinction.23.t: "Disgraced Legion"
 distinction.23.desc: "Some of our most professional forces have defected to the side of the rapscallion [mutineer_revolting_country.GetGovernment.GetRuler.GetName]! If they are ever reconstitued after our victory, the stain on their reputation will be hard to remove."
 distinction.23.a: "Their dishonor will not be forgotten."
 distinction.24.t: "Impious Sacking"
 #P:A TODO No EU5 equivalent: pious_legion was the Imperator unit that desecrated a holy site; EU5 has no such unit ability (the event is disabled)
 distinction.24.desc: "The fools of [pious_legion.GetName] might just have doomed us all, as they sacked a holy site of our gods! Let us all hope the wrath of the heavens will be contained to those guilty of the deed rather than bringing their fury upon us all. It will be a large undertaking full of risk for them to regain the favor of the gods."
 distinction.24.a: "These men has foolishly tempted the wrath of the gods."
 has_impia_tt: "This legion already has the #Y Impia#! distinction!"
 distinction.25.t: "Headless Snake"
 distinction.25.desc: "Cutting the head off a snake is a good way to quickly dispatch the threat. after the cowardly actions of [dishonor_fallen_commander.GetName], they lacked the fortitude of mind and body to keep their leader alive. This will be a tarnish on their name and something that will keep future commanders worried."
 distinction.25.a: "How could the men be so careless?"

 # 00_inv_after_battle.txt
 inv_after_battle.11.t: "The Bonds of Friendship"
 inv_after_battle.11.a: "I'll watch your back if you protect mine"
 inv_after_battle.11.d: "[inv_after_battle_1_target.GetName] has acquired a reputation for never leaving a wounded soldier behind on the battlefield, often putting [inv_after_battle_1_target.GetHerHim]self in great personal danger in order to make sure that no one is forgotten.\n\nThanks to [inv_after_battle_1_target.GetShortName]'s selfless example, many of our soldiers are inspired to follow in [inv_after_battle_1_target.GetHerHis] footsteps."
