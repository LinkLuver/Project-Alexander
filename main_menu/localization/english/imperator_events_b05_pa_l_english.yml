 # food_events.txt
 food_events.1.t: "Harvest Failure"
 food_events.1.desc: "Our settlements across [fe_city.GetProvince.GetName] are reporting that their crop yield will fall well below the normal amount this year, and already people throughout the area are stockpiling food and preparing for the worst.\n\nLocal officials are requesting assistance to ensure there are ample supplies for the coming months, but procuring meals for so many mouths will not be cheap..."
 food_events.1.a: "We will do what we can."
 food_events.1.b: "Make it clear this is the governor's responsibility."
 food_events.1.c: "Relocation will mitigate the strain on [fe_city.GetProvince.GetName]."
 food_events.1.d: "We must ask for blessings from [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')]..."
 famine_relocation_tooltip: "#Y 10%#! of the population of #Y [fe_city.GetProvince.GetName]#! (#Y [ROOT.GetCountry.MakeScope.GetVariable('famine_relocation_number').GetValue|0]#! thousand people) will be moved to locations in neighboring #Y [relocation_state_city.GetProvince.GetName]#!.\n#Y [relocation_state_city.GetProvince.GetName]#! currently has #Y [relocation_state_city.GetProvince.GetFood|0]#! Food of #Y [relocation_state_city.GetProvince.GetFoodCapacity|0]#! Food Capacity.\n#Y Peasant#! and #Y Burgher#! pops will be prioritized."
 food_events.2.t: "Harsh Winters"
 food_events.2.desc: "A slew of particularly harsh winters has been gradually taking its toll on stockpiles and ravaging farmland across [fe_city.GetProvince.GetName], with local officials predicting food shortages in the coming months as demand outstrips supply.\n\nWithout help, the area is sure to struggle in the years ahead, but we must weigh our choices... "
 food_events.2.a: "They must receive aid."
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen]); EU5 provinces have no governors (the option is disabled)
 food_events.2.b: "The governor will sort it out."
 food_events.2.c: "Send the most affected elsewhere."
 food_events.2.d: "It is out of our hands."
 food_events.3.t: "Nature's Whims"
 food_events.3.desc: "The calamitous natural disasters that have racked [fe_city.GetProvince.GetName] caused far more harm that we were lead to believe - the damage to farmland and livestock alone has already lead to food shortages in the poorer settlements, and it is only a matter of time before hunger spreads.\n\nWe can arrange to import grain to the area to ameliorate the worst affects, but it won't be cheap."
 food_events.3.a: "These people need our help."
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen]); EU5 provinces have no governors (the option is disabled)
 food_events.3.b: "They are the responsibility of the governor."
 food_events.3.c: "We should relocate some of the population."
 food_events.3.d: "Acts of the gods cannot be helped."
 food_events.4.t: "The Scourge of War"
 food_events.4.desc: "[fe_city.GetProvince.GetName] has been the unfortunate victim of wanton rapine and pillage of late, a sad but unavoidable consequence of warfare and its attendants.\n\nThe land that is workable has in some cases been neglected or abandoned, while vast tracts are totally unusable - shortages are inevitable and without aid the province is sure to suffer further."
 food_events.4.a: "Send them aid immediately."
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen]); EU5 provinces have no governors (the option is disabled)
 food_events.4.b: "The governor can afford to cover it."
 food_events.4.c: "Perhaps their neighbors can share the load."
 food_events.4.d: "Such is war."
 food_events.5.t: "Risk of Famine"
 food_events.5.desc: "Our local officials bring dreadful news that the food shortages in [fe_city.GetProvince.GetName] have worsened due to further crop failures, stockpiling, and theft, leading to starvation and disorder across the area.\n\nThey beg us to have compassion and requisition food, that [fe_city.GetProvince.GetName] can once more become a productive and orderly district."
 food_events.5.a: "We cannot ignore their plight."
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen] ... GetHerHis); EU5 provinces have no governors (the option is disabled)
 food_events.5.b: "The governor must accept their responsibilities."
 food_events.5.c: "Divert supplies from [fe_city_divert.GetProvince.GetName]."
 food_events.5.d: "There is nothing we can do."
 food_events.6.t: "Overworked Land"
 food_events.6.desc: "The great concentration of slaves toiling in the fields of [fe_city.GetProvince.GetName], particularly around [fe_city.GetName], has led to the diminishment of the local soil this year, collapsing a major pillar of the provincial food supply.\n\nOur officials warn that without aid the province is sure to fall into hunger."
 food_events.6.a: "We must do whatever we can."
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen]); EU5 provinces have no governors (the option is disabled)
 food_events.6.b: "The governor will pay for the grain."
 food_events.6.c: "Break up the latifundia."
 food_events.6.d: "They should have thought of that."
 food_events.7.t: "Drought"
 food_events.7.desc: "A particularly harsh year has lead to a drought in [fe_city.GetProvince.GetName], withering the crops and leading to food shortages across the area. Local officials are begging for our support to avert a crisis.\n\nIt will not be cheap, but we may be able to import extra supplies and address the worst of the starvation."
 food_events.7.a: "It is our responsibility."
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen]); EU5 provinces have no governors (the option is disabled)
 food_events.7.b: "A job for the governor, methinks."
 food_events.7.c: "[fe_city_divert.GetProvince.GetName] has food to spare."
 food_events.7.d: "These things happen."
 food_events.8.t: "Granaries Raided"
 food_events.8.desc: "We have received word from local officials of [fe_city.GetProvince.GetName] that several important provincial food stockpiles have been looted by malcontents owing to the contempt for the government across the area.\n\nIt seems they hope to make tensions worse by forcing a hungry people to action - in any case it will not be cheap to replace the stolen goods."
 food_events.8.a: "We will just have to replace the stockpile."
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen]); EU5 provinces have no governors (the option is disabled)
 food_events.8.b: "The governor can cover the costs."
 food_events.8.c: "The brigands will be caught, and the grain returned."
 food_events.8.d: "Let the disloyal curs go hungry."
 food_events_66_percent_tooltip: "[fe_city.GetProvince.GetName] loses #R [ROOT.GetCountry.MakeScope.GetVariable('fe_66_percent_food_var').GetValue|0]#! food."
 food_events.9.t: "Shortages Alleviated"
 food_events.9.desc: "We have received word that the grain crisis in [fe_city.GetProvince.GetName] has improved without need for interference.\n\nIt seems the local nobility gathered their wits when they realized no help was forthcoming; ensuring the survival and value of their estates by releasing their inordinate stockpiles and organizing their own imports."
 food_events.9.a: "Excellent."
 food_events.9.at: "[fe_city.GetProvince.GetName] loses the effect of #Y Famine#!"
 food_events.10.t: "Land Mismanagement"
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen] ... GetHerHis); EU5 provinces have no governors (the event is disabled)
 food_events.10.desc: "In a staggering display of incompetence, it seems that the governor of [fe_city.GetProvince.GetName] has mismanaged their estates in the province to such a degree that there are reports of food shortages across the area.\n\nIt seems the fool tried to introduce a novel system of irrigation without any knowledge of agriculture, ruining most of the harvest."
 food_events.10.a: "Strip the governor's estates, and help the needy."
 food_events.10.b: "Clap the governor in irons, their assets will cover the costs."
 food_events.10.c: "The governor is a governor, not a farmer, after all."
 food_events.11.t: "Famine Spreads"
 food_events.11.desc: "Officials from [fe_spread_city.GetProvince.GetName] bring dire news that the panic and scarcity of their neighboring [fe_city.GetProvince.GetName] has seeped into their area, as the wealthy stockpile inordinate amounts of food and refugees from [fe_city.GetProvince.GetName] put strain on the supply.\n\nWithout our interference, this situation could get out of hand..."
 food_events.11.a: "We must contain it, now!"
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_spread_city').GetState.GetGovernor.GetPraenomen]); EU5 provinces have no governors (the option is disabled)
 food_events.11.b: "The governor is responsible..."
 food_events.11.c: "Appropriate food from [fe_city_divert.GetProvince.GetName]."
 food_events.11.d: "There is no stopping the divine will."
 food_events.12.t: "Abundant Produce"
 food_events.12.desc: "The provincial officials of [fe_city.GetProvince.GetName] report that the district has seen an unprecedented harvest this year, with great jubilations for [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] being held in settlements large and small.\n\nThese extra, unexpected, revenues could help bolster the food reserves of the province, but then again, such a gift from the gods is surely intended to benefit the entire [ROOT.GetCountry.GetAdjective] people..."
 food_events.12.a: "Distribute the proceeds to the provincial granaries."
 food_events.12.b: "The people of [fe_gift_city.GetProvince.GetName] need it more."
 food_events.12.c: "We will shower the people of [ROOT.GetCountry.GetCapital.GetName] with bread!"
 food_events.12.d: "The surplus will be put to good use."
 food_events.13.t: "Excellent Land Management"
 food_events.13.desc: "We have received happy news from [fe_city.GetProvince.GetName] where local officials report consistently abundant harvests after experimenting with new methods of land management.\n\nLeaving them to their work will no doubt swell the food stores of the province, but the managers and their practices might be more useful distributed across the farmlands of [ROOT.GetCountry.GetName]."
 food_events.13.a: "[fe_city.GetProvince.GetName] will be a cornucopia."
 food_events.13.b: "Send scribes to record new standard practices."
 food_events.13.c: "Distribute them far and wide."
 food_events.14.t: "Granary Fire"
 food_events.14.desc: "It has come to our attention that one of the main grain stores of [fe_city.GetProvince.GetName] was engulfed in an unfortunate conflagration last night, along with much of the stockpile contained within.\n\nWe can rebuild the stockpile, but some officials argue the size of the reserve was not necessary and would rather the money was spent elsewhere."
 food_events.14.a: "The granary is an important strategic keystone."
 food_events.14.b: "It is unwise to tempt the gods a second time."
 food_events.15.t: "Incompetent Storage"
 food_events.15.desc: "Distraught officials from [fe_city.GetProvince.GetName] are reporting that a not insubstantial portion of the province's grain reserves have been allowed to fester and rot away due to the ineffably incompetent practices used to store them.\n\nThe local people are in uproar at their toil being wasted so frivolously and worry about having to go hungry - all look to us for justice in this scarcely unbelievable scandal."
 food_events.15.a: "See to it that proper standards are followed."
 #P:A TODO No EU5 equivalent: Imperator named the state governor ([SCOPE.sP('fe_city').GetState.GetGovernor.GetPraenomen]); EU5 provinces have no governors (the option is disabled)
 food_events.15.b: "And all under the watchful eye of the governor..."
 food_events.15.c: "Crucify the handlers."
 food_events.15.d: "It is only some grain."

