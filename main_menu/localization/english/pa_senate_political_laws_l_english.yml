l_english:
 pa_senate_public_policy_law: "Senatorial Public Policy"
 pa_senate_public_policy_law_desc: "Rome's public priorities are shaped by the Senate. Only one of these policies can be active at a time."
 pa_senate_balanced_policy: "Balanced Administration"
 pa_senate_balanced_policy_desc: "The Republic maintains a balanced public administration."
 pa_senate_aristocratic_grants_policy: "Aristocratic Grants"
 pa_senate_aristocratic_grants_policy_desc: "Favor the aristocracy: +10% nobles estate power, -5% tax income efficiency."
 pa_senate_military_levies_policy: "Expanded Military Levies"
 pa_senate_military_levies_policy_desc: "Expand military recruitment: +10% manpower, -5% tax income efficiency."
 pa_senate_civic_works_policy: "Civic Works"
 pa_senate_civic_works_policy_desc: "Promote prosperity: +0.005 monthly prosperity, -5% manpower."
 pa_senate_taxation_law: "Senatorial Taxation"
 pa_senate_taxation_law_desc: "The Senate determines how Rome collects revenue."
 pa_senate_traditional_tax_policy: "Traditional Taxation"
 pa_senate_traditional_tax_policy_desc: "Retain the existing system of taxation."
 pa_senate_tax_reform_policy: "Reform Tax Collection"
 pa_senate_tax_reform_policy_desc: "Improve tax collection: +10% tax income efficiency, -5% noble estate power."
 pa_senate_recruitment_law: "Senatorial Recruitment"
 pa_senate_recruitment_law_desc: "The Senate determines the basis of military recruitment."
 pa_senate_traditional_recruitment_policy: "Traditional Recruitment"
 pa_senate_traditional_recruitment_policy_desc: "Retain the existing recruitment system."
 pa_senate_citizen_recruitment_policy: "Expand Citizen Recruitment"
 pa_senate_citizen_recruitment_policy_desc: "Expand recruitment: +10% manpower, -5% tax income efficiency."
 pa_senate_production_law: "Senatorial Production"
 pa_senate_production_law_desc: "The Senate determines how Rome supports production."
 pa_senate_traditional_production_policy: "Traditional Production"
 pa_senate_traditional_production_policy_desc: "Retain traditional production arrangements."
 pa_senate_workshop_investment_policy: "Invest in Workshops"
 pa_senate_workshop_investment_policy_desc: "Support workshops: +5% production efficiency, -5% manpower."
 pa_senate_food_law: "Senatorial Grain Supply"
 pa_senate_food_law_desc: "The Senate determines Rome's grain supply policy."
 pa_senate_traditional_food_policy: "Traditional Grain Supply"
 pa_senate_traditional_food_policy_desc: "Retain existing grain supply arrangements."
 pa_senate_grain_reserves_policy: "Establish Grain Reserves"
 pa_senate_grain_reserves_policy_desc: "+5% monthly food, -5% tax income efficiency."
 pa_senate_farm_expansion_policy: "Expand Rural Estates"
 pa_senate_farm_expansion_policy_desc: "+10% maximum rural resource-gathering capacity, -5% manpower. Applies to rural resource production, not only food."
 pa_senate_grain_distribution_policy: "Public Grain Distribution"
 pa_senate_grain_distribution_policy_desc: "+8% monthly food, -5% noble estate power."
 pa_senate_rural_foodworks_policy: "Support Rural Foodworks"
 pa_senate_rural_foodworks_policy_desc: "+3% monthly food and +5% maximum rural resource-gathering capacity, -5% tax income efficiency."
 pa_senate_military_readiness_law: "Senatorial Military Readiness"
 pa_senate_military_readiness_law_desc: "The Senate sets priorities for Rome's levies."
 pa_senate_traditional_readiness_policy: "Traditional Levies"
 pa_senate_traditional_readiness_policy_desc: "Retain the existing levy organization."
 pa_senate_levy_expansion_policy: "Expand the Levies"
 pa_senate_levy_expansion_policy_desc: "+10% levy size, -10% army maintenance efficiency."
 pa_senate_administration_law: "Provincial Administration"
 pa_senate_administration_law_desc: "The Senate determines how Rome administers its territories."
 pa_senate_traditional_administration_policy: "Traditional Administration"
 pa_senate_traditional_administration_policy_desc: "Retain existing provincial administration."
 pa_senate_provincial_registers_policy: "Create Provincial Registers"
 pa_senate_provincial_registers_policy_desc: "+0.005 monthly control, -5% noble estate power."
 pa_senate_construction_law: "Public Construction"
 pa_senate_construction_law_desc: "The Senate determines how Rome supports public building."
 pa_senate_traditional_construction_policy: "Traditional Construction"
 pa_senate_traditional_construction_policy_desc: "Retain existing construction arrangements."
 pa_senate_public_construction_policy: "Sponsor Public Construction"
 pa_senate_public_construction_policy_desc: "+5% building construction efficiency, -5% tax income efficiency."
