l_english:
 project_alexander_olympics.1.title: "The Olympiad"
 project_alexander_olympics.1.desc: "The games are to be held at this sacred site. Shall we invite the Greek cities and kingdoms to take part?"
 project_alexander_olympics.1.a: "Invite the Greek world"
 project_alexander_olympics.1.b: "Hold a private celebration"
 project_alexander_olympics.2.title: "An Invitation to the Olympiad"
 project_alexander_olympics.2.desc: "An invitation has arrived to attend the Olympiad. Our presence would honor the games and their sacred traditions."
 project_alexander_olympics.2.a: "Send our delegation"
 project_alexander_olympics.2.b: "We will not attend"
 project_alexander_olympics.3.title: "The Games Conclude"
 project_alexander_olympics.3.desc: "The Olympiad has come to a close. Athletes and spectators return home, carrying the memory of the games across the Greek world."
 project_alexander_olympics.3.a: "A worthy celebration"
 project_alexander_olympics.4.title: "The Olympiad's Honors"
 project_alexander_olympics.4.desc: "Our participation in the games has strengthened the esteem in which the clergy hold our traditions."
 project_alexander_olympics.4.a: "Celebrate the games"
