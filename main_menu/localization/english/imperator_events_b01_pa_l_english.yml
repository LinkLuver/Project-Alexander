l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b01 (2026-09-30)

 # zorgo_events.txt
 zorgo_event.1.t: "Settling Old Scores"
 zorgo_event.1.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], there is a delicate matter that will require your personal attention. We have heard reports that [random_dude.GetName] has been threatening to kill [random_dude_2.GetName] over real estate; it seems that they both want the same property in [ROOT.GetCountry.GetCapital.GetName] and neither is backing down. The war of words has continued to escalate over the last few weeks, and just last night, [random_dude_2.GetShortName] was attacked outside of [random_dude_2.GetHerHis] home and was badly beaten, ultimately losing an eye.\n\nWhile we normally wouldn't trouble you with such things, your blood relation with [random_dude.GetShortName] complicates the issue - [random_dude_2.GetShortName] has been telling everyone that you sent your henchmen over there to teach [random_dude_2.GetHerHim] a lesson, and people are starting to listen."
 zorgo_event.1.a: "Send [random_dude_2.GetShortName] a gift from the treasury and our profuse apologies"
 zorgo_event.1.b: "Tell that fool to keep their mouth shut if they'd like to keep the other one!"

 zorgo_event.2.t: "A Curious Discovery"
 zorgo_event.2.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], a farmer was working in the fields near [ROOT.GetCountry.GetCapital.GetName] when a weird aberration was unearthed; a silver idol of some rustic, long-forgotten god, covered in strange runes that are indecipherable. [priest.GetName], who is an expert in such matters, has said a malevolent spirit is trapped inside the statuette and that we have unwittingly unleashed a curse. While [priest.GetShortName] has said this is a terrible omen for our people, not everyone is convinced that this is a stroke of bad luck."
 zorgo_event.2.a: "Melt the statue down and make coins - I am not afraid of some ancient spirit"
 zorgo_event.2.b: "Tell [priest.GetShortName] to rebury it in the same spot and to offer sacrifices"

 zorgo_event.3.t: "A Gift From The Sea"
 zorgo_event.3.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] was fast asleep in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] bedchambers when, all of a sudden, there were loud screams and the sounds of breaking furniture, ripping [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] from [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] reverie. There was a flash of steel, and a few frantic moments later, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s bodyguards were holding [dumbass.GetName] on the ground.\n\nWhat came next was a story so ridiculous, so strange, that for a moment, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] thought that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] was still dreaming. But no, this actually happened; it appears that [dumbass.GetShortName], clearly a simpleton, had purchased a gigantic tuna in the fish market and had brought it to [ROOT.GetCountry.GetCapital.GetName] as a present. How he managed to sneak past your sentries in the middle of the night remains a mystery.\n\nWhen pressed for more details, [dumbass.GetShortName] keeps sobbing the same story - 'It's the biggest fish I've ever seen, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], and I just had to give it to you. I didn't mean any harm, honest'. In fairness, next to [dumbass.GetHerHis] feet is truly the largest tuna you have ever seen."
 zorgo_event.3.a: "Um...thanks, I guess? Here, take some gold for your troubles"
 zorgo_event.3.b: "Guards, beat this idiot with the tuna and throw them both in the street!"
 zorgo_event.3.c: "That was the dumbest thing you've ever done, [dumbass.GetShortName]."

 zorgo_event.4.t: "Observing the Master"
 zorgo_event.4.desc: "Lately, [heir.GetName] has been pestering [ROOT.GetCountry.GetGovernment.GetRuler.GetName] almost daily with a simple request, one that [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] cannot ignore for much longer. What [heir.GetShortName] has asked for is simple enough, if a little embarrassing; all that [heir.GetSheHe] wants is the chance to observe [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] during the next Council meeting. Being somewhat inexperienced with political matters, [heir.GetShortName] would like to watch 'the Master at work', so to speak, in hopes of learning how to deal with advisors."
 zorgo_event.4.a: "You can sit behind me, but keep quiet and don't appear too eager"
 zorgo_event.4.b: "You will have plenty of time to learn on your own one day"

 zorgo_event.5.t: "Overflowing Granaries"
 zorgo_event.5.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], the harvests were so plentiful this year that we have run out of room to store the wheat. The granaries that we have built near [ROOT.GetCountry.GetCapital.GetName] are packed to bursting, and there is simply no room left for what we have on hand - we will just have to sell the excess at market."
 zorgo_event.5.a: "We are glad that we are not wanting for food - the people should rejoice!"

 zorgo_event.6.t: "Tax Collector Murdered"
 zorgo_event.6.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], we are sorry to inform you that one of our tax collectors, a man named [taxman.GetName], was found stabbed to death in the streets of [ROOT.GetCountry.GetCapital.GetName].\n\nEveryone claims that [taxman.GetShortName] was known to have 'sticky fingers' and skimmed much more off of the top for himself than he should have, and while this might be true, was the man deserving of such a violent death? Now, the locals are refusing to tell us who was responsible for the crime, even though our soldiers have been threatening them if they don't speak...this does not bode well."
 zorgo_event.6.a: "This is terribly vexing to hear...farewell, [taxman.GetShortName]"

 zorgo_event.7.t: "Barbarian Raid"
 zorgo_event.7.desc: "We have terrible news to report this morning, o [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. A band of barbarian raiders has been pillaging the region of [temple_province.GetName], crossing the river in the middle of the night and catching our guards unawares. Not only have the bandits managed to steal a bit of gold, which is bad, but they killed some locals, which is worse - our people mourn their lost lives and property today."
 zorgo_event.7.a: "We will do everything within our power to punish those responsible!"

 zorgo_event.8.t: "A Song for [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]"
 zorgo_event.8.desc: "A few days ago, two famed troubadours that are known for singing in unison, [bard.GetName] and [bard_2.GetName], arrived in [ROOT.GetCountry.GetCapital.GetName] and requested an audience with [ROOT.GetCountry.GetGovernment.GetRuler.GetName] whenever [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] has the time. The reason for the visit was known even before they arrived in our capital, for the reputation of [bard.GetShortName] and [bard_2.GetShortName] certainly precedes them, and their latest masterwork, an epic poem entitled '#high The Mighty Deeds of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]#!', has been the talk of the town for weeks.\n\nThe two poets have humbly asked for the chance to perform, and later on this evening, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] shall have the honor of hearing the famous piece recited in person."
 zorgo_event.8.a: "At least the subject matter will be interesting..."

 zorgo_event.9.t: "An Uncovered Plot"
 zorgo_event.9.desc: "At the last moment, our agents uncovered a plot to have [ROOT.GetCountry.GetGovernment.GetRuler.GetName] assassinated, and as more and more details are revealed, the scandal continues to grow, shocking the inhabitants of [ROOT.GetCountry.GetCapital.GetName].\n\nThe rot runs deep; it seems that the perpetrators were able to persuade one of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s relatives, [cousin.GetName], to join their number. Indeed, [cousin.GetShortName] was the linchpin of the entire operation, for it was hoped that [cousin.GetSheHe] would have been able to bring [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] someplace secluded where the murderers would have been hiding. In fact, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was supposed to pay a visit tomorrow afternoon... \n\nWhen the intrigue was discovered, [cousin.GetShortName] tried to flee in the middle of the night, hoping to find a ship to take [cousin.GetHerHim] anywhere, but was arrested at the harbor. What shall we do?"
 zorgo_event.9.a: "Throw [cousin.GetShortName] into the deepest pit...for now"

 zorgo_event.11.t: "Woven Wind"
 zorgo_event.11.desc: "Although [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is known to enjoy the finer things in life, as of late, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] has been perturbed by the growing signs of extravagant wealth in our society. Far too many of our nobles are spending their money on importing silk clothing, which colloquially is known as 'woven wind' because of its gossamer nature, and the streets are filled with dandies that spend their days talking of fashion, which is certainly not a [ROOT.GetCountry.GetGovernment.GetRuler.GetCulture.GetName] virtue.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has been considering restricting such frivolous things, but is well aware that there could be a push-back from the cultural elites."
 zorgo_event.11.a: "Enough is enough - outlaw the wearing of silk clothing for one year"
 zorgo_event.11.b: "Bah! I have more important things to worry about...leave me alone"
 STATIC_MODIFIER_NAME_cyr_unhappy_locals: "Unhappy Locals"

 zorgo_event.12.t: "Exhibition at The Grand Cothon"
 zorgo_event.12.desc: "We have heard news that there is to be a grand unveiling at the Grand Cothon in [ShowLocationName('tunis')], as some recent renovations have been completed in the harbor district and the architects are eager to show off the latest additions. Only the most prestigious families have been invited to the exhibition, and naturally this includes [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. The cream of [ROOT.GetCountry.GetGovernment.GetRuler.GetCulture.GetName] society will be in attendance, and it is quickly turning out to be the most talked about event of the year.\n\nAlthough being invited is a great honor, there will be costs associated the trip; it's up to you, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]. The people will certainly want their leader to attend, but can our treasuries support such a thing?"
 zorgo_event.12.a: "Travel is expensive but it broadens the mind - we shall go!"
 zorgo_event.12.b: "I am too busy to visit myself, but I am excited to hear about it"

 zorgo_event.13.t: "Offerings to Tannit"
 zorgo_event.13.desc: "Every five years, all of the nations that remember the goddess Tannit and her kindnesses are obliged to send a gift to her temple in [ShowLocationName('tunis')], a time-honored tradition that our people are only too happy to embrace.\n\nAs the ceremony approaches, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been reminded by [jerk.GetName] that we did not send the tributes last time, asking for an extension due to some financial difficulties. It is unfortunate, but we have to send double the amount if we want to remain in the goddess's good graces."
 zorgo_event.13.a: "What are we without the gods? Although it stings, send the funds"
 zorgo_event.13.b: "I care not what I promised - we can't afford this"
 STATIC_MODIFIER_NAME_grand_religious_festival: "Grand Festival"

 zorgo_event.14.t: "Forced to Intervene In Trade Disputes"
 zorgo_event.14.desc: "Although we try our best not to trouble you, [ROOT.GetCountry.GetGovernment.GetRuler.GetName], there is a tricky matter that will require your personal touch.\n\nTwo of our countrymen, [random_bro.GetName] and [random_bro_2.GetName], have been involved in a very public and very ugly argument over a piece of property near [ROOT.GetCountry.GetCapital.GetName] - it seems they both want the same warehouses for storing trade goods. Both [random_bro.GetShortName] and [random_bro_2.GetShortName] are ambitious, rivals in the public space, and their war of words is threatening to spill over into violence unless something is done.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] will have to sit in judgment, and there are no easy solutions - someone is bound to get upset."
 zorgo_event.14.a: "I have chosen [random_bro_2.GetName]"
 zorgo_event.14.b: "Clearly [random_bro.GetName] is more deserving"
 zorgo_event.14.c: "Threaten them both with exile unless they stop arguing"

 zorgo_event.15.t: "Restoring the Temple of Melqart"
 #P:A TODO Approximate location: Imperator Tyrus (p:743) has no EU5 location (mapped to sidon elsewhere); the name is written out
 zorgo_event.15.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], we have received words of a terrible omen in the province of Tyros. An awful earthquake has devastated the Temple of Melqart, and the Tyrian priests have sent messengers to all of the [ROOT.GetCountry.GetGovernment.GetRuler.GetCulture.GetName] cities, asking for alms to help restore the damaged holy site. There are large cracks in the structure's stereobate, and there are fears that, unless work begins immediately, the entire temple could collapse.\n\nAlthough requests for money are never welcome news, it is known that Melqart takes care of his faithful - our citizens would be very pleased knowing that they helped contribute."
 zorgo_event.15.a: "Because the gods take care of us, we shall take care of them"
 zorgo_event.15.b: "We send enough tithes to the Tyros as it is - no"
 STATIC_MODIFIER_NAME_happy_citizens: "Happy Citizens"

 zorgo_event.16.t: "The Explorer Returns"
 zorgo_event.16.desc: "We have certainly heard stories of [traveler.GetName], the intrepid traveler that idolizes Hanno the Navigator, for any city with access to the sea has heard of the daring missions that [traveler.GetShortName] has embarked upon. With only Hanno's notes to guide him, [traveler.GetShortName] sets sail for the Ocean every season, going farther and farther down the coast of Africa before returning home, often with exotic goods to sell and stories that are worth their weight in gold.\n\nImagine our surprise, then, when the legendary explorer passed through [ROOT.GetCountry.GetCapital.GetName], asking to meet with [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. It seems that, just like Hanno, [traveler.GetShortName] has encountered the strange tribe of the fearsome Gorillai people, and is willing to trade to us a curiosity if we can afford it. Our people would be greatly interested in seeing such a spectacle for themselves..."
 zorgo_event.16.a: "We cannot spare the coin right now"
 zorgo_event.16.b: "What *is* that?! I have never seen anything like it before...we need it"

 zorgo_event.17.t: "A Distracted Pupil"
 zorgo_event.17.desc: "[teacher.GetName] has been entrusted with tutoring [pupil.GetName] in all things [ROOT.GetCountry.GetGovernment.GetRuler.GetCulture.GetName]; a simple enough task, or so we thought, and one that pays very well for the privilege of instructing a member of the nobility. Unfortunately for us, [teacher.GetShortName] has been complaining that [pupil.GetShortName] is not paying attention at all during the daily lectures, often falling asleep in the middle of class. When [teacher.GetShortName] has gently asked [pupil.GetShortName] to pay attention, the spoiled brat threw a goblet of wine at the teacher, who is now threatening to quit!"
 zorgo_event.17.a: "The nerve...threaten [pupil.GetShortName] if [pupil.GetSheHe] doesn't shape up!"
 zorgo_event.17.b: "I don't care about this at all - please don't bother me again"

 zorgo_event.18.t: "Slave Ships At Port"
 zorgo_event.18.desc: "We have received word that some pirates are passing through the area and that the holds of their ships filled with slaves they have kidnapped. This is not all; it seems that these raiders are being pursued by whomever they attacked, and, fearful of being caught, they are now trying to rid themselves of their ill-gotten gains.\n\nAccording to the leader of the pirates, a scoundrel named [pirate.GetName], their enemies are less than a day behind them, so time is of the essence. Because of their haste, they are willing to offer us discounted prices...if we are willing to do business with them."
 zorgo_event.18.a: "We will not get involved with this - tell the pirates to leave our waters!"
 zorgo_event.18.b: "Buy a couple of slaves"
 zorgo_event.18.c: "We will buy all that they are willing to sell"
 zorgo_event.18.d: "Hmm...would you like to go into business together?"
 corrupt_ruler_tt: "\nThis option is available due to our Ruler's #R Corruption#!."
 STATIC_MODIFIER_NAME_tasm_slave_market: "Slave Markets"

 zorgo_event.19.t: "Steady Hands Steering the Ship"
 zorgo_event.19.desc: "One morning, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] was searching [ROOT.GetCountry.GetCapital.GetName] for their successor, only to be informed that they were out on the waters, practicing sailing maneuvers with our navy.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was pleased at this bit of news, hoping that others will notice the spirit of self-sacrifice and follow suit."
 zorgo_event.19.a: "If only everyone took their duties as seriously as we do..."

 zorgo_event.20.t: "Renowned Orator"
 zorgo_event.20.desc: "A famous speaker, one [orator.GetName] by name, has arrived in [ROOT.GetCountry.GetCapital.GetName] and has quietly made it known that [orator.GetSheHe] would happily give a public speech in [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s honor, especially if we are able to give a small donation.\n\nRealizing that a gift has fallen right into [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] lap, there is no hesitation on [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s part, and preparations are made immediately."
 zorgo_event.20.a: "I have no qualms supporting such a worthy cause"

 zorgo_event.31.t: "Quartan Fever"
 #P:A TODO No EU5 equivalent: Imperator named the office ([GetOffice('office_apothecary').GetCulturalName]); EU5 has no offices, so the text says "court physician"
 zorgo_event.31.desc: "There are rumors of an outbreak of quartan fever along the coasts, no doubt brought to our shores by foreign merchants.\n\nThankfully, our court physician, [apothecary.GetName], seized the initiative on [apothecary.GetHerHis] own accord and ordered that no one be allowed to leave the region, but the commoners are unhappy with [ROOT.GetCountry.GetGovernment.GetRuler.GetName] for not protecting them."
 zorgo_event.31.a: "Curses! Lock down the port until the sickness has gone"

 zorgo_event.32.t: "The Price Of Playing Politics"
 zorgo_event.32.desc: "Everyone in [ROOT.GetCountry.GetCapital.GetName] is aware of [random_house_head.GetName]'s attempts to use their familial connections to buy political power; it seems that everyone, from the lowliest bodyguards to the Heads of Great Families, has received a bribe from the purse of [random_house_head.GetShortName].\n\nImagine [random_house_head.GetShortName]'s disgust, then, when [ROOT.GetCountry.GetGovernment.GetRuler.GetName] summoned [random_house_head.GetHerHim] to the capital to demand a cut..."
 zorgo_event.32.a: "I don't know what you're up to, but don't forget me..."

 zorgo_event.33.t: "The Gift Of Knowledge"
 zorgo_event.33.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], we have received a peculiar gift from a foreign King, one that wishes to remain anonymous. Everyone knows how much the people of [ROOT.GetCountry.GetName] value knowledge, for we have acquired a reputation as being the cleverest people to ever inhabit our corner of the Earth, so it is a pleasant surprise to receive a gift of two foreign slaves that are well-trained in the arts of rhetoric and mathematics.\n\nA simple message is presented to [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]; 'It is our hope that these learned tutors assist the [ROOT.GetCountry.GetAdjective] people in their noble quest to attain wisdom. Signed, A Friend'."
 zorgo_event.33.a: "This is a tremendous gift - we are quite fortunate!"

 zorgo_event.34.t: "Embarrassment At The Feast"
 zorgo_event.34.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] was already in a bad mood today, irritated at having to attend a feast that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] couldn't get out of, and was drinking heavily to pass the time when the incident happened.\n\nHalfway during the third course, a bumbling servant, a man named [random_baker.GetName], lost his footing and tripped, dropping an expensive crystal pitcher that shattered into a thousand pieces. The host, [random_dinner_host.GetName], rose to his feet, face blood-choked and angry, and demanded that [random_baker.GetShortName] be beaten in front of everyone.\n\nAll eyes are turning expectantly towards [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], who rises unsteadily to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] feet."
 zorgo_event.34.a: "No need to cause a scene; I will pay for the dishes myself"
 zorgo_event.34.b: "Break all of [random_dinner_host.GetShortName]'s other dishes for being greedy"
 zorgo_event.34.c: "An error this grave calls for death! Allow me the honor"
 cruel_tooltip: "This option is available because your ruler has the #Y Cruel#! trait."

 zorgo_event.35.t: "The Company One Keeps"
 zorgo_event.35.desc: "Although we try our best not to trouble you with problems that are small, everyone is agreement that you must do something about [heir.GetName].\n\nLately, [heir.GetShortName] has been associating with unsavory sorts, like foreign-born merchants from the lands of our enemies that are filling his head with strong wine and silly dreams. It is even said that there is idle talk about putting [heir.GetShortName] on the throne of [ROOT.GetCountry.GetName], and considering that [heir.GetSheHe] is a #high Pretender#!, this matter could potentially explode. What should we do, if anything?"
 zorgo_event.35.a: "I refuse to get involved without tangible proof"
 zorgo_event.35.b: "Threaten [heir.GetShortName] with exile and pay to have him watched"

 zorgo_event.36.t: "A World-Weary Adventurer"
 zorgo_event.36.desc: "Early this morning, a retinue of strangely-dressed warriors led by an intimidating man named [typhion.GetName] approached the gates at [ROOT.GetCountry.GetCapital.GetName], asking for permission to purchase supplies at our markets. When asked about the soundness of their money, they sheepishly replied that they were destitute but would be willing to part with a treasure if the price was right. Sensing an aura of greatness about this fellow, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] asked [typhion.GetShortName] for a private audience, hoping to hear the story of these wanderers.\n\nAlthough the reticent fighters were loathe to be admitted to the presence of our [ROOT.GetCountry.GetGovernment.GetRulerTitle], after a few cups of wine were shared and bread and meat were offered, a curious story was presented.\n\nAs a small child, [typhion.GetShortName] was captured by raiders from #high Eburonia#! and sold into slavery, ending up in [ShowLocationName('syracuse')] where he was given the Greek name 'Typhon'. Trained to work as a bodyguard, Typhon sailed with his Master to the Far East, staying there for ten long years. He even claims to have visited the island at the edge of the world, a place known as #high Wa#!.\n\nIt was in the East that Typhon came into the possession of a blade known as the #Y Sword of the Winds#!, and although his face tightens as he speaks, he offers it for sale - 'I cannot see my men starve to death...their lives are worth more to me than this artifact.'"
 zorgo_event.36.a: "Perhaps you will stay here, [typhion.GetShortName], and lend us your sword arm?"
 zorgo_event.36.b: "Pay what they ask and send them away in the morning"
 zorgo_event.36.c: "Turn this foreigner away now and give him nothing"
 xenophobic_bad_tooltip: "This option is #Y available#! because your ruler has the #Y Xenophobic#! trait."
 # First name of the character created in zorgo_event.36
 Typhon: "Typhon"

 zorgo_event.37.t: "Washed Out Roads"
 zorgo_event.37.desc: "We have bad news today, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]; we must have angered a storm god, for the howling wind and rain has been relentless for the last week, bringing nothing but misery and bad moods to the people of [ROOT.GetCountry.GetName].\n\nUnfortunately for us, the weather has been so bad that the roads leading to [ROOT.GetCountry.GetCapital.GetName] have all been washed out, and now traffic into our capital has slown to a halt. Trade is practically nonexistent right now, and the city is beginning to run out of fresh food...at least there's water for everyone, right?"
 zorgo_event.37.a: "Pay the locals to work to restore the highways"

 zorgo_event.38.t: "A Request For Discretion"
 zorgo_event.38.desc: "Recently, an intercepted missive was anonymously passed on to [ROOT.GetCountry.GetGovernment.GetRuler.GetName], who wasted no time in reading its contents.\n\nExpecting the details of a treasonous plot, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was stunned to discover a passionate love letter instead - one written by [random_adulterer.GetName] to [random_adulteress.GetName]. Normally this would be ignored, but the unfortunately reality is that [random_adulterer.GetShortName] and [random_adulteress.GetShortName] are married to other people.\n\nIf word of this affair gets out, there will be repurcussions that are felt throughout all of [ROOT.GetCountry.GetAdjective] society."
 zorgo_event.38.a: "I have better things to do than police morality"
 zorgo_event.38.b: "Make the contents of the letter public and force them to divorce"
 zorgo_event.38.c: "Blackmail the lovers...but who sent this to me?"

 zorgo_event.39.t: "Renowned Levies"
 zorgo_event.39.desc: "Recently, a story about our soldiers has spread like wildfire, taking on a near-mythical status that only reinforces [ROOT.GetCountry.GetAdjective] supremacy in battle.\n\nIn one of our recent engagements, the levy from [ROOT.GetCountry.GetCapital.GetName] had been surrounded by the enemy, and although our forces were outnumbered seven to one, our warriors actually defeated the foe, scattering their hosts and seizing their baggage train.\n\nReturning to camp with plunder and booty, one of our men boldly asked that the spoils from the battle be handed out as a donative - an incentive to continue fighting."
 zorgo_event.39.a: "Give the men everything that they brought back"
 zorgo_event.39.b: "Fighting for [ROOT.GetCountry.GetName] is privilege enough"
 STATIC_MODIFIER_NAME_motivated_soldiers: "Motivated Soldiers"

 zorgo_event.40.t: "Riots In The Capital"
 zorgo_event.40.desc: "To be honest with you, [ROOT.GetCountry.GetGovernment.GetRuler.GetName], we are not even sure what happened in the streets of [ROOT.GetCountry.GetCapital.GetName] recently; rumor has it that an argument between two shopkeepers got out of hand, and before anyone could stop it, a massive brawl had broken out.\n\nOf course, a few people tragically died in the fighting, but what is worse is the fires that were started by the losing side. Although we were able to put out the flames relatively quickly, a residential neighborhood of [ROOT.GetCountry.GetCapital.GetName] burnt to the ground."
 zorgo_event.40.a: "Bastards! We will hunt down those responsible..."

 zorgo_event.41.t: "Stewing On Bile"
 zorgo_event.41.desc: "The fallout from last week's dinner party at the home of [random_dinner_host.GetName] continues to have ramifications.\n\nAfter [ROOT.GetCountry.GetGovernment.GetRuler.GetName] drunkenly ordered that every single serving dish belonging to the household be broken, it seems that [random_dinner_host.GetShortName] has been nursing a grudge and is now openly consorting with our enemies.\n\nNeedless to say, this situation doesn't seem to be going away."
 zorgo_event.41.a: "Eh...I care not about [random_dinner_host.GetShortName] or his hurt feelings"

 zorgo_event.42.t: "A Thief In The Night"
 zorgo_event.42.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] is deep in a dream when the loud clanging of metal and a muffled curse snatches the sleep from [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] eyes. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] groggily reaches for a dagger close to the bedside, stumbling to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] feet. There, in the corner of the room by the window, a shadowy figure is getting ready to climb down the walls of the citadel.\n\n'Who are you?' [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] calls out desperately.\n\n'You didn't think I was going to let you keep my sword, did you?' [typhion.GetName] sneers. 'You have no idea what I went through to get this.'\n\nLaughing cruelly, [typhion.GetShortName] grabs a bronze vase and throws it at [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], striking the sleepy [ROOT.GetCountry.GetGovernment.GetRulerTitle] in the face. 'Don't try to find me...we will meet again only in the Underworld.' With that, Typhon vanishes out of the window."
 zorgo_event.42.a: "Guards! Help, I am being attacked!"
 zorgo_event.42.b: "It's too late...Typhon is escaping..."
 zorgo_event.42.c: "I will cut the rope and watch this thief fall to their doom"
 damn_dawg_youre_strong_af_tt: "#Y This option is available because of your Ruler's high Martial stat.#!"

 zorgo_event.43.t: "The Benevolent Spirit"
 zorgo_event.43.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], we have heard reports from the provinces that are worthy of your attention. It seems that a local god, some minor deity, has been seen walking through our realm, touching withered vines and fallow fields and returning them to the blush of spring.\n\nOur people have interacted with this divine creature a couple of times, leaving date cakes and wine out for the god, who in turn has blessed their harvests and made them productive.\n\nTo celebrate this divine connection, the locals have built a shrine to this unknown god of their own initiative."
 zorgo_event.43.a: "The piety of the [ROOT.GetCountry.GetAdjective] faithful has been rewarded!"
 STATIC_MODIFIER_NAME_local_shrine_to_gods: "A Shrine to a Rustic God"

 zorgo_event.44.t: "Do Not Disturb My Bones"
 zorgo_event.44.desc: "Recently, some of our citizens in [ROOT.GetCountry.GetCapital.GetName] were building homes for themselves, but instead of quarrying their own stone, decided to demolish some ancient tombs that were in the area and repurpose the Parian marble. This, in and of itself, is not noteworthy, as our people are known to use spolia, but what is worth mentioning is what our people discovered in one of the graves.\n\nAlthough the inscriptions were faded, a golden vase was found that contained the ashes of a famous architect - perhaps the same one that designed the necropolis - and a warning was posted in multiple languages.\n\n'Do not disturb my bones, lest the fate that befell my people come to destroy your own.'\n\nWhen [ROOT.GetCountry.GetGovernment.GetRuler.GetName] heard this story, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] was perturbed, demanding that the golden vase be reburied, but it has long disappeared and no one is willing to admit where it went."
 zorgo_event.44.a: "I am disgusted to hear this sordid tale"

 zorgo_event.46.t: "Bandit Camps"
 zorgo_event.46.desc: "We have heard rumors that some escaped slaves are forming gangs, joining their forces to repay misery upon the society that once enslaved them.\n\nThese brigands are causing quite a bit of chaos, leaving a trail of death and destruction in their wake, and it is even said that they have built camps in one of our settlements - what a complete and utter lack of respect they are showing to [ROOT.GetCountry.GetAdjective] law!\n\nThe pressure is building for [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to do something. We aren't going to allow these robbers to operate in [ROOT.GetCountry.GetName] with impunity, are we?"
 zorgo_event.46.a: "Send a few cohorts of our finest men to put an end to their terror"
 zorgo_event.46.b: "We cannot spare the manpower at the moment, I'm afraid"
 STATIC_MODIFIER_NAME_local_bandit_camp: "Bandit Camp"

 zorgo_event.47.t: "Bandit Camps: Battle"
 zorgo_event.47.desc: "Our scouts have tracked the location of the bandit encampment, and the final preparations are being made for the attack.\n\nThe robbers are smarter than one would think; they have been raiding slave estates, freeing the captives and swelling their numbers. Although we expected a simple skirmish, all of the signs are pointing to a desperate, pitched battle...the slaves will not surrender their freedom easily."
 zorgo_event.47.a: "I will lead our warriors personally into battle"
 zorgo_event.47.b: "Such a trifling task should be delegated; inform me of our victory"

 zorgo_event.48.t: "Bandit Camp: Triumphant"
 zorgo_event.48.desc: "Although the fight was perilous, the forces of [ROOT.GetCountry.GetName] were able to beat back the slave rabble, utterly destroying any that stood their ground and fought. As the tide of battle turned, a vast multitude surrendered and were immediately clapped in fetters - the slave markets in [ROOT.GetCountry.GetCapital.GetName] will be full within a fortnight.\n\nStill, as the saying goes, a pack of dogs can defeat a single lion, and although [ROOT.GetCountry.GetGovernment.GetRuler.GetName] fought valiantly, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] took a spear to the face and unfortunately lost an eye. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is saddened by this turn of events, and discovering the treasure hoard of the bandits only eases the pain slightly."
 zorgo_event.48.a: "The gods give to us only what we are able to bear"

 zorgo_event.49.t: "Bandit Camp: Triumphant"
 zorgo_event.49.desc: "News from the campaign against the bandits! [general_getting_recognition.GetName] was entrusted with the command of our forces and led our men to victory, crushing any that dared to stand in the field against our [ROOT.GetCountry.GetAdjective] levies.\n\n[general_getting_recognition.GetShortName] has delivered a personal report to [ROOT.GetCountry.GetGovernment.GetRuler.GetName], detailing the exciting events of the battle.\n\nAs news spreads of [general_getting_recognition.GetShortName]'s sensational victory, the people rejoice to hear that [ROOT.GetCountry.GetName] is blessed with military geniuses."
 zorgo_event.49.a: "Was there any doubt that my armies would crush these dogs?"

 zorgo_event.50.t: "Showering Gold Upon The People"
 zorgo_event.50.desc: "One afternoon, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is relaxing in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] private chambers in [ROOT.GetCountry.GetCapital.GetName], listening to the sounds of the bustling market outside. Soon, the last meal of the day will be eaten, and the streets are filled with good [ROOT.GetCountry.GetAdjective] citizens purchasing foodstuffs. An impetuous thought fills [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s mind, and moments later, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is in the back of a chariot, headed into the alleys where the venders are busy hawking.\n\nDigging deep into a coinpurse, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] begins throwing handfuls of gold and silver into the streets. A crowd gathers, raising outstretched hands towards their [ROOT.GetCountry.GetGovernment.GetRulerTitle], their dirt-streaked faces shining in pure admiration."
 zorgo_event.50.a: "I love each and every one of you!"

 zorgo_event.51.t: "A Tax Holiday"
 zorgo_event.51.desc: "It is almost time to collect the taxes owed by the upper classes, which is a historically unpopular time in [ROOT.GetCountry.GetName] - much to [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s chagrin, who looks forward to the lump sums obtained but hates angering the connected.\n\nAs [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is looking over the tax rolls, an advisor steps forward, clearing his throat.\n\n'Perhaps we could just burn the records? You would be incredibly popular for forgiving all of these accrued debts, and there is precedent in our lands for doing such things.'"
 zorgo_event.51.a: "That sounds like a lovely idea...make it so"
 zorgo_event.51.b: "Yeah, that's not happening. I want every coin owed to the state!"
 gluttonous_tooltip: "This option is available because your ruler has the #Y Greedy#! trait."

 zorgo_event.52.t: "Military Camps For Our Youth"
 zorgo_event.52.desc: "[general_advisor.GetName], who is known throughout all of [ROOT.GetCountry.GetName] for [general_advisor.GetHerHis] skill with the blade, has asked [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to consider establishing a state-sponsored program that will train the children of our upper classes in the arts of war.\n\n'It is said that in the lands of our enemies, a child of five years is taught how to fight with weapon in hand - is there any reason that our [ROOT.GetCountry.GetAdjective] sons should not learn the same?'."
 zorgo_event.52.a: "We simply cannot afford this, although it is a good idea"
 zorgo_event.52.b: "Fantastic idea, [general_advisor.GetShortName] - it shall be done"
 STATIC_MODIFIER_NAME_training_the_youth_mod: "Military Training for Youth"

 zorgo_event.53.t: "The Wise Man At The Crossroads"
 zorgo_event.53.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] is leading [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] a small retinue back to [ROOT.GetCountry.GetCapital.GetName] after a successful day of hunting when [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] encounters a strange character at the crossroads leading back to the capital. Dressed in the simple robes of a monk, [dementive_sadhu.GetName] is sitting with eyes closed, holding a small clay pipe. \n\n'Bom Shiva!' cries out the man, exhaling a puff of thick smoke. 'At last, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], our paths have crossed.' Standing to his feet, the old man bows deeply. 'I have traveled for many days to reach this place - my god, the Lord Shiva, has commanded that I offer my services to you.\n\nWaving away the dank clouds, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] cocks an eyebrow. 'And for what purpose has your god sent you here?'\n\nWith a shrill laugh, [dementive_sadhu.GetShortName] responds with a twinkle in his eye.\n\n'That remains to be seen, my Lord.'"
 zorgo_event.53.a: "Very well then, you may follow us home"
 # Nickname given to the ascetic created in zorgo_event.53 (Imperator text: ", 'The Demented'")
 NICKNAME_DEMENTIVE: "the Demented"

 zorgo_event.54.t: "Assassins Foiled"
 zorgo_event.54.desc: "One evening, there is a loud commotion in the courtyard of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s home - it sounds like a pitched battle is taking place! The screams of dying men fill the air, punctuated by the clangs of metal. Grabbing a sword and a breastplate, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] rushes out into the street to see what is happening.\n\nMuch to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] surprise, by the time [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] arrives, the fighting is over. There, standing over the bodies of twelve slain men and completely untouched himself, is [dementive_sadhu.GetName], who spits on the corpse nearest to him.\n\nTurning to [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], [dementive_sadhu.GetShortName] bows and walks past the stunned [ROOT.GetCountry.GetGovernment.GetRulerTitle], who is standing there mouth agape. 'Shiva be praised that I was awake...'"
 zorgo_event.54.a: "...and now you know why I was sent here"

 zorgo_event.55.t: "A Land Worth Visiting"
 zorgo_event.55.desc: "Word is spreading far and wide that our country of [ROOT.GetCountry.GetName] is a good place to visit, with [ROOT.GetCountry.GetCapital.GetName] being the most impressive site that we have to offer. Our [ROOT.GetCountry.GetAdjective] hospitality is well-known, and even those who do not have business within our realm often go out of their way to pay a visit to our capital."
 zorgo_event.55.a: "We are thankful that we have such a friendly reputation"
 STATIC_MODIFIER_NAME_happy_city_reward_modifier: "Thriving City"

 zorgo_event.62.t: "A Curious Discovery:Sour Milk"
 zorgo_event.62.desc: "Lately, our farmers have been complaining that their cows have been producing sour milk that tastes of garlic and curdles almost immediately - it is so pungent and foul that not even their calves will drink it, and many animals are dying. This dreadful phenomenon has spread country wide, and although [ROOT.GetCountry.GetGovernment.GetRuler.GetName] denies it, there is murmuring that some god must have been gravely offended by some ill-advised behavior by the [ROOT.GetCountry.GetAdjective] leader."
 zorgo_event.62.a: "I...I have no idea why this is happening to us"

 zorgo_event.63.t: "A Night At The Theater"
 zorgo_event.63.desc: "A renowned playwright is debuting a new drama tonight in [ROOT.GetCountry.GetCapital.GetName], and the excitement in town is palpable - especially in the home of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], where it has been made known by [pa_spouse.GetName] that [pa_spouse.GetSheHe] would very much like to attend. Truly, it has been the only thing that [pa_spouse.GetSheHe] has talked about for months."
 zorgo_event.63.a: "I am too busy to go to see a boring play"
 zorgo_event.63.b: "Yes, my dear, we will be in the front rows"
 going_to_see_the_play_tt: "#Y You and your spouse will attend the play at the Grand Theater.#!"

 zorgo_event.64.t: "A Night At The Theater: The Play"
 zorgo_event.64.desc: "Despite not wanting to go, once [ROOT.GetCountry.GetGovernment.GetRuler.GetName] got settled, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] really enjoyed the play - the #high Grand Theater#! in the heart of [ROOT.GetCountry.GetCapital.GetName] is an impressive facility, with acoustics that are unrivaled, and seeing a high-quality performance in such a beautiful venue was a magical experience that will be hard to forget.\n\nIt doesn't hurt that [pa_spouse.GetName] is happy, either."
 zorgo_event.64.a: "I look forward to our next evening at the theater"

 zorgo_event.65.t: "Rumors Of Barbarians"
 zorgo_event.65.desc: "There are unfounded rumors that a large barbarian horde is sweeping through the countryside, pillaging, plundering and burning good [ROOT.GetCountry.GetAdjective] homesteads to ashes. Prices are starting to rise in the capital, and those with the means to are fleeing for the safety of the countryside.\n\nAlthough [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has assured the people of [ROOT.GetCountry.GetCapital.GetName] that these stories are nonsense and there is nothing to be afraid of, the people in the city are panicking."
 zorgo_event.65.a: "Everything will be fine, but you must relax!"

 zorgo_event.66.t: "Disappointing Hauls"
 zorgo_event.66.desc: "Our fishermen report that they have been unable to find as many fish as they have in years past, and many are starting to worry that they will not be able to feed their families, let alone have enough left to sell at market.\n\nThe price of fresh fish has gotten to be outrageous in [ROOT.GetCountry.GetCapital.GetName], with men paying a week's wages for a large mackerel - have you ever heard of such a thing?"
 zorgo_event.66.a: "These hard times will pass, you will see"

 zorgo_event.67.t: "Hurt Feelings"
 zorgo_event.67.desc: "[random_dude_advisor.GetName] has accused [ROOT.GetCountry.GetGovernment.GetRuler.GetName] of some imagined slight, and is now rebuffing [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s efforts at peacemaking.\n\nIt seems like we have another enemy to worry about."
 zorgo_event.67.a: "This is terribly vexatious...I didn't even do anything"

 zorgo_event.68.t: "Aching For Adventure"
 zorgo_event.68.desc: "One morning, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is confronted by [heir.GetName], who is dressed as though [heir.GetSheHe] is getting ready to leave on a long journey.\n\n'An opportunity for me to travel with some trusted companions has arisen, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], and I intend to pursue it. Please, be gracious and allow me to leave [ROOT.GetCountry.GetName] - I want to see the world for myself before I have to stay here in [ROOT.GetCountry.GetCapital.GetName] and assume my duties.'"
 zorgo_event.68.a: "You may leave, but please be careful..."
 zorgo_event.68.b: "We need you here, at home, [heir.GetShortName] - you know this"

 zorgo_event.69.t: "A Moment To Myself"
 zorgo_event.69.desc: "Although the duties of ruling [ROOT.GetCountry.GetName] consume practically every hour of every day, there are still a few moments, rare as they might be, when [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is able to steal away for a day, leaving [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] duties for the morrow and retiring to a small home on the outskirts of [ROOT.GetCountry.GetCapital.GetName] for some peace and quiet.\n\nIt is here, away from the chaos and commotion of the capital, that [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is able to relax and think clearly."
 zorgo_event.69.a: "I shall return in a day or two with renewed vim and vigor"

 zorgo_event.70.t: "Horse Thieves"
 zorgo_event.70.desc: "Because it is known that [ROOT.GetCountry.GetAdjective] horses are some of the finest in the entire world, we occasionally must deal with raiders and bandits that target our stud farms, hoping to steal as many of the precious animals for themselves as they can.\n\nRegrettably, we must inform you that we recently suffered such an attack; a few lives were lost in [horses_stolen_from_here_scope.GetName], and a few prized beasts taken...I am sorry, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
 zorgo_event.70.a: "And I am sorry as well...what a terrible thing to happen"
 STATIC_MODIFIER_NAME_bad_slave_output_province_modifier: "Raided Settlement"

 zorgo_event.71.t: "Warriors From Abroad"
 zorgo_event.71.desc: "The strangest thing happened this morning near [ROOT.GetCountry.GetCapital.GetName]. Two cohorts of soldiers, dressed in tattered armor, with many of the men marching barefoot and nursing infected wounds, arrived at the gates of our capital, begging for sanctuary.\n\nThey speak of a great battle that took place to our north, where multiple armies clashed, and while these brave fighters survived, their country did not - utterly destroyed by their enemies. Now, they have nowhere to go and are desperately searching for a new home."
 zorgo_event.71.a: "We could always use experienced fighters in [ROOT.GetCountry.GetName]"

 zorgo_event.72.t: "The Barbarian Camp"
 zorgo_event.72.desc: "We keep hearing reports of barbarians that live beyond our [ROOT.GetCountry.GetAdjective] borders that are making life miserable for our people. Not only have they created a large camp somewhere in the mountains, but they even wait until our armies are away on campaign before they launch their attacks - it seems that they would rather murder innocent women and children instead of fight with honor, like real warriors.\n\nWe could dispatch some of our forces to take care of the problem for us, if you so choose."
 zorgo_event.72.a: "The people living near the border need to toughen up"
 zorgo_event.72.b: "I will lead our men into battle against them"
 we_will_start_marching_asap_tt: "#Y We march for the barbarian camp at dawn.#!"
 STATIC_MODIFIER_NAME_capital_barbarian_spawn_place: "Great Barbarian Stronghold"
 STATIC_MODIFIER_NAME_minor_barbarian_spawn_place: "Minor Barbarian Stronghold"
 STATIC_MODIFIER_NAME_generic_barbarian_spawn_place: "Barbarian Stronghold"

 zorgo_event.73.t: "The Barbarian Camp:Mountain Foothills"
 zorgo_event.73.desc: "We have been marching for the better part of a week, only resting for a few hours here and there, and it is starting to catch up with our men - [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has set an unrelenting pace, no doubt due to the fact that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is regretting leaving [ROOT.GetCountry.GetCapital.GetName] to accompany these warriors. Affairs in the capital city always require a delicate hand, and [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has been receiving daily reports from back home - it is obvious that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] wants to return as soon as possible, but our warriors are tired and it shows.\n\nDusk is creeping over the craggy foothills of the region where the barbarian camp is rumored to be, and a light snow is beginning to fall. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s horse is breathing heavily, sending puffs of steam in the cold mountain air."
 zorgo_event.73.a: "Press forward, ye men of [ROOT.GetCountry.GetName]!"
 zorgo_event.73.b: "We will make camp here in the foothills and attack tomorrow"
 zorgo_event.73.c: "Business in [ROOT.GetCountry.GetCapital.GetName] calls us home"
 we_camp_at_barbarians_tt: "#Y We will set up tents and sleep for a few hours...#!"
 we_wont_fight_the_barbarians_tt: "#Y We will abandon the mission and return home.#!"

 zorgo_event.74.t: "The Barbarian Camp:Ambush"
 zorgo_event.74.desc: "Even though our men are exhausted, marching through the evening has proven to be a wise course of action - it seems that the barbarians have caught wind of our forces and were planning to ambush us in the mountain passes.\n\nThanks to [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s diligence, however, we have turned the tables on our enemies and have caught them unprepared, in a scattered and unorganized state. The sight of our foes has reinvigorated our men, who are charging into the barbarian camp!"
 zorgo_event.74.a: "Seize our advantage! Attack, attack! Forward!"

 zorgo_event.75.t: "The Barbarian Camp:Night Battle"
 zorgo_event.75.desc: "The sound of screaming men jolts [ROOT.GetCountry.GetGovernment.GetRuler.GetName] from [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] slumber, and instincts take over immediately - within seconds, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is dressed in armor and standing outside, frantically scanning the horizon.\n\nThe barbarians, gods damn them, have launched a surprise attack! They have surrounded our camp and are pressing in on all sides - the air is already thick with missiles, and there is a sharp zipping sound as the arrows pierce the leather of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s tent. Thankfully, our watchmen saw them coming down the mountainside and were able to sound the alarm, but just barely.\n\nThe heavy thudding of hooves announces the charge of the enemy forces - battle is at hand!"
 zorgo_event.75.a: "For [ROOT.GetCountry.GetName]! Aaaarrrggghhh!"

 zorgo_event.76.t: "The Barbarian Camp:Challenge"
 zorgo_event.76.desc: "The battle at the barbarian camp has been bloody, with both sides settling into the familiar rhythm of violence, and it is hard to determine who has the upper hand in the desperate fighting.\n\nIn the center, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been leading the front line, hacking a gory path through the barbarian ranks. Suddenly, a carnyx bleats out a woeful sound, and a figure on horseback emerges from the barbarian throngs - it is their leader, the terrifying [barbarian_camp_leader.GetName].\n\nPointing a spear at [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], [barbarian_camp_leader.GetShortName] yells in a foreign tongue, and although the words are unintelligible, their meaning is not."
 zorgo_event.76.a: "Of course, I will duel you!"
 zorgo_event.76.b: "We shall not cross blades today, barbarian scum"
 zorgo_event.76.c: "Archers, concentrate your fire on Deimos!"
 the_barbarian_battle_continues_tt: "#Y The battle continues without glorious one-on-one combat...#!"
 coward_tooltip: "#Y This option is available because your Ruler is a coward.#!"
 # First name of the character created in zorgo_event.76
 Deimos: "Deimos"

 zorgo_event.77.t: "The Barbarian Camp:Duel"
 zorgo_event.77.desc: "[barbarian_camp_leader.GetName] charges forward, pounding his sword against his shield and screaming incoherently. With a speed that belies his size, the barbarian pounces on [ROOT.GetCountry.GetGovernment.GetRuler.GetName], with the tip of his cruel blade drawing the first blood.\n\nStepping back, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] curses, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] mind racing - there's no time to think!"
 zorgo_event.77.a: "Deimos is a tougher foe than I first thought but I won't give up"
 zorgo_event.77.b: "You disregard personal safety and attack wildly"
 zorgo_event.77.c: "Give my greetings to the gods of the underworld, Deimos"

 zorgo_event.78.t: "The Barbarian Camp:Conclusion"
 zorgo_event.78.desc: "All eyes are on [barbarian_camp_leader.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetName], who are locked in fierce combat - the sound of metal striking against metal fills the air, punctuated by the grunts and cries of the two combatants.\n\nSeeing an opportunity, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] lunges forward, swinging [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] sword with all of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] might. [barbarian_camp_leader.GetShortName]'s head is severed immediately, flying into the air with a magnificent stream of blood accompanying it. At this horrific sight, the barbarian formations collapse, and our [ROOT.GetCountry.GetAdjective] soldiers begin indescriminately slaughtering anyone in the vicinity."
 zorgo_event.78.a: "Destroy the barbarian camp!"

 zorgo_event.79.t: "The Barbarian Camp:Conclusion"
 zorgo_event.79.desc: "As was anticipated, our soldiers were able to destroy the barbarian forces arrayed against them - what were the savages thinking, meeting the men of [ROOT.GetCountry.GetName] in battle?\n\n[barbarian_camp_leader.GetName] was found writhing on the battlefield, a deep spear wound in his back, but [ROOT.GetCountry.GetGovernment.GetRuler.GetName] did not show clemency to the cowardly barbarian leader, executing him in full sight of the [ROOT.GetCountry.GetAdjective] army.\n\nThe barbarian camp was plundered before it was set ablaze, and our men began marching back to [ROOT.GetCountry.GetCapital.GetName], their knapsacks filled to bursting with the ill-gotten gains of the defeated raiders."
 zorgo_event.79.a: "And we will do the same to any who attack our people"

 zorgo_event.80.t: "The Barbarian Camp:Wealth Beyond Measure"
 zorgo_event.80.desc: "As the last of the barbarian redoubts were set to the torch, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] advisors were standing around with their hands on their heads, flabbergasted by what they had found.\n\nA massive sum of silver and gold talents were uncovered in twenty large chests - a fortune worthy of a king. Not only had they freed the [ROOT.GetCountry.GetAdjective] people from a roving menace, but they had also swelled the [ROOT.GetCountry.GetAdjective] treasury in one fell swoop."
 zorgo_event.80.a: "We will be sure to put this to good use"
 STATIC_MODIFIER_NAME_glorious_combat_barbarian: "Vanquished Barbarian Forces"

 zorgo_event.81.t: "Blighted Crops"
 zorgo_event.81.desc: "We are sorry to report that the harvest this year is going to be exceptionally bad - powdery mildew has been an awful problem lately in [bad_grain_province_scope.GetName], and we have had to destroy much of what was gathered."
 zorgo_event.81.a: "Curses!"
 STATIC_MODIFIER_NAME_blighted_crops_province_modifier: "Blighted Crops"

 zorgo_event.82.t: "Investment Opportunity"
 zorgo_event.82.desc: "A group of merchants have boldly approached [ROOT.GetCountry.GetGovernment.GetRuler.GetName], asking [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim] to set aside state funds in order to purchase a supply of myrrh at a discount rate. They want to raise a private fleet and sail it to the ports themselves, and if we help them and all goes well, then we will be able to double our money. What do you say?"
 zorgo_event.82.a: "We won't gamble with the treasury"
 zorgo_event.82.b: "No risk, no reward, right? Let's see what happens"
 zorgo_event.82.c: "Set aside a princely sum - we are going to be rich"

 zorgo_event.83.t: "Investment Opportunity:Bust"
 zorgo_event.83.desc: "Well, it's been well over a year since the trade ship with the discounted myrrh - this so-called 'amazing investment opportunity' that was presented to us - was supposed to return, so it is safe to say that it's never coming back.\n\nNeedless to say, any money that we invested was lost."
 zorgo_event.83.a: "I should have known! This always happens to me"

 zorgo_event.84.t: "Heavy Rains Near [ROOT.GetCountry.GetCapital.GetName]"
 zorgo_event.84.desc: "Although everyone is complaining about the near-constant rain, our farmers are thankful for the week-long storm that has been pouring over [ROOT.GetCountry.GetCapital.GetName]. We had been experiencing unseasonably warm weather, which in turn was causing the crops to wither and the fields to dry out - the rains have changed everything, however."
 zorgo_event.84.a: "Gods be praised!"

 zorgo_event.85.t: "The Sword Or The Bow?"
 zorgo_event.85.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been given the opportunity to train with [warrior_trainer.GetName], an impressive warrior who excels at all aspects of martial combat and is known to be a skilled teacher.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] must choose what the focus of this session will be."
 zorgo_event.85.a: "Show me a trick or two with the sword"
 zorgo_event.85.b: "I prefer attacking from a distance - the bow suits me"

 zorgo_event.86.t: "Investment Opportunity:Boom"
 zorgo_event.86.desc: "Unbelievable news! The investments we made have actually paid off, bringing [ROOT.GetCountry.GetName] a healthy profit - well done, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. The ships laden down with myrrh arrived in our ports a few days ago, and already we have sold off most of the cargo...we have made our initial sum back, with a healthy profit to show for our troubles."
 zorgo_event.86.a: "How delightful!"

 zorgo_event.87.t: "Investment Opportunity:Boom"
 zorgo_event.87.desc: "Unbelievable news! The investments we made have actually paid off, bringing [ROOT.GetCountry.GetName] a healthy profit - well done, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. The ships laden down with myrrh arrived in our ports a few days ago, and already we have sold off most of the cargo...we are making money hand over fist."
 zorgo_event.87.a: "What incredible news!"

 zorgo_event.88.t: "While I Have Your Ear..."
 zorgo_event.88.desc: "As [ROOT.GetCountry.GetName] prepares for an annual religious festival, [priest.GetName] has privately approached [ROOT.GetCountry.GetGovernment.GetRuler.GetName], offering to meet with our [ROOT.GetCountry.GetGovernment.GetRulerTitle] to privately pray together for the continued blessings of the gods.\n\n[priest.GetShortName] is an erudite figure, one known for [priest.GetHerHis] intimate knowledge of sundry philosophies, and, after some deliberation, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has worked up the nerve to ask for a personal favor."
 zorgo_event.88.a: "Teach me how to understand the minds of men"
 zorgo_event.88.b: "I need to understand the ways of the gods..."

 zorgo_event.89.t: "A Day At The Races"
 zorgo_event.89.desc: "In an attempt to increase [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] popularity with the masses, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has announced that a special chariot race will take place in one month's time in [ROOT.GetCountry.GetCapital.GetName].\n\nFree bread will be distributed to all that attend, and watered-down wine will be available for the low, low price of one coin per cup - the spectacle promises to be the event of the year."
 zorgo_event.89.a: "Come one, come all! Just remember who invited you"

 zorgo_event.90.t: "A Day At The Races: The Night Before"
 zorgo_event.90.desc: "It is the night before the big chariot race in [ROOT.GetCountry.GetCapital.GetName], and the bakeries all throughout the capital are filled with slaves that are churning out loaves for tomorrow. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is personally supervising the preparations when a red-faced baker, his tunic covered in flour, comes up and wrings his hands.\n\n'We are expecting many more people tomorrow than we originally anticipated, and there's a chance that we are going to run out of bread. I'm sorry to ask you, but we need more supplies.'"
 zorgo_event.90.a: "We can't afford to pay for anything extravagant"
 zorgo_event.90.b: "Anything that the people want, they will have"

 zorgo_event.91.t: "A Day At The Races: Arrival Of The Horsemen"
 zorgo_event.91.desc: "As the sun rises over [ROOT.GetCountry.GetCapital.GetName], the city streets are already filled with hundreds of people, all clamoring to find the best seats left at the stadium in the heart of town. Although there is no permanent structure built in the [ROOT.GetCountry.GetAdjective] capital for horse races, the Forum has been cleared of merchant stalls and wooden benches have been built to accommodate the crowds.\n\nAs the country's best riders proudly march into the Forum, dressed in their finest regalia, a loud cheer ripples through the crowd."
 zorgo_event.91.a: "How exciting all of this is!"

 zorgo_event.92.t: "A Day At The Races: A Friendly Wager"
 zorgo_event.92.desc: "All is in place, moments away from the race beginning, when [ROOT.GetCountry.GetGovernment.GetRuler.GetName] feels a light tap on [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] shoulder.\n\n'How would you like to make this event a little more interesting? I'll put up one hundred coins against yours...I have a feeling that my favored rider, Adonis, is going to win.'\n\nIt is [gambling_patriarch.GetName], a notorious gambler that is said to have crushing debts."
 zorgo_event.92.a: "I don't gamble, sorry..."
 zorgo_event.92.b: "I will match your wager; why not"

 zorgo_event.93.t: "A Day At The Races: A Friendly Wager"
 zorgo_event.93.desc: "The first event, a race between solitary riders, has finished, and although it was a nail-biter up until the last seconds, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s favored horseman won!\n\nSmirking to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] raises a fist into the air and screams in joy."
 zorgo_event.93.a: "I can't believe I won! This is amazing!"

 zorgo_event.94.t: "A Day At The Races: A Friendly Wager"
 zorgo_event.94.desc: "It goes without saying that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] chose literally the worst rider out of the lot, and [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] grits [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] teeth in anger as Adonis the Champion wins the event, galloping past all of the other riders to claim the crown of victory."
 zorgo_event.94.a: "Easy come, easy go...we will make more money one day"

 zorgo_event.95.t: "A Day At The Races: Conclusion"
 zorgo_event.95.desc: "The chariot race in [ROOT.GetCountry.GetCapital.GetName] will certainly go down in [ROOT.GetCountry.GetAdjective] history as one of the most action-packed events to ever take place in the capital; by all accounts, it was a complete success. The highlight was undoubtedly the final race, when Adonis the Champion lost control of his chariot, crashing in spectacular fashion before being trampled to death by a quadriga. All of the guests were impressed by the food and drink offered by the state, and the local merchants and innkeepers are ecstatic over the increased business. As the sun settles low on the horizon, bringing a conclusion to the event, an exhausted but exuberant [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is still feeling the excitement of the day, already longing for the next time that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] can return to the races!"
 zorgo_event.95.a: "I can't wait to get a horse of my own!"

 zorgo_event.96.t: "Increased Tensions On The Border"
 zorgo_event.96.desc: "Our spies report that [aggressive_neighbor.GetName] has been amassing a large invasionary force and have been probing our borders - we should prepare our men, because it seems like we might have a war on our hands, very soon.\n\nThese tensions have sent prices skyrocketing in [ROOT.GetCountry.GetCapital.GetName], unfortunately, as everyone is wondering if they should be preparing for a siege."
 zorgo_event.96.a: "We aren't afraid of anyone, especially the [aggressive_neighbor.GetAdjective] dogs"
 opinion_grave_insult: "Grave Insult"

 zorgo_event.97.t: "Funding Highway Bandits"
 zorgo_event.97.desc: "We have obtained overwhelming evidence that [aggressive_neighbor.GetName] has been paying bandits to prowl on our trade routes, attacking anyone and everyone that is headed into [ROOT.GetCountry.GetName]. It seems that they hope to disrupt our trade, hurting our tax incomes and making merchants scared to visit [ROOT.GetCountry.GetCapital.GetName].\n\nWhen we presented this information to their diplomats, there were fervent denials, but we don't believe the [aggressive_neighbor.GetAdjective] liars."
 zorgo_event.97.a: "Did you think we weren't going to find out? Do you take us for fools?"
 STATIC_MODIFIER_NAME_highway_bandits_modifier: "Trade Routes Harrassed By Bandits"

 zorgo_event.98.t: "Foreign Gifts"
 zorgo_event.98.desc: "In a wise attempt to earn the friendship of the [ROOT.GetCountry.GetAdjective] people, the ruler of [friendly_neighbor.GetName], [friendly_neighbor_ruler.GetName] has sent us a gift and a hand-written note, praising our harmonious relations and asking that the status quo be maintained when it comes to the status of our borders."
 zorgo_event.98.a: "That was nice of them, but make no promises"

 zorgo_event.99.t: "An Opportunity To Worship Together"
 zorgo_event.99.desc: "We have received a message from [friendly_neighbor.GetName], asking if we would grace them with some official [ROOT.GetCountry.GetAdjective] representatives at a religious festival that they are having in their capital city of [friendly_neighbor.GetCapital.GetName]. The [friendly_neighbor.GetAdjective] people are celebrating their harvest, and because they have been overwhelmingly blessed this year, want to extend the bounty of their gods to everyone around them."
 zorgo_event.99.a: "How very kind of them...yes, we will go"

 zorgo_event.100.t: "Tearing Down Fortifications"
 zorgo_event.100.desc: "Our scouts report that the government of [friendly_neighbor.GetName] is having acute financial difficulties, and in a desperate attempt to save every coin possible, they have begun the process of dismantling some of their border fortifications.\n\nWhile their larger fortresses remain garrisoned, the auxillaries have all been sent back to their villages...which presents us with opportunities, if we are ruthless enough to pursue them."
 zorgo_event.100.a: "Inform our generals of this blessing, and see what they want to do"

