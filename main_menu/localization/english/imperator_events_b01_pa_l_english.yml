 zorgo_event.101.t: "Going On A Hunt"
 zorgo_event.101.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] is hard at work at [ROOT.GetCountry.GetCapital.GetName], slowly drowning under a sea of important correspondences that needed to be addressed yesterday, when there is a firm knock on [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] door - it is [random_dude_hunter.GetName] and [random_dude_hunter_2.GetName], dressed in full hunting kit. Behind them in the courtyard, a scruffy pack of dogs are yapping and wrestling with each other, and there are about twenty people milling about, some on horseback but most standing on foot.\n\n'Apologies for disturbing you, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], but some of us are leaving to head out into the countryside for a few days. The festival dedicated to #high [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')]#! is almost here, and it is customary for us nobles to go hunting in honor of this sacred event. What do you say?'\n\nStaring down at the pile of work in front of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim], [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] stands up."
 zorgo_event.101.a: "Yes, that sounds wonderful - let us leave immediately"
 zorgo_event.101.b: "No, I am too busy to do this right now"
 end_event_tooltip_done: "This will end the current #Y Event#!."

 zorgo_event.102.t: "Going On A Hunt:A Day In The Country"
 zorgo_event.102.desc_1: "Now that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has agreed to join the hunt, it has been decided that the party will ride out to a hunting lodge that [random_dude_hunter.GetName] keeps near [randomized_country_province.GetName].\n\nThe pace is kept leisurely, and there are ample opportunities for conversation on the road. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] rides alongside [random_dude_hunter.GetName] and [random_dude_hunter_2.GetName], and the conversation runs the gamut of life experiences - childhood, marriage, battles fought and battles lost, the nature of the gods, the price of real estate in [ROOT.GetCountry.GetCapital.GetName] - anything and everything that can be discussed in polite society has been broached.\n\nWhen the party stops to make camp that evening, the discourse continues around a crackling fire, with wine and grilled meats keeping the atmosphere jovial. Despite knowing [random_dude_hunter.GetShortName] and [random_dude_hunter_2.GetShortName] for years, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] can't remember the last time that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] had such a lovely conversation."
 zorgo_event.102.desc_2: "Now that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has agreed to join the hunt, it has been decided that the party will ride out to a hunting lodge that [random_dude_hunter.GetName] keeps near [randomized_country_province.GetName].\n\nThere is a light rain falling, one that is more annoying than anything, and within moments everyone is soaked to their skin. Everyone bears this inconvenience stoically save [random_dude_hunter_2.GetName], who keeps cursing and casting dirty looks at [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]. Spitting loudly on the ground, [random_dude_hunter_2.GetShortName] raises [random_dude_hunter_2.GetHerHis] arms to the skies and swears again. Turning to face [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], [random_dude_hunter_2.GetShortName] points a finger and sneers.\n\n'Not a cloud in the sky when we left [ROOT.GetCountry.GetCapital.GetName], but now the heavens are pissing down on us - what have you done to anger [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')]? Perhaps you should have stayed home...'\n\nEveryone gasps at this shocking breach of decorum."
 zorgo_event.102.desc_3: "Now that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has agreed to join the hunt, it has been decided that the party will ride out to a hunting lodge that [random_dude_hunter.GetName] keeps near [randomized_country_province.GetName].\n\nOn the second day of the journey, the party is forging a small stream next to a forest when a bit of crumbling stone in the woods catches [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s eye. Moving closer to investigate, it appears that the [ROOT.GetCountry.GetGovernment.GetRulerTitle] has uncovered a shrine to a god, one that is covered in vines and clearly in a state of ruin. There are scattered pieces of marble and brick everywhere, and some of the pieces are scorched by fire.\n\n'I dare not guess what evil things occurred here.' [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] mutters grimly as everyone gathers around [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]. 'Yet I know that we are still within the borders of [ROOT.GetCountry.GetName], and the last time I checked, my word carries the weight of law. Dismount immediately, friends, for there is work to be done before we move on.'"
 zorgo_event.102.desc_4: "The party is barely a day's ride from [ROOT.GetCountry.GetCapital.GetName] when a party of riders, their mounts gasping and frothy with sweat, overtakes the hunters. The lead messenger looks relieved to have located the [ROOT.GetCountry.GetGovernment.GetRulerTitle].\n\n'Hail [ROOT.GetCountry.GetGovernment.GetRuler.GetName]! There are matters at the capital that require your personal touch - you must return immediately.'\n\nEveryone looks disappointed, but there is no chance that [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] will be able to go. Turning towards [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] men with a wistful look, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] waves a sad farewell and begins the journey back home."
 zorgo_event.102.a: "I never knew that you two were so interesting..."
 zorgo_event.102.b: "I am surprised you are speaking so freely - I will remember this"
 zorgo_event.102.c: "Let us restore the shrine for [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')]"
 zorgo_event.102.d: "Of course this happens to me...maybe next time"
 zorgo_event.102.e: "Perhaps you are right! This is foul weather indeed"

 zorgo_event.103.t: "Going On A Hunt:Morning At Camp"
 zorgo_event.103.desc_1: "After a week of traveling, everyone has arrived at [random_dude_hunter.GetName]'s hunting lodge, and the excitement in the air is palpable - everyone admits that life has been stressful lately in [ROOT.GetCountry.GetCapital.GetName], and this trip is a golden opportunity for everyone to relax and have a good time. The hunters make camp and settle down for the evening, agreeing to breakfast before the sunrise so that the hunt can coincide with the morning light.\n\nOf course, this was decided before [ROOT.GetCountry.GetGovernment.GetRuler.GetName] pulled out a jug of strong [ROOT.GetCountry.GetAdjective] wine around the campfire. The bottle was passed until it was drained, and then another, and then another, were produced, each meeting a similar fate to the first. Raucous laughter fills the camp and stories are swapped throughout the night. \n\nThe sun was barely peeking over the horizon when [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] crawled off to bed dead drunk, stuffing bits of grass in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] ears to shut out the morning birdsong."
 zorgo_event.103.desc_2: "After a week of traveling, everyone has arrived at [random_dude_hunter.GetName]'s hunting lodge, and the excitement in the air is palpable - everyone admits that life has been stressful lately in [ROOT.GetCountry.GetCapital.GetName], and this trip is a golden opportunity for everyone to relax and have a good time. The hunters make camp and settle down for the evening, agreeing to breakfast before the sunrise so that the hunt can coincide with the morning light.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetName] is the first to wake, feeling well rested, and wastes no time in rousing the others. Before long, the campfires have been stamped out, scraps of bread and cold meat have been quickly eaten, and the hunters depart into the forest."
 zorgo_event.103.desc_3: "After a week of traveling, everyone has arrived at [random_dude_hunter.GetName]'s hunting lodge, and the excitement in the air is palpable - everyone admits that life has been stressful lately in [ROOT.GetCountry.GetCapital.GetName], and this trip is a golden opportunity for everyone to relax and have a good time. The hunters make camp and settle down for the evening, agreeing to breakfast before the sunrise so that the hunt can coincide with the morning light.\n\nUnfortunately for everyone, the rains that began outside of the capital seem to have followed the party, and [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is unable to get good sleep because of the steady drizzling. Stepping outside of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] tent after a restless night, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] coughs raggedly, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] entire body shaking."
 zorgo_event.103.desc_4: "After a week of traveling, everyone has arrived at [random_dude_hunter.GetName]'s hunting lodge, and the excitement in the air is palpable - everyone admits that life has been stressful lately in [ROOT.GetCountry.GetCapital.GetName], and this trip is a golden opportunity for everyone to relax and have a good time. The hunters make camp and settle down for the evening, agreeing to breakfast before the sunrise so that the hunt can coincide with the morning light.\n\nDawn finds [ROOT.GetCountry.GetGovernment.GetRuler.GetName] stringing [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] bow when there is a loud rustling from the woods - quickly drawing an arrow and spinning around, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is surprised to see a group of soldiers dressed in [ROOT.GetCountry.GetAdjective] clothing leaving the forest.\n\n'Thank the gods that we found you, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] - we have been tracking your party for a week now. You must return to [ROOT.GetCountry.GetCapital.GetName] at once, for there has been a terrible accident - your primary heir, [zorgo_event_103_heir.GetName], was grievously wounded.'"
 zorgo_event.103.a: "Just give me...hic...a few hours and I'll be ready"
 zorgo_event.103.b: "And away we go!"
 zorgo_event.103.c: "I'm starting to feel poorly...ugh"
 zorgo_event.103.d: "We must return home immediately - we ride for [ROOT.GetCountry.GetCapital.GetName]!"

 zorgo_event.104.t: "Going On A Hunt:Deep In The Forest"
 zorgo_event.104.desc_1: "In the end, the only thing that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] would end up bringing home were more stories to be shared - it seems that [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] did not see fit to bless [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim] with a successful hunt today.\n\nStill, it wasn't a waste of time entirely and none of the other hunters fared any better, and everyone was cracking jokes back at camp about their bum luck. Soon, a roaring fire was filling the air with a crackling sound, and the hunters took turns describing the stags they had seen at the edge of fields, nimbly leaping away, or the bears lumbering through the brush. As the tales of bravado and daring increased, the laughter and revelry lasted long into the night."
 zorgo_event.104.desc_2: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] spent the better part of the day crawling through the thick and tangled brush of the backcountry, with nothing to show for the countless hours spent out deep in the forest. Laughably, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] even managed to somehow get separated from the others and quickly became lost - dusk was turning into night before [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] managed to reconnect with the rest of the hunters, who were desperately searching for the [ROOT.GetCountry.GetGovernment.GetRulerTitle].\n\nIrritated beyond words, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] gave the order to pack up and head home immediately."
 zorgo_event.104.desc_3: "Everyone who was there can attest that [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] was truly with [ROOT.GetCountry.GetGovernment.GetRuler.GetName] that day, for no one else was as lucky when it came to tracking and finding animals in the dark forests of [randomized_country_province.GetName]. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was able to bring down a large deer, and if not for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] fortunate aim, then no one would have had anything fresh to eat for dinner that night.\n\nHours later, with bellies filled with roasted stag and strong [ROOT.GetCountry.GetAdjective] wine, the hunters begin to praise their leader, offering toasts to [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s long rule over [ROOT.GetCountry.GetName]."
 zorgo_event.104.desc_4: "There is a loud, anguished bellow from the deer as [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s arrow sinks deep into its back, and the giant animal staggers and falls to the ground. Rushing over, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] delivers a killing blow and begins to yell for the others, laughing at the size of the creature that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] just felled.\n\nThe stag is gigantic, with a thick, shaggy coat that has seen many winters, and horns that are easily the length of a tall man. When the others see what [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has accomplished, they will be secretly envious, every man wishing that he had been blessed by [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] and gifted such a boastworthy prize."
 zorgo_event.104.desc_5: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been waiting for hours near a lake, eyes scanning the horizon for any sign of life, but there hasn't been a single animal that has come nearby all day. As the sun travels across the sky, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] grows more and more irritated, cursing [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] dumb luck.\n\nThe hunt ends in failure, and, disappointed, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] heads back to camp."
 zorgo_event.104.desc_6: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] is crawling through some bushes when [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] suddenly hears a loud roar - a bear! There is no time to draw a weapon before the animal grabs ahold of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s leg, and within moments, the [ROOT.GetCountry.GetGovernment.GetRulerTitle] of [ROOT.GetCountry.GetName] is in a desperate fight for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] life.\n\nThe only reason that [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] survived was because the other hunters heard [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] screaming and rushed over, but everyone can see that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is badly injured."
 zorgo_event.104.desc_7: "When [ROOT.GetCountry.GetGovernment.GetRuler.GetName] wakes up in camp later that evening, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] head is bandaged and [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] has no memories of the day. It is [random_dude_hunter.GetName] who has to tell [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] what happened.\n\n'You fell off of your horse, my [ROOT.GetCountry.GetGovernment.GetRulerTitle], and really bumped your head quite hard - praise be to [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] that you woke, for we thought you might not.'"
 zorgo_event.104.desc_8: "It has been hours since [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has last seen anyone else - [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is so deep in the woods that the canopy of the trees blocks the sunlight out entirely. The lonesome cry of a lone wolf in the distance hangs in the air, and a chill runs down [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]'s spine when [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] discovers a small hut in the gloomy darkness.\n\nApproaching the door with hand on hilt, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is greeted by an old crone, her eyes covered in bandages. Raising a shriveled hand, she cackles a toothless grin. 'I was expecting you, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. Give me one hundred coins and I will bless you in the name of [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')].'"
 zorgo_event.104.desc_9: "So far, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been unable to catch anything, spending more time retrieving arrows that missed their target than anything else. The day is starting to look like a bust, but despite this disappointing outcome, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is in a decent mood as [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] heads back to camp.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is walking through a shaded ravine when [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] makes a startling discovery - there, in a patch of sunlight, is the glimmer of gold! There is a broken amphora here with a small fortune."
 zorgo_event.104.desc_10: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has never seen anything like it before in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] life - there, at the edge of the lake, a white stag is drinking, its back turned to the hunter.\n\nReaching into [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] quiver, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] gently nocks an arrow, and with a prayer to [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] on [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] lips, the missile is loosened.\n\nSeconds later, the majestic beast falls dead to the ground - [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s arrow struck true. Walking over to the animal, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] offers another prayer of thanksgiving."
 zorgo_event.104.desc_11: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] is running at full speed, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] breath escaping in violent bursts - behind [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim], a pack of starving wolves is in hot pursuit and it seems that they are about to catch their prey.\n\nThe ground suddenly gives way, and [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] finds [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self tumbling down into a ravine, down towards the edge of a cliff. There is the snap of jaws overhead and angry howls, and the wolves leap down.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] rushes towards the precipice, already knowing what has to be done. A few seconds later, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is soaring through the air like a graceless bird, splashing into the river below after what seemed like an eternity. High above, the wolves howl in frustration as [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] floats away from the danger, breathless and terrified but alive."
 zorgo_event.104.desc_12: "Everyone has gathered back in the camp after a successful outing, and talk inevitably turns to who was the luckiest and best of the hunters.\n\nBy everyone's reckoning, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] came out on top, having taken three stags - it seems that [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] wanted the [ROOT.GetCountry.GetGovernment.GetRulerTitle] to have the lion's share of glory today."
 zorgo_event.104.desc_13: "Everyone in camp is in a grim mood, eating in their tents alone - after the day's tragic events, who can blame them?\n\nUnfortunately for [ROOT.GetCountry.GetGovernment.GetRuler.GetName], it seems that [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] wanted to punish the [ROOT.GetCountry.GetGovernment.GetRulerTitle], for there could be no logical explanation for what happened. A pack of wolves set upon [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], savagely attacking [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] face and nearly mauling [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim].\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] survived the attack, but not without losing [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] eyes..."
 zorgo_event.104.desc_14: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] is quietly following a stag, arrow drawn and focus entirely on the animal in front of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]. A few feet behind [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], [random_dude_hunter.GetName] is following, and the only sound in the forest is the busy murmuring of a small creek.\n\nThe stag, unaware of the mortal danger it is in, is lapping water from the stream calmly, and [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] crouches over, a few moments away from firing at [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] prey.\n\nWithout warning, there is a flash of steel and a sharp pain, and all is dark."
 zorgo_event.104.a: "You didn't kill two bears, [random_dude_hunter.GetShortName]! You're full of it"
 zorgo_event.104.b: "What a waste of time this turned out to be"
 zorgo_event.104.c: "I will live every day with the [ROOT.GetCountry.GetAdjective] people's wellbeing in mind"
 zorgo_event.104.d: "That wasn't luck - what you saw is skill, my friends"
 zorgo_event.104.e: "So it goes sometimes..."
 zorgo_event.104.f: "Water...cough...someone bring me water"
 zorgo_event.104.g: "Good gods, that was a close one!"
 zorgo_event.104.h: "Give me your blessing, and then I am on my way"
 zorgo_event.104.i: "What an unbelievable find!"
 zorgo_event.104.j: "What a glorious prize you have gifted to your servant - I thank you"
 zorgo_event.104.k: "Phew...that was close"
 zorgo_event.104.l: "Maybe next time, everyone else will do better"
 zorgo_event.104.m: "This is a tragedy, a disaster!"
 zorgo_event.104.n: "How could this happen..."
 STATIC_MODIFIER_NAME_blessing_of_the_hunter_witch: "Blessings of the Old Crone"

 zorgo_event.105.t: "Going On A Hunt:Returning Home"
 zorgo_event.105.desc_1: "Everyone was in a decent mood riding back home to [ROOT.GetCountry.GetCapital.GetName], enjoying a few moments of silence as they made their way along the roads, and before long, the gates of the capital were visible in the distance."
 zorgo_event.105.desc_2: "The trip back home to [ROOT.GetCountry.GetCapital.GetName] was uneventful, if not somewhat enjoyable - the weather was pleasant on the way, and the locals in [randomized_country_province.GetName] came out to wave and cheer when [ROOT.GetCountry.GetGovernment.GetRuler.GetName] passed by their villages.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], who was feeling cheerful and upbeat that evening, was more than happy to play up the part of a [ROOT.GetCountry.GetGovernment.GetRulerTitle], taking the time to greet the citizens of [ROOT.GetCountry.GetName] as [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] rode by. It was the perfect way to end the hunting excursion, and a gentle way for [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] to begin easing back into [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] official duties."
 zorgo_event.105.desc_3: "As the party was headed home to [ROOT.GetCountry.GetCapital.GetName], the conversation between [random_dude_hunter_2.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetName] turned to matters of governance, for it is no secret that [random_dude_hunter_2.GetShortName] is interested in all things pertaining to running the [ROOT.GetCountry.GetAdjective] state.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was more than happy to indulge the request for detailed conversation, and those watching the two discuss could see the bonds of friendship growing stronger between them."
 zorgo_event.105.desc_4: "Everything was going well on the return trip to [ROOT.GetCountry.GetCapital.GetName] until night fell, and with the capital being so close, everyone's guard was down and no one was really paying attention.\n\nWithout warning, a party of bandits fell upon the hunters, and although the warriors overcame the robbers and drove them off, it was at a great cost - there, lying in the street covered in blood, was the body of [random_dude_hunter.GetName]."
 zorgo_event.105.a: "Home again at last - thanks for inviting me, lads"
 zorgo_event.105.b: "I am blessed beyond measure to have such loyal and loving countrymen"
 zorgo_event.105.c: "If you ever have any other questions, [random_dude_hunter_2.GetShortName], feel free to ask"
 zorgo_event.105.d: "Oh no...this can't be!"

 zorgo_event.106.t: "Going On A Hunt:Conclusion"
 zorgo_event.106.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has returned back to [ROOT.GetCountry.GetCapital.GetName], and within a few days, all of polite society has heard about everything that happened on the trip - but this is to be expected, of course. Still, despite the wagging tongues of gossiping hunters, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] isn't too upset, and is in a magnanimous mood as [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] slaves began to heat up water.\n\nAn hour or so later, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is enjoying a hot bath and a glass of wine in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] private chambers, musing over the events of the last month."
 zorgo_event.106.a: "I should thank [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] for bringing me home safely"

 zorgo_event.107.t: "Diplomats Attacked"
 zorgo_event.107.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], we regret to inform you that some messengers that we sent out from [ROOT.GetCountry.GetName] were attacked by bandits on the road leading out from [ROOT.GetCountry.GetCapital.GetName].\n\nThankfully, our diplomats survived the attack, but they are understandably terrified of traveling now."
 zorgo_event.107.a: "This is frustating..."

 zorgo_event.108.t: "Master Of Diplomacy"
 zorgo_event.108.desc: "Everyone acknowledges that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is an undisputed master of negotiation, able to bend the ears of diplomats to get our [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] way. Truly, our [ROOT.GetCountry.GetName] has never before had such a skillful statesman as a leader."
 zorgo_event.108.a: "I live but to serve the people"

 zorgo_event.109.t: "Paying Old Debts"
 zorgo_event.109.desc: "We are pleased to tell you that we received some back taxes that were owed to us.\n\nWhile we regret that it took so long to receive what is rightfully ours, at least our citizens are mindful of what they owe to the [ROOT.GetCountry.GetAdjective] state."
 zorgo_event.109.a: "Better late than never, they say..."

 zorgo_event.110.t: "The Talk of [ROOT.GetCountry.GetCapital.GetName]"
 zorgo_event.110.desc: "The Festival dedicated to [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')], which takes place in [ROOT.GetCountry.GetCapital.GetName] every five years, has drawn to a close, and those who traveled to the capital for the celebrations have been praising the generosity of [ROOT.GetCountry.GetGovernment.GetRuler.GetName] nonstop.\n\nThe harvests were spectacular this year, and the bounty of our fields was shared with everyone. Our people return home with their hearts and stomachs full, praising the gods and the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 zorgo_event.110.a: "I look forward to this event every year"

 zorgo_event.111.t: "Holy Well Water Shortage"
 zorgo_event.111.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], we have received a disturbing report - it seems that the water that is in our holy wells near [ROOT.GetCountry.GetCapital.GetName] are drying up.\n\nThis is a terrible omen for the [ROOT.GetCountry.GetAdjective] people, and word is quickly spreading about what is happening...I am sorry. It seems that we have incurred some divine displeasure somehow."
 #P:A TODO New text: Imperator named this option zorgo_event.11.a, the "outlaw silk clothing" text of zorgo_event.11, by mistake; placeholder written for the import
 zorgo_event.111.a: "A terrible omen indeed..."

 zorgo_event.112.t: "Overflowing Holy Wells"
 zorgo_event.112.desc: "My [ROOT.GetCountry.GetGovernment.GetRulerTitle], you will not believe what is happening near [ROOT.GetCountry.GetCapital.GetName]! It seems that the holy wells that are so dear to our people are overflowing - the water cannot be contained, and it gushes without unceasing.\n\nThe people are overjoyed! We have never had such a thing happen before in [ROOT.GetCountry.GetName] - what could this possibly mean?"
 zorgo_event.112.a: "This is a sign that what I am doing is right"

 zorgo_event.113.t: "Damaged Nuraghe Needs Repair"
 zorgo_event.113.desc: "The locals near [ROOT.GetCountry.GetCapital.GetName] are reporting that the nuraghe closest to the capital is showing visible signs of disrepair, with larger cracks threatening to permanently damage the structure.\n\nIt has been requested that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] do anything and everything that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] can to fix this problem - it is viewed as a sign of disrespect to [ROOT.GetCountry.Custom('pa_imp_get_harvest_goddess')] if we leave this matter unattended."
 zorgo_event.113.a: "Of course we are going to take care of this!"
 zorgo_event.113.b: "We don't have the budget for this, I'm afraid"

 zorgo_event.114.t: "A Visit To The Temple Of Sid Addir"
 zorgo_event.114.desc: "It has been proposed that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] pay a visit to the temple of #high Sid Addir#!, the god of the warrior and protector of the farms. Sid Addir must receive the offerings of the [ROOT.GetCountry.GetAdjective] people in order to ensure that we are blessed in the years ahead.\n\nSuch an important responsibility belongs to [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], and all eyes are on [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]."
 zorgo_event.114.a: "It is my duty to go, and I look forward to it - we leave at dawn"
 zorgo_event.114.b: "I am unfortunately too busy right now and have no time for this"
 me_fezzani_29.a.tt: "This will end the event chain."

 zorgo_event.115.t: "The Temple of Sid Addir"
 zorgo_event.115.desc: "After a short week of traveling, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has finally reached the temple of Sid Addir, one of the most ancient and holy places in all of [ROOT.GetCountry.GetName].\n\nAfter ritually purifying [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]self, the [ROOT.GetCountry.GetGovernment.GetRulerTitle] entered the shrine to Sid Addir and remained for hours in silent contemplation.\n\nAs the sun was beginning to hide behind the treeline in the distance, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] emerged from the temple to find a few priests outside, their presence intentional and immediately understood."
 zorgo_event.115.a: "We shall leave a votive offering and ask for blessings"
 zorgo_event.115.b: "At this moment, we cannot afford to leave a gift here"

 STATIC_MODIFIER_NAME_sabine_take_women: "Repatriated Stolen Women"
 STATIC_MODIFIER_NAME_sabine_take_revenge: "Revenge for the Rape of the Sabine Women"

 zorgo_event.118.t: "Scholar of the Divine"
 zorgo_event.118.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], we have received a report from a local magistrate that you should hear about; last week, our border guards encountered a famous sadhu that was leaving [ROOT.GetCountry.GetCapital.GetName] on a pilgrimage to the [GetCountry('MRY').GetAdjective] holy sites, followed by a crowd of hundreds of people.\n\nThis wanderer, a sage named [izn_divine_scholar.GetName] that is known all throughout [ROOT.GetCountry.GetName] for his piety, is said to be leaving [ROOT.GetCountry.GetCapital.GetName] to study the many religions of [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] in hopes of gleaning a universal truth, but there is a slight problem; [izn_divine_scholar.GetShortName] is much loved by the citizens in our capital and a spirit of sadness has overtaken them, for they do not wish to see the wise man depart from our country.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], perhaps you have something to say about the matter?"
 zorgo_event.118.a: "Ask Izn to join my court, for we should all learn from his wisdom"
 zorgo_event.118.b: "Perhaps this wise man will teach me something before he leaves?"
 zorgo_event.118.c: "Arrest him if he tries to leave the borders"
 Izn: "Izn"

 me_zorgoomni.31_title: "A Raid On Our Neighbors"
 me_zorgoomni.31_desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has heard the call of glory and wants to personally lead some of our warriors on a raid into the lands of our enemies. The omens have spoken clearly, and [recipient.GetName] would be an easy target for our men to despoil - we have nothing to fear!"
 me_zorgoomni.31.a: "The time has come to teach [recipient.GetName] a lesson"
 me_zorgoomni.31.b: "On second thought, I do not have time for this"
 me_zorgoomni.31_tooltip1: "#Y Our Ruler will leave with our raiders immediately!#!"
 me_zorgoomni.31_tooltip2: "#Y This will end the current event chain.#!"

 me_zorgoomni.32_title: "The Raid Into [recipient.GetName]"
 me_zorgoomni.32.t: "I will die with sword in hand! Aaarrrggghhh!"
 me_zorgoomni.32_desc_1: "The gods were with [ROOT.GetCountry.GetGovernment.GetRuler.GetName] when [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] lead the raiding party into [recipient.GetName], for the [ROOT.GetCountry.GetAdjective] warriors were able to slip pass the [recipient.GetAdjective] border guards undetected. Our men were able to plunder many small villages without any resistance from an organized force, and our warriors stole as much gold and silver from the people of [recipient.GetName] as they could carry.\n\nStores of grain, religious statues carved out of ivory and silver, luxurious furs, and even horses and slaves were taken as prizes - anything that was not taken away was set to the torch. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] returned home to [ROOT.GetCountry.GetCapital.GetName] at the head of a triumphant party that had tripled in size, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] saddlebags filled to bursting with all manner of ill-gotten gains."
 me_zorgoomni.32_desc_2: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] was able to lead the raiders from [ROOT.GetCountry.GetCapital.GetName] into the hinterlands of [recipient.GetName] without encountering any major resistance - the few unlucky border guards that crossed our paths were quickly sent to whatever gods they believed in.\n\nThe raid itself was quick and methodical, and our warriors wasted no time in spreading out and setting farms and towns to the torch. Civilians were struck down in the streets of their villages, and our soldiers carried off as much wealth as they could carry."
 me_zorgoomni.32_desc_3: "Our warriors were able to avoid the border guards of [recipient.GetName] without any problems and soon found themselves on the outskirts of a small but wealthy village - the buildings were made of brick and there were religious shrines made of marble in the center of a humble square.\n\nBy the time that the [recipient.GetAdjective] guards had any idea that their towns were being raided, our soldiers were already crossing back into [ROOT.GetCountry.GetName], having killed any in our way that would have raised an alarm."
 me_zorgoomni.32_desc_4: "Although we did not encounter any [recipient.GetAdjective] levies on our raid, our warriors did not find as much treasure as they had hoped for - the region seemed to be devoid of all wealth, picked over like a carcass on the steppe. [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was a little disappointed in the results of the raid, but none of our [ROOT.GetCountry.GetAdjective] kinsmen were hurt or injured and we were able to steal from a few small farms."
 me_zorgoomni.32_desc_5: "Our warriors were able to raid a few tiny farms on the border between [ROOT.GetCountry.GetName] and [recipient.GetName], but the unexpected arrival of [recipient.GetAdjective] levies caused [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to call for a full retreat - the [ROOT.GetCountry.GetGovernment.GetRulerTitle] could not afford to lose any experienced soldiers, and the men had taken enough to satisfy themselves."
 me_zorgoomni.32_desc_6: "A few hours after [ROOT.GetCountry.GetGovernment.GetRuler.GetName] left [ROOT.GetCountry.GetCapital.GetName] at the head of a raiding party, the weather had turned sour; a blistering rain storm appeared out of nowhere and refused to let up in its assault. Moods immediately darkened and travel became a miserable endeavor, and when it became apparent that it was only going to continue to get worse, everyone decided they would just rather go back to [ROOT.GetCountry.GetName]."
 me_zorgoomni.32_desc_7: "Unfortunately for the raiders, they were not able to loot the countryside, for almost immediately upon crossing into [recipient.GetName], [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] men were attacked by ferocious [recipient.GetAdjective] soldiers on horseback.\n\nThankfully for [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] prevailed in this desperate battle thanks to personal feats of glory - the [ROOT.GetCountry.GetGovernment.GetRulerTitle] killed three times as many as all others, causing many to look at [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] in awe."
 me_zorgoomni.32_desc_8: "The gods were not with [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] raiders, for a large group of [recipient.GetAdjective] soldiers set upon the [ROOT.GetCountry.GetGovernment.GetRulerTitle] as soon as the [ROOT.GetCountry.GetAdjective] soldiers crossed the border.\n\nDozens of our men fell within seconds, pierced by countless arrows, and [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was shot in the thigh - a painful wound that made it difficult for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim] to ride and fight.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was separated from the riders by the enemy, but was able to eventually cross back into [ROOT.GetCountry.GetName] with [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] life - something that not all of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] companions could say."
 me_zorgoomni.32_desc_9: "In a disaster for [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] raiders were attacked by a large force of [recipient.GetAdjective] guards, who slew many of our countrymen and took our [ROOT.GetCountry.GetGovernment.GetRulerTitle] prisoner.\n\nWhen the identity of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was discovered, the soldiers of [recipient.GetName] beat [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim] with a savage cruelty that nearly ended [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] life, and it was only with gold and promises that [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was released alive."
 me_zorgoomni.32_desc_10: "At first, it seemed that the raiders under [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s lead had managed to slip across the border between [ROOT.GetCountry.GetName] and [recipient.GetName] without being seen, but a couple of hours later, the [ROOT.GetCountry.GetAdjective] warriors found themselves in a trap. The road narrowed down to meet a small bridge at the edge of a stream, and it was here that the [recipient.GetAdjective] launched an ambush that forced the [ROOT.GetCountry.GetAdjective] raiders down into the water.\n\nAs dozens of arrows whizzed past [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] head, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] felt an overwhelming fear take ahold of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim], a paralyzing stupor that made [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] limbs freeze up; I'm about to die.\n\nWhen the end came, it was brutal."
 me_zorgoomni.32_desc_11: "Our raid into [recipient.GetName] could not have gone any better; [ROOT.GetCountry.GetGovernment.GetRuler.GetName] captured multiple slaves, slew dozens of [recipient.GetAdjective] soldiers, and put the fear of the [ROOT.GetCountry.GetAdjective]s into the hearts of locals. We didn't even lose a single warrior in battle, either."
 me_zorgoomni.32_desc_12: "The raid into [recipient.GetName] was moderately successful in the beginning, as our warriors were able to plunder farms and even capture a slave for [ROOT.GetCountry.GetCapital.GetName].\n\nYet the enemy had the last laugh. On the return trip back home to [ROOT.GetCountry.GetName], a group of [recipient.GetAdjective] warriors that had followed [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] men ambushed the [ROOT.GetCountry.GetAdjective] raiders when they were fording a river, launching a blistering attack that temporarily overwhelmed them. Our raiders were able to fight them off, thankfully, but [ROOT.GetCountry.GetGovernment.GetRuler.GetName] took an arrow in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] sword arm and was seriously injured."
 me_zorgoomni.32_desc_13: "The raid into [recipient.GetName] was not as easy as [ROOT.GetCountry.GetGovernment.GetRuler.GetName] would have liked; even though our men were able to attack some minor settlements and steal some gold, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was pinned down by some archers and took an arrow in the thigh - not a devastating wound, but not an inconsequential one. Grimacing in pain, the [ROOT.GetCountry.GetGovernment.GetRulerTitle] raised a blood-soaked sword into the air and yelled for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] warriors to retreat."
 me_zorgoomni.32_desc_14: "The raid into [recipient.GetName] was going exceptionally well until it wasn't - the [ROOT.GetCountry.GetAdjective] raiders had filled their saddlebags to bursting and were leisurely heading back to [ROOT.GetCountry.GetCapital.GetName] when a warband of [recipient.GetAdjective] cavalry caught up with them.\n\nDespite the efforts of [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to lead a retreat, the [ROOT.GetCountry.GetGovernment.GetRulerTitle] was surrounded by the enemy and seriously wounded. Realizing that [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was in mortal danger, the [ROOT.GetCountry.GetAdjective] raiders rallied around their leader, driving off the horsemen and saving [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] life."
 me_zorgoomni.32_desc_15: "Bad omens accompanied the raiding party from the moment that they left the protection of the [ROOT.GetCountry.GetAdjective] capital; it rained the entire time that the warriors traveled, and many of the men started to catch sick in the harsh conditions.\n\nBy the time that the raiders reached the borders of [recipient.GetName], everyone was in a foul mood and not alert as they should have been. It was precisely at this moment that a barrage of arrows ripped through the [ROOT.GetCountry.GetAdjective] party, and [ROOT.GetCountry.GetGovernment.GetRuler.GetName] had the great misfortune of taking an arrow in the eye. Falling to the ground as though dead, it was with great effort that the raiders were able to drag the comatose body of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] to safety. Hours later, gods be praised, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] awoke, but never again would [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] be the same."
 me_zorgoomni.32_desc_16: "While the gold and silver taken from [recipient.GetName] was adequate, the warriors of [ROOT.GetCountry.GetName] could not stop praising the heroic feats displayed by the unstoppable [ROOT.GetCountry.GetGovernment.GetRuler.GetName] during the raid.\n\nAt one point during the attack, a large group of [recipient.GetAdjective] reinforcements arrived from out of nowhere, threatening to send the raiders into a panic, but the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetRulerTitle] was undaunted and charged straight into their ranks, killing two men at once and maiming another.\n\nThe tide of the battle was turned, and the warriors were able to return home to [ROOT.GetCountry.GetCapital.GetName] with their lives and their saddlebags a little heavier than they were before."
 me_zorgoomni.32_desc_17: "After an uneventful week of traveling from [ROOT.GetCountry.GetCapital.GetName], the [ROOT.GetCountry.GetAdjective] raiders crossed the border into [recipient.GetName] with visions of ill-gotten gains dancing through their heads. It came as quite a shock, then, when they party of warriors came across a [recipient.GetAdjective] levy training in the wilderness.\n\nOutnumbered ten to one, the raiders were forced to fight their way back to safety, but many of the men, fearing for their lives, threw their weapons to the ground and rode for the hills, abandoning their brethren to their deaths.\n\nAll would have been lost if not for the bold leadership of [ROOT.GetCountry.GetGovernment.GetRuler.GetName], who charged towards the enemy in order to buy [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] men some time. With a [ROOT.GetCountry.GetAdjective] battlecry on [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] lips, the [ROOT.GetCountry.GetGovernment.GetRulerTitle] hacked [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] way through the [recipient.GetAdjective] soldiers and sent them retreating from the battlefield, saving the day and allowing the raiding party to escape."
 me_zorgoomni.32_desc_18: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] had every intention of attacking [recipient.GetAdjective] settlements and carrying back slaves and plunder to [ROOT.GetCountry.GetCapital.GetName], but once the [ROOT.GetCountry.GetAdjective] raiders crossed the border into [recipient.GetName], they ran into a large warband led by none other than [recipient.GetGovernment.GetRuler.GetName] - the bandits were outnumbered three to one.\n\nSensing that this was not a friendly visit, the warriors led by [recipient.GetGovernment.GetRuler.GetShortName] launched a ferocious attack against the [ROOT.GetCountry.GetAdjective]s, slaying dozens immediately and wounding several others. Screaming in abject terror, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] threw [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] weapon to the ground and immediately ran from the battlefield, leaving dozens of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] brethren to be cut down by the [recipient.GetAdjective]s."
 me_zorgoomni.32_desc_19: "The raid into [recipient.GetName] was stopped by [recipient.GetAdjective] levies, who were seemingly waiting for the [ROOT.GetCountry.GetAdjective] warriors as soon as they slipped across the border. Once [ROOT.GetCountry.GetGovernment.GetRuler.GetName] realized that [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] men would be returning to [ROOT.GetCountry.GetName] empty-handed, the furious [ROOT.GetCountry.GetGovernment.GetRulerTitle] gave the order to show no mercy and kill everyone present.\n\nHours later, the fields were stained red with the blood of fallen [recipient.GetAdjective] soldiers, and a triumphant [ROOT.GetCountry.GetGovernment.GetRuler.GetName] signaled for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] warriors to return home."
 me_zorgoomni.32_desc_20: "Although the raiders that left [ROOT.GetCountry.GetName] were filled with confidence in their own abilities to plunder, Fate had marked [ROOT.GetCountry.GetGovernment.GetRuler.GetName] for death; the [ROOT.GetCountry.GetAdjective] warriors had barely crossed the border into [recipient.GetName] when they were set upon by a force five times their size.\n\nRealizing that [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] would not be returning home to [ROOT.GetCountry.GetCapital.GetName], the [ROOT.GetCountry.GetGovernment.GetRulerTitle] made [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] peace with [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] gods and charged bravely into the enemy."
 me_zorgoomni.32.a: "All hail the masterful raider [ROOT.GetCountry.GetGovernment.GetRuler.GetName]!"
 me_zorgoomni.32.b: "Another victory for [ROOT.GetCountry.GetName]!"
 me_zorgoomni.32.c: "We are untouchable!"
 me_zorgoomni.32.d: "It was fun getting out of [ROOT.GetCountry.GetCapital.GetName] for a while"
 me_zorgoomni.32.e: "There is no need for a pitched battle - return to [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.f: "What a cursed waste of time!"
 me_zorgoomni.32.g: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is truly a skilled fighter!"
 me_zorgoomni.32.h: "It was a mistake to leave [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.i: "I am lucky to have survived, but I don't feel very lucky..."
 me_zorgoomni.32.j: "What an absolute disaster for [ROOT.GetCountry.GetName]!"
 me_zorgoomni.32.k: "I spit in the face of [recipient.GetGovernment.GetRuler.GetName] and [recipient.GetGovernment.GetRuler.GetHerHis] armies"
 me_zorgoomni.32.l: "A curse upon the [recipient.GetAdjective]s!"
 me_zorgoomni.32.m: "We must return to the safety of [ROOT.GetCountry.GetName]!"
 me_zorgoomni.32.n: "I feel dizzy..."
 me_zorgoomni.32.o: "Bah! I should have never left [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.p: "I will destroy any that stand in the way of victory!"
 me_zorgoomni.32.q: "I would gladly do it all again to save my warriors"
 me_zorgoomni.32.r: "I am lucky to have escaped with my life!"
 me_zorgoomni.32.s: "Battlefield experience can be more valuable than gold"
 me_zorgoomni.32_tooltip: "#Y This will end the current event chain.#!"

 me_zorgoomni.33_title: "Cross Border Raid"
 me_zorgoomni.33_desc: "My [ROOT.GetCountry.GetGovernment.GetRulerTitle], we have terrible news to report from [this_province_was_raided_scope.GetName]. Last night, a cohort of warriors from [nomadic_raid_country.GetName] slipped across our border and launched a surprise raid on the unsuspecting locals. It is known that the [nomadic_raid_country.GetAdjective] raiders killed some of our people and plundered their land, carting off whatever they could carry and burning everything that they could not.\n\nYou should know that these bandits were personally led by [nomadic_raid_country.GetGovernment.GetRuler.GetName] in a brazen sign of disrespect to the people of [ROOT.GetCountry.GetName]."
 me_zorgoomni.33.a: "What! This is practically a declaration of war!"
 STATIC_MODIFIER_NAME_looted_by_enemies: "Raided Province"
 STATIC_MODIFIER_DESC_looted_by_enemies: "This province was raided and looted by a neighboring tribe."
 raided_by_neighbors: "Raided Our Territory"

 me_zorgoomni.34_title: "Cross Border Raid"
 me_zorgoomni.34_desc: "My [ROOT.GetCountry.GetGovernment.GetRulerTitle], we have both terrible and good news to report from [this_province_was_raided_scope.GetName], but first, the bad.\n\nLast night, a cohort of warriors from [nomadic_raid_country.GetName] slipped across our border and launched a surprise raid on the unsuspecting locals. Unfortunately, the treacherous [nomadic_raid_country.GetAdjective] raiders killed some of our people and plundered their land, carting off whatever they could carry and burning everything that they could not. And what is worse - you should know that these bandits were personally led by [nomadic_raid_country.GetGovernment.GetRulerTitle] [nomadic_raid_country.GetGovernment.GetRuler.GetName] in a brazen sign of disrespect to the people of [ROOT.GetCountry.GetName].\n\nBut the gods of war were with us, for the treacherous [nomadic_raid_country.GetGovernment.GetRuler.GetShortName] was actually slain in battle by our warriors! The foolish [nomadic_raid_country.GetAdjective] [nomadic_raid_country.GetGovernment.GetRuler.GetShortName] was chased down by three of our soldiers and shown no mercy."
 me_zorgoomni.34.a: "We will destroy anyone that thinks they can raid [ROOT.GetCountry.GetName]!"
 me_zorgoomni.34_tooltip: "'#Y Cross Border Raid#!' has now been #G Completed#!!"

 flavor_germanics.6.t: "The Sacred Grove of Mannus"
 flavor_germanics.6.desc: "Once again it is time, the sacrifice to Mannus will happen tonight. As always we are fettered, showing our submission to our great God. Luckily, no one fell down this time - a good omen. Last year the son of the shaman had to roll himself out on the floor, after he fell down. The past year brought us many storms and the harvest was bad. This was surely caused by the clumsy youth! \n\nThis year's sacrifice stands proud in the middle of the sacred ground, bound to the old oak behind him. His features are barely recognizable, for the sun's last rays of the day blind me, Mannus' will hiding him from my sight. Already the Shaman approaches the victim, pressing the knife's edge to his chest, provoking the first droplets of blood to drop on the oak sapling beneath him. Heis lifeblood will renew the forests and earth. To safeguard our communities and better our harvests, he is offered to Mannus. Now, the blade is piercing his heart, his last breath cursing us, yet igniting the fire of life. \n\nAlready, the birds have begun to sing and rejoice, filling the void left by the sacrifices death."
 flavor_germanics.6.a: "Mannus, grant us strength!"
 flavor_germanics.6.b: "Oppose the ritual."
 STATIC_MODIFIER_NAME_priests_refusing_to_perform_rites: "Priests in Disarray"
 STATIC_MODIFIER_DESC_priests_refusing_to_perform_rites: "Our holy men are refusing to perform rites. This is somewhat embarrassing."

 flavor_germanics.7.t: "Nerthuz's Wagon into the Deeps"
 flavor_germanics.7.desc: "It is time for our priest to ride Nerthuz's wagon again, the time for war is over. The sword shall be replaced by the plough, the fertile earth seeded with grains. When Nerthuz visits our homes, there will be more children, the fertility of the women is grander than before. They all are blessed by Her voyage over the land, until she tires of it. Her first servant will follow his mistress to her domain in the ocean. There, the priest will encase the wagon again, after the slaves washed the wagon and ornated it with flowers and gold. Thereafter, the slaves are devoured by the ocean, the last sacrifice to Nerthuz, until she wakes once more and blesses the lands with Her presence."
 flavor_germanics.7.a: "Nerthuz, bless us!"
 flavor_germanics.7.b: "Stop the Priest!"

 flavor_germanics.13.t: "Nehalennia's Ship"
 flavor_germanics.13.desc: "Nehalennia, we thank you for a year of fertile soil, women and harvest. Many children were born, blessed with healthy limbs and spirit. The crops grew aplenty, for this we thank your priest, who brought you to us many seasons ago. We thank you for the protection of the living against evil spirits and the protection of the dead until they arrive in the afterlife. This perilous road into the kingdom of the dead, you safeguard. Your ship carries them all and brings the newborn to the wombs of the mothers. We thank you Nehelennia for hearing our pleas and we thank you for fulfilling them."
 flavor_germanics.13.a: "Nehelennia be praised!"

 STATIC_MODIFIER_NAME_dog_loved: "Dog"
 STATIC_MODIFIER_DESC_dog_loved: "A dog follows you around, uplifting your spirits."
