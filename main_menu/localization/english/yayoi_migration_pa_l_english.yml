 introduce_rice_desc:0 "Replace the raw material in an eligible Japanese location with rice, restarting its RGO development."
 YAYOI_MIGRATION_OVERVIEW:0 "The Yayoi Migration"
 YAYOI_MIGRATION_OVERVIEW_DESC:0 "Wet-rice farming and migration from the Korean peninsula transform communities across Japan. Use the actions below to establish settlements, invite migrants, press claims on neighboring provinces, and introduce rice cultivation."
