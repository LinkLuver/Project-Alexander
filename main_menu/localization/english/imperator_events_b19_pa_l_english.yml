 # rise_of_the_family.txt
 family_events.3.t: "[adopted_person.GetName] joins the [pa_character.GetDynasty.GetName] Family"
 family_events.3.desc: "Some say that the [pa_character.GetDynasty.GetName] have been lacking in numbers as well as ability. Whether that is true or not it is a fact that they recently accepted [adopted_person.GetName] into their ranks."
 family_events.3.a: "Interesting."
 family_events.8.t: "What is in a name?"
 family_events.8.desc: "By taking in [picked_adoption_candidate.GetShortName] as a member of the royal family we have no doubt done [picked_adoption_candidate.GetHerHim] a great favor.\n\nShall [picked_adoption_candidate.GetSheHe] also be allowed to change [picked_adoption_candidate.GetHerHis] last name?"
 family_events.8.a: "Yes, we are one family, of one name."
 family_events.8.b: "[picked_adoption_candidate.GetSheHe|U] can keep [picked_adoption_candidate.GetHerHis] old name as a sign of [picked_adoption_candidate.GetHerHis] origin."
 family_events.8.tt: "[picked_adoption_candidate.GetName|Y] will from now on be a member of the ruling family.\n[picked_adoption_candidate.GetSheHe|U] will however keep using [picked_adoption_candidate.GetHerHis] own last name when addressed."
