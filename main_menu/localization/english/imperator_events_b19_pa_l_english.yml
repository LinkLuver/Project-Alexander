l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b19 (2026-10-20)

 # succession_heir_nomination.txt
 heir_events.5.t: "Heir Apparent"
 heir_events.5.desc: "A [ROOT.GetCountry.GetAdjective] coronation ceremony is meant to be one of the grandest and most memorable events of a lifetime, but not all coronations are equal. While everyone is going through the motions expected of them, there are whispers among the onlookers.\n\nThe fact that [nominator.GetName] will remain at the reins of the country with [nominee.GetName] sharing the title is causing ridicule in the streets, but also inspiring far less savory emotions in the Royal Palace."
 heir_events.5.a: "They will accept it in time."
 heir_events.10.t: "Heir Apparent"
 heir_events.10.desc: "There are many traditions to observe in the [ROOT.GetCountry.GetAdjective] kingdom when naming a designated successor - but even for a [ROOT.GetCountry.GetGovernment.GetRulerTitle] it is hard to know what will happen after death.\n\nPerhaps that is why the coronation of [nominee.GetName] today was undertaken with such fervor, pomp and ceremony. The high and mighty in the kingdom, as well as representatives of the priesthood, have all gladly sworn fealty to [nominee.GetName] as their ruler.\n\nThere are some, however who consider the whole ceremony superficial. [nominator.GetName] will remain the ruler of the country after all, with [nominator.GetName] now the Heir Apparent."
 heir_events.10.a: "Tenella!"
 heir_events.11.t: "Playing Favorites"
 heir_events.11.desc: "The decision of [nominator.GetName] to hold a grand ceremony to nominate a mere child as co-ruler and official successor has been hard to stomach for some of the political grandees in our country. The coronation ceremony may have gone off without a hitch, but there is dissent brewing among the rich and mighty in [ROOT.GetCountry.GetName]."
 heir_events.11.a: "This is for the best."
 #P:A TODO Unused: the modifier "succesful_coronation_ceremony" was a country-culture modifier, which EU5 lacks (see heir_events.10)
 succesful_coronation_ceremony: "Succesful Coronation Ceremony"
 # opinions (pa_imp_b19_opinions.txt)
 twots_assination_opmod: "Murdered Claimant"
 twots_refused_thrace_opmod: "Refused Aid"
 # religion_flavor/temple_state_event.txt
 temple_state_event.1.t: "Temple State of [temple_estate_province.GetName]"
 temple_state_event.1.desc: "The influence of Achaemenid rule in Anatolia remained long after the King of Kings had been deposed. Under their rule land devoted to temples was still largely considered inviolable, and their priests could hold some of the highest positions in society. This created ideal conditions for temple estates, which could become very wealthy and influential with attached villages, cities and fields, to flourish, effectively becoming temple states.\n\nRule of these temple states was entrusted to a high priest, enjoying extended powers and privileges, whose authority is second only to the area's temporal ruler. As typically practiced in the near east, a Temple State was a small theocracy wherein a priest-king ruled over a secular society typically consisting of extensive estates worked by a large number of sacred slaves.\n\nNow, [new_temple_state.GetGovernment.GetRuler.GetName] has been appointed as the high priest at [new_temple_state.GetCapital.GetName] and has been given a collection of properties centered around its temple. [new_temple_state.GetGovernment.GetRuler.GetShortName], has come to [ROOT.GetCountry.GetCapital.GetName] to argue that 'It is not right that the men who worship in the name of the king also serve temporal masters.' [new_temple_state.GetGovernment.GetRuler.GetShortName] asks that we grant additional lands and slaves to [new_temple_state.GetName] so that its priests can devote themselves completely to holy matters. [new_temple_state.GetName] has deep coffers and is willing to pay a 'fair price' for this boon."
 temple_state_event.1.a: "[new_temple_state.GetGovernment.GetRuler.GetShortName] ought to be grateful enough already."
 temple_state_event.1.b: "[new_temple_state.GetName] can have [temple_estate_neighbor_province.GetName]."
 temple_state_event.1.c: "We can spare a little more land."
 holy_site_tooltip: "[THIS.GetName] is a Holy Site of the Owners Religion."
 STATIC_MODIFIER_NAME_temple_state_modifier: "Temple State"
 STATIC_MODIFIER_NAME_temple_state_placated_modifier: "Placated Priests"
 STATIC_MODIFIER_NAME_temple_state_unrest_modifier: "Revoked Temple Estate"
 temple_state_event.2.t: "Temple State of [temple_estate_province.GetName]"
 temple_state_event.2.desc: "The influence of Achaemenid rule in Anatolia remained long after the King of Kings had been deposed. Under their rule land devoted to temples was still largely considered inviolable, and their priests could hold some of the highest positions in society. This created the conditions for temple estates, which could become very wealthy and influential with attached villages, cities and fields, to effectively become temple states.\n\nRule of these temple states was entrusted to a high priest, enjoying extended powers and privileges, whose authority is second only to the area's temporal ruler. As typically practiced in the near east, a Temple State was a small theocracy wherein a priest-king ruled over a secular society typically consisting of extensive estates worked by a large number of sacred slaves.\n\nIn recent times, the collection of properties controlled by the priests of [temple_estate_province.GetName] has come to resemble one of these temple states. The head of this priesthood, [temple_state_high_priest.GetName], has come to [ROOT.GetCountry.GetCapital.GetName] to argue that 'It is not right that the men who worship in our name to also serve temporal masters.' [temple_state_high_priest.GetShortName] asks that we grant autonomy to the priests of [temple_estate_province.GetName] so that they can devote themselves completely to holy matters."
 temple_state_event.2.a: "A small donation should placate these priests."
 temple_state_event.2.b: "[temple_estate_province.GetName] shall be insulated from worldly affairs."
 temple_state_event.2.bt: "#high [temple_estate_province.GetName]#! will be released as our #Y Temple State#!"
 temple_state_event.2.c: "[temple_state_high_priest.GetShortName] will be imprisoned for [temple_state_high_priest.GetHerHis] impudence!"
 temple_state_event.2.d: "Their lands shall be seized!"
 temple_state_event.3.t: "Appoint Priest-King"
 temple_state_event.3.desc: "One of the best ways to influence the great Temple States is to appoint someone loyal to administer them. And who else better do that, than our own kin. As such it only follows that we get one of the representatives of the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] dynasty to a position of power there, to see to our interests."
 temple_state_event.3.a: "It must be [candidate_1.GetName]."
 temple_state_event.3.b: "We'd rather see [candidate_2.GetName]."
 temple_state_event.3.c: "[candidate_3.GetName] is the [candidate_3.GetWomanMan] for the job."
 temple_state_event.3.d: "Let us not be hasty."
 temple_state_event.3.dt: "#R Nothing happens.#!"
 # olympics.txt
 #P:A TODO Imperator title was "$olympic.2.t$" = "The <n-th> Olympiad" (custom loc get_olympics_count_suffix, which belongs to the skipped olympic.2)
 olympic.3.t: "The Olympiad"
 olympic.3.desc: "Once more, the renowned Olympic Games are due to occur in the [olympic_games_location.Custom('pa_imp_get_city_type_loc')] of [olympic_games_location.GetName]. The traditions surrounding these games are ancient, reputedly dating back to the days of mighty Herakles himself, and they are an occasion in which all of Greece rejoices.\n\nIt is our custom to send the proudest, most able young [ROOT.GetCountry.GetAdjective] athletes, to compete on our behalf. We believe we have found two ideal candidates; a [olympic_champion.Custom('pa_imp_get_godly_description')], by the name of [olympic_champion.GetShortName], and a [olympic_champion_2.Custom('pa_imp_get_godly_description')], who calls [olympic_champion_2.GetHerselfHimself] [olympic_champion_2.GetShortName]. Which of these fine athletes should we send to compete in the games?"
 olympic.3.a: "Send [olympic_champion.GetShortName]!"
 olympic.3.b: "Let's send [olympic_champion_2.GetShortName]."
 olympic.3.c: "We shall sit this one out."
 # custom loc pa_imp_get_godly_description
 towering_adonis: "towering Adonis of a man"
 son_of_apollo: "son of Apollo himself"
 sprightly_youth: "nimble-footed sprinter"
 young_man_desc: "fresh-faced youth"
 brawn_olympic_desc: "well-muscled brute of a man"
 wily_odysseus: "handsome fellow as cunning as wily Odysseus"
 old_guy_desc: "surprisingly old man"
 decrepit_fool_desc: "decrepit fool"
 stout_gentleman: "stout fellow"
 got_eager_competitor: "eager competitor"
 olympic.7.t: "Olympic Outrage!"
 olympic.7.desc: "The dishonorable curs in [evil_olympic_monsters.GetName] have locked up our beloved athlete, [imprisoned_athlete.GetShortName], who had traveled to take part in the Olympic Games.\n\nWhat's more, they are demanding a random for [imprisoned_athlete.GetHerHis] safe return. All nations taking part in the Olympics have voiced their severe displeasure at this breach of the Olympic truce."
 olympic.7.a: "Fine. Send the money."
 olympic.7.b: "We cannot afford the ransom, but we will remember this..."
 olympic.8.t: "Stadium Deserted"
 olympic.8.desc: "It would appear that this year, hardly anyone turned up to the Olympic Games, and the event had to be canceled.\n\nThe disappointment felt across the whole of Greece is palpable - perhaps next Olympiad will be better?"
 olympic.8.a: "How sad."
 olympic.9.t: "Ransom Paid"
 olympic.9.desc: "The fools in [imprisoned_athlete_country.GetName] have paid our ransom demand for [imprisoned_athlete.GetName].\n\nLet's hope they find better use for [imprisoned_athlete.GetHerHim] than we did."
 olympic.9.a: "Very well."
 olympic.11.t: "Tragedy at the Olympics!"
 olympic.11.desc: "Our athlete, [dead_athlete.GetName], has sadly perished during the post-event debauchery in [dead_athlete.GetCourtCountry.GetName]."
 olympic.11.a: "All of [ROOT.GetCountry.GetName] mourns!"
 # dhe/dhe_pharos_lighthouse.txt
 #P:A TODO Imperator had no name for this modifier; "Starvation" is a placeholder
 STATIC_MODIFIER_NAME_province_diminishment_starvation_lighthouse: "Starvation"
 dhe_pharos_lighthouse.2.t: "Drought Complications"
 dhe_pharos_lighthouse.2.desc: "A sudden drought has hit Alexandria, and with it, the work we have been doing on the Pharos Lighthouse. Unless we invest a lot of money into transferring food and help from elsewhere, the building progress will certainly be hindered. [random_advisor.GetName] point out we could focus on those working on the lighthouse, to save some of our resources."
 dhe_pharos_lighthouse.2.a: "We will help all of Alexandria."
 dhe_pharos_lighthouse.2.a.tt: "The progress on the Pharos Lighthouse continues as planned."
 dhe_pharos_lighthouse.2.b: "Let us prioritize the workers, for now."
 dhe_pharos_lighthouse.2.c: "We cannot afford to help either."
 dhe_pharos_lighthouse.2.c.tt: "The progress on the Pharos Lighthouse is hindered by starvation."
 dhe_pharos_lighthouse.3.t: "Complications with Materials"
 dhe_pharos_lighthouse.3.desc: "A large crash followed by the panic of our workers happen as some of the lighthouse falls out in the middle of construction. It seems some of the materials received are barely usable, and unsafe to keep at best.\n\nOur foremen ask for the funds necessary to buy replacements, while [random_advisor.GetName] point out we have materials in other nearby cities we could use."
 dhe_pharos_lighthouse.3.a: "We will buy some replacements."
 dhe_pharos_lighthouse.3.b: "There are materials in some of our other territories we can use."
 dhe_pharos_lighthouse.3.c: "We will just lower the height of the lighthouse slightly."
 dhe_pharos_lighthouse.3.c.tt: "The progress on the Pharos Lighthouse is hindered by low quality materials."
 dhe_pharos_lighthouse.4.t: "Worker Disappearance"
 dhe_pharos_lighthouse.4.desc: "As work progresses on the Pharos Lighthouse, we have seen a lot of workers disappearing over time. Some have quit their job, some have died and some have simply disappeared. Without a proper workforce to work on the lighthouse, the progress will lag behind and we might not get the result we want."
 dhe_pharos_lighthouse.4.a: "New workers will be found."
 dhe_pharos_lighthouse.4.b: "Our soldiers will fill the role."
 dhe_pharos_lighthouse.4.c: "It will just take a bit more time then."
 dhe_pharos_lighthouse.4.c.tt: "The progress on the Pharos Lighthouse is hindered by the lack of workers."
 dhe_pharos_lighthouse.5.t: "Earthquake Complications"
 dhe_pharos_lighthouse.5.desc: "A small earthquake rocks the Pharos Lighthouse and all of those who are working inside, causing some minor injuries and some damage to the work that has been done in the last months.\n\nIf the work is to continue unhindered, a substantial amount of funds needs to be set aside to clean up the area and replace some of the things that was destroyed."
 dhe_pharos_lighthouse.5.a: "It will be fixed so the construction can continue."
 dhe_pharos_lighthouse.5.b: "We do not have the funds for that."
 dhe_pharos_lighthouse.5.b.tt: "The progress on the Pharos Lighthouse is hindered by the damage done by the earthquake."
 dhe_pharos_lighthouse.6.t: "Quality Materials"
 dhe_pharos_lighthouse.6.desc: "As our progress on the Pharos Lighthouse continues, it seems we received an extra shipment of materials that was of a higher quality than expected. We could use the extra materials to make the lighthouse better than we originally planned to, or we could sell it and stick to our original plans, with some extra funds in case anything else unexpected should happen."
 dhe_pharos_lighthouse.6.a: "Bigger and better!"
 dhe_pharos_lighthouse.6.a.tt: "The progress on the Pharos Lighthouse goes beyond what we originally planned."
 dhe_pharos_lighthouse.6.b: "Let us sell them and set the money aside for now."
 dhe_pharos_lighthouse.10.t: "The Pharos Lighthouse"
 dhe_pharos_lighthouse.10.desc: "We have sent for workers to help in the building of the Pharos Lighthouse from far and wide. As the largest building known to man, we hope this will become the shining beacon of the civilized world.\n\nIn just a few weeks, the progress of the lighthouse will begin properly. We expect a few complications as the development unfolds, but hopefully we will see the lighthouse raised soon enough."
 dhe_pharos_lighthouse.10.a: "It will be our shining light."
 dhe_pharos_lighthouse.11.t: "The Pharos Lighthouse"
 dhe_pharos_lighthouse.11.desc: "The building of the Pharos Lighthouse has finally been completed, and it stands as a testament to our rule, power and importance. For generations to come, this lighthouse will be a beacon leading to Alexandria, one of the greatest cities the world has ever seen.\n\nThough the lighthouse never quite lived up the expectations and plans we originally set for it, it is still an impressive building to be sure. Never again will anyone doubt the importance of our city and nation, as we have built an unparalleled monument. "
 dhe_pharos_lighthouse.11.a: "And yet we had hoped for something more..."
 dhe_pharos_lighthouse.12.t: "The Pharos Lighthouse"
 dhe_pharos_lighthouse.12.desc: "The building of the Pharos Lighthouse has finally been completed, and it stands as a testament to our rule, power and importance. For generations to come, this lighthouse will be a beacon leading to Alexandria, one of the greatest cities the world has ever seen.\n\nThough many criticized us for our grandiose and impossible plans, the lighthouse has somehow managed to live up to our expectations. Never again will anyone doubt the importance of our city and nation, as we have built an unparalleled monument."
 dhe_pharos_lighthouse.12.a: "A technological wonder."
 dhe_pharos_lighthouse.13.t: "The Pharos Lighthouse"
 dhe_pharos_lighthouse.13.desc: "The building of the Pharos Lighthouse has finally been completed, and it stands as a testament to our rule, power and importance. For generations to come, this lighthouse will be a beacon leading to Alexandria, one of the greatest cities the world has ever seen.\n\nThe gargantuan monument far exceeded our expectations beyond all hope, piercing the skies and reaching into the realms above. Never before has such a monument been built by mortal hands, and some claim we must have received divine guidance in this endeavor.\n\nThe Pharos Lighthouse will forever stand in memory of our nation."
 dhe_pharos_lighthouse.13.a: "As it should be."
 # warfare_events.txt
 warfare.3.t: "A Better Offer"
 warfare.3.desc: "The mercenaries we have hired, led by [target.GetName], have approached us claiming that the fiends in [actor.GetName] have offered them a sizable sum to switch their allegiance.\n\nThey have shrewdly offered us a chance to match the offer, hoping to profit doubly from this underhanded deal."
 warfare.3.a: "Very well..."
 warfare.3.b: "Never!"
 warfare.4.t: "Offer Refused"
 #P:A TODO Imperator named the employer as [target.GetEmployer.GetAdjective] (the mercenary leader's employer); EU5 mercenary companies have no employer link here, the counter-bribing country (counter_target) is named instead
 warfare.4.desc: "The Mercenary band led by [target.GetName] has callously refused our offer of superior employment!\n\nIt seems that they received a better offer from the [counter_target.GetAdjective] villains."
 warfare.4.a: "Curses!"
 warfare.5.t: "Mercenary Buyout Successful!"
 warfare.5.desc: "The band of Mercenaries led by [target.GetName], has accepted our benevolent offer of employment. The villains in [counter_target.GetName] apparently refused to consider matching our generous offer."
 warfare.5.a: "That is their loss!"
 merc_joined_us_tt: "[target.GetName] has joined us, with their band of mercenaries!"
 warfare.6.t: "Wounded In Battle"
 warfare.6.desc: "Eager to exploit enemy weaknesses, it seems [pa_character.GetName] has exposed [pa_character.GetHerselfHimself] to considerable risks, and now has a new wound for [pa_character.GetHerHis] trouble."
 warfare.6.a: "Forward!"
 warfare.7.t: "Fallen Commander"
 warfare.7.desc: "Somehow [pa_character.GetName] must have gotten separated from the main force.\n\nIn the midst of battle the honorable commander was suddenly nowhere to be found and our forces in [battle_location.GetName] stood without leadership."
 warfare.7.a: "In time [pa_character.GetSheHe] will be mourned."
 warfare.8.t: "Wounded in Battle"
 warfare.8.desc: "Sea battles come with serious risks to life and limb, even for those commanding them from the deck of a flagship.\nDuring the battle [pa_character.GetName] has been wounded. Should [pa_character.GetSheHe] survive, this will make a good story back in [ROOT.GetCountry.GetCapital.GetName]..."
 warfare.8.a: "Unfortunate."
 warfare.9.t: "Lost at Sea"
 warfare.9.desc: "While no one saw exactly what happened, it seems somehow [pa_character.GetName] was hit with a piece of flying debris in the middle of the battle [pa_character.GetSheHe] was commanding in [battle_location.GetName].\nThe impact must have been lethal, as [pa_character.GetSheHe] shows no signs of life."
 warfare.9.a: "In time [pa_character.GetSheHe] will be mourned."
 warfare.12.t: "Pretender Sparks War"
 warfare.12.desc: "[supported_target.GetName], a claimant to the [supported_target.GetCourtCountry.GetAdjective] throne whom we have been funneling covert funds to, has sparked a war for the throne.\n\nThe beleaguered revolt has sent requests for aid to our envoys, hoping that we might further advance their cause."
 warfare.12.a: "Send them soldiers."
 warfare.12.b: "Direct intervention seems prudent."
 warfare.12.c: "More aid? Alas..."
 warfare.12.d: "Our constancy shall surely be rewarded."
 if_small_enough_subject_tt: "#G If their nation survives the civil war and is of a lower rank than us, they may become our subject#!"
 warfare.14.t: "A Kingdom Restored"
 warfare.14.desc: "The grateful [puppet_kingdom.GetAdjective] Kingdom how lies in safe hands under the rule of [puppet_kingdom.GetGovernment.GetRuler.GetName].\n\nGrateful for our aid, and weary of war, their envoys send platitudes of gold and riches, hoping that we might take our leave. With their lands in flames, they would be hard-pressed to refuse more aggressive overtures, however..."
 warfare.14.a: "You shall serve us now, [puppet_kingdom.GetGovernment.GetRuler.GetShortName]."
 warfare.14.b: "Let them be."
 warfare.15.t: "A Kingdom Divided"
 warfare.15.desc: "At long last, the [puppet_kingdom.GetAdjective] civil war has been won. Despite our diplomatic wrangling, their ungrateful ruler has insisted on the immediate withdrawal of our men from their lands.\n\nTo sweeten the deal, they insist on a share of the riches from the protracted conquest."
 warfare.15.b: "Well, it's better than nothing."
 warfare.16.t: "A Kingdom In Thrall"
 warfare.16.desc: "Our heralds bring troubling news: the nation of [puppeteer_country.GetName] has successfully supported the rebellion of [puppet_kingdom.GetGovernment.GetRuler.GetName] in [puppet_kingdom.GetName].\n\nThe once-mighty kingdom now lies in thrall to their former allies, having made a deal with the devil - signing away their independence in return for a mere chance at temporary power."
 warfare.16.a: "The future grows dim."
 in_awe_of_rome_ven: "In Awe of Rome"
 offered_expertise_against_the_gauls: "Offered Expertise Against the Gauls"
 # religion_flavor/rel_flavor_zoro.txt
 rel_flavor_zoro.1.t: "Conversion by Fire"
 #P:A TODO Imperator named the advisor's office ([random_advisor.GetOffice.GetCulturalName]); EU5 has no offices, "advisor" is written instead
 rel_flavor_zoro.1.desc: "Supposedly the people of [country_province.GetName], [country_province.GetProvince.GetName], are struggling with their faith in the teachings of Zoroaster. Our advisor [random_advisor.GetName] suggests convincing the peasantry with purification ceremonies, once more turning them to the righteous path following Ahuramazda.\n\nSurely it would be a popular move among our subjects to turn more people against the false malevolent ideas of the polytheists."
 rel_flavor_zoro.1.a: "We will hold ceremonies all across [country_province.GetName]."
 rel_flavor_zoro.1.b: "One ceremony central in [country_province.GetName] will do."
 rel_flavor_zoro.1.c: "Mayhap we can do it some other time."
 rel_flavor_zoro.2.t: "Unsuited Rulership"
 #P:A TODO Imperator named the ruler's office ([...GetRuler.GetOffice.GetCulturalName]); the ruler title is used instead
 rel_flavor_zoro.2.desc: "Our people question the leadership of our [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetName], and [random_advisor.GetName] in particular has been a long-time opponent of ours. Maybe it is time to set aside our resources to follow the teachings of Zoroaster more properly. After all, the magi are sure to be happy to help us out if we ask them to guide us in this matter."
 rel_flavor_zoro.2.a: "Find us some of these magi."
 rel_flavor_zoro.2.b: "[random_advisor.GetShortName] will not decide how we rule [ROOT.GetCountry.GetName]."
 rel_flavor_zoro.4.t: "By Ahuramazda"
 rel_flavor_zoro.4.desc: "As the pious ruler [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] is, our leader [ROOT.GetCountry.GetGovernment.GetRuler.GetName] knows there are avenues for improvement, and has been seeking the counsel and advice of [random_advisor.GetName] and the magi. Though their teachings are well meant, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] are sure to lose [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] authority over the group if [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] follows their every whim."
 rel_flavor_zoro.4.a: "Please, share your wisdom with us."
 rel_flavor_zoro.4.b: "We will find our own path."
 rel_flavor_zoro.5.t: "Guided by Ahuramazda"
 rel_flavor_zoro.5.desc: "Be it in battle or at home, it is important that our people know we are guided by Ahuramazda and the wisdom of Zoroaster. [random_advisor.GetName] has suggested supporting our magis and priests in spreading our teachings to the people, and in turn have their blessing in a religiously backed message that would strengthen our subjects for a long time to come."
 rel_flavor_zoro.5.a: "Our men at war will know they fight for the right cause."
 rel_flavor_zoro.5.b: "Our nation will be strengthened with his teachings."
 rel_flavor_zoro.5.c: "No, we have no intentions of dancing to the magis tunes."
 STATIC_MODIFIER_NAME_country_improvement_zoroastrianism_war: "Guided by Ahuramazda"
 STATIC_MODIFIER_NAME_country_improvement_zoroastrianism_stability: "Guided by Ahuramazda"
 # tribal_flavour_events.txt
 tribal_flavour_event.1.t: "A Feud"
 tribal_flavour_event.1.desc: "Two of our tribesmen have come forward today to ask for help settling ownership over a gold [ROOT.GetCountry.Custom('pa_imp_get_found_treasure')] they found. [duelist_1.GetName] believes it belongs to [duelist_1.GetHerHim] as [duelist_1.GetSheHe] was the one to find it, whereas [duelist_2.GetName] says it belongs to [duelist_2.GetHerHim] as it was discovered on [duelist_2.GetHerHis] land."
 tribal_flavour_event.1.a: "It belongs to [duelist_1.GetName]"
 tribal_flavour_event.1.b: "It belongs to [duelist_2.GetName]"
 tribal_flavour_event.1.c: "It belongs to [ROOT.GetCountry.GetName]"
 tribal_flavour_event.1.d: "It belongs to the gods!"
 # custom loc pa_imp_get_found_treasure
 string_necklace: "necklace"
 string_crown: "crown"
 string_statue: "statue"
 string_amphora: "amphora"
 string_goblet: "goblet"
 STATIC_MODIFIER_NAME_migratory_insanity_unleashed: "Migratory Insanity Unleashed"
 STATIC_MODIFIER_NAME_tribal_insanity_unleashed: "Tribal Insanity Unleashed"
 STATIC_MODIFIER_NAME_steppe_insanity_unleashed: "Steppe Insanity Unleashed"
 tribal_flavour_events.3.t: "Collapse of the [origin_crisis.GetAdjective]"
 tribal_flavour_events.3.desc: "News has reached us by word of mouth, that the once-powerful [origin_crisis.GetAdjective] have fallen to internal bickering, strife, and wanton power struggles.\n\nNumerous local chiefdoms have arisen from the ashes of the crisis, perhaps affording an opportunity to their watchful neighbors. The [origin_crisis.GetAdjective] still retain a nominal leadership of some of the disparate clans, desperately clinging to their laughable hegemony."
 tribal_flavour_events.3.a: "Barbarians..."
 target_fallen_tfe3: "[origin_crisis.GetName] has splintered into numerous sub-clans."
 #P:A TODO Imperator had no names for these three modifiers; the names below are placeholders derived from the keys
 STATIC_MODIFIER_NAME_has_collapsed_tribe_crisis: "Collapsed Tribe"
