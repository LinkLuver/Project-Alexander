l_english:
 pa_senate_dictatorship: "Establish a Dictatorship"
 pa_senate_dictatorship_desc: "Requires 0 Senate Authority and either at least 85 Tyranny or at least 10 War Exhaustion after six monthly checks at war. If passed, Rome adopts the Dictatorship policy under its Roman Constitution law."
 pa_roman_constitution_law: "Roman Constitution"
 pa_roman_constitution_law_desc: "The constitutional form of Rome's government."
 pa_roman_consular_constitution: "Consular Republic"
 pa_roman_consular_constitution_desc: "Rome is governed under the consular constitution."
 pa_roman_dictatorship_policy: "Dictatorship"
 pa_roman_dictatorship_policy_desc: "Extraordinary authority is concentrated in the hands of Rome's ruler."
 pa_senate_restore_consuls: "Restore the Consular Republic"
 pa_senate_restore_consuls_desc: "Restore the consular constitution and annual elections if the Parliament approves."
 pa_roman_dictator_succession: "Dictator for Life"
 pa_roman_dictator_succession_desc: "The dictator holds office for life; a successor is selected after death."
 pa_roman_dictator_title: "Dictator"
 pa_restoration_election_retry: "Consular restoration is unresolved; the Senate will retry. Check the diagnostic log for the cause."
 pa_dictatorship.1.title: "The Senate Demands a Return to the Republic"
 pa_dictatorship.1.desc: "The Senate calls upon the dictator to lay down extraordinary powers and restore the consular constitution. Compliance promises reconciliation; refusal risks plunging Rome into deeper crisis."
 pa_dictatorship.1.step_down: "Lay down the dictatorship"
 pa_dictatorship.1.refuse: "I will not relinquish power"
