l_english:
 city_sacking.1.title: "The Fate of [target_location.GetName]"
 city_sacking.1.desc: "Our troops have taken [target_location.GetName]. The city is at our mercy. We can leave its inhabitants in peace, permit our soldiers to plunder it, or allow a thorough sack that will leave the city devastated."

 city_sacking.1.a: "The city shall be spared."
 city_sacking.1.b: "Allow limited plundering."
 city_sacking.1.c: "Put the city to the sack!"

 city_sacking.1.a.tt: "No population or buildings will be lost. No gold will be gained."
 city_sacking.1.b.tt: "Kill 2% of the population, destroy 5% of buildings and gain gold based on how many were destroyed."
 city_sacking.1.c.tt: "Kill 5% of the population, destroy 10% of buildings and gain gold based on how many were destroyed."

 pa_sacked_city: "City was Sacked"