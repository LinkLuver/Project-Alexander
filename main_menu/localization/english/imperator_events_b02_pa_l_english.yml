 # internal_politics_republic_part1.txt
 ip_republic.1.t: "Wild Accusations"
 #P:A TODO No EU5 equivalent: Imperator named the accuser's party ([...GetParty.GetName]); EU5 has no parties, so "the opposition" is written instead
 ip_republic.1.desc: "Despite the long record of public service held by our [ROOT.GetCountry.GetGovernment.GetRulerTitle], [pa_character.GetName]; a vile accusation of election fraud has been leveled against [pa_character.GetHerHim].\n\nThe perpetrator of this vile slander is none other than [ip_republic_1_accuser.GetName] - mastermind of the opposition.\n\nHow should we respond to this outrageous insult?"
 ip_republic.1.a: "Brush it off."
 ip_republic.1.b: "Perhaps we ought to make reparations."
 ip_republic.1.b.tooltip: "The magnitude of these reparations depend on your ruler's corruption."
 ip_republic.1.c: "Astonishing! Demand [ip_republic_1_accuser.GetHerHis] resignation!"
 increased_scrutiny.tooltip: "[pa_character.GetName] will be #Y Under Scrutiny#! for the remainder of [pa_character.GetHerHis] term."
 ip_republic.2.t: "Affairs of State"
 ip_republic.2.desc: "The growing power which our [ROOT.GetCountry.GetGovernment.GetRulerTitle] wields has become a source of great concern amongst the senate.\n\nA partisan statement was issued at their last meeting, citing particular worries over the tyrannical attitude of [pa_character.GetName], and [pa_character.GetHerHis] relationship with power.\n\nWe should be wary, with the eyes of the state upon us."
 ip_republic.2.a: "Troubling."
 ip_republic.2.b: "I am the Senate!"
 ip_republic.2.c: "Reassure the Senate of our good intentions."
 orator_tooltip: "This option is available because your ruler has the #Y Orator#! trait."
 ambitious_tooltip: "This option is available because your ruler has the #Y Ambitious#! trait."
 ip_republic.3.t: "Minor Inheritance"
 ip_republic.3.desc: "In an unusual turn of events, [pa_character.GetName] has been named successor to a little-known landholder in [ip_republic_3_province_target.GetName].\n\nThe lands are ripe for development, yet, an old friend of [pa_character.GetShortName], [ip_republic_3_jealous_friend.GetName], has lodged a formal complaint against the proceedings, claiming that the money rightfully belongs to [ip_republic_3_jealous_friend.GetHerHim].\n\nThe claim is clearly nonsense, but it might be wise to deal with this issue sensitively."
 ip_republic.3.a: "The inheritance rightly belongs to [pa_character.GetShortName]."
 ip_republic.3.b: "Sell the land and split the profits."
 ip_republic.3.c: "Confiscate the land on behalf of the state."
 STATIC_MODIFIER_NAME_state_owned_farmlands: "State Owned Farmlands"
 ip_republic.5.t: "Embezzler!"
 ip_republic.5.desc: "[ip_republic_5_antagonist.GetName] has been caught red-handed, using [ip_republic_5_antagonist.GetHerHis] status to make some particularly shady business deals.\n\nWhile punishment must be meted out, we must decide how severe it should be."
 ip_republic.5.a: "A token slap on the wrist, perhaps."
 ip_republic.5.b: "A hefty fine is in order."
 ip_republic.5.c: "Despicable! Remove [ip_republic_5_antagonist.GetHerHim] from power immediately!"
 ip_republic.5.d: "This is unforgivable. Lock [ip_republic_5_antagonist.GetHerHim] up!"
 ip_republic.5.e: "Business deals, you say?"
 ip_republic.5.f: "What are friends for?"
 just_tooltip: "This option is available because your ruler has the #Y Just#! trait."
 option_because_friends: "This option is available because your ruler shares a #Y friendship#! with [ip_republic_5_antagonist.GetName]."
 ip_republic.6.t: "A Question of Sanity"
 ip_republic.6.desc: "Whether down to recent events, personal character, or political machinations, a rather amusing bill has been brought before the assembly, listing, in excruciating detail, the curious personal habits of our [ROOT.GetCountry.GetGovernment.GetRulerTitle], [pa_character.GetName].\n\nThe bill is, naturally, laughed out of the assembly, but the perpetrator refuses to come forward. How should we act?"
 ip_republic.6.a: "Well, at least everybody is laughing!"
 ip_republic.6.b: "Find out who wrote this..."
 ip_republic.6.b.tooltip: "This action may have consequences."
 ip_republic.6.c: "Fish sauce for everyone!"
 lunatic_bad_tooltip: "This option is #Y exclusive#! because your ruler has the #Y Lunatic#! trait."
 ip_republic.7.t: "Traitor Uncovered!"
 ip_republic.7.desc: "The unfortunate cur who attempted to embarrass [pa_character.GetName] has finally been uncovered.\n\nHow should we deal with this miscreant?"
 ip_republic.7.a: "Ignore [ip_republic_7_antagonist.GetHerHim]. Nobody will trust [ip_republic_7_antagonist.GetHerHim] now."
 ip_republic.7.b: "Forgive [ip_republic_7_antagonist.GetHerHim], let bygones be bygones."
 ip_republic.7.c: "Banish [ip_republic_7_antagonist.GetHerHim] immediately!"
 ip_republic.7.d: "Secure [ip_republic_7_antagonist.GetHerHis] loyalty with a... gift."
 forgiving_tooltip: "This option is available because your ruler has the #Y Forgiving#! trait."
 ip_republic.8.t: "A Petitioner Approaches"
 ip_republic.8.desc: "A [ip_republic_8_antagonist.Custom('pa_imp_get_age_description')] by the name of [ip_republic_8_antagonist.GetName] approached our [ROOT.GetCountry.GetGovernment.GetRulerTitle] in private this morning.\n\nIn a hushed voice, [ip_republic_8_antagonist.GetSheHe] spoke of a vision of the near future, in which [ip_republic_8_antagonist.GetSheHe] was found by [ip_republic_8_antagonist.GetHerHis] loved ones, having been [ip_republic_8_antagonist.Custom('pa_imp_get_death_description')].\n\nWith shaking hands, [ip_republic_8_antagonist.GetSheHe] offered all [ip_republic_8_antagonist.GetHerHis] worldly goods to the state, in return for our protection..."
 ip_republic.8.a: "How awful! We shall take good care of [ip_republic_8_antagonist.GetHerHim]."
 ip_republic.8.b: "Convince [ip_republic_8_antagonist.GetHerHim] that all will be well."
 ip_republic.8.c: "Have [ip_republic_8_antagonist.GetHerHim] [ip_republic_8_antagonist.Custom('pa_imp_get_death_description')]."
 lunatic_tooltip: "This option is available because your ruler has the #Y Lunatic#! trait."
 ip_republic.9.t: "Concerns in the Senate"
 ip_republic.9.desc: "Our people are growing concerned over the number of close personal acquaintances that [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName] has placed in the Senate.\n\nIn particular, the position of [ip_republic_9_target.GetName] is widely regarded as a nepotistic appointment.\n\nIt might be necessary to address these concerns for the sake of democracy."
 ip_republic.9.a: "[ip_republic_9_target.GetShortName] must go."
 ip_republic.9.b: "This government is free from corruption."
 ip_republic.9.c: "Let [pa_character.GetShortName] talk them round."
 silver_tongued_tooltip: "This option is available because your ruler has the #Y Silver Tongued#! trait."
 ip_republic.10.t: "Fire!"
 ip_republic.10.desc: "News reached us this morning, that the entire estate of [ip_republic_10_target.GetName], a particularly good friend of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName], burnt to the ground last night, in a terrible fire.\n\n[ip_republic_10_target.GetSheHe|U] approaches [pa_character.GetShortName] now, in confidence, asking for state funds to restore [ip_republic_10_target.GetHerHis] estate to its former glory."
 ip_republic.10.a: "Anything for a friend of [pa_character.GetShortName]!"
 ip_republic.10.b: "The coffers of [ROOT.GetCountry.GetName] are not for such matters."
 ip_republic.10.c: "This land would be better cared for by [ROOT.GetCountry.GetName]."
 tyranny_tooltip: "This option is available because of the level of #Y Tyranny#! in your country."
 ip_republic.11.t: "An Unfortunate Conflagration"
 ip_republic.11.desc: "[ip_republic_11_target.GetName] has been a constant thorn in the side of our dear [ROOT.GetCountry.GetGovernment.GetRulerTitle] for some time now. It was, therefore, a source of some interest when [ip_republic_11_target.GetHerHis] entire estate was engulfed in a raging inferno, just last night.\n\nThis morning, [ip_republic_11_target.GetShortName] appeared before the senate on [ip_republic_11_target.GetHerHis] knees, beseeching us to offer assistance in rebuilding [ip_republic_11_target.GetHerHis] blackened wreck of an estate..."
 ip_republic.11.a: "This is truly awful. Let us pledge to do what we can."
 ip_republic.11.b: "[ip_republic_11_target.GetSheHe|U] should simply have taken better precautions."
 ip_republic.11.c: "Seize the estate!"
 ip_republic.12.t: "Confiscated!"
 ip_republic.12.desc: "In a stroke of luck, it would appear that [ip_republic_12_target.GetName] has attracted a hefty fine, after [ip_republic_12_target.GetSheHe] was discovered avoiding import fees on exotic items from [republic_12_import_target.GetName].\n\nTo pay this pecuniary penance, [ip_republic_12_target.GetShortName] is being forced to sell a large tract of land in [ip_republic_12_province.GetName]; if we consider it worthwhile, we might be able to acquire this land on behalf of the state."
 ip_republic.12.a: "Buy it."
 ip_republic.12.b: "Waive the fine."
 ip_republic.12.c: "[pa_character.GetShortName] always needs more land!"
 greedy_bad_tooltip: "This is the #r only#! option available, because your ruler has the #Y Greedy#! trait."
 trade_contact_well_treated: "Trade Contact Well-Treated"
 ip_republic.13.t: "The Vagaries of State"
 ip_republic.13.desc: "While the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] was in session this afternoon, a little known [ip_republic_13_target.GetWomanMan] by the name of [ip_republic_13_target.GetShortName], stood to give a rousing speech on the subject of [pa_character.Custom('pa_imp_get_debate_topic')].\n\nWhile [ip_republic_13_target.GetHerHis] argument was ultimately unsuccessful, many heads were turned by the beauty of [ip_republic_13_target.GetHerHis] oratory.\n\nPerhaps this is someone we ought to keep an eye on..."
 ip_republic.13.a: "Troubling..."
 ip_republic.13.b: "[pa_character.GetShortName] shall make a superb counter-argument!"
 ip_republic.14.t: "Temptation Beckons"
 ip_republic.14.desc: "A representative visited [pa_character.GetShortName] last night, claiming to have been sent by [ip_republic_14_target.GetName].\n\nSpeaking earnestly, he tells of a deal in which [ip_republic_14_target.GetShortName] would donate a vast sum of money to the [ROOT.GetCountry.GetAdjective] treasury, in return for nothing but a favorable outlook on [ip_republic_14_target.GetHerHis] future activities.\n\nTaking 'donations' is becoming more commonplace, perhaps this wouldn't be so bad, after all?"
 ip_republic.14.a: "We can certainly do business..."
 ip_republic.14.b: "We had best not get caught up in this."
 ip_republic.14.c: "This undermines our very democracy!"
 tooltip_consequences: "This action may have consequences."
 ip_republic.15.t: "Bribery Questioned!"
 ip_republic.15.desc: "The watchful eyes of the Senate have been studying the actions of our [ROOT.GetCountry.GetGovernment.GetRulerTitle] most intently, of late.\n\nUnfortunately, [pa_character.GetHerHis] recent behavior has been decidedly shady, leading to an uproar throughout [ROOT.GetCountry.GetName].\n\nThe senatorial representative, [ip_republic_15_target.GetName], has arrived to discuss the restrictions which the senate intend to place upon [pa_character.GetShortName]."
 ip_republic.15.a: "Accept restrictions."
 ip_republic.15.b: "I don't suppose [ip_republic_15_target.GetShortName] would appreciate a donation...?"
 ip_republic.16.t: "Betrayal!"
 ip_republic.16.desc: "It would appear that [pa_character.GetShortName], despite having made a considerable investments to avoid senatorial scrutiny, has been set up!\n\nThe senate believes it now has enough proof to have [pa_character.GetShortName] removed from power, unless drastic actions can be taken."
 ip_republic.16.a: "Caught red-handed, the game is up!"
 ip_republic.16.b: "Appeal for leniency."
 ip_republic.16.c: "Pay them all off!"
 ip_republic.17.t: "An Intriguing Offer"
 ip_republic.17.desc: "A little known [ip_republic_17_target.GetWomanMan] by the name of [ip_republic_17_target.GetName] addressed the senate recently, denouncing the poor performance of [ip_republic_17_officer.GetName], a key member of our government.\n\nFurthermore, the upstart [ip_republic_17_target.GetShortName] claims that [ip_republic_17_target.GetSheHe] [ip_republic_17_target.GetHerselfHimself] would be a better candidate for the role.\n\nAfter the address, [ip_republic_17_target.GetShortName] reinforced [ip_republic_17_target.GetHerHis] argument with the offer of a sizable bribe, in return for granting [ip_republic_17_target.GetHerHim] the position instead."
 ip_republic.17.a: "A bold move - we need more [ip_republic_17_target.GetWomenMen] like this."
 ip_republic.17.b: "The cheek! Have [ip_republic_17_target.GetHerHim] publicly slandered!"
 ip_republic.17.c: "No, but we may be able to find use for [ip_republic_17_target.GetHerHim] in the future."
#P:A TODO Approximate: Imperator named the character's party (GetPartyName); EU5 has no parties, the character's estate is named instead
 ip_republic.18.t: "Wavering Conviction"
 ip_republic.18.desc: "[pa_character.GetName] has been questioning the sense of [pa_character.GetHerHis] political affiliation for some time now.\n\n[pa_character.GetSheHe|U] has decided to turn [pa_character.GetHerHis] back on the [pa_character.GetEstateType.GetName], and search for a more accommodating circle of friends."
 ip_republic.18.a: "The wheels turn."
#P:A TODO Approximate: Imperator named the character's party (GetPartyName); EU5 has no parties, the character's estate is named instead
 ip_republic.19.t: "Peer Pressure"
 ip_republic.19.desc: "Attending a speech on [pa_character.Custom('pa_imp_get_debate_topic')] recently, [pa_character.GetName] was swayed by some particularly persuasive oratory.\n\nWhilst these values do not align with those of [pa_character.GetHerHis] own faction, the [pa_character.GetEstateType.GetName], surely no harm can be done by one small speech?"
 ip_republic.19.a: "Troublesome."
 STATIC_MODIFIER_NAME_command_restructuring: "Command Restructuring"
#P:A TODO Approximate: Imperator named the character ([THIS.GetCharacter.GetName]); the tooltip is shown in character scope, so the sentence is rewritten without the name
 commander_becomes_ambitious: "This commander may become more ambitious..."
 ip_republic.20.t: "Military Restructuring"
 ip_republic.20.desc: "[republic_20_target.GetName] has initiated a wide-ranging restructuring of the officers under [republic_20_target.GetHerHis] command. [republic_20_target.GetSheHe|U] assures us that this will allow for a more efficient command hierarchy.\n\nCuriously, our attache has noted that officers with strong republican ideals are not receiving any promotions, yet it is hard to deny the effectivity of this move."
 ip_republic.20.a: "We place our trust in [republic_20_target.GetShortName]."
 ip_republic.20.b: "Insist on including all officers."
 ip_republic.21.t: "Raising a Host"
 ip_republic.21.desc: "[republic_21_target.GetName], in [republic_21_target.GetHerHis] capacity as general, has begun using [republic_21_target.GetHerHis] own personal funds to augment the size of [republic_21_target.GetHerHis] assigned army.\n\nWe are unsure whether to applaud [republic_21_target.GetHerHis] initiative, or worry over the intentions behind this action."
 ip_republic.21.a: "Nonsense! [republic_21_target.GetShortName] is doing a fine job!"
 ip_republic.21.b: "Troubling. Order the new units to disband immediately."
 STATIC_MODIFIER_NAME_looted_by_friends: "Looted!"
 ip_republic.22.t: "Pillaged!"
 ip_republic.22.desc: "A group of soldiers belonging to the army commanded by [republic_22_target.GetName], has, while stationed on a peaceful deployment, absconded in order to pillage the nearby [republic_22_province.Custom('pa_imp_get_city_type_loc')] of [republic_22_province.GetName]. What is more concerning, is that [republic_22_target.GetShortName] is refusing to punish [republic_22_target.GetHerHis] legions, citing their extreme loyalty as a reason.\n\nWe are left in the disagreeable position of having to choose between forcing our general to crucify [republic_22_target.GetHerHis] own soldiers, or appearing weak and soft. We can't help but feel that [republic_22_target.GetShortName] knows precisely what [republic_22_target.GetSheHe] is doing."
 ip_republic.22.a: "It must be decimation."
 ip_republic.22.b: "We cannot afford to anger [republic_22_target.GetShortName]."
 STATIC_MODIFIER_NAME_dictatorial_extension: "Dictatorial Term"
 ip_republic.24.t: "[dictator_standing_down.GetShortName] Returns Powers"
 ip_republic.24.desc: "[dictator_standing_down.GetName] has formally returned dictatorial powers to the senate, upon the conclusion of hostilities.\n\nThe republic is, once again, at peace."
 ip_republic.24.a: "Order is restored."
 republic_25_issue_1: "dire state of the senatorial chamber"
 republic_25_issue_2: "lack of appropriate senatorial garb"
 republic_25_issue_3: "lack of marvelous iconography in the senatorial chamber"
 republic_25_issue_4: "dreadful state of the senatorial guard, who are often in attendance at important debates"
 republic_25_issue_5: "shabby state of the senatorial quarters"
 republic_25_issue_6: "lack of gourmet cuisine during senate meetings"
 ip_republic.25.t: "A Martial Demand"
 ip_republic.25.desc: "A group of senators with a vested interest in military matters of the state, have asked [oligarchic_leader.GetName] to represent their interests. Claiming that they are becoming increasingly displeased with the direction our great nation is taking, they have issued an ultimatum.\n\nThey are demanding that we address the [ROOT.GetCountry.Custom('pa_imp_republic_25_issue')]."
 ip_republic.25.a: "Pay them off."
 ip_republic.25.b: "We can trust [oligarchic_leader.GetShortName] to calm them down."
 ip_republic.25.c: "Ignore their whining."
 ip_republic.25.d: "Surely [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] can talk them around."
 conqueror_tooltip: "This option is available because your ruler has the #Y Conqueror#! trait."
 friends_with_target_ip25: "This option is available because your ruler is a friend of [oligarchic_leader.GetName]"
 ip_republic.26.t: "A Mercantile Request"
 ip_republic.26.desc: "A collection of dissatisfied senators, who have significant assets in trading fleets, mercantile ventures, and whole-sellers, have convinced [oligarchic_leader.GetName] to lobby us on their behalf, demanding that we set aside additional protection for trading routes in and around our nation.\n\nTheir request is unsubtly accompanied by a promise of support for legal matters that we might propose in the near future."
 ip_republic.26.a: "A fair trade. Make it so."
 ip_republic.26.c: "We cannot spare the men."
 STATIC_MODIFIER_NAME_wealth_tax_relief: "Wealth Tax Exemptions"
 ip_republic.27.t: "Civic Concerns"
 ip_republic.27.desc: "The leader of a faction commonly concerned with civic matters has proposed a potentially favorable deal.\n\nIn return for a brief tax relief on the wealthy, [traditionalist_leader.GetSheHe] assures us that we can rely on the support of a portion of the old elite, for a significant period."
 ip_republic.27.a: "We can afford to spare the revenue."
 ip_republic.27.b: "There is no need for this compromise."
 STATIC_MODIFIER_NAME_reduced_priest_working_hours: "Priestly Relief"
 ip_republic.28.t: "Reading the Entrails"
 ip_republic.28.desc: "On behalf of the pious, [traditionalist_leader.GetName] has come to us, indicating that the priests and holy ones involved in tending to the faithful, are finding the long hours of observance particularly taxing.\n\n[traditionalist_leader.GetSheHe|U] proposes that, in return for the support of the senators [traditionalist_leader.GetSheHe] can sway, we institute a policy of shortened working hours for priests."
 ip_republic.28.a: "We should take care of the faithful."
 ip_republic.28.b: "The omens must be taken!"
 ip_republic.28.c: "Compensate them for their overtime."
 STATIC_MODIFIER_NAME_capital_import_ip_29: "Trade Protection Policy"
 STATIC_MODIFIER_NAME_popular_unrest_ip_29: "Popular Dissatisfaction"
 ip_republic.29.t: "Popular Vote"
 ip_republic.29.desc: "Some politicians simply can't avoid consorting with the common folk. The ringleader of this rabble however, one [democratic_leader.GetName], brings an interesting deal to the table.\n\nIn return for the support of many of the deplorable populists, [democratic_leader.GetSheHe] would demand that we close an important import route to our capital, thereby providing the local people with greater control over their own affairs."
 ip_republic.29.a: "Not an unreasonable request."
 ip_republic.29.b: "Outrageous!"
 ip_republic.29.c: "Promise them bread and circuses!"
 ip_republic.30.t: "Vox Populi"
 ip_republic.30.desc: "Outraged by the political landscape of [ROOT.GetCountry.GetName], [democratic_leader.GetName] burst into the chambers of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] today, insisting that the members of the senate sympathetic to [democratic_leader.GetHerHis] cause would, under no circumstances, vote in favor of any legal changes made by our government.\n\nIndeed, [democratic_leader.GetSheHe] seemed so apoplectic, that [democratic_leader.GetSheHe] had to stagger out of the senate hall, aided by two of [democratic_leader.GetHerHis] underlings."
 ip_republic.30.a: "To every cloud..."
 STATIC_MODIFIER_NAME_electoral_extension_mod: "Extended Dictatorship"
 STATIC_MODIFIER_NAME_temp_dictator_term_length: "Dictatorial Rebuttal"
#P:A Imperator used the scope dictator_holding_power here, but the event saves dictator_holding_power_scope (a source bug); the saved scope is used
 ip_republic.32.t: "Returning Power"
 ip_republic.32.desc: "With the safety of [ROOT.GetCountry.GetName] assured, the senate have formally requested, once again, that [ROOT.GetCountry.GetGovernment.GetRulerTitle] [dictator_holding_power_scope.GetShortName] return the dictatorial powers that [dictator_holding_power_scope.GetSheHe] was granted.\n\nMuch to their concern, and backed by the strong power base of [dictator_holding_power_scope.GetHerHis] faction, [dictator_holding_power_scope.GetSheHe] has insisted on retaining the authority of dictatorship, until [ROOT.GetCountry.GetName] is truly safe once again."
 ip_republic.32.a: "This cannot end well..."
#P:A TODO No EU5 equivalent: the Return Dictatorship and Assassinate character interactions do not exist in EU5; the text is kept as in Imperator
 return_dictatorship_tooltip: "The #Y Return Dictatorship#! Character Interaction is now available for your ruler.\nThe #Y Assassinate#! Character Interaction is now available for your ruler."
 ip_republic.33.t: "Death of a Dictator"
 ip_republic.33.desc: "The untimely demise of [pa_character.GetName] has restored order in [ROOT.GetCountry.GetName]. Dictatorial powers have been rescinded, while the republic recovers."
 ip_republic.33.a: "For the republic!"
 ip_republic.35.t: "Seizure of Power"
 ip_republic.35.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], our renowned [ROOT.GetCountry.GetGovernment.GetRulerTitle], has safeguarded our nation through some of our darkest times. Nonetheless, [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] recent refusal to return the eagerly granted dictatorial powers, caused a great deal of concern amongst the senate.\n\nNow, it seems that [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] aspirations of power have reached a new level. With the support of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] faction, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] has demanded that the senate ratify a law proclaiming [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim] dictator in perpetuity!"
 ip_republic.35.a: "But the republic..."
 ip_republic.35.b: "Never!"
 every_same_party_character_loyalty_tooltip: "Every character of the same Faction as your ruler loses #R 40#! Loyalty."
 ip_republic.37.t: "Toppling a Tyrant"
 ip_republic.37.desc: "The practically autocratic behavior of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has the entire senate in upheaval. Seditious talk is rife, but one voice stands out in the hushed conversations behind [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] back.\n\n[rep_37_plotter.GetName], an upstanding member of government, with renowned republican ideals, has declared that it is time to act.\n\nThis amounts to treason, and we would be well within our right to clap [rep_37_plotter.GetHerHim] in irons... but the very republic itself is at stake."
 ip_republic.37.a: "Preposterous!"
 ip_republic.37.b: "Let [rep_37_plotter.GetHerHim] plot."
 ip_republic.37.b.tooltip: "[rep_37_plotter.GetShortName] will be allowed to plot against our ruler."
 ip_republic.38.t: "Bloodless Coup"
 ip_republic.38.desc: "In a masterstroke of political maneuvering, [rep_37_plotter.GetName] has rallied an enormous amount of support against [old_ruler.GetName].\n\nAs the senate assembled this morning, [rep_37_plotter.GetSheHe] delivered an ultimatum, removing [old_ruler.GetShortName] from power. As [rep_37_plotter.GetShortName] heard these words, [old_ruler.GetSheHe] immediately ordered the arrest of all rebellious senators, but it seems that [rep_37_plotter.GetShortName] had also secured the support of the military!\n\nThe only matter to decide now, is what to do with [old_ruler.GetShortName]."
 ip_republic.38.a: "Clap [old_ruler.GetHerHim] in irons!"
 ip_republic.38.b: "In the name of the Republic, [old_ruler.GetSheHe|U] must die."
 ip_republic.38.c: "Hold elections immediately!"
 ip_republic.38.d: "[rep_37_plotter.GetShortName] triumphant!"
 ip_republic.38.c.tooltip: "This option is available due to [rep_37_plotter.GetName] having the #Y Pious#! or #Y Humble#! traits."
#P:A TODO Approximate: EU5 has no Ambitious trait, so only Zealous (EU5 zealot) makes this option exclusive
 ip_republic.38.d.tooltip: "This option is exclusive due to [rep_37_plotter.GetName] having the #Y Zealous#! or #Y Ambitious#! traits."
 ip_republic.39.t: "Plot Discovered!"
 ip_republic.39.desc: "[rep_37_plotter.GetName] was in the middle of deep discussion with various sympathetic senators today, when a group of armed soldiers burst into [rep_37_plotter.GetHerHis] villa, arresting them all.\n\nIt would seem that any hope of ousting our tyrant, is fast disappearing."
 ip_republic.39.a: "Curses."
 STATIC_MODIFIER_NAME_foreign_citizen: "Foreign Citizen"
#P:A TODO Approximate: Imperator named the senator's party (GetParty.GetName); EU5 has no parties, the senator's estate is named instead
 ip_republic.40.t: "Spread of Corruption"
 ip_republic.40.desc: "Concerned with the spread of corruption in our government, the representative of the [anticorruption_senator.GetEstateType.GetName], Senator [anticorruption_senator.GetName], has roused sweeping support for changing our legal stance on corruption.\n\n[anticorruption_senator.GetSheHe|U] proposes that we drop [ROOT.GetCountry.Custom('pa_imp_get_current_law_anticorruption')], and replace it with far more stern anti-corruption tenets."
 ip_republic.40.a: "A splendid proposal."
 ip_republic.40.b: "Now is really not the time."
 ip_republic.41.t: "Unconventional Politics"
 ip_republic.41.desc: "Our stance on corruption has ruffled quite a few feathers among some senators who still have a rather gray view of morality.\n\n[corruption_senator.GetName] has requested that we back a change in constitution. Ironically, [corruption_senator.GetHerHis] request comes backed with the promise of quite a sizable sweetener."
 ip_republic.41.a: "How generous."
 ip_republic.41.b: "Absolutely not."
 ip_republic.41.c: "Now we're talking!"
 corrupt_bad_tooltip: "This option is #Y exclusive#! because your ruler has the #Y Corrupt#! trait."
 STATIC_MODIFIER_NAME_patron_modifier: "Patronage"
 STATIC_MODIFIER_NAME_wealthy_family_lends_senate_support: "Friends in High Places"
 ip_republic.43.t: "An Influential Family"
 ip_republic.43.desc: "[patron_family_member.GetShortName], of the renowned [patron_family_member.GetDynasty.GetName] family, has deigned to offer us the support of [patron_family_member.GetHerHis] family's vast network of contacts, in a bid to better reorganize our bureaucratic system.\n\nIt is curious that [patron_family_member.GetSheHe] should approach us now; indeed, some might wonder what the aim of this offer might really be. [patron_family_member.GetSheHe|U] only asks that we issue a proclamation in extreme gratitude for the loyalty of the family [patron_family_member.GetDynasty.GetName]. "
 ip_republic.43.a: "Well, why not?"
 ip_republic.43.b: "This smells like a trap."
 subtract_5_loyalty_family: "Every member of the family #Y [patron_family_member.GetDynasty.GetName]#! loses #R 10#! Loyalty."
 important_family_consequences: "We will be unable to act against the family [patron_family_member.GetDynasty.GetName] for #R 5#! years."
#P:A TODO Approximate: Imperator named the party leader's party (GetPartyName); EU5 has no parties, the leader's estate is named instead
 ip_republic.44.t: "No Confidence"
 ip_republic.44.desc: "[dissatisfied_party_leader.GetName], the representative of the [dissatisfied_party_leader.GetEstateType.GetName], has informed the senate that [dissatisfied_party_leader.GetSheHe] intends to supply one of our decorated generals, one [party_general.GetName], with additional funds and equipment which [dissatisfied_party_leader.GetSheHe] believes are being withheld by our government.\n\nIt should be noted that the general in question just so happens to be a stalwart member of the [dissatisfied_party_leader.GetEstateType.GetName] as well - [dissatisfied_party_leader.GetHerHis] loyalty to the state may very well be affected by such a 'donation'."
 ip_republic.44.a: "What a great initiative."
 ip_republic.44.b: "Force the senate to veto this action."
 ip_republic.44.c: "This action amounts to treason!"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetName]); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.49.t: "The Tools of the Establishment"
 ip_republic.49.desc: "The victory of known populist [ROOT.GetCountry.GetGovernment.GetRuler.GetName] in the consular elections was always going to be a source of great consternation among the more traditional factions of the senate, but it has become clear that the nomination of the other consul was in fact a shrewd maneuver ensured by these oligarchs to tie the populist's hands while in government.\n\nNaturally [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is not best pleased, nor willing to allow a colleague, who [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] has run up against previously in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] political career, to get in the way. Among the first motions proposed by [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is a 'moderate and carefully reasoned' bill ensuring that deserving veterans are granted land upon completing their service.\n\nIn a childish attempt to block the legislation almost half the senate house stand and leave the house, attempting to prevent the bill from being heard..."
 ip_republic.49.a: "We will not give up so easily..."
 ip_republic.49.at1: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_49_ruler.GetShortName] will attempt to circumvent the Senate anyway, #R upsetting the traditionalists#!."
 ip_republic.49.at2: "Up to #Y 3#! characters with #Y anti-populist#! leanings will lose #R 5#! Loyalty"
 ip_republic.49.b: "Let's work towards a compromise."
 ip_republic.49.bt: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_49_ruler.GetShortName] will attempt to placate the Senate by making concessions from their agenda."
 ip_co_consul_chain_tooltip: "An event chain will begin."
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen]); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.50.t: "Progress in the Senate"
 ip_republic.50.desc_1: "After several long and tiring committee sessions, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and the other consul have come to an agreement and hammered out a bill which, while far from the wide ranging legislation promised to the people, will be accepted by the conservative factions in the [ROOT.GetCountry.Custom('pa_imp_get_court_type')|U].\n\nThis is sure to disappoint the populists supporters, particularly the military veterans, but as they say; politics is the art of compromise..."
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen], GetHerHis); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.50.desc_2: "Unable to pass much needed reforms through a stifled senate, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has decided to take [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] bill directly to the assembly of soldiers in an attempt to have [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] measures approved without the senate's approval in a public gesture of defiance against the entrenched elites.\n\nThe assembly, being made up almost entirely of ex-soldiers, is almost certain to sanction the legislation granting land to returning veterans, and there is much popular support for the laws in [ROOT.GetCountry.GetCapital.GetName].\n\nThe other consul, however, has been quick to respond, garnering the support of several tribunes, no doubt illicitly, in order to quash the act by veto. It seems the other consul and their backers are as determined to suppress the legislation as the populists are to impel it."
 ip_republic.50.a: "These tribunes will balk under popular pressure."
 ip_republic.50.at1: "The [ROOT.GetCountry.GetGovernment.GetRulerTitle] and [ip_republic_49_ruler.GetHerHis] allies will cow the tribunes, #R further upsetting the traditionalists#!."
 ip_republic.50.at2: "Up to #Y 2#! characters with #Y populist#! leanings will gain #G 10#! Popularity\n$ip_republic.49.at2$"
 ip_republic.50.b: "Maybe an understanding is necessary after all..."
 ip_republic.50.bt: "Up to #Y 2#! characters with #Y populist#! leanings will lose #R 10#! Loyalty"
 ip_republic.50.c: "Unacceptable!"
 ip_republic.50.ct1: "The [ROOT.GetCountry.GetGovernment.GetRulerTitle] will attempt to pass the original bill by any means, #R upsetting the traditionalists#!."
 ip_republic.50.ct2: "Up to #Y 3#! characters with #Y traditional#! leanings will lose #R 5#! Loyalty"
 ip_republic.50.d: "This will have to do for now."
 ip_republic.51.t: "[ROOT.GetCountry.GetGovernment.GetRuler.Custom('pa_imp_get_ip_51_title')]"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen], pronouns); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.51.desc_1: "With the breakdown of cross-party talks, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] went straight to the soldier's assembly. The overwhelming support of these veterans, combined with public opinion precluding the intercession of tribunes veto powers, all but ensured the act's passage.\n\nIncensed, the other consul spuriously attempted to have the legislation blocked for religious reasons in a last ditch effort to block the assembly. The consul was reportedly accosted by a mob on the way to the temple, who descended on the consular entourage, destroyed the consul's symbols of office, and covered the consul with excrement as the vote was carried in the assembly.\n\nThe stricken consul later came before the Senate, making a formal complaint and requesting the bill be revoked, but received no support. Humiliated, the other consul has now stopped attending the senate at all, leading some to question whether the [ROOT.GetCountry.GetGovernment.GetRulerTitle] can now be considered sole ruler..."
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen], pronouns); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.51.desc_2: "As expected, the wide popular support gathered by [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] populist allies daunted the tribunes who rely on popular support for their seats.\n\nIncensed, the other consul spuriously attempted to have the legislation blocked for religious reasons in a last ditch effort to block the assembly. The consul was reportedly accosted by a mob on the way to the temple of [ROOT.GetCountry.Custom('pa_imp_get_sky_god')], who descended on the consular entourage, destroyed the consul's symbols of office, and covered the consul with excrement as the vote was carried in the assembly.\n\nThe stricken consul later came before the Senate, making a formal complaint and requesting the bill be revoked, but received no support. Humiliated, the other consul has now stopped attending the senate altogether, leading some to question whether the [ROOT.GetCountry.GetGovernment.GetRulerTitle] can now be considered sole ruler..."
 ip_republic.51.a: "That's what you get..."
 ip_republic.51.b: "We must extend an olive branch."
 ip_republic.51.hh: "Up to #Y 8#! Freemen will appear in sparsely populated territories."
 get_fallback_ip_51_title: "The Year of [ROOT.GetCharacter.GetShortName]"
 get_gentile_cognomen_ip_51_title: "The Consulship of [ROOT.GetCharacter.GetDynasty.GetName] and [ROOT.GetCharacter.GetNickname]"
 ip_republic.52.t: "An Uphill Battle"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen]) and the ruler's party (GetParty.GetName); EU5 has no co-rulers or parties: "the other consul" and the ruler's estate stand in. The proposal is still read from scope:ip_republic_52_co_ruler, which is never saved while EU5 lacks co-rulers
 ip_republic.52.desc: "Our current [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetName] represents the interests of the expansionist faction within the [ROOT.GetCountry.GetGovernment.GetRuler.GetEstateType.GetName], and has proposed a number of key reforms to army mustering and military supply. They derive from a wide range of experience and evidence provided by a number of retired generals and, according to [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], the efficiency of our recruitment processes will be greatly improved, not to mention the advantages to be gained on campaign.\n\nHowever, the other consul has other ideas; arguing that the costs of such reforms far outweigh any potential benefits and the state funds should instead be directed to proposals for [ip_republic_52_co_ruler.Custom('pa_imp_get_ip_rep_52_proposal_loc')].\n\nWithout the support of the other consul, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] will be hard pressed to pass the bill through the senate without dividing the government."
 ip_republic.52.a: "These reforms are essential."
 ip_republic.52.at: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_52_ruler.GetShortName] will attempt to pass their full agenda anyway, #R upsetting the other consul#!."
 ip_republic.52.b: "Nothing is ever easy, is it?"
 ip_republic.52.bt: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_52_ruler.GetShortName] will attempt to placate the other consul by making concessions from their agenda."
 ip_republic.52.c: "No one cannot be bought."
 ip_republic.52.ct: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_52_ruler.GetShortName] will bribe the other consul."
 get_ip_rep_52_civic: "expanding the bureaucracy and increasing their tax farming powers"
 get_ip_rep_52_religious: "renovating several key temples and expanding the priesthood"
 corruption_tooltip: "This option is available because of your ruler's #Y Corruption#!."
#P:A TODO Approximate: Imperator Crafty trait; the EU5 Schemer trait stands in
 crafty_tooltip: "This option is available because your ruler has the #Y Schemer#! trait."
 corrupt_tooltip: "This option is available because your ruler has the #Y Corrupt#! trait."
 line_space_tooltip: "\n"
 ip_republic.53.t: "Progress in the Senate"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen]); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.53.desc_1: "After a few days of cross party negotiating with some key stake-holders in the Senate, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has managed to secure enough support to have [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] military reform bill passed despite the opposition of the other consul and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] backers.\n\nThere is some, not unwarranted, concern that pushing through legislation in such bad favor will, however, undoubtedly only worsen relations between the two leaders and undermine future political initiatives in the [ROOT.GetCountry.GetAdjective] government. Already a few distinguished politicians have publicly denounced the backhanded methods of our [ROOT.GetCountry.GetGovernment.GetRulerTitle]...\n\nThe bill has not been brought to a vote yet, and there may still be time to attempt to heal the rift between [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and the other consul for the sake of [ROOT.GetCountry.GetName]."
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen], pronouns); EU5 has no co-rulers, the text says "the other consul" instead. The project is still read from scope:ip_republic_52_co_ruler, which is never saved while EU5 lacks co-rulers
 ip_republic.53.desc_2: "In an attempt to find common ground, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and the other consul have been discussing additions to the bill that will be more palatable to the other consul and their supporters.\n\nThe other consul suggests some of the military spending be diverted to fund a pet project that will aim to [ip_republic_52_co_ruler.Custom('pa_imp_get_ip_rep_53_project_loc')].\n\nThe changes will cost slightly more than the previously proposed bill, and may upset our generals and the more staunch proponents of the military."
 ip_republic.53.a: "Their prattling does them no credit."
 ip_republic.53.b: "Set aside a few funds for the other consul..."
 ip_republic.53.c: "Our armies deserve better."
 ip_republic.53.ct: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_52_ruler.GetShortName] will attempt to push [ip_republic_52_ruler.GetHerHis] agenda anyway, #R upsetting the other consul#!."
 ip_republic.53.d: "This will have to do."
 ip_republic.53.dt: "Up to #Y 3#! characters with #Y expansionist#! leanings will lose #R 10#! Loyalty"
 get_ip_rep_53_civic: "increase our tax income somewhat by establishing a new collection service"
 get_ip_rep_53_religious: "fund the education and living costs of young recruits to the priesthood"
 STATIC_MODIFIER_NAME_ip_rep_52_mil_small_cm: "Modest Military Reforms"
 STATIC_MODIFIER_NAME_ip_rep_52_civ_cm: "Civic Project"
 STATIC_MODIFIER_NAME_ip_rep_52_rel_cm: "Religious Project"
 ip_republic.54.t: "The [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] Reforms"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen], pronouns); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.54.desc_1: "Despite broad opposition in parts of the Senate encouraged by the other consul, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] managed to somehow secure the few key votes that enabled the bill's passage.\n\nHailed as the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] reforms, the strict standards introduced by this bill will ensure the quality of our armies and their ability to wage war effectively for some time. The military and their supporters are naturally delighted, and welcome the much needed initiatives that they have spent years lobbying for.\n\nThe political ineptitude of the other consul and their powerlessness to intervene are, as [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] is quick to argue, merely the way of politics in our tempestuous times and should not be a cause for concern."
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen]); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.54.desc_2: "Our esteemed leader, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], today presented [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] long planned military reform bill to the Senate, where it was well received across the house, despite the earlier reservations of the other consul.\n\nHailed as the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] reforms, the strict standards introduced by this bill will ensure the quality of our armies and their ability to wage war effectively for some time. The military and their supporters are naturally delighted, and welcome the much needed initiatives that they have spent years lobbying for."
 ip_republic.54.a: "May [ROOT.GetCountry.GetName] always be victorious."
 ip_republic.54.at: "Up to #Y 3#! characters with #Y expansionist#! leanings will gain #G 10#! Loyalty"
 STATIC_MODIFIER_NAME_ip_rep_52_mil_large_cm: "Extensive Military Reform"
 ip_republic.55.t: "Building Bridges"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetName]); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.55.desc: "While there is always a certain degree of toing and froing between the incumbent leaders of [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and the other consul are disagreeing more and more. Until now the topics have been fairly minor and had little effect on the state, but the ruler's differences are now threatening to spill into the public sphere.\n\nWhether as a result of personal animosity or mulish stubbornness, the other consul has been organizing opposition to an ambitious public works bill promised in the election campaign of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]; a matter close to [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] heart.\n\nThe proposed legislation will authorize the construction of an aqueduct system serving the provincial hub of [ip_rep_55_city.GetName] in [ip_rep_55_city.GetProvince.GetName], encouraging further growth and prosperity for years to come by ensuring the sanitation system and water supply are well maintained."
 ip_republic.55.a: "This bill WILL be passed."
 ip_republic.55.b: "The other consul must want something."
 ip_republic.55.c: "There's always a price."
 ip_republic.55.ct: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_55_ruler.GetShortName] will bribe the other consul."
 ip_republic.56.t: "Progress in the Senate"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen]); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.56.desc_1: "Following a few days of particularly grueling debates in the Senate, the exact lay of the political landscape has been determined and it seems [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] will be able to pass [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] bill by calling in some old favors acquired over [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] political career.\n\nThe other consul is understandably vexed at such political gamesmanship, and attempting to have the passage blocked on any grounds possible.\n\nGoing forward without good faith is sure to undermine the delicate balance of power in [ROOT.GetCountry.GetName], a risk that might not be worth taking when the other consul could be persuaded to call off the dogs in return for a few promises."
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen], pronouns); EU5 has no co-rulers, the text says "the other consul" instead. The interests are still read from scope:ip_republic_55_co_ruler, which is never saved while EU5 lacks co-rulers
 ip_republic.56.desc_2: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and the other consul have been meeting in private for the last week, debating the merits of the proposed works bill.\n\nWhile the other consul has no specific grievances with the proposed bill, even praising its scope and ingenuity, ultimately they are adamant that more investment must be directed towards the neglected [ip_republic_55_co_ruler.Custom('pa_imp_get_ip_rep_55_interest_loc')] interests of their faction in order for them to gather their support for the [ROOT.GetCountry.GetGovernment.GetRulerTitle].\n\nThe proposed changes will, however, cost slightly more than we had planned to implement and take the attention of the related administration for awhile..."
 ip_republic.56.a: "Call in all debts."
 ip_republic.56.b: "Promise the other consul some funds..."
 ip_republic.56.c: "Why must we always scrape?"
 ip_republic.56.ct: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_55_ruler.GetShortName] will attempt to push [ip_republic_55_ruler.GetHerHis] agenda anyway, #R upsetting the other consul#!."
 ip_republic.56.d: "We can't afford to alienate the other consul..."
 get_ip_rep_55_military: "military and security"
 get_ip_rep_55_religious: "religious and legal"
 get_ip_rep_55_populist: "charity and pension"
 STATIC_MODIFIER_NAME_ip_rep_55_city_small_sm: "Grateful Province"
 STATIC_MODIFIER_NAME_ip_rep_55_city_large_sm: "Honored Province"
 ip_republic.57.t: "The [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] Baths of [ip_rep_55_city.GetName]"
 ip_republic.57.desc_1: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] ambitious civic projects have finally triumphed over the petty political squabbles of the Senate.\n\nAlready, vast numbers of workmen have been directed to the province of [ip_rep_55_city.GetProvince.GetName] to begin the erection of an aqueduct and reservoir serving the [ip_rep_55_city.Custom('pa_imp_get_city_type_loc')] of [ip_rep_55_city.GetName], and its planned lavish bathhouse and public fountains.\n\nNeedless to say, both the local administration and the province's population are extremely grateful and honored to be the recipient of the works, and the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] baths are sure to make an impression on all who visit them."
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen]); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.57.desc_2: "In a surprise turn of events, a few days before the crucial vote on the public works bill put forward by [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], the other consul dropped all opposition to the proposals and even spoke positively of them on the Senate floor.\n\nAlready, vast numbers of workmen have been directed to the province of [ip_rep_55_city.GetProvince.GetName] to begin the erection of an aqueduct and reservoir serving the [ip_rep_55_city.Custom('pa_imp_get_city_type_loc')] of [ip_rep_55_city.GetName], and its planned lavish bathhouse and public fountains.\n\nNeedless to say, both the local administration and the province's population are extremely grateful and honored to be the recipient of the works, and the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] baths are sure to make an impression on all who visit them. "
 ip_republic.57.a: "These works shall not be forgotten."
 ip_republic.58.t: "A Fair Trade"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetName], pronouns); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.58.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] allies are staunch proponents of the guilds and traders of [ROOT.GetCountry.GetCapital.GetName], and have long been planning legislation aimed at increasing their profits. They propose a complicated but well reasoned mixture of laws affecting production standards, currency exchange, and tariffs, which has wide support in merchant circles.\n\nSadly, the other consul is intensely opposed to the bill, for any number of poor arguments plucked out of the air when confronted on the issue. The other consul apparently has a personal vendetta against several of the traders who stand to benefit the most and wields a not inconsiderable amount of power in the Senate..."
 ip_republic.58.a: "To the jackals with them then!"
 ip_republic.58.at: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_58_ruler.GetShortName] will attempt to pass their full agenda anyway, #R upsetting the other consul#!."
 ip_republic.58.b: "What exactly does the other consul care about?"
 ip_republic.58.bt: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_58_ruler.GetShortName] will attempt to placate the other consul by making concessions from their agenda."
 ip_republic.58.c: "Come now, there is plenty of gold to go around."
 ip_republic.58.ct: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_58_ruler.GetShortName] will bribe the other consul."
 ip_republic.59.t: "Progress in the Senate"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen], pronouns); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.59.desc_1: "In a stroke of political luck, while considering the best way to approach winning votes for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] trade proposals, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was approached by a key voting bloc until now opposed to the legislation.\n\nThe bloc has been attempting to secure labor for their own needs for some time without luck, and seeing the opportunity has approached us with the offer of backing the bill in return for the government approving a modest apportionment of manpower.\n\nThis would, by far, be the surest way to ensure the reforms are passed but circumventing the other consul in this way is guaranteed to only upset them further. We could instead pass the other consul the funds for their projects from our future budget, a move that their own power base is sure to support..."
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen]) and the co-ruler's party (GetParty.GetName); EU5 has no co-rulers or parties, the text says "the other consul" instead. The interests are still read from scope:ip_republic_58_co_ruler, which is never saved while EU5 lacks co-rulers
 ip_republic.59.desc_2: "Following the disagreements in the Senate, the other consul submitted a list of demands necessary to secure the backing of their supporters in the upcoming vote on the trade reforms proposed by [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName].\n\nThe demands of the other consul's faction are a curtailed trade reform that favors domestic over foreign trading agreements combined with an investment in[ip_republic_58_co_ruler.Custom('pa_imp_get_ip_rep_58_interest_loc')], at considerable expense.\n\nWithout the support of the other consul, we will have to look for another way forward... "
 ip_republic.59.a: "Send them the men..."
 ip_republic.59.b: "Let's renegotiate with the other consul."
 ip_republic.59.c: "We won't tolerate these absurd demands."
 ip_republic.59.ct: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_58_ruler.GetShortName] will attempt to push [ip_republic_58_ruler.GetHerHis] agenda anyway, #R upsetting the other consul#!."
 ip_republic.59.d: "Not perfect, but good enough."
 get_ip_rep_58_military: " the quality of our army's training and the pay of its officers"
 get_ip_rep_58_religious: " temple upkeep and festivals"
 get_ip_rep_58_populist: " the basic bread dole and military pensions"
