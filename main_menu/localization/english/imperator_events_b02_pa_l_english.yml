 STATIC_MODIFIER_NAME_ip_rep_58_mil_cm: "Military Project"
 STATIC_MODIFIER_NAME_ip_rep_58_mer_small_cm: "Modest Trade Reforms"
 ip_republic.60.t: "The [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] Policy"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen]); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.60.desc_1: "Subsequent to a tense and rather heated debate, the trade bill proposed by [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has been approved by the Senate, much to the disdain of the other consul.\n\nDubbed the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] Policy, it is hoped to bolster the valuable work of traders and diplomats in securing foreign commerce agreements and ensuring our guilds remain competitive. [ROOT.GetCountry.GetCapital.GetName] will strive to remain the center of local trade routes for the foreseeable future."
 ip_republic.60.desc_2: "In a surprising turn of events most of the political opposition to the trade bill of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] evaporated at the last moment, and it has now been approved by the Senate.\n\nDubbed the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] Policy, it is hoped to bolster the valuable work of traders and diplomats in securing foreign commerce agreements and ensuring our guilds remain competitive. [ROOT.GetCountry.GetCapital.GetName] will strive to remain the center of local trade routes for the foreseeable future."
 ip_republic.60.a: "[ROOT.GetCountry.GetName] will prosper under [ROOT.GetCountry.Custom('pa_imp_get_commerce_god')]."
 STATIC_MODIFIER_NAME_ip_rep_58_mer_large_cm: "Extensive Trade Reforms"
 ip_republic.61.t: "The Grace of the Gods"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetName]); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.61.desc: "Our pious [ROOT.GetCountry.GetGovernment.GetRulerTitle], [ROOT.GetCountry.GetGovernment.GetRuler.GetName], is a proud spokes[ROOT.GetCountry.GetGovernment.GetRuler.GetWomanMan] for the pontiffs of [ROOT.GetCountry.GetName] and the glorious gods they serve. A large proportion of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] vote came from those who argue that the temples of [ROOT.GetCountry.GetCapital.GetName] have long been in need of renovations; [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] went even further, however, and proposed the construction of a modest temple to a fashionable and growing cult of [ROOT.GetCountry.Custom('pa_imp_get_god_of_light')] particularly popular with the lower classes.\n\nIn spite of this, the other consul has been unrelenting in their appraisal of the motion, holding forth at length on the fine quality of our temples, and arguing against needless and expensive pandering to the 'whims of fashion' when far more deserving deities lack the same attention. As things stand, there is no longer a clear majority for the project..."
 ip_republic.61.a: "We serve the gods!"
 ip_republic.61.at: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_61_ruler.GetShortName] will attempt to pass their full agenda anyway, #R upsetting the other consul#!."
 ip_republic.61.b: "Perhaps we can shoehorn another temple into the bill..."
 ip_republic.61.bt: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_61_ruler.GetShortName] will attempt to placate the other consul by making concessions from their agenda."
 ip_republic.61.c: "Anyone can be persuaded, for the right price."
 ip_republic.61.ct: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_61_ruler.GetShortName] will bribe the other consul."
 ip_republic.62.t: "Progress in the Senate"
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen]) and the ruler's party (GetParty.GetName); EU5 has no co-rulers or parties: "the other consul" and the ruler's estate stand in
 ip_republic.62.desc_1: "The religious bill proposed by [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] comes to a vote in a few days and, without the support of the other consul, some other means of securing ballots will need to be arrived at.\n\nThe power of the religious faction within the [ROOT.GetCountry.GetGovernment.GetRuler.GetEstateType.GetName] is often understated; there are many god fearing senators who will not pass up an opportunity to glorify the deities and have their names carved into marble. By invoking our influence with the augurs we can ensure the correct result at the polls, though it may be setting a dangerous precedent..."
#P:A TODO No EU5 equivalent: Imperator named the co-ruler ([ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetPraenomen], pronouns); EU5 has no co-rulers, the text says "the other consul" instead
 ip_republic.62.desc_2: "Discussions between [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and the other consul have been fruitful, and it seems that the reservations of the other consul and their supporters mainly stem from a perceived populist slant to the bill.\n\nThe other consul argues that we should not give preference to the gods popular with the lower classes alone, and that a more general renovation of the main temple complexes such as that dedicated to [ROOT.GetCountry.Custom('pa_imp_get_sky_god')], would be more palatable to the Senate."
 ip_republic.62.a: "The pious hold far more power than some think."
 ip_republic.62.b: "Just grant the funds..."
 ip_republic.62.c: "[ROOT.GetCountry.Custom('pa_imp_get_god_of_light')] would never forgive us!"
 ip_republic.62.ct: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_republic_61_ruler.GetShortName] will attempt to push [ip_republic_61_ruler.GetHerHis] agenda anyway, #R upsetting the other consul#!."
 ip_republic.62.d: "We can stomach this."
 STATIC_MODIFIER_NAME_ip_rep_61_rel_small_cm: "Modest Religious Renovations"
 STATIC_MODIFIER_NAME_ip_rep_61_rel_large_cm: "Extensive Religious Renovations"
 ip_republic.63.t: "The [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] Shrine"
 ip_republic.63.desc: "The vote on the most pious bill of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] was passed easily and with much rejoicing after several positive auguries. A victory no doubt assured by father [ROOT.GetCountry.Custom('pa_imp_get_sky_god')] and all the gods, who must surely smile at the great honors they will receive.\n\nSeveral of the most important temples in the capital will be renovated, and a new festival is planned to coincide with the unveiling of the shrine to [ROOT.GetCountry.Custom('pa_imp_get_god_of_light')]. The opening occasion is slated to be among the most well attended public events in [ROOT.GetCountry.GetCapital.GetName] for quite some time, and the people are uncharacteristically enthused with religious fervor."
 ip_republic.63.a: "Praise [ROOT.GetCountry.Custom('pa_imp_get_sky_god')]!"
 ip_republic.64.t: "Senatorial Resistance"
 ip_republic.64.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has proven to be a contentious candidate as [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Previously an outspoken critic of the government, [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] was spoken of with contempt during meetings of the senate. All were surprised, therefore, when [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] was elected to rule [ROOT.GetCountry.GetName], casting aside any notions of propriety and class.\n\nWith such underwhelming popularity amongst the elite, it is hard to see how [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] will get anything done."
 ip_republic.64.a: "It is not worth upsetting the balance just yet."
 ip_republic.64.b: "Bring them to heel. Vague threats never hurt anyone!"
 ip_republic.65.t: "Unpopular Consul"
 ip_republic.65.desc: "Never one to challenge the status quo, or even to do anything remotely considered interesting; [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been elected [ROOT.GetCountry.GetGovernment.GetRulerTitle] by a slim majority of dull buffoons in wine-stained togas.\n\nIt would be fair to say, perhaps, that [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] does not hold the confidence of the people in the same manner as the stoic rulers of old."
 ip_republic.65.a: "Ah... time will see this division healed."
 ip_republic.65.b: "The people simply love circuses!"
 ip_republic.65.c: "Execute some of them; they'll come around."
