 get_beautifulness_charmless: "charmless"
 get_beautifulness_pious: "pious"
 get_beautifulness_fair: "fair"
 scheme.23.t: "[ongoing_scheme_target.GetDynasty.GetName] Refuse our Offer"
 scheme.23.desc: "Our offer to arrange a political marriage between [spurned_suitor.GetName] and a member of the [ongoing_scheme_target.GetDynasty.GetName] family has been met with scorn from their head, [ongoing_scheme_target.GetName]. [ongoing_scheme_target.GetSheHe|U] has made it very clear that unless things change drastically in this country there will be no talk of a marriage between their family and ours."
 scheme.23.a: "How dare [ongoing_scheme_target.GetSheHe]?"
 scheme.24.t: "A Political Marriage?"
 scheme.24.desc: "Marriage contracts are never entered into lightly. Traditionally this is how two families are bound together, not just in matrimony, but also in a political alliance that is expected to continue as long as they are linked. The marriage of [would_be_suitor.GetName] is therefore a matter of state.\n\nA rigorous search has begun for a suitable match among the many relatives of the [ongoing_scheme_target.GetDynasty.GetName] family, however distant. Once a suitable match has been found, [ongoing_scheme_target.GetName] will be approached with an offer of marriage."
 scheme.24.a: "A mere formality, surely?"
 scheme_ambition_seek_a_spouse_event_tt: "This scheme will have succeeded when [would_be_suitor.GetName] has found a suitable political marriage match within the [ongoing_scheme_target.GetDynasty.GetName] family."

 # disasters_inv.txt
 disasters_inv.1.t: "Floodings in [the_day_after.GetName]"
 disasters_inv.1.desc: "The water levels in [the_day_after.GetName] have risen to unprecedented highs! Many have fled their homes, abandoning their entire livelihoods in their desperation to escape, but many have died already and we fear that these numbers will continue to grow. Needless to say, production in the area has fallen to an all-time low; the once-benevolent and fertile river that brought prosperity to [the_day_after.GetName] now only brings ruin and devastation."
 disasters_inv.1.a: "We must prepare the surrounding areas should the flood propagate."
 disasters_inv.1.b: "Oh no! Anyway..."
 disasters_inv_destroyed_building: "A building may be destroyed."
 STATIC_MODIFIER_NAME_flood_initial_damage: "Flooding"
 STATIC_MODIFIER_NAME_flood_reduced_damage: "Flooding"
 disasters_inv.2.t: "The Flood Expands"
 disasters_inv.2.desc: "The nightmare continues, for the flood in [the_day_after.GetName] has expanded and now encroaches on the neighboring settlements, which were already swelled to bursting with refugees from the disaster. The local governor from the region reports that we have the situation under control, however. Whilst the damage isn't as bad as we initially feared, it will take time until the area can function fully again. Worse yet, the inhabitants have decreased in number, which means that the productivity will be lower than before."
 disasters_inv.2.a: "May the gods have mercy on us."
 disasters_inv.3.t: "The Floods Recede"
 disasters_inv.3.desc: "The flood is receding, at long last. While we have lost so much, there still remains hope - truly our people are indomitable. The inhabitants of [the_day_after.GetName] have started to return, rebuilding their homes. It will be a very long time before [the_day_after.GetName] fully recovers, however; much work remains to be done, but thankfully, the people have the appetite for it. May we pray that no such an event will occur in our lifetimes again."
 disasters_inv.3.a: "The worst is over."
 disasters_inv.4.t: "An Avalanche"
 disasters_inv.4.desc: "We have received news of a calamity! An avalanche hit [snowball.GetName] and caused great damage to life and property; the local roads are impassable, due to the sheer amount of snow that has fallen, and we have heard reports that local infrastructure has been damaged. Until [snowball.GetName] is rebuilt, not many will want to live or work there. \nNot far away, there has recently been another avalanche. Maybe they are connected? If people start to believe these lands are cursed, no one will ever want to live there. What is causing these avalanches? It is said that vibrations may de-clench one - the cries of help surely are to be considered."
 disasters_inv.4.a: "May their souls rest in peace."
 STATIC_MODIFIER_NAME_hit_by_avalanche: "Hit by Avalanche"
 disasters_inv.5.t: "A Landslide"
 disasters_inv.5.desc: "Misery upon misery! We have terrible news from [mudstick.GetName], which has been suffering from bad weather. It has been raining for weeks, and we have heard reports that a tremendous landslide has now ruined the surrounding countryside. Tenacious as ever, the local residents are trying to rescue each other and are burying their dead, but the scale of the problem is too vast for their meager resources. Passage through the territory has become difficult for any traveler, drying up trade, and the broken, mud-spattered buildings aren't pretty to look at. Something should be done."
 disasters_inv.5.a: "We must prepare for more!"
 disasters_inv.5.b: "Oh no! Anyway..."
 STATIC_MODIFIER_NAME_the_land_slides_into_your_dms: "Landslide"
 disasters_inv.6.t: "A Second Wave"
 disasters_inv.6.desc_1: "This morning, another landslide hit [mudstick.GetName]. However, you will be pleased to hear that our preparations bore fruit and no substantial losses were incurred. The people are thankful that they have such a wise and loving leader, one who cares for all of the inhabitants of our realm equally."
 disasters_inv.6.desc_2: "We should have listened to the wise advice that we so rashly ignored. Had we done something, anything, to help the poor inhabitants of [mudstick.GetName] after the last landslides came, then perhaps we wouldn't have an even larger problem to deal with now. As was predicted, another landslide has wreaked havoc in the region, causing even more loss of life. While the lives of [mudstick.GetName] aren't as precious as those of our own people, we do not have the luxury or necessity to waste them."
 disasters_inv.6.a: "Luckily, we were prepared"
 disasters_inv.6.b: "Patience is a virtue we don't have."
 disasters_inv.7.t: "Drought in [i_am_thirsty.GetName]"
 disasters_inv.7.desc: "[i_am_thirsty.GetName] experiences a time of extreme water scarcity. The grounds are bone-dry, swollen and cracked, making farming nigh impossible, and now merchants are starting to avoid the area, knowing they will not make good profits in the deserted markets. Water has become so scarce that the first fights over its ownership have erupted - you have heard reports of mobs guarding the dwindling wells in their villages, making sure that no stranger steals what was once freely given. Luckily, the surrounding area still has water resources that we could command be shared - this would make many unhappy, however. We have to decide what we prioritize."
 disasters_inv.7.a: "We must help our subjects!"
 disasters_inv.7.b: "Who cares?"
 STATIC_MODIFIER_NAME_grow_a_pear: "Drought"
 STATIC_MODIFIER_NAME_i_bet_you_wish_you_had_my_water: "Water Supplies Shared"
 disasters_inv.8.t: "Famine"
 disasters_inv.8.desc: "You received a bit of unpleasant news during the morning meal which soured your mood. The drought originating in [i_am_thirsty.GetName] has started to affect the entire region and has now turned into a famine. The price of bread has quadrupled, when one can find it, and there is a thriving black market for stolen foodstuffs despite our best efforts to stamp them out. Starving peasants are turning to banditry, compounding the situation. The lack of water is killing everything and everyone; not even camels, the resilient beasts, are immune to it. There is no good news to be found here."
 #P:A Imperator text was "#RNGesus please#" (an unclosed formatting tag); the tag marks are dropped
 disasters_inv.8.a: "May the gods have mercy. RNGesus please"
 disasters_inv.8.b: "I have changed my mind."
 disasters_inv_8_a_1: "The drought may spread further."
 disasters_inv_8_a_2: "The drought may soon come to an end."
 #P:A TODO No EU5 equivalent: only the merciful (EU5 kind_hearted) part of this condition exists in EU5
 disasters_inv_8_b: "This option is available due to your ruler being either merciful, lapsed, arbitrary or a lunatic."
 disasters_inv.9.t: "The Storm of the Century"
 disasters_inv.9.desc: "A fearsome storm originating in [stormy_mommy.GetArea.GetRegion.GetName] has arrived in [stormy_daniels.GetName] and has caused great devastation. Ships are sinking in the harbors, unable to withstand the fury of the waves which now carry the bodies of drowned sailors to our shores. Many are mourning their relatives who died in the event, searching the beaches for lost loved ones - truly a grim task. [stormy_daniels.GetName]'s citizens have rallied, however, to move past this horrendous event and rebuild their town; they are an inspiration to us all."
 disasters_inv.9.a: "The gods are moody."
 disasters_inv.10.t: "The Wind of Gods"
 disasters_inv.10.desc: "The sandstorm from [sandman_daddy.GetArea.GetRegion.GetName] has hit [sandman.GetName], causing great misery among the poor inhabitants who must suffer through it. The sandstorm hinders any and all movement and the local militia are stuck, unable to help the residents. Everyone has basically hunkered down where they are, waiting for the cursed sands to stop their infernal blowing. In the face of this terrible disaster, [sandman.GetName]'s citizen have rallied, however, vowing to recollect that which was lost to the winds."
 disasters_inv.10.a: "The gods are moody."
 disaster_spread_chance_tt: "This disaster may spread"
 STATIC_MODIFIER_NAME_sand_up_comedy: "Sandstorm of the Century"
 disasters_inv.11.t: "Snowstorm of the Ages"
 disasters_inv.11.desc: "The heavy snowstorm from [snow_daddy.GetArea.GetRegion.GetName] has surprised [not_snowden.GetName]'s hardy inhabitants, who are used to such things; even the local elders cannot remember a winter that was as harsh as this one. The storm hinders any and all movement; not even the most stubborn of mules can pass through the thick layer of snow blanketing the land. [not_snowden.GetName]'s citizens now sit at home, trying to not freeze to death. This has brought all production to a halt, except for the barest of housework."
 disasters_inv.11.a: "The gods are moody."
 STATIC_MODIFIER_NAME_jizz_storm: "Snowstorm of the Century"
 disasters_inv.12.t: "Locust Swarm Sighted"
 disasters_inv.12.desc: "A swarm of locusts was sighted in [we_are_hungry.GetName]. Their numbers are so great that it is said the sun cannot be seen in the skies when they pass through, but this cannot be true. Still, the reports are disturbing; they have been eating everything that came into their sight, traveling from field to field, town to town. We should keep an eye on the situation, but right now, it doesn't appear to be a full-fledged disaster."
 disasters_inv.12.a: "We have to act now, while there is time."
 disasters_inv.12.b: "It's only some bugs."
 anti_locust_power_tt: "There is a chance that the locusts will #G not swarm#! further if you act #R now#!."
 STATIC_MODIFIER_NAME_light_locust_plague: "Locust Swarm"
 STATIC_MODIFIER_NAME_locust_plague: "Locust Plague"
 STATIC_MODIFIER_NAME_locust_plague_non_plant: "Locust Plague"
 disasters_inv.13.t: "Locust Swarm is Growing"
 disasters_inv.13.desc: "We are being invaded, but by an army of insects! The swarm that was first sighted in [we_are_hungry.GetName] has spread to neighboring villages, their blight hindering the supply of food. The distressed farmers are begging for your assistance, my [ROOT.GetCountry.GetGovernment.GetRulerTitle]; they sound absolutely terrified in the messages we are receiving."
 disasters_inv.13.a: "We have to act, now!"
 disasters_inv.13.b: "They know nothing."
 disasters_inv.14.t: "The Locust Plague"
 disasters_inv.14.desc: "The locust swarm from [we_are_hungry.GetName] has now become bigger and bigger - the massive horde has even split into a few smaller ones, all hunting for food. Every settlement in the vicinity of [we_are_hungry.GetName] has been stripped of every inch of plant material. Some of the stories you have been hearing are insane; people venturing out of their houses are having the literal clothes eaten off of their backs. The cattle, the people, the wildlife - everyone and everything is now starving, and some people are dying. We have to find a solution now, should we want to see next winter."
 disasters_inv.14.a: "Better late than never."
 disasters_inv.14.b: "We will survive it as is."
 locusts_spreading_tt: "The locusts #R spread#! to every territory bordering [we_are_hungry.GetName] and then beyond, field after field, settlement after settlement. \nThese territories gain the following modifier, if a #G plant#! related trade good is produced."
 locusts_spreading_2_tt: "If it is a #G non-plant#! trade good it will receive this modifier."
 locusts_spreading_3_tt: "All bordering territories aren't affected as badly - yet?"
 disasters_inv.15.t: "The Locusts are gone"
 disasters_inv.15.desc: "The newest reports coming out of [we_are_hungry.GetName] and the surrounding area indicate that the locusts have mostly disappeared. The danger of a locust plague is no longer pending, but it will be a while before the region completely recovers. Hopefully, the damnable creatures are now in the lands of our enemies...may they never return!"
 disasters_inv.15.a: "Finally!"

