l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b14 (2026-10-19)

 # storms.txt
 STATIC_MODIFIER_NAME_stormy_seas: "Stormy Seas"

 # schemes.txt
 scheme.1.t: "Theft!"
 scheme.1.desc: "That dastardly rogue, [thief.GetName], crept into the villa of [pa_character.GetShortName] last night, and made off with a sizable quantity of valuable paraphernalia.\n\nProof of such an action is hard to come by, and for now, we must tolerate the taunting gaze of [thief.GetShortName] from across the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] floor."
 scheme.1.a: "Curses!"
 scheme.1.b: "'[pa_character.GetShortName], join us in this alleyway for a moment...'"
 scheme.1.c: "Wait, wait! TAKE IT ALL!!!"
 high_martial_character_tt: "This option is available due to the high #Y Martial#! skill of [pa_character.GetName]."
 scheme.2.t: "Bungling Burglar"
 scheme.2.desc: "In the dead of night, [thief.GetName] scaled the walls of the abode belonging to [pa_character.GetName]. What [thief.GetSheHe] failed to recognize perhaps, was that [pa_character.GetShortName] [pa_character.GetHerselfHimself] was indulging in a late-night wine-tasting session with a few of [pa_character.GetHerHis] closest friends.\n\nNeedless to say, [thief.GetShortName] came to [thief.GetHerHis] senses after being pitched from the nearest balcony."
 scheme.2.a: "Good riddance!"
 scheme.4.t: "Legal Challenge"
 scheme.4.desc: "The law is a tiresome invention. Brandishing papers, and surrounded by lackeys, [thief.GetName] curtly informed us that a plot of land owned by [pa_character.GetName] was in fact, owned by [thief.GetHerHis] branch of the family [thief.GetDynasty.GetName].\n\nSpurious though these claims may be, [thief.GetShortName] appears to have the paperwork to back this up."
 scheme.4.a: "We didn't need that land anyway."
 scheme.4.b: "Isn't [thief.GetShortName] more interested in... gold?"
 scheme.4.c: "We shall settle this.. IN THE ARENA!!!"
 gladiatorial_combat_scheme: "[thief.GetShortName] and [pa_character.GetName] will fight to the death."
 STATIC_MODIFIER_NAME_family_estate_modifier: "Family Estate"
 STATIC_MODIFIER_NAME_family_estates_being_expanded_modifier: "Family Estate Enlargment"
 scheme.5.t: "Legal Chicanery"
 scheme.5.desc: "In an outrageous display of brazen ineptitude, [thief.GetName] challenged the ownership of a holding belonging to [pa_character.GetName], this afternoon. With only a set of blatantly forged documents to back up [thief.GetHerHis] claim, the proceedings did not last long.\n\nShould we press for recompense?"
 scheme.5.a: "Our time is valuable."
 scheme.5.b: "This land has belonged to us for generations!"
 scheme.5.c: "A slap on the wrist ought to suffice."
 scheme.6.t: "Seeking a Patron"
 scheme.6.desc: "As custom dictates, the eager yet politically inexperienced [patronage_requester.GetName] has approached us in obeisance, asking for our formal patronage.\n\nSuch a request carries few practical duties, but would increase the standing of [patronage_requester.GetShortName] amongst [patronage_requester.GetHerHis] peers. Such a benevolent action may also ingratiate us with the [ROOT.GetCountry.GetAdjective] elite."
 scheme.6.a: "Consider it done."
 scheme.6.b: "Alas, we seem to be somewhat busy washing our hair."
 stunning_puns_tt: "The entire [ROOT.GetCountry.Custom('pa_imp_get_court_type')] is impressed by this stupendous pun:"
 STATIC_MODIFIER_NAME_patronage_cmod: "Sought Patronage"
 scheme.8.t: "Lofty Notions"
 scheme.8.desc_1: "[demand_office_event_scope.GetName] and [demand_office_event_scope.GetHerHis] dreams of high office are fairly well known in the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] of [ROOT.GetCountry.GetName], but recently [demand_office_event_scope.GetSheHe] has been lobbying more urgently of [demand_office_event_scope.GetHerHis] suitability and deservedness for a role suiting [demand_office_event_scope.GetHerHis] skill set.\n\nWhile ordinarily we would be able to appoint whoever we liked to the post without causing offense or starting rumors, the enthusiasm of [demand_office_event_scope.GetName] has put us in a rather awkward position..."
 #P:A TODO No EU5 equivalent: Imperator named the incumbent's office ([demand_office_old_officer_scope.GetOffice.GetName]); EU5 has no offices, the text says "the post held by"
 scheme.8.desc_2: "[demand_office_event_scope.GetName] and [demand_office_event_scope.GetHerHis] dreams of high office are fairly well known in the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] of [ROOT.GetCountry.GetName], but recently [demand_office_event_scope.GetSheHe] has been lobbying more urgently of [demand_office_event_scope.GetHerHis] suitability and deservedness for the post held by [demand_office_old_officer_scope.GetName].\n\nWhile ordinarily we would be able to appoint whoever we liked to the post without causing offense or starting rumors, the enthusiasm of [demand_office_event_scope.GetName] has put us in a rather awkward position regarding the incumbent official, [demand_office_old_officer_scope.GetName]..."
 scheme.8.a: "Just give [demand_office_event_scope.GetHerHim] the job."
 scheme.8.b: "Anything for my old mucker [demand_office_event_scope.GetShortName]."
 scheme.8.bt: "\nThis option is available due the friendship of [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and [demand_office_event_scope.GetName]."
 scheme.8.c: "How badly does [demand_office_event_scope.GetSheHe] want it?"
 scheme.8.ct: "\nThis option is available due to the reproachable character of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
 scheme.8.d: "[demand_office_event_scope.GetShortName], maybe this just isn't your thing?"
 scheme.8.dt: "\nThis option is available due to the persuasive talents of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
 scheme.8.e: "A flat denial will have to suffice."
 scheme.8.f: "Ha! But [demand_office_event_scope.GetShortName] can't hold a candle to [demand_office_old_officer_scope.GetShortName]!"
 scheme.8.ft: "\nThis option is available due to the wanting tact of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
 #P:A TODO No EU5 equivalent: Imperator named the office ([demand_office_old_officer_scope.GetOffice.GetName]) and showed a skill icon; EU5 has no offices, so these four tooltips say "This post"
 scheme.8.martialtooltip: "\nThis post is best filled by someone familiar with all things #Y Military#!."
 scheme.8.finessetooltip: "\nThis post is best filled by someone with peerless #Y Administrative#! skill."
 scheme.8.charismatooltip: "\nThis post is best filled by someone with matchless #Y Diplomatic#! skill."
 scheme.8.zealtooltip: "\nThis post is best filled by someone with a great amount of #Y Zeal#!."
 scheme.9.t: "Murder!"
 scheme.9.desc: "We have been informed that [ongoing_scheme_target.GetName] was found brutally murdered in [ongoing_scheme_target.GetHerHis] home, just last night.\n\nThe investigators have reported that a [ROOT.GetCountry.Custom('pa_imp_get_arena_death_implement_glad')] was used in the crime - a device known to be favored by [murderer.GetName], however, we have no hard evidence to link [murderer.GetHerHim] to the crime.\n\nRegardless, we should be watchful."
 scheme.9.a: "A travesty, but we are powerless to act."
 scheme.9.b: "Let all know that we consider [murderer.GetShortName] guilty!"
 got_club: "heavy club"
 got_sword: "honed sword"
 got_mace: "mace"
 got_rusty_spike: "rusty spike"
 got_battering_ram: "convenient battering ram"
 got_pike: "wicked pike"
 got_rock: "jagged rock"
 got_chains: "length of chain"
 got_bare_hands: "bare hands"
 scheme.10.t: "Caught Red-Handed"
 scheme.10.desc: "Hauled in front of the [ROOT.GetCountry.Custom('pa_imp_get_court_type')], [failed_murderer.GetName] is a sorry sight. Caught with [ROOT.GetCountry.Custom('pa_imp_get_arena_death_implement_glad')] in hand, [failed_murderer.GetSheHe] is said to have been ready to strike down [ongoing_scheme_target.GetName] in a brutal act of violence.\n\nLuckily, passers by were quick enough to act and prevent this terrible deed, and we now have the unenviable task of passing judgment on the wicked [failed_murderer.GetShortName]."
 scheme.10.a: "We shouldn't be too hasty..."
 scheme.10.b: "The dungeon will straighten [failed_murderer.GetHerHim] out."
 scheme.11.t: "Ancient Bloodlines"
 scheme.11.desc: "The royal library of [ROOT.GetCountry.GetCapital.GetName] has proven an invaluable source of knowledge over the years - it would seem that this year is no exception. Whilst researching the proud heritage of [pa_character.GetHerHis] bloodline, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName] discovered a small tablet tucked into an alcove, long thought forgotten.\n\nIn near-indecipherable script, it detailed a branch of House [pa_character.GetDynasty.GetName], which appears to be connected to the legendary bloodlines, through [ancestor.GetName].\n\nThis knowledge shall not go to waste."
 scheme.11.desc_1: "The royal library of [ROOT.GetCountry.GetCapital.GetName] has proven an invaluable source of knowledge over the years - it would seem that this year is no exception. Whilst researching the proud heritage of [pa_character.GetHerHis] bloodline, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName] discovered a small tablet tucked into an alcove, long thought forgotten.\n\nIn near-indecipherable script, it detailed a branch of House [pa_character.GetDynasty.GetName], which appears to be connected to the legendary King Arganthonios, through [ancestor.GetName].\n\nThis knowledge shall not go to waste."
 scheme.11.a: "Astounding!"
 gained_diadochi_bloodline_trait: "[pa_character.GetName] and has gained a #Y Bloodline#! trait."
 gained_diadochi_bloodline_trait_children: "[pa_character.GetName] and [pa_character.GetHerHis] progeny have gained a #Y Bloodline#! trait."
 scheme.12.t: "Escape!"
 scheme.12.desc: "In a daring display of heroic bravado, [ongoing_scheme_target.GetName] has managed to escape [ongoing_scheme_target.GetHerHis] captors, and flee to the cursed lands of [escape_target.GetName].\n\nPresumably aided by [ongoing_scheme_target.GetHerHis] friends and supporters, [ongoing_scheme_target.GetSheHe] also vowed to return with great numbers, and has claimed part of our territory as [ongoing_scheme_target.GetHerHis] own."
 scheme.12.a: "Damnation!"
 scheme.12.at: "#Y [escape_target.GetName]#! gains claims on the #Y [target_state.GetName]#!"
 scheme.12.b: "Smooth over the situation with [escape_target.GetName]."
 scheme.13.t: "Foreign Flight"
 scheme.13.desc: "A curious [origin_country.GetAdjective] [ongoing_scheme_target.GetWomanMan] appeared upon our borders today, claiming asylum from [ongoing_scheme_target.GetHerHis] captors in [origin_country.GetName].\n\n[ongoing_scheme_target.GetSheHe|U] additionally promises us rich land in [ongoing_scheme_target.GetHerHis] home country, should we seek to exact vengeance on [ongoing_scheme_target.GetHerHis] behalf."
 scheme.13.a: "Well, why not? Make [ongoing_scheme_target.GetHerHim] welcome!"
 scheme.13.b: "[ROOT.GetCountry.GetName] is not the place for [ongoing_scheme_target.GetShortName]."
 scheme.14.t: "Assassination Successful!"
 scheme.14.desc: "$scheme.9.desc$"
 scheme.14.a: "Nothing to see here..."
 scheme.15.t: "Assassination Failed!"
 scheme.15.desc: "Unfortunately, the assassination attempt on [assassinatee.GetShortName] didn't go according to plan."
 scheme.15.a: "Drat."
 scheme.16.t: "Defection"
 scheme.16.desc: "\n\nThere are rumors that they have taken up with friends in [actor.GetName], bringing any in their household who could be convinced with them..."
 scheme.16.desc_1: "[target.GetShortName], the spouse of our [ROOT.GetCountry.GetGovernment.GetRulerTitle], has disappeared, apparently no longer able to tolerate [target.GetHerHis] life in [ROOT.GetCountry.GetName]!"
 scheme.16.desc_2: "[target.GetShortName], a member of the ruling [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] family, is nowhere to be found, with almost all of their possessions missing."
 scheme.16.desc_3: "[target.GetShortName], a celebrated and notable citizen of [ROOT.GetCountry.GetName], has abandoned [target.GetHerHis] post and absconded from [ROOT.GetCountry.GetName]!"
 #P:A TODO No EU5 equivalent: Imperator named the notable spouse ([target.GetSpouse.GetPraenomen]); EU5 characters have no single-spouse link, so the name is dropped
 scheme.16.desc_4: "[target.GetShortName], and [target.GetHerHis] notable spouse, have caused a stir by disappearing from the country without warning."
 scheme.16.desc_5: "We have been alerted that [target.GetName], a citizen of [ROOT.GetCountry.GetName], has apparently disappeared overnight."
 scheme.16.a: "The traitor will not be missed."
 recruited_character: "Recruited Character"
 denied_envoys: "Turned Envoys Away"
 accepted_envoys: "Welcomed Envoys"
 #P:A TODO Imperator had no loc for the next two opinions; names written for the import
 sided_with_in_league: "Sided With Us in the League"
 sided_against_in_league: "Sided Against Us in the League"
 scheme.17.t: "A Grand [ROOT.GetCountry.Custom('pa_imp_festival_type')]"
 scheme.17.desc: "In a stunning display of generosity, [this_guy.GetShortName], a well-loved member of our religious institution, has commissioned a grand festival out of [this_guy.GetHerHis] own pocket."
 scheme.17.a: "Superb!"
 saturnalia: "Saturnalia"
 pyanepsia: "Pyanepsia"
 marzeah: "Marzeah"
 adonia: "Adonia"
 mayumas: "Mayumas"
 festival_key: "Festival"
 scheme.18.t: "A Proposal"
 scheme.18.desc: "The fact that [ongoing_scheme_target.GetName] has yet to marry has attracted the attention of many of the great families of the realm. It was therefore perhaps no surprise when, during recent festivities held by the house of [courting_family.GetName], [ongoing_scheme_target.GetName] was introduced to [new_cousin.GetShortName], a young and, according to some, very suitable match.\n\nIt is certainly clear that [courting_hof.GetName] and [courting_hof.GetHerHis] entire family would be deeply grateful if our families were to be joined together in such a union."
 scheme.18.a: "[new_cousin.GetShortName] seems like an ideal partner."
 scheme.18.b: "We cannot commit to such a plan."
 scheme.19.t: "Too Late"
 scheme.19.desc: "Our scheme to have our family marry into the ruling family has failed: someone else was quicker to exploit this opportunity.\nLuckily we have at least been able to recover some of the money we have spent."
 scheme.19.a: "Long live the monarchy..."
 scheme.20.t: "Proposal Refused"
 scheme.20.desc: "The plan to marry into the [ongoing_scheme_target.GetDynasty.GetName] family has failed, [ongoing_scheme_target.GetName]  has refused to offer any suitable candidates to wed."
 scheme.20.a: "This is a great shame."
 STATIC_MODIFIER_NAME_proposal_refused: "Marriage Proposal Refused"
 STATIC_MODIFIER_DESC_proposal_refused: "This character has recently approached one of the great families of the realm to initiate a political marriage, only to have their hopes dashed by the dynasty's head."
 scheme.21.t: "A New Political Marriage?"
 random_marriage_proposal_1: "Blustering with excitement, [suitor.GetShortName] summoned [suitor.GetHerHis] domestic aide. After far too long alone, [suitor.GetSheHe] decided to extend an offer of marriage to the [love_target.Custom('pa_imp_get_beautifulness')] [love_target.Custom('pa_imp_get_age_adjective')] [love_target.GetShortName], of the [love_target.GetDynasty.GetName] dynasty."
 random_marriage_proposal_2: "After careful deliberation, assessment of potential spouses, and a great deal of research into various bloodlines and heritages, [suitor.GetShortName] summoned [suitor.GetHerHis] aides, and issued an offer of marriage to [love_target.GetShortName] of the [love_target.GetDynasty.GetName] dynasty."
 random_marriage_proposal_3: "While [suitor.GetShortName] has enjoyed life immensely as a [suitor.GetWomanMan] of leisure, [suitor.GetSheHe] summoned an envoy this very morning to deliver a proposal of marriage to the [love_target.Custom('pa_imp_get_beautifulness')] [love_target.Custom('pa_imp_get_age_adjective')] [love_target.GetShortName], hoping to produce heirs to further legitimize the [suitor.GetDynasty.GetName] dynasty."
 hof_disapproves_loyalty_desc: "\n\nUnfortunately, the envoy reports, the head of the [love_target.GetDynasty.GetName] dynasty, [negotiator.GetName], is a vocal critic of our rule, and has made it clear that [negotiator.GetSheHe] will not allow this union under any circumstances.\n\nWe suspect this may just be a keen negotiating position, although we will have to offer a great deal more than we had hoped, if we are to win the heart of the [love_target.Custom('pa_imp_get_beautifulness')] [love_target.GetShortName]."
 hof_disapproves_age_desc: "\n\nWith regret, our envoy brings news that the head of the house [love_target.GetDynasty.GetName], [negotiator.GetName], has stepped in to raise issues with this proposal, citing the great gap in age between [suitor.GetShortName] and the [love_target.Custom('pa_imp_get_age_adjective')], [love_target.GetShortName].\n\nClearly, [negotiator.GetSheHe] is merely attempting to get more out of us for the dowry... perhaps negotiation is the only way to win love for [suitor.GetShortName]."
 self_disapproves_loyalty_desc: "\n\nThe envoy who delivered the proposal, however, reports that he barely made it out alive after [love_target.GetShortName] flew into a great rage, hurling a [ROOT.GetCountry.Custom('pa_imp_get_arena_death_implement_glad')] with great accuracy, and nearly decapitating him. It seems that [love_target.GetShortName] considers our suggestions with great contempt. We may need to sweeten the deal by increasing the size of the dowry."
 self_disapproves_age_desc: "\n\nThe envoy reports that the proposal, whilst flattering, evoked a great deal of amusement from [love_target.GetShortName] and [love_target.GetHerHis] companions, who made no effort to conceal their contempt regarding the advanced age of [suitor.GetShortName].\n\nWe may have to consider yielding a sizable dowry if [suitor.GetShortName] is to find love at such a distant gap of age and experience."
 hof_approves_desc: "\n\nDespite the appearance of [negotiator.GetShortName], head of the [negotiator.GetDynasty.GetName] family, it seems that all concerns were salved by the [suitor.Custom('pa_imp_love_object')] that [suitor.GetShortName] had offered up in support of [suitor.GetHerHis] proposal."
 self_approves_desc: "\n\nThe envoy reports that the [love_target.Custom('pa_imp_get_age_adjective')] [love_target.GetShortName] almost swooned after receiving the news. It may be that [suitor.GetShortName] and [love_target.GetShortName] are an ideal match."
 royal_marriage.6.a: "Splendid! Let us arrange the festivities!"
 royal_marriage.6.b: "Cunning. We do have some gold to spare."
 royal_marriage.6.c: "A hard bargain, but worth every penny."
 royal_marriage.6.d: "We shall have to look elsewhere for love..."
 new_wife_from_family_tt: "#Y [love_target.GetName]#!, a suitable young [love_target.GetWomanMan] was found among the many branches of the #Y [ongoing_scheme_target.GetDynasty.GetName]#! family.\n\n"
 got_poetry: "beautifully penned love-poetry"
 got_flowers: "gargantuan array of floral decorations"
