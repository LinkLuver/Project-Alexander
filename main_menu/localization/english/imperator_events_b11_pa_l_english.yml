l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b11 (2026-10-06)

 # annexation.txt
 annexation.1.t: "Fugitives Cross the Borders"
 annexation.1.desc: "Fleeing the dreadful war with [annexer.GetName], a number of important dignitaries have managed to escape to our lands, hoping to find refuge.\n\nOur advisors recommend against giving them asylum, due to the fragile political circumstances in our region, and indeed, much favor may be gained with [annexer.GetName] if we were to finish their job for them..."
 annexation.1.a: "Welcome them!"
 annexation.1.b: "Put them to death."
 killed_fugitives: "Killed Fugitives"
 annexation.2.t: "Fugitives Cross the Borders"
 annexation.2.desc: "Fleeing the dreadful war with [annexer.GetName], a number of important dignitaries have managed to escape to our lands, hoping to find refuge.\n\nOur advisors recommend against giving them asylum, due to the fragile political circumstances in our region, and indeed, much favor may be gained with [annexer.GetName] if we were to finish their job for them..."
 annexation.2.a: "Welcome them!"
 annexation.2.b: "Put them to death."
 annexation.3.t: "The [annexee.GetAdjective] Elite"
 annexation.3.desc: "After a protracted conquest, we have finally routed the [annexee.GetAdjective] armies, and laid waste to their lands. During the sacking of their capital, many important prisoners were taken, many of them having previously held important positions in the [annexee.GetAdjective] [annexee.Custom('pa_imp_get_court_type')].\n\nThey now languish in our dungeons, awaiting whatever fate we decide to impose upon them."
 annexation.3.a: "Our enemies deserve no quarter."
 annexation.3.b: "Banish those of class, and put the rest to the sword."
 annexation.3.c: "Imprison their leaders; let the rest disappear."
 annexation.3.d: "Seize all assets, execute everyone of class."
 annexation.3.e: "Pass judgment on the important families."
 annexation.3.f: "I have a better idea..."
 everybody_gonna_die: "Every character in [annexee.GetName] will be put to death before the cheering crowds of [ROOT.GetCountry.GetCapital.GetName]."
 important_people_banished: "Important characters will be banished to foreign lands instead of executed or incarcerated."
 #P:A TODO No EU5 equivalent: EU5 has no prisoners, so annexation.3.c keeps these characters at our court as ordinary characters
 important_prisoners_taken: "Important [annexee.GetAdjective] characters will be imprisoned by #Y [annexer.GetName]#!."
 seize_all_assets_tt: "Every character in [annexee.GetName] will be executed and have its assets seized."
 decide_for_each_important_family: "You will be able to decide what to do with each important #Y Family#!."
 androphagia_always_eats: "This option is #Y exclusive#! because your country has the  #Y Cannibalistic Frenzy#! modifier."
 #P:A TODO No EU5 equivalent: cannibal_tooltip and human_sacrifice_law_tooltip belong to the Invictus cannibal trait and tribal human-sacrifice law; their option branches are commented out in annexation.3
 cannibal_tooltip: "This option is available because your ruler has the #Y Cannibal#! trait."
 human_sacrifice_law_tooltip: "This option is available because your country has the #Y Adopt Human Sacrifices#! law."
 everybody_gonna_be_eaten: "Every character in [annexee.GetName] will be eaten in a grand feast in  [ROOT.GetCountry.GetCapital.GetName]."
 #P:A TODO No EU5 equivalent: names of the Imperator country-culture modifiers set by annexation.3 / annexation.4 (EU5 has no per-country culture modifiers; the effects are commented out)
 annexed_my_home_culture: "Annexation: Massacred our Nobility"
 annexed_my_home_culture_lenient: "Annexation: Conquest of our People"
 STATIC_MODIFIER_NAME_androphagia_cannibal_frenzy_mod: "Cannibalistic Frenzy"
 STATIC_MODIFIER_NAME_ate_enemy_elite_proudly_mod: "Noble Sacrifice"
 STATIC_MODIFIER_NAME_ate_enemy_elite_secretly_mod: "Exotic Banquet"
 annexation.4.t: "The Great Families of [annexee.GetName]"
 annexation.4.desc: "Several important families are known for having held sway in [annexee.GetName]. Whilst we have consigned the lesser men and women of this fallen nation to their fate, we must decide carefully upon how to treat the [annexee.GetAdjective] elite."
 annexation.4.a: "Let us welcome [first_family_head.GetName]."
 annexation.4.b: "Offer sanctuary to [second_family_head.GetName]."
 annexation.4.c: "Give refuge to [third_family_head.GetName]."
 annexation.4.d: "Embrace the kin of [fourth_family_head.GetName]."
 annexation.4.e: "Have the rest crucified."
 annexation.4.e.tt: "Executing so many of the [annexee.GetCulture.GetName] will be considered particularly harsh."
 #P:A TODO No EU5 equivalent: the *_family_moves_to tooltips dropped two Imperator sentences: the member count ("This means accepting #Y [SCOPE.ScriptValue('num_of_first_family_members_svalue')|0]#! characters.", value not imported) and that the family will be considered #Y Minor Characters#! (EU5 has no minor characters)
 first_family_moves_to: "#Y [first_family_head.GetName]#! and [first_family_head.GetHerHis] kin move to [annexer.GetName]."
 second_family_moves_to: "#Y [second_family_head.GetName]#! and [second_family_head.GetHerHis] kin move to [annexer.GetName]."
 third_family_moves_to: "#Y [third_family_head.GetName]#! and [third_family_head.GetHerHis] kin move to [annexer.GetName]."
 fourth_family_moves_to: "#Y [fourth_family_head.GetName]#! and [fourth_family_head.GetHerHis] kin move to [annexer.GetName]."
 #P:A TODO No EU5 equivalent: per_family_crucified / per_family_turned_away describe ruler popularity, which EU5 lacks; their custom_tooltip lines are commented out in annexation.4
 per_family_crucified: "The mobs of [ROOT.GetCountry.GetCapital.GetName] love a spectacle and your ruler will be awarded #G 1.25#! Popularity per family crucified.\n"
 per_family_turned_away: "The families of [ROOT.GetCountry.GetName] cherish their privileges and will award #G 1.25#! Popularity per family denied entry to our state.\n"
 annexation.5.t: "Integration of [annexee.GetName]"
 annexation.5.desc: "Our client, [annexee.GetName], has long upheld [ROOT.GetCountry.GetAdjective] ideals in a fair and even-handed manner. It is a matter of course, therefore, that their eventual integration into our state is to be a cause for jubilation.\n\nThe [annexee.GetAdjective] elite have been instrumental in facilitating this union, and many are hoping to find a place within our government."
 annexation.5.a: "$annexation.4.a$"
 annexation.5.b: "$annexation.4.b$"
 annexation.5.c: "$annexation.4.c$"
 annexation.5.d: "$annexation.4.d$"
 annexation.5.e: "We can't take in just anyone, you know."
