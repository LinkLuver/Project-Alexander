l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b11 (2026-10-06)

 # annexation.txt
 annexation.1.t: "Fugitives Cross the Borders"
 annexation.1.desc: "Fleeing the dreadful war with [annexer.GetName], a number of important dignitaries have managed to escape to our lands, hoping to find refuge.\n\nOur advisors recommend against giving them asylum, due to the fragile political circumstances in our region, and indeed, much favor may be gained with [annexer.GetName] if we were to finish their job for them..."
 annexation.1.a: "Welcome them!"
 annexation.1.b: "Put them to death."
 killed_fugitives: "Killed Fugitives"
 annexation.2.t: "Fugitives Cross the Borders"
 annexation.2.desc: "Fleeing the dreadful war with [annexer.GetName], a number of important dignitaries have managed to escape to our lands, hoping to find refuge.\n\nOur advisors recommend against giving them asylum, due to the fragile political circumstances in our region, and indeed, much favor may be gained with [annexer.GetName] if we were to finish their job for them..."
 annexation.2.a: "Welcome them!"
 annexation.2.b: "Put them to death."
 annexation.3.t: "The [annexee.GetAdjective] Elite"
 annexation.3.desc: "After a protracted conquest, we have finally routed the [annexee.GetAdjective] armies, and laid waste to their lands. During the sacking of their capital, many important prisoners were taken, many of them having previously held important positions in the [annexee.GetAdjective] [annexee.Custom('pa_imp_get_court_type')].\n\nThey now languish in our dungeons, awaiting whatever fate we decide to impose upon them."
 annexation.3.a: "Our enemies deserve no quarter."
 annexation.3.b: "Banish those of class, and put the rest to the sword."
 annexation.3.c: "Imprison their leaders; let the rest disappear."
 annexation.3.d: "Seize all assets, execute everyone of class."
 annexation.3.e: "Pass judgment on the important families."
 annexation.3.f: "I have a better idea..."
 everybody_gonna_die: "Every character in [annexee.GetName] will be put to death before the cheering crowds of [ROOT.GetCountry.GetCapital.GetName]."
 important_people_banished: "Important characters will be banished to foreign lands instead of executed or incarcerated."
 #P:A TODO No EU5 equivalent: EU5 has no prisoners, so annexation.3.c keeps these characters at our court as ordinary characters
 important_prisoners_taken: "Important [annexee.GetAdjective] characters will be imprisoned by #Y [annexer.GetName]#!."
 seize_all_assets_tt: "Every character in [annexee.GetName] will be executed and have its assets seized."
 decide_for_each_important_family: "You will be able to decide what to do with each important #Y Family#!."
 androphagia_always_eats: "This option is #Y exclusive#! because your country has the  #Y Cannibalistic Frenzy#! modifier."
 #P:A TODO No EU5 equivalent: cannibal_tooltip and human_sacrifice_law_tooltip belong to the Invictus cannibal trait and tribal human-sacrifice law; their option branches are commented out in annexation.3
 cannibal_tooltip: "This option is available because your ruler has the #Y Cannibal#! trait."
 human_sacrifice_law_tooltip: "This option is available because your country has the #Y Adopt Human Sacrifices#! law."
 everybody_gonna_be_eaten: "Every character in [annexee.GetName] will be eaten in a grand feast in  [ROOT.GetCountry.GetCapital.GetName]."
 #P:A TODO No EU5 equivalent: names of the Imperator country-culture modifiers set by annexation.3 / annexation.4 (EU5 has no per-country culture modifiers; the effects are commented out)
 annexed_my_home_culture: "Annexation: Massacred our Nobility"
 annexed_my_home_culture_lenient: "Annexation: Conquest of our People"
 STATIC_MODIFIER_NAME_androphagia_cannibal_frenzy_mod: "Cannibalistic Frenzy"
 STATIC_MODIFIER_NAME_ate_enemy_elite_proudly_mod: "Noble Sacrifice"
 STATIC_MODIFIER_NAME_ate_enemy_elite_secretly_mod: "Exotic Banquet"
 annexation.4.t: "The Great Families of [annexee.GetName]"
 annexation.4.desc: "Several important families are known for having held sway in [annexee.GetName]. Whilst we have consigned the lesser men and women of this fallen nation to their fate, we must decide carefully upon how to treat the [annexee.GetAdjective] elite."
 annexation.4.a: "Let us welcome [first_family_head.GetName]."
 annexation.4.b: "Offer sanctuary to [second_family_head.GetName]."
 annexation.4.c: "Give refuge to [third_family_head.GetName]."
 annexation.4.d: "Embrace the kin of [fourth_family_head.GetName]."
 annexation.4.e: "Have the rest crucified."
 annexation.4.e.tt: "Executing so many of the [annexee.GetCulture.GetName] will be considered particularly harsh."
 #P:A TODO No EU5 equivalent: the *_family_moves_to tooltips dropped two Imperator sentences: the member count ("This means accepting #Y [SCOPE.ScriptValue('num_of_first_family_members_svalue')|0]#! characters.", value not imported) and that the family will be considered #Y Minor Characters#! (EU5 has no minor characters)
 first_family_moves_to: "#Y [first_family_head.GetName]#! and [first_family_head.GetHerHis] kin move to [annexer.GetName]."
 second_family_moves_to: "#Y [second_family_head.GetName]#! and [second_family_head.GetHerHis] kin move to [annexer.GetName]."
 third_family_moves_to: "#Y [third_family_head.GetName]#! and [third_family_head.GetHerHis] kin move to [annexer.GetName]."
 fourth_family_moves_to: "#Y [fourth_family_head.GetName]#! and [fourth_family_head.GetHerHis] kin move to [annexer.GetName]."
 #P:A TODO No EU5 equivalent: per_family_crucified / per_family_turned_away describe ruler popularity, which EU5 lacks; their custom_tooltip lines are commented out in annexation.4
 per_family_crucified: "The mobs of [ROOT.GetCountry.GetCapital.GetName] love a spectacle and your ruler will be awarded #G 1.25#! Popularity per family crucified.\n"
 per_family_turned_away: "The families of [ROOT.GetCountry.GetName] cherish their privileges and will award #G 1.25#! Popularity per family denied entry to our state.\n"
 annexation.5.t: "Integration of [annexee.GetName]"
 annexation.5.desc: "Our client, [annexee.GetName], has long upheld [ROOT.GetCountry.GetAdjective] ideals in a fair and even-handed manner. It is a matter of course, therefore, that their eventual integration into our state is to be a cause for jubilation.\n\nThe [annexee.GetAdjective] elite have been instrumental in facilitating this union, and many are hoping to find a place within our government."
 annexation.5.a: "$annexation.4.a$"
 annexation.5.b: "$annexation.4.b$"
 annexation.5.c: "$annexation.4.c$"
 annexation.5.d: "$annexation.4.d$"
 annexation.5.e: "We can't take in just anyone, you know."

 # traits.txt
 traits.1.t: "[pa_character.GetShortName]"
 traits.1.desc_short: "[pa_character.GetName] is now [pa_character.Custom('pa_imp_traits_randomizer_custom')|Y]"
 traits.1.desc: "[pa_character.Custom('pa_imp_traits_randomizer_custom_desc')]"
 traits.1.a: "[pa_character.Custom('pa_imp_traits_option_selector')]"
 traits_option_selector.good: "Splendid!"
 traits_option_selector.neutral: "Interesting."
 traits_option_selector.bad: "Oh dear..."
 traits_option_selector.default: "Interesting."
 traits_randomizer_custom_desc.abrasive: "Although always an irritable man, the acerbic temperament of [ROOT.GetCharacter.GetName] has become almost unbearable, of late. It is said that even [ROOT.GetCharacter.GetHerHis] remaining friends choose to avoid [ROOT.GetCharacter.GetHerHim] where possible."
 traits_randomizer_custom_desc.silver_tongued: "The silken tone of [ROOT.GetCharacter.GetName] has become a matter of legend. Even the fiercest of negotiators is no match for [ROOT.GetCharacter.GetHerHis] calm, persuasive manner."
 traits_randomizer_custom_desc.crafty: "Intricate schemes, webs of deceit, and cunning plans, are all perfectly ordinary behavior for [ROOT.GetCharacter.GetName]. It is said that nothing goes in [ROOT.GetCharacter.GetCourtCountry.GetName] without [ROOT.GetCharacter.GetHerHis] knowledge."
 traits_randomizer_custom_desc.pious: "Not a day goes by in which [ROOT.GetCharacter.GetName] cannot be found praying. Every meal is preceded by a votive offering, every feast by a sacrifice. Some might say that such piety is laughable, but we know better."
 traits_randomizer_custom_desc.zealous: "It is as if a fire has awoken in the heart of [ROOT.GetCharacter.GetName]. Each task [ROOT.GetCharacter.GetSheHe] sets [ROOT.GetCharacter.GetHerselfHimself] to is completed in short order, thanks to this newfound vigor."
 traits_randomizer_custom_desc.tolerant: "In the eyes of [ROOT.GetCharacter.GetName], all are equal. At least, all those who deserve to be."
 traits_randomizer_custom_desc.devout: "Such devotion to the Divine is rarely seen in a [ROOT.GetCharacter.GetWomanMan] of standing, yet [ROOT.GetCharacter.GetName] continues to be the exception to the rule."
 traits_randomizer_custom_desc.just: "[ROOT.GetCharacter.GetName] can be counted upon as a [ROOT.GetCharacter.GetWomanMan] with the ability to always make a fair judgment. When arbitration is required, [ROOT.GetCharacter.GetName] is always the first port of call."
 traits_randomizer_custom_desc.cruel: "Stories have circulated for some time now, about the vicious cruelty of [ROOT.GetCharacter.GetName]. From kicking beggars in the street, to laughing at public executions, [ROOT.GetCharacter.GetSheHe] truly is a nasty piece of work."
 traits_randomizer_custom_desc.merciful: "[ROOT.GetCharacter.GetName] can always be trusted to handle those who do [ROOT.GetCharacter.GetHerHim] wrong, with admirable benevolence. Some might say that this invites trouble, but we know better."
 traits_randomizer_custom_desc.righteous: "The self-confidence that [ROOT.GetCharacter.GetName] displays, is a veritable inspiration to all who know [ROOT.GetCharacter.GetHerHim]. [ROOT.GetCharacter.GetHerHis|U] singular clarity of purpose outweighs any who dare to question [ROOT.GetCharacter.GetHerHis] intent."
 traits_randomizer_custom_desc.corrupt: "Once one has taken a bribe, it is hard to turn back. [ROOT.GetCharacter.GetName], once a trusted member of society, has fallen far. It is said that if you grease [ROOT.GetCharacter.GetHerHis] palms with enough gold, [ROOT.GetCharacter.GetSheHe] can get you anything."
 traits_randomizer_custom_desc.scholar: "The learned nature of [ROOT.GetCharacter.GetName] brings all manner of curious scholars to [ROOT.GetCharacter.GetCourtCountry.GetName]. Such a reputation should serve us well amongst our peers!"
 traits_randomizer_custom_desc.humble: "A more modest and unassuming [ROOT.GetCharacter.GetWomanMan], cannot be found in all [ROOT.GetCharacter.GetCourtCountry.GetName]. We should celebrate the true mediocrity of [ROOT.GetCharacter.GetName]!"
 traits_randomizer_custom_desc.generous: "[ROOT.GetCharacter.GetName] simply cannot help [ROOT.GetCharacter.GetHerselfHimself]. Lavish parties, feasts and banquets are held regularly for the entire capital, at [ROOT.GetCharacter.GetHerHis] own expense. Hurrah for [ROOT.GetCharacter.GetName]!"
 traits_randomizer_custom_desc.honest: "They say that a lie has never passed the lips of [ROOT.GetCharacter.GetName]. Surely, [ROOT.GetCharacter.GetSheHe] can always be trusted to do the right thing?"
 traits_randomizer_custom_desc.deceitful: "Time and again, [ROOT.GetCharacter.GetName] has been given the benefit of the doubt, yet time and again, [ROOT.GetCharacter.GetSheHe] has proven [ROOT.GetCharacter.GetHerselfHimself] unworthy of it. We are beginning to wonder if anything [ROOT.GetCharacter.GetSheHe] says can be believed."
 traits_randomizer_custom_desc.lazy: "[ROOT.GetCharacter.GetName] has developed a most unprofessional attitude to [ROOT.GetCharacter.GetHerHis] work. Jobs which ought to take mere hours, are stretched out over full weeks. We simply cannot trust [ROOT.GetCharacter.GetHerHim] with anything truly important."
 traits_randomizer_custom_desc.arrogant: "There is something about [ROOT.GetCharacter.GetName] which exudes an air of aloof superiority. Many have begun avoiding [ROOT.GetCharacter.GetHerHim], out of sheer irritation at [ROOT.GetCharacter.GetHerHis] arrogance."
 traits_randomizer_custom_desc.prominent: "[ROOT.GetCharacter.GetName] has been on a steady and meteoric rise to importance within the state of [ROOT.GetCharacter.GetCourtCountry.GetName]. By now [ROOT.GetCharacter.GetSheHe] is practically a household name."
 traits_randomizer_custom_desc.stubborn: "Of late, [ROOT.GetCharacter.GetName] has begun to exhibit particularly obtuse behavior. Sometimes, getting one's point across to [ROOT.GetCharacter.GetHerHim] is simply too much effort to bear. On the plus side, [ROOT.GetCharacter.GetSheHe] is never at risk of being manipulated!"
 traits_randomizer_custom_desc.miserly: "[ROOT.GetCharacter.GetName] snaps at those who would part [ROOT.GetCharacter.GetHerHim] of [ROOT.GetCharacter.GetHerHis] hard-earned gold, forever guarding [ROOT.GetCharacter.GetHerHis] purse jealously. It is not an attractive sight."
 traits_randomizer_custom_desc.kindly: "[ROOT.GetCharacter.GetName] is truly a kind soul. If there is ever any way to assist another citizen, [ROOT.GetCharacter.GetName] will be the one to do it."
 traits_randomizer_custom_desc.frail: "Of late, [ROOT.GetCharacter.GetName] has begun feeling the bite of the cold, and can hardly bring [ROOT.GetCharacter.GetHerselfHimself] to struggle up the stairs."
 traits_randomizer_custom_desc.obsessive_perfectionist: "Every task [ROOT.GetCharacter.GetName] undertakes must be done flawlessly, and then done again. [ROOT.GetCharacter.GetHerHis|U] subordinates have long since stopped counting the revisions."
 traits_randomizer_custom_desc.midas_touched: "Whatever venture [ROOT.GetCharacter.GetName] turns [ROOT.GetCharacter.GetHerHis] hand to, it seems to turn a profit. Merchants whisper that [ROOT.GetCharacter.GetSheHe] could squeeze gold from a stone, and few would be surprised if it were true."
 traits_randomizer_custom_desc.well_connected: "If there is anyone worth knowing in [ROOT.GetCharacter.GetCourtCountry.GetName], then [ROOT.GetCharacter.GetName] knows them. [ROOT.GetCharacter.GetHerHis|U] remarkable web of acquaintances, allies, and favors owed is quite the envy of [ROOT.GetCharacter.GetHerHis] peers."
 traits_randomizer_custom_desc.carouser: "It is rare to find [ROOT.GetCharacter.GetName] in a state of full sobriety after sundown. The taverns of [ROOT.GetCharacter.GetCourtCountry.GetName] know [ROOT.GetCharacter.GetHerHis] face well, and so do the gutters outside them."
 traits_randomizer_custom_desc.drunkard: "The drinking habits of [ROOT.GetCharacter.GetName] have become a matter of some public concern. [ROOT.GetCharacter.GetHerHis|U] mornings begin late and [ROOT.GetCharacter.GetHerHis] evenings begin early. The hours in between are largely anyone's guess."
 traits.2.t: "The Insanity of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName]"
 traits.2.desc: "[pa_character.GetName], ordinarily a [pa_character.GetWomanMan] of sound mind, and superlative business acumen, has been acting... unusually.\n\n[pa_character.GetHerHis|U] personal advisor reports that [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName] has started slavering at the mouth, uttering inane nonsenses, even proposing marriage to each and every member of [pa_character.GetHerHis] [ROOT.GetCountry.Custom('pa_imp_get_court_type')] in the space of an hour.\n\nWe think that [pa_character.GetSheHe] may finally have cracked."
 traits.2.a: "Oh dear..."
 traits.2.b: "Summon the wisest minds in the land!"
 enables_unusual_event_options: "The #Y Lunatic#! Trait enables some particularly unusual event options."
 traits.5.t: "[injured_personage.GetShortName] Falls Ill"
 traits.5.desc: "[injured_personage.GetName] has sent word that [injured_personage.GetSheHe] has fallen ill.\n\nPerhaps if [injured_personage.GetSheHe] is wealthy enough, [injured_personage.GetSheHe] will seek treatment of [injured_personage.GetHerHis] own volition, otherwise, we could always step in if [injured_personage.GetHerHis] condition worsens."
 traits.5.a: "Interesting."
 traits.5.b: "Dreadful! Send [injured_personage.GetHerHim] wishes for a speedy recovery!"
 # Imperator named the trait "Kindly"; it maps to the EU5 trait Kind-Hearted.
 kindly_tooltip: "This option is available because your ruler has the #Y Kind-Hearted#! trait."
 traits.7.t: "Illness Advances"
 traits.7.desc: "[diseased_personage.GetName] has grown gravely ill. [diseased_personage.GetHerHis|U] previous minor ailment, has advanced into a terrible disease!\n\nIf [diseased_personage.GetSheHe] does not receive treatment, [diseased_personage.GetSheHe] may well continue to decline."
 traits.7.a: "How sad."
 traits.9.t: "Illness Progresses"
 traits.9.desc: "Wracked with pain, in the throes of a dire affliction, [result_acquired_target.GetName] has sustained a permanent injury.\n\nWe should have acted faster."
 traits.9.a: "Our sympathies."
 traits.16.t: "Miraculous Recovery"
 traits.16.desc: "Thankfully, [recovered_personage.GetName] seems to be in remission from [recovered_personage.GetHerHis] previous ailment.\n\nDoctors are overrated, anyway."
 traits.16.a: "Curious."
 traits.18.t: "A Calmer Mind"
 traits.18.desc: "Luckily, [pa_character.GetName] has begun feeling much less overwhelmed by [pa_character.GetHerHis] situation, lately. [pa_character.GetSheHe|U] considers life much more enjoyable without such a weight on [pa_character.GetHerHis] mind."
 traits.18.a: "Excellent!"

 # te_migrations.txt (te_migrations.3 skipped; modifier kept)
 STATIC_MODIFIER_NAME_sirte_foederatus: "Foederatus"
