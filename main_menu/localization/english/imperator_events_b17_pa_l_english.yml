 # dhe/dhe_diadochi.txt
 diadochi_flavor.93.t: "The Fate of Salamis"
 #P:A TODO No EU5 equivalent: Imperator [GetCharacter('(int32)38').GetPraenomen] (Demetrios Poliorketes, character 38) is written out; EU5 character ids differ
 diadochi_flavor.93.desc: "The island of Salamis, said to be named for the nymph Salamis and once ruled by the mythical King Cychreus, was fought over by Megara and Athens during the late Archaic period. After a protracted war, credited variously to Solon or Peisistratos, Athens secured control, and a Spartan arbitration later confirmed its claim. From the late sixth century BCE, Salamis was settled with Athenian klerouchoi who owed tribute and military service to the mother-city. The native Salaminians never gained full Athenian citizenship, but maintained their own demos alongside the Athenian one on the island. Salamis served as a vital naval base for Athens and the gateway to the Saronic Gulf. It was the site of the decisive Greek victory over Persia in 480 BCE.\n\nIn the last struggle, Demetrios cast out Cassander's garrison and set Antigonid order upon the island. With the end of this round of fighting, the time has come to reevaluate the status of the Salaminians"
 diadochi_flavor.93.a: "Henceforth, Salamis will be free and autonomous."
 #P:A TODO Approximate: Imperator named the Antigonids (GetCountry('PRY')) in these tooltips; the effects apply to the event's country, so ROOT is shown. [GetProvince('(int32)418').GetArea.GetRegion.GetName] (Korinthos' region) is written as "Greece"
 diadochi_flavor.93.at: "#high Salamis#! becomes a #Y Feudatory#! of [ROOT.GetCountry.GetName]\nEvery #Y Hellenic#! country in mainland Greece will gain #G 15#! Opinion of [ROOT.GetCountry.GetName]."
 diadochi_flavor.93.b: "Let the Athenians govern the Salaminians."
 diadochi_flavor.93.bt: "#high Salamis#! becomes governed by #high Athens#!"
 diadochi_flavor.93.c: "We shall install a heavy garrison on the key to the Saronic."
 diadochi_flavor.93.ct: "Every #Y Hellenic#! country in mainland Greece will lose #R -15#! Opinion of [ROOT.GetCountry.GetName]."
