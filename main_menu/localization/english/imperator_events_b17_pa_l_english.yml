 # Imperator (Invictus / Terra Indomita) event import, batch b17 (2026-10-19)

 # iberia_colony.txt
 iberia_colony.2.t: "Punic Purchase"
 iberia_colony.2.desc: "Phoenician traders have long had a presence in [ShowLocationName('lisbon')], trading for our precious metals. They refer to their small trading post, which sits on a large basin in the estuary of the River Tagus as 'Alitz 'Oppon, which apparently means 'Pleasant Haven' in the Phoenician language. A group of [alis_ubbo_punic.GetAdjective] merchants armed with the financial backing of [alis_ubbo_punic.GetName] wish to expand their holdings and acquire a port of their own in [ShowLocationName('lisbon')] in exchange for a 'reasonable outlay.' Its location makes it an ideal location to unload and reprovision their ships sailing on trade voyages along the western coast of Iberia."
 iberia_colony.2.a: "What luck, the Phoenician fools will make us rich!"
 iberia_colony.2.at: "#high [alis_ubbo_punic.GetAdjective]s#! will flock to #Y [ShowLocationName('lisbon')]#!and it may become a [alis_ubbo_punic.GetAdjective] #Y Subject#!"
 iberia_colony.2.b: "They insult our intelligence!"
 iberia_colony.2.bt: "Nothing happens"
 iberia_colony.3.t: "'Alitz 'Oppon"
 iberia_colony.3.desc: "From ancient times the Phoenician and Punic people have excelled at traveling, trading and settling across the sea, establishing outposts such as our own [alis_ubbo_punic.GetCapital.GetName]. The trading city of 'Alitz 'Oppon, meaning 'Pleasant Haven' in the Phoenician language, sits on a large basin in the estuary of the River Tagus. This makes it an ideal location to unload and reprovision Phoenician ships sailing on trade voyages along the western coast of Iberia. Thanks to Phoenician influence, [ShowLocationName('lisbon')] has become an important center of commercial trade where valuable metals, salted fish and salt are traded with the inland tribes of the region. A group of [alis_ubbo_punic.GetAdjective] merchants operating there have negotiated a deal with the [alis_ubbo_tribe.GetAdjective]s to expand their holdings and acquire a port of their own in [ShowLocationName('lisbon')]; however, the traders lack the funds to do so, appealing to us for financial backing."
 iberia_colony.3.a: "Perhaps this will open a path to the Tin Isles."
 iberia_colony.3.at: "#Y 'Alitz 'Oppon#! will become a #Y Colony#! of #Y [ROOT.GetCountry.GetName]#!"
 iberia_colony.3.b: "This is a fools errand."
 iberia_colony.3.bt: "Nothing happens"
 iberia_colony.3.c: "'Alitz 'Oppon sounds nice..."
 iberia_colony.3.ct: "#Y We will tag switch over to#! #G 'Alitz 'Oppon#!"
 # Names given by iberia_colony.3 to the new country and its capital (Imperator OLS / Alitz_Oppon)
 OLS: "Alis Ubbo"
 OLS_ADJ: "Alisian"
 alitz_oppon: "'Alitz 'Oppon"
 # Names given by iberia_colony.1029 (Imperator SAGUNT_NAME / Sagointium)
 SAGUNT_NAME: "Sagointium"
 SAGUNT_ADJ: "Saguntine"
 sagointium: "Sagointium"
 STATIC_MODIFIER_NAME_aegis_of_arse_modifier: "Aegis of Arse"
 STATIC_MODIFIER_NAME_shield_of_sagointium_modifier: "Shield of Sagointium"
 iberia_colony.6.t: "Land of Tin"
 iberia_colony.6.desc: "We have long profited greatly from trading our tin, lead, and precious metals mined from the nearby cliffs and mountains with the Phoenicians. Evidently [GetCountry('GAD').GetName] has long maintained a monopoly over the tin trade in a great sea beyond the eastern coasts of Iberia by keeping the location of its source a closely guarded secret. A group of foreign merchants armed with the financial backing of [kassiteros_greek.GetName] have offered us a 'reasonable outlay' if we allow them to establish a trading post and mining operations in [kassiteros_prov.GetName], which they call #high Kassiteros#!, which apparently means the 'Land of Tin' in their tongue."
 iberia_colony.6.a: "What luck, the [kassiteros_greek.GetAdjective] fools will make us rich!"
 iberia_colony.6.at: "#high [kassiteros_greek.GetAdjective]s#! will flock to #Y [kassiteros_prov.GetName] #!and it may become a [kassiteros_greek.GetAdjective] #Y Subject#!"
 iberia_colony.6.b: "They insult our intelligence!"
 iberia_colony.6.bt: "Nothing happens"
 iberia_colony.7.t: "Land of Tin"
 iberia_colony.7.desc: "Phoenician traders have long maintained a monopoly over the tin trade, keeping the location of its source, #high Kassiteros#! a closely guarded secret. [GetCountry('GAD').GetName]'s position across the Pillars of Herakles has allowed it access to vast quantities of tin, lead, and precious metals. After an exploratory expedition to [kassiteros_prov.GetName] confirmed it sat upon vast tin reserves, a group of [ROOT.GetCountry.GetAdjective] merchants believe there have found this #high 'Land of Tin'#! along the northern coast of #high Iberia#! and are requesting funding to establish a trading post and mining operations so that we might be able to break the Phoenician monopoly over the tin trade. These enterprising men claim to have secured permission from the [kassiteros_tribe.GetAdjective]s, the tribe in control of the region, to do so but lack the funds to properly exploit [kassiteros_prov.GetName]'s resources."
 iberia_colony.7.a: "Could [kassiteros_prov.GetName] truly be the Land of Tin?"
 iberia_colony.7.at: "[kassiteros_prov.GetName] will be reorganized as #high Kassiteros#! and will become a #Y Tributary#! of #Y [ROOT.GetCountry.GetName]#!"
 iberia_colony.7.b: "We must settle the Land of Tin!"
 iberia_colony.7.bt: "[kassiteros_prov.GetName] will be reorganized as #high Kassiteros#! and will become a #Y Colony#! of #Y [ROOT.GetCountry.GetName]#!"
 iberia_colony.7.c: "The Land of Tin is naught but Phoenician propaganda."
 iberia_colony.7.ct: "#R Nothing happens#!"
 # Names given by iberia_colony.7 to the new country and its capital (Imperator OLZ / Kassiteros)
 OLZ: "Kassiteros"
 OLZ_ADJ: "Kassiterian"
 kassiteros: "Kassiteros"
 iberia_colony.8.t: "Expanding [iberia_colony.GetName]"
 iberia_colony.8.desc_1: "Acquiring control over [iberia_colony.GetName] has proved to be immensely beneficial both to ourselves and to the [iberia_colony_tribe.GetAdjective]s. Now their representatives have offered the [iberia_colony.GetGovernment.GetRulerTitle] of [iberia_colony.GetName], offering to cede neighboring lands in [iberia_colony_prov_2.GetName] in exchange for a 'reasonable outlay.' This 'reasonable outlay' is a paltry sum considering that surveyors from [iberia_colony.GetName] have concluded that [iberia_colony_prov_2.GetName] possess an abundance of tin and its acquisition would aid [ROOT.GetCountry.GetName] in cornering the tin market."
 iberia_colony.8.desc_2: "Acquiring control over [iberia_colony.GetName] has proved to be immensely beneficial both to ourselves and to the [iberia_colony_tribe.GetAdjective]s. Now their representatives have offered the [iberia_colony.GetGovernment.GetRulerTitle] of [iberia_colony.GetName], offering to cede neighboring lands in [iberia_colony_prov_2.GetName] and [iberia_colony_prov_3.GetName] in exchange for a 'reasonable outlay.' This 'reasonable outlay' is a paltry sum considering that surveyors from [iberia_colony.GetName] have concluded that [iberia_colony_prov_2.GetName] and [iberia_colony_prov_3.GetName] possess an remarkable abundance of tin and their acquisition would aid [ROOT.GetCountry.GetName] in cornering the tin market."
 iberia_colony.8.a: "We must acquire [iberia_colony_prov_2.GetName]."
 iberia_colony.8.at: "[iberia_colony_prov_2.GetName] will be ceded to [iberia_colony.GetName]"
 iberia_colony.8.b: "These barbarians don't know the worth of their lands."
 iberia_colony.8.bt: "[iberia_colony_prov_2.GetName] and [iberia_colony_prov_3.GetName] will be ceded to [iberia_colony.GetName]"
 iberia_colony.8.c: "We have tin enough already."
 iberia_colony.8.ct: "#R Nothing happens#!"
