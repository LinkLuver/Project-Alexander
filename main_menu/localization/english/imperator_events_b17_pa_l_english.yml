 # friend_rival.txt
 friend_rival.1.desc: "[pa_character.GetName], by all accounts an eligible [pa_character.Custom('pa_imp_get_bachelor_bacheloress')], is spending most of [pa_character.GetHerHis] evenings deep in conversation with [targeter.GetName].\n\nIt would seem that they are getting rather close."
 friend_rival.1.t: "A Spark"
 friend_rival.1.a: "We shouldn't get in the way."
 friend_rival.1.b: "This should be discouraged..."
 friend_rival.2.a: "Splendid!"
 friend_rival.2.b: "Encourage them to spend less time together."
 friend_rival.2.desc: "[pa_character.GetName] appears to be developing a strong camaraderie with [targeter.GetName].\n\nSometimes it can be advantageous to have a friend watching one's back, but it is not too late to avoid this situation."
 friend_rival.2.t: "Growing Friendship"
 tooltip_no_effect: "Selecting this option will have no effect."
 friend_rival.3.t: "Twisting the Knife"
 friend_rival.3.a: "Troubling."
 friend_rival.3.desc: "[pa_character.GetName], for reasons known only unto [pa_character.GetHerselfHimself], has begun to view [targeter.GetName] with jealousy and distrust.\n\nEven having them in the same room as one another is bound to result in hostility."
 friend_rival.4.b: "Just enjoy the show..."
 friend_rival.4.desc: "Addressing the good people of [ROOT.GetCountry.GetName] this morning, on a matter of little importance, [friend_rival_4_target.GetName] found [friend_rival_4_target.GetHerselfHimself] completely lost for words.\n\nIf [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName] were to intervene, we would surely earn the undying gratitude of [friend_rival_4_target.GetShortName], however, such a public display of bi-partisan camaraderie would likely cause concern."
 friend_rival.4.t: "Tongue Tied"
 friend_rival.4.a: "Help [friend_rival_4_target.GetHerHim] out!"
 friend_rival.5.b: "[friend_rival_5_target_two.GetShortName] makes a good case."
 friend_rival.5.desc: "An argument has been furiously raging for some time now, between [friend_rival_5_target_one.GetName] and [friend_rival_5_target_two.GetName].\n\nThe gist of the matter involves a sizable quantity of wealth, with each claimant certain that they are the rightful owner.\n\nAfter many months of fruitless discussion, both parties have agreed to let [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName] decide on a solution."
 friend_rival.5.t: "Mediation"
 friend_rival.5.a: "[friend_rival_5_target_one.GetShortName] does seem to have a genuine claim."
 friend_rival.5.c: "There is a tale of a wise king, by the name of Solomon..."
 friend_rival.6.t: "Harboring Grudges"
 friend_rival.6.b: "Attempt to ameliorate the situation."
 friend_rival.6.desc: "[friend_rival_5_spurned.GetName], after being spurned by [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] recent judgment on a minor matter of wealth, has been quietly plotting revenge.\n\n[friend_rival_5_spurned.GetSheHe|U] has been spreading all manner of vicious rumors, as well as threatening violence! Who knows what may happen next?"
 friend_rival.6.a: "Curses!"
 fr_6_vengeful_tooltip: "Because [friend_rival_5_spurned.GetShortName] has the #Y Vengeful#! trait, the effects of this option are magnified!"
 STATIC_MODIFIER_NAME_sabotage_modifier: "Arson!"
 friend_rival.7.desc: "A younger, relatively unknown [mentee.GetWomanMan] has approached [pa_character.GetName], desperately seeking guidance through the murky dealings of the [ROOT.GetCountry.Custom('pa_imp_get_court_type')].\n\nA protégé might come in handy, after all, [mentee.GetSheHe] does seem ever so eager."
 friend_rival.7.a: "Encourage this arrangement."
 friend_rival.7.t: "Learning From Experience"
 friend_rival.7.b: "Politely decline."
 mentee_arrangement: "[pa_character.GetName] will become the mentor of [mentee.GetName]."
 friend_rival.8.t: "Learning from the Best"
 friend_rival.8.desc: "Having taken young [mentee.GetShortName] under [pa_character.GetHerHis] wing, [pa_character.GetShortName] is finding [mentee.GetHerHim] to be a quick study.\n\nAlthough their beliefs don't always align, [mentee.GetShortName] has started to blindly parrot whatever [pa_character.GetShortName] says.\n\nThis may be convenient, but perhaps it is not the best lesson to teach?"
 friend_rival.8.a: "On the contrary, this is splendid!"
 friend_rival.8.b: "Teach [mentee.GetHerHim] to make [mentee.GetHerHim] own way in life."
 friend_rival.9.t: "In the Shadow of Giants"
 friend_rival.9.desc: "Patiently spending most of [mentee.GetHerHis] time watching how [pa_character.GetShortName] effortlessly interacts with the political scene in [ROOT.GetCountry.GetName], has paid off.\n\nRecently, [mentee.GetShortName] managed to convince a member of the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] to change his stance on an important issue.\n\nWhilst it may seem like a small victory, it was enough to get [mentee.GetShortName] noticed."
 friend_rival.9.a: "Wonderful!"
 friend_rival.9.b: "Teach [mentee.GetHerHim] to be humble in victory."
 friend_rival.10.t: "The Best Lessons"
 friend_rival.10.b: "Leniency can teach just as well."
 friend_rival.10.a: "A harsh lesson is the best lesson."
 friend_rival.10.desc: "[mentee.GetName] recently managed to disappoint [mentee.GetHerHis] mentor, [pa_character.GetShortName].\n\nWhilst the offense was minor, [pa_character.GetShortName] has harshly berated [mentee.GetShortName], in the hope that something can be learned from this incident."
 friend_rival.11.b: "Matters of principle should come first."
 friend_rival.11.desc: "[pa_character.GetName] and [targeter.GetName] have spent the last several weeks in deep debate on a number of issues they share strong feelings on.\n\nAt a recent open discussion in the [ROOT.GetCountry.Custom('pa_imp_get_court_type')], [targeter.GetName] challenged [pa_character.GetShortName] directly; expecting their recent camaraderie to hold some sway."
 friend_rival.11.t: "Budding Friendship"
 friend_rival.11.a: "Sometimes, a friend can be worth swallowing one's pride."
 friend_rival.12.desc: "A self-avowed rival of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName], the [pa_character.Custom('pa_imp_get_rival_adjective')] [friend_rival_12_rival_target.GetName], has been doing [friend_rival_12_rival_target.GetHerHis] best to turn our loyal servants against us.\n\nUp to now, [friend_rival_12_rival_target.GetSheHe] has had little success, however, reports have reached us that [friend_rival_12_general_target.GetName], one of distinguished generals, has been spending a great deal of time with [friend_rival_12_rival_target.GetShortName].\n\nWe shudder to think of the vicious lies being fed to [friend_rival_12_general_target.GetHerHim]."
 friend_rival.12.a: "Very troubling."
 friend_rival.12.b: "Take a stand! Denounce both of the traitorous curs!"
 friend_rival.12.t: "Troubling Allegiance"
 friend_rival.13.a: "Turn the other cheek."
 friend_rival.13.desc: "Heated debates in the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] are not uncommon, especially where so many prominent members of society are involved.\n\nLately, a wave of xenophobia has swept across [ROOT.GetCountry.GetName], resulting in foreign values being regarded with great distrust.\n\nAll in attendance at today's debate agreed, however, that [targeter.GetName] crossed the line today, when [targeter.GetSheHe] accused [ROOT.GetCountry.GetGovernment.GetRulerTitle] [pa_character.GetShortName] of indulging in barbaric [accusation_target.GetCulture.GetName] practices..."
 friend_rival.13.t: "Xenophobia"
 friend_rival.13.b: "Well, [targeter.GetShortName] is practically [accusation_target_2.GetCulture.GetName]!"
 friend_rival.15.desc: "Sometimes, childhood forges friendships that last for a lifetime, and often, those friendships transcend the boundaries of family, class, and belief. \n\nIt would appear that [fr_15_target_child.GetShortName] seems to be developing a strong bond with [fr_15_target_child_2.GetShortName], of the [fr_15_target_child_2.GetDynasty.GetName] family. As any parent knows, there really isn't much we can do to stand between them."
 friend_rival.15.t: "Bond of Childhood"
 friend_rival.15.a: "Interesting."

