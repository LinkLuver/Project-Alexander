 STATIC_MODIFIER_NAME_alexander_in_athens: "A Warning to Tyrants"
 STATIC_MODIFIER_NAME_alexander_in_rhodos: "The True Colossus"
 STATIC_MODIFIER_NAME_alexanders_legacy_cmod: "Alexander's Legacy"
 body_in_alexandria: "It seems that he has been buried with the honor and respect that he must have deserved; in a great city, overlooking a sea he once called home."
 body_in_a_very_odd_place: "We remain unsure how his body ended up in this location, so far from his home."
 body_in_fairly_normal_place: "It would appear that his remains have been tussled over, finally ending up buried by one of the self-proclaimed kings, who fought over the scraps of his empire.\n\n"
 alexander_greek_cloc: "the mighty conqueror and ancestor of kings, Alexander the Great"
 alexander_eastern_cloc: "that great bringer of war, Iskandar; whom the Greeks know as Alexander"
 alexander_default_cloc: "the mighty warrior Alexander, known to the Greeks as; 'the Great'"
 dhe_body.5.h: "He was truly the man who would be king."
 to_the_hungriest_tooltip: "#Y This option is available because your Ruler has the#! #R Cannibal Trait#!.\n#Y Every country with#! #G Hellenic Culture#! #Y will lose#! #R 100 Opinion#! #Y of us.#!"
 dhe_body.5.j: "A new beginning for the greatest among us, seems appropriate."
 body_transit_location_eboracum: "Alexander's remains will be transferred to #Y [eboracum.GetName]#!."
 dhe_body.5.desc_hellenic: "After the conquest of [body_province.GetName], our soldiers, as usual, sacked the city, making off with all manner of spoils. There was, however, one area of the city that remained largely untouched by looting.\n\nA grand edifice, looming over the tightly packed districts of [body_province.GetName], stood proud throughout our conquest. In it, lies the body of the most revered of men: Alexander. His victories almost innumerable, this man had a vision the likes of which has not been seen since. [body_province.Custom('pa_imp_why_is_there_a_body_here')]\n\nSuch a man deserves to be left in peace for his eternal slumber, but various voices in our armies cry out for differing treatment of the remains of this hero, once feared and admired in equal measure."
 body_transit_duration_tooltip: "It will take some time for the remains to be transferred."
 body_transit_location_babylon: "Alexander's remains will be transferred to #Y [babylon.GetName]#!."
 body_transit_location_kafir: "Alexander's remains will be transferred to #Y [kafir.GetName]#!."
 dhe_body.5.n: "As colossus himself; Rhodos seems a fitting resting place."
 dhe_body.5.g: "The King of Kings deserves his rightful throne."
 dhe_body.5.o: "I will devour the withered corpse of the Macedonian! 'To the hungriest...'"
 dhe_body.5.p: "No more shall we worship the body of a tyrant"
 dhe_body.5.i: "Alexander must rest, surrounded by mighty men."
 body_transit_location_lavinium: "Alexander's remains will be transferred to #Y [lavinium.GetName]#!."
 dhe_body.5.c: "There is truly only one place worthy of Alexander."
 body_transit_location_athens: "Alexander's remains will be transferred to #Y [athens.GetName]#!."
 body_transit_location_alexandria: "Alexander's remains will be transferred to #Y [alexandria.GetName]#!."
 dhe_body.5.t: "Tomb of an Emperor"
 dhe_body.5.a: "To disturb him would be sacrilege."
 lost_to_time_dde_tooltip: "Alexander's remains will be #R lost to the sands of time#!."
 body_transit_location_rhodos: "Alexander's remains will be transferred to #Y [rhodos.GetName]#!."
 body_transit_location_aegae: "Alexander's remains will be transferred to #Y [aegae.GetName]#!."
 body_transit_location_niniveh: "Alexander's remains will be transferred to #Y [niniveh.GetName]#!."
 body_transit_location_antigonia: "Alexander's remains will be transferred to #Y [antigonia.GetName]#!."
 dhe_body.5.f: "Let him return to his ancestors."
 dhe_body.5.b: "He shall rest in the county of the Gods themselves."
 dhe_body.5.k: "Lay him to rest amongst those he defeated."
 dhe_body.5.d: "To overlook Rome is reward indeed."
 body_transit_location_stockholm: "Alexander's remains will be transferred to #Y [stockholm.GetName]#!."
 body_transit_location_shushan: "Alexander's remains will be transferred to #Y [shushan.GetName]#!."
 dhe_body.5.l: "Lay him at the banks of the Tigris; the lifeblood of his conquests."
 dhe_body.5.m: "Install him in Athens; that he may act as a reminder of the results of hegemony."
 dhe_body.5.e: "Return him to the banks of the Nile."
 dhe_body.5.desc: "After the recent conquest of [body_province.GetName], our warriors spent much time prowling the streets for spoils.\n\nDuring this predatory but tolerated activity, one of our loyal officers reported coming across a sombre edifice shrouded in an atmosphere of majesty, the likes of which he had never before experienced. On closer inspection, this mighty building contained naught but a single sarcophagus, which the we believe belonged to [ROOT.GetCountry.Custom('pa_imp_get_knowledge_of_alexander')]. [body_province.Custom('pa_imp_why_is_there_a_body_here')]\n\nPossessing the tomb of this great warrior is bound to bring us great prestige, not to mention the jealousy of our peers. It is true, however, that this great man commanded such respect that others may seek to wrest his body from us."
 body_transit_location_lysimacheia: "Alexander's remains will be transferred to #Y [lysimacheia.GetName]#!."
 dhe_body.6.a: "Very well."
 mausoleum_building_available: "A #Y Decision#! to construct a mausoleum is now available."
 dhe_body.6.t: "Resting Place of a Conqueror"
 dhe_body.6.desc: "The sarcophagus of Alexander the Great was carried into our city, attended by great crowds. All fell silent at the sight; perhaps awed by the sobriety of the fate of such a great and honorable man.\n\nIt would become us to prepare a great mausoleum, worthy of laying this paragon of virtue to his final rest."
 dhe_body.7.c: "Put him to death!"
 dhe_body.7.b: "Let him rot."
 dhe_body.7.a: "He might make a fine addition to our [ROOT.GetCountry.Custom('pa_imp_get_court_type')]."
 dhe_body.7.desc: "Apprehended after making a scene at the mausoleum of Alexander, a strange, but curiously intelligent man, [alexandrine_visitor.GetName], has been hauled in front of us for summary judgment.\n\nHe remains reticent as to his reasons for such disrespect in the presence of our memorial, but we should aim to appease those who call for his blood."
 dhe_body.7.t: "A Disrespectful Visitor"
 dhe_body.8.desc: "During [government_officer.GetHerHis] regular obeisance at the glorious mausoleum containing the remains of Alexander, [government_officer.GetShortName] claims to have come across a variety of documents detailing links between members of our own elite, and the great warrior himself.\n\nMany claim these documents are spurious, but the mere existence of them is surely enough to reinforce to conquer, in the same manner as Alexander."
 dhe_body.8.t: "Forgotten Documents"
 dhe_body.8.a: "Spread them far and wide."
 dhe_body.8.b: "Denounce them as fakes."
 dhe_body.9.b: "Find any excuse - deal with this threat."
 dhe_body.9.t: "Forgotten Bloodlines"
 dhe_body.9.a: "Embrace this glorious news!"
 argead_and_loyalty_tooltip: "Every male member of the #Y [relative_of_alexander.GetDynasty.GetName]#! family will also receive these effects."
 dhe_body.9.desc: "During research at the great library built alongside the mausoleum of Alexander, one of our scholars discovered some potentially unsettling news.\n\nSpeaking in hushed whispers, he described ancient documents, showing that the [relative_of_alexander.GetDynasty.GetName] family is in fact a long-lost cadet branch of the Argead line.\n\nIf we make this information public, there could be outcry from the general populace, expectant that this noble lineage should once again take the throne. There is of course, another option..."
 # pa_imp_move_country_with_close_family_effect
 move_country_with_close_family_effect_tt: "[move_country_with_close_family_character.GetName|Y], and any close family, will move to [move_country_with_close_family_employer.GetName|Y]."
