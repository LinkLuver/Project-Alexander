l_english:
 ### Religious Laws
 buddhist_tradition_law: "Buddhist Tradition"
 buddhist_tradition_law_desc: "$buddhist_tradition_law$ reflects the form of Buddhist teaching and monastic practice favored by the state. Different traditions emphasize distinct interpretations of discipline, doctrine, and the proper relationship between rulers, monks, and the wider [ShowReligionName('buddhism')] community."
 sangha_tradition: "Saṅgha"
 sangha_tradition_desc: "The $sangha_tradition$ represents broad patronage of the Buddhist monastic community without privileging a particular doctrinal lineage. By supporting monasteries, teachers, and the wider community of monks and nuns, the state encourages religious harmony while allowing diverse interpretations of the Dharma to coexist."
 sthavira_tradition: "Sthavira"
 sthavira_tradition_desc: "The $sthavira_tradition$ follows the 'Elders,' emphasizing the authority of established teachers, careful preservation of the Buddha's teachings, and strict observance of monastic discipline. Its followers place particular value on learned monks, doctrinal continuity, and the maintenance of an orderly Saṅgha."
 mahasamghika_tradition: "Mahāsāṃghika"
 mahasamghika_tradition_desc: "The $mahasamghika_tradition$, or 'Great Community,' represents a broad current within early Buddhism that places emphasis on the wider Saṅgha and the collective religious community. Its followers encourage the growth of Buddhist institutions and the spread of the Dharma among both monastics and lay believers."