l_english:
 pa_civic_councils: "Civic Councils"
 pa_civic_councils_desc: "Local councils advise the ruler and give influential communities a voice in the affairs of state, strengthening cooperation and diplomacy."
 pa_royal_secretariat: "Royal Secretariat"
 pa_royal_secretariat_desc: "A permanent body of scribes and officials carries the ruler's orders across the realm, improving coordination and extending central authority."
 local_army_organization: "Citizen Levies"
 local_army_organization_desc: "Communities are obligated to provide and equip citizen soldiers when called, giving the state a dependable source of military manpower."
 pa_sacred_authority: "Sacred Authority"
 pa_sacred_authority_desc: "The ruler's authority is reinforced by religious institutions and traditional rites, binding spiritual influence to the governance of the realm."
 everyone_serves_reform: "Granary Administration"
 everyone_serves_reform_desc: "Public granaries and organized food collection help stabilize supplies and support the population through scarcity."
 urbanization_focus_gov: "Civic Urbanization"
 urbanization_focus_gov_desc: "The state encourages settlement around administrative and commercial centers, expanding urban capacity and drawing skilled people into civic life."
 agricultural_cultivation: "Agrarian Administration"
 agricultural_cultivation_desc: "Officials organize cultivation, irrigation, and the storage of harvests to sustain the population and secure the kingdom's food supply."
 authoritarian_state: "Royal Centralization"
 authoritarian_state_desc: "The ruler strengthens royal authority through appointed officials and direct oversight, improving the state's ability to mobilize people and govern its territories."
 stronghold_gov: "Frontier Strongholds"
 stronghold_gov_desc: "Strategic strongholds secure supplies and shelter along threatened frontiers, helping the realm resist invasion and maintain its defenses."
 placeholder_gov: "Military Settlements"
 placeholder_gov_desc: "The ruler settles loyal soldiers and their households in strategic districts, creating a reserve of locally based troops to defend the realm."
 tribal_clan_gov: "Clan Confederation"
 tribal_clan_gov_desc: "Clans retain local authority while contributing warriors to a common host, preserving kinship ties and coordinating defense across the confederation."
 religious_tolerance: "Civic Rites"
 religious_tolerance_desc: "The ruler protects public rites and traditional observances, seeking divine favor and social harmony among the communities of the realm."
 exchange_of_ideas: "Hellenistic Scholarship"
 exchange_of_ideas_desc: "The court gathers scholars, engineers, and learned envoys from across the known world, supporting study, written learning, and the exchange of practical knowledge."
 harbor_administration: "Port Administration"
 harbor_administration_desc: "Officials regulate harbor dues, maintain port facilities, and support maritime traffic, strengthening the realm's coastal commerce."
 diplomatic_traditions: "Diplomatic Traditions"
 diplomatic_traditions_desc: "Established customs of gift-giving, negotiation, and dynastic diplomacy help the court manage relations with neighboring rulers and leagues."
 patrimonialism: "Patrimonial Rule"
 patrimonialism_desc: "The ruler governs through personal household ties and inherited obligations, relying on traditional authority where a large permanent administration is absent."
 enforce_religious_adherence: "State Cult Decree"
 enforce_religious_adherence_desc: "The ruler formally supports the realm's sacred rites and priesthood, reinforcing the link between religious authority and public government."
 trade_office_network: "Royal Emporia"
 trade_office_network_desc: "The crown grants favored markets and trading houses privileged access to commerce, drawing foreign merchants and revenue into royal ports."
 rome_republic_gov: "Roman Republican Constitution"
 rome_republic_gov_desc: "The Roman Republic is governed through magistracies and the Senate, while its citizen assemblies preserve a vital role for the plebeians and sustain the obligations of Roman civic life."
 carthaginian_council_republic: "Carthaginian Council Republic"
 carthaginian_council_republic_desc: "Carthage entrusts the republic to its suffetes and councils of elders, where leading families and merchant interests guide civic policy and maritime power."
 macedonian_companion_kingdom: "Macedonian Companion Kingdom"
 macedonian_companion_kingdom_desc: "The Macedonian king relies on the Companion cavalry and the leading aristocratic houses, maintaining the martial traditions of the kingdom while ruling a Hellenistic court."
 seleucid_satrapal_monarchy: "Seleucid Satrapal Monarchy"
 seleucid_satrapal_monarchy_desc: "The Seleucid king governs a vast, diverse realm through royal governors and local authorities, using satrapal administration to connect distant provinces to the court."
 ptolemaic_pharaonic_bureaucracy: "Ptolemaic Pharaonic Bureaucracy"
 ptolemaic_pharaonic_bureaucracy_desc: "The Ptolemaic dynasty adopts the authority of the pharaohs and builds upon Egypt's established scribal administration to manage the Nile valley and its grain."
 antigonid_garrison_monarchy: "Antigonid Garrison Monarchy"
 antigonid_garrison_monarchy_desc: "The Antigonid dynasty maintains royal power through a strong military court, strategic garrisons, and the mobilization of Macedonian forces."
 thracian_lysimachid_kingdom: "Lysimachid Kingdom of Thrace"
 thracian_lysimachid_kingdom_desc: "Lysimachus governs Thrace as a Hellenistic successor kingdom, combining Macedonian military institutions with the need to maintain royal authority across a frontier realm."
 mauryan_imperial_administration: "Mauryan Imperial Administration"
 mauryan_imperial_administration_desc: "The Mauryan emperor extends royal authority across a vast subcontinent through provincial officials, inspectors, and established local institutions."
 parthian_clan_kingship: "Parthian Clan Kingship"
 parthian_clan_kingship_desc: "The Parthian ruler governs through negotiated ties with powerful local clans, whose regional authority and mounted forces sustain the realm."
 bactrian_eastern_satrapy: "Bactrian Eastern Satrapy"
 bactrian_eastern_satrapy_desc: "The Bactrian satrap governs a strategic eastern province through regional levies and delegated authority, maintaining the frontier links between Iran and Central Asia."
 syracusan_personal_kingship: "Syracusan Personal Kingship"
 syracusan_personal_kingship_desc: "The Syracusan ruler concentrates authority in the royal court and directs the city's military resources to defend its position in Sicily."
 athenian_democratic_polis: "Athenian Democratic Polis"
 athenian_democratic_polis_desc: "The Athenian polis is grounded in citizen assemblies and the organization of civic life through the demes, with public service extending to the defense of its maritime interests."
 spartan_citizen_military_state: "Spartan Citizen Military State"
 spartan_citizen_military_state_desc: "Sparta's political order rests on a disciplined citizen body, collective military training, and the obligations binding its allies to the Spartan-led league."
 epirote_federal_kingship: "Epirote Federal Kingship"
 epirote_federal_kingship_desc: "The Molossian king leads a wider Epirote union, combining dynastic authority with the shared institutions and military obligations of its constituent communities."
 # Vanilla reforms re-added with P:A names (2026-10-23)
 the_recruiting_act: "Conscription of Rowers"
 the_recruiting_act_desc: "Free men who own no land are enrolled to pull an oar in the fleet when it sails. The register of rowers lets the state man its warships quickly in an emergency." #P:A TODO Generated description
 national_assemblies: "Sovereign Assembly"
 national_assemblies_desc: "The assembly of citizens is the highest authority in the state. It votes on laws and on war and peace, and holds the magistrates to account." #P:A TODO Generated description
 admiralty_regime_reform: "Rule of the Navarch"
 admiralty_regime_reform_desc: "The ruler commands the fleet in person: where other states have a fleet, this fleet has a state. Royal authority reaches as far as the ships can sail." #P:A TODO Generated description
 military_regime_reform: "Rule of the Polemarch"
 military_regime_reform_desc: "The ruler is chosen from among the commanders of the army and owes the throne to the soldiers who acclaimed him. The government serves the army." #P:A TODO Generated description
 the_espionage_act: "The King's Eyes and Ears"
 the_espionage_act_desc: "Agents of the crown open letters, watch the roads and listen in the markets. They are the ruler's eyes and ears, warning of plots at home and intentions abroad." #P:A TODO Generated description
 public_welfare_act: "Euergetism"
 public_welfare_act_desc: "Wealthy citizens pay for grain distributions, festivals and public buildings, and are honoured with statues and decrees in return. The poor are fed and the benefactors gain standing." #P:A TODO Generated description
 the_education_act: "Scribal Schools"
 the_education_act_desc: "Those who serve in the administration must first learn to read, write and reckon in the scribal schools, as scribes have done for centuries." #P:A TODO Generated description
 the_loyalty_act: "Royal Informers"
 the_loyalty_act_desc: "Subjects who report plots and suspicious strangers to the king's officers are rewarded. Offices in every district collect their reports." #P:A TODO Generated description
 the_transportation_act: "Royal Roads"
 the_transportation_act_desc: "Roads with posting stations and fixed tolls link the provinces to the capital. Couriers, armies and goods move faster along them." #P:A TODO Generated description
 cultural_recognition_act: "Recognition of Native Customs"
 cultural_recognition_act_desc: "A ruler of many peoples governs best by respecting their temples, laws and languages. Native elites who are honoured serve the crown instead of conspiring against it." #P:A TODO Generated description
 licensing_of_the_press_act: "Royal Portraiture"
 licensing_of_the_press_act_desc: "The ruler's likeness appears on every coin, statue and temple relief, crowned with the symbols of divine favour. Subjects learn whom to obey from the money in their hands." #P:A TODO Generated description
 mercenary_registration_act: "Mercenary Reliance"
 mercenary_registration_act_desc: "The state hires professional soldiers in great numbers and keeps captains and recruiters on its payroll. Mercenaries win wars, as long as they are paid." #P:A TODO Generated description
 universal_serfdom: "Royal Peasantry"
 universal_serfdom_desc: "Peasants on royal land are bound to their villages and owe rent and labour directly to the crown." #P:A TODO Generated description
 statute_of_monopolies: "Royal Monopolies"
 statute_of_monopolies_desc: "Only the crown may produce or sell oil, papyrus and other staples, and it leases these rights to contractors under strict rules." #P:A TODO Generated description
 state_backed_merchant_fleet: "Royal Trade Fleet"
 state_backed_merchant_fleet_desc: "The crown builds and owns merchant ships that carry grain, oil and timber between its ports, and lends them to the navy when war comes." #P:A TODO Generated description
 military_allotment: "Military Settlers"
 military_allotment_desc: "Soldiers receive plots of land in return for serving whenever the king calls. Their settlements give the crown a loyal reserve rooted in the conquered lands." #P:A TODO Generated description
 weapons_quality_standards: "Royal Arsenals"
 weapons_quality_standards_desc: "State workshops make arms and armour to a single pattern, and inspectors reject faulty work. Every soldier fights with the same spear, shield and helmet." #P:A TODO Generated description
 recordkeeping_act: "Royal Archives"
 recordkeeping_act_desc: "Every order, receipt and census return is copied and stored. With the archives at hand, officials can check what is owed and who has paid it." #P:A TODO Generated description
 flexible_diplomatic_stance: "Shifting Alliances"
 flexible_diplomatic_stance_desc: "Today's ally may be tomorrow's enemy. Our envoys stay at every court, and treaties are kept only while they serve us." #P:A TODO Generated description
 town_specialization: "Polis Charters"
 town_specialization_desc: "Each city receives a charter that sets out its laws, magistrates and duties to the crown, suited to its size and trade." #P:A TODO Generated description
 study_of_the_classics: "Gymnasium Education"
 study_of_the_classics_desc: "Sons of the elite train their bodies and minds in the gymnasium, reading the poets under the best tutors. Those who pass through it carry its learning and manners into every office." #P:A TODO Generated description
 hermit_country_reform: "Xenelasia"
 hermit_country_reform_desc: "Foreigners are expelled and citizens may not travel abroad without leave. Few outsiders learn enough of our affairs to invent a pretext for war." #P:A TODO Generated description
 shield_of_the_faith_reform: "Protector of the Sanctuary"
 shield_of_the_faith_reform_desc: "We guard the great sanctuary and those who come to worship there. Pilgrims and priests look to us for protection, and our walls shelter the faithful in times of war." #P:A TODO Generated description
 enlightened_council_reform: "Court Philosophers"
 enlightened_council_reform_desc: "Philosophers from the schools sit at the ruler's table and advise on law and government. Their counsel keeps the ruler's mind on the good of all subjects." #P:A TODO Generated description
 rural_oligarchy_reform: "Estate Agronomy"
 rural_oligarchy_reform_desc: "Wealthy landowners run large estates for profit, following the advice of agricultural manuals. Their stewards open new fields, vineyards and mines faster than any village could." #P:A TODO Generated description
 trade_guards_reform: "Caravan Escorts"
 trade_guards_reform_desc: "Paid guards escort caravans along the desert and mountain roads and keep the roads and stations in repair. Merchants pay for the protection, and the routes stay open." #P:A TODO Generated description
 provincial_consulates_reform: "Proxenia Network"
 provincial_consulates_reform_desc: "Respected citizens of foreign cities serve as our proxenoi, hosting our envoys and speaking for our interests in their assemblies. Our embassies find friends waiting wherever they go." #P:A TODO Generated description
 peasant_labor_rights_reform: "Abolition of Debt Bondage"
 peasant_labor_rights_reform_desc: "No citizen may be enslaved or held in bondage for debt. Free farmers and labourers keep their land and their liberty, and work it the better for it." #P:A TODO Generated description
 new_elite_reform: "Revision of City Charters"
 new_elite_reform_desc: "Old charters granted to cities by earlier rulers are reviewed, and privileges that no longer suit a city's place in the realm are revoked or rewritten." #P:A TODO Generated description
 feudal_nobility: "Landed Companions"
 feudal_nobility_desc: "The king's companions hold estates from the crown and answer his summons with their horsemen. Their loyalty rests on the land he grants them." #P:A TODO Generated description
 of_noble_bearing: "Noble Lineage"
 of_noble_bearing_desc: "Our noble houses trace their descent from heroes and gods, and take pride in the learning and bearing that set them apart." #P:A TODO Generated description
 royal_commission_act: "Royal Inspectors"
 royal_commission_act_desc: "Inspectors sent from the court audit the accounts of governors and tax officials and report abuses directly to the ruler." #P:A TODO Generated description
 noble_elite_desc: "In law every citizen may hold office, but in practice a few old families hold them all. The magistrates are chosen from among them and depend on their support." #P:A TODO Generated description
 sortition_desc: "Votes can be bought and old loyalties cloud judgement, so magistrates and jurors are chosen by lot from among eligible citizens. No faction can buy or bully its way into office." #P:A TODO Generated description
 merchant_republic_desc: "A republic ruled by its merchant families. The flow of commerce comes before every other concern of state." #P:A TODO Generated description
 peasant_republic_reform: "Agrarian Democracy"
 peasant_republic_reform_desc: "The small farmers who own and work their land form the citizen body and fill the ranks of the army, while nobles and priests count for little. Philosophers have called it the best kind of democracy." #P:A TODO Generated description
 dynastic_signoria_reform: "Hereditary Tyranny"
 dynastic_signoria_reform_desc: "One family has held the tyranny for generations, passing the city from father to son while the old assemblies still meet." #P:A TODO Generated description
 signoria_reform: "Tyranny"
 signoria_reform_desc: "A single strongman rules the city with the backing of mercenaries or the poor, while the assemblies and magistracies survive in name only." #P:A TODO Generated description
 guru_leadership_reform: "Acharya Leadership"
 guru_leadership_reform_desc: "The country is led by a learned acharya, a teacher who tends to the spiritual needs of the people as well as to the affairs of state, and guides the faithful towards liberation." #P:A TODO Generated description
 legacy_of_genghis: "Legacy of Yuezhi"
 legacy_of_genghis_desc: "Driven from their pastures by a stronger rival, our forefathers carried their horse-archer traditions across the steppe. We keep that legacy, and any land our horses can reach is ours to claim." #P:A TODO Generated description
 # Imperator government types, imported from Invictus (names and descriptions from Imperator: Rome)
 aristocratic_republic: "Aristocratic Republic"
 aristocratic_republic_desc: "Whilst outwardly democratic, an Aristocratic Republic limits leadership to those who enjoy high status."
 theocratic_republic: "Theocratic Republic"
 theocratic_republic_desc: "The priesthood will enshrine democracy into the very tenets of our faith!"
 oligarchic_republic: "Oligarchic Republic"
 oligarchic_republic_desc: "An Oligarchic Republic restricts positions of power to a wealthy or powerful minority."
 democratic_republic: "Democratic Republic"
 democratic_republic_desc: "This system of government gives all eligible citizens a voice, through the election of representatives to a senate, or council."
 plutocratic_republic: "Plutocratic Republic"
 plutocratic_republic_desc: "Primarily concerned with the acquisition of wealth, Plutocratic Republics can be found ruling many of the coastal City States throughout the world."
 dictatorship: "Dictatorship"
 dictatorship_desc: "A form of totalitarian government, a dictatorship places political power in the hands of a single individual."
 despotic_monarchy: "Autocratic Monarchy"
 despotic_monarchy_desc: "Conferring absolute power, the title of an Autocratic Monarchy is hereditary."
 aristocratic_monarchy: "Aristocratic Monarchy"
 aristocratic_monarchy_desc: "Although ruled by a hereditary monarch, power in an Aristocratic Monarchy is often conferred upon members of the nobility."
 stratocratic_monarchy: "Stratocratic Monarchy"
 stratocratic_monarchy_desc: "The military is integral to a functioning stratocratic monarchy. Advised by generals and warriors, the Monarch rules by might."
 theocratic_monarchy: "Theocratic Monarchy"
 theocratic_monarchy_desc: "A king cannot have true power unless backed by the priesthood, and invested with the power of the Divine."
 imperial_cult: "Imperial Cult"
 imperial_cult_desc: "In some cultures, an Emperor or Empress holds such authority that they and their ancestors are considered to be a messenger of the divine, or even a deity themselves."
 tribal_chiefdom: "Migratory Tribe"
 tribal_chiefdom_desc: "Elected by a council of tribesmen, a tribal chief rules for life, and is entrusted with the safety and security of his or her tribe. The most important authority vested in the Chief is the decision of when to settle and when to migrate to another, more favorable location."
 tribal_kingdom: "Settled Tribe"
 tribal_kingdom_desc: "Tribal leaders are elected for life, by a council of the clan leaders. This is a society that has come to settle permanently in its region, embracing a sedentary lifestyle."
 tribal_federation: "Federated Tribe"
 tribal_federation_desc: "Representing the wisdom of a great number of united clans, the council of a Federated Tribe resembles the beginnings of a democratic state."
