 ip_rep_66_oligarch_revolt_country_adjective: "$ADJ$ Oligarchic"
 ip_republic.83.t: "Ostracism Result"
 ip_republic.83.desc_1: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] supporters wait impatiently as the last of the ostraka ballots are gathered and taken to be counted. With bated breath they stare down [ip_rep_66_protagonist.GetShortName] and [ip_rep_66_protagonist.GetHerHis] followers across the senate floor.\n\nAfter some time the aged official returns with the scrap of parchment that will decide the future of [ROOT.GetCountry.GetName]. Slowly approaching the podium and clearing his throat, the official opens the scrap and enunciates clearly: ''[ip_rep_66_protagonist.GetShortName]!''\n\n[ip_rep_66_protagonist.GetShortName] is visibly shaken by the announcement and rises to flee but is held by the surrounding senators. The guards drag the defeated plotter from the hall as a collective sigh of relief transforms into jovial hand-shakes and pats on the back."
 ip_republic.83.desc_2: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] supporters wait impatiently as the last of the ostraka ballots are gathered and taken to be counted. With bated breath they stare down [ip_rep_66_protagonist.GetShortName] and [ip_rep_66_protagonist.GetHerHis] followers across the senate floor.\n\nAfter some time the aged official returns with the scrap of parchment that will decide the future of [ROOT.GetCountry.GetName]. Slowly approaching the podium and clearing his throat, the official opens the scrap and enunciates clearly: ''[ip_rep_66_scapegoat.GetShortName]!''\n\nThe bewildered [ip_rep_66_scapegoat.GetName] is led from the hall amid groans from both sides of the house, as the mischievous rictus grin of [ip_rep_66_protagonist.GetShortName] fixes on [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]..."
 ip_republic.83.a: "[ip_rep_66_protagonist.GetShortName] has won..."
 ip_republic.83.b: "It is civil war then!"
 ip_republic.83.c: "The republic is safe."
 ip_republic.83.ct: "The plot is dead."
 ip_republic.83.d: "'HOW DO YOU LIKE THOSE OLIVES?!'"
 ip_republic.84.t: "Seizure of Power"
 ip_republic.84.desc: "The worst fears of the contemptible leadership of [ROOT.GetCountry.GetName] have finally come true. Soldiers loyal to the true patriots roam the streets of [ROOT.GetCountry.GetCapital.GetName] maintaining order as [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_rep_66_overthrown_ruler.GetShortName] and [ip_rep_66_overthrown_ruler.GetHerHis] supporters are rounded up and taken to the prison.\n\nA few dozen outspoken minor politicians have been slaughtered in the forum as a warning to any who would oppose the newly established [ROOT.GetCountry.Custom('pa_imp_get_oligarchy_name')]. [ip_rep_66_protagonist.GetShortName] then holds a speech before the gathered masses where he reassures them they are in the safe hands of [ip_rep_66_protagonist.Custom('pa_imp_get_experience_reason')] to mixed but docile reception.\n\nAll that remains is to decide what should be done with pitiful [ip_rep_66_overthrown_ruler.GetShortName] and [ip_rep_66_overthrown_ruler.GetHerHis] cronies."
 ip_republic.84.a: "We would never harm our friends."
 ip_republic.84.at: "This option is available due to the merciful nature of [ip_rep_66_protagonist.GetShortName]."
 ip_republic.84.b: "Keep [ip_rep_66_overthrown_ruler.GetHerHim] in the dungeons for now."
 ip_republic.84.c: "[ROOT.GetCountry.GetName] needs a clean break with the past."
 ip_republic.84.ct: "This option is available due to the harsh nature of [ip_rep_66_protagonist.GetShortName]."
 ip_republic.84.d: "Let [ip_rep_66_overthrown_ruler.GetHerHim] run."
