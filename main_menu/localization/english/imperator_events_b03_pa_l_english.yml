 ip_republic.85.t: "News of [ip_rep_66_protagonist.GetCourtCountry.GetName]"
 ip_republic.85.desc_1: "We have received an envoy from a grateful [ip_rep_66_protagonist.GetCourtCountry.GetGovernment.GetRulerTitle] [ip_rep_66_protagonist.GetShortName], the new oligarch of [ip_rep_66_protagonist.GetCourtCountry.GetName] - no doubt thanks to our generous support.\n\n[ip_rep_66_protagonist.GetShortName] has pledged a thousand years of friendship between our two great nations and hopes we will be of great help to each other in future."
 ip_republic.85.desc_2: "We have received an envoy from [ip_rep_66_protagonist.GetCourtCountry.GetName] relating that [ip_rep_66_protagonist.GetShortName] and [ip_rep_66_protagonist.GetHerHim] coup to become the new oligarch of [ip_rep_66_protagonist.GetCourtCountry.GetName] has been foiled.\n\n[ip_rep_66_protagonist.GetCourtCountry.GetGovernment.GetRuler.GetShortName] has invoked a thousand years curse on our nations and hopes we will be consumed by the gods fury."
 ip_republic.85.desc_3: "The disappointing [ip_rep_66_protagonist.GetShortName] has arrived in [ROOT.GetCountry.GetName] having fled from imprisonment for plotting against [ip_rep_66_protagonist.GetHerHis] government.\n\nIt seems our little games have not been fruitful on this occasion."
 ip_republic.85.desc_4: "We have received word that the [ip_rep_66_protagonist.GetShortName], the [ip_rep_66_protagonist.GetCourtCountry.GetAdjective] politician we backed, has used our support to start a civil war in the republic.\n\nLet's hope [ip_rep_66_protagonist.GetSheHe] comes out of top."
 ip_republic.85.a: "Huh."
 ip_republic.85.b: "Hah, oh well."
 ip_republic.85.c: "Very nice."
 ip_republic.86.t: "News of [ip_rep_66_protagonist.GetCourtCountry.GetName]"
 ip_republic.86.desc_1: "The proud [ip_rep_66_protagonist.GetCourtCountry.GetAdjective] republic has experienced a radical upheaval as forces loyal to a politician named [ip_rep_66_protagonist.GetShortName] successfully ousted the presiding [ip_rep_66_protagonist.GetCourtCountry.GetGovernment.GetRulerTitle] and replaced the government with a hand picked group of oligarchs."
 ip_republic.86.desc_2: "The proud [ip_rep_66_civil_war_general.GetCourtCountry.GetAdjective] republic has fallen into disarray as the forces of [ip_rep_66_civil_war_general.GetCourtCountry.GetGovernment.GetRulerTitle] [ip_rep_66_civil_war_general.GetShortName] attempt to stop an oligarchic coup led by a politician named [ip_rep_66_protagonist.GetShortName].\n\nWe will watch this development with interest."
 ip_republic.86.a: "Ah, truly the best form of government."
 ip_republic.86.b: "It does not do to dwell on dreams..."
 ip_republic.86.c: "What larks."
 civil_war.5.t: "Victorious!"
 civil_war.5.desc: "At long last, the brutal struggle with our own nation has come to a close. The remains of the armies once commanded by [target.GetName] lie broken and demoralized, awaiting our judgment.\n\n[target.GetShortName] [target.GetHerselfHimself] has been cast in irons, while we decide how we should punish [target.GetHerHim] and [target.GetHerHis] co-conspirators for their transgressions against the people of [ROOT.GetCountry.GetName]."
 ip_republic.87.a: "Death to tyrants."
 ip_republic.87.b: "Spare the wretch."
 civil_war.6.t: "Victorious!"
 civil_war.6.desc: "At long last, the brutal struggle with our own nation has come to a close. The remains of the armies once commanded by [target.GetName], lie broken and demoralized, awaiting our judgment.\n\n[target.GetShortName] [target.GetHerselfHimself] has been cast in irons, while we decide how we should punish [target.GetHerHim] for [target.GetHerHis] transgressions against the true [ROOT.GetCountry.GetAdjective] people.\n\nThe people have spoken!"
 ip_republic.88.a: "A new beginning."

 # befriend.txt
 # tooltips of pa_imp_set_friend_progress_*_effect (new keys: the Imperator texts from character_interactions_l_english.yml)
 friend_progress_large: "Your Ruler will make a #Y Large#! amount of progress towards befriending [friend_target.GetName]."
 friend_progress_moderate: "Your Ruler will make a #Y Moderate#! amount of progress towards befriending [friend_target.GetName]."
 friend_progress_small: "Your Ruler will make a #Y Small#! amount of progress towards befriending [friend_target.GetName]."
 befriend.1.t: "Political Ambitions"
 befriend.1.desc: "It is well known that [friend_target.GetName] has been seeking a particular government office for some time. Until now [friend_target.GetSheHe] has been passed over, unjustly, in favor of others.\n\nWith a well placed word and some wrangling we could achieve both our own aims and those of [friend_target.GetShortName]."
 befriend.1.a: "Give [friend_target.GetHerHim] what [friend_target.GetSheHe] wants."
 befriend.1.b: "This isn't right."
 befriend.2.t: "Exotic Gifts"
 befriend.2.desc: "Wild beasts from the far corners of the earth make for eye-catching and exotic gifts. Various merchants throughout the region offer a wide range of creatures, both for the arena and private owners, from Scythian colts to Nubian leopards.\n\nThe question is; which impressive beast to send?"
 befriend.2.a: "Only a tiger is sure to win [friend_target.GetHerHim] over."
 befriend.2.b: "A Nile crocodile will do."
 befriend.2.c: "The Bactrian camel is cheapest..."
 befriend.2.d: "People actually pay these prices?"
 befriend.3.t: "Everyone Likes Gold"
 befriend.3.desc_1: "Of all the ways of making friends, a gift is perhaps both the oldest and simplest. In the world of politics, wealth shared generously and unconditionally has more influence than kind words or affection.\n\nHow much is the friendship of [friend_target.GetName] worth?"
 befriend.3.desc_2: "Of all the ways of making friends, a gift is perhaps both the oldest and simplest. In the world of politics, wealth shared generously and unconditionally has more influence than kind words or affection.\n\nHow much is the friendship of [friend_target.GetName] worth?"
 befriend.3.a: "The state has deep pockets."
 befriend.3.b: "A moderate gift should satisfy."
 befriend.3.c: "Just a small token."
 befriend.3.d: "This should do the trick."
 #P:A TODO No EU5 equivalent: befriend.3.dt/.et/.ft describe a gift of the ruler's personal wealth, which EU5 lacks; the event no longer shows them
 befriend.3.dt: "Your Ruler will give [friend_target.GetName] #Y 250#! @gold! of their personal wealth."
 befriend.3.e: "No need for extravagance."
 befriend.3.et: "Your Ruler will give [friend_target.GetName] #Y 100#! @gold! of their personal wealth."
 befriend.3.f: "Perhaps [friend_target.GetSheHe] respects humility."
 befriend.3.ft: "Your Ruler will give [friend_target.GetName] #Y 50#! @gold! of their personal wealth."
 befriend.3.g: "There is some other way..."
 befriend.4.t: "The Gladiator"
 befriend.4.desc_1: "A previously unknown gladiator has recently risen to great prominence in the arena, drawing huge crowds and by all accounts putting on a peerless show. The man has been causing quite a stir; selling out packed arenas, securing fish sauce sponsorships, and netting gamblers vast sums of money.\n\nSending the fighter's show on a tour to the court of [friend_target.GetShortName], before he inevitably gets himself killed, could be an easy way to ingratiate ourselves."
 befriend.4.desc_2: "A previously unknown gladiator has recently risen to great prominence in the arena, drawing huge crowds and by all accounts putting on a peerless show.\n\nA well placed box seat could easily win over [friend_target.GetShortName]..."
 befriend.4.a: "Send the man to serve in [friend_target.GetHerHis] personal bodyguard."
 befriend.4.b: "Buy and gift him to [friend_target.GetShortName]."
 befriend.4.c: "Everyone enjoys a good show."
 befriend.4.d: "Far too vulgar..."
 befriend.5.t: "Making an Impression"
 befriend.5.desc_1: "The official diplomatic channels offer many ways to impress and show our respect for to [friend_target.GetName]. A diplomatic envoy is perhaps the most obvious, bringing gifts and publicly expressing our desire for friendship.\n\nWe could also send a religious delegate to tour the temples of [friend_target.GetHerHis] country, or attempt to win the favor of [friend_target.GetName] with the choice of our imposing soldiery."
 befriend.5.desc_2: "Our position offers many ways to publicly flatter [friend_target.GetName]. Careful praise of [friend_target.GetHerHis] deeds in the halls of government, and among the notaries of our country, will be sure to find its way back to [friend_target.GetHerHis] ears.\n\nAlternatively, a lavish sacrifice in [friend_target.GetHerHis] honor can hardly go ignored, and then again, few can spurn the gift of a public statue in their honor, particularly a flattering one..."
 befriend.5.a: "Publicly praise [friend_target.GetHerHis] and [friend_target.GetHerHis] deeds."
 befriend.5.b: "Sacrifice a bull to [friend_target.GetHerHis] name."
 befriend.5.c: "Commission a sculpture in [friend_target.GetHerHis] honor."
 befriend.5.d: "A gift laden envoy should influence [friend_target.GetHerHim]."
 befriend.5.e: "Send a lavish religious delegation."
 befriend.5.f: "Our best warriors will turn [friend_target.GetHerHis] head."
 befriend.5.g: "Let's not go crazy..."
 befriend.6.t: "The Benefits of Power"
 befriend.6.desc_1: "An outspoken critic of [friend_target.GetName] has been seeking refuge in our country for some time. He is man of no importance, banished from his own land he seeks alms and spreads vicious rumors of debauchery and corruption about the court of [friend_target.GetShortName].\n\nThis could be an excellent opportunity to get in [friend_target.GetHerHis] good books...."
 befriend.6.desc_2: "[friend_target.GetName] is the target of a brazenly outspoken critic who has been provoking [friend_target.GetHerHis] ire for some time. It seems the loudmouth is protected by political opponents of [friend_target.GetShortName] and believes himself to be untouchable.\n\nThis could be an excellent opportunity to impress [friend_target.GetShortName]."
 befriend.6.a: "This wretch has abused our hospitality too long."
 befriend.6.b: "A few bribes and some thugs will solve this."
 befriend.6.c: "This is beneath us..."
 befriend.7.t: "Friendship with [friend_target.GetShortName]"
 befriend.7.desc: "Our efforts to encourage a friendship between [pa_character.GetName] and [friend_target.GetName] have paid off."
 befriend.7.a: "Naturally."
 befriend.8.t: "Spurned by [friend_target.GetShortName]"
#P:A TODO Imperator showed the target's title before the name ([friend_target.GetTitle]); EU5 characters have no title data function, so it was dropped
 befriend.8.desc_1: "Despite our best efforts to encourage a friendship with [friend_target.GetName], it would appear that [friend_target.GetSheHe] was not convinced."
 befriend.8.desc_2: "Despite our best efforts to encourage a friendship with [friend_target.GetName], it would appear that [friend_target.GetSheHe] was not convinced."
 befriend.8.a: "This is terribly vexatious."
 befriend.10.t: "Friend Request"
 befriend.10.desc: "[actor.GetGovernment.GetRuler.GetName], the [actor.GetGovernment.GetRulerTitle] of [actor.GetName], has cordially invited our [ROOT.GetCountry.GetGovernment.GetRulerTitle] to a banquet of great significance.\n\nIt seems that [actor.GetGovernment.GetRuler.GetSheHe] has the intention of forging a friendship between our two nations."
 befriend.10.a: "Splendid!"
 befriend.10.b: "Decline friend request."
 friend_refusal: "[actor.GetName] will be informed of our decision."
 befriend.11.t: "Declined!"
 befriend.11.desc: "The [target.GetCourtCountry.GetGovernment.GetRulerTitle] of [target.GetCourtCountry.GetName] has had the temerity to decline our kind offer of friendship!\n\nSuch arrogance shall surely plague their fine nation for many years to come."
 befriend.11.a: "Alas."
 no_effect_tooltip: "This option will have no effect."
 befriend.12.t: "Friendship Secured!"
 befriend.12.desc: "The [target.GetCourtCountry.GetGovernment.GetRulerTitle] of [target.GetCourtCountry.GetName] has welcomed our friendship request with open arms!\n\nMay both our fine nations continue to flourish in mutual prosperity."
 befriend.12.a: "Excellent."
