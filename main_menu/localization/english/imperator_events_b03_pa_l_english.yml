 # internal_politics_republic_part2.txt
 ip_republic.66.t: "A Veiled Threat"
 ip_republic.66.desc: "The momentum of the state carries on as usual in [ROOT.GetCountry.GetName], addressing the concerns of citizens and debating the policies that will ensure our prosperity and strength - or so we are led to believe.\n\nThere are those that whisper of an inchoate plot brewing late at night in the dark rooms of [ip_rep_66_protagonist.GetShortName]. They say [ip_rep_66_protagonist.GetSheHe] has tired of our [ROOT.GetCountry.Custom('pa_imp_get_republic_type')] and is hatching a plan to seize the premiership for [ip_rep_66_protagonist.GetHerselfHimself] and [ip_rep_66_protagonist.GetHerHis] cronies, to rule as all-powerful oligarchs.\n\nIt is too early to say whether these rumors have any substance, but our eyes have certainly been opened."
 ip_republic.66.a: "Arrest that [ip_rep_66_protagonist.GetWomanMan] at once."
 ip_republic.66.b: "Outrageous, confront [ip_rep_66_protagonist.GetShortName] immediately."
 ip_republic.66.bt: "#R This option is risky and may incur tyranny.#!"
 ip_republic.66.c: "Keep a close eye on [ip_rep_66_protagonist.GetHerHim]."
 ip_republic.66.ct: "[ip_rep_66_protagonist.GetShortName] will be tailed - this could help stop the plot but may have unforeseen consequences."
 ip_republic.66.d: "But there is no proof..."
 ip_republic.66.dt: "The plot will develop further."
 ip_republic.67.t: "Ambitions Confronted"
 ip_republic.67.desc_1: "To the surprise of almost everyone, the bold personal confrontation of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ip_rep_66_protagonist.GetShortName] at the latter's home resulted in [ip_rep_66_protagonist.GetShortName] breaking down and begging for forgiveness from [ROOT.GetCountry.GetName].\n\nIt seems [ip_rep_66_protagonist.GetSheHe] wasn't quite up to the task of running a plot to overthrow a state after all..."
 ip_republic.67.desc_2: "In a move now widely regarded as reckless, [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] confronted [ip_rep_66_protagonist.GetShortName] at [ip_rep_66_protagonist.GetHerHis] home, demanding the truth about a plot and making all kinds of threats.\n\n[ip_rep_66_protagonist.GetShortName] easily deflected the accusations with ironically feigned ignorance and spread word that the [ROOT.GetCountry.GetGovernment.GetRulerTitle] is a tyrant who barges into honest citizen's homes sword in hand..."
 ip_republic.67.desc_3: "The quivering [ip_rep_66_protagonist.GetShortName] quickly balked at the presentation of evidence to the senate, prostrating [ip_rep_66_protagonist.GetHerselfHimself] on the ground and begging for mercy.\n\nThe plot is over, but the senate and people aren't too happy about the means with which we secured the republic's freedom..."
 ip_republic.67.desc_4: "It seems our evidence was not quite watertight enough. When called upon in the senate to respond to the allegations, [ip_rep_66_protagonist.GetShortName] deftly deflected the accusations as baseless slander based on forged documents concocted a personal rival in a love triangle.\n\nDespite the barely concealed thread of irony in the stream of [ip_rep_66_protagonist.GetHerHis] lies [ip_rep_66_protagonist.GetSheHe] quickly distracted the majority of the house and most have now been convinced of [ip_rep_66_protagonist.GetHerHis] innocence..."
 ip_republic.67.a: "Well, that was easy..."
 ip_republic.67.at: "The plot will not continue."
 ip_republic.67.b: "Thy mother was a scorpion, [ip_rep_66_protagonist.GetShortName]."
 ip_republic.67.bt: "#R This option is risky and may incur tyranny.#!"
 ip_republic.67.c: "For the love of the republic!"
 ip_republic.67.d: "Curses."
 deceitful_tooltip: "This option is available because your ruler has the #Y Deceitful#! trait."
 righteous_tooltip: "This option is available because your ruler has the #Y Righteous#! trait."
