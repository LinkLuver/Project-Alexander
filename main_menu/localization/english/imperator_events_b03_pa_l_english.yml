 vengeful_tooltip: "This option is available because your ruler has the #Y Vengeful#! trait."
 oligarch_plot_success_chance_balance: "This will help #Y counter#! gains made by the oligarchs."
 oligarch_plot_success_chance_subtract_large: "This will #R decrease#! our chances of foiling the plot by a #Y large#! amount."
 oligarch_plot_success_chance_subtract_small: "This will #R decrease#! our chances of foiling the plot by a #Y small#! amount."
 oligarch_plot_success_chance_future_small: "This will #G increase#! our chances of foiling the plot by a #Y small#! amount."
 oligarch_plot_success_chance_future_large: "This will #G increase#! our chances of foiling the plot by a #Y large#! amount."
 ip_republic.68.t: "Shifting Loyalties"
 ip_republic.68.desc_1: "The budding friendship of the ambitious [ip_rep_66_protagonist.GetShortName] with [ip_rep_66_supporter.GetShortName] has dominated the gossip of the capital's villas for days, with the last straw being an effusive and histrionic public display of affection between the two politicians at the reading of an otherwise irrelevant bill in the [ROOT.GetCountry.Custom('pa_imp_get_court_type')].\n\nWhether dismayed by the ease with which [ip_rep_66_protagonist.GetShortName] seems to gather the support of influential backers like [ip_rep_66_supporter.GetShortName], or just horrified by the eagerness of some to abandon our republic's traditions, many senators are in uproar and more openly voicing their fears for the future of [ROOT.GetCountry.GetName]."
 ip_republic.68.desc_2: "[ip_rep_66_protagonist.GetShortName] has once again stunned the [ROOT.GetCountry.Custom('pa_imp_get_court_type')], making it clear that [ip_rep_66_supporter.GetShortName] is a staunch supporter of [ip_rep_66_supporter.GetHerHis] nefarious plans. No doubt ensnared by promises of wealth and power, [ip_rep_66_supporter.GetShortName] is rumored to spend an inordinate amount of time at the villas and offices of [ip_rep_66_supporter.GetShortName] with only deaf dumb servants in attendance.\n\nIt is indeed frightening to see the foremost citizens of [ROOT.GetCountry.GetName] so easily led astray from the honored traditions of our founders..."
 ip_republic.68.a: "We, too, can gather supporters."
 ip_republic.68.b: "A small smear campaign should turn the people against [ip_rep_66_protagonist.GetShortName]."
 ip_republic.68.c: "Does [ip_rep_66_supporter.GetShortName] want to keep [ip_rep_66_supporter.GetHerHis] job?"
 ip_republic.68.ct1: "[ip_rep_66_supporter.GetShortName] will no longer support [ip_rep_66_protagonist.GetShortName]."
 ip_republic.68.ct2: "\nThis option is available because [ip_rep_66_supporter.GetShortName] holds an office."
 ip_republic.68.d: "They have broken no laws."
 ip_republic.71.t: "Plotting in [ip_rep_66_protagonist.GetCourtCountry.GetName]"
 ip_republic.71.desc: "A party of the trusted confidants of an [ip_rep_66_protagonist.GetCourtCountry.GetAdjective] politican named [ip_rep_66_protagonist.GetName] have mysteriously arrived in [ROOT.GetCountry.GetCapital.GetName]. It has become clear that they are surreptitiously attempting to gain our support for a coup in [ip_rep_66_protagonist.GetCourtCountry.GetName] that will place [ip_rep_66_protagonist.GetShortName] as head of an oligarchy.\n\nThe government of [ip_rep_66_protagonist.GetCourtCountry.GetName] is sure to hear about their attempts sooner or later and we must decide how to respond to the delegates.\n\nA grateful dictator is sure to create [ip_rep_66_protagonist.GetCourtCountry.GetAdjective] warmth to our own causes, and whether they succeed or fail [ip_rep_66_protagonist.GetCourtCountry.GetAdjective] will be weakened. Then again, maybe we are above such petty blackguard behavior."
 ip_republic.71.a: "[ip_rep_66_protagonist.GetShortName] will be useful."
 ip_republic.71.at: "This may help [ip_rep_66_protagonist.GetShortName] overthrow the government of [ip_rep_66_protagonist.GetCourtCountry.GetName] - if [ip_rep_66_protagonist.GetSheHe] succeeds a truce will be created and relations between [ROOT.GetCountry.GetName] and [ip_rep_66_protagonist.GetCourtCountry.GetName] will improve."
 ip_republic.71.b: "We have no interest in [ip_rep_66_protagonist.GetCourtCountry.GetName]..."
 ip_republic.72.t: "Murmurings in [ip_rep_66_supporting_city.GetName]"
 ip_republic.72.desc_1: "It is being reported that the people of [ip_rep_66_supporting_city.GetName] in [ip_rep_66_supporting_city.GetProvince.GetName] have spontaneously taken up the cause of [ip_rep_66_protagonist.GetShortName], cheering [ip_rep_66_protagonist.GetHerHis] name from the rooftops and hanging crudely rushed portraits of the [ip_rep_66_protagonist.GetWomanMan] around town.\n\nThis is no doubt a cheap ploy by [ip_rep_66_protagonist.GetShortName] to get us to overestimate [ip_rep_66_protagonist.GetHerHis] support by hiring some brigands, but the concerned citizens of [ip_rep_66_supporting_city.GetName] and [ROOT.GetCountry.GetName] as a whole demand a response lest [ip_rep_66_protagonist.GetShortName] secure a power base in the city."
 ip_republic.72.desc_2: "We have received reports that the people of [ip_rep_66_supporting_city.GetName] in [ip_rep_66_supporting_city.GetProvince.GetName] are supposedly pledging their support to [ip_rep_66_protagonist.GetShortName] is return for boons to be granted after the oligarchic coup is complete.\n\nThe support of the city hangs in the balance, and we must act swiftly to ensure [ip_rep_66_protagonist.GetShortName] does not establish a power base there."
 ip_republic.72.a: "It is the governor's job to maintain order, is it not?"
 ip_republic.72.b: "An infrastructure project might win them over?"
 ip_republic.72.c: "Gather the names of all those responsible."
 ip_republic.72.d: "Remind the city how easily privileges can be revoked."
 ip_republic.72.e: "Why do we care what they do in [ip_rep_66_supporting_city.GetName]?"
 STATIC_MODIFIER_NAME_ip_rep_66_crackdown_pmod: "Crackdown"
 STATIC_MODIFIER_NAME_ip_rep_66_local_exemptions: "Local Exemptions"
 victorious_tooltip: "This option is available because your ruler has the #Y Victorious#! trait."
 founder_tooltip: "This option is available because your ruler has the #Y Founder#! trait."
 benefactor_tooltip: "This option is available because your ruler has the #Y Benefactor#! trait."
 scholar_tooltip: "This option is available because your ruler has the #Y Scholar#! trait."
 ip_rep_73_cohorts_tt: "This option is available due to your ruler's #Y Loyal Cohorts#!."
 ip_rep_73_wealth_tt: "This option is available due to your ruler's #Y great wealth#!."
 ip_republic.73.t: "Extravagant Promises"
 ip_republic.73.desc: "[ip_rep_66_protagonist.GetShortName] has seemingly shown [ip_rep_66_protagonist.GetHerHis] true colors by debasing [ip_rep_66_protagonist.GetHerselfHimself] in front of crowds gathered in the forum.\n\nWith much waving of the arms and appeals to justice, [ip_rep_66_protagonist.GetSheHe] promises inconceivable reforms and benefits to the masses, in what many sneer is a barely veiled effort to gather support for [ip_rep_66_protagonist.GetHerHis] leadership and the eventual takeover of [ROOT.GetCountry.GetName].\n\nWe must remind the people who their real benefactors are before it is too late."
 ip_republic.73.a: "Bread and games for all!"
 ip_republic.73.b: "Remind the people of the great achievements of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]."
 ip_republic.73.c: "But, the republic!"
 ip_republic.73.ct: "\nThis option is available due to your ruler's #Y Diplomacy#! or talents for public speaking."
 ip_republic.73.d: "The local assemblies must take our side."
 ip_republic.73.e: "The mob is fickle."
 ip_republic.74.t: "Evidence Uncovered"
 ip_republic.74.desc: "Our skilled agents have successfully discovered evidence of the treachery of [ip_rep_66_protagonist.GetShortName] and [ip_rep_66_protagonist.GetHerHis] supporters through some unclear but necessarily nefarious means.\n\nExamining the documents, there seems to be enough information to convince the senate to rally to the support of any measures punishing [ip_rep_66_protagonist.GetShortName], if and when we decide it is necessary..."
 ip_republic.74.a: "We should not be hasty. This will be useful soon."
 ip_republic.74.b: "[ip_rep_66_protagonist.GetShortName] must be brought to trial immediately."
 ip_republic.75.t: "Agents Discovered"
 ip_republic.75.desc: "Our incompetent agents have been discovered while searching for evidence of the treachery in the home of [ip_rep_66_protagonist.GetShortName].\n\nThis will no doubt lose us some support in the senate - we have managed to look even more tyrannical than [ip_rep_66_protagonist.GetShortName] and [ip_rep_66_protagonist.GetHerHis] ilk..."
 ip_republic.75.a: "Curses."
 ip_republic.76.t: "Confrontation with the Oligarchs"
 ip_republic.76.desc: "Senators from across the house are arguing that we must no long allow this situation with [ip_rep_66_protagonist.GetShortName] to develop unopposed: we must act before matters slip beyond our control for good and confront them immediately.\n\nIt is impossible to accurately judge the full extent of the support the plotters have managed to gain across [ROOT.GetCountry.GetName], but we have a fairly good idea. However, if we miscalculate we may find ourselves in the middle of a civil war.\n\nSome of the more cautious argue that we should hand over power - at least for time being - in order to ensure our country is not ripped apart by war and left open to foreign assaults..."
 ip_republic.76.a: "Confront the oligarchs."
 ip_republic.76.at: "We have a #Y [ROOT.ScriptValue('pa_imp_get_oligarch_plot_success_chance')|0]%#! chance of success based on the strength of the plotters.\n\nFailure will result in #R civil war#!."
 ip_republic.76.b: "Even [ip_rep_66_protagonist.GetShortName] is more favorable than strife..."
 #P:A TODO Approximate: the event adds the EU5 Noble Elite reform in place of the Imperator Oligarchic Republic government
 ip_republic.76.bt: "[ROOT.GetCountry.GetName] adopts the #Y Oligarchic Republic#! government form."
 ip_republic.76.c: "Ostracism is our last hope."
 #P:A TODO Approximate: ip_republic.83 compares the diplomatic skill of the ruler and the plotter in place of the Imperator popularity
 ip_republic.76.ct: "A secret ballot will be held to banish someone from [ROOT.GetCountry.GetName].\n\nThe outcome will depend on the relative #Y Diplomatic#! skill of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ip_rep_66_protagonist.GetShortName]."
 #P:A TODO Imperator had no loc for this opinion; name written from the key
 ip_rep_66_insulted_ruler: "Insulted Ruler"
 ip_rep_66_counter_support: "Common Interests"
 ip_rep_66_successful_support: "Aided Plotters"
 STATIC_MODIFIER_NAME_ip_rep_66_patrols_cmod: "Strict Borders"
 ip_republic.77.t: "Rumors of Foreign Support"
 ip_republic.77.desc_1: "We have received startling new information from our friends in the [ip_rep_66_foreign_backer.GetAdjective] capital that [ip_rep_66_protagonist.GetShortName] has been putting out feelers for foreign support to overthrow the government of [ROOT.GetCountry.GetName] and install [ip_rep_66_protagonist.GetHerselfHimself] as ruler.\n\nAs usual the evidence is not conclusive, but our relations with [ip_rep_66_foreign_backer.GetGovernment.GetRulerTitle] [ip_rep_66_foreign_backer.GetGovernment.GetRuler.GetShortName] are not ideal, and the uncertainty already sown has left many in the [ROOT.GetCountry.Custom('pa_imp_get_court_type')] outraged. Already insults fly at an insouciant [ip_rep_66_protagonist.GetShortName] while senators hotly debate the various possible moves required to counter such potential treachery.\n\nSome have suggested approaching another power with interests more aligned to our own in order to counter the [ip_rep_66_foreign_backer.GetAdjective] threat, while others advocate less tactful responses that may only exacerbate our diplomatic ties."
 ip_republic.77.desc_2: "We are once again shocked to hear that despite dispelling the previous foreign threat [ip_rep_66_protagonist.GetShortName] has tried to lobby for backing from the ruler of [ip_rep_66_foreign_backer.GetName].\n\nHow should we react this time?"
 ip_republic.77.a: "Does [ip_rep_66_foreign_backer.GetGovernment.GetRuler.GetShortName] have no honor?"
 ip_republic.77.b: "We must ensure no hidden goods be allowed inside our cities."
 ip_republic.77.c: "Approach [ip_rep_66_counter_foreign.GetName], the enemy of our enemy is our friend."
 ip_republic.77.ct: "\nThis option is available because [ip_rep_66_foreign_backer.GetName] is a mutual enemy of [ip_rep_66_counter_foreign.GetName], who will match any support given to the plotters."
 ip_republic.77.d: "Pah, mere hyperbole."
 STATIC_MODIFIER_NAME_ip_rep_66_veteran_grants_cmod: "Veteran Land Grants"
 ip_republic.78.t: "Doubts in the Military"
 ip_republic.78.desc: "The insidious threat of tyranny once more rears its head, this time amid rumors that [ip_rep_66_protagonist.GetShortName] is seeking the direct support of prominent officers in the military to back [ip_rep_66_protagonist.GetHerHis] plot with spear and shield.\n\nThe republic relies on its soldiery for defense, and any partisanship in the ranks is generally unheard of. However, [ip_rep_66_protagonist.GetShortName] clearly lacks the scruples of other politicians and must be dealt with without scruples accordingly, though at what cost..."
 ip_republic.78.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] knows how to appeal to soldiers."
 ip_republic.78.at: "\nThis option is available due to your ruler's #Y Military#! skill or military experience."
 ip_republic.78.b: "Please... the army is loyal us."
 ip_republic.78.bt: "This option is available because our ruler has more loyal cohorts than [ip_rep_66_protagonist.GetShortName]."
 ip_republic.78.c: "We could settle the more rowdy veterans."
 ip_republic.78.d: "Then we must outbid for the loyalty of the troops."
 ip_republic.78.e: "The fighting men would never betray [ROOT.GetCountry.GetName]."
 ip_republic.79.t: "Plot Dissipates"
 ip_republic.79.desc: "For the first time in weeks, the gossip surrounding [ip_rep_66_protagonist.GetShortName] has virtually disappeared. The steady stream of scandalous developments and worried parties demanding action have also ceased.\n\nWith any luck it seems that the plot has fizzled out on its own accord, though whether it's because [ip_rep_66_protagonist.GetShortName] couldn't gather enough support or there was never any threat to begin with we will never know."
 ip_republic.79.a: "The republic is safe once more."
 ip_republic.79.b: "There was never any real threat..."
 ip_republic.79.c: "[ip_rep_66_protagonist.GetShortName] is too dangerous to live."
 ip_republic.79.d: "[ip_rep_66_protagonist.GetSheHe|U] must be ostracized."
 ip_republic.80.t: "Partisan Approaches"
 ip_republic.80.desc_1: "Concerned by the tension brought about by the republic's growing fear of the tyranny of [ip_rep_66_protagonist.GetShortName], the loyal and respectable [ip_rep_66_counter.GetShortName] has approached [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] to personally pledge [ip_rep_66_counter.GetHerHis] wealth and connections in support of the cause of liberty.\n\nSuch public displays of partisan loyalty are likely to be received unfavorably, the people may think one tyrant is merely shoring themselves up against another. However, we will have to judge for ourselves whether the resources [ip_rep_66_counter.GetShortName] can bring to the table outweigh the potential damage, and may be necessary to preserving our [ROOT.GetCountry.Custom('pa_imp_get_republic_type')]."
 ip_republic.80.desc_2: "We have been approached by a concerned politician named [ip_rep_66_counter.GetShortName] who wishes to aid in the defense of the republic however they can, pledging their wealth and connections to stop the rise of the oligarchs plot.\n\nWe must once again decide whether courting this level of personal support is a look that is worth its cost..."
 ip_republic.80.a: "For the good of the republic."
 ip_republic.80.b: "[ip_rep_66_counter.GetSheHe|U] is most welcome."
 ip_republic.80.bt1: "[ip_rep_66_counter.GetShortName] will contribute [ip_rep_66_counter.GetHerHis] wealth and power base to our cause."
 ip_republic.80.bt2: "\nAny increases to this character's power base will help our chances of foiling the plot."
 ip_republic.80.c: "It seems making friends has its uses after all."
 ip_republic.80.d: "[ip_rep_66_counter.GetShortName] is no help to us..."
 ip_republic.81.t: "Auctioning Support"
 ip_republic.81.desc: "The slimy [ip_rep_66_auction.GetShortName], a politician of some note, has had the gall to approach us explaining that with a sufficient incentive [ip_rep_66_auction.GetSheHe] could be persuaded to lend us [ip_rep_66_auction.GetHerHis] support - making it clear that [ip_rep_66_protagonist.GetShortName] received the same offer earlier today.\n\nWhile it is a despicable move to exploit the internal discord of the state for personal benefit, we may need [ip_rep_66_auction.GetHerHis] support if we are to ensure the oligarchs are vanquished."
 ip_republic.81.a: "For the good of the republic."
 ip_republic.81.b: "[ip_rep_66_auction.GetShortName] is not fit to work in this government."
 ip_republic.81.bt: "\nThis option is available because [ip_rep_66_auction.GetShortName] holds an office."
 ip_republic.81.c: "Let the toad do [ip_rep_66_auction.GetSheHe] likes."
 ip_republic.82.t: "Confronting the Plotters"
 ip_republic.82.desc_1: "After some tense days determining the plotters support, the toing and froing in the senate has finally come to a head. A majority of senators have backed calls to have [ip_rep_66_protagonist.GetShortName] and [ip_rep_66_protagonist.GetHerHis] supporters arrested and their properties searched for evidence of treason.\n\nWhile there was no overwhelming physical evidence, the wanton behavior of [ip_rep_66_protagonist.GetShortName] in the past months has not been appreciated by the majority of [ROOT.GetCountry.GetAdjective] politicians and many hold the view that unless the entire debacle has been an elaborate practical joke it is clear that [ip_rep_66_protagonist.GetShortName] has been seeking to undermine [ROOT.GetCountry.GetName], if not directly overthrow its government.\n\nThe senators now debate on how to deal with the accused plotters and put this sorry episode behind us."
 ip_republic.82.desc_2: "As we tried to determine the support [ip_rep_66_protagonist.GetShortName] and [ip_rep_66_protagonist.GetHerHis] supporters held in the senate, their absences quickly became apparent, and we have now learned that their houses have been deserted for some days.\n\nA praiseworthy slave has related that they have fled to their friends in [ip_rep_66_foreign_backer.GetName], presumably realizing that they had no chance of successfully overthrowing the government of [ROOT.GetCountry.GetName]."
 ip_republic.82.desc_3: "It seems we underestimated the support [ip_rep_66_protagonist.GetShortName] and [ip_rep_66_protagonist.GetHerHis] supporters have managed to gather. As we moved to arrest them the soldiers found their homes already deserted.\n\nIt seems they were well aware of our plans before they were hatched, and rumors have begun to reach [ROOT.GetCountry.GetCapital.GetName] that the traitors are gathering their supporters to form an army and take the capital by force!"
 ip_republic.82.a: "Execute them!"
 ip_republic.82.b: "They will never set foot in [ROOT.GetCountry.GetCapital.GetName] again."
 ip_republic.82.c: "Cast the leaders into the dungeons."
 ip_republic.82.d: "We must embrace them, they have learned their folly."
 ip_republic.82.e: "At least the threat is over..."
 ip_republic.82.et: "The plot will end."
 ip_republic.82.f: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] can handle them."
 ip_republic.82.g: "We need a real general, like [ip_rep_66_civil_war_general.GetShortName]!"
 #P:A TODO Approximate: the event checks the EU5 trait Kind-Hearted in place of the Imperator trait Merciful
 merciful_tooltip: "This option is available because your ruler has the #Y Kind-Hearted#! trait."
