 trade_goods_flavour.51.t: "Horse Breeding"
 trade_goods_flavour.51.desc: "A horse breeder has approached our court, wanting to sell us some of his finest breeds. He offers us some horses for our war chariots - they are 'immune to fear' as the master claims. Alternatively, he has some sturdy horses to help to help the farmers in the fields.\nSeeing as to how beautiful and useful his breeds are, he would be useful in our employ..."
 trade_goods_flavour.51.a: "The war horses."
 trade_goods_flavour.51.b: "Farms always need help."
 trade_goods_flavour.51.c: "Have the master join our court."
 master_breeder_joins_court_tt: "A Master Breeder will join our court."
 STATIC_MODIFIER_NAME_war_horse_breed: "War Horses"
 STATIC_MODIFIER_DESC_war_horse_breed: "A master has trained a new generation of horses ideal for war."
 STATIC_MODIFIER_NAME_farm_horse_breed: "Farming Horses"
 STATIC_MODIFIER_DESC_farm_horse_breed: "A master has trained a new generation of horses ideal for farming."
 STATIC_MODIFIER_NAME_horses_escaped: "Horses Escaped"
 STATIC_MODIFIER_DESC_horses_escaped: "Horses escaped local farms, reducing productivity significantly."
 trade_goods_flavour.52.t: "A Matter of Grove Importance"
 trade_goods_flavour.52.desc: "We have a bit of a predicament on our hands, and [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has a difficult decision to make.\n\nThere is a grove of trees that is not too far from [ROOT.GetCountry.GetCapital.GetName] that is a sacred place to animals, and although everyone knows that the gods frequently visit this forest to commune with the creatures, there are some who want to build their houses in this region.\n\nShould we allow our citizens to build their homes? The grove would have to be chopped down."
 trade_goods_flavour.52.a: "We have to preserve the grove at all costs!"
 trade_goods_flavour.52.b: "Our people need houses..."
 STATIC_MODIFIER_NAME_grove_preserved: "Preserved Grove"
 STATIC_MODIFIER_DESC_grove_preserved: "A holy grove has been spared and left to grow, despite not being able to reach economic and soaicl goals."
 STATIC_MODIFIER_NAME_grove_desecrated: "Desecrated Grove"
 STATIC_MODIFIER_DESC_grove_desecrated: "For mere economical gain a holy grove was torn down."
 trade_goods_flavour.53.t: "Horses Escaping"
 trade_goods_flavour.53.desc: "Terrible news from [horse_farm_scope.GetName] - it seems that one of the stablehands forgot to close the gate before falling asleep, and when the idiot woke up, every single horse on the farm had escaped - there's no doubt the animals have made it to the badlands by this point. A total loss!"
 trade_goods_flavour.53.a: "We have to catch at least a few! Get out there!"
 trade_goods_flavour.53.b: "Curses! Gone is gone...we can do nothing"
 horses_capture_again_tt: "A part of the horses were captured again."
 horses_escaped_tt: "With no horses left, it will take years until there will be new horse breeders in [horse_farm_scope.GetName]."
 trade_goods_flavour.54.t: "The Nemean Lion Sighted"
 trade_goods_flavour.54.desc: "News from [ShowLocationName('argos')]! The dread #high Nemean Lion#!, a beast of great size and ferocious appetite, has been spotted again, attacking cattle and even killing the children of an unfortunate shepherd. The locals are scared out of their minds and are begging from assistance from the [ROOT.GetCountry.GetAdjective] authorities. What should we do?"
 trade_goods_flavour.54.a: "We have to get rid of this nuisance."
 trade_goods_flavour.54.b: "It needs to eat too."
 nemean_lion_hunt_tt: "In the off-chance of finding the elusive animal, there is a possibility our ruler may #R die#!."
 STATIC_MODIFIER_NAME_nemean_lion_hunted: "Nemean Lion Sighted"
 STATIC_MODIFIER_DESC_nemean_lion_hunted: "The Nemean Lion was sighted here, attacking cattle and travelers alike."
 trade_goods_flavour.55.t: "Nemean Lion Found"
 trade_goods_flavour.55.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] managed to find and kill the #high Nemean Lion#! - unbelievable! The beast was in the midst of attacking goats when [ROOT.GetCountry.GetGovernment.GetRuler.GetName] fired a couple of arrows deep into its haunches. When the animal tried to flee, a well-aimed arrow to its heart ended its reign of terror forever.\n\nThe locals are ecstatic, to put it mildly - they have been singing all night and praising [ROOT.GetCountry.GetGovernment.GetRuler.GetName] nonstop - the wine is flowing and the entire village near  [ShowLocationName('argos')] rejoices."
 trade_goods_flavour.55.a: "What a hunt!"
 trade_goods_flavour.56.t: "Nemean Lion Eluding Us"
 trade_goods_flavour.56.desc: "Although [ROOT.GetCountry.GetGovernment.GetRuler.GetName] tried desperately to track down the #high Nemean Lion#!, even managing to find the creature's den, the lion itself remained elusive, never revealing itself.\n\nEveryone is disappointed, but no more time can be spent chasing down the lion."
 trade_goods_flavour.56.a: "What a shame. We'll get it another time."
 trade_goods_flavour.57.t: "The Erymanthian Boar Sighted"
 #P:A TODO Approximate location: Imperator Kleonai (p:7894) mapped to neufchateau_luxembourg (shown as Mykene in the mod)
 trade_goods_flavour.57.desc: "We have heard disturbing reports that a gigantic boar has been seen near [ShowLocationName('neufchateau_luxembourg')], attacking the herds of the locals and goring horses with its tusks. Despite their best efforts, the locals have been unable to kill the monster and are asking [ROOT.GetCountry.GetCapital.GetName] for help."
 trade_goods_flavour.57.a: "We shall put an end to the Erymanthian menace"
 trade_goods_flavour.57.b: "It is not our place to destroy such a divine creature"
 STATIC_MODIFIER_NAME_erymanthian_boar_hunted: "Erymanthian Boar Hunted"
 trade_goods_flavour.58.t: "Erymanthian Boar Found"
 trade_goods_flavour.58.desc_1: "Disaster! [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has valiantly fought the animal, yet as soon as the animal had been tracked down, it was clear that it outclassed all our hunters had to give and barely anyone escaped with their life. Our [ROOT.GetCountry.GetGovernment.GetRulerTitle] will be buried with all honors."
 trade_goods_flavour.58.desc_2: "Tracking the hunted animal was easy, yet once it was found, it was not as easy prey as many thought and inflicted many wounds on the hunters. Thankfully, no one died and [ROOT.GetCountry.GetGovernment.GetRuler.GetName] can claim victory over the beast, yet were the wounds worth the hunt?"
 #P:A TODO Approximate location: Imperator Kleonai (p:7894) mapped to neufchateau_luxembourg (shown as Mykene in the mod)
 trade_goods_flavour.58.desc_3: "A story for the ages! [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has managed to track down and kill the feared #high Erymanthian Boar#! with an ease that has put the locals of [ShowLocationName('neufchateau_luxembourg')] to shame.\n\nImmediately upon arriving near the boar's vicinity, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] managed to coax the beast from the forest, dispatching it quickly with arrows.\n\nA giant pyre is now being constructed near Erymanthos so the boar can be barbequed, and [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has agreed to stay to enjoy the festivities."
 trade_goods_flavour.58.a: "The Erymanthian Boar is a harbinger of death!"
 trade_goods_flavour.59.t: "Erymanthian Boar Eluding Us"
 #P:A TODO Approximate location: Imperator Kleonai (p:7894) mapped to neufchateau_luxembourg (shown as Mykene in the mod)
 trade_goods_flavour.59.desc: "Curses! The #high Erymanthian Boar#! continues to wreak havoc all around [ShowLocationName('neufchateau_luxembourg')] but is too fast for our men to corner. Our horses are naturally terrified of the gigantic beast and refuse to get close enough to land a killing blow. Although everyone in Erymanthos is disappointed beyond words, the hunt had to be called off before victory was achieved."
 trade_goods_flavour.59.a: "Tell everyone that we will get it another time."
 trade_goods_flavour.60.t: "Healthy Population"
 trade_goods_flavour.60.desc: "We thought that you would be pleased to hear this, o [ROOT.GetCountry.GetGovernment.GetRuler.GetName]; although everyone knows that the [ROOT.GetCountry.GetAdjective] people are fond of their beer and meat, as of late, there has been a concerted effort by our citizens to eat more fruits and vegetables. Not only is produce delectable and nourishing, but we have such a surplus of fruits on hand that it only makes sense for our people to consume what they cannot sell in the market."
 trade_goods_flavour.60.a: "Hopefully, we'll see more of this."
 STATIC_MODIFIER_NAME_healthy_pops_pmod: "Healthy Population"
 STATIC_MODIFIER_DESC_healthy_pops_pmod: "The local population eats a healthy diet, aiding in their reproduction."
 trade_goods_flavour.61.t: "Healthy Population"
 trade_goods_flavour.61.desc: "We thought that you would be pleased to hear this, o [ROOT.GetCountry.GetGovernment.GetRuler.GetName]; although everyone knows that the [ROOT.GetCountry.GetAdjective] people are fond of their beer and meat, as of late, there has been a concerted effort by our citizens to eat more fruits and vegetables. Not only is produce delectable and nourishing, but we have such a surplus of fruits on hand that it only makes sense for our people to consume what they cannot sell in the market."
 trade_goods_flavour.61.a: "Hopefully, we'll see more of this."
 trade_goods_flavour.64.t: "Pomegranate Harvest Spoiled"
 trade_goods_flavour.64.desc: "Disaster has struck, my [ROOT.GetCountry.GetGovernment.GetRulerTitle]! The pomegranate harvest has been spoiled due to bad storing and only a few fruits remain edible. The nobles and priests have already started to voice their displeasure, desiring the noble fruit and demanding we import more from abroad. Should we cave to their demands and pay an exorbitant cost?"
 trade_goods_flavour.64.a: "We have to secure a supply from abroad."
 trade_goods_flavour.64.b: "There are more important matters at hand."
 STATIC_MODIFIER_NAME_pomegranates_spoiled: "Pomegranate Harvest Spoiled"
 STATIC_MODIFIER_DESC_pomegranates_spoiled: "The pomegranate harvest got spoiled, making the nobles unhappy."
 trade_goods_flavour.65.t: "Pomegranate Harvest Surplus"
 trade_goods_flavour.65.desc: "My [ROOT.GetCountry.GetGovernment.GetRulerTitle], incredible news from our fields: the pomegranate harvest is significantly exceeding expectations. With this surplus, we are sure to make a tidy profit, should we not use the fruits ourselves."
 trade_goods_flavour.65.a: "We will eat it all."
 trade_goods_flavour.65.b: "We should sell them."
 STATIC_MODIFIER_NAME_pomegranates_surplus: "Pomegranate Surplus"
 STATIC_MODIFIER_DESC_pomegranates_surplus: "There are a lot of pomegranates; the nobles can gorge themselves to their heart's content."
 trade_goods_flavour.66.t: "Onion Harvest Surplus"
 trade_goods_flavour.66.desc: "My [ROOT.GetCountry.GetGovernment.GetRulerTitle], incredible news from our fields: the onion harvest is significantly exceeding expectations. With this surplus, we are sure to make a tidy profit, should we not use the fruits ourselves. At least, no one will starve this year."
 trade_goods_flavour.66.a: "We will eat it all."
 trade_goods_flavour.66.b: "We should sell them."
 STATIC_MODIFIER_NAME_onions_surplus: "Onion Surplus"
 STATIC_MODIFIER_DESC_onions_surplus: "There are more than enough onions; no common man is hungering now."
 trade_goods_flavour.67.t: "Small Onion Harvest"
 trade_goods_flavour.67.desc: "Disaster has struck, my [ROOT.GetCountry.GetGovernment.GetRulerTitle]! The onion harvest has turned out significantly smaller than expected and the peasants have started to grumble and protest. Should we not find a solution, we might have no support from the people and an increase in rebelliousness."
 trade_goods_flavour.67.a: "We have to secure a supply from abroad."
 trade_goods_flavour.67.b: "There are more important matters at hand."
 trade_goods_flavour.67.c: "Turn the remaining onions into a hat!"
 STATIC_MODIFIER_NAME_onions_lack: "Small Onion Harvest"
 STATIC_MODIFIER_DESC_onions_lack: "There aren't enough onions in the realm to feed everyone properly..."
 trade_goods_flavour.68.t: "Cattle Escaping"
 trade_goods_flavour.68.desc: "Terrible news from [cattle_farm_scope.GetName] - it seems that one of the stablehands forgot to close the gate before falling asleep, and when the idiot woke up, every single cattle on the farm had escaped - there's no doubt the animals have made it to the badlands by this point. A total loss!"
 trade_goods_flavour.68.a: "We have to catch at least a few."
 trade_goods_flavour.68.b: "Gone is gone."
 cattle_capture_again_tt: "A part of the cattle were captured again."
 cattle_escaped_tt: "With no cattle left, it will take years until there will be new shepherds with flocks in [cattle_farm_scope.GetName]. The modifier duration will be #R extended#! by another #Y 10#! years."
 STATIC_MODIFIER_NAME_cattle_escaped: "Cattle Escaped"
 STATIC_MODIFIER_DESC_cattle_escaped: "Cattle escaped local farms, reducing productivity significantly."
 trade_goods_flavour.73.t: "Dye Transporter Sunk"
 trade_goods_flavour.73.desc: "Terrible news from [dye_shipwreck.GetName] - after a storm rolled through the region, our ships that were transporting dye all sank, and with them, our hopes for making a profit this season."
 trade_goods_flavour.73.a: "What a waste of dyes...and life, I suppose"
 STATIC_MODIFIER_NAME_dye_shipwreck_pmod: "Dye Transporter Sunk in Port"
 trade_goods_flavour.74.t: "Dye Trade Boom"
 trade_goods_flavour.74.desc: "We will not disturb you with too many details today, [ROOT.GetCountry.GetGovernment.GetRuler.GetName], but suffice it to say, we are doing exceptionally well with the dye trade. Merchants are traveling from all over to visit our markets, for our product is clearly better than anything that is made for one thousand miles in any direction."
 trade_goods_flavour.74.a: "A good development."
 STATIC_MODIFIER_NAME_dye_trade_well: "Dye Trade Boom"
 STATIC_MODIFIER_DESC_dye_trade_well: "The dye trade is doing very well."
 trade_goods_flavour.75.t: "Dyeing Accident"
 trade_goods_flavour.75.desc: "There is a nobleman living in [ROOT.GetCountry.GetCapital.GetName] that has been making a fuss about an order of clothing that he had asked be dyed. Even though he was very specific as to what colors he desired, the dyeworkers 'ruined' some linen tunics by not staining them a deep purple.\n\nThe nobleman refuses to let the matter drop, and insists that because the state has funded the dye production initiative, the people of [ROOT.GetCountry.GetName] should be responsible for paying for a new tunic."
 trade_goods_flavour.75.a: "What a shame. It still looks nice though."
 trade_goods_flavour.75.b: "We shall compensate him."
 STATIC_MODIFIER_NAME_dye_accident_pmod: "Dyeing Accident"
 STATIC_MODIFIER_DESC_dye_accident_pmod: "A dyeing accident here made some unsavory headlines."
 trade_goods_flavour.76.t: "Spice Export"
 trade_goods_flavour.76.desc: "Lately, it has been suggested in [ROOT.GetCountry.GetCapital.GetName] that we try to plant some spices locally instead of always paying a premium to have them imported. What do you think, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]? It might cost a little upfront, but if this works out, we stand to benefit!"
 trade_goods_flavour.76.a: "We shall try it."
 trade_goods_flavour.76.b: "It is too expensive."
 trade_goods_flavour.77.t: "Spice Export:Growth"
 trade_goods_flavour.77.desc_1: "Tremendous news! Not only are the spices that we planted in one of our provinces growing, but the first harvests are in, and the locals are saying that our varieties are more fragrant and pungent than those we pay to import.\n\nBefore long, the markets in [ROOT.GetCountry.GetCapital.GetName] will be filled with good [ROOT.GetCountry.GetAdjective] spice for sale."
 trade_goods_flavour.77.desc_2: "Well, our efforts to grow spices in our own country have failed spectacularly, but at least we can console ourselves with the knowledge that we tried."
 trade_goods_flavour.77.a: "It worked! I am a genius!"
 trade_goods_flavour.77.b: "It was worth a try"
 trade_goods_flavour.78.t: "Myrrh Trees"
 trade_goods_flavour.78.desc: "It has been proposed that we plant some myrrh trees locally, in an effort to cut down on the expenses paid importing this valuable incense. We have the location in mind, and the workers are ready to break ground if [ROOT.GetCountry.GetGovernment.GetRuler.GetName] gives the word."
 trade_goods_flavour.78.a: "We shall do it."
 trade_goods_flavour.78.b: "It is too expensive."
 trade_goods_flavour.79.t: "Incense Bushes"
 trade_goods_flavour.79.desc: "It has been suggested to [ROOT.GetCountry.GetGovernment.GetRuler.GetName] that [ROOT.GetCountry.GetName] could make more money if we pursue the sales of incense, which everyone loves and needs for religious purposes. We have bushes that are local to our region that produce a sweet-smelling tar, and when the flowers are dried and prepared into a potpourri, the smell is quite delightful. Should we undertake a massive initiative to start growing incense bushes, with hopes for sale?"
 trade_goods_flavour.79.a: "We shall do it."
 trade_goods_flavour.79.b: "It is too expensive."
 trade_goods_flavour.80.t: "Spices Grow Rare"
 trade_goods_flavour.80.desc: "The flavors that our people have grown accustomed to tasting are becoming rarer and rarer these days, much to the chagrin of [ROOT.GetCountry.GetGovernment.GetRuler.GetName], whose breath is usually scented with the spices of distant kingdoms.\n\nAs cardamom pods and black pepper begin to disappear from the markets, everyone is crying out for [ROOT.GetCountry.GetName] to do something, anything, to restock the supplies - no matter what the cost."
 trade_goods_flavour.80.a: "We let nature steer the course."
 trade_goods_flavour.80.b: "We have to procure some from our neighbors."
 STATIC_MODIFIER_NAME_merchant_spices_rare: "Spices are Rare"
 STATIC_MODIFIER_DESC_merchant_spices_rare: "Spices are rare, increasing their price and making the higher strata of society unhappy."
 trade_goods_flavour.81.t: "Salt Shortage"
 trade_goods_flavour.81.desc: "We have a slow-moving crisis on our hands that could turn into a disaster if we aren't careful. We are hearing that supplies of salt are unusually low, and without this all-important resource, flavoring our food will be the least of our worries - we won't be able to cure any meats!"
 trade_goods_flavour.81.a: "We cannot change anything."
 trade_goods_flavour.81.b: "We have to procure some from our neighbors."
 STATIC_MODIFIER_NAME_salt_rare_in_realm: "Salt Rare In Realm"
 trade_goods_flavour.82.t: "Assyrian Qunabu"
 trade_goods_flavour.82.desc: "We have heard rumors of a mysterious substance known as 'qunabu' that the Assyrians use in their temple ceremonies - it is said that those who partake of the dank clouds produced by burning this hemp commune with the gods, oftentimes laughing all the while, and then they are seized by a ferocious appetite that can only be satisfied by seeking sweets like honey cakes.\n\nWe could use qunabu in our own religious ceremonies, but we have to have the approval of [ROOT.GetCountry.GetGovernment.GetRuler.GetName] before we do anything."
 trade_goods_flavour.82.a: "I think I know a guy who can get some for us"
 trade_goods_flavour.82.b: "Just say no..."
 STATIC_MODIFIER_NAME_cannabis_accepted: "Cannabis Usage"
 STATIC_MODIFIER_DESC_cannabis_accepted: "In this country, Qunabu is used for religious ceremonies."
 STATIC_MODIFIER_NAME_cannabis_refused: "Cannabis Usage Discontinued"
 STATIC_MODIFIER_DESC_cannabis_refused: "In this country, Qunabu is frowned upon."
 trade_goods_flavour.83.t: "A New Seam"
 trade_goods_flavour.83.desc: "Our workers report a happy discovery - a new seam of valuable mineral wealth, waiting to be taken from the ground in [mining_target.GetName]. Initial reports are a little light on details, but it seems that this could be the largest vein ever discovered in [ROOT.GetCountry.GetAdjective] history - truly an impressive amount."
 trade_goods_flavour.83.a: "We must excavate this new wealth."
 trade_goods_flavour.83.b: "It is simply not worth it."
 trade_goods_flavour.84.t: "A Seam Depleted"
 trade_goods_flavour.84.desc: "We hear that [mining_target.GetName] has been stripped of its valuable mineral wealth, but we still have a great number of slaves and laborers that are still in the region. Instead of dispersing them or sending them home, it has been suggested that we find something productive to do in the region; an assessment that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has endorsed."
 trade_goods_flavour.84.f: "We will have to content ourselves with some stones.."
 diadochi_liberation.2002.t: "[flipping_subject.GetName] Under [subject_flipper.GetAdjective] Occupation"
 diadochi_liberation.2002.desc: "[flipping_subject.GetName] resisted as long as they could, but [subject_flipper.GetName] has taken [flipping_subject.GetCapital.GetName]. There is now division among the [flipping_subject.GetAdjective] elite, some have declared their support for the [subject_flipper.GetAdjective] cause, while others hope that [current_overlord.GetName] will relieve the [subject_flipper.GetAdjective] occupation before it is too late."
 diadochi_liberation.2002.a: "We must act quickly to prevent defection."
 diadochi_liberation.2003.t: "The Fate of [flipping_subject.GetName]"
 diadochi_liberation.2003.desc: "Loyalists to [current_overlord.GetName] have held out as long as they can, but no relief has come. With [subject_flipper.GetName] in control of [flipping_subject.GetCapital.GetName], some now argue that continued resistance is futile. Perhaps the time has come to support the [subject_flipper.GetAdjective] cause."
 #P:A Invictus text had [subject_flipper.GetRulerTitle.GetName] for the ruler's name (a source typo); the ruler's name is used
 diadochi_liberation.2003.a: "Hail [subject_flipper.GetGovernment.GetRulerTitle] [subject_flipper.GetGovernment.GetRuler.GetName]!"
 diadochi_liberation.2003.at: "We will #G join#! all of [subject_flipper.GetName]'s current wars."
 diadochi_liberation.2003.b: "We will hold out a little longer."
 diadochi_liberation.2004.t: "[flipping_subject.GetName] Joins Us"
 diadochi_liberation.2004.desc: "With no aid from [current_overlord.GetName], [current_overlord.GetAdjective] loyalists have been forced to capitulate. After holding out for months, [flipping_subject.GetName] has declared for [subject_flipper.GetName]."
 diadochi_liberation.2004.a: "They have made the right choice."
 diadochi_liberation.2005.t: "[flipping_subject.GetName] Defects"
 diadochi_liberation.2005.desc: "With no aid from [current_overlord.GetName], [current_overlord.GetAdjective] loyalists have been forced to capitulate. After holding out for months, [flipping_subject.GetName] has declared for [subject_flipper.GetName]."
 diadochi_liberation.2005.a: "Damn those traitors."
 diadochi_liberation.2006.t: "[flipping_subject.GetName] Falls Under [subject_flipper.GetAdjective] Occupation"
 diadochi_liberation.2006.desc: "We held out for as long as we could, but the streets of [flipping_subject.GetCapital.GetName] now echo with the tramp of [subject_flipper.GetAdjective] soldiers. Among our own elite, some have bent the knee to [subject_flipper.GetGovernment.GetRuler.GetShortName], seeking advantage under [subject_flipper.GetGovernment.GetRuler.GetHerHis] rule. Others, however, bide their time in secret, placing their hopes in [current_overlord.GetName] to drive the [subject_flipper.GetAdjective]s from [flipping_subject.GetCapital.GetName] and restore our independence."
 diadochi_liberation.2006.a: "We will endure until liberation comes."
 diadochi_liberation.2007.t: "[flipping_subject.GetName] Falls Under [subject_flipper.GetAdjective] Occupation"
 diadochi_liberation.2007.desc: "The [flipping_subject.GetAdjective]s resisted as long as they could, but now [subject_flipper.GetAdjective] troops walk the streets of [flipping_subject.GetCapital.GetName]. Certain members of the [flipping_subject.GetAdjective] elite have declared their support for the [subject_flipper.GetAdjective] cause, eager to secure favor under the new regime. However, others plot quietly in the shadows, hoping that [current_overlord.GetName] will one day drive the [subject_flipper.GetAdjective]s from the city and entrust its rule to loyal hands."
 diadochi_liberation.2007.a: "At last, [flipping_subject.GetCapital.GetName] recognizes our might."
 diadochi_liberation.2007.b: "[flipping_subject.GetName] should have surrendered when it had the chance."
 diadochi_liberation.2007.c: "We will deal with [flipping_subject.GetName] once the [current_overlord.GetAdjective]s have been defeated."
 diadochi_liberation.2007.ct: "#T Nothing happens#!"
 diadochi_liberation.2008.t: "[flipping_subject.GetName] Falls to [subject_flipper.GetAdjective] Forces"
 diadochi_liberation.2008.desc: "The [flipping_subject.GetAdjective]s resisted as long as they could, but now [subject_flipper.GetAdjective] troops walk the streets of [flipping_subject.GetCapital.GetName]. Collaborators amongst the [flipping_subject.GetAdjective]s now find themselves in control of [flipping_subject.GetName]. However, their opponents plot quietly in the shadows, hoping that [current_overlord.GetName] will one day return to drive the [subject_flipper.GetAdjective]s from [flipping_subject.GetCapital.GetName]."
 diadochi_liberation.2008.a: "How could this happen?"
 diadochi_liberation.2008.b: "Better to have [subject_flipper.GetGovernment.GetRuler.GetShortName] as a friend than an enemy."
 diadochi_liberation.2008.c: "Interesting..."
 diadochi_liberation.1.t: "Liberation of Corinth"
 #P:A TODO Imperator named character 9 (Antipatros) through GetCharacter; character ids differ, so his name is written out
 diadochi_liberation.1.desc: "[ShowLocationName('corinth')] used to be one of the greatest of the city-states of Greece, standing at the border between Attica and the Peloponnese. When the other city-states banded into leagues and alliances to fight one another, Corinth stubbornly stuck to its independence. During the wars of the Diadochi, the ancient city-state was turned into little more than a glorified fortification for the Macedonian troops, becoming the most strategic defensive position in the region.\n\nOur struggle with Antipatros' descendants for control of Greece continues, but we have at last cast out the Macedonian garrison from the city of [ShowLocationName('corinth')] and our troops now march through its streets.\n\nLiberating the city is certainly a possibility, but keeping a force on the Akrokorinthos, just temporarily of course, may be too valuable an opportunity to pass up..."
 diadochi_liberation.1.a: "[ShowLocationName('corinth')] must be garrisoned."
 diadochi_liberation.1.a.t: "Every #Y $greek_group$#! country in mainland [pa_corinth.GetArea.GetRegion.GetName] will lose #R -15#! Opinion of us."
 diadochi_liberation.1.b: "We will keep a light presence in [ShowLocationName('corinth')]"
 diadochi_liberation.1.bt: "#Y $CORINTH_NAME$#! will be released as a #Y Feudatory#! subject."
 diadochi_liberation.1.c: "The Corinthians have suffered occupation too long."
 diadochi_liberation.1.ct: "#Y $CORINTH_NAME$#! will be released as a #Y Tributary#! subject."
 diadochi_liberation.1.c.t2: "Every #Y $greek_group$#! country in mainland [pa_corinth.GetArea.GetRegion.GetName] will gain #G 15#! Opinion of us."
 diadochi_liberation.1.d: "[ShowLocationName('corinth')] has a nice ring to it..."
 diadochi_liberation.1.dt: "#Y We will tag switch over to#! #high #G Corinth#!#!."
 CORINTH_NAME: "Corinth"
 macedonian_garrisons_bad: "Macedonian Garrisons"
 macedonian_garrisons_good: "Macedonian Garrisons Removed"
 diadochi_liberation.2.t: "Liberation of Chalkis"
 #P:A TODO Imperator named character 37 (Antigonos) through GetCharacter; character ids differ, so his name is written out
 diadochi_liberation.2.desc: "[ShowLocationName('negroponte')] was once the most powerful state in Euboea. In the 8th and 7th centuries BCE, colonists from Chalkis founded thirty townships on the peninsula of Chalkidike and several important cities in Magna Graecia and Sicily, such as Naxos, Rhegion, Zankle and Cumae. [ShowLocationName('negroponte')] commands the Euripus strait which separates the island of Euboea from mainland Greece, a channel so narrow that only one ship may pass at a time. Garrisoned and heavily fortified by the Antigonids for its strategic value, it would eventually come to be known as one of the three 'Fetters of Greece' - fortresses that were garrisoned by the Diadochi to keep the Greek city-states in check.\n\nOur struggle with Antigonos' line for the corpse of Alexandros's empire continues, but we have at last cast out their garrison from [ShowLocationName('negroponte')] and our troops now march through its streets.\n\nLiberating the city is certainly a possibility, but keeping a force along the Euripus, just temporarily of course, may be too valuable an opportunity to pass up..."
 diadochi_liberation.2.a: "[ShowLocationName('negroponte')] must be heavily garrisoned."
 diadochi_liberation.2.a.t: "Every #Y $greek_group$#! country in mainland [pa_corinth.GetArea.GetRegion.GetName] will lose #R -15#! Opinion of us."
 diadochi_liberation.2.b: "We will keep a light presence in [ShowLocationName('negroponte')]"
