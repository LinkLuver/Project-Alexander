 trade_goods_flavour.49.desc: "A lion has been seen within a few days of [ROOT.GetCountry.GetCapital.GetName], suitable for a grand hunt. It would surely be a mighty display of royal grandeur and strength, bringing down such a magnificent animal specimen of the king of the animals. \nOnly the strongest and savviest hunters are able to survive an encounter with such an animal - is [ROOT.GetCountry.GetGovernment.GetRuler.GetName] one of them?"
