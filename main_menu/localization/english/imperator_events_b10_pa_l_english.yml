l_english:
 # Imperator (Invictus / Terra Indomita) event import, batch b10 (2026-10-06)

 # ba_trade_goods_flavour.txt
 trade_goods_flavour.4.t: "Big Bones Found"
 trade_goods_flavour.4.desc: "We have a curious tale to share with you, [ROOT.GetCountry.GetGovernment.GetRuler.GetName], one that is making the rounds in [ROOT.GetCountry.GetCapital.GetName] and tickling the ears of anyone who stops to listen.\n\nSome workers had been excavating copper and other metals in the mountains, when gigantic bones, larger than any we have ever seen, were discovered. Although the men were scared, they continued digging and managed to find an enormous skull - to what fearsome beast did these bones belong to? Were there monsters or dragons in this country long ago?\n\nAs entertaining as this story is, we should probably step in at some point."
 trade_goods_flavour.4.a: "Maybe there are more? Tell the men to continue to dig."
 trade_goods_flavour.4.b: "Sell the bones! We will make something from this."
 trade_goods_flavour.4.c: "It is a waste of time to even talk about this."
 trade_goods_flavour.5.t: "Big Bones Excavation Results"
 trade_goods_flavour.5.desc: "After a few weeks of backbreaking work toiling under the harsh [ROOT.GetCountry.GetAdjective] sun, our workers have announced that they have discovered the entire skeleton of a magnificent beast - perhaps the bones of a dead god? Our wisest minds are puzzled by the discovery and sheepishly admit they have no idea what it is that we are looking at.\n\nNot as exciting as discovering precious metals, but still, this is an interesting moment."
 trade_goods_flavour.5.a: "Interesting..."
 trade_goods_flavour.5.b: "What a waste of time and money..."
 trade_goods_flavour.10.t: "Wondrous Silphium"
 trade_goods_flavour.10.desc: "Truly, the plant #high silphium#! is a wondrous thing indeed  - it can be used to stimulate appetites, adding seasoning to dishes, and can also increase one's sexual desires and stamina while preventing unwanted children. As if this wasn't enough, silphium can also be used in medications...we don't think there is anything that this miraculous plant cannot do.\n\nWe have plenty of the stuff, but now we need to figure out what to do with it."
 trade_goods_flavour.10.a: "Let's use it ourselves."
 trade_goods_flavour.10.b: "We shall leave it as is."
 trade_goods_flavour.10.c: "Sell more!"
 STATIC_MODIFIER_NAME_silphium_used: "Increased Silphium Usage"
 STATIC_MODIFIER_DESC_silphium_used: "Silphium is being used more than it is sold in this country..."
 STATIC_MODIFIER_NAME_silphium_sold: "Increased Silphium Trade"
 STATIC_MODIFIER_DESC_silphium_sold: "Silphium is being sold more than it is used in this country..."
 trade_goods_flavour.11.t: "Silphium is a Great Spice"
 trade_goods_flavour.11.desc: "Today is a day to celebrate our recent successes. Our master cook made some marvelous dishes, all smelling better than the others. Just before the serving, he approaches us and asks us which dish should be supplemented by the rare and valuable silphium. Should it be the main course or maybe should a dessert be made? Or a snack for after the prayers?"
 trade_goods_flavour.11.a: "The roast sounds nice."
 trade_goods_flavour.11.b: "A soup sounds delectable."
 trade_goods_flavour.11.c: "I want something sweet..."
 trade_goods_flavour.11.d: "Just something small, I need to go to the temple afterwards."
 STATIC_MODIFIER_NAME_silphium_roast: "Roast with Silphium"
 STATIC_MODIFIER_DESC_silphium_roast: "Ate a roast with silphium."
 STATIC_MODIFIER_NAME_silphium_soup: "Soup with Silphium"
 STATIC_MODIFIER_DESC_silphium_soup: "Ate a soup with silphium."
 STATIC_MODIFIER_NAME_silphium_snack: "Snack with Silphium"
 STATIC_MODIFIER_DESC_silphium_snack: "Ate a snack with silphium."
 STATIC_MODIFIER_NAME_silphium_dessert: "Dessert with Silphium"
 STATIC_MODIFIER_DESC_silphium_dessert: "Ate a dessert with silphium."
 trade_goods_flavour.12.t: "Silphium is Medicine"
 trade_goods_flavour.12.desc: "The increased consumption of #high Silphium#! has made the royal couple more resilient to diseases. The recent minor ailments that befell them have disappeared. Truly, silphium is a wondrous plant."
 trade_goods_flavour.12.a: "What a useful plant."
 silphium_healing_tt: "The Silphium usage has increased the body's resistance to maladies."
 trade_goods_flavour.13.t: "Silphium Farming"
 trade_goods_flavour.13.desc: "In [silphium_farm.GetName] some farmers have begun to systematically exploit #high Silphium#!. So far, they have been very successful and the wondrous plant grow successfully in most areas; only in the areas too close to the ocean or too close to the desert it refuses to frow. \nThis success begs the question: should we expand the operations or try to establish more farms absed on this one?"
 trade_goods_flavour.13.a: "Expand the farm."
 trade_goods_flavour.13.b: "We should spread the plant."
 trade_goods_flavour.13.c: "We shouldn't overexploit the area."
 STATIC_MODIFIER_NAME_silphium_farm_pmod: "Silphium Farm"
 STATIC_MODIFIER_DESC_silphium_farm_pmod: "Here is a farm dedicated to Silphium."
 trade_goods_flavour.15.t: "Cedar Planks"
 trade_goods_flavour.15.desc: "An abundance of #high Cedar#! trees has made good ships much more common, now composing a large part of our fleet. Their wood is better suited for shipwrighting than others due to its natural defenses against rot and it being easy to work."
 trade_goods_flavour.15.a: "A nice turn of events."
 STATIC_MODIFIER_NAME_cedar_planks: "Cedar Planks"
 STATIC_MODIFIER_DESC_cedar_planks: "Planks made out of cedars, a wood that is very well-suited for shipmaking."
 trade_goods_flavour.16.t: "Cedar Ships"
 trade_goods_flavour.16.desc: "The shortage of #high Cedar#! trees has made good ships much more less common, now only composing a small part of our fleet. Their superior wood is now missing for repairs and new ships. Hopefully, we will be able to find new sources soon."
 trade_goods_flavour.16.a: "Disaster!"
 trade_goods_flavour.17.t: "Exploitation of the Cedar"
 trade_goods_flavour.17.desc: "The wood of the cedar trees is useful for many tasks, but chief among them is the making of ships, their planks being ideal. Now recently there has been dissent in court as to how to approach the usage and exploitation of the trees. Some suggest an increase in felling trees to make a greater fleet as soon as possible, hoping to create an edge against rivals. Others support this general idea, but are more cautious and prioritise a long-term sustainability of the navy. Not to be forgotten are the nobles in support of more peaceful approaches with our neighbors; they seem to either fear a reaction by our rivals if we build a large fleet - or maybe they just would prefer to dominate the trade as is."
 trade_goods_flavour.17.a: "We need the wood now."
 trade_goods_flavour.17.b: "Keep some for regrowth."
 trade_goods_flavour.17.c: "We shouldn't increase our usage."
 STATIC_MODIFIER_NAME_cedar_used_up: "Exploiting Cedar Forest"
 STATIC_MODIFIER_DESC_cedar_used_up: "A Cedar Forest is being exploited beyond it's capacity for regenerationfor a short-term gain."
 STATIC_MODIFIER_NAME_exploited_cedar: "Exploited Cedar Forest"
 STATIC_MODIFIER_DESC_exploited_cedar: "This Cedar Forest is being exploited beyond it's capacity for regeneration. Maybe some day it forest will grow back..."
 trade_goods_flavour.18.t: "Cedar Regrowing"
 trade_goods_flavour.18.desc: "Some cedars have been seen sprouting in [cedar_regrown.GetName] again. After all the trees have been felled years ago, no one expected to see the vigorous trees in the area again. Surely, the Gods must favor us."
 trade_goods_flavour.18.a: "This is good news."
 trade_goods_flavour.19.t: "A Grand Shipyard"
 trade_goods_flavour.19.desc: "For many years now, we have been building ships. One of our biggest shipyards is [main_shipyard_prov.GetName] where countless vessels have been constructed. Recently, the shipyards and port have been expanded to accommodate the ever-growing demand of ships our traders and navy. An envoy from [main_shipyard_prov.GetName] has reached us, asking if the new expansion of the grand shipyard should be used to churn out as many ships as possible, or if attention to detail should be afforded when creating every ship, making them better vessels on the seas against pirates and enemies alike."
 trade_goods_flavour.19.a: "Make as many ships as possible."
 trade_goods_flavour.19.b: "A better ship is worth its time."
 STATIC_MODIFIER_NAME_quality_shipyard: "Great Shipyard"
 STATIC_MODIFIER_DESC_quality_shipyard: "A great shipyard, dedicated to makinhg the best ships."
 STATIC_MODIFIER_NAME_quantity_shipyard: "Great Shipyard"
 STATIC_MODIFIER_DESC_quantity_shipyard: "A great shipyard, dedicated to making as many ships as possible."
 trade_goods_flavour.20.t: "An Abundance of Wood"
 trade_goods_flavour.20.desc: "Our great navy is getting expanded every year with the abundance of wood in our realm. This increase in expertise and available resources has made the creation and repair of ships easier, faster and cheaper than ever before. As long as we can sustain this wood usage, we are sure to be a force to be reckoned with on the sea."
 trade_goods_flavour.20.a: "[ROOT.GetCountry.GetName] will rule the waves."
 STATIC_MODIFIER_NAME_wood_surplus_navy_cmod: "Abundant Wood Reserves"
 STATIC_MODIFIER_DESC_wood_surplus_navy_cmod: "You have enough wood to sustaina fleet for a long time."
 trade_goods_flavour.21.t: "A Lack of Wood"
 trade_goods_flavour.21.desc: "With the recent losses of forests and woodlands to man and nature alike, our past rigourous way of keeping our navy in an impeccable state is no longer possible, the resources lacking. Should we acquire new forested areas we might be able to reinstate the country-wide program."
 trade_goods_flavour.21.a: "We have to rectify this shortage."
 trade_goods_flavour.22.t: "A Forest Cut Down"
 trade_goods_flavour.22.desc: "The steady increase of inhabitants in [wood_city_scope.GetName] has led to trees becoming a rare sight in the area, used up for construction and export. While there are still some trees here and there, this area is no longer able to sustain itself from the export of wood. At least, new avenues for the local population have been found."
 trade_goods_flavour.22.a: "We hope that we won't come to regret this."
 trade_goods_flavour.29.t: "Wine Culture"
 trade_goods_flavour.29.desc: "The divine drink fermented from grapes has become wide-spread and popular in [wine_city_scope.GetName], every inhabitant having tasted it at least once. It has become common-place for workers to sit together in taverns in the evening, a glass of the cool drink in front of them, discussing current events and their life. Wine has become a way of life here."
 trade_goods_flavour.29.a: "We shall support it."
 trade_goods_flavour.29.b: "It will die down in time."
 STATIC_MODIFIER_NAME_wine_culture: "Wine Culture"
 STATIC_MODIFIER_DESC_wine_culture: "The locals prefer drinking some wine instead of going to war."
 trade_goods_flavour.30.t: "Religious Innovation: Censers"
 trade_goods_flavour.30.desc: "Since #high Myrrh#! and #high Incense#! have become commonly used in our temples and ceremonies, some have found a new way of dispersing the heavenly scents. Using a device called the 'censer', the scents can be spread much easier and faster than using a plate."
 trade_goods_flavour.30.a: "Marvelous."
 trade_goods_flavour.31.t: "Honorary Censer-Bearer"
 trade_goods_flavour.31.desc: "With the rise of the censer, the high priest [censer_bearer_scope.GetName] has claimed that [censer_bearer_scope.GetSheHe] is the only one who should be allowed using the censer for royal ceremonies and state events. Some family members of [ROOT.GetCountry.GetGovernment.GetRuler.GetName] are indigned, especially [family_censer_bearer_scope.GetName] is claiming that as relatives of the royal house, they too have the right to bear the censer. \nIn any case, whoever we chose as our honorary censer-bearer, there can only be one."
 trade_goods_flavour.31.a: "The highpriest is the only legitimate choice."
 trade_goods_flavour.31.b: "Someone from the royal family makes the most sense."
 STATIC_MODIFIER_NAME_censer_bearer_char_mod: "Royal Censer-Bearer"
 trade_goods_flavour.32.t: "Spreading Incense Trees"
 trade_goods_flavour.32.desc: "In some of our holdings some young incense trees have sprouted. One of our advisors suggested planting some young trees in [incense_spread_scope.GetName], claiming that the increased production will greatly benefit our trade. Alternatively, we could simply sell the surplus of young saplings - someone else might find them useful."
 trade_goods_flavour.32.a: "Do it."
 trade_goods_flavour.32.b: "Sell the surplus."
 trade_goods_flavour.33.t: "Spreading Myrrh Bushes"
 trade_goods_flavour.33.desc: "In some of our holdings some young myrrh bushes have sprouted. One of our advisors suggested planting some young bushes in [myrrh_spread_scope.GetName], claiming that the increased production will greatly benefit our trade. Alternatively, we could simply sell the surplus of young saplings - someone else might find them useful."
 trade_goods_flavour.33.a: "Do it."
 trade_goods_flavour.33.b: "Sell the surplus."
 trade_goods_flavour.39.t: "Magnificent Carving"
 trade_goods_flavour.39.desc: "An ivory carver, master of his craft, approached us and gifted the royal family a magnificent statuette carved from the purest ivory. The many details he carved show the care and love he has for his art and the divine. It is a most impressive piece, yet we have to decide what we should do with it; displaying it in the throne room would surely impress visitors, yet we could also gift it to a temple, for it is a representation of a deity.\n\nShould we have to, we could also sell it, although the carver will surely not appreciate this act..."
 trade_goods_flavour.39.a: "Sell the item."
 trade_goods_flavour.39.b: "Display it in the palace."
 trade_goods_flavour.39.c: "Gift it to a temple."
 STATIC_MODIFIER_NAME_magnificent_carving: "Magnificent Carving"
 STATIC_MODIFIER_DESC_magnificent_carving: "An elephant tusk carved by a master, impressing foreign dignitaries."
 trade_goods_flavour.40.t: "An Ivory Throne"
 trade_goods_flavour.40.desc: "A master carver has approached us, offering to make us a magnificent throne, every inch covered in carvings of our rule and kingdom. Instead of keeping the throne for ourselves, we could also offer it to our heir or the high priest... \nThe price the artisan requests is quite steep however, so we should think twice before accepting his offer."
 trade_goods_flavour.40.a: "No one will question my authority."
 trade_goods_flavour.40.b: "The high priest will surely be grateful for it."
 trade_goods_flavour.40.c: "A smaller one cannot hurt..."
 trade_goods_flavour.40.d: "Sadly, we cannot afford this at this moment."
 small_ivory_throne_tt: "We already have a throne for our king."
 STATIC_MODIFIER_NAME_ivory_throne_cmod: "Ivory Throne"
 STATIC_MODIFIER_DESC_ivory_throne_cmod: "A throne made out of ivory, impressing friends and foes alike. The ruling authority will NOT be questioned."
 STATIC_MODIFIER_NAME_ivory_throne_small_cmod: "Small Ivory Throne"
 STATIC_MODIFIER_DESC_ivory_throne_small_cmod: "A small throne made out of ivory, perfect for the heir to start learning..."
 trade_goods_flavour.41.t: "Elephant Hunt"
 trade_goods_flavour.41.desc: "An elephant bull has been seen within a few days of [ROOT.GetCountry.GetCapital.GetName], suitable for a grand elephant hunt. It would surely be a mighty display of royal grandeur and strength, bringing down such a magnificent giant. \nOnly the strongest and savviest hunters are able to survive such a hunt after one of the most dangerous of animals - is [ROOT.GetCountry.GetGovernment.GetRuler.GetName] one of them?"
 trade_goods_flavour.41.a: "After the animal!"
 trade_goods_flavour.41.b: "It is too dangerous."
 # Imperator "Martial" is the EU5 Military skill; @military_icon! dropped
 hunt_help_tt: "A high #Y Military#! stat will be advantageous. \nThe #R lower#! it is, the higher the risk of being #R wounded#! or even #R dying#!!"
 trade_goods_flavour.42.t: "Elephant Hunt"
 trade_goods_flavour.42.desc_1: "Disaster! [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has valiantly fought the animal, yet as soon as the animal had been tracked down, it was clear that it outclassed all our hunters had to give and barely anyone escaped with their life. Our [ROOT.GetCountry.GetGovernment.GetRulerTitle] will be buried with all honors."
 trade_goods_flavour.42.desc_2: "Tracking the hunted animal was easy, yet once it was found, it was not as easy prey as many thought and inflicted many wounds on the hunters. Thankfully, no one died and [ROOT.GetCountry.GetGovernment.GetRuler.GetName] can claim victory over the beast, yet were the wounds worth the hunt?"
 trade_goods_flavour.42.desc_3: "Victory my [ROOT.GetCountry.GetGovernment.GetRulerTitle]! From tracking the animal down to ending its life, the gods were on our side all of the time. The hunt had no accidents and only a few participants were wounded lightly. It was a great and exhilarating day!"
 trade_goods_flavour.42.a: "This is all a part of [ROOT.GetCountry.GetAdjective] life..."
 trade_goods_flavour.42.b: "It was the right decision."
 STATIC_MODIFIER_NAME_successful_hunt: "Successful Hunt"
 STATIC_MODIFIER_DESC_successful_hunt: "You carried out a hunt successfully."
 trade_goods_flavour.43.t: "Stag Hunt"
 trade_goods_flavour.43.desc: "A stag has been seen within a few days of [ROOT.GetCountry.GetCapital.GetName], suitable for a grand hunt. It would surely be a mighty display of royal grandeur and strength, bringing down such a magnificent animal. \nOnly the strongest and savviest hunters are able to hunt such an animal without earning a wound - is [ROOT.GetCountry.GetGovernment.GetRuler.GetName] one of them?"
 trade_goods_flavour.43.a: "After the animal!"
 trade_goods_flavour.43.b: "It is too dangerous."
