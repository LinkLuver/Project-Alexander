 diadochi_liberation.3.t: "Liberation of Salamis"
 #P:A TODO Imperator named characters 380 (Demetrios of Phaleron), 38 (Demetrios Poliorketes) and 37 (Antigonos) through GetCharacter; character ids differ, so their names are written out
 diadochi_liberation.3.desc: "Supposedly founded by King Cychreus, the son of the eponymous nymph Salamis, the island was probably first colonized by Aegina and later occupied by Megara, but became an Athenian possession around the time of Solon, after Megara lost a war with Athens. [ShowLocationName('hulst')] was the site of the Battle of Salamis, the decisive naval victory of the allied Greek fleet, led by Themistocles, over the Persian Empire in 480 BCE. It is also said to be the birthplace of Ajax and Euripides, the latter's birth being popularly placed on the day of the great battle.\n\nAfter the oligarch and would-be tyrant, Demetrios of Phaleron was expelled from Attica by Demetrios Poliorketes, Demetrios Poliorketes won divine honors for reestablishing the old Athenian constitution, but he did not restore to them all of their former lands, bringing [ShowLocationName('hulst')] firmly under Antigonid control.\n\nOur struggle with Antigonos' line for the corpse of Alexandros's empire continues, but we have at last cast out their garrison from [ShowLocationName('hulst')] and our troops now march through its streets.\n\nLiberating the island is certainly a possibility, but relinquishing a key position in the Saronic Gulf may lead to undesirable consequences..."
 diadochi_liberation.3.a: "[ShowLocationName('hulst')] must be heavily garrisoned."
 diadochi_liberation.3.a.t: "Every #Y $greek_group$#! country in mainland [pa_corinth.GetArea.GetRegion.GetName] will lose #R -15#! Opinion of us."
 diadochi_liberation.3.b: "We will maintain a light presence in [ShowLocationName('hulst')]"
 diadochi_liberation.3.bt: "#Y $SALAMIS_NAME$#! will be released as a #Y Feudatory#! subject."
 diadochi_liberation.3.c: "[ShowLocationName('hulst')] has suffered occupation too long."
 diadochi_liberation.3.ct: "#Y $SALAMIS_NAME$#! will be released as a #Y Tributary#! subject."
 diadochi_liberation.3.c.t2: "Every #Y $greek_group$#! country in mainland [pa_corinth.GetArea.GetRegion.GetName] will gain #G 15#! Opinion of us."
 diadochi_liberation.3.d: "[ShowLocationName('hulst')] will be returned to its rightful owner."
 SALAMIS_NAME: "Salamis"
 SALAMIS_ADJECTIVE: "Salaminian"
 diadochi_liberation.4.t: "Liberation of Aigina"
 #P:A TODO Imperator named characters 380 (Demetrios of Phaleron), 38 (Demetrios Poliorketes) and 37 (Antigonos) through GetCharacter; character ids differ, so their names are written out
 diadochi_liberation.4.desc: "According to Herodotus, Aegina originated as a colony of Epidaurus. Tradition gives the origin of its name to Aegina, the great-grandmother of Achilles. Famously, Aigina was the first Greek state to mint their own coinage, marking the product of their mints with their city's symbol, a turtle. Aegina long possessed a rivalry with Athens, but after one last moment in the spotlight during the Battle of Salamis, Aigina would fade into irrelevance.\n\nAfter the oligarch and would-be tyrant, Demetrios of Phaleron was expelled from Attica by Demetrios Poliorketes, Demetrios Poliorketes won divine honors for reestablishing the old Athenian constitution, but he also used this opportunity to entrench his hold over the Saronic Gulf, bringing [ShowLocationName('oxford')] firmly under Antigonid control.\n\nOur struggle with Antigonos' line for the corpse of Alexandros's empire continues, but we have at last cast out their garrison from [ShowLocationName('oxford')] and our troops now march through its streets.\n\nLiberating the island is certainly a possibility, but relinquishing a key position in the Saronic Gulf may lead to undesirable consequences..."
 diadochi_liberation.4.a: "[ShowLocationName('oxford')] must be heavily garrisoned."
 diadochi_liberation.4.a.t: "Every #Y $greek_group$#! country in mainland [pa_corinth.GetArea.GetRegion.GetName] will lose #R -15#! Opinion of us."
 diadochi_liberation.4.b: "We will maintain a light presence in [ShowLocationName('oxford')]"
 diadochi_liberation.4.bt: "#Y $AIGINA_NAME$#! will be released as a #Y Feudatory#! subject."
 diadochi_liberation.4.c: "[ShowLocationName('oxford')] has suffered occupation too long."
 diadochi_liberation.4.ct: "#Y $AIGINA_NAME$#! will be released as a #Y Tributary#! subject."
 diadochi_liberation.4.c.t2: "Every #Y $greek_group$#! country in mainland [pa_corinth.GetArea.GetRegion.GetName] will gain #G 15#! Opinion of us."
 AIGINA_NAME: "Aigina"
 AIGINA_ADJECTIVE: "Aiginetan"
 diadochi_liberation.5.t: "Liberation of Sicyon"
 #P:A TODO Imperator named characters 522 (Alexandros, son of Polyperchon), 523 (Kratesipolis) and 42 (Ptolemaios) through GetCharacter; character ids differ, so their names are written out
 diadochi_liberation.5.desc: "When her traitorous husband, Alexandros, was assassinated, Kratesipolis assumed command of his forces, with whom her kindness had made her extremely popular. When the Sicyonians, hoping for an easy conquest over a woman, attacked the garrison to attempt to establishing an independent government, she quelled the sedition and crucified thirty of the rebels. Kratesipolis would rule in [ShowLocationName('enghien')] and [ShowLocationName('corinth')] for six years until she surrendered the cities to Ptolemy.\n\nOur struggle with Ptolemaios' line for the corpse of Alexandros's empire continues, but we have at last cast out their garrison from [ShowLocationName('enghien')] and our troops now march through its streets.\n\nLiberating the city is certainly a possibility, but keeping a force adjacent to [ShowLocationName('corinth')], just temporarily of course, may be too valuable an opportunity to pass up..."
 diadochi_liberation.5.a: "[ShowLocationName('enghien')] must be heavily garrisoned."
 diadochi_liberation.5.a.t: "Every #Y $greek_group$#! country in mainland [pa_corinth.GetArea.GetRegion.GetName] will lose #R -15#! Opinion of us."
 diadochi_liberation.5.b: "We will maintain a light presence in [ShowLocationName('enghien')]"
 diadochi_liberation.5.bt: "#Y $SIKYON_NAME$#! will be released as a #Y Feudatory#! subject."
 diadochi_liberation.5.c: "[ShowLocationName('enghien')] has suffered occupation too long."
 diadochi_liberation.5.ct: "#Y $SIKYON_NAME$#! will be released as a #Y Tributary#! subject."
 diadochi_liberation.5.c.t2: "Every #Y $greek_group$#! country in mainland [pa_corinth.GetArea.GetRegion.GetName] will gain #G 15#! Opinion of us."
 diadochi_liberation.5.d: "[ShowLocationName('enghien')] is the place to be!"
 diadochi_liberation.5.dt: "#Y We will tag switch over to#! #high #G Sikyon#!#!."
