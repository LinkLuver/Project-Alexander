 chinese_flavor.2.t: "The Mandate of Heaven"
 chinese_flavor.2.desc: "Although the price paid is incalculable, unable to be measured by anyone save the gods, the efforts of [ROOT.GetCountry.GetGovernment.GetRuler.GetName] have finally come to fruition after a long and arduous struggle.\n\nThe #high Mandate of Heaven#!, once entrusted to the #high Shang#! and the #high Zhou#! before they were found wanting before the gods and men, has been given to us, and the establishment of a new Dynasty promises to herald in a new era of peace and prosperity. All other claimants to the throne have seen their foolish dreams shattered by [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], who was born for this moment - the ultimate destiny of our [ROOT.GetCountry.GetGovernment.GetRulerTitle] has culminated in this divinely-ordained moment.\n\nMay the gods protect our Emperor, and long live the House of [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]!"
 chinese_flavor.2.a: "The Celestial Empire will last for Eternity!"
