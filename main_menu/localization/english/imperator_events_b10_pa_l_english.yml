 chinese_flavor.4.t: "Empire in the East"
 chinese_flavor.4.desc: "This morning, shortly after dawn, our city guards informed us that a royal embassy had arrived from the Far East, supposedly carrying news that is of great importance to our people. Upon receiving these strangely dressed ambassadors, whose language we found impossible to decipher, we were presented with a sheet of bronze that was covered in peculiar glyphs and symbols.\n\nAlthough none of our wisest could ascertain the meaning of this language, all could appreciate the magnificent craftsmanship of this decree, which was rendered in the finest bronze and decorated with gold leaf. A few moments later, to our great surprise, one of the diplomats began speaking in our native tongue, announcing in formal speech the establishment of a great Empire.\n\nAfter a period of instability and wars, the lands of the East have been gathered together under the authority of an Emperor, who has commanded that every barbarous nation under the sun be informed of their Glorious Ascent. Having made this proclamation, they asked to purchase provisions, for which they paid handsomely, and then the diplomats traveled onward that same evening, leaving us bemused and wondering what it all could mean."
 chinese_flavor.4.a: "An Empire like this can't last long..."
