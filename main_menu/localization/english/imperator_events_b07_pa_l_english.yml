 ip_monarchy.48.t: "A [ip_mon_47_consort.Custom('pa_imp_get_mother_father_u')]ly Proposal"
 ip_monarchy.48.desc: "[ip_mon_47_consort.GetName], the [ip_mon_47_consort.Custom('pa_imp_get_mother_father')] of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetName], has approached several key influencers at court with some ideas for minor schemes based on [ip_mon_47_consort.GetHerHis] prior experience as the royal consort.\n\n[ROOT.GetCountry.GetGovernment.GetRuler.Custom('pa_imp_get_ip_mon_48_desc')]"
 ip_monarchy.48.a: "The army's quality could be better."
 ip_monarchy.48.b: "We always need more men."
 ip_monarchy.48.c: "We can't refuse more gold."
 ip_monarchy.48.d: "Our infrastructure could be better."
 ip_monarchy.48.e: "The people will rejoice."
 ip_monarchy.48.f: "Assimilation is always too slow."
 ip_monarchy.48.g: "The priests sorely need this."
 ip_monarchy.48.h: "Conversion is a key issue."
 ip_monarchy.48.i: "We are not interested..."
 ip_mon_48_martial_desc: "The proposals stem from their interest in military matters; the first focuses on the quality of our training methods, while the other is centered around bolstering recruitment numbers."
 ip_mon_48_finesse_desc: "The proposals stem from their interest in administrative matters; the first focuses on the efficiency of our tax collection, while the other is centered around optimizing construction methods."
 ip_mon_48_charisma_desc: "The proposals stem from their interest in public matters; the first focuses on improving the spirits of our people, while the other is centered around improving our ability to integrate subject governments."
 ip_mon_48_zeal_desc: "The proposals stem from their interest in religious matters; the first focuses on ensuring the authority of the priesthood, while the other is centered around encouraging the conversion of religious minorities."
