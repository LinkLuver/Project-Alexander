 STATIC_MODIFIER_NAME_elevated_pretender_charmod: "Elevated Pretender"
 ip_monarchy.47.t: "Young [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_mon_47_child.GetShortName]"
 ip_monarchy.47.desc: "The unseasonable ascension of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] to the throne of [ROOT.GetCountry.GetName] places the country in a less than ideal situation.\n\nHowever, [ip_mon_47_consort.GetName], [ip_mon_47_consort.Custom('pa_imp_get_mother_father')] of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] and experienced consort, has proposed a close guiding relationship be maintained between [ip_mon_47_consort.GetHerselfHimself] and the [ROOT.GetCountry.GetGovernment.GetRulerTitle] until [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] reaches adulthood.\n\n[ip_mon_47_consort.GetSheHe|U] argues [ip_mon_47_consort.GetHerHis] talents and experience will both benefit the [ROOT.GetCountry.GetAdjective] crown and reassure the court by strengthening the symbolic continuation of the royal dynasty."
 ip_monarchy.47.a: "[ip_mon_47_consort.GetSheHe|U] makes a fine suggestion."
 ip_monarchy.47.at: "[ip_mon_47_consort.GetShortName] may benefit the country in other ways depending on [ip_mon_47_consort.GetHerHis] talents."
 ip_monarchy.47.b: "We must distance [ip_mon_47_consort.GetShortName] from the [ROOT.GetCountry.GetGovernment.GetRulerTitle]..."
