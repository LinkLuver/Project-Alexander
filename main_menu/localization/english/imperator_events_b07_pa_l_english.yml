 ip_monarchy.68.t: "Religious Observances"
 ip_monarchy.68.desc: "Consort [ip_mon_64_consort.GetShortName] is a pious [ip_mon_64_consort.GetWomanMan] with a great interest in religious matters, and naturally [ip_mon_64_consort.GetHerHis] first priority was a proposal designed to assuage the vocal priesthood's entreaties to address the worrying hepatoscopies and auguries their diviners have uncovered.\n\nThey claim that [ROOT.GetCountry.Custom('pa_imp_get_sky_god')] and all the gods are displeased with the [ROOT.GetCountry.GetGovernment.GetRulerTitle] and the situation in which [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] has left [ROOT.GetCountry.GetName]. Without [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] guidance the gods themselves must be relied on to safeguard the country. The lords of the heavens demand that their word be adhered to, lest they bring calamity down on our heads."
 ip_monarchy.68.a: "This is just what we need."
 ip_monarchy.68.b: "There is no need for [ip_mon_64_consort.GetHerHim] to get involved."
