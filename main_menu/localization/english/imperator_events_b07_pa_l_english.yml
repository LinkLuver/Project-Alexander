 ip_monarchy.40.t: "A Bastard Returns"
 #P:A TODO Fixed Invictus bug: the text named scopes affair_ruler/affair_strumpet/affair_child, which this event never saves; it now uses bastard_ruler/bastard_mother/bastard_child
 ip_monarchy.40.desc: "Despite our efforts to hush up the affair between [bastard_ruler.GetShortName] and [bastard_mother.GetShortName] and the existence of their bastard child [bastard_child.GetShortName], the now grown up babe has arrived at court requesting an audience with the [ROOT.GetCountry.GetGovernment.GetRulerTitle].\n\nIt seems the servants trusted with seeing through our orders were unable to follow through or to maintain the secret of the child's parenthood. They will be dealt with accordingly.\n\nAs for the child, we can no longer avoid a stir at court; [bastard_child.GetHerHis] account has the support of eyewitnesses and we can only acknowledge or deny [bastard_child.GetHerHis] claims...."
 ip_monarchy.40.a: "Acknowledge the child's providence."
 #P:A TODO No EU5 equivalent: tooltip for a loyalty loss (EU5 characters have no loyalty); unused
 ip_monarchy.40.at1: "Close family members and pretenders of [bastard_ruler.GetShortName] will lose #R 40#! Loyalty"
 ip_monarchy.40.at2: "[bastard_child.GetShortName] will be adopted by the [bastard_ruler.GetDynasty.GetName] family."
 ip_monarchy.40.b: "Deny all allegations."
 ip_monarchy.42.t: "Plot: Conspiring Consort"
 ip_monarchy.42.desc: "Treason is unforgivable regardless of its source, but a consort's disloyalty cannot be contemplated.\n\nA trusted palace source has revealed ghastly details of what they claim is a plot, engineered by [ip_mon_42_consort.GetName], the consort of our [ROOT.GetCountry.GetGovernment.GetRulerTitle], to murder [ip_mon_42_primary_heir.GetName], the true heir of [ROOT.GetCountry.GetName]!\n\nApparently, [ip_mon_42_consort.GetShortName] means to further the succession of [ip_mon_42_consort.GetHerHis] own child, [ip_mon_42_consorts_heir.GetName], and ensure [ip_mon_42_consorts_heir.GetSheHe] is the one to inherit when the time comes.\n\nIt would do us well to tread carefully..."
 ip_monarchy.42.a: "[ip_mon_42_consort.GetSheHe|U] would never!"
 ip_monarchy.42.b: "We will get to the bottom of this."
 ip_monarchy.42.bt: "[ip_mon_42_consort.GetShortName] will be investigated for evidence of treason."
 ip_monarchy.43.t: "Plot: Aberrant Whisperings"
 ip_monarchy.43.desc_1: "Our agents have established almost beyond doubt the existent of a plot, headed by the consort of the [ROOT.GetCountry.GetGovernment.GetRulerTitle], to murder [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] heir in order to further the interests of [ip_mon_42_consort.GetHerHis] own child.\n\nThey cite a handmaid in the service of [ip_mon_42_consort.GetShortName] herself, who overheard [ip_mon_42_consort.GetHerHim] goading [ip_mon_42_consorts_heir.GetName] for [ip_mon_42_consorts_heir.GetHerHis] hesitance to participate in the crime.\n\nWhat shall we do with this valuable information?"
 ip_monarchy.43.desc_2: "A great silence has fallen over the palace in the past days; the usual hubbub of court replaced by the rustle of whispers and their accompanying tense glances.\n\n[ip_mon_42_primary_heir.GetName], having now heard the rumors, is particularly on edge, despite [ip_mon_42_primary_heir.GetHerHis] previously cordial relationship with [ip_mon_42_consort.GetShortName].\n\n[ip_mon_42_consorts_heir.GetName], on the other hand, has not been seen for some days, no doubt hidden away in the Pit of Vipers, a pithy nickname the [ROOT.GetCountry.GetGovernment.GetRulerTitle] has coined for the consort's chambers..."
 ip_monarchy.43.a: "Most distressing."
 ip_monarchy.43.b: "Offer to elevate [ip_mon_42_consort.GetHerHis] child's status."
 #P:A TODO No EU5 equivalent: loyalty tooltip (EU5 characters have no loyalty); unused
 ip_monarchy.43.bt2: "All adult children of [ip_mon_42_consort.GetShortName] will gain #G 5#! Loyalty\n#R [ip_mon_42_consort.GetShortName] may continue the plot if [ip_mon_42_consort.GetHerHis] loyalty is low enough.#!"
 ip_monarchy.43.c: "[ip_mon_42_consorts_heir.GetShortName] would never agree to this."
 ip_monarchy.43.ct: "[ip_mon_42_consorts_heir.GetShortName] will confront [ip_mon_42_consort.GetShortName], ending the plot."
 ip_monarchy.43.d: "Double the palace guard as a precaution."
 ip_monarchy.43.e: "Whatever it is, we will nip it in the bud."
 #P:A TODO No EU5 equivalent: loyalty tooltip (EU5 characters have no loyalty); unused
 ip_monarchy.43.et: "All adult children of [ip_mon_42_consort.GetShortName] will lose #R 10#! Loyalty"
 ip_monarchy.43.f: "Catch [ip_mon_42_consort.GetHerHim] in the act..."
 ip_monarchy.43.ft: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_mon_42_ruler.GetShortName] will lay a trap for [ip_mon_42_consort.GetShortName]."
 STATIC_MODIFIER_NAME_nominated_heir_modifier: "Heir Apparent"
 ip_monarchy.44.t: "Plot: Investigation Foiled"
 ip_monarchy.44.desc: "Alas! The agents we sent to investigate the vile rumors were almost immediately foiled in an embarrassing confrontation with [ip_mon_42_consort.GetShortName].\n\n[ip_mon_42_consort.GetSheHe|U] has now had a chance to cover any tracks that may have lead to evidence of [ip_mon_42_consort.GetHerHis] plot, if it in fact exists..."
 ip_monarchy.44.a: "Incompetence at every turn..."
 ip_monarchy.45.t: "Plot: Threat Dwindles"
 ip_monarchy.45.desc: "Whether fabricated or merely abandoned, the troubling rumors of a plot in the heart of the [ROOT.GetCountry.GetAdjective] court have not developed into action, and the heir to the throne is safe, for now."
 ip_monarchy.45.a: "Who would dare, after all?"
 ip_monarchy.46.t: "Plot: Horror at the Palace!"
 ip_monarchy.46.desc_1: "Tragedy at the palace! Early this morning, the screaming of [ip_mon_42_consort.GetShortName] drew all to the bed chambers of the heir, where, amongst piles of torn papers and a smashed vial, lay the yet warm cadaver of [ip_mon_42_primary_heir.GetName].\n\nAmidst the wailing of the court, [ip_mon_42_consort.GetShortName] related how, having discovered correspondence implicating [ip_mon_42_primary_heir.GetShortName] in a plot against the [ROOT.GetCountry.GetGovernment.GetRulerTitle], [ip_mon_42_consort.GetSheHe] had immediately confronted [ip_mon_42_primary_heir.GetHerHim] with the evidence, whereupon [ip_mon_42_primary_heir.GetShortName], wracked with guilt and distraught, quaffed a vial of poison by [ip_mon_42_primary_heir.GetHerHis] bedside, falling down dead.\n\nThe consort's attendants and guards all corroborate the tale, and there were no other witnesses present. What's more, the scattered documents would seem to support [ip_mon_42_consort.GetHerHis] story..."
 ip_monarchy.46.desc_2: "A great commotion awoke the entire place last night, and offered credence to the rumors circulating in the past weeks.\n\nA young servant recently hired to the palace staff was found creeping into the bed chambers of [ip_mon_42_primary_heir.GetName] in the early hours of the morning. Not counting on the extra complement of guards, the boy attempted to approach the sleeping heir with a vial of poison, but was set upon by several of the royal household who proceeded to torture him for the names of the plotters.\n\nThere is now no doubt that it was [ip_mon_42_consorts_heir.GetShortName] who orchestrated the attempt, and [ip_mon_42_consorts_heir.GetSheHe] has been brought to the royal basilica for the [ROOT.GetCountry.GetGovernment.GetRulerTitle] to cast [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] judgment..."
 ip_monarchy.46.desc_3: "A cunning plan devised by the [ROOT.GetCountry.GetGovernment.GetRulerTitle] was hatched to foil the plot against [ip_mon_42_primary_heir.GetShortName]; the guard on [ip_mon_42_primary_heir.GetHerHis] chambers was deliberately and slowly reduced over a number of weeks, until it appeared almost non-existence. Secretly however, a special posting of soldiers took residence in a room adjoining the heir's bed chambers.\n\nThe intrigue succeeded in drawing an assassin into the open, but astonishingly, the guards found that the creeping fiend was none other than [ip_mon_42_consort.GetShortName] [ip_mon_42_consort.GetHerselfHimself]! Buoyed by [ip_mon_42_consort.GetHerHim] hatred for [ip_mon_42_primary_heir.GetShortName] and the apparent lack of guards, [ip_mon_42_consort.GetSheHe] attempted to kill [ip_mon_42_primary_heir.GetHerHim] by [ip_mon_42_consort.GetHerHis] own hand!\n\nWhat shall we do with the murderous wretch?"
 ip_monarchy.46.a: "[ip_mon_42_primary_heir.GetShortName] was only human..."
 ip_monarchy.46.b: "...but [ip_mon_42_consort.GetShortName] is but a snake!"
 ip_monarchy.46.c: "Crucify [ip_mon_42_consort.GetHerHim]!"
 ip_monarchy.46.d: "Clap [ip_mon_42_consort.GetHerHim] in irons."
 ip_monarchy.46.e: "[ip_mon_42_ruler.GetShortName] will be merciful."
 ip_monarchy.46.f: "The gods demand payment in kind."
 ip_monarchy.46.g: "YOU DARE TRY TO KILL MY CHILD?!"
