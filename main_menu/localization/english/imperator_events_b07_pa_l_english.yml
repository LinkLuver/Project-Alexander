 ip_monarchy.52.t: "Long Live the [ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 ip_monarchy.52.desc_1: "The [ROOT.GetCountry.GetGovernment.GetRulerTitle] today received the news of the passing of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] [ip_mon_47_consort.Custom('pa_imp_get_mother_father')] and mentor, [ip_mon_47_consort.GetName]. [ip_mon_47_consort.GetHerHis|U] death will be greatly mourned at court, and all [ROOT.GetCountry.GetName] will lament the loss as though [ip_mon_47_consort.GetSheHe] were their own parent; may [ROOT.GetCountry.Custom('pa_imp_get_god_of_dead')] treat [ip_mon_47_consort.GetHerHim] well.\n\n[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has lost a great influence and the experienced guidance of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] [ip_mon_47_consort.Custom('pa_imp_get_mother_father')] will not be easily replicated. However, we must now look to the future, and the glorious reign of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]!"
 ip_monarchy.52.desc_2: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has now reached [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] majority, and is old enough to rule without the help of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] [ip_mon_47_consort.Custom('pa_imp_get_mother_father')] and mentor, [ip_mon_47_consort.GetName], though [ip_mon_47_consort.GetSheHe] has been of great assistance.\n\nWe must now look to ensuring the reign of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is even more glorious than [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] ancestor's, by the grace of [ROOT.GetCountry.Custom('pa_imp_get_sky_god')]!"
 ip_monarchy.52.a: "Long may [ip_mon_47_child.GetSheHe] reign!"
