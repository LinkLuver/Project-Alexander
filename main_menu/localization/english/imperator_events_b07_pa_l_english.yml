 ip_monarchy.54.t: "Plot: Cut Out the Middle [ROOT.GetCountry.GetGovernment.GetRuler.GetWomanMan|U]"
 ip_monarchy.54.desc: "Lately, rumors focused on the increasingly frequent matrimonial tiffs between [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] consort, [ip_mon_54_consort.GetShortName], have been circling the palace, creating an atmosphere that is dividing the court and repelling visitors.\n\nThe darkest of these yarns tell of the imminent assassination of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] by the consort's hand, that [ip_mon_54_primary_heir.GetName], the heir to the throne and child of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ip_mon_54_consort.GetShortName], might succeed to the throne immediately under the consorts guidance and thus bypass the [ROOT.GetCountry.GetGovernment.GetRulerTitle] entirely...\n\nThis breed of gossip need give [ROOT.GetCountry.GetName] pause."
 ip_monarchy.54.a: "The royal consort is not some low schemer!"
 ip_monarchy.54.b: "Have [ip_mon_54_consort.GetHerHim] tailed immediately."
 ip_monarchy.54.bt: "[ip_mon_54_consort.GetShortName] will be surveilled for evidence of treason."
 ip_monarchy.55.t: "Plot: Through the Grapevine"
 ip_monarchy.55.desc_1: "The tail we placed on [ip_mon_54_consort.GetShortName] has returned with tidings of [ip_mon_54_consort.GetHerHis] strange routines and visits to the more skullduggerous parts of the city. Having questioned various witnesses to [ip_mon_54_consort.GetHerHis] activities in the taverns of [ROOT.GetCountry.GetCapital.GetName] it seems the consort has been inquiring into the manufacture and usage of various poisons, and that the plot must in fact exist. [ip_mon_54_consort.GetShortName] means to kill the [ROOT.GetCountry.GetGovernment.GetRulerTitle]!\n\nOur knowledge of the plot is unknown to [ip_mon_54_consort.GetHerHis], but we must decide on how best to bring this sorry situation to a close."
 ip_monarchy.55.desc_2: "The fetid atmosphere at the royal palace has only worsened in the past weeks, with the court now completely divided between the east and west wings. [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ip_mon_54_consort.GetShortName] have not spoken in days, and [ip_mon_54_consort.GetSheHe] refuses all invitations to banquet or be seen publicly.\n\nOur heir, poor [ip_mon_54_primary_heir.GetName], is visibly torn between [ip_mon_54_primary_heir.GetHerHis] parents and their bickering has taken a toll on [ip_mon_54_primary_heir.GetHerHis] mood. All are agreed that something drastic must be done to put an end to this tiresome rift..."
 ip_monarchy.55.a: "This trifle will soon be forgotten."
 ip_monarchy.55.b: "Why does [ip_mon_54_consort.GetShortName] hate [ip_mon_54_ruler.GetShortName] so?"
 #P:A TODO No EU5 equivalent: loyalty tooltip (EU5 characters have no loyalty); unused
 ip_monarchy.55.bt: "#R [ip_mon_54_consort.GetShortName] may continue the plot if [ip_mon_54_consort.GetHerHis] loyalty is low enough.#!"
 #P:A TODO Fixed Invictus bug: the text named scope ip_mon_54_consorts_heir, which this chain never saves; it now uses the heir ip_mon_54_primary_heir, whom the option checks
 ip_monarchy.55.c: "[ip_mon_54_primary_heir.GetShortName] would never agree to this."
 #P:A TODO Fixed Invictus bug: ip_mon_54_consorts_heir -> ip_mon_54_primary_heir, as above
 ip_monarchy.55.ct: "[ip_mon_54_primary_heir.GetShortName] will confront [ip_mon_54_consort.GetShortName], ending the plot."
 ip_monarchy.55.d: "Ensure no one can get to the [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 ip_monarchy.55.e: "This childish charade ends now."
 #P:A TODO No EU5 equivalent: loyalty tooltip (EU5 characters have no loyalty); unused
 ip_monarchy.55.et: "All adult children of [ip_mon_54_consort.GetShortName] will lose #R 10#! Loyalty"
 ip_monarchy.55.f: "[ip_mon_54_ruler.GetShortName] will solve this [ip_mon_54_ruler.GetHerselfHimself]."
 ip_monarchy.55.ft: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_mon_54_ruler.GetShortName] will personally confront [ip_mon_54_consort.GetShortName].\n\n#R This option may have unintended consequences.#!\nThis option is available due to your ruler's #Y Military#! skill."
 ip_monarchy.56.t: "Plot: Espionage Thwarted"
 ip_monarchy.56.desc: "The tail we placed on [ip_mon_54_consort.GetShortName] was swiftly detected, angering the consort and causing a minor scandal at court. There is now little hope of learning anything using such methods.\n\nLet us hope that there is no truth to the treasonous whisperings..."
 ip_monarchy.56.a: "Can no one be trusted?!"
 ip_monarchy.57.t: "Plot: Danger Recedes"
 ip_monarchy.57.desc: "The tension between [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and [ip_mon_54_consort.GetShortName] seems to have abated, and the vile murmurings of treason have disappeared from the stoa of the palace. Perhaps the matter was simply a poor attempt at humor, or indeed the consort may have come to [ip_mon_54_consort.GetHerHis] senses..."
 ip_monarchy.57.a: "One less thing to worry about."
 ip_monarchy.58.t: "Plot: Conclusion"
 ip_monarchy.58.desc_1: "Today, the consort accompanied [ip_mon_54_ruler.GetShortName] to the wedding games of a minor noble in a surprising joint public appearance, a move that was hoped to symbolize the start of an end to their rift.\n\nHowever, as [ip_mon_54_ruler.GetShortName] started [ip_mon_54_ruler.GetHerHis] commencement speech before the eager crowd, [ip_mon_54_ruler.GetSheHe] was suddenly charged and stabbed deeply in the heart by a courtier who dashed forward before anyone could react! In the ensuing panic, the assassin attempted to flee but tripped and was speared to death by the overly zealous royal guards, leaving us with no certainty of the murderer's motives...\n\nAs the sovereign lay, surrounded by attendants and perhaps yet breathing, [ip_mon_54_consort.GetShortName] rushed down to the podium, grabbed the bloody crown from [ip_mon_54_ruler.GetHerHis] head, and proclaimed [ip_mon_54_consort.GetHerHis] child [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_mon_54_primary_heir.GetName] of [ROOT.GetCountry.GetName] to the rejoicing of the throng!"
 #P:A TODO No EU5 equivalent: text for an assassin holding the Imperator office "master of the guard" (EU5 has no court offices); never shown
 ip_monarchy.58.desc_2: "Today, the consort accompanied [ip_mon_54_ruler.GetShortName] to the wedding games of a minor noble in a surprising joint public appearance, a move that was hoped to symbolize the start of an end to their rift.\n\nHowever, as [ip_mon_54_ruler.GetShortName] started [ip_mon_54_ruler.GetHerHis] commencement speech before the eager crowd, [ip_mon_54_ruler.GetSheHe] was suddenly charged and stabbed deeply in the heart by [ip_mon_54_ruler.GetHerHis] bodyguard, [ip_mon_54_assassin.GetShortName] who dashed forward before anyone could react! In the ensuing panic, the assassin attempted to flee but tripped and was speared to death by the overly zealous royal guards, leaving us with no certainty of the murderer's motives...\n\nAs the sovereign lay, surrounded by attendants and perhaps yet breathing, [ip_mon_54_consort.GetShortName] rushed down to the podium, grabbed the bloody crown from [ip_mon_54_ruler.GetHerHis] head, and proclaimed [ip_mon_54_consort.GetHerHis] child [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_mon_54_primary_heir.GetName] of [ROOT.GetCountry.GetName] to the rejoicing of the throng!"
 ip_monarchy.58.desc_3: "Today, the consort accompanied [ip_mon_54_ruler.GetShortName] to the wedding games of a minor noble in a surprising joint public appearance, a move that was hoped to symbolize the start of an end to their rift.\n\nA carefully planned new security strategy had been devised for the event, with the bodyguard on high alert despite not appearing so. As [ip_mon_54_ruler.GetShortName] started [ip_mon_54_ruler.GetHerHis] commencement speech [ip_mon_54_ruler.GetSheHe] was charged by a dagger wielding courtier, who was quickly grabbed by several guards. [ip_mon_54_consort.GetShortName], seeing that the discovery of [ip_mon_54_consort.GetHerHis] role in the plot was now inevitable, fled from the theater, but was soon dragged before the [ROOT.GetCountry.GetGovernment.GetRulerTitle] by waiting guards.\n\n[ip_mon_54_consort.GetSheHe|U] was held kneeling in the sand before the crowd as a confession implicating the consort was drawn from the terrified courtier. It is now clear that [ip_mon_54_consort.GetShortName] had been planning to have the [ROOT.GetCountry.GetGovernment.GetRulerTitle] killed and [ip_mon_54_consort.GetHerHis] child [ip_mon_54_primary_heir.GetShortName] proclaimed the new ruler with [ip_mon_54_consort.GetHerselfHimself] pulling the strings."
 #P:A TODO No EU5 equivalent: text for an assassin holding the Imperator office "master of the guard" (EU5 has no court offices); never shown
 ip_monarchy.58.desc_4: "Today, the consort accompanied [ip_mon_54_ruler.GetShortName] to the wedding games of a minor noble in a surprising joint public appearance, a move that was hoped to symbolize the start of an end to their rift.\n\nA carefully planned new security strategy had been devised for the event, with the most trusted bodyguard on high alert despite not appearing so. As [ip_mon_54_ruler.GetShortName] started [ip_mon_54_ruler.GetHerHis] commencement speech [ip_mon_54_ruler.GetSheHe] was charged by [ip_mon_54_ruler.GetHerHis] bodyguard [ip_mon_54_assassin.GetShortName], who was quickly grabbed. [ip_mon_54_consort.GetShortName], seeing that the discovery of [ip_mon_54_consort.GetHerHis] role in the plot was now inevitable, fled from the theater, but was soon dragged before the [ROOT.GetCountry.GetGovernment.GetRulerTitle] by waiting guards.\n\n[ip_mon_54_consort.GetSheHe|U] was held kneeling in the sand before the crowd as a confession implicating the consort was drawn from the terrified [ip_mon_54_assassin.GetShortName]. It is now clear that [ip_mon_54_consort.GetShortName] had been planning to have the [ROOT.GetCountry.GetGovernment.GetRulerTitle] killed and [ip_mon_54_consort.GetHerHis] child [ip_mon_54_primary_heir.GetShortName] proclaimed the new ruler with [ip_mon_54_consort.GetHerselfHimself] pulling the strings."
 ip_monarchy.58.desc_5: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has chosen today to march on the chambers of the consort with [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] retinue.\n\nStorming into the royal bedchamber, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] casts aside [ip_mon_54_consort.GetHerHis] guards and, calling the court to witness the proceedings, thunders accusations of treason. Flustered and wide eyed, the consort screams [ip_mon_54_consort.GetHerHis] denials, feigning ignorance and showering the [ROOT.GetCountry.GetGovernment.GetRulerTitle] with reassurances.\n\nProstrating before [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], [ip_mon_54_consort.GetSheHe] suddenly moves towards [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim] and before [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] can react a flashing dagger cleanly slits [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] throat in a flourish. The shocked guards are frozen by the consort's raised hand, as [ip_mon_54_consort.GetSheHe] cries, ''Long live [ip_mon_54_primary_heir.GetName]!''"
 ip_monarchy.58.desc_6: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] has chosen today to march on the chambers of the consort with [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] retinue.\n\nStorming into the royal bedchamber, [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] casts aside [ip_mon_54_consort.GetHerHis] guards and, calling the court to witness the proceedings, thunders accusations of treason. Flustered and wide eyed, the consort screams [ip_mon_54_consort.GetHerHis] denials, feigning ignorance and showering the [ROOT.GetCountry.GetGovernment.GetRulerTitle] with reassurances as guards turn out [ip_mon_54_consort.GetHerHis] belongings revealing a chest of poisons and poorly coded assassination plan.\n\nBroken and sobbing, [ip_mon_54_consort.GetShortName] slowly levels with the gaze of the [ROOT.GetCountry.GetGovernment.GetRulerTitle], awaiting [ip_mon_54_consort.GetHerHis] judgment..."
 ip_monarchy.58.a: "[ip_mon_54_ruler.GetShortName] had many enemies..."
 ip_monarchy.58.b: "...but only [ip_mon_54_consort.GetShortName] would have dared!"
 ip_monarchy.58.c: "Execute [ip_mon_54_consort.GetHerHim]!"
 ip_monarchy.58.d: "Put [ip_mon_54_consort.GetHerHim] in a cell."
 ip_monarchy.58.e: "Exile [ip_mon_54_consort.GetHerHim] for life."
 ip_monarchy.58.f: "[ip_mon_54_consort.GetSheHe|U] will not escape my WRATHHH!"
 ip_mon_58_tt: "[ip_mon_54_ruler.GetShortName] (#Y Ruler#!) gets killed by [ip_mon_54_consort.GetShortName] (#Y Consort#!)"
 ip_monarchy.59.t: "Eager Consort"
 ip_monarchy.59.desc: "Consort [ip_mon_59_consort.GetShortName] today approached the court with an interesting proposal. Namely, that given the worrying war we find ourselves in, [ip_mon_59_consort.GetHerHis] own martial prowess, and the personal leadership of an army by skilled [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], [ip_mon_59_consort.GetSheHe] accompany the [ROOT.GetCountry.GetGovernment.GetRulerTitle] and [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] army into battle.\n\nThe consort is passionately convinced that [ip_mon_59_consort.GetHerHis] presence will bolster the spirits of the fighting men as well [ip_mon_59_consort.GetHerHis] [ROOT.GetCountry.GetGovernment.GetRulerTitle], that the royal family must defend their country regardless of their position, and, if needs must, [ip_mon_59_consort.GetSheHe] could quite capably command a flank."
 ip_monarchy.59.a: "Of course, [ip_mon_59_consort.GetSheHe] will join the [ROOT.GetCountry.GetGovernment.GetRulerTitle]!"
 ip_monarchy.59.at: "As long as [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ip_mon_59_ruler.GetShortName] remains a general, [ip_mon_59_consort.GetShortName] will accompany [ip_mon_59_ruler.GetHerHim] in battle."
 ip_monarchy.59.b: "What foolishness."
 ip_monarchy.60.t: "Victorious Consort"
 ip_monarchy.60.desc: "A messenger brings word from the army of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]. In their glorious battle with our foes, consort [ip_mon_59_consort.GetShortName] [ROOT.GetCountry.Custom('pa_imp_get_battle_win_desc')]\n\nOur great victory is owed partly to [ip_mon_59_consort.GetHerHim] efforts; it is said that [ip_mon_59_consort.GetSheHe] instilled great fervor in the fighting men who rallied around [ip_mon_59_consort.GetHerHim]. This a glorious day for [ROOT.GetCountry.GetName] and the royal house!"
 ip_monarchy.60.a: "Excellent!"
 consort_eager_no_more: "[ip_mon_59_consort.GetShortName] will no longer accompany [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] in battle."
 get_battle_win_1: "lead a whirlwind counter-attack after deep scouts of the enemy attempted to overrun the baggage train, preventing a major panic in the rear, before tailing them as far as the battle where [ip_mon_59_consort.GetSheHe] then supported the main attack of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName]!"
 get_battle_win_2: "took command of the army's left flank, bracing against a major assault before routing the enemy and chasing them near into the enemy camp, before circling to the support of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] and delivering a crushing blow to the turned flank of the opposing army!"
 get_battle_win_3: "remained close to [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], giving counsel with [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] generals and providing an extra pair of eyes as the battle unfolded, before hurtling into the fray with the companion cavalry!"
 STATIC_MODIFIER_NAME_victorious_consort_charmod: "Victorious Consort"
 ip_monarchy.61.t: "Victorious Consort"
 ip_monarchy.61.desc: "A messenger brings word from the army of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]. In their glorious battle with our foes, consort [ip_mon_59_consort.GetShortName] [ROOT.GetCountry.Custom('pa_imp_get_battle_win_desc')]\n\nOur great victory is owed partly to [ip_mon_59_consort.GetHerHis] efforts; it is said that [ip_mon_59_consort.GetSheHe] instilled great fervor in the fighting men who rallied around [ip_mon_59_consort.GetHerHim]. However, the messenger also regretfully reports that [ip_mon_59_consort.GetShortName] [ROOT.GetCountry.Custom('pa_imp_get_battle_injury_desc')]"
 ip_monarchy.61.a: "Calamity!"
 get_battle_injury_1: "took a chance arrow in the confusion of battle."
 get_battle_injury_2: "was unhorsed by a determined attacker and sustained several blows."
 get_battle_injury_3: "fell and was trampled by a horse, narrowly avoiding being crushed."
 get_battle_injury_4: "took a chance arrow to the neck and was killed instantly."
 get_battle_injury_5: "was unhorsed by a determined attacker and died on the field in the chaos of the melee."
 get_battle_injury_6: "fell beneath a trampling horse, and was tragically crushed."
 ip_monarchy.62.t: "Vanquished Consort"
 ip_monarchy.62.desc: "A messenger brings word from the army of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]. In their ignominious battle with our foes, consort [ip_mon_59_consort.GetShortName] [ROOT.GetCountry.Custom('pa_imp_get_battle_loss_desc')]\n\nOur defeat is being blamed on [ip_mon_59_consort.GetShortName], and by extension our decision to allow someone like [ip_mon_59_consort.GetHerHim] to help command in battle..."
 ip_monarchy.62.a: "This does not sit well."
 get_battle_loss_1: "attempted to keep enemy deep scouts from overrunning the baggage train but was unable to stand their ferocious assault, fleeing to the side of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] as they dealt with a near encirclement."
 get_battle_loss_2: "took command of the army's left flank but despite courageous fighting was unable to hold the ferocious assault of the enemy. The left crumbled, threatening the encirclement of the center and signaling a rout of the [ROOT.GetCountry.GetAdjective] forces."
 get_battle_loss_3: "stayed at the side of [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName], giving counsel with [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] generals and providing an extra pair of eyes as the battle unfolded, before hurtling into the fray with companion cavalry!"
 STATIC_MODIFIER_NAME_defeated_consort_charmod: "Vanquished Consort"
 ip_monarchy.63.t: "Vanquished Consort"
 ip_monarchy.63.desc: "A messenger brings word from the army of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]. In their ignominious battle with our foes, consort [ip_mon_59_consort.GetShortName] [ROOT.GetCountry.Custom('pa_imp_get_battle_loss_desc')]\n\nOur defeat is being blamed on [ip_mon_59_consort.GetShortName], and by extension our decision to allow someone like [ip_mon_59_consort.GetHerHim] to help command in battle. However, the messenger also regretfully reports that [ip_mon_59_consort.GetShortName] [ROOT.GetCountry.Custom('pa_imp_get_battle_injury_desc')]"
 ip_monarchy.63.a: "[ip_mon_59_consort.GetSheHe|U] knew the risks..."
 ip_monarchy.64.t: "In Good Hands"
 ip_monarchy.64.desc_1: "The ongoing war has taken up most of the attention of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] as [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] leads our armies to inevitable victory. While [ROOT.GetCountry.GetName] does have bureaucratic momentum, there are many issues that await the capable hands of the legitimate monarch.\n\nIn the absence of the [ROOT.GetCountry.GetGovernment.GetRulerTitle], consort [ip_mon_64_consort.GetShortName] has taken on some of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] responsibilities, and is doing [ip_mon_64_consort.GetHerHis] best to address the most pressing concerns."
 #P:A TODO No EU5 equivalent: text for an imprisoned ruler (EU5 has no imprisonment); never shown
 ip_monarchy.64.desc_2: "The unfavorable position of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] in a foreign dungeon has lead to a minor crisis at court. While [ROOT.GetCountry.GetName] does have bureaucratic momentum, there are many issues that await the capable hands of the legitimate monarch.\n\nIn the absence of the [ROOT.GetCountry.GetGovernment.GetRulerTitle], consort [ip_mon_64_consort.GetShortName] has taken on some of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] responsibilities, and is doing [ip_mon_64_consort.GetHerHis] best to address the most pressing concerns."
 ip_monarchy.64.a: "Commendable."
 ip_monarchy.64.tt: "As long as [ROOT.GetCountry.GetGovernment.GetRuler.GetName] remains a general while [ROOT.GetCountry.GetName] is at war, [ip_mon_64_consort.GetName] will attempt to assist our country."
 ip_monarchy.65.t: "Military Assurances"
 ip_monarchy.65.desc: "Consort [ip_mon_64_consort.GetShortName] has decided to turn [ip_mon_64_consort.GetHerHis] martial knowledge to the benefit of the state in an attempt to assuage the concerns of the military, and particularly the disaffected general [ip_mon_65_general.GetName].\n\n[ip_mon_65_general.GetSheHe|U] is complaining of a lack of men causing the army's confidence in the [ROOT.GetCountry.GetGovernment.GetRulerTitle] to wane; the long serving veterans complain of criminal neglect of the military organization to whom [ROOT.GetCountry.GetName] owes all its power.\n\n[ip_mon_64_consort.GetShortName] has brought a proposal before the royal advisors that [ip_mon_64_consort.GetSheHe] hopes will put the army's fears to bed."
 ip_monarchy.65.a: "We can hardly refuse."
 ip_monarchy.65.b: "This is none of [ip_mon_64_consort.GetHerHis] concern."
 ip_mon_64_stop: "[ip_mon_64_consort.GetName] will give up on [ip_mon_64_consort.GetHerHis] attempts to help [ROOT.GetCountry.GetName]."
 STATIC_MODIFIER_NAME_ip_mon_65_mil_neg_cmod: "Disheartened Army"
 ip_monarchy.66.t: "Neglected Hub"
 ip_monarchy.66.desc_1: "Consort [ip_mon_64_consort.GetShortName] has decided to put [ip_mon_64_consort.GetHerHis] considerable administrative experience to good use with a scheme designed to reassure the disgruntled cities in [ip_mon_66_city.GetProvince.GetName]. The [ip_mon_66_city.Custom('pa_imp_get_city_type_loc')] of [ip_mon_66_city.GetName] is particularly vocal in its concerns, arguing that they repeatedly been ignored and passed over in favor of the capital and other provinces. \n\nWith the [ROOT.GetCountry.GetGovernment.GetRulerTitle] indisposed, the consort has drawn up a plan to fund the expansion of [ip_mon_66_city.GetName] to ensure its future prosperity and assure the locals that the ancient rights and importance of their municipality will not be dulled by time or ill fortune."
 ip_monarchy.66.desc_2: "Consort [ip_mon_64_consort.GetShortName] has decided to put [ip_mon_64_consort.GetHerHis] considerable administrative experience to good use with a scheme designed to reassure the disgruntled cities in [ip_mon_66_city.GetProvince.GetName]. The [ip_mon_66_city.Custom('pa_imp_get_city_type_loc')] of [ip_mon_66_city.GetName] is particularly vocal in its concerns, especially in light of the recent disasters that have the gods have deigned to befall the region. \n\nWith the [ROOT.GetCountry.GetGovernment.GetRulerTitle] indisposed, the consort has drawn up a plan to fund the expansion of [ip_mon_66_city.GetName] to ensure its future prosperity and assure the locals that the ancient rights and importance of their municipality will not be dulled by time or ill fortune."
 ip_monarchy.66.a: "By all means!"
 #P:A Pop names follow the EU5 pop types the event adds (Imperator freemen -> peasants, citizens -> burghers); Imperator pop icons dropped
 ip_monarchy.66.at1: "#Y 1#! Peasants will appear in [ip_mon_66_city.GetName]."
 ip_monarchy.66.at2: "#Y 2#! Peasants will appear in [ip_mon_66_city.GetName]."
 ip_monarchy.66.at3: "#Y 2#! Peasants and #Y 1#! Burghers will appear in [ip_mon_66_city.GetName]."
 ip_monarchy.66.at4: "#Y 2#! Peasants and #Y 2#! Burghers will appear in [ip_mon_66_city.GetName]."
 ip_monarchy.66.b: "Out of the question."
