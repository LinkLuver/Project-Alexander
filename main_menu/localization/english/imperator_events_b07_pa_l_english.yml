 # Imperator (Invictus / Terra Indomita) event import, batch b07 (2026-10-05)
 ip_monarchy.37.t: "A Bastard Returns"
 ip_monarchy.37.desc: "Despite our efforts to hush up the affair between [bastard_ruler.GetShortName] and [bastard_mother.GetShortName], and the existence of the bastard child [bastard_child.GetShortName], the now grown up babe has arrived at court requesting an audience with the [ROOT.GetCountry.GetGovernment.GetRulerTitle].\n\nIt seems the servants trusted with conducting our orders were either unable to follow through or failed to maintain the secret of the child's parenthood. They will be dealt with accordingly.\n\nAs for the child, we can no longer avoid a stir at court; [bastard_child.GetHerHis] account has the support of eyewitnesses and we can only acknowledge or deny [bastard_child.GetHerHis] claims..."
 ip_monarchy.37.a: "Acknowledge the child's providence."
 ip_monarchy.37.at1: "Close family members and pretenders of [bastard_ruler.GetShortName] lose #R 20#! Loyalty"
 ip_monarchy.37.b: "Deny all allegations."
 ip_monarchy.39.t: "The Price of Wild Oats"
 ip_monarchy.39.desc: "A long running sordid affair between [ROOT.GetCountry.GetGovernment.GetRulerTitle] [bastard_ruler.GetShortName] and a noblewoman named [affair_strumpet.GetName] has, through their carelessness, resulted in a child. There is no doubt that [bastard_ruler.GetShortName] is the father, though [affair_strumpet.GetShortName] successfully managed to keep the pregnancy a secret, even from [affair_strumpet.GetHerHis] husband.\n\nIf acknowledged the child would be at great risk, for it poses a threat to the other successors of the realm, and its very existence is an insult to the family of the consort..."
 ip_monarchy.39.a: "No one must ever know. Leave the child [ROOT.GetCountry.Custom('pa_imp_get_local_terrain')]"
 ip_monarchy.39.at: "[affair_child.GetName] will disappear."
 ip_monarchy.39.b: "The child has royal blood!"
 ip_monarchy.39.c: "[affair_strumpet.GetShortName] will be my wife!"
