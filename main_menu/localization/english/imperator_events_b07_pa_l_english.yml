 dhe_parthians.1.t: "Arsaces"
 dhe_parthians.1.desc: "With the unification of the Dahae tribes great social changes are also upon us. Some men thrive in such conditions, rising from obscurity to relevance and power.\nArsaces is one such man. Having quickly built a power base for himself, with enthusiastic warriors joining his side by the hundreds, he has now approached the Clan Chiefs offering his assistance in bringing our federation towards a brighter future."
 dhe_parthians.1.a: "The world will never be the same."
 STATIC_MODIFIER_NAME_rise_of_arsaces_cmod: "Rise of Arsaces"
 dhe_parthians.2000.t: "Dahae Belligerency"
 dhe_parthians.2000.desc: "It seems there is unrest in the #high Steppes#! north of #high Parthia#!. If left unchecked, we should expect that the #high Dahae#! tribesmen will unite sooner rather than later, and once their internal squabblings have been settled, will move on to more civilized lands with their armies.\n\nAs it just so happens, #high Parthia#! is just south of them and, if left vulnerable, will likely be their first target.\n\nWe need to observe the #high Situation#! closely, lest we have to deal with a horde of angry horse riders crossing the border into [ROOT.GetCountry.GetName]..."
 dhe_parthians.2000.a: "Let's see how situation develops..."
 dhe_parthians.2000.b: "This is a clear danger."
 #P:A TODO The Invictus decision aaa_pth_dahae_belligerency ("viewable as a Decision") is not part of the event import; the text is kept, the orchestrator must port the decision or reword it
 dhe_parthians.2000.tt: "The #R Dahae Belligerency Situation#! begins. Dahae Belligerency is viewable as a #T Decision#! in the #T Nation Overview#!.\n\n#R If left unchecked, #high Dahae tribes#! will invade."
