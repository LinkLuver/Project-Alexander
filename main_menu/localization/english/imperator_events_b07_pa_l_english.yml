 STATIC_MODIFIER_NAME_neglected_hub_pm: "Neglected Hub"
 ip_monarchy.67.t: "Eased Minds"
 #P:A TODO No EU5 equivalent: the ally variant needs an imprisoned ruler (EU5 has no imprisonment); never shown
 ip_monarchy.67.desc_1: "The charisma and diplomatic savviness of consort [ip_mon_64_consort.GetShortName] is well known in courtly circles, and it is thus little wonder that [ip_mon_64_consort.GetSheHe] has made reassuring [ROOT.GetCountry.GetAdjective] foreign allies [ip_mon_64_consort.GetHerHis] priority. [ip_mon_67_subjectally.GetName] has been [ip_mon_64_consort.GetHerHis] main focus, as [ip_mon_67_subjectally.GetGovernment.GetRulerTitle] [ip_mon_67_subjectally.GetGovernment.GetRuler.GetShortName] is arguably our most important ally with concerns about the absence of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] from the helm of [ROOT.GetCountry.GetName]. \n\n[ip_mon_64_consort.GetShortName] has planned a lavish diplomatic delegation to assuage their concerns and reassure them that [ROOT.GetCountry.GetName] is in capable hands. Such a gesture is sure to encourage a wider reaching improvement in the assessment of [ROOT.GetCountry.GetAdjective] reliability."
 ip_monarchy.67.desc_2: "The charisma and diplomatic savviness of consort [ip_mon_64_consort.GetShortName] is well known in courtly circles, and it is thus little wonder that [ip_mon_64_consort.GetSheHe] has made reassuring [ROOT.GetCountry.GetAdjective] foreign subjects [ip_mon_64_consort.GetHerHis] priority. [ip_mon_67_subjectally.GetName] has been [ip_mon_64_consort.GetHerHis] main focus, as [ip_mon_67_subjectally.GetGovernment.GetRulerTitle] [ip_mon_67_subjectally.GetGovernment.GetRuler.GetShortName] is arguably our most important subject with concerns about the absence of [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] from the helm of [ROOT.GetCountry.GetName].\n\n[ip_mon_64_consort.GetShortName] has planned a lavish diplomatic delegation to assuage their concerns and reassure them that [ROOT.GetCountry.GetName] is in capable hands. Such a gesture is sure to encourage a wider reaching improvement in the assessment of [ROOT.GetCountry.GetAdjective] reliability."
 ip_monarchy.67.a: "By all means!"
 ip_monarchy.67.b: "Out of the question."
