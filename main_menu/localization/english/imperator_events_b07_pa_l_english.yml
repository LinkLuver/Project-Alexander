 DAHAE_NAME: "Dahae"
 DAHAE_ADJECTIVE: "Dahaean"
 diadochi_flavor.100.t: "A Chance to Strike"
 diadochi_flavor.100.desc: "The feeble [origin.GetGovernment.GetRuler.GetDynasty.GetName] dynasty cowers in the west, claiming nominal overlordship of great swathes of land.\n\nIn truth, we are the only ones who dare to speak the truth: the legitimacy of Seleukid rule is over.\n\nIt is with interest, therefore, that one of our foraging parties limped home recently, having been routed by a border patrol accompanied by [origin.GetGovernment.GetRuler.GetName], the [origin.GetGovernment.GetRulerTitle] of the [origin.GetName]. With a hasty enough response, we may be able to deal a severe blow to them, though this would surely be cause for outright war."
 diadochi_flavor.100.a: "Our time is now!"
 diadochi_flavor.100.b: "We cannot upset the fragile balance of power."
 #P:A Country name and adjective given to the Dahae country by dhe_parthians.3 (Imperator PARTHIA_NAME / PARTHIA_ADJECTIVE)
 PARTHIA_NAME: "Parthia"
 PARTHIA_ADJECTIVE: "Parthian"
 STATIC_MODIFIER_NAME_founding_city_in_progress: "City Under Construction"
 STATIC_MODIFIER_NAME_parthian_death_lasers: "Parthian Warriors"
 STATIC_MODIFIER_NAME_parthian_attack_lasers: "Parthian Regicide"
 dhe_parthians.4.t: "Dahae Belligerency - Invasion!"
 dhe_parthians.4.desc: "Woe be upon civilization! The fierce #high Dahae#! tribes have united and made their move!\n\nUnder the great leadership of [target.GetGovernment.GetRuler.GetName], famed for his martial skills, they will prove quite an opponent..."
 dhe_parthians.4.a: "If you can't beat them..."
 #P:A TODO EU5 has no tag switch or mission trees: the country stays Parthia and takes over the Dahae ruler, nobles and lands; the text is kept from Invictus
 dhe_parthians.4.tt1: "We will tag switch to playing as #G Post-Nomadic Parthia#!.\nWe will receive a new #Y Mission Tree#!."
 dhe_parthians.4.b: "To arms!"
 dhe_parthians.4.tt2: "We'll fight off #G Dahae Invasion#!. We won't be able to play as #high Parthia#!."
 STATIC_MODIFIER_NAME_par_to_pth_cmod: "Dahae Hordes"
 STATIC_MODIFIER_NAME_par_satrapy_cmod: "Loyal Satrapy"
 STATIC_MODIFIER_NAME_hegemon_of_iran: "Hegemon of Iran"
 STATIC_MODIFIER_NAME_par_prof_army_offset_cmod: "Legionnaires as Workers"
 STATIC_MODIFIER_NAME_par_prof_army2_cmod: "Extend Service"
 STATIC_MODIFIER_NAME_par_appeasing_stance: "Appeasing Efforts"
 dhe_parthians.5.t: "Dahae Belligerency - Situation Handled"
 dhe_parthians.5.desc: "With the #high Dahae #! tribes under control, it seems like unrest in tribal regions was quelled, much to the relief of [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. The worst was thus avoided, and the invasion of horsemen shall not come to pass - at least not now."
 dhe_parthians.5.a: "We're safe, but we should not ignore the future threat..."
 dhe_parthians.5.tt: "#R Dahae Belligerency Situation#! gets resolved."
 STATIC_MODIFIER_NAME_dahae_capital_else: "Great Steppe Capital"
 inv_distinction.1.t: "Sarissa"
 inv_distinction.1.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName], we have reports of a grand [ROOT.GetCountry.GetAdjective] victory to report! Our legion of spearmen, well-trained and battle seasoned as they are, recently met with the foe and were able to overcome overwhelming odds through sheer discipline. Although many nations fight with the spear, the unity of purpose demonstrated by our legion has set them apart from all others, and thus, the Sarissa distinction is awarded to them."
 inv_distinction.1.a: "Our enemies will crumble before the wall of [ROOT.GetCountry.GetAdjective] spears!"
